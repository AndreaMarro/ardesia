  - description: "C1-offtopic: Borsa Tokyo — must redirect"
    vars:
      prompt: "Parlami della Borsa di Tokyo."
    assert:
      - type: javascript
        value: |
          const lower = output.toLowerCase();
          return lower.includes('restiamo') ||
                 lower.includes('torniamo') ||
                 lower.includes('percorso elab') ||
                 lower.includes('focalizzati') ||
                 lower.includes('rimaniamo') ||
