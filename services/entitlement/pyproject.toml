[project]
name = "entitlement-service"
version = "0.1.0"
description = "ARDESIA entitlement service - GDPR-ready sandbox port of apps/studio/src/entitlements/entitlementCore.ts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entitlement_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
