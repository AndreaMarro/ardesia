[project]
name = "ardesia-study-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15,<5",
    "fastapi==0.139.0",
    "pillow>=12,<13",
    "psycopg[binary]==3.3.3",
    "pypdf>=6.21.2,<7",
    "uvicorn>=0.30,<1",
]
[dependency-groups]
dev = ["pytest>=9,<10", "httpx==0.28.1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["study_api"]
