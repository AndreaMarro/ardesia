<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="title desc">
<title id="title">Stessa forza distribuita su aree diverse</title>
<desc id="desc">L'area triplica da 4 a 12 centimetri quadrati mentre la forza rimane costante. La pressione passa da 18 a 6 chilopascal.</desc>
<rect width="800" height="320" fill="#f8f5ea"/>
<g font-family="Arial,sans-serif" fill="#221c30" text-anchor="middle">
<text x="400" y="38" font-size="23" font-weight="700">Forza uguale: superficie tripla, pressione un terzo</text>
<path d="M200 75V128m-10-14 10 14 10-14" stroke="#5936ae" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M590 75V128m-10-14 10 14 10-14" stroke="#5936ae" stroke-width="6" fill="none" stroke-linecap="round"/>
<text x="200" y="66" font-size="20">F costante</text><text x="590" y="66" font-size="20">F costante</text>
<rect x="140" y="147" width="120" height="82" fill="#e4dcfa" stroke="#221c30" stroke-width="3"/>
<rect x="410" y="147" width="360" height="82" fill="#eef3ce" stroke="#221c30" stroke-width="3"/>
<text x="200" y="188" font-size="22" font-weight="700">4 cm²</text><text x="590" y="188" font-size="22" font-weight="700">12 cm²</text>
<text x="200" y="261" font-size="23">18 kPa</text><text x="590" y="261" font-size="23">6 kPa</text>
<text x="400" y="300" font-size="20" font-weight="700">p = F / A: se A triplica, p si divide per 3</text>
</g></svg>