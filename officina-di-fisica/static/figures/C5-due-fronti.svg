<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 226" role="img" aria-labelledby="t"><title id="t">Alla seconda emissione il primo impulso ha raggiunto i due fronti a 6,80 m dalla posizione iniziale. La sorgente si è spostata di 0,34 m verso destra: le distanze da essa ai fronti sono 7,14 m a sinistra e 6,46 m a destra</title><defs><marker id="a25382f" markerWidth="7" markerHeight="7" refX="6.4" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#25382f"/></marker><marker id="a176b53" markerWidth="7" markerHeight="7" refX="6.4" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#176b53"/></marker><marker id="aac442e" markerWidth="7" markerHeight="7" refX="6.4" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#ac442e"/></marker><marker id="a7a8980" markerWidth="7" markerHeight="7" refX="6.4" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#7a8980"/></marker></defs><rect width="580" height="226" fill="#f8f6eb"/><text x="290" y="30" fill="#25382f" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Al momento della seconda emissione</text><line x1="68" y1="101" x2="505" y2="101" stroke="#7a8980" stroke-width="1.2"/><line x1="115" y1="81" x2="115" y2="119" stroke="#176b53" stroke-width="3"/><line x1="455" y1="81" x2="455" y2="119" stroke="#176b53" stroke-width="3"/><line x1="285" y1="81" x2="285" y2="129" stroke="#7a8980" stroke-width="1.3" stroke-dasharray="5 5"/><circle cx="293.5" cy="101" r="4" fill="#ac442e" stroke="#ac442e" stroke-width="2"/><text x="117" y="69" fill="#176b53" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">primo fronte</text><text x="454" y="69" fill="#176b53" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">primo fronte</text><line x1="115" y1="147" x2="293.5" y2="147" stroke="#176b53" stroke-width="1.6"/><line x1="293.5" y1="147" x2="455" y2="147" stroke="#ac442e" stroke-width="1.6"/><line x1="115" y1="139" x2="115" y2="155" stroke="#176b53" stroke-width="1.6"/><line x1="293.5" y1="133" x2="293.5" y2="155" stroke="#25382f" stroke-width="1.6"/><line x1="455" y1="139" x2="455" y2="155" stroke="#ac442e" stroke-width="1.6"/><text x="203" y="174" fill="#176b53" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">dietro · 7,14 m</text><text x="375" y="174" fill="#ac442e" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">davanti · 6,46 m</text><text x="290" y="205" fill="#25382f" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Il punto indica la nuova posizione della sorgente.</text></svg>