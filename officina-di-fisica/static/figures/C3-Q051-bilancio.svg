<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="title desc">
<title id="title">Espansione di un gas e bilancio energetico</title>
<desc id="desc">La pressione esterna è 120 chilopascal. Il gas passa da 1,5 litri a 2,0 litri, riceve 35 joule e compie 60 joule di lavoro. L'energia interna diminuisce di 25 joule.</desc>
<rect width="800" height="350" fill="#f8f5ea"/>
<g font-family="Arial,sans-serif" fill="#221c30">
<text x="36" y="39" font-size="23" font-weight="700">Primo principio: calore entrante − lavoro uscente</text>
<rect x="95" y="96" width="250" height="150" fill="#eef3ce" stroke="#221c30" stroke-width="4"/>
<rect x="95" y="96" width="170" height="150" fill="#e4dcfa"/>
<path d="M265 88V257" stroke="#221c30" stroke-width="11"/>
<path d="M270 170H360m-17-12 17 12-17 12" stroke="#95354b" stroke-width="5" fill="none"/>
<text x="105" y="145" font-size="22">Stato iniziale</text><text x="120" y="177" font-size="27" font-weight="700">1,5 L</text>
<text x="270" y="270" text-anchor="middle" font-size="19">Pistone si sposta</text>
<path d="M465 96H720V246H465Z" fill="#eef3ce" stroke="#221c30" stroke-width="4"/>
<path d="M706 88V257" stroke="#221c30" stroke-width="11"/>
<text x="480" y="145" font-size="22">Stato finale</text><text x="505" y="177" font-size="27" font-weight="700">2,0 L</text>
<text x="400" y="64" text-anchor="middle" font-size="20" font-weight="700">p = 120 kPa; ΔV = +0,5 L</text>
<text x="90" y="311" font-size="22" font-weight="700">Q = +35 J</text>
<text x="350" y="311" font-size="22" font-weight="700">W = +60 J</text>
<text x="595" y="311" font-size="22" font-weight="700" fill="#95354b">ΔU = −25 J</text>
<text x="400" y="341" text-anchor="middle" font-size="17">Convenzione: W positivo se il gas compie lavoro</text>
</g></svg>