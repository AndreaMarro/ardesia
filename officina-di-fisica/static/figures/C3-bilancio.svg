<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><title id="title">Segni del primo principio</title><desc id="desc">Un ingresso di calore positivo entra da sinistra nel sistema. Il lavoro positivo lascia il sistema verso destra.</desc><defs><marker id="a123c39" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#123c39"/></marker><marker id="aac3825" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#ac3825"/></marker><marker id="a16736b" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#16736b"/></marker><marker id="a7d8981" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#7d8981"/></marker></defs><rect x="0" y="0" width="640" height="250" rx="0" fill="#faf7ee" stroke="none" stroke-width="0"/><text x="320" y="30" font-size="19" text-anchor="middle" fill="#123c39" font-weight="700">Convenzione dei segni</text><rect x="225" y="73" width="190" height="89" rx="4" fill="#d5e7df" stroke="#123c39" stroke-width="2"/><text x="320" y="125" font-size="24" text-anchor="middle" fill="#123c39" font-weight="500">sistema · U</text><line x1="75" y1="120" x2="216" y2="120" stroke="#16736b" stroke-width="3" marker-end="url(#a16736b)"/><text x="139" y="97" font-size="19" text-anchor="middle" fill="#16736b" font-weight="500">Q entrante</text><line x1="423" y1="120" x2="566" y2="120" stroke="#ac3825" stroke-width="3" marker-end="url(#aac3825)"/><text x="500" y="97" font-size="19" text-anchor="middle" fill="#ac3825" font-weight="500">W uscente</text><text x="320" y="207" font-size="24" text-anchor="middle" fill="#123c39" font-weight="500">ΔU = Q − W</text></svg>
