<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
<title id="title">Due tratti uguali percorsi a velocità diverse</title>
<desc id="desc">Primo tratto 12 m a 2 m/s in 6 s; secondo tratto 12 m a 3 m/s in 4 s. Lo spazio totale è 24 m e il tempo totale 10 s.</desc>
<rect width="800" height="300" fill="#f8f5ea"/>
<g font-family="Arial,sans-serif" fill="#221c30">
<text x="38" y="42" font-size="22" font-weight="700">Stessa distanza ≠ stesso tempo</text>
<path d="M80 160H720" stroke="#221c30" stroke-width="4"/>
<path d="M80 147V173M400 140V180M720 147V173" stroke="#221c30" stroke-width="3"/>
<path d="M86 137H389" stroke="#5936ae" stroke-width="7" stroke-linecap="round"/>
<path d="M410 137H715" stroke="#95354b" stroke-width="7" stroke-linecap="round"/>
<g text-anchor="middle" font-size="20"><text x="80" y="199">Partenza</text><text x="400" y="199">Cambio di velocità</text><text x="720" y="199">Arrivo</text></g>
<g text-anchor="middle" font-size="24" font-weight="700"><text x="240" y="108" fill="#5936ae">12 m</text><text x="560" y="108" fill="#95354b">12 m</text></g>
<g text-anchor="middle" font-size="20"><text x="240" y="240">2 m/s → 6 s</text><text x="560" y="240">3 m/s → 4 s</text></g>
<text x="400" y="285" text-anchor="middle" font-size="22" font-weight="700">Totale: 24 m in 10 s → velocità media 2,4 m/s</text>
</g></svg>