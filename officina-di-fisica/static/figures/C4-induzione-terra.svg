<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><title id="title">Caricare un conduttore per induzione</title><desc id="desc">A sinistra la bacchetta positiva è vicina e la sfera è collegata a terra; una freccia indica elettroni diretti dalla terra alla sfera. A destra, scollegata la terra e rimossa la bacchetta, rimane una sfera con carica negativa.</desc><defs><marker id="a123c39" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#123c39"/></marker><marker id="aac3825" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#ac3825"/></marker><marker id="a16736b" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#16736b"/></marker><marker id="a7d8981" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#7d8981"/></marker></defs><rect x="0" y="0" width="640" height="250" rx="0" fill="#faf7ee" stroke="none" stroke-width="0"/><text x="165" y="30" font-size="19" text-anchor="middle" fill="#123c39" font-weight="700">Contatto a terra</text><text x="481" y="30" font-size="19" text-anchor="middle" fill="#123c39" font-weight="700">Dopo il distacco</text><rect x="38" y="76" width="33" height="77" rx="8" fill="#f2d8c7" stroke="#ac3825" stroke-width="2"/><text x="54" y="101" font-size="18" text-anchor="middle" fill="#ac3825" font-weight="500">+</text><text x="54" y="122" font-size="18" text-anchor="middle" fill="#ac3825" font-weight="500">+</text><text x="54" y="143" font-size="18" text-anchor="middle" fill="#ac3825" font-weight="500">+</text><circle cx="155" cy="115" r="42" fill="#e7eadd" st