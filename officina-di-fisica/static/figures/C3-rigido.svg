<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><title id="title">Un gas nel recipiente rigido</title><desc id="desc">Un recipiente sigillato e indeformabile è immerso in un bagno caldo. Il calore entra nel gas e le pareti restano ferme.</desc><defs><marker id="a123c39" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#123c39"/></marker><marker id="aac3825" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#ac3825"/></marker><marker id="a16736b" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#16736b"/></marker><marker id="a7d8981" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#7d8981"/></marker></defs><rect x="0" y="0" width="640" height="250" rx="0" fill="#faf7ee" stroke="none" stroke-width="0"/><text x="320" y="30" font-size="19" text-anchor="middle" fill="#123c39" font-weight="700">Un volume bloccato, due temperature</text><path d="M66 74 V193 H564 V74" fill="none" stroke="#123c39" stroke-width="3"/><rect x="69" y="100" width="492" height="90" rx="0" fill="#f2d8c7" stroke="none" stroke-width="0"/><line x1="69" y1="99" x2="561" y2="99" stroke="#ac3825" stroke-width="1.5"/><rect x="253" y="67" width="172" height="92" rx="9" fill="#d5e7df" stroke="#123c39" stroke-width="4"/><rect x="291" y="60" width="97" height="10" rx="3" fill="#e7eadd" stroke="#123c39" stroke-width="2"/><text x="339" y="113" font-size="19" text-anchor="middle" fill="#123c39" font-weight="500">gas chiuso</text><text x="339" y="139" font-size="16" text-anchor="middle" fill="#16736b" font-weight="500">V costante</text><line x1="153" y1="130" x2="243" y2="130" stroke="#ac3825" stroke-width="3" marker-end="url(#aac3825)"/><text x="171" y="119" font-size="18" text-anchor="middle" fill="#ac3825" font-weight="500">Q</text><text x="325" y="223" font-size="16" text-anchor="middle" fill="#123c39" font-weight="500">bagno più caldo del gas all’inizio</text></svg>
