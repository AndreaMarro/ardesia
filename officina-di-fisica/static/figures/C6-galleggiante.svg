<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" aria-labelledby="t d"><title id="t">Un galleggiante a sezione costante</title><desc id="d">A sinistra la configurazione di equilibrio. A destra lo stesso galleggiante dopo una piccola immersione aggiuntiva. La fascia rossa mostra il volume aggiuntivo A per x.</desc><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0V6" stroke="#ac422c" stroke-width="2"/></pattern></defs><rect width="700" height="270" fill="#f6f3e8"/><g stroke="#153a39" stroke-width="2"><path d="M36 52v165h280V52M380 52v165h280V52" fill="none"/><path d="M37 103h278v113H37zM381 103h278v113H381z" fill="#dce8e2" stroke="none"/><path d="M36 103h280M380 103h280" stroke="#37746e"/><path d="M132 51h70v110h-70zM476 70h70v110h-70z" fill="#dfcfb0"/><path d="M476 161h70v19h-70z" fill="url(#hatch)"/><path d="M418 161h184" stroke-dasharray="5 6" stroke-width="1"/><path d="M563 161h12m-6 0v19m-6 0h12" stroke="#a53824"/></g><g font-family="Georgia,serif" font-size="19" fill="#153a39"><text x="176" y="248" text-anchor="middle">Equilibrio</text><text x="520" y="248" text-anchor="middle">Piccolo spostamento verso il basso</text><text x="580" y="178" fill="#9b3625">x</text><text x="220" y="96">superficie</text></g></svg>
