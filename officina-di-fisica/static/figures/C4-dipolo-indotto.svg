<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><title id="title">Un dielettrico neutro in un campo non uniforme</title><desc id="desc">Una bacchetta positiva induce una polarizzazione nel piccolo corpo neutro. La regione negativa è sul lato vicino alla bacchetta e subisce una forza più intensa.</desc><defs><marker id="a123c39" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#123c39"/></marker><marker id="aac3825" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#ac3825"/></marker><marker id="a16736b" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#16736b"/></marker><marker id="a7d8981" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#7d8981"/></marker></defs><rect x="0" y="0" width="640" height="250" rx="0" fill="#faf7ee" stroke="none" stroke-width="0"/><text x="320" y="30" font-size="19" text-anchor="middle" fill="#123c39" font-weight="700">Un campo più intenso vicino alla bacchetta</text><rect x="95" y="76" width="45" height="91" rx="8" fill="#f2d8c7" stroke="#ac3825" stroke-width="2"/><text x="117" y="103" font-size="20" text-anchor="middle" fill="#ac3825" font-weight="500">+</text><text x="117" y="130" font-size="20" text-anchor="middle" fill="#ac3825" font-weight="500">+</text><text x="117" y="156" font-size="20" text-anchor="middle" fill="#ac3825" font-weight="500">+</text><rect x="275" y="87" width="145" height="64" rx="27" fill="#e7eadd" stroke="#123c39" stroke-width="2"/><text x="296" y="127" font-size="23" text-anchor="middle" fill="#16736b" font-weight="500">−</text><text x="399" y="126" font-size="22" text-anchor="middle" fill="#ac3825" font-weight="500">+</text><line x1="272" y1="119" x2="176" y2="119" stroke="#16736b" stroke-width="2.7" marker-end="url(#a16736b)"/><line x1="423" y1="119" x2="476" y2="119" stroke="#ac3825" stroke-width="2.7" marker-end="url(#aac3825)"/><text x="347" y="178" font-size="17" text-anchor="middle" fill="#123c39" font-weight="500">corpo neutro polarizzato</text><text x="320" y="217" font-size="15" text-anchor="middle" fill="#123c39" font-weight="500">Le frecce confrontano i contributi alla forza.</text></svg>
