<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><title id="title">Calorimetro isolato</title><desc id="desc">Dentro un involucro isolante due corpi posti a contatto scambiano energia fino all’equilibrio termico.</desc><defs><marker id="a123c39" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#123c39"/></marker><marker id="aac3825" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#ac3825"/></marker><marker id="a16736b" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#16736b"/></marker><marker id="a7d8981" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#7d8981"/></marker></defs><rect x="0" y="0" width="640" height="250" rx="0" fill="#faf7ee" stroke="none" stroke-width="0"/><text x="320" y="30" font-size="19" text-anchor="middle" fill="#123c39" font-weight="700">Il bilancio si chiude sul sistema complessivo</text><rect x="85" y="62" width="471" height="113" rx="8" fill="#faf7ee" stroke="#123c39" stroke-width="4"/><rect x="102" y="76" width="214" height="85" rx="0" fill="#f2d8c7" stroke="none" stroke-width="0"/><rect x="321" y="76" width="217" height="85" rx="0" fill="#d5e7df" stroke="none" stroke-width="0"/><text x="186" y="110" font-size="21" text-anchor="middle" fill="#ac3825" font-weight="500">corpo caldo</text><text x="441" y="110" font-size="21" text-anchor="middle" fill="#16736b" font-weight="500">corpo freddo</text><line x1="252" y1="130" x2="389" y2="130" stroke="#ac3825" stroke-width="3" marker-end="url(#aac3825)"/><text x="319" y="201" font-size="17" text-anchor="middle" fill="#123c39" font-weight="500">involucro isolante</text><text x="320" y="229" font-size="18" text-anchor="middle" fill="#123c39" font-weight="500">Qcaldo + Qfreddo = 0</text></svg>
