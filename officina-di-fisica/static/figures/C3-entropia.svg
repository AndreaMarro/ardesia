<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><title id="title">Entropia di due serbatoi</title><desc id="desc">Un serbatoio caldo cede Q, quello freddo lo riceve. I due cambiamenti di entropia hanno segni opposti.</desc><defs><marker id="a123c39" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#123c39"/></marker><marker id="aac3825" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#ac3825"/></marker><marker id="a16736b" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#16736b"/></marker><marker id="a7d8981" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#7d8981"/></marker></defs><rect x="0" y="0" width="640" height="250" rx="0" fill="#faf7ee" stroke="none" stroke-width="0"/><text x="320" y="30" font-size="19" text-anchor="middle" fill="#123c39" font-weight="700">Uno scambio, due temperature</text><rect x="58" y="72" width="182" height="88" rx="4" fill="#f2d8c7" stroke="#ac3825" stroke-width="2"/><rect x="401" y="72" width="182" height="88" rx="4" fill="#d5e7df" stroke="#16736b" stroke-width="2"/><text x="149" y="111" font-size="19" text-anchor="middle" fill="#ac3825" font-weight="500">serbatoio caldo</text><text x="149" y="141" font-size="20" text-anchor="middle" fill="#ac3825" font-weight="500">Th</text><text x="492" y="111" font-size="19" text-anchor="middle" fill="#16736b" font-weight="500">serbatoio freddo</text><text x="492" y="141" font-size="20" text-anchor="middle" fill="#16736b" font-weight="500">Tc</text><line x1="249" y1="117" x2="390" y2="117" stroke="#ac3825" stroke-width="3" marker-end="url(#aac3825)"/><text x="320" y="96" font-size="20" text-anchor="middle" fill="#ac3825" font-weight="500">Q</text><text x="149" y="202" font-size="18" text-anchor="middle" fill="#123c39" font-weight="500">ΔSh = −Q / Th</text><text x="490" y="202" font-size="18" text-anchor="middle" fill="#123c39" font-weight="500">ΔSc = +Q / Tc</text></svg>
