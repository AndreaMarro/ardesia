<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Conduzione stazionaria ed emissione termica</title><desc id="desc">Lastra fra due facce a temperature diverse; area e spessore raddoppiati con potenza invariata; emissione a trecento e quattrocentocinquanta kelvin con rapporto ottantuno sedicesimi.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7350b0"/></marker></defs><rect width="640" height="1500" fill="#faf7ee"/><text x="30" y="40" font-size="25" fill="#302a3e">1. Conduzione attraverso la lastra</text><text x="30" y="85" font-size="21" fill="#302a3e">λ = 0,040 W/(m·K); ΔT = 20 K</text><rect x="100" y="150" width="70" height="190" fill="#b94f48"/><rect x="280" y="150" width="70" height="190" fill="#d49332"/><rect x="460" y="150" width="70" height="190" fill="#68bdcf"/><path d="M175 245H450" fill="none" stroke="#7350b0" stroke-width="4" marker-end="url(#arrow)"/><text x="195" y="210" font-size="21" fill="#302a3e">12 W</text><text x="88" y="380" font-size="21" fill="#302a3e">calda</text><text x="450" y="380" font-size="21" fill="#302a3e">fredda</text><text x="250" y="415" font-size="21" fill="#302a3e">s = 5 cm</text><text x="40" y="465" font-size="21" fill="#302a3e">Area della faccia: 0,75 m²</text><text x="30" y="540" font-size="25" fill="#302a3e">2. Due raddoppi che si compensano</text><rect x="140" y="650" width="50" height="100" fill="#d49332"/><rect x="360" y="600" width="100" height="200" fill="#d49332"/><text x="140" y="790" font-size="21" fill="#302a3e">A, s</text><text x="360" y="840" font-size="21" fill="#302a3e">2A, 2s</text><path d="M95 705H220" fill="none" stroke="#7350b0" stroke-width="4" marker-end="url(#arrow)"/><path d="M310 705H435" fill="none" stroke="#7350b0" stroke-width="4" marker-end="url(#arrow)"/><text x="120" y="625" font-size="21" fill="#302a3e">9 W</text><text x="480" y="710" font-size="21" fill="#302a3e">9 W</text><text x="40" y="915" font-size="21" fill="#302a3e">La stessa λ e la stessa ΔT: A/s non cambia.</text><text x="30" y="1000" font-size="25" fill="#302a3e">3. Confrontare la sola emissione</text><text x="30" y="1040" font-size="21" fill="#302a3e">Area ed emissività restano uguali</text><path d="M140 1350V1070M140 1350H510" fill="none" stroke="#726d81" stroke-width="2"/><rect x="140" y="1110" width="60" height="45" fill="#147979"/><rect x="140" y="1230" width="303.75" height="45" fill="#7350b0"/><text x="230" y="1140" font-size="21" fill="#302a3e">300 K: rapporto 1</text><text x="150" y="1210" font-size="21" fill="#302a3e">450 K: rapporto 81/16</text><text x="110" y="1380" font-size="21" fill="#302a3e">0</text><text x="195" y="1380" font-size="21" fill="#302a3e">1</text><text x="425" y="1380" font-size="21" fill="#302a3e">5</text><text x="210" y="1430" font-size="21" fill="#302a3e">Potenza / P(300 K)</text><text x="40" y="1480" font-size="21" fill="#302a3e">(450/300)⁴ = (3/2)⁴ = 81/16</text></svg>
