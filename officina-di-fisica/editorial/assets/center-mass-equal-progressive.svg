<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1240" role="img" aria-labelledby="title desc"><title id="title">Traslare l’origine,non le masse</title><desc id="desc">Due masse uguali restano negli stessi punti fisici. Scala comune quaranta pixel per metro. Prima origine a ottanta pixel:masse a duecentoquaranta e quattrocento pixel,coordinate quattro e otto metri;centro a trecentoventi pixel,coordinata sei metri. Nuova origine a duecento pixel,tre metri a destra della precedente:coordinate uno e cinque metri,centro tre metri. Separazione sempre quattro metri.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="640" height="1240" rx="24" fill="#faf8f2"/><g font-family="system-ui,sans-serif" font-size="20" fill="#16323f">
<text x="28" y="42" font-size="24" font-weight="700">1 · Trova il centro nel vecchio riferimento</text><text x="28" y="90">Masse uguali · posizioni:40 px/m.</text><path d="M80 225H490" stroke="#81968d" stroke-width="2" marker-end="url(#arrow)"/><path d="M80 207V245M240 240V253M400 240V253" stroke="#81968d" stroke-width="2"/><circle cx="240" cy="225" r="10" fill="#81968d"/><circle cx="400" cy="225" r="10" fill="#81968d"/><circle cx="320" cy="225" r="6" fill="#14647b"/><text x="60" y="285">O:0</text><text x="220" y="285">4 m</text><text x="380" y="285">8 m</text><text x="300" y="185" fill="#14647b">X = 6 m</text><text x="28" y="345">X = (4 m + 8 m)/2 = 6 m.</text>
<text x="28" y="435" font-size="24" font-weight="700">2 · Sposta l’origine di3m verso destra</text><text x="28" y="485">Gli stessi punti fisici mantengono le stesse posizioni.</text><path d="M80 615H200" stroke="#b7c7bf" stroke-width="2" stroke-dasharray="4 4"/><path d="M200 615H490" stroke="#81968d" stroke-width="2" marker-end="url(#arrow)"/><path d="M80 597V645M200 597V645" stroke="#81968d" stroke-width="2"/><circle cx="240" cy="615" r="10" fill="#81968d"/><circle cx="400" cy="615" r="10" fill="#81968d"/><circle cx="320" cy="615" r="6" fill="#14647b"/><text x="67" y="680">O</text><text x="182" y="680">O′:0</text><text x="224" y="735">1 m</text><text x="384" y="735">5 m</text><text x="293" y="570" fill="#14647b">X′ = 3 m</text><path d="M80 540H200M80 530V550M200 530V550" stroke="#b44b2c" stroke-width="2"/><text x="105" y="525">3 m</text><text x="28" y="790">Sottrai3m a ogni coordinata,senza muovere i corpi.</text>
<text x="28" y="880" font-size="24" font-weight="700">3 · Controlla media e separazione</text><text x="28" y="940">x₁′ = 4 m − 3 m = 1 m</text><text x="28" y="990">x₂′ = 8 m − 3 m = 5 m</text><text x="28" y="1040">X′ = (1 m + 5 m)/2 = 3 m = X − 3 m</text><text x="28" y="1105">Separazione:8 m − 4 m = 5 m − 1 m = 4 m.</text><text x="28" y="1160">Il centro fisico è identico,la sua coordinata è diversa.</text><text x="28" y="1210" font-size="18">Stessa scala40px/m e stesso verso positivo in entrambi gli assi.</text>
</g></svg>
