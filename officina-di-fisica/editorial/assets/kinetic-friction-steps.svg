<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1230" role="img" aria-labelledby="title desc">
<title id="title">Attrito dinamico: regime, modulo e verso</title><desc id="desc">Un corpo scorre verso destra su una superficie fissa. Con coefficiente un mezzo e normale quattro newton, il modulo dell’attrito è due newton; la sua componente tangenziale è negativa sull’asse orientato a destra. I pannelli di velocità e forza hanno unità e scale diverse.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1230" rx="25" fill="#faf8f2"/>
<g font-family="sans-serif" font-size="20" fill="#183746">
<text x="28" y="42" font-size="24" font-weight="bold">1 · Prima riconosci lo scorrimento</text>
<rect x="205" y="130" width="100" height="65" fill="#d7e8eb" stroke="#183746" stroke-width="2"/>
<path d="M85 198H545" stroke="#82918c" stroke-width="3"/>
<path d="M255 115H335" stroke="#16728a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="350" y="119" fill="#16728a">v_rel = +1 m/s</text>
<text x="85" y="240">Superficie fissa. Dato: N = 4 N.</text>
<text x="28" y="295">Velocità: 80 px per m/s. Contatto mantenuto.</text>
<text x="28" y="345">Questo schema non è il diagramma di tutte le forze.</text>
<text x="28" y="415" font-size="24" font-weight="bold">2 · Calcola il modulo dinamico</text>
<text x="28" y="475">μ_d = 1/2: coefficiente puro.</text>
<text x="28" y="525">F = μ_d N</text>
<text x="28" y="575">F = (1/2) · 4 N = 2 N</text>
<text x="28" y="630">La normale è data: non si è assunto N = mg.</text>
<text x="28" y="700" font-size="24" font-weight="bold">3 · Assegna il verso separatamente</text>
<rect x="235" y="790" width="100" height="65" fill="#d7e8eb" stroke="#183746" stroke-width="2"/>
<path d="M85 858H545" stroke="#82918c" stroke-width="3"/>
<circle cx="285" cy="822" r="4"/>
<path d="M285 822H205" stroke="#b84e32" stroke-width="3" marker-end="url(#arrow)"/>
<text x="62" y="786" fill="#b84e32">F = 2 N</text>
<path d="M410 930H510" stroke="#183746" stroke-width="2" marker-end="url(#arrow)"/>
<text x="410" y="965">asse +x</text>
<text x="28" y="935">F_x = −2 N</text>
<text x="28" y="1015">Solo proiezione tangenziale. Forza: 40 px/N.</text>
<text x="28" y="1060">F non è necessariamente la risultante.</text>
<text x="28" y="1110">Scale di v e F diverse: non confrontare le lunghezze.</text>
<text x="28" y="1170">Senza scorrimento va riesaminato il regime statico.</text>
</g></svg>
