<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc">
<title id="title">Carica elementare, distanza e conservazione</title>
<desc id="desc">Tre pannelli distinti: tre gruppi simbolici da diecimila elettroni corrispondono a meno 4,80 femtocoulomb. Per cariche fisse la distanza passa da 4 a 12 centimetri e le forze da F a F/9, con la stessa scala entro ciascuna grandezza. Un sistema isolato ha cariche più 1,2 e meno 3,7 nanocoulomb, con totale meno 2,5 nanocoulomb. Le dimensioni dei simboli delle cariche non rappresentano dimensioni fisiche.</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L5 2.5L0 5Z" fill="#6a4a21" /></marker></defs>
<rect width="640" height="1540" fill="#fffdf7" />
<text x="40" y="55" font-family="Arial, sans-serif" fill="#272536" font-size="25" font-weight="bold">1 · Contare elettroni trasferiti</text>
<text x="40" y="108" font-family="Arial, sans-serif" fill="#272536" font-size="21">q = −4,80 fC ; e = 1,60 × 10⁻¹⁹ C</text>
<circle cx="120" cy="235" r="62" fill="#e8e7f8" stroke="#6250a0" stroke-width="2" /><circle cx="320" cy="235" r="62" fill="#e8e7f8" stroke="#6250a0" stroke-width="2" /><circle cx="520" cy="235" r="62" fill="#e8e7f8" stroke="#6250a0" stroke-width="2" />
<text x="120" y="229" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">10 000</text><text x="120" y="256" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">elettroni</text><text x="320" y="229" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">10 000</text><text x="320" y="256" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">elettroni</text><text x="520" y="229" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">10 000</text><text x="520" y="256" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">elettroni</text>
<text x="40" y="365" font-family="Arial, sans-serif" fill="#272536" font-size="21">N = |q| / e = 30 000</text><text x="40" y="405" font-family="Arial, sans-serif" fill="#272536" font-size="18">Ogni gruppo è un conteggio simbolico, non una particella.</text>
<path d="M40 460H600" stroke="#cbc6bc" />
<text x="40" y="515" font-family="Arial, sans-serif" fill="#272536" font-size="25" font-weight="bold">2 · Stesse cariche, distanze diverse</text>
<text x="40" y="557" font-family="Arial, sans-serif" fill="#272536" font-size="18">Distanze misurate fra le posizioni delle cariche.</text>
<circle cx="130" cy="665" r="4" fill="#f7e7df" stroke="#aa423e" stroke-width="2" /><circle cx="210" cy="665" r="4" fill="#f7e7df" stroke="#aa423e" stroke-width="2" /><text x="130" y="605" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">+q₁</text><text x="210" y="605" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">+q₂</text>
<path d="M130 665H40" fill="none" stroke="#6a4a21" stroke-width="3" marker-end="url(#arrow)" /><path d="M210 665H300" fill="none" stroke="#6a4a21" stroke-width="3" marker-end="url(#arrow)" />
<text x="65" y="635" font-family="Arial, sans-serif" fill="#272536" font-size="21">F</text><text x="264" y="635" font-family="Arial, sans-serif" fill="#272536" font-size="21">F</text><path d="M130 708V730H210V708" fill="none" stroke="#777" /><text x="170" y="765" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">4 cm</text>
<circle cx="130" cy="865" r="4" fill="#f7e7df" stroke="#aa423e" stroke-width="2" /><circle cx="370" cy="865" r="4" fill="#f7e7df" stroke="#aa423e" stroke-width="2" /><text x="130" y="805" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">+q₁</text><text x="370" y="805" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">+q₂</text>
<path d="M130 865H120" fill="none" stroke="#6a4a21" stroke-width="3" marker-end="url(#arrow)" /><path d="M370 865H380" fill="none" stroke="#6a4a21" stroke-width="3" marker-end="url(#arrow)" />
<text x="77" y="833" font-family="Arial, sans-serif" fill="#272536" font-size="21">F/9</text><text x="356" y="833" font-family="Arial, sans-serif" fill="#272536" font-size="21">F/9</text><path d="M130 908V930H370V908" fill="none" stroke="#777" /><text x="250" y="965" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">12 cm</text>
<text x="40" y="1015" font-family="Arial, sans-serif" fill="#272536" font-size="21">F_f / F_i = (4 / 12)² = 1/9</text>
<path d="M40 1060H600" stroke="#cbc6bc" />
<text x="40" y="1115" font-family="Arial, sans-serif" fill="#272536" font-size="25" font-weight="bold">3 · Il totale algebrico si conserva</text>
<rect x="65" y="1150" width="510" height="265" rx="14" fill="none" stroke="#888" stroke-dasharray="8 5" />
<circle cx="195" cy="1250" r="45" fill="#f7e7df" stroke="#aa423e" stroke-width="2" /><circle cx="445" cy="1250" r="45" fill="#e8e7f8" stroke="#6250a0" stroke-width="2" />
<text x="195" y="1257" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">A</text><text x="445" y="1257" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">B</text><text x="195" y="1330" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">+1,2 nC</text><text x="445" y="1330" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">−3,7 nC</text>
<text x="320" y="1390" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">Totale: −2,5 nC</text><text x="40" y="1480" font-family="Arial, sans-serif" fill="#272536" font-size="18">Nessuna carica attraversa il confine dell’intero sistema.</text>
</svg>
