<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1550" viewBox="0 0 640 1550" role="img" aria-labelledby="title desc"><title id="title">Il battente fornisce la velocità istantanea del getto</title><desc id="desc">Serbatoio grande con superficie cinque metri sopra il foro, quaranta pixel per metro. Freccia del getto cento pixel a dieci pixel per metro al secondo. Pressione uguale nei due punti. Barre di energia specifica uguali, cinquanta metri quadri al secondo quadro, duecento pixel a quattro pixel per unità. Confronto separato tra battenti cinque e venti metri a gravità dieci: velocità dieci e venti metri al secondo.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1550" rx="20" fill="#faf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Una fotografia quasi stazionaria</text><text x="28" y="90">g = 10 m/s². Pressioni uguali superficie/getto.</text><rect x="100" y="180" width="220" height="240" fill="#bad9e5"/><path d="M100 140V420H320V390M320 140V370" stroke="#597f83" stroke-width="3" fill="none"/><path d="M85 180H335" stroke="#597f83" stroke-dasharray="5 5"/><path d="M320 380H420" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M470 180V380" stroke="#b46145"/><text x="495" y="285">H = 5m</text><text x="350" y="445">v = 10m/s</text><text x="28" y="505">Quote40px/m; freccia10px/(m/s).</text><text x="28" y="550">Serbatoio grande: velocità superficiale trascurata.</text><text x="28" y="630" font-size="25">2 · Quota e contributo cinetico si equivalgono</text><rect x="230" y="700" width="200" height="38" fill="#e7c994"/><rect x="230" y="795" width="200" height="38" fill="#bad9e5"/><text x="28" y="728">gH = 50m²/s²</text><text x="28" y="823">v²/2 = 50m²/s²</text><text x="28" y="895">Energia per massa:4px/(m²/s²), barre200px.</text><text x="28" y="940">v² = 100m²/s², quindi v = 10m/s.</text><text x="28" y="1020" font-size="25">3 · A g uguale, quattro volte il battente</text><path d="M150 1140H250" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M150 1250H350" stroke="#b46145" stroke-width="3" marker-end="url(#a)"/><text x="28" y="1100">H = 5m</text><text x="310" y="1148">v = 10m/s</text><text x="28" y="1210">H = 20m</text><text x="390" y="1258">v = 20m/s</text><text x="28" y="1340">Velocità10px/(m/s):100e200px.</text><text x="28" y="1390">Il rapporto dei battenti è4, quello di v è2.</text><text x="28" y="1440">Confronto fra istanti o serbatoi distinti.</text><text x="28" y="1490">La velocità segue il battente istantaneo.</text></g></svg>
