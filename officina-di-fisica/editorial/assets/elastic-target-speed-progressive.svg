<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1390" viewBox="0 0 640 1390" role="img" aria-labelledby="title desc"><title id="title">Velocità di un bersaglio nell’urto elastico</title><desc id="desc">Prima e dopo per masse uguali, poi una prova distinta con incidente più massiccio. Tutte le velocità hanno scala sessanta pixel per metro al secondo. I corpi sono schematici.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1390" rx="20" fill="#faf8f1"/>
<g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Prima: bersaglio fermo nel laboratorio</text><text x="28" y="90">Asse +x verso destra. m = M = 2 kg.</text><rect x="130" y="220" width="60" height="60" fill="#cde4e6" stroke="#193a49"/><rect x="400" y="220" width="60" height="60" fill="#e6d8bc" stroke="#193a49"/><path d="M160 190H280" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><text x="130" y="330">u = +2 m/s</text><text x="400" y="330">V iniziale = 0</text><text x="28" y="385">p iniziale = 4 kg·m/s; K iniziale = 4 J.</text>
<text x="28" y="465" font-size="25">2 · Dopo: scambio delle velocità</text><rect x="130" y="595" width="60" height="60" fill="#cde4e6" stroke="#193a49"/><rect x="400" y="595" width="60" height="60" fill="#e6d8bc" stroke="#193a49"/><path d="M430 565H550" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><text x="130" y="705">w = 0</text><text x="400" y="705">V = +2 m/s</text><text x="28" y="755">p finale = 4 kg·m/s; K finale = 4 J.</text><text x="28" y="800">Urto elastico: i corpi non restano uniti.</text>
<text x="28" y="885" font-size="25">3 · Altra prova: incidente da 4 kg</text><text x="28" y="930">Sempre M = 2 kg, u = 2 m/s; risultati finali:</text><rect x="130" y="1060" width="60" height="60" fill="#cde4e6" stroke="#193a49"/><rect x="400" y="1060" width="60" height="60" fill="#e6d8bc" stroke="#193a49"/><path d="M160 1030H200" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M430 1030H590" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><text x="105" y="1170">w = +2/3 m/s</text><text x="395" y="1170">V = +8/3 m/s</text><text x="28" y="1225">p finale = 4·(2/3) + 2·(8/3) = 8 kg·m/s.</text><text x="28" y="1270">K finale = 8/9 + 64/9 = 8 J, come all’inizio.</text><text x="28" y="1325">Scala comune: 60 px per m/s, in tutti i pannelli.</text><text x="28" y="1365">Larghezze dei corpi schematiche, non masse in scala.</text></g></svg>
