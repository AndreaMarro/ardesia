<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1450" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc"><title id="title">Energia per ciclo e potenza media</title><desc id="desc">Ottanta joule ricevuti, venti utili e sessanta ceduti; un esempio di lavoro cumulativo con media dieci watt su due secondi; potenze di due prove dieci watt e un quarto di watt con media quarantuno ottavi. Le scale locali distinguono energia, tempo e potenza.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17394e"/></marker></defs><rect width="640" height="1450" rx="20" fill="#f5faff"/><g font-family="Arial,sans-serif" font-size="20" fill="#163047"><text x="35" y="50" font-size="26" font-weight="bold">1 · Un quarto diventa lavoro</text><text x="35" y="100">Barre da zero, scala comune 4 px/J</text><rect x="100" y="145" width="320" height="48" fill="#163047"/><text x="180" y="177" fill="white">Q_h = 80 J</text><rect x="100" y="230" width="240" height="48" fill="#39745b"/><rect x="340" y="230" width="80" height="48" fill="#196082"/><text x="155" y="262" fill="white">Q_c = 60 J</text><text x="352" y="262" fill="white">20 J</text><text x="35" y="325">W = 20 J è lavoro, non potenza.</text><text x="35" y="365">80 J = 60 J + 20 J · η = 1/4</text><path d="M35 410H605" stroke="#b5cbd9"/><text x="35" y="465" font-size="26" font-weight="bold">2 · La stessa energia in due secondi</text><text x="35" y="510">Esempio illustrativo di lavoro cumulativo</text><path d="M110 850V555" stroke="#17394e" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M110 850H410" stroke="#17394e" stroke-width="2" marker-end="url(#a)"/><path d="M110 850L270 610" stroke="#196082" stroke-width="4"/><path d="M110 610H270V850" stroke="#7694a6" stroke-dasharray="5 5" fill="none"/><circle cx="270" cy="610" r="5" fill="#196082"/><text x="45" y="615">20 J</text><text x="90" y="880">0</text><text x="250" y="880">2 s</text><text x="425" y="855">t</text><text x="135" y="570">L_cum</text><text x="300" y="640">P_media</text><text x="300" y="675">= 20 J / 2 s</text><text x="300" y="710">= 10 W</text><text x="35" y="925">Assi: 80 px/s e 12 px/J.</text><text x="35" y="965">La media non impone una potenza costante.</text><path d="M35 1000H605" stroke="#b5cbd9"/><text x="35" y="1055" font-size="26" font-weight="bold">3 · Due prove, pesi statistici uguali</text><text x="35" y="1100">Scala: 20 px/W, tutte le barre da zero</text><text x="50" y="1170">A</text><rect x="140" y="1145" width="200" height="35" fill="#196082"/><text x="355" y="1170">10 W</text><text x="50" y="1240">B</text><rect x="140" y="1215" width="5" height="35" fill="#196082"/><text x="160" y="1240">1/4 W</text><text x="35" y="1310">Media</text><rect x="140" y="1285" width="102.5" height="35" fill="#39745b"/><text x="260" y="1310">41/8 W</text><text x="35" y="1380">Cicli concatenati: pesi 2 s e 1 s, non uguali.</text><text x="35" y="1420">La loro potenza media è invece 27/4 W.</text></g></svg>
