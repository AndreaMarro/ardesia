<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc"><title id="title">Confronto gravitazionale a massa di prova uguale</title><desc id="desc">Corpi puntiformi con simboli schematici, non in scala delle masse. Distanze tra i centri alla scala cento pixel per metro; r zero uguale un metro. Prima configurazione massa attrattiva M zero e distanza un metro: forza F zero. Seconda configurazione massa doppia e distanza due metri: forza metà F zero. Terza configurazione massa doppia e distanza quattro metri: forza un ottavo F zero. Proiezioni separate delle forze verso il centro, stessa scala centosessanta pixel per F zero: frecce di centosessanta, ottanta e venti pixel.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="640" height="1450" rx="24" fill="#faf8f2"/><g fill="#16323f" font-family="system-ui,sans-serif" font-size="20">
<text x="28" y="42" font-size="24" font-weight="700">1 · Fissa il riferimento</text><text x="28" y="90">Punti materiali. Distanze: 100 px/m; r₀ = 1 m.</text><path d="M80 210H180" stroke="#b7c7bf" stroke-width="2"/><circle cx="80" cy="210" r="10" fill="#81968d"/><circle cx="180" cy="210" r="6" fill="#14647b"/><text x="50" y="170">M₀</text><text x="170" y="170">m</text><path d="M80 250H180M80 240V260M180 240V260" stroke="#81968d" stroke-width="2"/><text x="100" y="290">r₀</text><text x="28" y="345">Forza, proiezione separata: 160 px per F₀.</text><path d="M400 400H240" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="408">F = F₀</text><text x="28" y="450">R = F/F₀ = 1.</text>
<text x="28" y="535" font-size="24" font-weight="700">2 · Massa doppia e distanza doppia</text><text x="28" y="580">α = 2, β = 2. La massa di prova m non cambia.</text><path d="M80 660H280" stroke="#b7c7bf" stroke-width="2"/><circle cx="80" cy="660" r="10" fill="#81968d"/><circle cx="280" cy="660" r="6" fill="#14647b"/><text x="43" y="620">2M₀</text><text x="270" y="620">m</text><path d="M80 700H280M80 690V710M280 690V710" stroke="#81968d" stroke-width="2"/><text x="150" y="740">2r₀</text><text x="28" y="795">Forza, stessa scala 160 px per F₀.</text><path d="M400 850H320" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="858">F = F₀/2</text><text x="28" y="900">R = 2/2² = 1/2.</text>
<text x="28" y="985" font-size="24" font-weight="700">3 · Allontana ancora, con la stessa massa</text><text x="28" y="1030">α = 2, β = 4. Stessa scala delle distanze.</text><path d="M80 1110H480" stroke="#b7c7bf" stroke-width="2"/><circle cx="80" cy="1110" r="10" fill="#81968d"/><circle cx="480" cy="1110" r="6" fill="#14647b"/><text x="43" y="1070">2M₀</text><text x="470" y="1070">m</text><path d="M80 1150H480M80 1140V1160M480 1140V1160" stroke="#81968d" stroke-width="2"/><text x="250" y="1190">4r₀</text><text x="28" y="1245">Forza, stessa scala 160 px per F₀.</text><path d="M400 1300H380" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="1308">F = F₀/8</text><text x="28" y="1360">R = 2/4² = 1/8. Rispetto al pannello 2: 1/4.</text><text x="28" y="1410" font-size="18">Simboli delle masse schematici. Forze e distanze: scale distinte.</text>
</g></svg>
