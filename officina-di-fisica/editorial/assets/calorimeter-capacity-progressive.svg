<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1450" viewBox="0 0 560 1450" role="img" aria-labelledby="title desc">
<title id="title">Il recipiente è il terzo contributo</title><desc id="desc">Nella provaA il caldo cede 80 J e freddo e recipiente assorbono 40 J ciascuno, equilibrio 40 Celsius. Raddoppiando le sole masse si arriva 44 Celsius con lo stesso recipiente.</desc>
<rect width="560" height="1450" fill="#fffaf1"/>
<g font-family="Arial,sans-serif" fill="#352d42" font-size="19">
<text x="25" y="40" font-size="25" font-weight="bold">1 · Tre capacità, un equilibrio</text>
<text x="25" y="80">ProvaA · schema senza scala metrica</text>
<rect x="35" y="120" width="215" height="145" rx="10" fill="#f4ddd6" stroke="#b94f48" stroke-width="2"/>
<text x="55" y="155">Caldo:m_h=2 g</text><text x="55" y="195">Capacità 2 J/K</text><text x="55" y="235">80→40 °C</text>
<rect x="310" y="120" width="215" height="145" rx="10" fill="#e1eeeb" stroke="#147979" stroke-width="2"/>
<text x="330" y="155">Freddo:m_c=2 g</text><text x="330" y="195">Capacità 2 J/K</text><text x="330" y="235">20→40 °C</text>
<rect x="90" y="300" width="380" height="90" rx="10" fill="#e9e2f2" stroke="#7350b0" stroke-width="2"/>
<text x="115" y="335">Recipiente:C_r=2 J/K</text><text x="115" y="370">Anche questo sale da 20 a 40 °C.</text>
<line x1="25" y1="430" x2="535" y2="430" stroke="#b8ada0"/>
<text x="25" y="475" font-size="25" font-weight="bold">2 · Dove vanno gli 80 J ceduti?</text>
<text x="25" y="515">Scala energetica comune 5 px/J</text>
<line x1="100" y1="545" x2="100" y2="775" stroke="#352d42" stroke-width="2"/>
<text x="25" y="590">Cede</text><rect x="100" y="565" width="400" height="45" fill="#b94f48"/><text x="115" y="595" fill="white">Caldo:2 J/K × 40 K =80 J</text>
<text x="25" y="690">Entrano</text><rect x="100" y="665" width="200" height="45" fill="#147979"/><rect x="300" y="665" width="200" height="45" fill="#7350b0"/>
<text x="114" y="695" fill="white">Freddo 40 J</text><text x="315" y="695" fill="white">Recipiente 40 J</text>
<text x="96" y="765">0</text><text x="280" y="765">40</text><text x="475" y="765">80 J</text>
<text x="25" y="825">40 J +40 J =80 J · nessuna energia esterna</text>
<line x1="25" y1="865" x2="535" y2="865" stroke="#b8ada0"/>
<text x="25" y="910" font-size="25" font-weight="bold">3 · Il recipiente resta uguale</text>
<text x="25" y="950">Celsius:6 px/grado · C_r sempre 2 J/K</text>
<line x1="140" y1="990" x2="140" y2="1275" stroke="#352d42" stroke-width="2"/>
<text x="25" y="1035">A:2 g+2 g</text><rect x="140" y="1010" width="240" height="40" fill="#147979"/><text x="395" y="1037">40 °C</text>
<text x="25" y="1115">B:4 g+4 g</text><rect x="140" y="1090" width="264" height="40" fill="#d49332"/><text x="419" y="1117">44 °C</text>
<text x="25" y="1195">Media</text><rect x="140" y="1170" width="252" height="40" fill="#7350b0"/><text x="407" y="1197">42 °C</text>
<text x="136" y="1255">0</text><text x="25" y="1320">I due campioni cambiano, il contenitore no.</text>
<text x="25" y="1360">Media delle uscite:(40+44)/2=42 °C.</text>
<text x="25" y="1400">Le barre usano lo zero Celsius scelto.</text>
</g></svg>
