<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1430" viewBox="0 0 560 1430" role="img" aria-labelledby="title desc">
<title id="title">Equilibrio di due capacità termiche</title><desc id="desc">Prima due capacità uguali con lettura finale 50 Celsius, poi capacità 2 e 3 J/K con equilibrio 44 Celsius e trasferimento 72 J, infine media delle letture 50 e 44.</desc>
<rect width="560" height="1430" fill="#fffaf1"/>
<g font-family="Arial,sans-serif" fill="#352d42" font-size="19">
<text x="25" y="40" font-size="25" font-weight="bold">1 · Capacità uguali, intervalli uguali</text>
<text x="25" y="80">Schema dei due corpi · nessuna scala metrica</text>
<rect x="35" y="120" width="215" height="140" rx="10" fill="#f4ddd6" stroke="#b94f48" stroke-width="2"/>
<rect x="310" y="120" width="215" height="140" rx="10" fill="#e1eeeb" stroke="#147979" stroke-width="2"/>
<text x="55" y="155">C₁=1 J/K</text><text x="55" y="195">80→50 °C</text><text x="55" y="235">Cede 30 J</text>
<text x="330" y="155">C₂=1 J/K</text><text x="330" y="195">20→50 °C</text><text x="330" y="235">Riceve 30 J</text>
<path d="M255 185H300" stroke="#7350b0" stroke-width="4"/><path d="M290 177L300 185L290 193" fill="none" stroke="#7350b0" stroke-width="3"/>
<text x="25" y="310">Caldo:−30 K · freddo:+30 K</text>
<text x="25" y="350">La somma dei calori è−30+30=0 J.</text>
<line x1="25" y1="390" x2="535" y2="390" stroke="#b8ada0"/>
<text x="25" y="435" font-size="25" font-weight="bold">2 · Capacità diverse, stesso calore</text>
<text x="25" y="475">B: C₁=2 J/K · C₂=3 J/K · finale 44 °C</text>
<text x="25" y="515">Calori ceduti e ricevuti, in J</text>
<line x1="100" y1="545" x2="100" y2="735" stroke="#352d42" stroke-width="2"/>
<text x="25" y="585">Caldo</text><rect x="100" y="560" width="360" height="45" fill="#b94f48"/><text x="115" y="590" fill="white">2 J/K × 36 K =72 J ceduti</text>
<text x="25" y="680">Freddo</text><rect x="100" y="655" width="360" height="45" fill="#147979"/><text x="115" y="685" fill="white">3 J/K × 24 K =72 J ricevuti</text>
<text x="96" y="750">0</text><text x="443" y="750">72 J</text>
<text x="25" y="800">Intervalli diversi, energie uguali in modulo.</text>
<text x="25" y="840">Q₁=−72 J · Q₂=+72 J · somma 0</text>
<line x1="25" y1="880" x2="535" y2="880" stroke="#b8ada0"/>
<text x="25" y="925" font-size="25" font-weight="bold">3 · Due equilibri e la loro media</text>
<text x="25" y="965">Letture finali sulla scala Celsius</text>
<line x1="140" y1="1000" x2="140" y2="1290" stroke="#352d42" stroke-width="2"/>
<text x="25" y="1040">A</text><rect x="140" y="1015" width="300" height="40" fill="#147979"/><text x="455" y="1042">50 °C</text>
<text x="25" y="1120">B</text><rect x="140" y="1095" width="264" height="40" fill="#d49332"/><text x="419" y="1122">44 °C</text>
<text x="25" y="1200">Media</text><rect x="140" y="1175" width="282" height="40" fill="#7350b0"/><text x="437" y="1202">47 °C</text>
<text x="116" y="1270">0</text><text x="25" y="1330">(50+44)/2=47, con uguale peso statistico.</text>
<text x="25" y="1370">Le barre usano lo zero Celsius scelto,</text><text x="25" y="1405">non rappresentano temperature assolute.</text>
</g></svg>
