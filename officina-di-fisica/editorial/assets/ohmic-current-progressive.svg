<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc">
<title id="title">Corrente, caduta e resistenza</title><desc id="desc">Generatore ideale da dodici volt e resistore da tre ohm: corrente quattro ampere. Grafico della corrente in funzione della tensione a resistenza fissa tre ohm. Barre finali quattro, tre e media sette mezzi ampere.</desc><defs><marker id="I" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#165a87"/></marker></defs>
<rect width="640" height="1450" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="20" fill="#14243a">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Un generatore, un carico</text><text x="32" y="83" font-size="18">Resistore ohmico a temperatura mantenuta fissa.</text>
<path d="M100 210V140H480V205M480 305V400H100V250" fill="none" stroke="#8292a2" stroke-width="3"/><path d="M75 210H125M85 250H115" stroke="#14243a" stroke-width="4"/><text x="40" y="216">+</text><text x="40" y="257">−</text><rect x="455" y="205" width="50" height="100" fill="#fce6dc" stroke="#b45328" stroke-width="3"/>
<path d="M200 140H370" stroke="#165a87" stroke-width="5" marker-end="url(#I)"/><text x="220" y="121" fill="#165a87">I = 4 A</text><text x="150" y="240">V = 12 V</text><text x="330" y="270">R = 3 Ω</text><text x="32" y="445" font-size="18">I entra nel resistore dal morsetto a potenziale maggiore.</text>
<path d="M32 478H608" stroke="#9babbc"/>
<text x="32" y="523" font-size="25" font-weight="bold">2 · I(V) a R = 3 Ω</text><text x="32" y="563" font-size="18">I in A ; V in volt ; pendenza I/V = 1/R.</text>
<path d="M130 850V590M130 850H550" fill="none" stroke="#14243a" stroke-width="2"/><path d="M130 850L490 610" stroke="#165a87" stroke-width="4"/><path d="M130 790H220V850M130 610H490V850" fill="none" stroke="#8292a2" stroke-dasharray="5 5"/>
<circle cx="220" cy="790" r="5" fill="#165a87"/><circle cx="490" cy="610" r="5" fill="#165a87"/><text x="92" y="617">4</text><text x="92" y="797">1</text><text x="92" y="857">0</text><text x="118" y="886">0</text><text x="211" y="886">3</text><text x="476" y="886">12</text><text x="470" y="925">V in volt</text>
<path d="M32 957H608" stroke="#9babbc"/>
<text x="32" y="1002" font-size="25" font-weight="bold">3 · Due prove, una media</text><path d="M130 1032V1298" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="1058" width="320" height="38" fill="#165a87"/><rect x="130" y="1138" width="240" height="38" fill="#165a87"/><rect x="130" y="1218" width="280" height="38" fill="#28664d"/><text x="50" y="1086">A</text><text x="470" y="1086">4 A</text><text x="50" y="1166">B</text><text x="390" y="1166">3 A</text><text x="32" y="1246">Media</text><text x="430" y="1246">7/2 A</text><text x="104" y="1292">0</text>
<text x="32" y="1339" font-size="18">A: 12 V, 3 Ω ; B: 15 V, 5 Ω.</text><text x="32" y="1375" font-size="18">B ha R diversa dalla retta centrale.</text><text x="32" y="1411" font-size="18">Barre in A, stessa origine e stessa scala.</text>
</g></svg>
