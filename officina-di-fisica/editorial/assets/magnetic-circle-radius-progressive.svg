<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Il raggio magnetico e il campo</title><desc id="desc">Tre tappe: esempio di traiettoria circolare con velocità tangente e raggio radiale; raggi due e un metro con campi uno e due tesla a rapidità uguale; tre punti esatti della relazione inversa fra raggio e campo.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24">Il raggio magnetico e il campo</text><text x="32" y="92" font-size="22">1 · Esempio illustrato con q positiva</text><text x="32" y="132" font-size="19">m = 1 mg · |q| = 1 μC</text><circle cx="300" cy="280" r="80" fill="none" stroke="#316b9b" stroke-width="2"/><line x1="300" y1="280" x2="380" y2="280" stroke="#52667a" stroke-width="2"/><circle cx="300" cy="280" r="3" fill="#52667a"/><text x="400" y="286" font-size="19">r = 2 m</text><circle cx="300" cy="360" r="8" fill="#316b9b"/><text x="300" y="365" text-anchor="middle" font-size="14" fill="white">+</text><line x1="310" y1="360" x2="450" y2="360" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="460" y="366" font-size="19">v = 2 m/s</text><circle cx="100" cy="250" r="18" fill="none" stroke="#52667a" stroke-width="2"/><path d="M88 238L112 262M88 262L112 238" fill="none" stroke="#52667a" stroke-width="2"/><text x="45" y="300" font-size="18">B = 1 T</text><text x="45" y="330" font-size="18">entrante</text><text x="32" y="440" font-size="18">v è tangente; il raggio parte dal centro.</text><text x="32" y="475" font-size="18">Invertire q inverte la curvatura, non il raggio.</text><text x="32" y="550" font-size="22">2 · Stessa rapidità: v = 2 m/s</text><text x="180" y="600" text-anchor="middle" font-size="19">B = 1 T</text><text x="440" y="600" text-anchor="middle" font-size="19">B = 2 T</text><circle cx="180" cy="710" r="80" fill="none" stroke="#316b9b" stroke-width="2"/><circle cx="440" cy="710" r="40" fill="none" stroke="#a76d20" stroke-width="2"/><line x1="180" y1="710" x2="260" y2="710" stroke="#316b9b" stroke-width="2"/><line x1="440" y1="710" x2="480" y2="710" stroke="#a76d20" stroke-width="2"/><text x="180" y="840" text-anchor="middle" font-size="19">r = 2 m</text><text x="440" y="840" text-anchor="middle" font-size="19">r = 1 m</text><text x="32" y="895" font-size="18">I due raggi hanno una scala comune.</text><text x="32" y="960" font-size="22">3 · Tre punti a v = 2 m/s</text><line x1="145" y1="1280" x2="520" y2="1280" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1285" x2="150" y2="1030" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><circle cx="230" cy="1120" r="5" fill="#316b9b"/><circle cx="310" cy="1200" r="5" fill="#316b9b"/><circle cx="470" cy="1240" r="5" fill="#316b9b"/><text x="128" y="1305" text-anchor="end" font-size="18">0</text><text x="230" y="1310" text-anchor="middle" font-size="18">1</text><text x="310" y="1310" text-anchor="middle" font-size="18">2</text><text x="470" y="1310" text-anchor="middle" font-size="18">4</text><text x="128" y="1126" text-anchor="end" font-size="18">2</text><text x="128" y="1206" text-anchor="end" font-size="18">1</text><text x="128" y="1246" text-anchor="end" font-size="18">1/2</text><text x="535" y="1290" font-size="18">B (T)</text><text x="95" y="1015" font-size="18">r (m)</text><text x="32" y="1380" font-size="18">Punti distinti, senza interpolazione lineare.</text><text x="32" y="1420" font-size="18">L’origine è degli assi: B = 0 non è ammesso.</text></g></svg>
