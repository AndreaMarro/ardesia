<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1580" viewBox="0 0 640 1580" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif" font-size="21" fill="#272536">
<title id="title">Tre costruzioni per l’immagine della lente</title><desc id="desc">Tre problemi distinti. Una lente convergente di focale otto centimetri forma a sedici centimetri l’immagine capovolta di un oggetto a sedici centimetri. Da un singolo punto fuori asse nel piano focale anteriore emergono raggi paralleli fra loro ma inclinati. Confronto separato di altezze orientate più dodici e meno trenta millimetri, con ingrandimento meno cinque mezzi.</desc>
<defs><marker id="g" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#147c76"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#94631e"/></marker></defs><rect width="640" height="1580" fill="#fffdf7"/>
<text x="40" y="55" font-size="25" font-weight="bold">1 · Oggetto e immagine a due focali</text><text x="40" y="105">f = 8 cm ; p = q = 16 cm</text><path d="M60 300H590" stroke="#999"/><path d="M320 145V420" stroke="#888" stroke-width="4"/>
<path d="M160 200H320L480 400" fill="none" stroke="#147c76" stroke-width="2"/><path d="M160 200L480 400" fill="none" stroke="#6852a3" stroke-width="2"/><path d="M160 300V200" stroke="#94631e" stroke-width="3" marker-end="url(#o)"/><path d="M480 300V400" stroke="#94631e" stroke-width="3" marker-end="url(#o)"/>
<path d="M240 292V308M400 292V308" stroke="#888"/><text x="240" y="345" text-anchor="middle">F</text><text x="400" y="385" text-anchor="middle">F′</text><text x="130" y="345">2F</text><text x="515" y="345">2F′</text><text x="320" y="130" text-anchor="middle">Lente</text>
<path d="M160 445V460H320V445M320 460H480V445" fill="none" stroke="#888"/><text x="240" y="495" text-anchor="middle">p = 16 cm</text><text x="400" y="495" text-anchor="middle">q = 16 cm</text><path d="M40 525H600" stroke="#cbc6bc"/>
<text x="40" y="580" font-size="25" font-weight="bold">2 · Un punto del piano focale</text><text x="40" y="630" font-size="18">Il fascio emerge parallelo a sé, non sempre all’asse.</text>
<path d="M100 815H590" stroke="#999"/><path d="M240 690V920" stroke="#aaa" stroke-dasharray="5 4"/><path d="M320 690V1000" stroke="#888" stroke-width="4"/>
<path d="M240 760H320L560 925" fill="none" stroke="#147c76" stroke-width="2" marker-end="url(#g)"/><path d="M240 760L560 980" fill="none" stroke="#6852a3" stroke-width="2" marker-end="url(#g)"/><circle cx="240" cy="760" r="4" fill="#94631e"/>
<text x="195" y="735">P</text><text x="210" y="865">F</text><text x="130" y="970">p = f</text><text x="390" y="720">Raggi paralleli</text><path d="M40 1040H600" stroke="#cbc6bc"/>
<text x="40" y="1095" font-size="25" font-weight="bold">3 · Altezze orientate, stessa scala</text><text x="40" y="1145" font-size="18">Confronto di altezze, senza tracciamento dei raggi.</text>
<path d="M100 1280H550" stroke="#999"/><path d="M180 1280V1220" stroke="#94631e" stroke-width="3" marker-end="url(#o)"/><path d="M450 1280V1430" stroke="#94631e" stroke-width="3" marker-end="url(#o)"/>
<text x="180" y="1190" text-anchor="middle">h = +12 mm</text><text x="450" y="1480" text-anchor="middle">h′ = −30 mm</text><text x="80" y="1300">0</text><text x="320" y="1540" text-anchor="middle">m = h′/h = −5/2</text>
</svg>
