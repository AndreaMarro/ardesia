<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1370" role="img" aria-labelledby="title desc">
<title id="title">Il calore si conserva, l’entropia totale aumenta</title>
<desc id="desc">Seicento joule passano spontaneamente da una sorgente a quattrocento kelvin a una a duecento kelvin. La calda perde tre mezzi di joule per kelvin; la fredda ne acquista tre. Il totale cresce di tre mezzi. Un confronto separato fra due coppie di temperature dà variazioni totali tre mezzi e uno, con media cinque quarti.</desc>
<defs><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1370" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Stesso calore, temperature diverse</text>
<text x="32" y="83" font-size="18">Trasferimento spontaneo e irreversibile.</text>
<rect x="45" y="130" width="210" height="150" rx="10" fill="#fce6dc" stroke="#b45328"/>
<rect x="385" y="130" width="210" height="150" rx="10" fill="#e4f3fa" stroke="#165a87"/>
<text x="77" y="174">Sorgente calda</text><text x="88" y="217">T_h = 400 K</text><text x="80" y="257">Cede 600 J</text>
<text x="413" y="174">Sorgente fredda</text><text x="426" y="217">T_c = 200 K</text><text x="414" y="257">Riceve 600 J</text>
<path d="M272 210H367" stroke="#b45328" stroke-width="4" marker-end="url(#heat)"/>
<text x="279" y="180" font-size="18">600 J</text>
<text x="32" y="323" font-size="18">Schema del trasferimento, senza scala metrica.</text>
<text x="32" y="355" font-size="18">Bilancio energetico: −600 J + 600 J = 0.</text>
<path d="M32 387H608" stroke="#9babbc"/>
<text x="32" y="432" font-size="25" font-weight="bold">2 · Il bilancio di entropia è positivo</text>
<text x="32" y="471" font-size="18">Variazioni in J/K, dal medesimo zero con segno.</text>
<path d="M320 515V811" stroke="#14243a" stroke-width="2"/>
<rect x="200" y="547" width="120" height="40" fill="#b45328"/>
<rect x="320" y="631" width="240" height="40" fill="#165a87"/>
<rect x="320" y="715" width="120" height="40" fill="#28664d"/>
<text x="40" y="575">Calda</text><text x="210" y="574" font-size="18" fill="white">−3/2 J/K</text>
<text x="40" y="659">Fredda</text><text x="400" y="658" fill="white">+3 J/K</text>
<text x="40" y="743">Totale</text><text x="330" y="742" font-size="18" fill="white">+3/2 J/K</text>
<text x="314" y="844">0</text>
<text x="32" y="884" font-size="18">Il freddo acquista più entropia del modulo perso</text>
<text x="32" y="914" font-size="18">dal caldo; l’energia trasferita non viene creata.</text>
<path d="M32 947H608" stroke="#9babbc"/>
<text x="32" y="992" font-size="25" font-weight="bold">3 · Media dei totali di due prove</text>
<text x="32" y="1031" font-size="18">A: 200 e 400 K; B: 300 e 600 K (fredda, calda).</text>
<path d="M130 1058V1292" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="1078" width="240" height="34" fill="#165a87"/>
<rect x="130" y="1145" width="160" height="34" fill="#b45328"/>
<rect x="130" y="1212" width="200" height="34" fill="#28664d"/>
<text x="50" y="1104">A</text><text x="389" y="1104">3/2 J/K</text>
<text x="50" y="1171">B</text><text x="309" y="1171">1 J/K</text>
<text x="32" y="1238">Media</text><text x="349" y="1238">5/4 J/K</text>
<text x="105" y="1286">0</text>
<text x="32" y="1332" font-size="18">Media delle uscite: (3/2 + 1)/2 = 5/4 J/K.</text>
</g></svg>
