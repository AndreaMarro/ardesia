<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc"><title id="title">Polarizzazione ed energia immagazzinata</title><desc id="desc">Dipoli legati illustrativi nel dielettrico, orientati con il campo. Nel grafico di carica del condensatore lineare la tensione passa da zero a due volt e la carica da zero a quattro microcoulomb: area triangolare quattro microjoule. Barre delle energie quattro, diciotto e undici microjoule.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185d83"/></marker></defs><rect width="640" height="1500" rx="16" fill="#f7f9fc"/>
<text x="32" y="44" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">1 · Cariche legate nel dielettrico</text>
<text x="32" y="86" font-family="Arial,sans-serif" font-size="21" fill="#182c46">E esterno verso destra ; dipoli schematici.</text>
