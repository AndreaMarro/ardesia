<text x="279" y="302" font-family="Arial,sans-serif" font-size="20" fill="#ffffff">−</text>
<text x="329" y="302" font-family="Arial,sans-serif" font-size="20" fill="#ffffff">+</text>
<path d="M299 295H321" fill="none" stroke="#8197aa" stroke-width="2"/>
<circle cx="400" cy="225" r="13" fill="#185d83"/>
