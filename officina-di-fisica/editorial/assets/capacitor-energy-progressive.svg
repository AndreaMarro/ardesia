<text x="214" y="302" font-family="Arial,sans-serif" font-size="20" fill="#ffffff">+</text>
<path d="M184 295H206" fill="none" stroke="#8197aa" stroke-width="2"/>
<circle cx="285" cy="225" r="13" fill="#185d83"/>
