<text x="329" y="232" font-family="Arial,sans-serif" font-size="20" fill="#ffffff">+</text>
<path d="M299 225H321" fill="none" stroke="#8197aa" stroke-width="2"/>
<circle cx="285" cy="295" r="13" fill="#185d83"/>
