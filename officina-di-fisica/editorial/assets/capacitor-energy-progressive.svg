<circle cx="400" cy="295" r="13" fill="#185d83"/>
<circle cx="450" cy="295" r="13" fill="#b85322"/>
<text x="394" y="302" font-family="Arial,sans-serif" font-size="20" fill="#ffffff">−</text>
<text x="444" y="302" font-family="Arial,sans-serif" font-size="20" fill="#ffffff">+</text>
<path d="M414 295H436" fill="none" stroke="#8197aa" stroke-width="2"/>
<text x="32" y="392" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Spostamenti locali o orientazione di dipoli.</text>
<text x="32" y="432" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Non si crea carica netta nel campione neutro.</text>
<path d="M32 478H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="526" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">2 · Il lavoro sotto V(Q)</text>
<text x="32" y="568" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C = 2 μF ; stato finale Q = 4 μC, V = 2 V.</text>
<text x="32" y="617" font-family="Arial,sans-serif" font-size="21" fill="#182c46">V / V</text>
<path d="M150 630V860H550" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M150 860L470 660L470 860Z" fill="#d1e3ee"/>
<path d="M150 860L470 660" fill="none" stroke="#185d83" stroke-width="4"/>
<path d="M470 860V660H150" fill="none" stroke="#aabaca" stroke-width="2"/>
<circle cx="470" cy="660" r="5" fill="#185d83"/>
<text x="118" y="668" font-family="Arial,sans-serif" font-size="21" fill="#182c46">2</text>
<text x="118" y="890" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="464" y="890" font-family="Arial,sans-serif" font-size="21" fill="#182c46">4</text>
<text x="527" y="902" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Q / μC</text>
<text x="325" y="815" font-family="Arial,sans-serif" font-size="21" fill="#182c46">U = 4 μJ</text>
<text x="32" y="949" font-family="Arial,sans-serif" font-size="21" fill="#182c46">L’area triangolare vale QV/2.</text>
<text x="32" y="989" font-family="Arial,sans-serif" font-size="21" fill="#182c46">È energia immagazzinata, non potenza.</text>
<path d="M32 1030H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="1077" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">3 · Energie di preparazioni distinte</text>
<text x="32" y="1118" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A: 2 μF, 2 V ; B: 4 μF, 3 V.</text>
<path d="M150 1150V1390" fill="none" stroke="#182c46" stroke-width="2"/>
<rect x="150" y="1165" width="80" height="42" fill="#185d83"/>
<text x="32" y="1195" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="248" y="1195" font-family="Arial,sans-serif" font-size="21" fill="#182c46">4 μJ</text>
<rect x="150" y="1245" width="360" height="42" fill="#b85322"/>
<text x="32" y="1275" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="528" y="1275" font-family="Arial,sans-serif" font-size="21" fill="#182c46">18 μJ</text>
<rect x="150" y="1325" width="220" height="42" fill="#35654e"/>
<text x="32" y="1355" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Media</text>
<text x="388" y="1355" font-family="Arial,sans-serif" font-size="21" fill="#182c46">11 μJ</text>
<text x="118" y="1416" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="32" y="1460" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Origine e scala comuni entro il pannello.</text>
</svg>
