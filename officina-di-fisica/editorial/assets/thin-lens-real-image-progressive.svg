<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1740" viewBox="0 0 640 1740" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Immagine reale e distanza coniugata</title><desc id="desc">Due raggi della lente sottile individuano l’immagine capovolta; altezze amplificate rispetto alle distanze orizzontali. Barre di distanze e curva per focale uno completano i tre pannelli.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#306f8c"/></marker></defs><rect x="0" y="0" width="640" height="1740" fill="white"/><text x="35" y="48" font-size="25" fill="#203247" text-anchor="start">Una lente, due raggi e uno schermo</text><text x="35" y="105" font-size="22" fill="#203247" text-anchor="start">1 · f = 1 cm, p = 4 cm</text><line x1="40" y1="320" x2="580" y2="320" stroke="#526474" stroke-width="2"/><line x1="360" y1="180" x2="360" y2="425" stroke="#87949c" stroke-width="2"/><path d="M60 320L60 248" fill="none" stroke="#306f8c" stroke-width="2"/><polygon points="60,248 57,254 63,254" fill="#306f8c"/><path d="M460 320L460 344" fill="none" stroke="#306f8c" stroke-width="2"/><polygon points="460,344 457,338 463,338" fill="#306f8c"/><path d="M60 248L360 248" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M360 248L550 430.4" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M60 248L550 365.6" fill="none" stroke="#8b5d35" stroke-width="2" marker-end="url(#arr)"/><circle cx="285" cy="320" r="3" fill="#266b89"/><text x="285" y="370" font-size="18" fill="#203247" text-anchor="middle">F</text><circle cx="360" cy="320" r="3" fill="#266b89"/><text x="360" y="370" font-size="18" fill="#203247" text-anchor="middle">O</text><circle cx="435" cy="320" r="3" fill="#266b89"/><text x="435" y="370" font-size="18" fill="#203247" text-anchor="middle">F′</text><text x="45" y="215" font-size="18" fill="#203247" text-anchor="start">oggetto</text><text x="455" y="455" font-size="18" fill="#203247" text-anchor="start">immagine</text><line x1="60" y1="460" x2="360" y2="460" stroke="#526474" stroke-width="2"/><text x="210" y="495" font-size="18" fill="#203247" text-anchor="middle">p = 4 cm</text><line x1="360" y1="530" x2="460" y2="530" stroke="#526474" stroke-width="2"/><text x="410" y="565" font-size="18" fill="#203247" text-anchor="middle">q = (4/3) cm</text><text x="35" y="155" font-size="17" fill="#203247" text-anchor="start">Altezze amplificate; distanze sull’asse in cm.</text><text x="35" y="630" font-size="19" fill="#203247" text-anchor="start">m = −q/p = −1/3 · immagine capovolta</text><text x="35" y="715" font-size="22" fill="#203247" text-anchor="start">2 · Distanze q di due configurazioni</text><text x="130" y="807" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="150" y="785" width="120" height="30" fill="#3d7791"/><text x="280" y="809" font-size="18" fill="#203247" text-anchor="start">(4/3) cm</text><text x="130" y="907" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="150" y="885" width="270" height="30" fill="#986c35"/><text x="430" y="909" font-size="18" fill="#203247" text-anchor="start">3 cm</text><text x="130" y="1007" font-size="18" fill="#203247" text-anchor="end">media</text><rect x="150" y="985" width="195" height="30" fill="#637e55"/><text x="355" y="1009" font-size="18" fill="#203247" text-anchor="start">(13/6) cm</text><text x="35" y="1080" font-size="19" fill="#203247" text-anchor="start">A: f = 1 cm,p = 4 cm · B: f = 2 cm,p = 6 cm</text><text x="35" y="1160" font-size="22" fill="#203247" text-anchor="start">3 · Solo f = 1 cm; dominio p &gt; 1 cm</text><line x1="150" y1="1570" x2="570" y2="1570" stroke="#526474" stroke-width="2"/><line x1="150" y1="1570" x2="150" y2="1220" stroke="#526474" stroke-width="2"/><line x1="215" y1="1230" x2="215" y2="1570" stroke="#72818c" stroke-width="2" stroke