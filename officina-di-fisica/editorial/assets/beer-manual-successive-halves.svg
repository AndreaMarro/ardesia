<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1140" viewBox="0 0 640 1140" role="img" aria-labelledby="title description"><title id="title">Strati emivalenti in successione</title><desc id="description">Intensità100%,25%,12,5% a0,2,3strati. Le barre usano identica scala dell’intensità, non dell’ampiezza del campo; le frecce identificano la propagazione, non il flusso numerico.</desc><rect x="0" y="0" width="640" height="1140" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="24" y="45" font-size="30" fill="#172033" text-anchor="start" font-family="sans-serif">Strati emivalenti in successione</text><g transform="translate(0 90)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">1. Fascio iniziale</text><line x1="60" y1="165" x2="402" y2="165" stroke="#9a3412" stroke-width="4"/><polygon points="410,165 396,171 396,159" fill="#9a3412"/><rect x="470" y="105" width="70" height="150" fill="#047857" stroke="#047857" stroke-width="2"/><line x1="450" y1="255" x2="570" y2="255" stroke="#172033" stroke-width="2"/><text x="55" y="92" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">n = 0</text><text x="505" y="285" font-size="26" fill="#172033" text-anchor="middle" font-family="sans-serif">100%</text><text x="55" y="305" font-size="23" fill="#172033" text-anchor="start" font-family="sans-serif">Altezza della barra ∝ intensità</text></g><g transform="translate(0 430)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">2. Due dimezzamenti</text><line x1="60" y1="165" x2="402" y2="165" stroke="#9a3412" stroke-width="4"/><polygon points="410,165 396,171 396,159" fill="#9a3412"/><rect x="130" y="115" width="24" height="100" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><rect x="210" y="115" width="24" height="100" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><rect x="470" y="217.5" width="70" height="37.5" fill="#047857" stroke="#047857" stroke-width="2"/><line x1="450" y1="255" x2="570" y2="255" stroke="#172033" stroke-width="2"/><text x="55" y="92" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">n = 2</text><text x="505" y="285" font-size="26" fill="#172033" text-anchor="middle" font-family="sans-serif">25%</text><text x="55" y="305" font-size="23" fill="#172033" text-anchor="start" font-family="sans-serif">Altezza della barra ∝ intensità</text></g><g transform="translate(0 770)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">3. Un ulteriore dimezzamento</text><line x1="60" y1="165" x2="402" y2="165" stroke="#9a3412" stroke-width="4"/><polygon points="410,165 396,171 396,159" fill="#9a3412"/><rect x="130" y="115" width="24" height="100" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><rect x="210" y="115" width="24" height="100" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><rect x="290" y="115" width="24" height="100" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><rect x="470" y="236.25" width="70" height="18.75" fill="#047857" stroke="#047857" stroke-width="2"/><line x1="450" y1="255" x2="570" y2="255" stroke="#172033" stroke-width="2"/><text x="55" y="92" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">n = 3</text><text x="505" y="285" font-size="26" fill="#172033" text-anchor="middle" font-family="sans-serif">12,5%</text><text x="55" y="305" font-size="23" fill="#172033" text-anchor="start" font-family="sans-serif">Altezza della barra ∝ intensità</text></g></svg>
