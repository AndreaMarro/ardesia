<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1280" role="img" aria-labelledby="title desc"><title id="title">Urto anelastico con bersaglio fermo</title><desc id="desc">Massa incidente due chilogrammi a due metri al secondo, bersaglio fermo due chilogrammi. Dopo l’urto i corpi restano uniti e si muovono a un metro al secondo. Quantità di moto totale quattro chilogrammi metro al secondo conservata; energia cinetica scende da quattro a due joule.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="640" height="1280" rx="24" fill="#faf8f2"/><g font-family="sans-serif" font-size="20" fill="#183746">
<text x="28" y="42" font-size="24" font-weight="bold">1 · Il sistema comprende entrambi i corpi</text><text x="28" y="88">Asse positivo verso destra. Impulso esterno nullo.</text><rect x="90" y="125" width="430" height="200" rx="16" fill="none" stroke="#81968d" stroke-dasharray="6 5"/><rect x="130" y="220" width="60" height="55" fill="#cfe4e5" stroke="#183746"/><rect x="400" y="220" width="60" height="55" fill="#e7d8bf" stroke="#183746"/><path d="M160 190H260" stroke="#16728a" stroke-width="3" marker-end="url(#a)"/><text x="280" y="195">v = +2 m/s</text><text x="120" y="305">m = 2 kg</text><text x="390" y="305">M = 2 kg</text><text x="390" y="165">v_M = 0</text><text x="28" y="390">p_i = 2 · 2 + 2 · 0 = 4 kg·m/s</text>
<text x="28" y="470" font-size="24" font-weight="bold">2 · Dopo l’urto si muovono insieme</text><rect x="230" y="600" width="60" height="55" fill="#cfe4e5" stroke="#183746"/><rect x="290" y="600" width="60" height="55" fill="#e7d8bf" stroke="#183746"/><path d="M290 570H340" stroke="#16728a" stroke-width="3" marker-end="url(#a)"/><text x="370" y="577">V = +1 m/s</text><text x="28" y="710">p_f = (2 + 2) · 1 = 4 kg·m/s</text><text x="28" y="755">Velocità: 50 px per m/s in entrambi i pannelli.</text>
<text x="28" y="835" font-size="24" font-weight="bold">3 · L’energia cinetica invece diminuisce</text><text x="28" y="885">Energia: 40 px/J. Geometria dei corpi schematica.</text><rect x="180" y="935" width="160" height="35" fill="#cfe4e5"/><rect x="180" y="1030" width="80" height="35" fill="#cfe4e5"/><text x="28" y="960">K_i = 4 J</text><text x="28" y="1055">K_f = 2 J</text><path d="M180 915V1080" stroke="#81968d" stroke-width="2"/><text x="370" y="1055">ΔK = −2 J</text><text x="28" y="1130">Senza lavoro esterno: +2 J all’energia interna.</text><text x="28" y="1185">Conservare p non significa conservare K.</text><text x="28" y="1240" font-size="18">Scale distinte per velocità ed energia; masse uguali esplicite.</text></g></svg>
