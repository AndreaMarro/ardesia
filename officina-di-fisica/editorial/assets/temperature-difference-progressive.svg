<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1530" viewBox="0 0 640 1530" role="img" aria-labelledby="title desc"><title id="title">Intervalli uguali, origini diverse</title><desc id="desc">Scale Celsius e kelvin allineate: venti e quaranta gradi Celsius corrispondono a 293,15 e 313,15 kelvin. L’intervallo è 20 kelvin. Caso distinto con barre di temperature assolute 300 e 290 kelvin.</desc><rect width="640" height="1530" rx="24" fill="#f5faff"/><g font-family="Arial,sans-serif" font-size="20" fill="#163047"><text x="35" y="50" font-size="26" font-weight="bold">1 · Lo stesso passo, due origini</text><text x="35" y="100">5 px per intervallo di 1 K o 1 °C</text><text x="80" y="160">t (°C)</text><text x="340" y="160">T (K)</text><path d="M130 500V200M390 500V200" stroke="#163047" stroke-width="3"/><g stroke="#8aa5b5"><path d="M120 500H140M120 400H140M120 300H140M120 200H140"/><path d="M380 500H400M380 400H400M380 300H400M380 200H400"/></g><text x="77" y="507">0</text><text x="67" y="407">20</text><text x="67" y="307">40</text><text x="67" y="207">60</text><text x="415" y="507">273,15</text><text x="415" y="407">293,15</text><text x="415" y="307">313,15</text><text x="415" y="207">333,15</text><path d="M140 400H380M140 300H380" stroke="#bc5315" stroke-dasharray="5 5"/><path d="M250 400V300M240 400H260M240 300H260" stroke="#196082" stroke-width="4"/><text x="269" y="358">20 K</text><text x="35" y="565">Lo zero assoluto è fuori da questo riquadro.</text><path d="M35 610H605" stroke="#b5cbd9"/><text x="35" y="665" font-size="26" font-weight="bold">2 · L’offset si cancella</text><text x="35" y="725">T_c = (40 + 273,15) K = 313,15 K</text><text x="35" y="780">T_f = (20 + 273,15) K = 293,15 K</text><text x="35" y="845">ΔT = (313,15 − 293,15) K = 20 K</text><text x="35" y="905">La differenza non diventa 293,15 K.</text><text x="35" y="960">Non confondere intervallo e rapporto.</text><path d="M35 1010H605" stroke="#b5cbd9"/><text x="35" y="1065" font-size="26" font-weight="bold">3 · Altro caso: rapporto assoluto</text><text x="35" y="1115">Solo 13 · barre da zero, scala 1 px/K</text><text x="35" y="1175">A: T_f = 300 K</text><rect x="100" y="1205" width="300" height="38" fill="#196082"/><text x="35" y="1310">B: T_f = 290 K</text><rect x="100" y="1340" width="290" height="38" fill="#bc5315"/><text x="35" y="1440">T_f,B/T_f,A = 290/300 = 29/30</text><text x="35" y="1490">Qui si dividono kelvin, non numeri Celsius.</text></g></svg>
