<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1460" role="img" aria-labelledby="title desc"><title id="title">Bilanci di spinta e massa</title><desc id="desc">Tre confronti distinti: vettori verticali traslati di spinta due newton, peso 1,2 newton e forza esterna 0,8 newton con scala comune; masse cinque e tredici chilogrammi per il pontone; sessanta e trentadue grammi nei due liquidi.</desc><rect width="640" height="1460" fill="#faf7ef"/><g font-family="Arial,sans-serif" font-size="22" fill="#252438">
<text x="32" y="48" font-size="27" font-weight="bold">Spinta, vincoli e massa sostenuta</text><text x="32" y="94">1. Confrontare i tre vettori verticali</text><text x="32" y="133">Frecce traslate, non punti di applicazione</text>
<path d="M150 390V190" stroke="#246d54" stroke-width="6"/><path d="m138 208 12-18 12 18" fill="none" stroke="#246d54" stroke-width="6"/>
<path d="M335 190V310" stroke="#b24b49" stroke-width="6"/><path d="m323 292 12 18 12-18" fill="none" stroke="#b24b49" stroke-width="6"/>
<path d="M510 190V270" stroke="#5b36b1" stroke-width="6"/><path d="m498 252 12 18 12-18" fill="none" stroke="#5b36b1" stroke-width="6"/>
<text x="105" y="440">S = 2 N</text><text x="267" y="355">P = 1,2 N</text><text x="450" y="315">F = 0,8 N</text><text x="215" y="487">S − P − F = 0</text>
<path d="M32 525H608" stroke="#b3abbf"/><text x="32" y="570">2. Pontone: limite di 18 kg totali</text>
<text x="35" y="641">5 kg</text><rect x="145" y="610" width="100" height="45" fill="#dcd7f3" stroke="#41366b" stroke-width="2"/><text x="270" y="641">pontone</text>
<text x="35" y="711">13 kg</text><rect x="145" y="680" width="260" height="45" fill="#d9eddf" stroke="#246d54" stroke-width="2"/><text x="425" y="711">carico</text>
<text x="35" y="781">18 kg</text><rect x="145" y="750" width="360" height="45" fill="#dce7f6" stroke="#286594" stroke-width="2"/><text x="190" y="848">5 kg + 13 kg = 18 kg</text><text x="110" y="898">Masse, non forze: stessa scala</text>
<path d="M32 950H608" stroke="#b3abbf"/><text x="32" y="995">3. Due volumi di liquido esclusi</text>
<text x="35" y="1108">60 g</text><rect x="145" y="1075" width="240" height="45" fill="#dce7f6" stroke="#286594" stroke-width="2"/><text x="410" y="1108">acqua</text>
<text x="35" y="1198">32 g</text><rect x="145" y="1165" width="128" height="45" fill="#f3e4ad" stroke="#9e8124" stroke-width="2"/><text x="300" y="1198">olio</text>
<text x="35" y="1288">92 g</text><rect x="145" y="1255" width="368" height="45" fill="#d9eddf" stroke="#246d54" stroke-width="2"/>
<text x="130" y="1360">60 g + 32 g = 92 g</text><text x="85" y="1410">La massa del corpo equilibra i due contributi</text>
</g></svg>