<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1310" role="img" aria-labelledby="title desc">
<title id="title">Entropia trasferita, senza produzione nel limite reversibile</title>
<desc id="desc">Sistema e sorgente sono entrambi a trecento kelvin nel limite reversibile. Seicento joule passano dalla sorgente al sistema: l’entropia della sorgente diminuisce di due joule per kelvin e quella del sistema aumenta dello stesso valore. La somma è zero. Un diverso confronto statistico riguarda due variazioni del solo sistema di due e un joule per kelvin, media tre mezzi.</desc>
<defs><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1310" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Il sistema riceve calore ed entropia</text>
<text x="32" y="83" font-size="18">Scambio isotermo nel limite reversibile, T = 300 K.</text>
<rect x="45" y="130" width="210" height="150" rx="10" fill="#e4f3fa" stroke="#165a87"/>
<rect x="385" y="130" width="210" height="150" rx="10" fill="#e0efe7" stroke="#28664d"/>
<text x="91" y="174">Sorgente</text><text x="87" y="217">T = 300 K</text><text x="81" y="257">Cede 600 J</text>
<text x="432" y="174">Sistema</text><text x="426" y="217">T = 300 K</text><text x="414" y="257">Riceve 600 J</text>
<path d="M272 210H367" stroke="#b45328" stroke-width="4" marker-end="url(#heat)"/>
<text x="279" y="180" font-size="18">600 J</text>
<text x="32" y="323" font-size="18">Schema del trasferimento, senza scala metrica.</text>
<text x="32" y="355" font-size="18">La temperatura resta costante; ΔS del sistema no.</text>
<path d="M32 387H608" stroke="#9babbc"/>
<text x="32" y="432" font-size="25" font-weight="bold">2 · Due variazioni opposte, totale nullo</text>
<text x="32" y="471" font-size="18">Variazioni di entropia in J/K, rispetto allo zero.</text>
<path d="M90 745H550M320 515V765" stroke="#14243a" stroke-width="2" fill="none"/>
<rect x="120" y="547" width="200" height="42" fill="#165a87"/>
<rect x="320" y="640" width="200" height="42" fill="#28664d"/>
<text x="32" y="576">Sorgente</text><text x="162" y="575" fill="white">−2 J/K</text>
<text x="32" y="669">Sistema</text><text x="377" y="668" fill="white">+2 J/K</text>
<text x="113" y="782">−2</text><text x="314" y="795">0</text><text x="505" y="782">+2</text>
<text x="32" y="829" font-size="18">ΔS_totale = −2 J/K + 2 J/K = 0.</text>
<path d="M32 861H608" stroke="#9babbc"/>
<text x="32" y="906" font-size="25" font-weight="bold">3 · Due prove del solo sistema</text>
<text x="32" y="945" font-size="18">A: 600 J a 300 K; B: 1 J a 1 K ideale assegnato.</text>
<path d="M130 971V1207" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="991" width="240" height="34" fill="#165a87"/>
<rect x="130" y="1058" width="120" height="34" fill="#b45328"/>
<rect x="130" y="1125" width="180" height="34" fill="#28664d"/>
<text x="50" y="1017">A</text><text x="389" y="1017">2 J/K</text>
<text x="50" y="1084">B</text><text x="269" y="1084">1 J/K</text>
<text x="32" y="1151">Media</text><text x="329" y="1151">3/2 J/K</text>
<text x="105" y="1201">0</text>
<text x="32" y="1249" font-size="18">Media delle uscite: (2 + 1)/2 = 3/2 J/K.</text>
<text x="32" y="1281" font-size="18">La media non è la variazione totale del pannello 2.</text>
</g></svg>
