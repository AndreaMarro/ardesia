<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1530" viewBox="0 0 640 1530" role="img" aria-labelledby="title desc">
<title id="title">Potenza e superfici sferiche</title><desc id="desc">Sezioni di sfere di raggi due e quattro metri. L’area sferica cresce di quattro. Un confronto distinto combina potenza normalizzata doppia e distanza doppia, ottenendo metà intensità.</desc>
<rect width="640" height="1530" rx="20" fill="#f7fbff"/>
<g font-family="system-ui,sans-serif" fill="#142d40" font-size="20">
<text x="35" y="48" font-size="25" font-weight="700">1 · Due sfere, stessa sorgente al centro</text>
<text x="35" y="90">Sezioni centrali: raggi a 40 px/m</text>
<circle cx="320" cy="310" r="160" fill="#edf7fc" stroke="#145d81" stroke-width="3"/>
<circle cx="320" cy="310" r="80" fill="#d7f1fa" stroke="#145d81" stroke-width="3"/>
<circle cx="320" cy="310" r="5" fill="#142d40"/>
<path d="M320 310H400M320 310L416 438" stroke="#c65919" stroke-width="2" fill="none"/>
<text x="337" y="292">2 m</text><text x="435" y="445">4 m</text>
<text x="35" y="525">Superfici: 4πr², non i dischi del disegno</text>
<path d="M35 560H605" stroke="#b3cbd9"/>
<text x="35" y="610" font-size="25" font-weight="700">2 · Raggio doppio, area quadrupla</text>
<text x="35" y="650">S₀ = 16π m² · barre: 100 px per S₀</text>
<text x="35" y="710">r = 2 m</text><rect x="100" y="735" width="100" height="35" fill="#145d81"/><text x="225" y="762">S₀</text>
<text x="35" y="825">r = 4 m</text><rect x="100" y="850" width="400" height="35" fill="#145d81"/><text x="520" y="877">4 S₀</text>
<text x="35" y="945">Senza perdite, la stessa P attraversa ogni sfera.</text>
<path d="M35 980H605" stroke="#b3cbd9"/>
<text x="35" y="1030" font-size="25" font-weight="700">3 · Qui cambia anche la potenza</text>
<text x="35" y="1070">p = P/(4π), in W · non è una pressione</text>
<text x="35" y="1135">A · p = 4 W, r = 2 m ⇒ I = 1 W/m²</text>
<rect x="100" y="1170" width="200" height="35" fill="#145d81"/>
<text x="35" y="1285">B · p = 8 W, r = 4 m ⇒ I = 1/2 W/m²</text>
<rect x="100" y="1320" width="100" height="35" fill="#c65919"/>
<text x="35" y="1420">Intensità: 200 px/(W/m²) · rapporto 1/2</text>
<text x="35" y="1470">Campo lontano · isotropia · niente assorbimento</text>
</g></svg>
