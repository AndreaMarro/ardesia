<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1530" viewBox="0 0 640 1530" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Tre vincoli di un gas perfetto</title><desc id="desc">Bilancio adiabatico con lavoro uscente 200 joule e raffreddamento di 8 kelvin; aumento di 6 kelvin per 72 joule in ampolla rigida; confronto dei volumi e delle pressioni agli estremi di un’espansione adiabatica reversibile con gamma tre mezzi.</desc><rect x="0" y="0" width="640" height="1530" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Vincoli prima dei calcoli</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Espansione adiabatica</text><text x="35" y="175" font-size="19" fill="#203247" text-anchor="start">Q = 0; W uscente = 200 J</text><text x="35" y="235" font-size="19" fill="#203247" text-anchor="start">ΔU = −200 J</text><text x="35" y="295" font-size="19" fill="#203247" text-anchor="start">Cᵥ,tot = 25 J/K; ΔT = −8 K</text><text x="35" y="355" font-size="19" fill="#203247" text-anchor="start">L’energia interna dipende da T, non dal cammino.</text><text x="35" y="470" font-size="21" fill="#203247" text-anchor="start">2 · Ampolla rigida: nessun lavoro di volume</text><line x1="140" y1="850" x2="530" y2="850" stroke="#607383" stroke-width="2"/><line x1="140" y1="850" x2="140" y2="560" stroke="#607383" stroke-width="2"/><line x1="140" y1="850" x2="500" y2="610" stroke="#306f8c" stroke-width="3"/><circle cx="500" cy="610" r="5" fill="#306f8c"/><text x="128" y="880" font-size="18" fill="#203247" text-anchor="end">0</text><text x="110" y="555" font-size="18" fill="#203247" text-anchor="middle">ΔT [K]</text><text x="540" y="920" font-size="18" fill="#203247" text-anchor="end">Q [J]</text><text x="500" y="885" font-size="18" fill="#203247" text-anchor="middle">72</text><text x="125" y="618" font-size="18" fill="#203247" text-anchor="end">6</text><text x="235" y="565" font-size="20" fill="#203247" text-anchor="start">ΔT = Q / (12 J/K)</text><text x="35" y="950" font-size="19" fill="#203247" text-anchor="start">Il segmento arriva a 72 J e 6 K.</text><text x="35" y="1060" font-size="21" fill="#203247" text-anchor="start">3 · Quattro volte V; un ottavo di p</text><text x="35" y="1135" font-size="19" fill="#203247" text-anchor="start">V iniziale</text><rect x="220" y="1110" width="60" height="28" fill="#637e55"/><text x="300" y="1135" font-size="19" fill="#203247" text-anchor="start">V i</text><text x="35" y="1205" font-size="19" fill="#203247" text-anchor="start">V finale</text><rect x="220" y="1180" width="240" height="28" fill="#637e55"/><text x="480" y="1205" font-size="19" fill="#203247" text-anchor="start">4 V i</text><text x="35" y="1315" font-size="19" fill="#203247" text-anchor="start">p iniziale</text><rect x="220" y="1290" width="240" height="28" fill="#3d7791"/><text x="480" y="1315" font-size="19" fill="#203247" text-anchor="start">p i</text><text x="35" y="1385" font-size="19" fill="#203247" text-anchor="start">p finale</text><rect x="220" y="1360" width="30" height="28" fill="#3d7791"/><text x="275" y="1385" font-size="19" fill="#203247" text-anchor="start">p i / 8</text><text x="35" y="1480" font-size="19" fill="#203247" text-anchor="start">p i / p f = 4^(3/2) = 8; γ = 3/2</text></svg>
