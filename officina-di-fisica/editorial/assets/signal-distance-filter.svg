<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-labelledby="title desc"><title id="title">Distanza e filtro sul segnale</title><desc id="desc">Segnali relativi alla stessa scala: iniziale1, a distanza doppia1/4, con filtro tre quinti del quarto cioè3/20. Lunghezze320,80,48pixel.</desc><rect width="480" height="720" fill="#faf7ef"/><g fill="#163e38" font-family="sans-serif" font-size="26"><text x="24" y="48" font-weight="bold">Due fattori sul segnale</text><text x="24" y="110">Iniziale: S₁</text><rect x="64" y="136" width="320" height="38" rx="5"/><text x="24" y="237">A distanza doppia: S₁/4</text><rect x="64" y="263" width="80" height="38" rx="5" fill="#28766a"/><text x="24" y="364">Con il filtro: 3S₁/20</text><rect x="64" y="390" width="48" height="38" rx="5" fill="#b74c2d"/><text x="24" y="505">Distanza: fattore (1/2)² = 1/4</text><text x="24" y="556">Filtro: fattore 3/5</text><text x="24" y="607">Risultato: 3/5 · 1/4 = 3/20</text><text x="24" y="668">Stessa scala per tutte le barre</text><text x="24" y="707">Risposta lineare: S = kI</text></g></svg>
