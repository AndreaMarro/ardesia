<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1740"><title>Velocità, incontro e aree orientate</title><desc>Tre grafici cinematici autonomi: velocità negativa crescente; incontro a 5 secondi e 10 metri; due rettangoli di spostamenti più 12 e meno 10 metri.</desc><rect width="640" height="1740" fill="white" /><g font-family="Arial,sans-serif" fill="#18354b" font-size="20"><text x="32" y="42" font-size="26">Prima gli assi, poi la forma</text><text x="32" y="105" font-size="23">1 · v negativa ma crescente</text><path d="M120 450V165M100 200H530" stroke="#879da8" fill="none" /><text x="90" y="165">v (m/s)</text><text x="535" y="205">t (s)</text><text x="90" y="225">0</text><path d="M120 380L280 260" stroke="#28738d" stroke-width="4" /><path d="M280 260V200M120 260H280" stroke="#a66e36" stroke-dasharray="6 5" fill="none" /><text x="68" y="385">−3</text><text x="68" y="265">−1</text><text x="270" y="230">2</text><text x="32" y="490">v &lt; 0: il moto procede verso x minori.</text><text x="32" y="530">La rapidità scende da 3 m/s a 1 m/s.</text><text x="32" y="610" font-size="23">2 · Stessa posizione allo stesso tempo</text><path d="M120 1010V755M100 990H505" stroke="#879da8" fill="none" /><text x="82" y="745">x (m)</text><text x="515" y="995">t (s)</text><text x="90" y="1015">0</text><path d="M120 990L400 822" stroke="#28738d" stroke-width="4" /><path d="M120 810L400 894" stroke="#a66e36" stroke-width="4" /><circle cx="320" cy="870" r="5" fill="#18354b" /><path d="M120 870H320V990" fill="none" stroke="#879da8" stroke-dasharray="6 5" /><text x="72" y="817">15</text><text x="72" y="878">10</text><text x="312" y="1020">5</text><text x="415" y="820">A</text><text x="415" y="905">B</text><text x="32" y="1080">Incontro: t = 5 s, x = 10 m.</text><text x="32" y="1125">Le pendenze sono +2 m/s e −1 m/s.</text><text x="32" y="1200" font-size="23">3 · Aree di segno opposto</text><path d="M120 1570V1260M100 1430H530" stroke="#879da8" fill="none" /><text x="75" y="1250">v (m/s)</text><text x="535" y="1435">t (s)</text><rect x="120" y="1310" width="160" height="120" fill="#c5e1eb" /><rect x="280" y="1430" width="200" height="80" fill="#f0d9bd" /><path d="M120 1310H280M280 1510H480" stroke="#28738d" stroke-width="4" /><path d="M280 1310V1510" stroke="#879da8" stroke-dasharray="6 5" /><text x="80" y="1315">3</text><text x="75" y="1515">−2</text><text x="88" y="1455">0</text><text x="260" y="1460">4</text><text x="485" y="1460">9</text><text x="170" y="1375">+12 m</text><text x="335" y="1480">−10 m</text><text x="32" y="1620">Spostamento: 12 m−10 m = 2 m.</text><text x="32" y="1670">Distanza: 12 m+10 m = 22 m.</text></g></svg>