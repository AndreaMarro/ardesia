<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc">
<title id="title">Campo elettrico e somma vettoriale</title>
<desc id="desc">Tre problemi distinti. Una prova positiva da 4 nanocoulomb subisce 1,2 micronewton a est: campo 300 newton per coulomb. Tra cariche positive q e 4q distanti 30 centimetri i campi si annullano a 10 centimetri dalla prima. Due contributi ortogonali 300 e 400 newton per coulomb danno un risultante 500, con scala comune nel terzo pannello. Le dimensioni dei simboli delle sorgenti non indicano dimensioni fisiche.</desc>
<defs><marker id="violet" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6550a1" /></marker><marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#127d76" /></marker><marker id="ochre" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#94631e" /></marker></defs>
<rect width="640" height="1540" fill="#fffdf7" />
<text x="40" y="55" font-family="Arial, sans-serif" fill="#272536" font-size="25" font-weight="bold">1 · La forza riferita alla carica</text><text x="40" y="108" font-family="Arial, sans-serif" fill="#272536" font-size="21">Prova positiva: q = +4,0 nC</text>
<circle cx="135" cy="230" r="5" fill="#b44a42" /><path d="M135 230H455" stroke="#94631e" stroke-width="3" fill="none" marker-end="url(#ochre)" /><text x="235" y="200" font-family="Arial, sans-serif" fill="#272536" font-size="21">F = 1,2 μN verso est</text>
<path d="M135 335H455" stroke="#6550a1" stroke-width="3" fill="none" marker-end="url(#violet)" /><text x="205" y="380" font-family="Arial, sans-serif" fill="#272536" font-size="21">E = 300 N/C verso est</text><text x="40" y="425" font-family="Arial, sans-serif" fill="#272536" font-size="18">Due grandezze diverse: E = F/q.</text>
<path d="M40 465H600" stroke="#cbc6bc" />
<text x="40" y="520" font-family="Arial, sans-serif" fill="#272536" font-size="25" font-weight="bold">2 · Campi uguali e opposti in P</text><text x="40" y="565" font-family="Arial, sans-serif" fill="#272536" font-size="18">Fra due cariche positive: d₁ + d₂ = 30 cm.</text>
<path d="M100 715H460" stroke="#9b9b9b" stroke-width="1" fill="none" /><circle cx="100" cy="715" r="6" fill="#b44a42" /><circle cx="460" cy="715" r="6" fill="#b44a42" />
<text x="100" y="655" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">+q</text><text x="460" y="655" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">+4q</text>
<path d="M220 715H300" stroke="#127d76" stroke-width="3" fill="none" marker-end="url(#green)" /><path d="M220 715H140" stroke="#6550a1" stroke-width="3" fill="none" marker-end="url(#violet)" /><circle cx="220" cy="715" r="3" fill="#272536" />
<text x="264" y="690" font-family="Arial, sans-serif" fill="#272536" font-size="21">E₁</text><text x="155" y="690" font-family="Arial, sans-serif" fill="#272536" font-size="21">E₂</text><text x="220" y="760" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">P</text>
<path d="M100 785V805H220V785M220 805H460V785" stroke="#9b9b9b" stroke-width="1" fill="none" /><text x="160" y="850" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">10 cm</text><text x="340" y="850" text-anchor="middle" font-family="Arial, sans-serif" fill="#272536" font-size="21">20 cm</text>
<text x="40" y="925" font-family="Arial, sans-serif" fill="#272536" font-size="21">|E₁| = |E₂| ; E₁ + E₂ = 0</text><text x="40" y="965" font-family="Arial, sans-serif" fill="#272536" font-size="18">L’ultima somma è vettoriale.</text>
<path d="M40 1010H600" stroke="#cbc6bc" />
<text x="40" y="1065" font-family="Arial, sans-serif" fill="#272536" font-size="25" font-weight="bold">3 · Componenti ortogonali</text>
<path d="M140 1375V1095M125 1360H410" stroke="#9b9b9b" stroke-width="1" fill="none" />
<path d="M140 1360H320" stroke="#127d76" stroke-width="3" fill="none" marker-end="url(#green)" /><path d="M140 1360V1120" stroke="#6550a1" stroke-width="3" fill="none" marker-end="url(#violet)" /><path d="M140 1360L320 1120" stroke="#94631e" stroke-width="3" fill="none" marker-end="url(#ochre)" />
<path d="M140 1120H320V1360" fill="none" stroke="#888" stroke-dasharray="6 4" />
<text x="30" y="1205" font-family="Arial, sans-serif" fill="#272536" font-size="21">400 N/C</text><text x="170" y="1410" font-family="Arial, sans-serif" fill="#272536" font-size="21">300 N/C</text><text x="340" y="1230" font-family="Arial, sans-serif" fill="#272536" font-size="21">500 N/C</text><text x="95" y="1100" font-family="Arial, sans-serif" fill="#272536" font-size="18">Nord</text><text x="425" y="1370" font-family="Arial, sans-serif" fill="#272536" font-size="18">Est</text>
<text x="40" y="1495" font-family="Arial, sans-serif" fill="#272536" font-size="21">300² + 400² = 500²</text>
</svg>
