<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Area del foro, velocità e volume al secondo</title><desc id="desc">Dettagli di fori rettangolari uno per uno e uno per due millimetri, venti pixel per millimetro: aree uno e due millimetri quadrati. Allo stesso battente cinque metri la velocità dieci metri al secondo dà portate dieci e venti millilitri al secondo. Barre dieci pixel per millilitro al secondo. Conversione un millimetro quadrato per metro al secondo uguale un millilitro al secondo. Confronto finale portate dieci e quaranta.</desc><rect width="640" height="1480" rx="20" fill="#faf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Due dettagli di fori rettangolari</text><text x="28" y="90">Scala del dettaglio20px/mm, non scala del serbatoio.</text><rect x="180" y="165" width="20" height="20" fill="#08869b"/><rect x="420" y="155" width="20" height="40" fill="#b46145"/><text x="105" y="250">1×1mm → 1mm²</text><text x="350" y="250">1×2mm → 2mm²</text><text x="28" y="315">H = 5m, g = 10m/s²: velocità10m/s per entrambi.</text><rect x="200" y="370" width="100" height="35" fill="#bad9e5"/><rect x="200" y="450" width="200" height="35" fill="#e7c994"/><text x="28" y="396">A = 1mm²</text><text x="28" y="476">A = 2mm²</text><text x="430" y="395">10mL/s</text><text x="430" y="475">20mL/s</text><text x="28" y="550">Portata:10px/(mL/s), barre100e200px.</text><text x="28" y="630" font-size="25">2 · L’uguaglianza dei numeri viene dalle unità</text><text x="28" y="685">1mm² = 10⁻⁶m².</text><text x="28" y="735">1mm² × 1m/s = 10⁻⁶m³/s.</text><text x="28" y="785">1mL = 10⁻⁶m³, quindi il prodotto vale1mL/s.</text><text x="28" y="835">Q = A√(2gH), con unità convertite prima del confronto.</text><text x="28" y="915" font-size="25">3 · Area doppia, battente quadruplo</text><text x="28" y="965">A: area1mm²,H5m → velocità10m/s.</text><text x="28" y="1010">B: area2mm²,H20m → velocità20m/s.</text><rect x="130" y="1080" width="100" height="35" fill="#bad9e5"/><rect x="130" y="1170" width="400" height="35" fill="#e7c994"/><text x="28" y="1107">A</text><text x="28" y="1197">B</text><text x="270" y="1107">10mL/s</text><text x="130" y="1260">40mL/s</text><text x="28" y="1320">Stessa scala10px/(mL/s):100e400px.</text><text x="28" y="1370">Q_B/Q_A = 2√4 = 4.</text><text x="28" y="1420">Ogni prova usa il suo battente istantaneo.</text></g></svg>
