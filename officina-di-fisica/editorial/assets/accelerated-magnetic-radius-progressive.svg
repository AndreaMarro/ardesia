<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Dall’energia elettrica al raggio</title><desc id="desc">Tre tappe distinte: lavoro elettrico e raggio nel campo separato; tensioni due e otto volt con raggi due e quattro metri alla stessa scala; tre punti esatti del raggio inversamente proporzionale a B, a tensione fissata.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Dall’energia elettrica al raggio</text><text x="32" y="92" font-size="22" text-anchor="start">1 · Due regioni, due calcoli</text><text x="32" y="132" font-size="18" text-anchor="start">α = |q|/m = 1 C/kg</text><text x="32" y="174" font-size="18" text-anchor="start">Regione elettrica: da fermo, lavoro |q|U</text><text x="32" y="208" font-size="18" text-anchor="start">Con U = 2 V: v² = 2αU, quindi v = 2 m/s</text><line x1="320" y1="230" x2="320" y2="280" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="320" font-size="18" text-anchor="start">Regione magnetica separata: B = 1 T</text><text x="32" y="355" font-size="18" text-anchor="start">Ingresso perpendicolare: r = v/(αB) = 2 m</text><text x="32" y="400" font-size="18" text-anchor="start">B cambia la direzione, senza lavoro su q.</text><text x="32" y="450" font-size="18" text-anchor="start">Schema di calcolo, non disegno della traiettoria.</text><text x="32" y="550" font-size="22" text-anchor="start">2 · Stesso campo: B = 1 T</text><text x="160" y="600" font-size="19" text-anchor="middle">U = 2 V</text><text x="440" y="600" font-size="19" text-anchor="middle">U = 8 V</text><circle cx="160" cy="720" r="50" fill="none" stroke="#316b9b" stroke-width="2"/><circle cx="440" cy="720" r="100" fill="none" stroke="#a76d20" stroke-width="2"/><line x1="160" y1="720" x2="210" y2="720" stroke="#52667a" stroke-width="2"/><line x1="440" y1="720" x2="540" y2="720" stroke="#52667a" stroke-width="2"/><text x="160" y="870" font-size="19" text-anchor="middle">r = 2 m</text><text x="440" y="870" font-size="19" text-anchor="middle">r = 4 m</text><text x="32" y="910" font-size="18" text-anchor="start">I raggi hanno la stessa scala; U è quadrupla.</text><text x="32" y="960" font-size="22" text-anchor="start">3 · Tre punti a U = 2 V</text><line x1="145" y1="1280" x2="520" y2="1280" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1285" x2="150" y2="1030" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="128" y="1305" font-size="18" text-anchor="end">0</text><text x="535" y="1290" font-size="18" text-anchor="start">B (T)</text><text x="95" y="1015" font-size="18" text-anchor="start">r (m)</text><circle cx="230" cy="1120" r="5" fill="#316b9b"/><text x="230" y="1310" font-size="18" text-anchor="middle">1</text><text x="128" y="1126" font-size="18" text-anchor="end">2</text><circle cx="310" cy="1200" r="5" fill="#316b9b"/><text x="310" y="1310" font-size="18" text-anchor="middle">2</text><text x="128" y="1206" font-size="18" text-anchor="end">1</text><circle cx="470" cy="1240" r="5" fill="#316b9b"/><text x="470" y="1310" font-size="18" text-anchor="middle">4</text><text x="128" y="1246" font-size="18" text-anchor="end">1/2</text><text x="32" y="1380" font-size="18" text-anchor="start">Punti distinti, senza interpolazione lineare.</text><text x="32" y="1420" font-size="18" text-anchor="start">L’origine è degli assi: B = 0 non è ammesso.</text></g></svg>
