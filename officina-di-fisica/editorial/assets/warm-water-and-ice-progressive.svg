<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1260" role="img" aria-labelledby="title desc">
<title id="title">Dalla fusione al nuovo equilibrio</title>
<desc id="desc">Quattro grammi di acqua a cinquanta gradi Celsius e un grammo di ghiaccio a zero arrivano a cinque grammi di acqua a venticinque gradi. Il caldo cede effettivamente quattrocento joule: trecento fondono il ghiaccio e cento scaldano l’acqua appena fusa. Le barre finali confrontano incrementi sopra il punto di fusione con una scala comune.</desc>
<defs><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1260" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Due corpi, una temperatura finale</text>
<rect x="42" y="85" width="230" height="124" rx="10" fill="#fce6dc" stroke="#b45328"/>
<text x="64" y="121">Acqua iniziale</text><text x="64" y="156">4 g a 50 °C</text><text x="64" y="191" font-size="18">Cede calore</text>
<rect x="370" y="85" width="230" height="124" rx="10" fill="#e4f3fa" stroke="#165a87"/>
<text x="390" y="121">Ghiaccio iniziale</text><text x="390" y="156">1 g a 0 °C</text><text x="390" y="191" font-size="18">Riceve calore</text>
<path d="M282 147H356" stroke="#b45328" stroke-width="4" marker-end="url(#heat)"/>
<text x="32" y="252" font-size="18">Freccia schematica: trasferimento interno.</text>
<rect x="130" y="283" width="380" height="84" rx="10" fill="#e0efe7" stroke="#28664d"/>
<text x="167" y="317">Alla fine: 5 g di acqua</text><text x="261" y="349">25 °C</text>
<text x="32" y="410" font-size="18">Controllo del ramo: 800 J disponibili fino a 0 °C</text>
<text x="32" y="441" font-size="18">superano i 300 J necessari alla fusione.</text>
<path d="M32 474H608" stroke="#9babbc"/>
<text x="32" y="519" font-size="25" font-weight="bold">2 · Il calore scambiato è 400 J</text>
<text x="32" y="558" font-size="18">Il caldo si ferma a 25 °C: non cede tutti gli 800 J.</text>
<path d="M130 587V807" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="608" width="320" height="34" fill="#b45328"/>
<text x="33" y="633">Ceduto</text><text x="468" y="633">400 J</text>
<rect x="130" y="681" width="240" height="34" fill="#28664d"/><rect x="370" y="681" width="80" height="34" fill="#165a87"/>
<text x="33" y="706">Ricevuto</text><text x="190" y="705" fill="white">300 J</text><text x="380" y="705" fill="white" font-size="18">100 J</text>
<text x="146" y="757" font-size="18">Fusione + riscaldamento dell’acqua fusa</text>
<text x="32" y="845" font-size="18">Energie in J; origine comune per i due totali.</text>
<path d="M32 876H608" stroke="#9babbc"/>
<text x="32" y="920" font-size="25" font-weight="bold">3 · Confrontare gli incrementi finali</text>
<path d="M130 946V1160" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="964" width="175" height="34" fill="#165a87"/>
<rect x="130" y="1030" width="100" height="34" fill="#165a87"/>
<rect x="130" y="1096" width="137.5" height="34" fill="#28664d"/>
<text x="50" y="990">A</text><text x="324" y="990">25 K</text><text x="50" y="1056">B</text><text x="249" y="1056">100/7 K</text><text x="32" y="1122">Media</text><text x="287" y="1122">275/14 K</text>
<text x="32" y="1200" font-size="18">Incrementi in K. Le letture Celsius hanno gli stessi</text>
<text x="32" y="1230" font-size="18">numeri, riferiti qui al punto di fusione 0 °C.</text>
</g></svg>
