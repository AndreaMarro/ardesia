<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
<title id="title">Massa, capacità e calore per un aumento termico</title>
<desc id="desc">Un corpo di due grammi con calore specifico due joule per grammo e kelvin riceve quaranta joule per aumentare di dieci kelvin. Grafico calore incremento termico e barre per le energie di due prove, quaranta e centosessanta joule, con media cento.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#165a87"/></marker></defs>
<rect width="640" height="1120" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · La capacità dell’intero corpo</text>
<rect x="250" y="95" width="240" height="130" rx="8" fill="#dceef6" stroke="#14243a" stroke-width="2"/>
<path d="M65 160H235" stroke="#165a87" stroke-width="4" marker-end="url(#arrow)"/>
<text x="65" y="135">Q = 40 J</text><text x="274" y="132">m = 2 g</text><text x="274" y="166">c = 2 J/(g·K)</text><text x="274" y="200">C = mc = 4 J/K</text>
<text x="32" y="270">ΔT = 10 K ; Q = C ΔT = 40 J</text>
<text x="32" y="305" font-size="18">Freccia schematica: energia trasferita, non materia.</text>
<path d="M32 337H608" stroke="#9babbc"/>
<text x="32" y="381" font-size="25" font-weight="bold">2 · Stessa massa, un grafico lineare</text>
<g stroke="#14243a" stroke-width="2" fill="none"><path d="M110 690V421M110 690H470"/><path d="M260 685V695M410 685V695M105 570H115M105 450H115"/></g>
<path d="M110 690L410 450" stroke="#165a87" stroke-width="4"/>
<path d="M260 690V570H110M410 690V450H110" stroke="#7d8b9e" stroke-dasharray="5 5" fill="none"/>
<g fill="#165a87"><circle cx="260" cy="570" r="5"/><circle cx="410" cy="450" r="5"/></g>
<text x="72" y="699">0</text><text x="66" y="577">40</text><text x="66" y="457">80</text><text x="248" y="720">10</text><text x="398" y="720">20</text><text x="480" y="696">ΔT/K</text><text x="67" y="416">Q/J</text>
<text x="32" y="758" font-size="18">Scale: 15 px/K e 3 px/J; C = 4 J/K costante.</text>
<path d="M32 790H608" stroke="#9babbc"/>
<text x="32" y="834" font-size="25" font-weight="bold">3 · La media delle due energie</text>
<path d="M145 854V1040" stroke="#14243a" stroke-width="2"/>
<rect x="145" y="870" width="80" height="30" fill="#165a87"/><rect x="145" y="930" width="320" height="30" fill="#165a87"/><rect x="145" y="990" width="200" height="30" fill="#28664d"/>
<text x="50" y="893">A</text><text x="242" y="893">40 J</text><text x="50" y="953">B</text><text x="482" y="953">160 J</text><text x="32" y="1013">Media</text><text x="362" y="1013">100 J</text>
<text x="32" y="1070" font-size="18">A: 2 g, 10 K; B: 4 g, 20 K. Barre a 2 px/J.</text>
</g></svg>
