<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1280" role="img" aria-labelledby="title desc"><title id="title">Macchina di Atwood: tensione e risultanti</title><desc id="desc">Prima tappa: masse quattro e un chilogrammo collegate da fune tesa su carrucola fissa ideale. Seconda: diagrammi dei due corpi. Scala comune tre pixel per newton. Sul corpo maggiore peso quaranta newton in basso, centoventi pixel, e tensione sedici newton in alto, quarantotto pixel. Sul minore peso dieci newton in basso, trenta pixel, e tensione sedici newton in alto, quarantotto pixel. Risultanti ventiquattro newton in basso e sei newton in alto. Terza tappa: equazioni di Newton, accelerazione comune in modulo sei metri al secondo quadrato. La tensione non coincide con le risultanti. Geometria schematica senza scala spaziale.</desc><defs><marker id="t" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#14647b"/></marker><marker id="p" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b44b2c"/></marker></defs><rect width="640" height="1280" rx="24" fill="#faf8f2"/>
<g font-family="system-ui, sans-serif" font-size="20" fill="#16323f">
<text x="28" y="42" font-size="24" font-weight="700">1 · Fune tesa, carrucola fissa</text>
<path d="M320 65 L320 130" stroke="#788781" stroke-width="4"/><circle cx="320" cy="130" r="50" fill="#e4e9e1" stroke="#788781" stroke-width="3"/><circle cx="320" cy="130" r="5" fill="#16323f"/>
<path d="M270 300 L270 130 A50 50 0 0 1 370 130 L370 300" fill="none" stroke="#16323f" stroke-width="2"/>
<rect x="230" y="300" width="80" height="60" fill="#e6d6bf" stroke="#16323f" stroke-width="2"/><rect x="330" y="300" width="80" height="60" fill="#d6e6df" stroke="#16323f" stroke-width="2"/>
<text x="260" y="337">M</text><text x="361" y="337">m</text><text x="230" y="397">M = 4 kg</text><text x="337" y="397">m = 1 kg</text>
<text x="28" y="445">Riferimento inerziale; g = 10 m/s².</text>
<text x="28" y="500" font-size="24" font-weight="700">2 · Peso e tensione su ogni corpo</text>
<rect x="130" y="600" width="100" height="60" fill="#e6d6bf" stroke="#16323f" stroke-width="2"/><rect x="410" y="600" width="100" height="60" fill="#d6e6df" stroke="#16323f" stroke-width="2"/>
<text x="170" y="637">M</text><text x="451" y="637">m</text>
<path d="M180 600 L180 552" stroke="#14647b" stroke-width="3" marker-end="url(#t)"/><path d="M460 600 L460 552" stroke="#14647b" stroke-width="3" marker-end="url(#t)"/>
<path d="M180 660 L180 780" stroke="#b44b2c" stroke-width="3" marker-end="url(#p)"/><path d="M460 660 L460 690" stroke="#b44b2c" stroke-width="3" marker-end="url(#p)"/>
<text x="38" y="565" fill="#14647b">T = 16 N</text><text x="480" y="565" fill="#14647b">T = 16 N</text><text x="32" y="750" fill="#b44b2c">Mg = 40 N</text><text x="480" y="730" fill="#b44b2c">mg = 10 N</text>
<text x="28" y="835" font-size="18">Mg − T = 24 N, in basso.</text><text x="335" y="835" font-size="18">T − mg = 6 N, in alto.</text>
<text x="28" y="880">Stessa scala per tutte le forze: 3 px/N.</text>
<text x="28" y="940" font-size="24" font-weight="700">3 · Somma le equazioni di Newton</text>
<text x="28" y="990">Mg − T = MA;   T − mg = mA</text><text x="28" y="1035">(M − m)g = (M + m)A</text><text x="28" y="1080">A = 10 · (4 − 1)/(4 + 1) m/s² = 6 m/s²</text>
<text x="28" y="1130">T = m(g + A) = 1 · 16 N = 16 N</text>
<text x="28" y="1180">Tensione e risultanti sono grandezze distinte.</text><text x="28" y="1230">Geometria schematica, senza scala spaziale.</text>
</g></svg>
