<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1150" role="img" aria-labelledby="title desc"><title id="title">Normale, peso e accelerazione in ascensore</title><desc id="desc">Persona di quaranta chilogrammi in contatto con la bilancia, vista dal riferimento esterno inerziale. Primo pannello: normale quattrocentottanta newton verso alto, lunga centoventi pixel, e peso quattrocento newton verso basso lungo cento pixel. Secondo pannello: risultante ottanta newton verso alto, venti pixel. Forze a un quarto di pixel per newton. Terzo: accelerazione due metri al secondo quadrato verso alto, ottanta pixel a quaranta pixel per metro al secondo quadrato. Scale di dimensioni diverse, pannelli alternativi da non sommare.</desc>
<defs><marker id="n" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#14647b"/></marker><marker id="p" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b44b2c"/></marker></defs><rect width="640" height="1150" rx="24" fill="#faf8f2"/>
<g font-family="system-ui, sans-serif" font-size="20" fill="#16323f">
<text x="28" y="42" font-size="24" font-weight="700">1 · Isola la persona, alto positivo</text>
<rect x="180" y="200" width="100" height="60" fill="#d6e6df" stroke="#16323f" stroke-width="2"/><text x="190" y="236">m = 40 kg</text>
<path d="M230 200 L230 80" stroke="#14647b" stroke-width="3" marker-end="url(#n)"/><path d="M230 260 L230 360" stroke="#b44b2c" stroke-width="3" marker-end="url(#p)"/>
<text x="270" y="125">N = 480 N</text><text x="270" y="325">mg = 400 N</text><text x="345" y="230">Contatto mantenuto.</text>
<text x="28" y="410">Forze reali: normale e peso sulla persona.</text>
<text x="28" y="470" font-size="24" font-weight="700">2 · La risultante è la differenza</text>
<rect x="180" y="560" width="100" height="60" fill="#d6e6df" stroke="#16323f" stroke-width="2"/><text x="190" y="596">m = 40 kg</text><path d="M230 560 L230 540" stroke="#14647b" stroke-width="2" marker-end="url(#n)"/>
<text x="310" y="550">N − mg = 80 N verso alto</text><text x="28" y="675">Scale dei pannelli 1 e 2: 0,25 px/N.</text>
<text x="28" y="710">La risultante sostituisce le forze, non si aggiunge.</text>
<text x="28" y="780" font-size="24" font-weight="700">3 · Verifica l’accelerazione</text>
<rect x="180" y="900" width="100" height="60" fill="#d6e6df" stroke="#16323f" stroke-width="2"/><text x="190" y="936">m = 40 kg</text><path d="M230 900 L230 820" stroke="#14647b" stroke-width="3" marker-end="url(#n)"/>
<text x="310" y="860">a = (80 N)/(40 kg) = 2 m/s²</text>
<text x="28" y="1010">Accelerazione: 40 px per m/s².</text><text x="28" y="1050">Scala di dimensione diversa da quella delle forze.</text><text x="28" y="1100">N = m(g + a) = 40 · 12 N = 480 N</text>
</g></svg>
