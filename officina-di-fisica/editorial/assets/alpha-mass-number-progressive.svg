<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc"><title id="title">Il bilancio dei nucleoni nelle α</title><desc id="desc">Tre tappe: particella alfa con due protoni e due neutroni; numero di nucleoni emessi per alcuni conteggi interi di eventi; due numeri di massa finali duecentosedici e duecentoventi con media duecentodiciotto, rappresentati a origine zero e scala comune.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1600" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Il bilancio dei nucleoni nelle α</text><text x="32" y="96" font-size="22" text-anchor="start">1 · La particella α porta quattro nucleoni</text><circle cx="250" cy="195" r="26" fill="#a76d20"/><text x="250" y="202" font-size="24" fill="#ffffff" text-anchor="middle">p</text><circle cx="350" cy="195" r="26" fill="#a76d20"/><text x="350" y="202" font-size="24" fill="#ffffff" text-anchor="middle">p</text><circle cx="250" cy="275" r="26" fill="#316b9b"/><text x="250" y="282" font-size="24" fill="#ffffff" text-anchor="middle">n</text><circle cx="350" cy="275" r="26" fill="#316b9b"/><text x="350" y="282" font-size="24" fill="#ffffff" text-anchor="middle">n</text><text x="32" y="355" font-size="18" text-anchor="start">Due protoni e due neutroni: A = 4, Z = 2</text><text x="32" y="400" font-size="18" text-anchor="start">Nel figlio: A diminuisce di 4 e Z di 2.</text><text x="32" y="445" font-size="18" text-anchor="start">Schema dei conteggi, non delle dimensioni nucleari.</text><text x="32" y="520" font-size="22" text-anchor="start">2 · Perdita di nucleoni, A₀ = 220</text><line x1="145" y1="1000" x2="550" y2="1000" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1005" x2="150" y2="630" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="610" font-size="18" text-anchor="start">Nucleoni emessi: 4n</text><text x="475" y="1070" font-size="18" text-anchor="start">n (eventi)</text><circle cx="260" cy="900" r="5" fill="#a76d20"/><line x1="260" y1="994" x2="260" y2="1006" stroke="#52667a" stroke-width="2"/><text x="260" y="1040" font-size="18" text-anchor="middle">1</text><line x1="144" y1="900" x2="156" y2="900" stroke="#52667a" stroke-width="2"/><text x="130" y="906" font-size="18" text-anchor="end">4</text><circle cx="370" cy="800" r="5" fill="#a76d20"/><line x1="370" y1="994" x2="370" y2="1006" stroke="#52667a" stroke-width="2"/><text x="370" y="1040" font-size="18" text-anchor="middle">2</text><line x1="144" y1="800" x2="156" y2="800" stroke="#52667a" stroke-width="2"/><text x="130" y="806" font-size="18" text-anchor="end">8</text><circle cx="480" cy="700" r="5" fill="#a76d20"/><line x1="480" y1="994" x2="480" y2="1006" stroke="#52667a" stroke-width="2"/><text x="480" y="1040" font-size="18" text-anchor="middle">3</text><line x1="144" y1="700" x2="156" y2="700" stroke="#52667a" stroke-width="2"/><text x="130" y="706" font-size="18" text-anchor="end">12</text><circle cx="150" cy="1000" r="4" fill="none" stroke="#316b9b" stroke-width="2"/><text x="128" y="1040" font-size="18" text-anchor="end">0</text><text x="32" y="1130" font-size="22" text-anchor="start">3 · Numeri finali assoluti e la loro media</text><text x="32" y="1170" font-size="18" text-anchor="start">A: 220, n = 1 · B: 228, n = 2</text><text x="128" y="1243" font-size="18" text-anchor="end">A</text><rect x="150" y="1220" width="324" height="30" fill="#316b9b"/><text x="486" y="1243" font-size="18" text-anchor="start">216</text><text x="128" y="1343" font-size="18" text-anchor="end">B</text><rect x="150" y="1320" width="330" height="30" fill="#316b9b"/><text x="492" y="1343" font-size="18" text-anchor="start">220</text><text x="128" y="1443" font-size="18" text-anchor="end">Media</text><rect x="150" y="1420" width="327" height="30" fill="#316b9b"/><text x="489" y="1443" font-size="18" text-anchor="start">218</text><text x="32" y="1515" font-size="18" text-anchor="start">Origine a zero e scala comuni alle tre barre.</text><text x="32" y="1560" font-size="18" text-anchor="start">La media fra catene non è una catena con n = 3/2.</text></g></svg>
