<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1140" viewBox="0 0 640 1140" role="img" aria-labelledby="title description"><title id="title">Posizione e frazioni di periodo</title><desc id="description">Asse orizzontale in centimetri con medesima origine e scala. Posizioni+4,0,-4cm agli istanti0,1/2,1s. La massa trasla lungo l’asse, non percorre un cerchio.</desc><rect x="0" y="0" width="640" height="1140" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="24" y="45" font-size="30" fill="#172033" text-anchor="start" font-family="sans-serif">Posizione e frazioni di periodo</text><g transform="translate(0 90)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">1. Estremo positivo</text><line x1="100" y1="210" x2="552" y2="210" stroke="#172033" stroke-width="4"/><polygon points="560,210 546,216 546,204" fill="#172033"/><line x1="320" y1="130" x2="320" y2="240" stroke="#172033" stroke-width="2" stroke-dasharray="8 6"/><line x1="140" y1="203" x2="140" y2="217" stroke="#172033" stroke-width="3"/><text x="140" y="255" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">-4</text><line x1="320" y1="203" x2="320" y2="217" stroke="#172033" stroke-width="3"/><text x="320" y="255" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">0</text><line x1="500" y1="203" x2="500" y2="217" stroke="#172033" stroke-width="3"/><text x="500" y="255" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">4</text><rect x="482" y="155" width="36" height="48" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><line x1="500" y1="195" x2="500" y2="210" stroke="#9a3412" stroke-width="3"/><text x="65" y="95" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">t = 0 s</text><text x="65" y="295" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">x = 4 cm; T = 2 s</text><text x="565" y="200" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">x</text></g><g transform="translate(0 430)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">2. Equilibrio dopo T/4</text><line x1="100" y1="210" x2="552" y2="210" stroke="#172033" stroke-width="4"/><polygon points="560,210 546,216 546,204" fill="#172033"/><line x1="320" y1="130" x2="320" y2="240" stroke="#172033" stroke-width="2" stroke-dasharray="8 6"/><line x1="140" y1="203" x2="140" y2="217" stroke="#172033" stroke-width="3"/><text x="140" y="255" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">-4</text><line x1="320" y1="203" x2="320" y2="217" stroke="#172033" stroke-width="3"/><text x="320" y="255" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">0</text><line x1="500" y1="203" x2="500" y2="217" stroke="#172033" stroke-width="3"/><text x="500" y="255" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">4</text><rect x="302" y="155" width="36" height="48" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><line x1="320" y1="195" x2="320" y2="210" stroke="#9a3412" stroke-width="3"/><text x="65" y="95" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">t = 1/2 s</text><text x="65" y="295" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">x = 0 cm; T = 2 s</text><text x="565" y="200" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">x</text></g><g transform="translate(0 770)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">3. Estremo opposto dopo T/2</text><line x1="100" y1="210" x2="552" y2="210" stroke="#172033" stroke-width="4"/><polygon points="560,210 546,216 546,204" fill="#172033"/><line x1="320" y1="130" x2="320" y2="240" stroke="#172033" stroke-width="2" stroke-dasharray="8 6"/><line x1="140" y1="203" x2="140" y2="217" stroke="#172033" stroke-width="3"/><text x="140" y="255" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">-4</text><line x1="320" y1="203" x2="320" y2="217" stroke="#172033" stroke-width="3"/><text x="320" y="255" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">0</text><line x1="500" y1="203" x2="500" y2="217" stroke="#172033" stroke-width="3"/><text x="500" y="255" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">4</text><rect x="122" y="155" width="36" height="48" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><line x1="140" y1="195" x2="140" y2="210" stroke="#9a3412" stroke-width="3"/><text x="65" y="95" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">t = 1 s</text><text x="65" y="295" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">x = -4 cm; T = 2 s</text><text x="565" y="200" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">x</text></g></svg>
