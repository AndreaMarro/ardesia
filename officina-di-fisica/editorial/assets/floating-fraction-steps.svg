<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1520" width="640" height="1520" font-family="Arial, sans-serif" font-size="20" fill="#182d42" role="img" aria-labelledby="title desc">
<title id="title">Stessa frazione immersa prima e dopo il taglio</title><desc id="desc">Un blocco largo e piatto, quattro per quattro per un decimetro, ha densità metà del liquido e galleggia con metà volume immerso. Viene diviso in due pezzi uguali. Ciascuno mantiene la stessa frazione immersa ma ha metà massa, metà peso e metà volume immerso.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1520" fill="white"/>
<text x="32" y="46" font-size="24" font-weight="bold">1. Uguaglia spinta e peso</text><text x="32" y="84">ρ_c = 1/2 kg/L; ρ_l = 1 kg/L.</text><text x="32" y="122">Blocco: 4 × 4 × 1 dm, V = 16 L.</text>
<rect x="80" y="275" width="480" height="150" fill="#b5dcf1"/><rect x="180" y="250" width="200" height="50" fill="#e9bb70" stroke="#263f55" stroke-width="2"/>
<path d="M65 275H575" stroke="#287aab" stroke-width="2" stroke-dasharray="6 4"/><text x="425" y="252">Metà emersa.</text><text x="425" y="324">Metà immersa.</text>
<text x="32" y="470">Sezione: 200 × 50 px alla scala 50 px/dm.</text><text x="32" y="508">Immersione: 25 px = 1/2 dm, V_i = 8 L.</text><text x="32" y="542" font-size="18">La dimensione perpendicolare al foglio è 4 dm.</text>
<path d="M32 580H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="630" font-size="24" font-weight="bold">2. La frazione dipende dalle densità</text>
<path d="M150 770V690" stroke="#237b98" stroke-width="3" marker-end="url(#a)"/><path d="M150 770V850" stroke="#b46145" stroke-width="3" marker-end="url(#a)"/><circle cx="150" cy="770" r="5" fill="#263f55"/>
<text x="200" y="718">F_A = 80 N verso l’alto.</text><text x="200" y="832">P = 80 N verso il basso.</text>
<text x="32" y="906">Esempio con g = 10 m/s²: massa 8 kg.</text><text x="32" y="944">Forze in proiezione: 80 px a 1 px/N.</text><text x="32" y="982">ρ_l V_i g = ρ_c Vg → f = ρ_c/ρ_l = 1/2.</text>
<path d="M32 1020H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="1070" font-size="24" font-weight="bold">3. Due pezzi, lo stesso rapporto</text><text x="32" y="1110">Taglio in due parti 2 × 4 × 1 dm.</text>
<rect x="55" y="1195" width="550" height="65" fill="#b5dcf1"/><rect x="70" y="1170" width="200" height="50" fill="#e9bb70" stroke="#263f55" stroke-width="2"/><rect x="350" y="1170" width="100" height="50" fill="#e9bb70" stroke="#263f55" stroke-width="2"/><rect x="490" y="1170" width="100" height="50" fill="#e9bb70" stroke="#263f55" stroke-width="2"/>
<path d="M45 1195H615" stroke="#287aab" stroke-width="2" stroke-dasharray="6 4"/>
<text x="70" y="1304">Prima: V = 16 L.</text><text x="350" y="1304">Dopo: V = 8 L ciascuno.</text>
<text x="32" y="1362">Ogni pezzo: V_i = 4 L, massa 4 kg, peso 40 N.</text><text x="32" y="1400">La frazione resta 4/8 = 1/2.</text><text x="32" y="1450" font-size="18">Geometria sempre a 50 px/dm; forze con scala distinta.</text><text x="32" y="1484" font-size="18">I pezzi galleggiano separati e non si sostengono a vicenda.</text>
</svg>
