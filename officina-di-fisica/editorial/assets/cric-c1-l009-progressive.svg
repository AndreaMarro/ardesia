<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1660" viewBox="0 0 640 1660" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Impulso, conservazione e differenza vettoriale</title><desc id="desc">Quantità di moto prima e dopo un rimbalzo, separazione di pattini e risultante media in due dimensioni.</desc><rect x="0" y="0" width="640" height="1660" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Un impulso cambia un vettore</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Il rimbalzo inverte la quantità di moto</text><line x1="330" y1="170" x2="330" y2="450" stroke="#607383" stroke-width="2"/><line x1="330" y1="230" x2="410" y2="230" stroke="#306f8c" stroke-width="2"/><polygon points="410,230 402.0,234.0 402.0,226.0" fill="#306f8c"/><line x1="330" y1="360" x2="270" y2="360" stroke="#986c35" stroke-width="2"/><polygon points="270,360 278.0,356.0 278.0,364.0" fill="#986c35"/><text x="435" y="235" font-size="19" fill="#203247" text-anchor="start">p_i = +2/5 kg·m/s</text><text x="40" y="365" font-size="19" fill="#203247" text-anchor="start">p_f = −3/10 kg·m/s</text><text x="35" y="505" font-size="19" fill="#203247" text-anchor="start">J_x = p_f − p_i = −7/10 N·s</text><text x="35" y="605" font-size="21" fill="#203247" text-anchor="start">2 · Due pattini si separano</text><rect x="150" y="720" width="60" height="40" fill="#986c35"/><rect x="390" y="720" width="60" height="40" fill="#3d7791"/><line x1="180" y1="780" x2="80" y2="780" stroke="#986c35" stroke-width="2"/><polygon points="80,780 88.0,776.0 88.0,784.0" fill="#986c35"/><line x1="420" y1="780" x2="570" y2="780" stroke="#306f8c" stroke-width="2"/><polygon points="570,780 562.0,784.0 562.0,776.0" fill="#306f8c"/><text x="180" y="690" font-size="19" fill="#203247" text-anchor="middle">6 kg</text><text x="420" y="690" font-size="19" fill="#203247" text-anchor="middle">4 kg</text><text x="80" y="810" font-size="19" fill="#203247" text-anchor="start">v₂ = −2 m/s</text><text x="400" y="810" font-size="19" fill="#203247" text-anchor="start">v₁ = +3 m/s</text><text x="35" y="890" font-size="19" fill="#203247" text-anchor="start">p₂ = −12 kg·m/s · p₁ = +12 kg·m/s</text><text x="35" y="940" font-size="19" fill="#203247" text-anchor="start">Quantità di moto totale orizzontale nulla.</text><text x="35" y="1050" font-size="21" fill="#203247" text-anchor="start">3 · Due componenti, una risultante media</text><line x1="330" y1="1430" x2="550" y2="1430" stroke="#697b87" stroke-width="2"/><polygon points="550,1430 542.0,1434.0 542.0,1426.0" fill="#697b87"/><line x1="330" y1="1430" x2="330" y2="1190" stroke="#697b87" stroke-width="2"/><polygon points="330,1190 334.0,1198.0 326.0,1198.0" fill="#697b87"/><text x="560" y="1465" font-size="19" fill="#203247" text-anchor="start">+x</text><text x="350" y="1195" font-size="19" fill="#203247" text-anchor="start">+y</text><line x1="330" y1="1430" x2="210" y2="1430" stroke="#637e55" stroke-width="2"/><polygon points="210,1430 218.0,1426.0 218.0,1434.0" fill="#637e55"/><line x1="330" y1="1430" x2="330" y2="1310" stroke="#986c35" stroke-width="2"/><polygon points="330,1310 334.0,1318.0 326.0,1318.0" fill="#986c35"/><line x1="330" y1="1430" x2="210" y2="1310" stroke="#306f8c" stroke-width="2"/><polygon points="210,1310 218.48528137423855,1312.8284271247462 212.82842712474618,1318.4852813742386" fill="#306f8c"/><line x1="210" y1="1310" x2="210" y2="1430" stroke="#607383" stroke-width="2"/><line x1="210" y1="1310" x2="330" y2="1310" stroke="#607383" stroke-width="2"/><text x="75" y="1260" font-size="19" fill="#203247" text-anchor="start">|F_media| = 2√2 N</text><text x="200" y="1480" font-size="18" fill="#203247" text-anchor="middle">F_x = −2 N</text><text x="355" y="1325" font-size="19" fill="#203247" text-anchor="start">F_y = +2 N</text><text x="35" y="1580" font-size="19" fill="#203247" text-anchor="start">Le due scale degli assi sono uguali.</text></svg>
