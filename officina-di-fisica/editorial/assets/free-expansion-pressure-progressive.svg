<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1110" role="img" aria-labelledby="title desc">
<title id="title">L’espansione libera occupa lo spazio prima vuoto</title>
<desc id="desc">Un recipiente totale di due litri è rigido e isolato. Inizialmente un litro contiene gas e l’altro è vuoto; alla fine il gas occupa entrambi. La temperatura finale ideale è invariata, la pressione si dimezza e l’entropia aumenta.</desc>
<rect width="640" height="1110" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Il vuoto è già dentro il recipiente</text>
<rect x="105" y="95" width="400" height="140" fill="white" stroke="#14243a" stroke-width="6"/>
<rect x="109" y="99" width="196" height="132" fill="#dceef6"/><path d="M305 98V232" stroke="#14243a" stroke-width="4"/>
<g fill="#165a87"><circle cx="140" cy="130" r="5"/><circle cx="195" cy="130" r="5"/><circle cx="250" cy="130" r="5"/><circle cx="140" cy="185" r="5"/><circle cx="195" cy="185" r="5"/><circle cx="250" cy="185" r="5"/></g>
<text x="350" y="172">Vuoto</text><text x="132" y="272">V₀ = 1 L</text><text x="352" y="272">Vᵥ = 1 L</text>
<text x="32" y="312">p₁ = 100 kPa ; T₁ &gt; 0</text><text x="32" y="344" font-size="17">Stessa scala geometrica nei primi due pannelli.</text>
<path d="M32 371H608" stroke="#9babbc"/>
<text x="32" y="415" font-size="25" font-weight="bold">2 · Il setto è rimosso, il gas si assesta</text>
<rect x="105" y="465" width="400" height="140" fill="#dceef6" stroke="#14243a" stroke-width="6"/>
<g fill="#165a87"><circle cx="140" cy="500" r="5"/><circle cx="285" cy="500" r="5"/><circle cx="450" cy="500" r="5"/><circle cx="190" cy="555" r="5"/><circle cx="350" cy="555" r="5"/><circle cx="475" cy="555" r="5"/></g>
<text x="170" y="640">V_f = V₀ + Vᵥ = 2 L</text>
<text x="32" y="681">Q = 0 ; W = 0 ; ΔU = 0 ; T_f = T₁</text>
<text x="32" y="715" font-size="18">ΔS &gt; 0: non è un’adiabatica reversibile.</text>
<path d="M32 746H608" stroke="#9babbc"/>
<text x="32" y="790" font-size="25" font-weight="bold">3 · La stessa quantità di gas in 2 V₀</text>
<path d="M150 818V997" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="844" width="300" height="34" fill="#165a87"/><rect x="150" y="922" width="150" height="34" fill="#28664d"/>
<text x="50" y="870">p₁</text><text x="465" y="870">100 kPa</text><text x="50" y="948">p_f</text><text x="315" y="948">50 kPa</text>
<text x="32" y="1031" font-size="18">Origine x = 150; pressione a 3 px/kPa.</text>
<text x="32" y="1066" font-size="18">Punti schematici: non misurano la temperatura.</text>
</g></svg>
