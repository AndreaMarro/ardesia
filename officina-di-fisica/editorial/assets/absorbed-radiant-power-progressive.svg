<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Potenza trasmessa e assorbita</title><desc id="desc">Tre tappe: bilancio otto uguale quattro più quattro watt; barre composte a ingresso otto watt con trasmittanza un mezzo o un quarto; due altre preparazioni assorbono quattro e nove watt e hanno media tredici mezzi watt.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Potenza trasmessa e assorbita</text><text x="32" y="92" font-size="22" text-anchor="start">1 · Il bilancio senza altri canali</text><text x="128" y="194" font-size="18" text-anchor="end">Ingresso</text><rect x="150" y="170" width="320" height="32" fill="#52667a"/><text x="482" y="194" font-size="18" text-anchor="start">8 W</text><text x="128" y="284" font-size="18" text-anchor="end">Trasmessa</text><rect x="150" y="260" width="160" height="32" fill="#316b9b"/><text x="322" y="284" font-size="18" text-anchor="start">4 W</text><text x="128" y="374" font-size="18" text-anchor="end">Assorbita</text><rect x="150" y="350" width="160" height="32" fill="#a76d20"/><text x="322" y="374" font-size="18" text-anchor="start">4 W</text><text x="32" y="440" font-size="18" text-anchor="start">8 W = 4 W + 4 W; τ = 1/2.</text><text x="32" y="505" font-size="22" text-anchor="start">2 · A P₀ = 8 W, cambia il complemento</text><text x="32" y="552" font-size="18" text-anchor="start">Blu: trasmessa · Ocra: assorbita</text><text x="128" y="644" font-size="18" text-anchor="end">τ = 1/2</text><rect x="150" y="620" width="160" height="32" fill="#316b9b"/><rect x="310" y="620" width="160" height="32" fill="#a76d20"/><text x="230.0" y="685" font-size="18" text-anchor="middle">4 W</text><text x="390.0" y="685" font-size="18" text-anchor="middle">4 W</text><text x="128" y="774" font-size="18" text-anchor="end">τ = 1/4</text><rect x="150" y="750" width="80" height="32" fill="#316b9b"/><rect x="230" y="750" width="240" height="32" fill="#a76d20"/><text x="190.0" y="815" font-size="18" text-anchor="middle">2 W</text><text x="350.0" y="815" font-size="18" text-anchor="middle">6 W</text><text x="32" y="880" font-size="18" text-anchor="start">Ogni barra intera rappresenta gli stessi 8 W.</text><text x="32" y="945" font-size="22" text-anchor="start">3 · Due prove e la media assorbita</text><text x="32" y="987" font-size="18" text-anchor="start">A: 8 W, τ = 1/2 · B: 12 W, τ = 1/4</text><text x="128" y="1074" font-size="18" text-anchor="end">A</text><rect x="150" y="1050" width="128" height="32" fill="#a76d20"/><text x="290" y="1074" font-size="18" text-anchor="start">4 W</text><text x="128" y="1174" font-size="18" text-anchor="end">B</text><rect x="150" y="1150" width="288" height="32" fill="#a76d20"/><text x="450" y="1174" font-size="18" text-anchor="start">9 W</text><text x="128" y="1274" font-size="18" text-anchor="end">Media</text><rect x="150" y="1250" width="208" height="32" fill="#a76d20"/><text x="370" y="1274" font-size="18" text-anchor="start">13/2 W</text><text x="32" y="1390" font-size="18" text-anchor="start">Scala comune alle tre potenze assorbite.</text><text x="32" y="1435" font-size="18" text-anchor="start">P_ass = P₀(1 − τ), non P₀τ.</text></g></svg>
