<svg xmlns="http://www.w3.org/2000/svg" width="480" height="840" viewBox="0 0 480 840" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">Due cambiamenti, una sola potenza relativa</title>
<desc id="desc">Sulla stessa corda con tensione e densità lineare invariate, la velocità è costante. La barra iniziale vale uno. Un confronto intermedio con sola ampiezza moltiplicata per tre mezzi vale nove quarti. Nello stato finale la frequenza è anche dimezzata e la potenza vale nove sedicesimi. Tutte le barre usano la stessa scala: centoventotto pixel per unità di potenza relativa.</desc>
<rect width="480" height="840" fill="#faf7ee"/>
<g fill="#123c39"><text x="28" y="42" font-size="28" font-weight="700">Potenza sulla stessa corda</text><text x="28" y="94" font-size="26">Stessa μ e stessa tensione T</text><text x="28" y="134" font-size="26">La velocità v rimane fissata</text><text x="28" y="174" font-size="26">P media ∝ A² f²</text></g>
<g stroke="#16736b" stroke-width="2" fill="none"><path d="M28 202H452"/><path d="M28 382H452"/><path d="M28 562H452"/></g>
<g fill="#123c39" font-size="26"><text x="28" y="246" font-weight="700">1. Stato iniziale</text><text x="28" y="286">Ampiezza A₁, frequenza f₁</text></g>
<rect x="60" y="312" width="128" height="40" fill="#16736b"/><text x="202" y="341" fill="#123c39" font-size="28">1</text>
<g fill="#123c39" font-size="26"><text x="28" y="426" font-weight="700">2. Confronto intermedio</text><text x="28" y="466">A₂ = 3A₁/2, frequenza f₁</text></g>
<rect x="60" y="492" width="288" height="40" fill="#ac3825"/><text x="362" y="521" fill="#123c39" font-size="28">9/4</text>
<g fill="#123c39" font-size="26"><text x="28" y="606" font-weight="700">3. Stato finale</text><text x="28" y="646">A₂ = 3A₁/2, f₂ = f₁/2</text></g>
<rect x="60" y="672" width="72" height="40" fill="#16736b"/><text x="146" y="701" fill="#123c39" font-size="28">9/16</text>
<g fill="#123c39" font-size="26"><text x="28" y="768">Lunghezza delle barre: P/P₁</text><text x="28" y="810">Onde sinusoidali a regime</text></g>
</svg>
