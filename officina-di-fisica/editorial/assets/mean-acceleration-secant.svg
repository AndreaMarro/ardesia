<g font-size="18" text-anchor="end"><text x="83" y="106">6</text><text x="83" y="186">4</text><text x="83" y="266">2</text><text x="83" y="346">0</text><text x="83" y="466">6</text><text x="83" y="546">4</text><text x="83" y="626">2</text><text x="83" y="706">0</text><text x="83" y="826">6</text><text x="83" y="906">4</text><text x="83" y="986">2</text><text x="83" y="1066">0</text></g>
