<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1220" role="img" aria-labelledby="title desc">
<title id="title">Accelerazione media da due estremi</title><desc id="desc">Tre grafici velocità-tempo con scala identica: 120 unità SVG per secondo e 40 per metro al secondo. Punti misurati zero secondi, due metri al secondo e due secondi, sei metri al secondo. La differenza verticale è quattro metri al secondo e quella orizzontale due secondi. La pendenza della secante è due metri al secondo quadrato. La secante non assegna la velocità agli istanti intermedi.</desc>
<rect width="640" height="1220" rx="18" fill="#faf8f2"/>
<g font-family="system-ui,sans-serif" fill="#142f3b"><text x="28" y="37" font-size="23" font-weight="700">Due misure, una media</text>
<g font-size="21" font-weight="650"><text x="28" y="79">1 · Leggi le velocità agli estremi</text><text x="28" y="439">2 · Costruisci le differenze</text><text x="28" y="799">3 · Dividi il salto per la durata</text></g>
