<g font-size="19"><text x="365" y="162">vᵢ = 2 m/s</text><text x="365" y="195">v_f = 6 m/s</text><text x="365" y="535">Δv = 4 m/s</text><text x="155" y="653">Δt = 2 s</text><text x="365" y="895">A = +2 m/s²</text><text x="155" y="1013">Δt = 2 s</text><text x="28" y="1140">Tratteggio: secante fra le due misure.</text><text x="28" y="1175">Le velocità intermedie non sono assegnate.</text></g></g></svg>
