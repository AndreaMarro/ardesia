<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1490" role="img" aria-labelledby="title desc">
<title id="title">Nodi comuni e corrente di un ramo aperto</title><desc id="desc">Due resistori da2 ohm fra gli stessi nodi danno equivalente1 ohm. Nel caso distinto3 e6 ohm, il ramo3 ohm è aperto e rimane soltanto6 ohm alla stessa tensione positiva. I totali1 e2 ohm di due prove hanno media3/2 ohm.</desc>
<rect width="640" height="1490" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Due rami fra gli stessi nodi</text>
<text x="32" y="82" font-size="18">La tensione è comune ; si sommano le correnti.</text>
<g fill="none" stroke="#14243a" stroke-width="3"><path d="M60 230H130V155H250M390 155H510V305H390M250 305H130V230M510 230H570"/><rect x="250" y="135" width="140" height="40"/><rect x="250" y="285" width="140" height="40"/></g>
<circle cx="130" cy="230" r="5" fill="#165a87"/><circle cx="510" cy="230" r="5" fill="#165a87"/>
<text x="91" y="270">A</text><text x="527" y="270">B</text><text x="290" y="120">2 Ω</text><text x="290" y="355">2 Ω</text>
<text x="32" y="405">G_eq = 1/2 S + 1/2 S = 1 S.</text>
<text x="32" y="447">R_eq = 1 Ω.</text>
<path d="M32 488H608" stroke="#9babbc"/>
<text x="32" y="533" font-size="25" font-weight="bold">2 · Apriamo soltanto un ramo</text>
<text x="32" y="574" font-size="18">Caso distinto: 3 Ω e 6 Ω ; V_AB &gt; 0 resta costante.</text>
<g fill="none" stroke="#14243a" stroke-width="3"><path d="M60 730H130V655H180M240 655H250M390 655H510V805H390M250 805H130V730M510 730H570"/><rect x="250" y="635" width="140" height="40"/><rect x="250" y="785" width="140" height="40"/></g>
<path d="M180 655L220 620" fill="none" stroke="#b45328" stroke-width="3"/>
<circle cx="180" cy="655" r="4" fill="#b45328"/><circle cx="240" cy="655" r="4" fill="#b45328"/>
<circle cx="130" cy="730" r="5" fill="#165a87"/><circle cx="510" cy="730" r="5" fill="#165a87"/>
<text x="290" y="620">3 Ω</text><text x="290" y="855">6 Ω</text>
<text x="32" y="900">Prima: I_i = V_AB / (2 Ω).</text><text x="32" y="942">Dopo: I_f = V_AB / (6 Ω) ; I_f/I_i = 1/3.</text>
<path d="M32 982H608" stroke="#9babbc"/>
<text x="32" y="1027" font-size="25" font-weight="bold">3 · Equivalenti di due prove distinte</text>
<text x="32" y="1067" font-size="18">A: rami 2 Ω e 2 Ω ; B: rami 3 Ω e 6 Ω.</text>
<path d="M150 1095V1350" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="1115" width="160" height="34" fill="#165a87"/>
<rect x="150" y="1195" width="320" height="34" fill="#b45328"/>
<rect x="150" y="1275" width="240" height="34" fill="#28664d"/>
<text x="50" y="1140">A</text><text x="330" y="1140">1 Ω</text><text x="50" y="1220">B</text><text x="490" y="1220">2 Ω</text>
<text x="32" y="1300">Media</text><text x="410" y="1300">3/2 Ω</text><text x="125" y="1344">0</text>
<text x="32" y="1400" font-size="18">Le barre condividono origine e scala in ohm.</text><text x="32" y="1440" font-size="18">Il parallelo ai dati medi darebbe 20/13 Ω.</text>
</g></svg>
