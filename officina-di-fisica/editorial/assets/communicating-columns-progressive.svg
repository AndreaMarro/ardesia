<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc"><title id="title">Due liquidi e una quota comune</title><desc id="desc">Tubo a U: liquido uno con densità un chilogrammo al litro sopra il liquido due di densità due chilogrammi al litro. Altezze dieci e cinque centimetri alla scala venti pixel per centimetro dalla quota dell’interfaccia. Pressioni alla quota comune uguali. Confronto finale separato a densità uguali e altezze entrambe dieci centimetri.</desc><rect width="640" height="1600" rx="20" fill="#faf8f1"/>
<g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Confronta la pressione alla stessa quota</text><text x="28" y="88">Superfici libere alla stessa pressione p₀.</text><path d="M140 350H220V460H420V250H500V540H140Z" fill="#bad9e5"/><rect x="140" y="150" width="80" height="200" fill="#edcd94"/><path d="M140 120V540H500V220M220 120V460H420V220" fill="none" stroke="#597f83" stroke-width="3"/><path d="M120 350H520" stroke="#193a49" stroke-dasharray="6 5"/><path d="M80 150V350M70 150H90M70 350H90M550 250V350M540 250H560M540 350H560" stroke="#193a49" fill="none"/><text x="15" y="245">10 cm</text><text x="560" y="305">5 cm</text><text x="145" y="135">p₀</text><text x="440" y="235">p₀</text><text x="245" y="190">ρ₁ = 1 kg/L</text><text x="245" y="430">ρ₂ = 2 kg/L</text><circle cx="180" cy="350" r="5" fill="#193a49"/><circle cx="460" cy="350" r="5" fill="#193a49"/><text x="165" y="385">A</text><text x="455" y="385">B</text><text x="250" y="335">z = 0</text><text x="28" y="595">Geometria: 20 px/cm. h₁ = 10 cm; h₂ = 5 cm.</text><text x="28" y="640">A e B: stessa quota nel liquido connesso.</text>
<text x="28" y="720" font-size="25">2 · Le due colonne danno lo stesso aumento</text><text x="28" y="765">Solo per questi valori: g = 10 m/s².</text><text x="28" y="815">ρ₁ = 1000 kg/m³; h₁ = 1/10 m.</text><text x="28" y="860">ρ₂ = 2000 kg/m³; h₂ = 1/20 m.</text><rect x="250" y="900" width="200" height="32" fill="#edcd94"/><rect x="250" y="975" width="200" height="32" fill="#bad9e5"/><text x="28" y="925">ρ₁gh₁</text><text x="28" y="1000">ρ₂gh₂</text><text x="470" y="925">1 kPa</text><text x="470" y="1000">1 kPa</text><text x="28" y="1060">Pressioni relative: 200 px/kPa, scala separata.</text><text x="28" y="1105">p_A = p_B = p₀ + 1 kPa.</text>
<text x="28" y="1185" font-size="25">3 · Altra prova: densità uguali, liquidi distinti</text><text x="28" y="1230">ρ₁ = ρ₂ = 1 kg/L; immiscibili, equilibrio neutro.</text><rect x="140" y="1280" width="80" height="200" fill="#edcd94"/><rect x="420" y="1280" width="80" height="200" fill="#bad9e5"/><path d="M120 1480H520M120 1280H520" stroke="#809b97" stroke-dasharray="6 5"/><text x="245" y="1395">10 cm</text><text x="28" y="1530">Stessa scala 20 px/cm; entrambe le altezze 10 cm.</text><text x="28" y="1575">La non miscibilità non richiede densità diverse.</text></g></svg>
