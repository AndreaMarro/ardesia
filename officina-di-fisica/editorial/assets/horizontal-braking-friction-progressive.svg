<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1490" viewBox="0 0 640 1490" role="img" aria-labelledby="title desc"><title id="title">Attrito fino al primo arresto</title><desc id="desc">Tre pannelli: diagramma delle forze, distanza di un metro e grafico velocità tempo fino a un secondo con prosecuzione a velocità zero. Forze cinque pixel per newton; distanza duecentoquaranta pixel per metro; tempo duecentoquaranta pixel per secondo e velocità ottanta pixel per metro al secondo.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1490" rx="20" fill="#faf8f1"/>
<g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Forze durante lo scorrimento</text><text x="28" y="90">Esempio: m = 2 kg; μ = 1/5; g = 10 m/s².</text><circle cx="300" cy="245" r="7" fill="#193a49"/><path d="M300 245V145" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M300 245V345" stroke="#be6249" stroke-width="3" marker-end="url(#a)"/><path d="M300 245H280" stroke="#be6249" stroke-width="3" marker-end="url(#a)"/><text x="330" y="160">N = 20 N</text><text x="330" y="350">P = 20 N</text><text x="80" y="235">f = 4 N</text><text x="28" y="405">Forze: 5 px/N. Nessuna forza motrice.</text><text x="28" y="450">Scorrimento verso destra, attrito verso sinistra.</text>
<text x="28" y="530" font-size="25">2 · Il blocco percorre un metro</text><path d="M80 680H540" stroke="#7e9992" stroke-width="2"/><rect x="100" y="620" width="50" height="60" fill="#cde4e6" stroke="#193a49"/><rect x="340" y="620" width="50" height="60" fill="#e6d8bc" stroke="#193a49"/><path d="M100 710H340M100 700V720M340 700V720" stroke="#193a49" fill="none"/><text x="85" y="590">v = 2 m/s</text><text x="340" y="590">v = 0</text><text x="85" y="765">x = 0</text><text x="330" y="765">x = 1 m</text><text x="190" y="715"> </text><text x="185" y="810">D = 1 m</text><text x="28" y="855">Distanza: 240 px/m. Corpi schematici.</text>
<text x="28" y="945" font-size="25">3 · La velocità non cambia verso</text><path d="M100 1240V1000M75 1210H540" stroke="#7e9992" stroke-width="2" fill="none"/><path d="M100 1210V1050L340 1210Z" fill="#cde4e6"/><path d="M100 1050L340 1210H500" stroke="#08869b" stroke-width="3" fill="none"/><text x="28" y="1000">v_x (m/s)</text><text x="65" y="1060">2</text><text x="75" y="1235">0</text><text x="330" y="1250">1</text><text x="500" y="1250">t (s)</text><text x="145" y="1165">area = 1 m</text><text x="28" y="1300">Tempo: 240 px/s. Velocità: 80 px per m/s.</text><text x="28" y="1345">Durante il moto: a_x = −2 m/s²; arresto a 1 s.</text><text x="28" y="1390">Dopo: nessuna spinta, attrito statico richiesto 0.</text><text x="28" y="1435">Lavoro d’attrito −4 J; calo cinetico 4 J.</text><text x="28" y="1470">L’attrito dinamico non si prolunga oltre l’arresto.</text></g></svg>
