<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1580" width="640" height="1580" role="img" aria-labelledby="title desc">
<title id="title">Scala in decibel, tragitto dell’eco e onda nell’acqua</title>
<desc id="desc">Una tabella collega zero, dieci e cinquanta decibel a uno, dieci e centomila volte il riferimento. L’eco percorre due tratte di cinquantuno metri. L’onda in acqua conserva frequenza mille hertz e ha creste separate da uno virgola quarantotto metri; l’altezza è una pressione schematica, non uno spostamento materiale.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1580" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" fill="#202c39">
<text x="32" y="52" font-size="27" font-weight="bold">1. Il livello confronta intensità</text>
<text x="32" y="95" font-size="23">Riferimento positivo: I₀ = 10⁻¹² W/m².</text>
<text x="65" y="191" font-size="23">Livello</text>
<text x="360" y="191" font-size="23">Intensità</text>
<text x="78" y="258" font-size="23">0 dB</text>
<text x="382" y="258" font-size="23">I₀</text>
<text x="78" y="338" font-size="23">10 dB</text>
<text x="382" y="338" font-size="23">10I₀</text>
<text x="78" y="418" font-size="23">50 dB</text>
<text x="382" y="418" font-size="23">10⁵I₀</text>
<path d="M205 250H330" fill="none" stroke="#304d63" stroke-width="3" marker-end="url(#tip)"/>
<path d="M205 330H330" fill="none" stroke="#304d63" stroke-width="3" marker-end="url(#tip)"/>
<path d="M205 410H330" fill="none" stroke="#304d63" stroke-width="3" marker-end="url(#tip)"/>
<text x="32" y="492" font-size="23">50 dB → 10⁵I₀ = 10⁻⁷ W/m².</text>
<text x="32" y="535" font-size="23">Quindi I = 0,10 μW/m².</text>
<line x1="32" y1="570" x2="608" y2="570" stroke="#b8c4ca"/>
<text x="32" y="625" font-size="27" font-weight="bold">2. L’eco conta entrambe le tratte</text>
<text x="32" y="668" font-size="23">Sorgente e microfono nello stesso punto.</text>
<circle cx="110" cy="830" r="35" fill="#dceaf0" stroke="#304d63" stroke-width="3"/>
<rect x="525" y="730" width="18" height="190" fill="#986c35"/>
<path d="M160 780H510" fill="none" stroke="#26728d" stroke-width="4" marker-end="url(#tip)"/>
<path d="M510 880H160" fill="none" stroke="#a1473c" stroke-width="4" marker-end="url(#tip)"/>
<text x="264" y="752" font-size="23">51 m</text>
<text x="264" y="921" font-size="23">51 m</text>
<text x="38" y="972" font-size="23">microfono</text>
<text x="500" y="972" font-size="23">parete</text>
<text x="32" y="1020" font-size="23">102 m in 0,30 s → velocità 340 m/s.</text>
<line x1="32" y1="1053" x2="608" y2="1053" stroke="#b8c4ca"/>
<text x="32" y="1108" font-size="27" font-weight="bold">3. La lunghezza d’onda in acqua</text>
<text x="32" y="1151" font-size="23">Frequenza trasmessa: 1,00 kHz.</text>
<text x="32" y="1195" font-size="23">Pressione: scala verticale schematica.</text>
<path d="M140 1300H560" fill="none" stroke="#304d63" stroke-width="3"/>
