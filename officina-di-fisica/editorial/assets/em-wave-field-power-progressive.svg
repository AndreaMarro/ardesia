<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Campi, intensità e potenza media</title><desc id="desc">Tre tappe: campo elettrico verso l’alto e magnetico uscente danno propagazione verso destra; intensità media e conversione dell’area; barre delle potenze tre decimi e dodici quinti watt e media ventisette ventesimi.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Campi, intensità e potenza media</text><text x="32" y="92" font-size="22" text-anchor="start">1 · Un istante dell’onda piana</text><line x1="260" y1="260" x2="260" y2="150" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="280" y1="280" x2="450" y2="280" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><circle cx="260" cy="280" r="12" fill="#f7fafc" stroke="#52667a" stroke-width="2"/><circle cx="260" cy="280" r="4" fill="#52667a"/><text x="280" y="155" font-size="18" text-anchor="start">E</text><text x="465" y="286" font-size="18" text-anchor="start">S</text><text x="185" y="330" font-size="18" text-anchor="start">B uscente</text><text x="32" y="390" font-size="18" text-anchor="start">Versi schematici: E × B indica S.</text><text x="32" y="480" font-size="22" text-anchor="start">2 · Intensità media e area</text><text x="32" y="530" font-size="18" text-anchor="start">E₀ = 150 V/m · Z₀ = 375 Ω</text><text x="32" y="585" font-size="18" text-anchor="start">I = E₀²/(2Z₀) = 30 W/m²</text><text x="32" y="640" font-size="18" text-anchor="start">A = 100 cm² = (1/100) m²</text><text x="32" y="695" font-size="18" text-anchor="start">P = IA = 3/10 W</text><text x="32" y="755" font-size="18" text-anchor="start">E₀ è il picco; il fattore 2 include la media.</text><text x="32" y="840" font-size="22" text-anchor="start">3 · Due potenze e la loro media</text><text x="32" y="887" font-size="18" text-anchor="start">A: 150 V/m, 100 cm² · B: 300 V/m, 200 cm²</text><text x="128" y="984" font-size="18" text-anchor="end">A</text><rect x="150" y="960" width="30" height="32" fill="#316b9b"/><text x="192" y="984" font-size="18" text-anchor="start">3/10 W</text><text x="128" y="1094" font-size="18" text-anchor="end">B</text><rect x="150" y="1070" width="240" height="32" fill="#316b9b"/><text x="402" y="1094" font-size="18" text-anchor="start">12/5 W</text><text x="128" y="1204" font-size="18" text-anchor="end">Media</text><rect x="150" y="1180" width="135" height="32" fill="#316b9b"/><text x="297" y="1204" font-size="18" text-anchor="start">27/20 W</text><text x="32" y="1310" font-size="18" text-anchor="start">Le barre hanno la stessa scala di potenza.</text><text x="32" y="1360" font-size="18" text-anchor="start">In B cambiano sia il picco sia l’area.</text><text x="32" y="1410" font-size="18" text-anchor="start">Non si usa il quadrato di un campo medio.</text></g></svg>
