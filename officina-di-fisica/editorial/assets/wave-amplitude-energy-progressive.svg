<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1580" viewBox="0 0 640 1580" role="img" aria-labelledby="title desc">
<title id="title">Il quadrato dell’ampiezza e il ruolo della frequenza</title><desc id="desc">Ampiezza da uno a due millimetri a frequenza uguale, intensità da uno a quattro watt al metro quadrato. Un confronto separato mantiene ampiezza e area ma cambia la frequenza di tre mezzi, ottenendo una potenza nove quarti.</desc>
<rect width="640" height="1580" rx="20" fill="#f7fbff"/>
<g font-family="system-ui,sans-serif" fill="#142d40" font-size="20">
<text x="35" y="48" font-size="25" font-weight="700">1 · Due ampiezze a frequenza uguale</text>
<text x="35" y="90">Stesso mezzo · piccole perturbazioni</text>
<path d="M95 300H550" stroke="#6e8b9c" stroke-width="2"/>
<path d="M200 300V250M430 300V200" stroke="#145d81" stroke-width="4"/>
<path d="M190 250H210M420 200H440" stroke="#145d81" stroke-width="2"/>
<text x="145" y="215">A₀ = 1 mm</text><text x="375" y="165">A = 2 mm</text>
<text x="240" y="340">Equilibrio</text>
<text x="35" y="390">Segmenti di spostamento: 50 px/mm</text>
<text x="35" y="435">s = A/A₀ = 2, senza dimensione</text>
<path d="M35 475H605" stroke="#b3cbd9"/>
<text x="35" y="525" font-size="25" font-weight="700">2 · La stessa coppia di onde</text>
<text x="35" y="565">Barre da zero: 100 px/(W/m²)</text>
<text x="35" y="625">Riferimento: I₀ = 1 W/m²</text>
<rect x="100" y="655" width="100" height="35" fill="#145d81"/><text x="220" y="682">1 W/m²</text>
<text x="35" y="765">Modificata: I = I₀s² = 4 W/m²</text>
<rect x="100" y="795" width="400" height="35" fill="#c65919"/><text x="510" y="822">4 W/m²</text>
<path d="M100 640V705M100 780V845" stroke="#6e8b9c" stroke-dasharray="6 5"/>
<text x="35" y="905">Ampiezza ×2 ⇒ intensità ×4</text>
<text x="35" y="950">Qui la frequenza resta la stessa.</text>
<path d="M35 985H605" stroke="#b3cbd9"/>
<text x="35" y="1035" font-size="25" font-weight="700">3 · Altro caso: cambia f, non A</text>
<text x="35" y="1075">Solo quesito 06 · stessa area e stesso A</text>
<text x="35" y="1120">I = Kf²A² · f₂/f₁ = 3/2 · P = IS</text>
<text x="35" y="1190">Barre di P/P₁: 100 px per unità pura</text>
<text x="35" y="1250">Prima onda</text><rect x="200" y="1225" width="100" height="35" fill="#145d81"/><text x="320" y="1252">1</text>
<text x="35" y="1350">Seconda</text><rect x="200" y="1325" width="225" height="35" fill="#c65919"/><text x="445" y="1352">9/4</text>
<path d="M200 1210V1380" stroke="#6e8b9c" stroke-dasharray="6 5"/>
<text x="35" y="1430">P₂/P₁ = (3/2)² = 9/4</text>
<text x="35" y="1480">A invariata non implica potenza invariata</text>
<text x="35" y="1525">quando cambia anche la frequenza.</text>
</g></svg>
