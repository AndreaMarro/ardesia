<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1810" width="640" height="1810" font-family="Arial, sans-serif" fill="#182d42" font-size="20" role="img" aria-labelledby="title desc">
<title id="title">Stevino: misura la profondità, poi la pressione relativa</title><desc id="desc">Due recipienti di diversa larghezza hanno punti alla stessa profondità due metri. Una seconda coppia confronta due e tre metri. La pressione relativa cresce da venti a trenta chilopascal. Le scale geometriche e quelle di pressione sono dichiarate separatamente.</desc>
<rect width="640" height="1810" fill="white"/>
<text x="32" y="46" font-size="24" font-weight="bold">1. La larghezza non cambia Δp</text><text x="32" y="84">Stesso liquido, stessa pressione p_s.</text><text x="32" y="120">ρ = 1 kg/L; g = 10 m/s²; quiete.</text>
<rect x="91" y="190" width="198" height="250" fill="#b5dcf1"/><rect x="421" y="190" width="78" height="250" fill="#b5dcf1"/>
<path d="M90 150V440H290V150M420 150V440H500V150" fill="none" stroke="#263f55" stroke-width="3"/>
<path d="M70 190H520" fill="none" stroke="#4d7a99" stroke-width="2" stroke-dasharray="7 5"/><path d="M70 390H520" fill="none" stroke="#b05b35" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="190" cy="390" r="6" fill="#b05b35"/><circle cx="460" cy="390" r="6" fill="#b05b35"/>
<text x="32" y="478">Superficie: Δp = 0.</text><text x="32" y="512">Entrambi i punti: h = 2 m, Δp = 20 kPa.</text><text x="32" y="546" font-size="18">200 px sotto la superficie; scala 100 px/m.</text>
<path d="M32 584H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="634" font-size="24" font-weight="bold">2. Confronta le profondità verticali</text><text x="32" y="672">Stesso liquido, densità uniforme.</text>
<rect x="101" y="730" width="138" height="350" fill="#b5dcf1"/><rect x="371" y="730" width="138" height="350" fill="#b5dcf1"/>
<path d="M100 710V1080H240V710M370 710V1080H510V710" fill="none" stroke="#263f55" stroke-width="3"/>
<path d="M90 730H250M360 730H520" stroke="#4d7a99" stroke-width="2"/>
<circle cx="170" cy="930" r="7" fill="#b05b35"/><circle cx="440" cy="1030" r="7" fill="#b05b35"/>
<path d="M170 730V930M440 730V1030" stroke="#b05b35" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110" y="1130">A: h = 2 m</text><text x="380" y="1130">B: h = 3 m</text><text x="32" y="1176">Tratti verticali: 200 px e 300 px.</text><text x="32" y="1210" font-size="18">Stessa scala di profondità: 100 px/m.</text>
<path d="M32 1248H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="1298" font-size="24" font-weight="bold">3. Calcola il peso per unità di area</text><text x="32" y="1336">Δp = ρgh = (10 kPa/m) h.</text>
<text x="44" y="1404">A</text><rect x="90" y="1375" width="160" height="40" fill="#84c7eb"/><text x="278" y="1404">20 kPa</text>
<text x="44" y="1484">B</text><rect x="90" y="1455" width="240" height="40" fill="#84c7eb"/><text x="358" y="1484">30 kPa</text>
<text x="32" y="1544">Barre: 160 px e 240 px, scala 8 px/kPa.</text><text x="32" y="1590">Il rapporto delle pressioni relative è 3/2.</text><text x="32" y="1640">La pressione assoluta è p_s + Δp.</text><text x="32" y="1674">Alla superficie non è necessariamente zero.</text><text x="32" y="1730" font-size="18">Scale di profondità e pressione indipendenti.</text><text x="32" y="1764" font-size="18">I recipienti sono schematici; conta la quota.</text>
</svg>
