<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1730" viewBox="0 0 640 1730" role="img" aria-labelledby="title desc"><title id="title">Pressione, volume e temperatura assoluta</title><desc id="desc">Due rettangoli di stato mostrano pV, non lavoro di un percorso. Primo stato tre litri a cento kilopascal e trecento kelvin; secondo due litri a duecento kilopascal e quattrocento kelvin. Un terzo confronto distingue la stessa pressione da temperature diverse.</desc><rect width="640" height="1730" rx="24" fill="#f5faff"/><g font-family="Arial,sans-serif" font-size="20" fill="#163047"><text x="35" y="50" font-size="26" font-weight="bold">1 · Stato A: nR = 1 J/K</text><text x="35" y="100">T = 300 K · V = 3 L · p = 100 kPa</text><text x="35" y="150">100 px/L · 1 px/kPa</text><path d="M100 430V220M100 430H510" stroke="#163047" stroke-width="3"/><rect x="100" y="330" width="300" height="100" fill="#196082" fill-opacity="0.22" stroke="#196082" stroke-width="3"/><text x="35" y="337">100</text><text x="80" y="470">0</text><text x="393" y="470">3</text><text x="465" y="470">V (L)</text><text x="35" y="205">p (kPa)</text><text x="155" y="385">pV = 300 J</text><text x="35" y="520">Area del rettangolo di stato, non lavoro</text><path d="M35 565H605" stroke="#b5cbd9"/><text x="35" y="620" font-size="26" font-weight="bold">2 · Stato B dello stesso campione</text><text x="35" y="670">T = 400 K · V = 2 L · p = 200 kPa</text><text x="35" y="720">Stesse scale: 100 px/L e 1 px/kPa</text><path d="M100 1010V770M100 1010H510" stroke="#163047" stroke-width="3"/><rect x="100" y="810" width="200" height="200" fill="#bc5315" fill-opacity="0.22" stroke="#bc5315" stroke-width="3"/><text x="35" y="817">200</text><text x="80" y="1050">0</text><text x="293" y="1050">2</text><text x="465" y="1050">V (L)</text><text x="35" y="765">p (kPa)</text><text x="130" y="920">pV = 400 J</text><text x="35" y="1110">Nessun cammino è tracciato fra A e B.</text><path d="M35 1155H605" stroke="#b5cbd9"/><text x="35" y="1210" font-size="26" font-weight="bold">3 · Stessa p, volume diverso</text><text x="35" y="1260">Solo caso 15 · p = 200 kPa in B e C</text><text x="35" y="1310">Barre dei volumi da zero: 100 px/L</text><text x="35" y="1370">B: V = 2 L · T = 400 K · S = 401</text><rect x="100" y="1400" width="200" height="35" fill="#196082"/><text x="35" y="1500">C: V = 3 L · T = 600 K · S = 401</text><rect x="100" y="1530" width="300" height="35" fill="#bc5315"/><text x="35" y="1640">La lettura S identifica qui la pressione,</text><text x="35" y="1680">non l’intero stato termodinamico.</text></g></svg>
