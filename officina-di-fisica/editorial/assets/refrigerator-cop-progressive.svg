<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1410" viewBox="0 0 640 1410" role="img" aria-labelledby="title desc"><title id="title">Frigorifero: il calore utile viene dal freddo</title><desc id="desc">Schema di un frigorifero: cento joule dalla sorgente fredda e venti joule di lavoro entrano nella macchina; centoventi joule sono ceduti alla sorgente calda. Barre energetiche alla scala tre pixel per joule. Coefficienti di prestazione cinque e uno con media tre.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#196082"/></marker></defs><rect width="640" height="1410" rx="20" fill="#f5faff"/><g font-family="Arial,sans-serif" font-size="20" fill="#163047"><text x="35" y="50" font-size="26" font-weight="bold">1 · Due ingressi, un’uscita al caldo</text><text x="35" y="100">Frecce schematiche, senza scala metrica</text><rect x="40" y="160" width="160" height="70" rx="8" fill="#d7e9f4"/><text x="80" y="203">Fredda</text><rect x="250" y="210" width="160" height="120" rx="8" fill="#e0edf3" stroke="#163047" stroke-width="3"/><text x="292" y="250">Frigo</text><text x="270" y="300">ΔU_ciclo = 0</text><rect x="440" y="160" width="160" height="70" rx="8" fill="#f4ddce"/><text x="485" y="203">Calda</text><path d="M200 195H225V245H240" fill="none" stroke="#196082" stroke-width="4" marker-end="url(#a)"/><path d="M420 245H430V195H440" fill="none" stroke="#196082" stroke-width="4" marker-end="url(#a)"/><path d="M330 430V345" stroke="#196082" stroke-width="4" marker-end="url(#a)"/><text x="45" y="280">Q_c = 100 J</text><text x="450" y="280">Q_h = 120 J</text><text x="365" y="405">W = 20 J</text><text x="35" y="475">Il COP frigorifero è Q_c/W = 5.</text><text x="35" y="515">Il lavoro è ricevuto, non prodotto.</text><path d="M35 550H605" stroke="#b5cbd9"/><text x="35" y="605" font-size="26" font-weight="bold">2 · Il bilancio conserva l’energia</text><text x="35" y="650">Scala comune: 3 px/J, barre da zero</text><rect x="100" y="695" width="300" height="45" fill="#447f99"/><rect x="400" y="695" width="60" height="45" fill="#39745b"/><text x="165" y="725" fill="white">Q_c = 100 J</text><path d="M430 740V770H460" fill="none" stroke="#39745b"/><text x="470" y="777">W = 20 J</text><rect x="100" y="815" width="360" height="45" fill="#a96337"/><text x="200" y="845" fill="white">Q_h = 120 J</text><text x="35" y="910">Q_h = Q_c + W = 120 J</text><text x="35" y="950">Q_h/W = 6 riguarda la pompa di calore.</text><path d="M35 990H605" stroke="#b5cbd9"/><text x="35" y="1045" font-size="26" font-weight="bold">3 · Due COP, media a pesi uguali</text><text x="35" y="1090">Scala: 40 px per unità di COP</text><text x="50" y="1160">A</text><rect x="140" y="1135" width="200" height="35" fill="#196082"/><text x="355" y="1160">5</text><text x="50" y="1230">B</text><rect x="140" y="1205" width="40" height="35" fill="#196082"/><text x="195" y="1230">1</text><text x="35" y="1300">Media</text><rect x="140" y="1275" width="120" height="35" fill="#39745b"/><text x="275" y="1300">3</text><text x="35" y="1365">COP maggiore di 1 non crea energia.</text></g></svg>
