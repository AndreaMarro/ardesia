<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1220" role="img" aria-labelledby="title desc">
<title id="title">Posizione quadratica nel tempo</title><desc id="desc">Tre grafici posizione-tempo con stessa scala: 120 unità SVG per secondo e 25 per metro. Con partenza all’origine da fermo e accelerazione costante quattro metri al secondo quadrato, x vale due volte t al quadrato in unità SI. La curva è una parabola verso l’alto con tangente iniziale orizzontale. I punti a un secondo e due secondi sono due e otto metri; i due incrementi sono due e sei metri.</desc>
<rect width="640" height="1220" rx="18" fill="#faf8f2"/>
<g font-family="system-ui,sans-serif" fill="#142f3b"><text x="28" y="37" font-size="23" font-weight="700">Posizione e tempo su due assi</text>
<g font-size="21" font-weight="650"><text x="28" y="79">1 · Parti dall’origine con pendenza zero</text><text x="28" y="439">2 · Leggi due punti della parabola</text><text x="28" y="799">3 · Confronta gli incrementi</text></g>
