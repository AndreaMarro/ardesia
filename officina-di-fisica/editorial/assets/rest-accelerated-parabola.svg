<g font-size="19"><text x="365" y="180">a = 4 m/s²</text><text x="365" y="216">v₀ = 0</text><text x="365" y="258">Tangente iniziale:</text><text x="365" y="287">orizzontale</text><text x="365" y="548">x(1 s) = 2 m</text><text x="365" y="584">x(2 s) = 8 m</text><text x="460" y="944">6 m</text><text x="410" y="1043">2 m</text><text x="28" y="1140">Stessa durata di 1 s: prima 2 m, poi 6 m.</text><text x="28" y="1175">La traiettoria nello spazio resta rettilinea.</text></g></g></svg>
