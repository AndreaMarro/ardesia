<g font-size="18" text-anchor="end"><text x="83" y="146">8</text><text x="83" y="196">6</text><text x="83" y="246">4</text><text x="83" y="296">2</text><text x="83" y="346">0</text><text x="83" y="506">8</text><text x="83" y="556">6</text><text x="83" y="606">4</text><text x="83" y="656">2</text><text x="83" y="706">0</text><text x="83" y="866">8</text><text x="83" y="916">6</text><text x="83" y="966">4</text><text x="83" y="1016">2</text><text x="83" y="1066">0</text></g>
