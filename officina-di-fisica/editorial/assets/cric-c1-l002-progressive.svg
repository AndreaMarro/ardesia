<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1740"><title>Componenti, differenza e proiezione</title><desc>Tre costruzioni distinte. Una forza di 12 N a 120 gradi ha componente x meno 6 N. B meno A forma un triangolo 3–4–5 in metri. Una fune di 2,4 m a 30 gradi dalla verticale ha proiezione orizzontale 1,2 m.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28738d" /></marker></defs><rect width="640" height="1740" fill="white" /><g font-family="Arial,sans-serif" fill="#18354b" font-size="20"><text x="32" y="44" font-size="26">Vettori: leggere assi e angoli</text><text x="32" y="105" font-size="23">1 · La componente può essere negativa</text><path d="M95 400H535M335 470V145" stroke="#879da8" fill="none" /><text x="545" y="405">x</text><text x="345" y="155">y</text><text x="344" y="425">O</text><path d="M335 400L215 192.154" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><path d="M215 192.154V400" stroke="#a66e36" stroke-dasharray="6 5" /><path d="M335 400H215" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><path d="M395 400A60 60 0 0 0 305 348.038" fill="none" stroke="#a66e36" /><text x="375" y="325">120°</text><text x="180" y="175">F = 12 N</text><text x="190" y="440">Fₓ = −6 N</text><text x="32" y="505">cos 120° = −1/2, quindi Fₓ = −6 N.</text><text x="32" y="575" font-size="23">2 · Differenza fra le punte</text><path d="M100 900H570M220 1010V630" fill="none" stroke="#879da8" /><text x="578" y="905">x</text><text x="230" y="645">y</text><text x="194" y="925">O</text><path d="M220 900L300 1020" stroke="#8b7045" stroke-width="3" marker-end="url(#a)" /><path d="M220 900L420 860" stroke="#6e8a5c" stroke-width="3" marker-end="url(#a)" /><path d="M300 1020H420V860" stroke="#879da8" stroke-dasharray="6 5" fill="none" /><path d="M300 1020L420 860" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><text x="250" y="1055">A (2, −3) m</text><text x="430" y="850">B (5, 1) m</text><text x="332" y="1055"> </text><text x="337" y="1000">3 m</text><text x="435" y="950">4 m</text><text x="270" y="925">5 m</text><text x="32" y="1110">Ogni passo sugli assi vale 1 m.</text><text x="32" y="1150">D = (3, 4) m; il modulo è 5 m.</text><text x="32" y="1230" font-size="23">3 · L’angolo parte dalla verticale</text><path d="M240 1290V1530H378.564Z" stroke="#879da8" stroke-dasharray="6 5" fill="none" /><path d="M240 1290L378.564 1530" stroke="#28738d" stroke-width="4" /><path d="M240 1350A60 60 0 0 0 270 1341.962" fill="none" stroke="#a66e36" /><text x="248" y="1385">30°</text><text x="360" y="1390">ℓ = 2,4 m</text><text x="265" y="1570">d = 1,2 m</text><text x="32" y="1640">d = ℓ sin 30° = ℓ/2.</text><text x="32" y="1690">La fune è l’ipotenusa, d il cateto opposto.</text></g></svg>