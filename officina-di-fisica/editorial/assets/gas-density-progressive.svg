<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1550" viewBox="0 0 640 1550" role="img" aria-labelledby="title desc"><title id="title">Dalle moli alla massa per volume</title><desc id="desc">La legge del gas fornisce moli per volume, la massa molare converte in massa per volume. Barre di densità uno e quattro grammi per litro e caso separato di energia media molecolare triplicata.</desc><rect width="640" height="1550" rx="24" fill="#f5faff"/><g font-family="Arial,sans-serif" font-size="20" fill="#163047"><text x="35" y="50" font-size="26" font-weight="bold">1 · Prima le moli, poi la massa</text><text x="35" y="105">pV = nRT → n/V = p/(RT)</text><text x="35" y="165">m = nM → ρ = pM/(RT)</text><text x="35" y="225">M = 32 g/mol</text><text x="35" y="280">R = 8 kPa·L/(mol·K), prescritto</text><text x="35" y="340">p = 80 kPa · T = 320 K</text><text x="35" y="400">ρ = 4 × 80/320 g/L = 1 g/L</text><text x="35" y="460">1 g/L = 1 kg/m³ · nessun fattore 1000</text><path d="M35 505H605" stroke="#b5cbd9"/><text x="35" y="560" font-size="26" font-weight="bold">2 · Pressione e temperatura diverse</text><text x="35" y="615">Barre da zero: 80 px/(g/L)</text><text x="35" y="675">A: 80 kPa, 320 K → 1 g/L</text><rect x="100" y="705" width="80" height="40" fill="#196082"/><text x="35" y="815">B: 160 kPa, 160 K → 4 g/L</text><rect x="100" y="845" width="320" height="40" fill="#bc5315"/><text x="35" y="955">Pressione ×2 e temperatura ×1/2</text><text x="35" y="1000">Densità ×4 · composizione invariata</text><path d="M35 1045H605" stroke="#b5cbd9"/><text x="35" y="1100" font-size="26" font-weight="bold">3 · Caso 08: energia per molecola</text><text x="35" y="1150">Legge fornita: ⟨K_trasl⟩ = (3/2) k_B T</text><text x="35" y="1205">Rapporto puro: 100 px per unità</text><text x="35" y="1260">300 K → energia normalizzata 1</text><rect x="100" y="1290" width="100" height="35" fill="#196082"/><text x="35" y="1390">900 K → energia normalizzata 3</text><rect x="100" y="1420" width="300" height="35" fill="#bc5315"/><text x="35" y="1510">Queste ultime barre non sono densità.</text></g></svg>
