<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Energia di eccitazione e fotone gamma</title><desc id="desc">Due livelli con zero comune, conteggi nucleari conservati e barre delle energie di due fotoni e della loro media.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#306f8c"/></marker></defs><rect x="0" y="0" width="640" height="1500" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Un salto energetico, non una traiettoria</text><text x="35" y="110" font-size="22" fill="#203247" text-anchor="start">1 · Stesso zero per E_i ed E_f</text><line x1="140" y1="490" x2="530" y2="490" stroke="#526474" stroke-width="2"/><line x1="140" y1="490" x2="140" y2="155" stroke="#526474" stroke-width="2"/><line x1="134" y1="490" x2="146" y2="490" stroke="#526474" stroke-width="2"/><text x="124" y="496" font-size="18" fill="#203247" text-anchor="end">0</text><line x1="134" y1="430" x2="146" y2="430" stroke="#526474" stroke-width="2"/><text x="124" y="436" font-size="18" fill="#203247" text-anchor="end">20</text><line x1="134" y1="190" x2="146" y2="190" stroke="#526474" stroke-width="2"/><text x="124" y="196" font-size="18" fill="#203247" text-anchor="end">100</text><line x1="170" y1="430" x2="420" y2="430" stroke="#306f8c" stroke-width="2"/><line x1="170" y1="190" x2="420" y2="190" stroke="#306f8c" stroke-width="2"/><path d="M455 190L455 430" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><text x="470" y="310" font-size="22" fill="#203247" text-anchor="start">γ</text><text x="180" y="174" font-size="19" fill="#203247" text-anchor="start">E_i = 100 keV</text><text x="180" y="463" font-size="19" fill="#203247" text-anchor="start">E_f = 20 keV</text><text x="35" y="550" font-size="19" fill="#203247" text-anchor="start">E_γ = 80 keV · rinculo trascurato</text><text x="150" y="150" font-size="19" fill="#203247" text-anchor="start">E (keV)</text><text x="35" y="630" font-size="22" fill="#203247" text-anchor="start">2 · Cambia lo stato, non A e Z</text><rect x="65" y="690" width="180" height="90" fill="#e1edf1"/><text x="85" y="728" font-size="19" fill="#203247" text-anchor="start">A, Z · eccitato</text><text x="85" y="763" font-size="18" fill="#203247" text-anchor="start">prima del γ</text><path d="M260 735L370 735" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><rect x="390" y="690" width="180" height="90" fill="#e1edf1"/><text x="410" y="728" font-size="19" fill="#203247" text-anchor="start">stessi A e Z</text><text x="410" y="763" font-size="18" fill="#203247" text-anchor="start">dopo il γ</text><text x="35" y="840" font-size="19" fill="#203247" text-anchor="start">Il fotone porta energia, non nucleoni.</text><text x="35" y="940" font-size="22" fill="#203247" text-anchor="start">3 · Due salti e la loro media</text><text x="130" y="1043" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="150" y="1020" width="320" height="30" fill="#3d7791"/><text x="480" y="1044" font-size="18" fill="#203247" text-anchor="start">80 keV</text><text x="130" y="1153" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="150" y="1130" width="4" height="30" fill="#986c35"/><text x="164" y="1154" font-size="18" fill="#203247" text-anchor="start">1 keV</text><text x="130" y="1263" font-size="18" fill="#203247" text-anchor="end">media</text><rect x="150" y="1240" width="162.0" height="30" fill="#637e55"/><text x="322.0" y="1264" font-size="18" fill="#203247" text-anchor="start">81/2 keV</text><text x="35" y="1355" font-size="19" fill="#203247" text-anchor="start">A: 100 → 20 keV · B: 2 → 1 keV</text><text x="35" y="1400" font-size="19" fill="#203247" text-anchor="start">Energie del fotone: origine comune alle barre.</text><text x="35" y="1445" font-size="19" fill="#203247" text-anchor="start">La media non implica un nuovo livello disponibile.</text></svg>
