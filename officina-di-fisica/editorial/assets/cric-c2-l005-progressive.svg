<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1550" role="img" aria-labelledby="title desc"><title id="title">Bilanci di volume e portata</title><desc id="desc">Volumi in quarantacinque secondi: 6,75 litri entrati meno 3,75 usciti danno tre litri accumulati. Nodo stazionario con 36 millilitri al secondo in ingresso e rami 14 e 22. Riempimento iniziale di una linea fino a 120 millilitri in nove secondi.</desc><rect width="640" height="1550" fill="#faf7ef"/><g font-family="Arial,sans-serif" font-size="22" fill="#252438">
<text x="32" y="48" font-size="27" font-weight="bold">Contare ciò che attraversa</text><text x="32" y="94">1. In 45 s: entra, esce, si accumula</text>
<text x="40" y="191">Entrato</text><rect x="160" y="160" width="270" height="45" fill="#d9eddf" stroke="#246d54" stroke-width="2"/><text x="455" y="191">6,75 L</text>
<text x="40" y="281">Uscito</text><rect x="160" y="250" width="150" height="45" fill="#dcd7f3" stroke="#41366b" stroke-width="2"/><text x="335" y="281">3,75 L</text>
<text x="40" y="371">Accumulo</text><rect x="160" y="340" width="120" height="45" fill="#dce7f6" stroke="#286594" stroke-width="2"/><text x="305" y="371">3 L</text><text x="125" y="445">6,75 L − 3,75 L = 3 L</text>
<path d="M32 490H608" stroke="#b3abbf"/><text x="32" y="535">2. Un nodo senza accumulo</text>
<text x="40" y="632">Ingresso</text><rect x="160" y="600" width="360" height="45" fill="#d9eddf" stroke="#246d54" stroke-width="2"/><text x="425" y="685">36 mL/s</text>
<text x="40" y="752">Ramo 1</text><rect x="160" y="720" width="140" height="45" fill="#dcd7f3" stroke="#41366b" stroke-width="2"/><text x="325" y="752">14 mL/s</text>
<text x="40" y="872">Ramo 2</text><rect x="160" y="840" width="220" height="45" fill="#dce7f6" stroke="#286594" stroke-width="2"/><text x="405" y="872">22 mL/s</text><text x="125" y="955">36 mL/s = 14 mL/s + 22 mL/s</text>
<path d="M32 1000H608" stroke="#b3abbf"/><text x="32" y="1045">3. La linea inizialmente vuota</text>
<path d="M140 1390H550M140 1390V1130" stroke="#252438" stroke-width="3" fill="none"/><path d="M140 1390 500 1150" stroke="#286594" stroke-width="5"/>
<path d="M500 1390V1150H140" stroke="#978eab" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
<text x="40" y="1105">V (mL)</text><text x="78" y="1158">120</text><text x="105" y="1420">0</text><text x="492" y="1420">9</text><text x="485" y="1460">t (s)</text><text x="95" y="1510">A 9 s il volume interno di 120 mL è riempito</text>
</g></svg>