<svg font-family="Arial, sans-serif" fill="#182d42" font-size="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1420" width="640" height="1420" role="img" aria-labelledby="title desc">
<title id="title">Densità: massa e volume prima del rapporto</title><desc id="desc">A: tre chilogrammi in due litri. B: quattro chilogrammi in cinque litri. Altezze ottanta e duecento pixel, quaranta pixel per litro. Barre distinte di massa e densità con scale dichiarate.</desc>

<rect width="640" height="1420" fill="#fff"/>
<text font-size="24" font-weight="bold" x="32" y="46">1. Misura il volume del fluido</text><text x="32" y="82">Campioni diversi, ciascuno omogeneo.</text><text font-size="18" x="32" y="116">Recipienti schematici a sezione costante.</text>
<path fill="none" stroke="#263f55" stroke-width="3" d="M100 160V390H240V160M370 160V390H510V160"/>
<rect fill="#84c7eb" x="102" y="310" width="136" height="80"/><rect fill="#e9bb70" x="372" y="190" width="136" height="200"/>
<path fill="none" stroke="#6a7d8a" stroke-width="2" d="M88 310H252M358 190H522"/><text x="105" y="430">A: V = 2 L</text><text x="375" y="430">B: V = 5 L</text><text x="32" y="480">Altezze: 80 px e 200 px.</text><text font-size="18" x="32" y="514">Scala volumetrica comune: 40 px/L.</text>
<path fill="none" stroke="#6a7d8a" stroke-width="2" d="M32 552H608"/><text font-size="24" font-weight="bold" x="32" y="602">2. Pesa soltanto il campione</text><text x="32" y="640">La massa del recipiente è già sottratta.</text>
<text x="50" y="705">A</text><rect fill="#84c7eb" x="100" y="675" width="60" height="42"/><text x="192" y="704">m = 3 kg</text><text x="50" y="785">B</text><rect fill="#e9bb70" x="100" y="755" width="80" height="42"/><text x="212" y="784">m = 4 kg</text><text font-size="18" x="32" y="842">Scala delle barre di massa: 20 px/kg.</text>
<path fill="none" stroke="#6a7d8a" stroke-width="2" d="M32 884H608"/><text font-size="24" font-weight="bold" x="32" y="934">3. Dividi massa per volume</text><text x="32" y="978">ρ = m/V, con unità kg/L.</text>
<text x="50" y="1043">A</text><rect fill="#84c7eb" x="100" y="1013" width="120" height="42"/><text x="250" y="1042">ρ = 3/2 kg/L</text><text x="50" y="1123">B</text><rect fill="#e9bb70" x="100" y="1093" width="64" height="42"/><text x="196" y="1122">ρ = 4/5 kg/L</text><text font-size="18" x="32" y="1180">Scala di densità: 80 px per kg/L.</text>
<text x="32" y="1240">Più massa non implica più densità:</text><text x="32" y="1274">il volume B cresce in proporzione maggiore.</text><text font-size="18" x="32" y="1330">Le tre scale misurano grandezze diverse.</text><text font-size="18" x="32" y="1364">Nessuna densità è attribuita all’acqua.</text></svg>
