<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1520" viewBox="0 0 640 1520" role="img" aria-labelledby="title desc"><title id="title">Due porzioni di volume, una risultante verso l’alto</title><desc id="desc">Corpo prismatico di un litro: centoventi pixel equivalgono a tre quarti di litro nel liquido superiore, quaranta pixel a un quarto nel liquido inferiore. Le densità sono un mezzo, tre quarti e tre mezzi chilogrammi per litro. Esempio con g dieci: due spinte da quindici quarti newton, peso quindici mezzi newton. Frecce venti pixel per newton. Barre di volume duecento pixel per litro.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1520" fill="#faf8f1" rx="20"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Un corpo intero attraversa l’interfaccia</text><text x="28" y="90">Liquidi immiscibili, fermi; nessuna tensione interfacciale.</text><rect x="100" y="140" width="220" height="200" fill="#e7c994"/><rect x="100" y="340" width="220" height="180" fill="#bad9e5"/><rect x="170" y="220" width="100" height="160" fill="#a8b8aa" stroke="#193a49" stroke-width="2"/><path d="M85 340H335" stroke="#597f83" stroke-dasharray="6 5"/><path d="M100 125V520H320V125" fill="none" stroke="#597f83"/><text x="350" y="200">ρ_t = 1/2 kg/L</text><text x="350" y="260">Corpo: ρ_c = 3/4 kg/L</text><text x="350" y="315">Sopra: 3/4 L</text><text x="350" y="395">Sotto: 1/4 L</text><text x="350" y="465">ρ_b = 3/2 kg/L</text><text x="28" y="570">Corpo a sezione costante: altezza ∝ volume.</text><text x="28" y="610">160 px/L: 120 px sopra + 40 px sotto = 1 L.</text><text x="28" y="690" font-size="25">2 · Esempio di forze, g = 10 m/s²</text><path d="M160 870V795" stroke="#b46145" stroke-width="3" marker-end="url(#a)"/><path d="M350 870V795" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M520 795V945" stroke="#193a49" stroke-width="3" marker-end="url(#a)"/><text x="65" y="755">S_t = 15/4 N</text><text x="280" y="755">S_b = 15/4 N</text><text x="405" y="990">P = 15/2 N</text><text x="28" y="1040">20 px/N: 75 px + 75 px contro 150 px.</text><text x="28" y="1080">Le due spinte insieme equilibrano il peso.</text><text x="28" y="1160" font-size="25">3 · Le frazioni sono complementari</text><rect x="180" y="1220" width="150" height="40" fill="#e7c994"/><rect x="330" y="1220" width="50" height="40" fill="#bad9e5"/><text x="175" y="1310">3/4 L</text><text x="335" y="1310">1/4 L</text><text x="28" y="1370">Volume: 200 px/L. Totale 200 px = 1 L.</text><text x="28" y="1410">f = 1/4; la parte superiore vale 1 − f = 3/4.</text><text x="28" y="1460">ρ_c = ρ_t(1 − f) + ρ_b f.</text></g></svg>
