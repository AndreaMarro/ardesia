<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1320" role="img" aria-labelledby="title desc">
<title id="title">La convezione usa la differenza rispetto all’aria</title>
<desc id="desc">Una superficie mantenuta a trenta gradi Celsius cede cinquanta watt all’aria a venti nel modello assegnato. A coefficiente cinque fissato, il grafico è lineare nel salto dalla lettura venti, punto limite escluso. Un confronto separato modifica anche il coefficiente: cinquanta e duecento watt, media centoventicinque.</desc>
<defs><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1320" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Una superficie mantenuta più calda</text>
<text x="32" y="85" font-size="18">A = 1 m² ; h = 5 W/(m²·K) nella prova A.</text>
<text x="296" y="139">P = 50 W</text>
<rect x="80" y="175" width="130" height="140" rx="8" fill="#b45328"/>
<text x="103" y="217" fill="white">Superficie</text><text x="105" y="260" fill="white">30 °C</text>
<rect x="320" y="175" width="230" height="140" rx="8" fill="#e4f3fa" stroke="#165a87"/>
<text x="392" y="214">Aria</text><text x="387" y="247">20 °C</text>
<path d="M230 283H510" stroke="#b45328" stroke-width="4" marker-end="url(#heat)"/>
<text x="32" y="362" font-size="18">Schema: la freccia indica calore, non un getto d’aria.</text>
<text x="32" y="394" font-size="18">Il salto termico è 30 − 20 = 10 K.</text>
<text x="32" y="426" font-size="18">La superficie è mantenuta: non si descrive un transitorio.</text>
<path d="M32 455H608" stroke="#9babbc"/>
<text x="32" y="499" font-size="25" font-weight="bold">2 · Il riferimento è l’aria a 20 °C</text>
<text x="32" y="538" font-size="18">P in W ; h = 5 W/(m²·K) e A = 1 m² fissati.</text>
<path d="M100 795V575M100 795H530" fill="none" stroke="#14243a" stroke-width="2"/>
<path d="M100 795L300 695L500 595" fill="none" stroke="#165a87" stroke-width="4"/>
<path d="M100 695H300V795M100 595H500V795" fill="none" stroke="#8292a2" stroke-dasharray="5 5"/>
<circle cx="100" cy="795" r="6" fill="#f8fafc" stroke="#165a87" stroke-width="3"/>
<circle cx="300" cy="695" r="5" fill="#165a87"/><circle cx="500" cy="595" r="5" fill="#165a87"/>
<text x="49" y="602">100</text><text x="59" y="702">50</text><text x="65" y="802">0</text><text x="82" y="832">20</text><text x="282" y="832">30</text><text x="482" y="832">40</text>
<text x="430" y="866">T_s / °C</text>
<text x="32" y="895" font-size="18">Punto vuoto: il limite 20 °C non è nel ramo T_s &gt; 20 °C.</text>
<path d="M32 923H608" stroke="#9babbc"/>
<text x="32" y="967" font-size="25" font-weight="bold">3 · Ora cambia anche il coefficiente h</text>
<path d="M130 990V1224" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="1007" width="80" height="34" fill="#165a87"/><rect x="130" y="1080" width="320" height="34" fill="#165a87"/><rect x="130" y="1153" width="200" height="34" fill="#28664d"/>
<text x="50" y="1032">A</text><text x="228" y="1032">50 W</text><text x="50" y="1105">B</text><text x="468" y="1105">200 W</text><text x="32" y="1178">Media</text><text x="348" y="1178">125 W</text>
<text x="32" y="1262" font-size="18">A: h = 5, T_s = 30 °C ; B: h = 10, T_s = 40 °C.</text>
<text x="32" y="1292" font-size="18">Potenze in W, stessa origine; h in W/(m²·K).</text>
</g></svg>
