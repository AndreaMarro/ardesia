<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1400" viewBox="0 0 560 1400" role="img" aria-labelledby="title desc">
<title id="title">Energia, aumento e lettura finale</title><desc id="desc">Con capacità 10 J/K,50 J aumentano la temperatura di 5 K. Le letture Celsius 25 e 30 hanno rapporto 6/5, mentre gli aumenti hanno rapporto 2. Un altro confronto 25 e 40 ha media 32,5.</desc>
<rect width="560" height="1400" fill="#fffaf1"/>
<g fill="#352d42" font-family="Arial,sans-serif" font-size="19">
<text x="25" y="40" font-size="25" font-weight="bold">1 · Prima trova l’aumento</text>
<text x="25" y="80">5 W per 10 s → Q=50 J</text>
<rect x="75" y="120" width="410" height="125" rx="12" fill="#e5efea" stroke="#147979" stroke-width="2"/>
<text x="105" y="160">Capacità complessiva C=10 J/K</text>
<text x="105" y="205">ΔT=50 J/(10 J/K)=5 K</text>
<text x="25" y="290">20 °C iniziali + aumento 5 K →25 °C</text>
<text x="25" y="330">Lo schema non ha una scala energetica.</text>
<line x1="25" y1="365" x2="535" y2="365" stroke="#b8ada0"/>
<text x="25" y="410" font-size="25" font-weight="bold">2 · La scala Celsius ha uno zero</text>
<text x="25" y="450">Letture numeriche sulla scala Celsius</text>
<line x1="140" y1="490" x2="140" y2="735" stroke="#352d42" stroke-width="2"/>
<text x="25" y="535">A,10 s</text><rect x="140" y="505" width="200" height="45" fill="#b8ada0"/><rect x="340" y="505" width="50" height="45" fill="#147979"/><text x="407" y="535">25</text>
<text x="25" y="625">P uguale,</text><text x="25" y="650">t=20 s</text><rect x="140" y="600" width="200" height="45" fill="#b8ada0"/><rect x="340" y="600" width="100" height="45" fill="#7350b0"/><text x="457" y="630">30</text>
<text x="116" y="710">0</text><text x="330" y="710">20</text><text x="25" y="770">Grigio:lettura iniziale 20 · colori:aumento</text>
<text x="25" y="810">Letture:30/25=6/5 · aumenti:10/5=2</text>
<text x="25" y="850">Kelvin:303,15/298,15 è un altro rapporto.</text>
<line x1="25" y1="885" x2="535" y2="885" stroke="#b8ada0"/>
<text x="25" y="930" font-size="25" font-weight="bold">3 · Media di un altro confronto</text>
<text x="25" y="970">Casi 11/12 · letture finali in °C</text>
<line x1="140" y1="1000" x2="140" y2="1280" stroke="#352d42" stroke-width="2"/>
<text x="25" y="1040">A</text><rect x="140" y="1015" width="200" height="40" fill="#147979"/><text x="357" y="1042">25 °C</text>
<text x="25" y="1120">B</text><rect x="140" y="1095" width="320" height="40" fill="#d49332"/><text x="475" y="1122">40 °C</text>
<text x="25" y="1200">Media</text><rect x="140" y="1175" width="260" height="40" fill="#7350b0"/><text x="415" y="1202">32,5 °C</text>
<text x="116" y="1260">0</text><text x="25" y="1320">Media delle uscite:(25+40)/2=65/2 °C</text>
<text x="25" y="1360">Non è la prova agli ingressi medi.</text>
</g></svg>
