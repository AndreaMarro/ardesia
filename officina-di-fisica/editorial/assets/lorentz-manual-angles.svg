<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1140" viewBox="0 0 640 1140" role="img" aria-labelledby="title description"><title id="title">Geometria della forza magnetica</title><desc id="description">Carica positiva; v=3m/s, B=1T, q=2µC. Le frecce v e B hanno scale proprie. Cerchio con punto: forza uscente. La dimensione del simbolo non codifica il modulo.</desc><rect x="0" y="0" width="640" height="1140" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="24" y="45" font-size="30" fill="#172033" text-anchor="start" font-family="sans-serif">Geometria della forza magnetica</text><g transform="translate(0 90)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">1. Moto parallelo</text><line x1="110" y1="210" x2="222" y2="210" stroke="#172033" stroke-width="7"/><polygon points="230,210 216,216 216,204" fill="#172033"/><line x1="110" y1="210" x2="242" y2="210" stroke="#1d4ed8" stroke-width="3"/><polygon points="250,210 236,216 236,204" fill="#1d4ed8"/><circle cx="110" cy="210" r="8" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="202" y="248" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">v</text><text x="262" y="202" font-size="26" fill="#1d4ed8" text-anchor="start" font-family="sans-serif">B</text><text x="58" y="290" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">q &gt; 0; θ = 0°</text><text x="450" y="180" font-size="28" fill="#172033" text-anchor="middle" font-family="sans-serif">F = 0</text><text x="450" y="280" font-size="26" fill="#172033" text-anchor="middle" font-family="sans-serif">F = 0 µN</text></g><g transform="translate(0 430)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">2. Componente perpendicolare</text><line x1="110" y1="210" x2="222" y2="210" stroke="#172033" stroke-width="7"/><polygon points="230,210 216,216 216,204" fill="#172033"/><line x1="110" y1="210" x2="224.315" y2="144" stroke="#1d4ed8" stroke-width="3"/><polygon points="231.244,140 222.119,152.196 216.119,141.804" fill="#1d4ed8"/><circle cx="110" cy="210" r="8" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="202" y="248" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">v</text><text x="243.244" y="132" font-size="26" fill="#1d4ed8" text-anchor="start" font-family="sans-serif">B</text><text x="58" y="290" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">q &gt; 0; θ = 30°</text><circle cx="450" cy="165" r="30" fill="#ffffff" stroke="#047857" stroke-width="2"/><circle cx="450" cy="165" r="5" fill="#047857" stroke="#047857" stroke-width="2"/><text x="450" y="225" font-size="24" fill="#047857" text-anchor="middle" font-family="sans-serif">uscente</text><text x="450" y="280" font-size="26" fill="#172033" text-anchor="middle" font-family="sans-serif">F = 3 µN</text></g><g transform="translate(0 770)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">3. Moto perpendicolare</text><line x1="110" y1="210" x2="222" y2="210" stroke="#172033" stroke-width="7"/><polygon points="230,210 216,216 216,204" fill="#172033"/><line x1="110" y1="210" x2="110" y2="78" stroke="#1d4ed8" stroke-width="3"/><polygon points="110,70 116,84 104,84" fill="#1d4ed8"/><circle cx="110" cy="210" r="8" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="202" y="248" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">v</text><text x="122" y="62" font-size="26" fill="#1d4ed8" text-anchor="start" font-family="sans-serif">B</text><text x="58" y="290" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">q &gt; 0; θ = 90°</text><circle cx="450" cy="165" r="30" fill="#ffffff" stroke="#047857" stroke-width="2"/><circle cx="450" cy="165" r="5" fill="#047857" stroke="#047857" stroke-width="2"/><text x="450" y="225" font-size="24" fill="#047857" text-anchor="middle" font-family="sans-serif">uscente</text><text x="450" y="280" font-size="26" fill="#172033" text-anchor="middle" font-family="sans-serif">F = 6 µN</text></g></svg>
