<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1100" role="img" aria-labelledby="title desc">
<title id="title">Rapidità costante, accelerazione rivolta al centro</title>
<desc id="desc">Un moto circolare uniforme con raggio due metri e rapidità due metri al secondo. Scala spaziale cinquanta pixel per metro. In P la velocità è tangente verso l’alto, in Q verso sinistra; le frecce sono lunghe sessanta pixel a trenta pixel per metro al secondo. In Q una freccia di accelerazione lunga sessanta pixel punta verso il centro a trenta pixel per metro al secondo quadrato. Le scale hanno dimensioni diverse. Il modulo dell’accelerazione è due metri al secondo quadrato.</desc>
<defs><marker id="v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#14647b"/></marker><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#b44b2c"/></marker></defs>
<rect width="640" height="1100" rx="24" fill="#faf8f2"/>
<g font-family="system-ui, sans-serif" fill="#16323f" font-size="20">
<text x="28" y="42" font-size="24" font-weight="700">1 · La velocità è tangente</text>
<circle cx="180" cy="210" r="100" fill="none" stroke="#72828a" stroke-width="2"/>
<path d="M180 210 L280 210" fill="none" stroke="#72828a" stroke-width="2"/>
<path d="M280 210 L280 150" fill="none" stroke="#14647b" stroke-width="4" marker-end="url(#v)"/>
<circle cx="180" cy="210" r="4" fill="#16323f"/><circle cx="280" cy="210" r="4" fill="#14647b"/>
<text x="162" y="240">O</text><text x="288" y="232">P</text><text x="190" y="194">r = 2 m</text>
<text x="320" y="160" fill="#14647b">v = 2 m/s</text><text x="320" y="200">Moto antiorario</text>
<text x="28" y="350">Geometria: 50 px/m</text>
<text x="28" y="385">Velocità: 30 px per m/s</text>
<text x="28" y="438" font-size="24" font-weight="700">2 · Il vettore cambia direzione</text>
<circle cx="180" cy="580" r="100" fill="none" stroke="#72828a" stroke-width="2"/>
<path d="M180 480 L120 480" fill="none" stroke="#14647b" stroke-width="4" marker-end="url(#v)"/>
<path d="M180 480 L180 540" fill="none" stroke="#b44b2c" stroke-width="4" marker-end="url(#a)"/>
<circle cx="180" cy="580" r="4" fill="#16323f"/><circle cx="180" cy="480" r="4" fill="#14647b"/>
<text x="164" y="606">O</text><text x="190" y="475">Q</text>
<text x="28" y="467" fill="#14647b">v = 2 m/s</text>
<text x="225" y="535" fill="#b44b2c">A = 2 m/s², verso O</text>
<text x="315" y="590">v costante in modulo;</text><text x="315" y="624">direzione variabile.</text>
<text x="28" y="725">Accelerazione: 30 px per m/s²</text>
<text x="28" y="760">Le scale di v e A hanno dimensioni diverse.</text>
<text x="28" y="822" font-size="24" font-weight="700">3 · Calcola il modulo radiale</text>
<text x="28" y="875">A = v²/r = (2 m/s)²/(2 m)</text>
<text x="28" y="920">A = (4 m²/s²)/(2 m) = 2 m/s²</text>
<text x="28" y="980">Componente tangenziale: aₜ = 0</text>
<text x="28" y="1025">Il modulo non cambia; il vettore sì.</text>
</g></svg>
