<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc"><title id="title">Forze opposte, risultante e accelerazione</title><desc id="desc">Tre proiezioni orizzontali distinte, senza sommare le frecce di pannelli diversi. Prima sul blocco di due chilogrammi agiscono sei newton a destra e due a sinistra, a venti pixel per newton. Seconda: risultante quattro newton a destra. Terza: accelerazione due metri al secondo quadrato a quaranta pixel per metro al secondo quadrato. Forze verticali equilibrate omesse. Le scale di forza e accelerazione hanno dimensioni diverse.</desc>
<defs><marker id="right" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#14647b"/></marker><marker id="left" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b44b2c"/></marker></defs>
<rect width="640" height="1000" rx="24" fill="#faf8f2"/><g font-family="system-ui, sans-serif" font-size="20" fill="#16323f">
<text x="28" y="45" font-size="24" font-weight="700">1 · Isola le forze sul blocco</text>
<rect x="250" y="130" width="110" height="70" fill="#d6e6df" stroke="#16323f" stroke-width="2"/><text x="268" y="172">M = 2 kg</text>
<path d="M360 165 L480 165" stroke="#14647b" stroke-width="4" marker-end="url(#right)"/><path d="M250 165 L210 165" stroke="#b44b2c" stroke-width="4" marker-end="url(#left)"/>
<text x="395" y="135">F = 6 N</text><text x="112" y="135">R = 2 N</text><text x="28" y="245">Solo proiezione orizzontale; verticale equilibrata.</text>
<text x="28" y="310" font-size="24" font-weight="700">2 · Sostituisci con la risultante</text>
<rect x="250" y="385" width="110" height="70" fill="#d6e6df" stroke="#16323f" stroke-width="2"/><text x="268" y="427">M = 2 kg</text><path d="M360 420 L440 420" stroke="#14647b" stroke-width="4" marker-end="url(#right)"/>
<text x="382" y="385">F − R = 4 N</text><text x="28" y="505">Forze nei pannelli 1 e 2: 20 px/N.</text>
<text x="28" y="540">Le due rappresentazioni non si sommano fra loro.</text>
<text x="28" y="610" font-size="24" font-weight="700">3 · Dividi per la massa</text>
<rect x="250" y="685" width="110" height="70" fill="#d6e6df" stroke="#16323f" stroke-width="2"/><text x="268" y="727">M = 2 kg</text><path d="M360 720 L440 720" stroke="#14647b" stroke-width="4" marker-end="url(#right)"/>
<text x="385" y="682">A = 2 m/s²</text><text x="28" y="810">A = (F − R)/M = (4 N)/(2 kg) = +2 m/s²</text>
<text x="28" y="860">Accelerazione: 40 px per m/s².</text><text x="28" y="905">Scala di A diversa dimensionalmente da quella di F.</text>
<text x="28" y="950">Destra positiva; la velocità iniziale non è assegnata.</text>
</g></svg>
