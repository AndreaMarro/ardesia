<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1810" width="640" height="1810" font-family="Arial, sans-serif" font-size="20" fill="#182d42" role="img" aria-labelledby="title desc">
<title id="title">Massa totale, base e immersione del galleggiante</title><desc id="desc">Un prisma alto quattro decimetri ha massa propria due chilogrammi e base due decimetri quadrati. Con carico due chilogrammi immerge due decimetri; con carico quattro ne immerge tre. Una guida ideale impedisce il ribaltamento senza sostenere peso. Il grafico si arresta al limite di immersione quattro decimetri.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1810" fill="white"/>
<text x="32" y="46" font-size="24" font-weight="bold">1. Mantieni la base, cambia il carico</text><text x="32" y="84">Base: 2 dm × 1 dm; A = 2 dm²; H = 4 dm.</text><text x="32" y="122">m₀ = 2 kg; acqua: ρ = 1 kg/dm³.</text>
<rect x="70" y="340" width="200" height="185" fill="#b5dcf1"/><rect x="350" y="340" width="200" height="185" fill="#b5dcf1"/>
<rect x="100" y="240" width="100" height="200" fill="#e9bb70" stroke="#263f55" stroke-width="2"/><rect x="380" y="290" width="100" height="200" fill="#e9bb70" stroke="#263f55" stroke-width="2"/>
<rect x="125" y="200" width="50" height="40" fill="#cf9983" stroke="#263f55"/><rect x="405" y="230" width="50" height="60" fill="#cf9983" stroke="#263f55"/>
<path d="M220 200V520M200 250H220M200 430H220M500 230V540M480 300H500M480 480H500" fill="none" stroke="#6a7d8a" stroke-width="2"/>
<path d="M60 340H280M340 340H560" stroke="#287aab" stroke-width="2" stroke-dasharray="6 4"/>
<text x="100" y="180">M = 2 kg.</text><text x="380" y="210">M = 4 kg.</text><text x="85" y="574">h_i = 2 dm.</text><text x="365" y="574">h_i = 3 dm.</text>
<text x="32" y="620">Fronti 100 × 200 px; scala 50 px/dm.</text><text x="32" y="654">Immersioni 100 e 150 px, entrambe minori di H.</text><text x="32" y="688" font-size="18">Le guide laterali non esercitano forza verticale.</text>
<path d="M32 726H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="776" font-size="24" font-weight="bold">2. Il liquido sostiene la massa totale</text><text x="32" y="816">M + m₀ = ρ A h_i; g si cancella.</text>
<rect x="100" y="862" width="60" height="40" fill="#e9bb70"/><rect x="160" y="862" width="60" height="40" fill="#cf9983"/><text x="260" y="890">2 + 2 = 4 kg.</text>
<rect x="100" y="942" width="60" height="40" fill="#e9bb70"/><rect x="160" y="942" width="120" height="40" fill="#cf9983"/><text x="320" y="970">2 + 4 = 6 kg.</text>
<text x="32" y="1030">Barre: 120 e 180 px, scala 30 px/kg.</text><text x="32" y="1064">Dividendo per ρ si ottengono volumi di 4 e 6 dm³.</text>
<path d="M32 1102H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="1152" font-size="24" font-weight="bold">3. Verifica la capacità geometrica</text><text x="32" y="1192">Grafico per A = 2 dm²; m₀ resta 2 kg.</text><text x="32" y="1226" font-size="18">Scale numeriche: 50 px/kg e 50 px/dm, indipendenti.</text>
<path d="M100 1580H500" stroke="#334f66" stroke-width="2" marker-end="url(#a)"/><path d="M100 1580V1320" stroke="#334f66" stroke-width="2" marker-end="url(#a)"/>
<path d="M100 1380H430" stroke="#6a7d8a" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M100 1530L400 1380" stroke="#237b98" stroke-width="4" fill="none"/>
<circle cx="100" cy="1530" r="6" fill="white" stroke="#237b98" stroke-width="2"/><circle cx="200" cy="1480" r="6" fill="#237b98"/><circle cx="300" cy="1430" r="6" fill="#237b98"/><circle cx="400" cy="1380" r="7" fill="white" stroke="#237b98" stroke-width="3"/>
<text x="50" y="1290">h_i (dm)</text><text x="65" y="1538">1</text><text x="65" y="1488">2</text><text x="65" y="1438">3</text><text x="65" y="1388">4</text><text x="450" y="1388">H = 4 dm.</text>
<text x="90" y="1620">0</text><text x="190" y="1620">2</text><text x="290" y="1620">4</text><text x="390" y="1620">6</text><text x="490" y="1620">M (kg)</text>
<text x="32" y="1680">0 &lt; M &lt; 6 kg mantiene 1 &lt; h_i &lt; 4 dm.</text><text x="32" y="1720">Il punto al limite M = 6 kg è escluso.</text><text x="32" y="1770" font-size="18">Il grafico è numerico, distinto dal profilo immerso sopra.</text>
</svg>
