<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc"><title id="title">Genitori rimasti e già trasformati</title><desc id="desc">Tre tappe: residui e trasformati nello stesso campione; curva del cumulativo medio con sessantaquattro milioni iniziali; altro campione in cui i cumulativi dodici e quattordici milioni lasciano residui quattro e due milioni.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1600" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Genitori rimasti e già trasformati</text><text x="32" y="96" font-size="22" text-anchor="start">1 · Stessi 64 milioni, due complementi</text><text x="32" y="142" font-size="18" text-anchor="start">Blu: residui · Ocra: genitori trasformati</text><text x="128" y="223" font-size="18" text-anchor="end">1 h</text><rect x="150" y="200" width="160" height="30" fill="#316b9b"/><rect x="310" y="200" width="160" height="30" fill="#a76d20"/><text x="230.0" y="270" font-size="18" text-anchor="middle">32</text><text x="390.0" y="270" font-size="18" text-anchor="middle">32</text><text x="128" y="343" font-size="18" text-anchor="end">2 h</text><rect x="150" y="320" width="80" height="30" fill="#316b9b"/><rect x="230" y="320" width="240" height="30" fill="#a76d20"/><text x="190.0" y="390" font-size="18" text-anchor="middle">16</text><text x="350.0" y="390" font-size="18" text-anchor="middle">48</text><text x="32" y="455" font-size="18" text-anchor="start">Ogni barra intera vale 64 milioni di genitori.</text><text x="32" y="525" font-size="22" text-anchor="start">2 · Cumulativo con N₀ = 64 milioni</text><line x1="145" y1="1000" x2="550" y2="1000" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1005" x2="150" y2="630" stroke="#52667