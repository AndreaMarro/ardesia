 height="30" fill="#316b9b"/><rect x="230" y="1230" width="240" height="30" fill="#a76d20"/><text x="190.0" y="1300" font-size="18" text-anchor="middle">4</text><text x="350.0" y="1300" font-size="18" text-anchor="middle">12</text><text x="128" y="1373" font-size="18" text-anchor="end">t + 1 h</text><rect x="150" y="1350" width="40" height="30" fill="#316b9b"/><rect x="190" y="1350" width="280" height="30" fill="#a76d20"/><text x="170.0" y="1420" font-size="18" text-anchor="middle">2</text><text x="330.0" y="1420" font-size="18" text-anchor="middle">14</text><text x="32" y="1500" font-size="18" text-anchor="start">Le barre complete hanno origine e scala comuni.</text><text x="32" y="1540" font-size="18" text-anchor="start">L’ora aggiuntiva trasforma metà dei 4 milioni</text><text x="32" y="1575" font-size="18" text-anchor="start">ancora presenti al primo tempo.</text></g></svg>
