<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1650" viewBox="0 0 640 1650" role="img" aria-labelledby="title desc"><title id="title">La massa per secondo dipende anche dalla densità</title><desc id="desc">Quattro celle di volume un litro nel secondo considerato. Densità uno o quattro quinti chilogrammo per litro danno portate massiche quattro o sedici quinti chilogrammi per secondo. Barre cinquanta pixel per chilogrammo al secondo. Grafico portata massica contro portata volumetrica: quaranta pixel per litro al secondo e quaranta per chilogrammo al secondo, pendenze uno e quattro quinti chilogrammo per litro.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1650" rx="20" fill="#faf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Stesso volume, massa diversa</text><text x="28" y="90">Q = 4 L/s. Consideriamo Δt = 1 s.</text><rect x="150" y="160" width="160" height="60" fill="#bad9e5" stroke="#597f83"/><path d="M190 160V220M230 160V220M270 160V220" stroke="#597f83"/><text x="150" y="270">4 celle, ciascuna1L</text><text x="28" y="330">Scala orizzontale:40px/L, totale160px.</text><text x="28" y="380">ρ = 1 kg/L → massa4kg nel secondo.</text><text x="28" y="430">ρ = 4/5 kg/L → massa16/5kg nel secondo.</text><text x="28" y="515" font-size="25">2 · Confronta le portate massiche</text><rect x="220" y="580" width="200" height="38" fill="#a8b8aa"/><rect x="220" y="675" width="160" height="38" fill="#e7c994"/><text x="28" y="607">ρ = 1 kg/L</text><text x="28" y="702">ρ = 4/5 kg/L</text><text x="450" y="607">4 kg/s</text><text x="410" y="760">16/5 kg/s</text><text x="28" y="820">Barre:50px/(kg/s), lunghezze200e160px.</text><text x="28" y="865">Non sono masse: sono masse per tempo.</text><text x="28" y="950" font-size="25">3 · La pendenza del grafico è la densità</text><path d="M100 1460H450" stroke="#193a49" marker-end="url(#a)"/><path d="M100 1460V1170" stroke="#193a49" marker-end="url(#a)"/><path d="M100 1460L260 1300" stroke="#08869b" stroke-width="3"/><path d="M100 1460L260 1332" stroke="#b46145" stroke-width="3"/><circle cx="260" cy="1300" r="5" fill="#08869b"/><circle cx="220" cy="1364" r="5" fill="#b46145"/><path d="M260 1300V1460M220 1364V1460" stroke="#597f83" stroke-dasharray="5 5"/><text x="28" y="1080">x:40px/(L/s). y:40px/(kg/s).</text><text x="300" y="1290">A: (4,4)</text><text x="300" y="1340">ρ = 1 kg/L</text><text x="300" y="1395">B: (3,12/5)</text><text x="300" y="1440">ρ = 4/5 kg/L</text><text x="45" y="1150">ṁ (kg/s)</text><text x="210" y="1500">3</text><text x="255" y="1500">4</text><text x="420" y="1540">Q (L/s)</text><text x="28" y="1600">ṁ_B/ṁ_A = (12/5)/4 = 3/5.</text></g></svg>
