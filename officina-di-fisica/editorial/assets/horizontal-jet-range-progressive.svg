<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1700" viewBox="0 0 640 1700" role="img" aria-labelledby="title desc"><title id="title">Battente e altezza di caduta sono due quote diverse</title><desc id="desc">Esempio con gravità due metri al secondo quadro: battente un metro, foro quattro metri sopra il suolo, superficie a quota cinque. Geometria cinquanta pixel per metro su entrambi gli assi. Il getto esce a due metri al secondo e raggiunge il suolo dopo due secondi a distanza quattro metri. Traiettoria passa per zero-quattro, due-tre, quattro-zero. Esempio separato con superficie dieci metri e fori alle quote due e otto: gittate uguali di otto metri, velocità diverse.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1700" rx="20" fill="#faf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Esempio con g = 2m/s²</text><text x="28" y="90">Geometria50px/m su entrambi gli assi.</text><text x="28" y="130">h = 1m di battente; H = 4m sul suolo.</text><rect x="60" y="300" width="140" height="180" fill="#bad9e5"/><path d="M60 260V480H200V360M200 260V340" stroke="#597f83" stroke-width="3" fill="none"/><path d="M45 300H220" stroke="#597f83" stroke-dasharray="5 5"/><path d="M240 300V350" stroke="#b46145"/><text x="260" y="325">h = 1m</text><text x="60" y="230">Superficie:5m</text><path d="M200 350Q300 350 400 550" stroke="#08869b" stroke-width="3" fill="none"/><path d="M200 350H260" stroke="#193a49" stroke-width="3" marker-end="url(#a)"/><circle cx="200" cy="350" r="4" fill="#08869b"/><circle cx="300" cy="400" r="4" fill="#08869b"/><circle cx="400" cy="550" r="4" fill="#08869b"/><path d="M500 350V550" stroke="#b46145"/><text x="520" y="460">H = 4m</text><text x="330" y="300">v₀ = 2m/s</text><path d="M30 550H600" stroke="#597f83" stroke-width="2"/><text x="35" y="595">Suolo:y = 0</text><text x="310" y="595">Impatto:x = 4m</text><text x="28" y="650">Punti(x,y): (0,4), (2,3), (4,0)m.</text><text x="28" y="695">Freccia60px a30px/(m/s), tangente iniziale.</text><text x="28" y="775" font-size="25">2 · Due fasi con la stessa g</text><text x="28" y="825">Efflusso:v₀ = √(2gh) = 2m/s.</text><text x="28" y="875">Caduta:t = √(2H/g) = 2s.</text><text x="28" y="925">Moto orizzontale:R = v₀t = 4m.</text><text x="28" y="975">R = 2√(hH): g si cancella nella distanza.</text><text x="28" y="1025">v₀ e t separatamente dipendono ancora da g.</text><text x="28" y="1105" font-size="25">3 · Altro esempio:superficie a quota10m</text><text x="28" y="1155">A:foro a2m,battente8m; B:foro a8m,battente2m.</text><text x="28" y="1205">h_A H_A = h_B H_B = 16m².</text><rect x="160" y="1260" width="240" height="35" fill="#bad9e5"/><rect x="160" y="1350" width="240" height="35" fill="#e7c994"/><text x="28" y="1287">R_A</text><text x="28" y="1377">R_B</text><text x="435" y="1287">8m</text><text x="435" y="1377">8m</text><text x="28" y="1455">Barre di distanza:30px/m, entrambe240px.</text><text x="28" y="1505">v_A/v_B = 2; t_A/t_B = 1/2.</text><text x="28" y="1555">Stessa gittata, velocità iniziali diverse.</text><text x="28" y="1615">Battente e caduta devono restare positivi.</text><text x="28" y="1660">Aria trascurata; percorso libero fino al suolo.</text></g></svg>
