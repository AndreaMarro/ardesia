<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1120" role="img" aria-labelledby="t d">
<title id="t">Trenta metri a est, quaranta a nord</title><desc id="d">Tre tappe alla stessa scala di sei pixel per metro: cateti di trenta e quaranta metri, diagonale di cinquanta metri e angolo theta a nord dell’est. Coseno tre quinti e seno quattro quinti identificano esattamente la direzione nel primo quadrante.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1120" rx="18" fill="#faf8f2"/>
<g font-family="system-ui,sans-serif" fill="#142f3b"><text x="28" y="36" font-size="23" font-weight="700">Dal percorso alla direzione esatta</text>
<g font-size="21"><text x="28" y="76">1 · Scegli est e nord come assi</text><text x="28" y="414">2 · Collega partenza e arrivo</text><text x="28" y="752">3 · Descrivi l’angolo con rapporti</text></g>
<g stroke="#12617c" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M88 338H268"/><path d="M268 338V98"/><path d="M88 676H268"/><path d="M268 676V436"/><path d="M88 1014H268"/><path d="M268 1014V774"/></g>
<g stroke="#142f3b" stroke-width="2" fill="none"><path d="M248 338V318H268M248 676V656H268M248 1014V994H268"/><path d="M128 1014A40 40 0 0 0 112 982"/></g>
<g stroke="#9b4b20" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M88 676L268 436"/><path d="M88 1014L268 774"/></g>
<g font-size="19"><text x="135" y="366">30 m est</text><text x="282" y="218">40 m nord</text><text x="135" y="704">30 m est</text><text x="282" y="556">40 m nord</text><text x="120" y="534">50 m</text><text x="135" y="1042">30 m est</text><text x="282" y="894">40 m nord</text><text x="120" y="872">50 m</text><text x="139" y="993">θ</text><text x="366" y="148">Due cateti</text><text x="366" y="180">perpendicolari</text><text x="366" y="476">3² + 4² = 5²</text><text x="366" y="508">Scala ×10 m</text><text x="352" y="806">cos θ = 3/5</text><text x="352" y="842">sin θ = 4/5</text><text x="352" y="878">0° &lt; θ &lt; 90°</text><text x="28" y="1094">Stessa scala nei tre pannelli; nessun angolo decimale.</text></g></g></svg>
