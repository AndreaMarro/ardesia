<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1580" role="img" aria-labelledby="title desc">
<title id="title">Ripartire una corrente totale imposta</title>
<desc id="desc">Due resistori condividono A e B. La corrente totale di 12 milliampere entra in A ed esce da B; i due rami identici portano 6 milliampere ciascuno. Riducendo il primo resistore a 1 ohm, con il secondo a 2 ohm, le correnti diventano 8 e 4 milliampere. Due preparazioni distinte finali danno correnti nel primo ramo 6 e 3 milliampere, di media 9/2 milliampere. La tensione comune non è imposta. Le scale sono comuni soltanto entro ogni pannello di barre.</desc>
<rect width="680" height="1580" fill="#fffdf6"/>
<text x="34" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18364a">1 · Due rami, un totale imposto</text>
<text x="34" y="88" font-family="Arial,sans-serif" font-size="20" fill="#18364a">I_T = 12 mA ; R₁ = R₂ = 2 Ω.</text>
<path d="M90 250H160V160H520V340H160V250M520 250H600" stroke="#24485c" stroke-width="3" fill="none"/>
<rect x="300" y="145" width="100" height="30" stroke="#165a87" stroke-width="3" fill="#eaf3f8"/><rect x="300" y="325" width="100" height="30" stroke="#165a87" stroke-width="3" fill="#eaf3f8"/>
<circle cx="160" cy="250" r="6" fill="#24485c"/><circle cx="520" cy="250" r="6" fill="#24485c"/>
<text x="85" y="230" font-family="Arial,sans-serif" font-size="20" fill="#18364a">A</text><text x="600" y="230" font-family="Arial,sans-serif" font-size="20" fill="#18364a">B</text>
<text x="290" y="130" font-family="Arial,sans-serif" font-size="20" fill="#18364a">R₁ = 2 Ω</text><text x="290" y="390" font-family="Arial,sans-serif" font-size="20" fill="#18364a">R₂ = 2 Ω</text>
<text x="34" y="440" font-family="Arial,sans-serif" font-size="20" fill="#18364a">Da A a B: I₁ = 6 mA e I₂ = 6 mA.</text>
<text x="34" y="480" font-family="Arial,sans-serif" font-size="20" fill="#18364a">I₁ + I₂ = I_T ; la tensione comune è 12 mV.</text>
<text x="34" y="560" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18364a">2 · Cambia soltanto R₁</text>
<text x="34" y="600" font-family="Arial,sans-serif" font-size="20" fill="#18364a">R₁ passa da 2 a 1 Ω ; R₂ resta 2 Ω.</text>
<rect x="150" y="650" width="180" height="40" fill="#165a87"/><rect x="330" y="650" width="180" height="40" fill="#28664d"/>
<rect x="150" y="750" width="240" height="40" fill="#165a87"/><rect x="390" y="750" width="120" height="40" fill="#28664d"/>
<text x="45" y="677" font-family="Arial,sans-serif" font-size="20" fill="#18364a">Prima</text><text x="210" y="636" font-family="Arial,sans-serif" font-size="20" fill="#18364a">6 mA</text><text x="400" y="636" font-family="Arial,sans-serif" font-size="20" fill="#18364a">6 mA</text>
<text x="45" y="777" font-family="Arial,sans-serif" font-size="20" fill="#18364a">Dopo</text><text x="245" y="736" font-family="Arial,sans-serif" font-size="20" fill="#18364a">8 mA</text><text x="415" y="736" font-family="Arial,sans-serif" font-size="20" fill="#18364a">4 mA</text>
<line x1="150" y1="820" x2="545" y2="820" stroke="#526a78" stroke-width="2"/><text x="125" y="845" font-family="Arial,sans-serif" font-size="16" fill="#18364a">0</text><text x="490" y="845" font-family="Arial,sans-serif" font-size="16" fill="#18364a">12 mA</text>
<text x="34" y="885" font-family="Arial,sans-serif" font-size="18" fill="#18364a">Blu: I₁ ; verde: I₂. Il totale resta 12 mA.</text>
<text x="34" y="965" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18364a">3 · Due altre prove e la media</text>
<text x="34" y="1005" font-family="Arial,sans-serif" font-size="20" fill="#18364a">A: R₁ = 2 Ω, R₂ = 2 Ω ; I₁,A = 6 mA.</text>
<text x="34" y="1040" font-family="Arial,sans-serif" font-size="20" fill="#18364a">B: R₁ = 3 Ω, R₂ = 1 Ω ; I₁,B = 3 mA.</text>
<line x1="150" y1="1080" x2="150" y2="1380" stroke="#526a78" stroke-width="2"/><line x1="150" y1="1380" x2="440" y2="1380" stroke="#526a78" stroke-width="2"/>
<rect x="150" y="1105" width="240" height="34" fill="#165a87"/><rect x="150" y="1205" width="120" height="34" fill="#28664d"/><rect x="150" y="1305" width="180" height="34" fill="#9a4f23"/>
<text x="80" y="1130" font-family="Arial,sans-serif" font-size="20" fill="#18364a">A</text><text x="405" y="1130" font-family="Arial,sans-serif" font-size="20" fill="#18364a">6 mA</text>
<text x="80" y="1230" font-family="Arial,sans-serif" font-size="20" fill="#18364a">B</text><text x="285" y="1230" font-family="Arial,sans-serif" font-size="20" fill="#18364a">3 mA</text>
<text x="44" y="1330" font-family="Arial,sans-serif" font-size="20" fill="#18364a">Media</text><text x="345" y="1330" font-family="Arial,sans-serif" font-size="20" fill="#18364a">9/2 mA</text>
<text x="125" y="1405" font-family="Arial,sans-serif" font-size="16" fill="#18364a">0</text><text x="380" y="1405" font-family="Arial,sans-serif" font-size="16" fill="#18364a">6 mA</text>
<text x="34" y="1450" font-family="Arial,sans-serif" font-size="18" fill="#18364a">Scale comuni entro il pannello, indipendenti fra pannelli.</text>
<text x="34" y="1490" font-family="Arial,sans-serif" font-size="18" fill="#18364a">Qui anche ai dati medi R₁ = 5/2 Ω, R₂ = 3/2 Ω</text>
<text x="34" y="1525" font-family="Arial,sans-serif" font-size="18" fill="#18364a">si ottiene I₁ = 9/2 mA, perché R₁ + R₂ resta 4 Ω.</text>
</svg>
