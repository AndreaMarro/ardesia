<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="t d"><title id="t">Somma di intensità non coerenti</title><desc id="d">Barre di intensità: prova A con uno più due uguale tre, B con due più tre uguale cinque. Caso separato di spegnimento con residuo un quarto del totale.</desc><rect width="640" height="1600" rx="24" fill="#f5faff"/><g font-family="Arial,sans-serif" font-size="20" fill="#163047"><text x="35" y="50" font-size="26" font-weight="bold">1 · Contributi non coerenti</text><text x="35" y="100">Stesso punto, direzione e mezzo lineare</text><text x="35" y="145">Termine incrociato: media nulla</text><text x="35" y="190">Barre: 100 px/(W/m²), partenza da zero</text><text x="35" y="250">Prova A: 1 + 2 = 3 W/m²</text><rect x="80" y="290" width="100" height="48" fill="#196082"/><rect x="180" y="290" width="200" height="48" fill="#bc5315"/><text x="112" y="322" fill="white">1</text><text x="268" y="322" fill="white">2</text><text x="395" y="322">3 W/m²</text><text x="35" y="400">Sono intensità, non ampiezze o dB.</text><path d="M35 455H605" stroke="#b5cbd9"/><text x="35" y="510" font-size="26" font-weight="bold">2 · Una seconda prova</text><text x="35" y="565">Stessa scala: 100 px/(W/m²)</text><text x="35" y="620">B: 2 + 3 = 5 W/m²</text><rect x="60" y="660" width="200" height="48" fill="#196082"/><rect x="260" y="660" width="300" height="48" fill="#bc5315"/><text x="150" y="692" fill="white">2</text><text x="400" y="692" fill="white">3</text><text x="35" y="780">Media dei totali: (3 + 5)/2 = 4 W/m²</text><rect x="60" y="820" width="400" height="48" fill="#447d5e"/><text x="478" y="853">4 W/m²</text><text x="35" y="930">Qui la somma delle medie coincide:</text><text x="35" y="975">3/2 + 5/2 = 4 W/m² · legge lineare</text><path d="M35 1020H605" stroke="#b5cbd9"/><text x="35" y="1075" font-size="26" font-weight="bold">3 · Caso distinto: si spegne I₂</text><text x="35" y="1125">Solo 06 · 100 px per unità normalizzata</text><text x="35" y="1180">Prima: I₁ = 1, I₂ = 3 → totale 4</text><rect x="80" y="1220" width="100" height="42" fill="#196082"/><rect x="180" y="1220" width="300" height="42" fill="#bc5315"/><text x="35" y="1320">Dopo: resta I₁ = 1, cioè 1/4 del totale</text><rect x="80" y="1360" width="100" height="42" fill="#196082"/><text x="35" y="1470">Riduzione 3/4 · rapporto I₁/I₂ iniziale 1/3</text><text x="35" y="1530">Lo spegnimento non cambia la sorgente 1.</text></g></svg>
