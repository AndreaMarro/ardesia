<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1600" role="img" aria-labelledby="title desc">
<title id="title">Partitore senza carico e caduta inferiore</title>
<desc id="desc">Un generatore ideale da 12 volt alimenta due resistori in serie da 2 ohm. Il nodo intermedio non ha carichi e l’uscita sul secondo elemento vale 6 volt. Nel confronto centrale ridurre il primo resistore a 1 ohm dà cadute 4 e 8 volt. Nell’ultimo confronto distinto le uscite 6 e 3 volt hanno media 9/2 volt. Le scale dei due pannelli di barre sono indipendenti.</desc>
<rect width="680" height="1600" fill="#fffdf6" />
<text x="34" y="48" font-family="Arial,sans-serif" fill="#18364a" font-size="26" font-weight="700">1 · Uscita aperta sul nodo M</text>
<text x="34" y="88" font-family="Arial,sans-serif" fill="#18364a" font-size="20">E = 12 V ; R₁ = R₂ = 2 Ω ; I = 3 A.</text>
<path d="M160 260V140H480V180M480 260V340M480 420V460H160V340M480 300H600M480 460H600" stroke="#24485c" stroke-width="3" fill="none" />
<circle cx="160" cy="300" r="40" stroke="#24485c" stroke-width="3" fill="#fffdf6" />
<text x="151" y="287" font-family="Arial,sans-serif" fill="#18364a" font-size="20">+</text><text x="153" y="326" font-family="Arial,sans-serif" fill="#18364a" font-size="20">−</text><text x="50" y="306" font-family="Arial,sans-serif" fill="#18364a" font-size="20">12 V</text>
<rect x="460" y="180" width="40" height="80" stroke="#165a87" stroke-width="3" fill="#eaf3f8" /><rect x="460" y="340" width="40" height="80" stroke="#165a87" stroke-width="3" fill="#eaf3f8" />
<circle cx="480" cy="140" r="5" fill="#24485c" /><circle cx="480" cy="300" r="5" fill="#24485c" /><circle cx="480" cy="460" r="5" fill="#24485c" />
<circle cx="600" cy="300" r="5" fill="#fffdf6" stroke="#24485c" stroke-width="2" /><circle cx="600" cy="460" r="5" fill="#fffdf6" stroke="#24485c" stroke-width="2" />
<text x="515" y="148" font-family="Arial,sans-serif" fill="#18364a" font-size="20">A</text><text x="405" y="228" font-family="Arial,sans-serif" fill="#18364a" font-size="20">R₁</text><text x="405" y="388" font-family="Arial,sans-serif" fill="#18364a" font-size="20">R₂</text><text x="515" y="288" font-family="Arial,sans-serif" fill="#18364a" font-size="20">M</text><text x="515" y="490" font-family="Arial,sans-serif" fill="#18364a" font-size="20">B</text>
<text x="545" y="360" font-family="Arial,sans-serif" fill="#18364a" font-size="20">U = 6 V</text><text x="34" y="515" font-family="Arial,sans-serif" fill="#18364a" font-size="18">U = V_M − V_B ; nessun carico fra M e B.</text>
<text x="34" y="595" font-family="Arial,sans-serif" fill="#18364a" font-size="26" font-weight="700">2 · Le due cadute sommano E</text>
<text x="34" y="635" font-family="Arial,sans-serif" fill="#18364a" font-size="20">R₂ resta 2 Ω ; R₁ passa da 2 a 1 Ω.</text>
<rect x="150" y="675" width="180" height="40" fill="#165a87" /><rect x="330" y="675" width="180" height="40" fill="#28664d" />
<rect x="150" y="775" width="120" height="40" fill="#165a87" /><rect x="270" y="775" width="240" height="40" fill="#28664d" />
<text x="45" y="702" font-family="Arial,sans-serif" fill="#18364a" font-size="20">Prima</text><text x="210" y="661" font-family="Arial,sans-serif" fill="#18364a" font-size="20">6 V</text><text x="400" y="661" font-family="Arial,sans-serif" fill="#18364a" font-size="20">6 V</text>
<text x="45" y="802" font-family="Arial,sans-serif" fill="#18364a" font-size="20">Dopo</text><text x="185" y="761" font-family="Arial,sans-serif" fill="#18364a" font-size="20">4 V</text><text x="370" y="761" font-family="Arial,sans-serif" fill="#18364a" font-size="20">8 V</text>
<line x1="150" y1="845" x2="545" y2="845" stroke="#526a78" stroke-width="2" />
<text x="125" y="870" font-family="Arial,sans-serif" fill="#18364a" font-size="16">0</text><text x="493" y="870" font-family="Arial,sans-serif" fill="#18364a" font-size="16">12 V</text>
<text x="34" y="914" font-family="Arial,sans-serif" fill="#18364a" font-size="18">Blu: caduta superiore ; verde: uscita U.</text>
<text x="34" y="990" font-family="Arial,sans-serif" fill="#18364a" font-size="26" font-weight="700">3 · Due altre prove e la media</text>
<text x="34" y="1030" font-family="Arial,sans-serif" fill="#18364a" font-size="20">A: R₁ = 2 Ω, R₂ = 2 Ω ; U_A = 6 V.</text>
<text x="34" y="1065" font-family="Arial,sans-serif" fill="#18364a" font-size="20">B: R₁ = 3 Ω, R₂ = 1 Ω ; U_B = 3 V.</text>
<line x1="150" y1="1105" x2="150" y2="1405" stroke="#526a78" stroke-width="2" /><line x1="150" y1="1405" x2="440" y2="1405" stroke="#526a78" stroke-width="2" />
<rect x="150" y="1130" width="240" height="34" fill="#165a87" /><rect x="150" y="1230" width="120" height="34" fill="#28664d" /><rect x="150" y="1330" width="180" height="34" fill="#9a4f23" />
<text x="80" y="1155" font-family="Arial,sans-serif" fill="#18364a" font-size="20">A</text><text x="405" y="1155" font-family="Arial,sans-serif" fill="#18364a" font-size="20">6 V</text><text x="80" y="1255" font-family="Arial,sans-serif" fill="#18364a" font-size="20">B</text><text x="285" y="1255" font-family="Arial,sans-serif" fill="#18364a" font-size="20">3 V</text><text x="44" y="1355" font-family="Arial,sans-serif" fill="#18364a" font-size="20">Media</text><text x="345" y="1355" font-family="Arial,sans-serif" fill="#18364a" font-size="20">9/2 V</text>
<text x="125" y="1430" font-family="Arial,sans-serif" fill="#18364a" font-size="16">0</text><text x="382" y="1430" font-family="Arial,sans-serif" fill="#18364a" font-size="16">6 V</text>
<text x="34" y="1480" font-family="Arial,sans-serif" fill="#18364a" font-size="18">Scale comuni entro il pannello, indipendenti fra pannelli.</text>
<text x="34" y="1520" font-family="Arial,sans-serif" fill="#18364a" font-size="18">Qui il totale resta 4 Ω anche ai dati medi:</text>
<text x="34" y="1555" font-family="Arial,sans-serif" fill="#18364a" font-size="18">R₁ medio = 5/2 Ω, R₂ medio = 3/2 Ω ; U = 9/2 V.</text>
</svg>
