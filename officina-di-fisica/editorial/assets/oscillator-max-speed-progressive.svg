<text x="35" y="1255" font-size="25" font-weight="700">3 · Due prove, massimi diversi</text>
<text x="35" y="1295">Barre positive da zero: 40 px/(m/s)</text>
<text x="35" y="1340">I · A = 2 m · ω = 3 rad/s</text>
<rect x="100" y="1370" width="240" height="35" fill="#145d81"/><text x="360" y="1397">6 m/s</text>
