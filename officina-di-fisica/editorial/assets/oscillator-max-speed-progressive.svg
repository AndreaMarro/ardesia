<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1700" viewBox="0 0 640 1700" role="img" aria-labelledby="title desc">
<title id="title">Massimo modulo della velocità al centro</title><desc id="desc">Tre istanti distinti: fermata all’estremo destro, passaggio al centro verso destra e verso sinistra con velocità opposte di modulo sei metri al secondo. Grafico della velocità orientata e confronto dei massimi sei e quattro.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#145d81"/></marker></defs>
<rect width="640" height="1700" rx="20" fill="#f7fbff"/>
<g font-family="system-ui,sans-serif" fill="#142d40" font-size="20">
<text x="35" y="48" font-size="25" font-weight="700">1 · Tre istanti, lo stesso oscillatore</text>
<text x="35" y="90">A = 2 m · ω = 3 rad/s · posizione: 60 px/m</text>
<text x="175" y="150">−2 m</text><text x="310" y="150">0</text><text x="420" y="150">+2 m</text>
<path d="M170 220H470M170 330H470M170 440H470" stroke="#6e8b9c" stroke-width="2"/>
<path d="M200 175V470M320 175V470M440 175V470" stroke="#b3cbd9" stroke-dasharray="5 5"/>
<circle cx="440" cy="220" r="12" fill="#c65919"/><text x="490" y="227">v = 0</text>
<circle cx="320" cy="330" r="12" fill="#c65919"/>
<path d="M320 330H440" stroke="#145d81" stroke-width="4" marker-end="url(#arr)"/><text x="480" y="337">+6 m/s</text>
<circle cx="320" cy="440" r="12" fill="#c65919"/>
<path d="M320 440H200" stroke="#145d81" stroke-width="4" marker-end="url(#arr)"/><text x="65" y="447">−6 m/s</text>
<text x="35" y="520">Frecce di v: 20 px/(m/s), scala distinta.</text>
<text x="35" y="560">I due passaggi al centro non sono simultanei.</text>
<path d="M35 600H605" stroke="#b3cbd9"/>
<text x="35" y="645" font-size="25" font-weight="700">2 · v cambia segno, il massimo no</text>
<text x="35" y="685">v = −6 sinθ m/s · θ = ωt</text>
<text x="35" y="725">Fase: 200/π px/rad · v: 20 px/(m/s)</text>
<path d="M80 900H555" stroke="#142d40" stroke-width="2" marker-end="url(#arr)"/>
<path d="M100 1050V750" stroke="#142d40" stroke-width="2" marker-end="url(#arr)"/>
<text x="565" y="907">θ</text><text x="73" y="745">v</text>
