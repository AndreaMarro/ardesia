<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1740" viewBox="0 0 640 1740" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Modulo dell’altezza sullo schermo</title><desc id="desc">Immagine capovolta con altezze amplificate rispetto alle distanze assiali, barre dei moduli e curva dell’altezza con oggetto da un millimetro.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#306f8c"/></marker></defs><rect x="0" y="0" width="640" height="1740" fill="white"/><text x="35" y="48" font-size="25" fill="#203247" text-anchor="start">Dall’oggetto al modulo dell’altezza</text><text x="35" y="105" font-size="22" fill="#203247" text-anchor="start">1 · f = 2 cm; p = q = 4 cm</text><text x="35" y="155" font-size="18" fill="#203247" text-anchor="start">Altezze amplificate; distanze assiali in cm.</text><line x1="65" y1="320" x2="575" y2="320" stroke="#526474" stroke-width="2"/><line x1="320" y1="195" x2="320" y2="435" stroke="#87949c" stroke-width="2"/><path d="M160 320L160 280" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M480 320L480 360" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M160 280L320 280" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M320 280L560 400" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M160 280L560 380" fill="none" stroke="#8b5d35" stroke-width="2" marker-end="url(#arr)"/><circle cx="240" cy="320" r="3" fill="#266b89"/><text x="240" y="365" font-size="18" fill="#203247" text-anchor="middle">F</text><circle cx="320" cy="320" r="3" fill="#266b89"/><text x="320" y="365" font-size="18" fill="#203247" text-anchor="middle">O</text><circle cx="400" cy="320" r="3" fill="#266b89"/><text x="400" y="365" font-size="18" fill="#203247" text-anchor="middle">F′</text><text x="70" y="250" font-size="18" fill="#203247" text-anchor="start">h_o = 1 mm</text><text x="450" y="445" font-size="18" fill="#203247" text-anchor="start">H = 1 mm</text><text x="35" y="510" font-size="19" fill="#203247" text-anchor="start">L’immagine è capovolta: h_i = −1 mm.</text><text x="35" y="550" font-size="19" fill="#203247" text-anchor="start">Il modulo H resta positivo.</text><text x="35" y="650" font-size="22" fill="#203247" text-anchor="start">2 · Due moduli e la media</text><text x="130" y="742" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="150" y="720" width="80" height="30" fill="#3d7791"/><text x="240" y="744" font-size="18" fill="#203247" text-anchor="start">1 mm</text><text x="130" y="842" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="150" y="820" width="320" height="30" fill="#986c35"/><text x="480" y="844" font-size="18" fill="#203247" text-anchor="start">4 mm</text><text x="130" y="942" font-size="18" fill="#203247" text-anchor="end">media</text><rect x="150" y="920" width="200.0" height="30" fill="#637e55"/><text x="360.0" y="944" font-size="18" fill="#203247" text-anchor="start">(5/2) mm</text><text x="35" y="1010" font-size="19" fill="#203247" text-anchor="start">A: h_o = 1 mm,p = 4 cm</text><text x="35" y="1050" font-size="19" fill="#203247" text-anchor="start">B: h_o = 2 mm,p = 3 cm</text><text x="35" y="1130" font-size="22" fill="#203247" text-anchor="start">3 · Solo h_o = 1 mm e f = 2 cm</text><line x1="150" y1="1510" x2="560" y2="1510" stroke="#526474" stroke-width="2"/><line x1="150" y1="1510" x2="150" y2="1180" stroke="#526474" stroke-width="2"/><line x1="270" y1="1190" x2="270" y2="1510" stroke="#8e9ca4" stroke-width="2" stroke-dasharray="7 6"/><path d="M318.00000 1210.00000 L319.92000 1221.53846 L321.84000 1232.22222 L323.76000 1242.14286 L325.68000 1251.37931 L327.60000 1260.00000 L329.52000 1268.06452 L331.44000 1275.62500 L333.36000 1282.72727 L335.28000 1289.41176 L337.20000 1295.71429 L339.12000