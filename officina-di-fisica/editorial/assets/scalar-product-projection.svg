<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1030" role="img" aria-labelledby="title desc">
<title id="title">Dall’angolo al prodotto scalare</title><desc id="desc">Prima tappa: due vettori A e B con origine comune e angolo theta. Seconda tappa: la proiezione orientata di B sulla direzione di A è b cos theta. Terza tappa: il prodotto scalare è a volte tale proiezione. Per zero gradi è ab, per novanta gradi zero, per centottanta gradi meno ab. Il disegno obliquo è schematico e non assegna un angolo ai quesiti.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1030" rx="18" fill="#faf8f2"/>
<g font-family="system-ui,sans-serif" fill="#142f3b"><text x="28" y="38" font-size="23" font-weight="700">L’angolo decide il contributo</text>
<g font-size="21" font-weight="650"><text x="28" y="84">1 · Leggi l’angolo fra i vettori</text><text x="28" y="414">2 · Proietta B sulla direzione di A</text><text x="28" y="764">3 · Moltiplica la proiezione per a</text></g>
<g stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M90 300H450" stroke="#12617c"/><path d="M90 630H450" stroke="#12617c"/><path d="M90 300L330 120" stroke="#9b4b20"/><path d="M90 630L330 450" stroke="#9b4b20"/></g>
<g stroke="#142f3b" stroke-width="2" fill="none"><path d="M140 300A50 50 0 0 0 130 270M140 630A50 50 0 0 0 130 600"/><path d="M330 450V665" stroke-dasharray="7 6"/><path d="M90 650V674M90 662H330M330 650V674"/><path d="M312 630V612H330"/></g>
<g font-size="20"><text x="464" y="307">A (modulo a)</text><text x="342" y="128">B (modulo b)</text><text x="147" y="288">θ</text><text x="464" y="637">A</text><text x="342" y="458">B</text><text x="147" y="618">θ</text><text x="154" y="699">b cos θ</text><text x="28" y="352">Schema obliquo: θ non è un dato numerico.</text><text x="28" y="808">S = a · (b cos θ) = ab cos θ</text><text x="28" y="860">Concordi: θ = 0° → S = ab</text><text x="28" y="902">Perpendicolari: θ = 90° → S = 0</text><text x="28" y="944">Opposti: θ = 180° → S = −ab</text><text x="28" y="996">S è uno scalare; il segno dipende dal coseno.</text></g></g></svg>
