<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1310" role="img" aria-labelledby="title desc">
<title id="title">Potenziale scalare e superfici sferiche equipotenziali</title>
<desc id="desc">Una carica di un nanocoulomb dà tre volt a tre metri. Nel caso distinto in cui il potenziale vale dodici volt alla distanza r, una sfera di raggio due r ha sei volt. I cerchi sono sezioni di sfere. Due altre letture di tre e diciotto volt hanno media ventuno mezzi volt.</desc>
<rect width="640" height="1310" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Un valore scalare nel punto P</text>
<text x="32" y="83" font-size="18">Q = 1 nC ; riferimento V = 0 all’infinito.</text>
<circle cx="110" cy="165" r="15" fill="none" stroke="#b45328" stroke-width="2"/>
<text x="102" y="172">+</text><text x="70" y="205">Q fissa</text>
<circle cx="350" cy="165" r="4" fill="#14243a"/>
<text x="337" y="205">P</text><text x="380" y="170">V(P) = 3 V</text>
<path d="M110 247H350M110 235V259M350 235V259" stroke="#14243a" stroke-width="2" fill="none"/>
<text x="205" y="287">3 m</text>
<text x="32" y="330" font-size="18">Il potenziale non è una forza né un vettore.</text>
<path d="M32 364H608" stroke="#9babbc"/>
<text x="32" y="409" font-size="25" font-weight="bold">2 · Il caso distinto: da 12 a 6 volt</text>
<text x="32" y="449" font-size="18">Sezioni di sfere equipotenziali, centro nella carica.</text>
<circle cx="300" cy="610" r="135" fill="none" stroke="#28664d" stroke-width="3"/>
<circle cx="300" cy="610" r="67.5" fill="none" stroke="#165a87" stroke-width="3"/>
<circle cx="300" cy="610" r="12" fill="none" stroke="#b45328" stroke-width="2"/>
<text x="292" y="617">+</text>
<text x="32" y="786" font-size="18">Sfera interna: distanza r, potenziale 12 V.</text>
<text x="32" y="818" font-size="18">Sfera esterna: distanza 2r, potenziale 6 V.</text>
<path d="M32 853H608" stroke="#9babbc"/>
<text x="32" y="898" font-size="25" font-weight="bold">3 · Due prove con la stessa origine</text>
<text x="32" y="936" font-size="18">A: 1 nC a 3 m ; C: 4 nC a 2 m.</text>
<path d="M150 966V1200" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="986" width="60" height="34" fill="#165a87"/>
<rect x="150" y="1057" width="360" height="34" fill="#b45328"/>
<rect x="150" y="1128" width="210" height="34" fill="#28664d"/>
<text x="50" y="1012">A</text><text x="230" y="1012">3 V</text>
<text x="50" y="1083">C</text><text x="530" y="1083">18 V</text>
<text x="32" y="1154">Media</text><text x="380" y="1154">21/2 V</text>
<text x="125" y="1195">0</text>
<text x="32" y="1247" font-size="18">Media delle letture: (3 + 18)/2 = 21/2 V.</text>
<text x="32" y="1279" font-size="18">Barre del potenziale in V, stessa origine e scala.</text>
</g></svg>
