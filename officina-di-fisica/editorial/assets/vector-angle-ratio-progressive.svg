<svg xmlns="http://www.w3.org/2000/svg" width="600" height="970" viewBox="0 0 600 970" role="img" aria-labelledby="title desc">
<title id="title">Seno e coseno nel triangolo tre, quattro, cinque</title>
<desc id="desc">Tre tappe con la stessa scala sui due assi, quaranta pixel per centimetro. Il triangolo ha base quattro centimetri, altezza tre centimetri e ipotenusa cinque centimetri. L’angolo theta è all’estremità sinistra della base. Pitagora ricostruisce il cateto adiacente: radice di venticinque meno nove uguale quattro. Poi seno tre quinti e coseno quattro quinti.</desc>
<rect width="600" height="970" fill="#fffdf7"/>
<g fill="#173d50" font-family="sans-serif" font-size="23">
<text x="28" y="40" font-weight="bold">1 · Collocare i dati rispetto a θ</text>
<text x="28" y="78">Scala comune: 40 px per centimetro.</text>
<path d="M100 280H260V160Z" fill="#cee2de" stroke="#173d50" stroke-width="3"/>
<path d="M245 280V265H260" fill="none" stroke="#173d50" stroke-width="2"/>
<path d="M140 280A40 40 0 0 0 132 256" fill="none" stroke="#173d50" stroke-width="2"/>
<text x="145" y="267">θ</text><text x="280" y="224">opposto: 3 cm</text><text x="100" y="147">ipotenusa: 5 cm</text><text x="105" y="316">adiacente: a = ?</text>
<path d="M28 342H572" stroke="#879b9a"/>
<text x="28" y="382" font-weight="bold">2 · Ricostruire il cateto mancante</text>
<text x="28" y="424">a² = 5² − 3² = 25 − 9 = 16 cm²</text>
<text x="28" y="466">a = 4 cm · radice positiva</text>
<path d="M100 648H260V528Z" fill="#cee2de" stroke="#173d50" stroke-width="3"/>
<path d="M245 648V633H260" fill="none" stroke="#173d50" stroke-width="2"/>
<text x="108" y="686">adiacente: 4 cm</text><text x="278" y="594">3 cm</text><text x="119" y="523">5 cm</text>
<path d="M28 720H572" stroke="#879b9a"/>
<text x="28" y="760" font-weight="bold">3 · Dividere per l’ipotenusa</text>
<text x="28" y="804">sinθ = opposto / ipotenusa = 3/5</text>
<text x="28" y="848">cosθ = adiacente / ipotenusa = 4/5</text>
<text x="28" y="898">Le unità si cancellano: cm / cm = 1.</text>
<text x="28" y="942">Controllo: (3/5)² + (4/5)² = 1.</text>
</g></svg>
