<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1800" viewBox="0 0 640 1800" role="img" aria-labelledby="title desc"><title id="title">Superficie orientata e flusso</title><desc id="desc">Quattro tappe: normale concorde al campo e superficie aperta; continuazione delle linee del magnete a barra all’esterno e all’interno; barre dei flussi e della media con scala comune; grafico lineare a superficie tre metri quadrati.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1800" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Superficie orientata e flusso</text><text x="32" y="92" font-size="22" text-anchor="start">1 · Una superficie aperta orientata</text><path d="M150 310L410 310L490 370L230 370Z" fill="#dbe9f2" stroke="#316b9b" stroke-width="2"/><line x1="300" y1="310" x2="300" y2="180" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="410" y1="310" x2="410" y2="220" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="165" font-size="18" text-anchor="start">B = 2 T</text><text x="430" y="215" font-size="18" text-anchor="start">n positiva</text><text x="250" y="355" font-size="18" text-anchor="start">A = 3 m²</text><text x="32" y="415" font-size="18" text-anchor="start">B concorde a n: Φ = BA = 6 Wb.</text><text x="32" y="455" font-size="22" text-anchor="start">2 · La continuazione dentro il magnete</text><rect x="150" y="560" width="170" height="70" fill="#d9a2a2"/><rect x="320" y="560" width="170" height="70" fill="#a2c5d9"/><text x="190" y="585" font-size="20" text-anchor="start">N</text><text x="430" y="585" font-size="20" text-anchor="start">S</text><path d="M170 600V540Q320 430 470 540V600" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="470" y1="600" x2="170" y2="600" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="250" y="535" font-size="18" text-anchor="start">Esterno: N → S</text><text x="250" y="680" font-size="18" text-anchor="start">Interno: S → N</text><text x="32" y="745" font-size="18" text-anchor="start">Le due parti completano la linea illustrata.</text><text x="32" y="785" font-size="18" text-anchor="start">Non si interrompe sui poli o nel materiale.</text><text x="32" y="885" font-size="22" text-anchor="start">3 · Due flussi e la media</text><text x="128" y="964" font-size="18" text-anchor="end">A</text><rect x="150" y="940" width="240" height="32" fill="#316b9b"/><text x="402" y="964" font-size="18" text-anchor="start">6 Wb</text><text x="128" y="1054" font-size="18" text-anchor="end">B</text><rect x="150" y="1030" width="160" height="32" fill="#316b9b"/><text x="322" y="1054" font-size="18" text-anchor="start">4 Wb</text><text x="128" y="1144" font-size="18" text-anchor="end">Media</text><rect x="150" y="1120" width="200" height="32" fill="#316b9b"/><text x="362" y="1144" font-size="18" text-anchor="start">5 Wb</text><text x="32" y="1220" font-size="18" text-anchor="start">Barre alla stessa scala; media con pesi uguali.</text><text x="32" y="1310" font-size="22" text-anchor="start">4 · Solo B varia: A = 3 m²</text><line x1="145" y1="1600" x2="520" y2="1600" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1605" x2="150" y2="1370" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1600" x2="390" y2="1420" stroke="#52667a" stroke-width="2"/><circle cx="150" cy="1600" r="4" fill="#f7fafc" stroke="#316b9b" stroke-width="2"/><circle cx="390" cy="1420" r="5" fill="#316b9b"/><text x="128" y="1625" font-size="18" text-anchor="end">0</text><text x="390" y="1630" font-size="18" text-anchor="middle">2</text><text x="128" y="1426" font-size="18" text-anchor="end">6</text><text x="535" y="1610" font-size="18" text-anchor="start">B (T)</text><text x="90" y="1360" font-size="18" text-anchor="start">Φ (Wb)</text><text x="32" y="1700" font-size="18" text-anchor="start">Relazione lineare; si mostra B positivo fino a 2 T.</text><text x="32" y="1740" font-size="18" text-anchor="start">L’origine è esclusa dal dominio B > 0.</text></g></svg>
