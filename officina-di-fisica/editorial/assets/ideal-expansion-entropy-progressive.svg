<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1510" role="img" aria-labelledby="title desc">
<title id="title">Contare raddoppi e distinguere gas e insieme</title>
<desc id="desc">Due stati dello stesso gas a uguale temperatura hanno volumi uno e due litri. Un raddoppio dà una variazione B. Due prove con B due e quattro joule per kelvin, rapporti di volume due e quattro, danno variazioni due e otto e media cinque. Un diverso campione con B quattro compie un raddoppio reversibile e poi una libera espansione per quattro: il gas guadagna dodici, la sorgente perde quattro e l’insieme guadagna otto joule per kelvin.</desc>
<rect width="640" height="1510" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Gli estremi di un raddoppio</text>
<text x="32" y="83" font-size="18">Stesso campione; temperatura T uguale nei due stati.</text>
<rect x="70" y="135" width="100" height="110" fill="#e4f3fa" stroke="#165a87" stroke-width="2"/>
<rect x="340" y="135" width="200" height="110" fill="#e0efe7" stroke="#28664d" stroke-width="2"/>
<text x="70" y="286">V_i = 1 L</text><text x="370" y="286">V_f = 2 L</text>
<text x="32" y="331" font-size="18">Sezione comune: lunghezza doppia, volume doppio.</text>
<text x="32" y="365" font-size="18">r = 2 ; ln r / ln 2 = 1 ; con B = 2 J/K, ΔS = 2 J/K.</text>
<path d="M32 405H608" stroke="#9babbc"/>
<text x="32" y="451" font-size="25" font-weight="bold">2 · Due prove, poi la loro media</text>
<text x="32" y="491" font-size="18">A: B = 2 J/K, r = 2 ; C: B = 4 J/K, r = 4.</text>
<text x="32" y="526" font-size="18">ln 4 / ln 2 = 2 : due raddoppi nel secondo campione.</text>
<path d="M130 563V831" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="586" width="90" height="36" fill="#165a87"/>
<rect x="130" y="664" width="360" height="36" fill="#b45328"/>
<rect x="130" y="742" width="225" height="36" fill="#28664d"/>
<text x="50" y="614">A</text><text x="242" y="614">2 J/K</text>
<text x="50" y="692">C</text><text x="512" y="692">8 J/K</text>
<text x="32" y="770">Media</text><text x="377" y="770">5 J/K</text>
<text x="105" y="826">0</text>
<text x="32" y="879" font-size="18">Variazioni in J/K, stessa origine e scala delle barre.</text>
<text x="32" y="913" font-size="18">Sono prove diverse, non un gas che cambia quantità.</text>
<path d="M32 953H608" stroke="#9babbc"/>
<text x="32" y="999" font-size="25" font-weight="bold">3 · Due tappe di un altro campione</text>
<text x="32" y="1039" font-size="18">B = 4 J/K fissato : prima ×2 reversibile, poi ×4 libera.</text>
<text x="32" y="1074" font-size="18">Gas: +4 + 8 = +12 J/K ; sorgente: −4 J/K.</text>
<path d="M250 1110V1390" stroke="#14243a" stroke-width="2"/>
<rect x="250" y="1135" width="300" height="40" fill="#165a87"/>
<rect x="150" y="1221" width="100" height="40" fill="#b45328"/>
<rect x="250" y="1307" width="200" height="40" fill="#28664d"/>
<text x="40" y="1164">Gas</text><text x="347" y="1163" fill="white">+12 J/K</text>
<text x="40" y="1250">Sorgente</text><text x="157" y="1249" font-size="18" fill="white">−4 J/K</text>
<text x="40" y="1336">Insieme</text><text x="299" y="1335" fill="white">+8 J/K</text>
<text x="244" y="1425">0</text>
<text x="32" y="1466" font-size="18">Bilancio con segno in J/K : 12 − 4 = 8.</text>
</g></svg>
