<svg xmlns="http://www.w3.org/2000/svg" width="600" height="890" viewBox="0 0 600 890" role="img" aria-labelledby="title desc">
<title id="title">Spostamento uniforme in due secondi</title>
<desc id="desc">Tre tappe. Si sceglie x positivo verso destra e x iniziale zero per il disegno. Le posizioni a zero, uno e due secondi sono zero, due e quattro metri, con scala orizzontale ottanta pixel per metro. Nel grafico velocità-tempo, una linea costante a due metri al secondo delimita in due secondi un rettangolo di area quattro metri. Il grafico usa cento pixel per secondo e sessanta pixel per metro al secondo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#173d50"/></marker></defs>
<rect width="600" height="890" fill="#fffdf7"/>
<g fill="#173d50" font-family="sans-serif" font-size="23">
<text x="28" y="40" font-weight="bold">1 · Scegliere il verso dell’asse</text>
<text x="28" y="82">Il carrello avanza a +2 m/s.</text>
<path d="M95 220H500" stroke="#173d50" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="95" y="146" width="72" height="42" rx="6" fill="#cee2de" stroke="#173d50" stroke-width="2"/>
<circle cx="110" cy="197" r="9"/><circle cx="151" cy="197" r="9"/>
<path d="M190 166H370" stroke="#173d50" stroke-width="3" marker-end="url(#arrow)"/>
<text x="390" y="174">v &gt; 0</text><text x="514" y="228">+x</text>
<text x="28" y="282" font-weight="bold">2 · Aggiungere due metri ogni secondo</text>
<text x="28" y="322">Nel disegno: x₀ = 0 · scala 80 px/m.</text>
<path d="M70 440H510" stroke="#879b9a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M100 428V452M260 428V452M420 428V452" stroke="#173d50" stroke-width="3"/>
<circle cx="100" cy="440" r="6"/><circle cx="260" cy="440" r="6"/><circle cx="420" cy="440" r="6"/>
<text x="75" y="380">0 s</text><text x="235" y="380">1 s</text><text x="395" y="380">2 s</text>
<text x="75" y="414">0 m</text><text x="235" y="414">2 m</text><text x="395" y="414">4 m</text>
<text x="28" y="490">D = x_finale − x_iniziale = +4 m</text>
<path d="M28 516H572" stroke="#879b9a"/>
<text x="28" y="558" font-weight="bold">3 · L’area nel grafico velocità-tempo</text>
<text x="28" y="600">La velocità resta costante per 2 s.</text>
<rect x="100" y="680" width="200" height="120" fill="#cee2de"/>
<path d="M100 800V632M100 800H460" stroke="#173d50" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M100 680H300" stroke="#173d50" stroke-width="4"/>
<path d="M300 680V800" stroke="#173d50" stroke-width="2" stroke-dasharray="6 5"/>
<text x="30" y="688">2 m/s</text><text x="150" y="750" font-weight="bold">D = 4 m</text>
<text x="88" y="830">0</text><text x="280" y="830">2 s</text><text x="472" y="808">Δt</text><text x="118" y="648">v</text>
<text x="28" y="875">D = v Δt = (2 m/s)(2 s) = 4 m</text>
</g></svg>
