<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Due materiali in successione</title><desc id="desc">Trasmissioni successive, media fra preparazioni e curva al variare del solo secondo spessore.</desc><rect x="0" y="0" width="640" height="1600" fill="#fff"/><text x="35" y="48" font-size="25" fill="#203247" text-anchor="start">Le frazioni si moltiplicano</text><text x="35" y="105" font-size="22" fill="#203247" text-anchor="start">1 · d₁ = d₂ = 1 cm</text><rect x="210" y="150" width="80" height="85" fill="#d8e7ee"/><rect x="400" y="150" width="80" height="85" fill="#efe2d1"/><text x="180" y="275" font-size="18" fill="#203247" text-anchor="start">μ₁ = (ln 2) cm⁻¹</text><text x="380" y="305" font-size="18" fill="#203247" text-anchor="start">μ₂ = (2 ln 2) cm⁻¹</text><line x1="80" y1="192" x2="550" y2="192" stroke="#526474" stroke-width="2"/><text x="35" y="355" font-size="19" fill="#203247" text-anchor="start">1 → 1/2 → 1/8 del fascio incidente</text><text x="130" y="430" font-size="18" fill="#203247" text-anchor="end">prima</text><rect x="150" y="410" width="400" height="25" fill="#3d7791"/><text x="560" y="431" font-size="18" fill="#203247" text-anchor="start">1</text><text x="130" y="490" font-size="18" fill="#203247" text-anchor="end">dopo 1</text><rect x="150" y="470" width="200.0" height="25" fill="#3d7791"/><text x="360.0" y="491" font-size="18" fill="#203247" text-anchor="start">1/2</text><text x="130" y="550" font-size="18" fill="#203247" text-anchor="end">dopo 2</text><rect x="150" y="530" width="50.0" height="25" fill="#3d7791"/><text x="210.0" y="551" font-size="18" fill="#203247" text-anchor="start">1/8</text><text x="35" y="610" font-size="22" fill="#203247" text-anchor="start">2 · Due preparazioni e la loro media</text><text x="130" y="691" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="150" y="670" width="240" height="28" fill="#3d7791"/><text x="400" y="692" font-size="19" fill="#203247" text-anchor="start">1/8</text><text x="130" y="771" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="150" y="750" width="30" height="28" fill="#986c35"/><text x="190" y="772" font-size="19" fill="#203247" text-anchor="start">1/64</text><text x="130" y="851" font-size="18" fill="#203247" text-anchor="end">media</text><rect x="150" y="830" width="135" height="28" fill="#637e55"/><text x="295" y="852" font-size="19" fill="#203247" text-anchor="start">9/128</text><text x="35" y="918" font-size="19" fill="#203247" text-anchor="start">A: 1 cm e 1 cm · B: 2 cm e 2 cm</text><text x="35" y="990" font-size="22" fill="#203247" text-anchor="start">3 · Cambia soltanto d₂; d₁ resta 1 cm</text><line x1="150" y1="1450" x2="550" y2="1450" stroke="#526474" stroke-width="2"/><line x1="150" y1="1450" x2="150" y2="1090" stroke="#526474" stroke-width="2"/><line x1="150" y1="1444" x2="150" y2="1456" stroke="#526474" stroke-width="2"/><text x="150" y="1485" font-size="18" fill="#203247" text-anchor="middle">0</text><line x1="260" y1="1444" x2="260" y2="1456" stroke="#526474" stroke-width="2"/><text x="260" y="1485" font-size="18" fill="#203247" text-anchor="middle">1</text><line x1="370" y1="1444" x2="370" y2="1456" stroke="#526474" stroke-width="2"/><text x="370" y="1485" font-size="18" fill="#203247" text-anchor="middle">2</text><line x1="480" y1="1444" x2="480" y2="1456" stroke="#526474" stroke-width="2"/><text x="480" y="1485" font-size="18" fill="#203247" text-anchor="middle">3</text><line x1="144" y1="1130.0" x2="156" y2="1130.0" stroke="#526474" stroke-width="2"/><text x="132" y="1136.0" font-size="18" fill="#203247" text-anchor="end">1/2</text><line x1="144" y1="1370.0" x2="156" y2="1370.0" stroke="#526474" stroke-width="2"/><text x="132" y="1376.0" font-size="18" fill="#203247" text-anchor="end">1/8</text><line x1="144" y1="1430.0" x2="156" y2="1430.0" stroke="#526474" stroke-width