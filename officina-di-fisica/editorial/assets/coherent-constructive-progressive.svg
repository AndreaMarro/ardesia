<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1620" viewBox="0 0 640 1620" role="img" aria-labelledby="t d"><title id="t">Ampiezze coerenti e inversione di fase</title><desc id="d">Coefficienti di spostamento in fase uno più due uguale tre millimetri. Caso distinto: ampiezze tre e quattro millimetri in fase danno sette, in opposizione danno modulo uno e rapporto di intensità un quarantanovesimo.</desc><rect width="640" height="1620" rx="24" fill="#f5faff"/><g font-family="Arial,sans-serif" font-size="20" fill="#163047"><text x="35" y="50" font-size="26" font-weight="bold">1 · Massimo positivo comune</text><text x="35" y="100">Stesso punto, frequenza e polarizzazione</text><text x="35" y="145">Fase relativa zero · segmenti: 100 px/mm</text><text x="35" y="210">A₁ = 1 mm</text><path d="M100 250H200" stroke="#196082" stroke-width="12"/><text x="35" y="315">A₂ = 2 mm</text><path d="M100 355H300" stroke="#bc5315" stroke-width="12"/><text x="35" y="420">Aₜ = 3 mm</text><path d="M100 460H400" stroke="#447d5e" stroke-width="12"/><text x="35" y="525">Segmenti di spostamento, non forze</text><path d="M35 570H605" stroke="#b5cbd9"/><text x="35" y="625" font-size="26" font-weight="bold">2 · Lo stesso fattore armonico</text><text x="35" y="685">x₁ = A₁ cosφ</text><text x="35" y="740">x₂ = A₂ cosφ</text><text x="35" y="805">x = (A₁ + A₂) cosφ</text><text x="35" y="865">Aₜ = A₁ + A₂ = 3 mm</text><text x="35" y="925">La fase è comune anche nei minimi.</text><path d="M35 970H605" stroke="#b5cbd9"/><text x="35" y="1025" font-size="26" font-weight="bold">3 · Caso 06: inversione di fase</text><text x="35" y="1080">Altri dati: A₁ = 3 mm, A₂ = 4 mm</text><text x="35" y="1130">Qui scala 60 px/mm · non 100 px/mm</text><text x="35" y="1190">Prima, in fase: Aₜ = 7 mm</text><path d="M90 1230H510" stroke="#196082" stroke-width="12"/><text x="35" y="1300">Dopo, fase π: Aₜ = |3 − 4| = 1 mm</text><path d="M90 1340H150" stroke="#bc5315" stroke-width="12"/><text x="35" y="1420">Rapporto di ampiezze: 1/7</text><text x="35" y="1480">Rapporto di intensità: (1/7)² = 1/49</text><text x="35" y="1550">Ampiezza positiva; la fase porta il segno.</text></g></svg>
