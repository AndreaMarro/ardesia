<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1390" viewBox="0 0 640 1390" role="img" aria-labelledby="title desc"><title id="title">Energia cinetica e interna in un urto con corpi uniti</title><desc id="desc">Masse uguali di due chilogrammi: prima una massa a due metri al secondo e l’altra ferma, dopo velocità comune un metro al secondo. Scala velocità sessanta pixel per metro al secondo. Barre energetiche quaranta pixel per joule, con energia finale cinetica più interna uguale all’iniziale.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1390" rx="20" fill="#faf8f1"/>
<g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Prima: una massa si muove, l’altra no</text><text x="28" y="90">m = 2 kg ciascuna; asse +x verso destra.</text><rect x="130" y="220" width="60" height="60" fill="#cde4e6" stroke="#193a49"/><rect x="400" y="220" width="60" height="60" fill="#e6d8bc" stroke="#193a49"/><path d="M160 190H280" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><text x="130" y="330">u = +2 m/s</text><text x="400" y="330">velocità = 0</text><text x="28" y="385">p iniziale = 4 kg·m/s; K iniziale = 4 J.</text>
<text x="28" y="470" font-size="25">2 · Dopo: il gruppo ha massa 4 kg</text><rect x="230" y="610" width="60" height="60" fill="#cde4e6" stroke="#193a49"/><rect x="290" y="610" width="60" height="60" fill="#e6d8bc" stroke="#193a49"/><path d="M290 580H350" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><text x="230" y="720">V = +1 m/s</text><text x="28" y="770">p finale = 4 kg·m/s; K finale = 2 J.</text><text x="28" y="815">Velocità: 60 px per m/s in entrambi i pannelli.</text>
<text x="28" y="905" font-size="25">3 · I due joule non sono scomparsi</text><text x="28" y="955">Scala energia: 40 px/J.</text><path d="M180 995V1160" stroke="#7f9994"/><rect x="180" y="1010" width="160" height="38" fill="#cde4e6"/><rect x="180" y="1100" width="80" height="38" fill="#cde4e6"/><rect x="260" y="1100" width="80" height="38" fill="#e2ad71"/><text x="35" y="1038">Prima: 4 J</text><text x="35" y="1128">Dopo: 4 J</text><text x="375" y="1038">K iniziale</text><text x="375" y="1128">K finale + ΔU interna</text><text x="28" y="1210">K finale = 2 J; aumento interno E = 2 J.</text><text x="28" y="1255">E = K iniziale − K finale = 2 J &gt; 0.</text><text x="28" y="1300">Variazione cinetica −E; variazione interna +E.</text><text x="28" y="1345">Sistema isolato durante l’urto; corpi schematici.</text></g></svg>
