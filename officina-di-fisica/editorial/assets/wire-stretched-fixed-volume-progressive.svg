<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc">
<title id="title">Allungamento uniforme e volume conservato</title>
<desc id="desc">Diagramma della lunghezza per l’area di sezione: i rettangoli L₀ per A₀ e 2L₀ per A₀/2 conservano il prodotto. L’area di sezione non è il diametro del filo. La resistenza cresce con il quadrato dell’allungamento. Due resistenze finali4 e18 ohm hanno media11.</desc>
<rect width="640" height="1450" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Raddoppia L, si dimezza A</text>
<text x="32" y="82" font-size="18">Diagramma L–A: la sezione non è un diametro.</text>
<path d="M150 110V340H530" fill="none" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="130" width="120" height="80" fill="#165a87"/>
<rect x="150" y="270" width="240" height="40" fill="#28664d"/>
<text x="42" y="174">A₀</text><text x="290" y="174">L₀</text>
<text x="42" y="299">A₀/2</text><text x="410" y="299">2L₀</text>
<text x="32" y="389" font-size="18">Stesso prodotto LA = L₀A₀ ; ρ invariata.</text>
<text x="32" y="423" font-size="18">Il rettangolo rappresenta L × A, non il profilo del filo.</text>
<path d="M32 464H608" stroke="#9babbc"/>
<text x="32" y="509" font-size="25" font-weight="bold">2 · La resistenza segue s²</text>
<text x="32" y="550" font-size="18">R₀ = 1 Ω ; dominio s ≥ 1 ; non una legge temporale.</text>
<path d="M100 640V860H510" fill="none" stroke="#14243a" stroke-width="2"/>
<path d="M220 840Q340 800 460 680" fill="none" stroke="#165a87" stroke-width="4"/>
<circle cx="220" cy="840" r="4" fill="#14243a"/><circle cx="340" cy="780" r="4" fill="#14243a"/><circle cx="460" cy="680" r="4" fill="#14243a"/>
<text x="38" y="650">R (Ω)</text><text x="515" y="864">s</text>
<text x="76" y="885">0</text><text x="215" y="895">1</text><text x="335" y="895">2</text><text x="455" y="895">3</text>
<text x="185" y="810">1 Ω</text><text x="277" y="754">4 Ω</text><text x="475" y="680">9 Ω</text>
<text x="32" y="944" font-size="18">La curva inizia a s = 1 ; il filo non si accorcia.</text>
<path d="M32 982H608" stroke="#9babbc"/>
<text x="32" y="1027" font-size="25" font-weight="bold">3 · Due preparazioni e una media</text>
<text x="32" y="1066" font-size="18">A: R₀ = 1 Ω,s = 2 ; B: R₀ = 2 Ω,s = 3.</text>
<path d="M150 1090V1340" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="1110" width="80" height="34" fill="#165a87"/>
<rect x="150" y="1190" width="360" height="34" fill="#b45328"/>
<rect x="150" y="1270" width="220" height="34" fill="#28664d"/>
<text x="50" y="1135">A</text><text x="250" y="1135">4 Ω</text>
<text x="50" y="1215">B</text><text x="530" y="1215">18 Ω</text>
<text x="32" y="1295">Media</text><text x="390" y="1295">11 Ω</text><text x="125" y="1334">0</text>
<text x="32" y="1392" font-size="18">Le barre condividono origine e scala in ohm.</text>
</g></svg>
