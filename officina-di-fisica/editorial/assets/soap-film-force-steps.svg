<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1900" viewBox="0 0 640 1900" role="img" aria-labelledby="title desc"><title id="title">Un film liquido, due interfacce</title><desc id="desc">Il lato mobile lungo due centimetri è tirato da due interfacce dello stesso film. Ogni faccia contribuisce un millinewton; la forza totale del film è due millinewton. La forza esterna può equilibrare il film. Infine confronto tra due tensioni e lunghezze differenti.</desc>
<defs><marker id="b" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#1664a7"/></marker><marker id="r" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#a83832"/></marker></defs>
<rect width="640" height="1900" fill="#fffdf6"/><g font-family="Arial,sans-serif" fill="#192f3d" font-size="22">
<text x="35" y="48" font-size="27" font-weight="bold">1. Un film sul telaio</text>
<text x="35" y="95">Due interfacce aria–liquido, stessa γ</text>
<text x="35" y="140">γ = 50 mN/m; lato mobile ℓ = 2 cm</text>
<rect x="170" y="230" width="300" height="200" fill="#dceef8"/>
<path d="M470 230H170V430H470" fill="none" stroke="#92611c" stroke-width="7"/>
<path d="M470 230V430" stroke="#192f3d" stroke-width="8"/>
<path d="M470 330H370" stroke="#1664a7" stroke-width="3" marker-end="url(#b)"/>
<path d="M470 330H570" stroke="#a83832" stroke-width="3" marker-end="url(#r)"/>
<path d="M125 230H145M135 230V430M125 430H145" stroke="#192f3d" fill="none"/>
<text x="35" y="340">2 cm</text>
<text x="230" y="480" fill="#1664a7">Film: 2 mN verso sinistra</text>
<text x="230" y="520" fill="#a83832">Esterno: 2 mN verso destra</text>
<text x="35" y="565">Forze: 50 px/mN, due frecce da 100 px</text>
<text x="35" y="610">Lato: 100 px/cm; larghezza schematica</text>
<text x="35" y="650">Sul lato mantenuto fermo: risultante zero</text>
<path d="M35 690H605" stroke="#c9d1d4"/>
<text x="35" y="740" font-size="27" font-weight="bold">2. Contare le due superfici dello stesso film</text>
<text x="35" y="785">Contributi separati solo per il conteggio</text>
<path d="M250 850H200" stroke="#1664a7" stroke-width="3" marker-end="url(#b)"/>
<text x="285" y="858">Prima: γℓ = 1 mN</text>
<path d="M250 935H200" stroke="#1664a7" stroke-width="3" marker-end="url(#b)"/>
<text x="285" y="943">Seconda: γℓ = 1 mN</text>
<path d="M250 1020H150" stroke="#a83832" stroke-width="3" marker-end="url(#r)"/>
<text x="285" y="1028">Somma: F = 2γℓ = 2 mN</text>
<text x="35" y="1090">Stessa scala: 50 px/mN</text>
<text x="35" y="1135">Le due forze del film hanno lo stesso verso.</text>
<text x="35" y="1180">Non sono due film né forze che si annullano.</text>
<path d="M35 1220H605" stroke="#c9d1d4"/>
<text x="35" y="1270" font-size="27" font-weight="bold">3. Cambiano γ e la lunghezza del bordo</text>
<text x="35" y="1315">Lunghezze: 40 px/cm; forze: 50 px/mN</text>
<text x="35" y="1360">A: γ = 50 mN/m, ℓ = 2 cm, F = 2 mN</text>
<rect x="100" y="1395" width="80" height="20" fill="#1664a7"/>
<text x="35" y="1450">ℓ: 80 px</text>
<path d="M450 1445H350" stroke="#a83832" stroke-width="3" marker-end="url(#r)"/>
<text x="475" y="1453">100 px</text>
<text x="35" y="1530">B: γ = 25 mN/m, ℓ = 5 cm, F = 5/2 mN</text>
<rect x="100" y="1565" width="200" height="20" fill="#1664a7"/>
<text x="35" y="1620">ℓ: 200 px</text>
<path d="M450 1615H325" stroke="#a83832" stroke-width="3" marker-end="url(#r)"/>
<text x="475" y="1623">125 px</text>
<text x="35" y="1690">Rapporto F_B/F_A = (1/2) × (5/2) = 5/4</text>
<text x="35" y="1740">Blu: lunghezze; rosso: forze del film</text>
<text x="35" y="1790">Le scale delle due grandezze sono diverse.</text>
<text x="35" y="1840">Ogni prova mantiene due interfacce.</text>
</g></svg>
