<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 990" role="img" aria-labelledby="t d">
<title id="t">Moto circolare uniforme senza approssimare pi greco</title><desc id="d">Tre tappe: circonferenza con raggio un quinto di metro e periodo due secondi; velocità tangente di modulo pi greco quinti metri al secondo; accelerazione verso il centro di modulo pi greco al quadrato quinti metri al secondo quadrato. Le frecce indicano direzioni di grandezze con unità diverse.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="990" rx="18" fill="#faf8f2"/>
<g font-family="system-ui,sans-serif" fill="#142f3b"><text x="28" y="36" font-size="23" font-weight="700">Una traiettoria, due vettori diversi</text>
<g font-size="21"><text x="28" y="80">1 · Un giro in due secondi</text><text x="28" y="368">2 · La velocità è tangente</text><text x="28" y="656">3 · L’accelerazione punta al centro</text></g>
<g stroke="#6b7477" stroke-width="2" fill="none"><circle cx="150" cy="202" r="80"/><circle cx="150" cy="490" r="80"/><circle cx="150" cy="778" r="80"/><path d="M150 202H230" stroke-dasharray="6 5"/><path d="M150 490H230M150 778H230" stroke-dasharray="6 5"/></g>
<g fill="#142f3b"><circle cx="150" cy="202" r="4"/><circle cx="230" cy="202" r="4"/><circle cx="150" cy="490" r="4"/><circle cx="230" cy="490" r="4"/><circle cx="150" cy="778" r="4"/><circle cx="230" cy="778" r="4"/></g>
<g stroke="#12617c" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M230 490V408M230 778V696"/></g><path d="M230 778H158" stroke="#9b4b20" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<path d="M212 778V760H230" stroke="#142f3b" stroke-width="2" fill="none"/>
<g font-size="20"><text x="304" y="166">r = 1/5 m</text><text x="304" y="206">T = 2 s</text><text x="304" y="246">Un giro: 2πr</text><text x="248" y="426">v</text><text x="304" y="482">v = π/5 m/s</text><text x="304" y="526">Modulo costante</text><text x="248" y="714">v</text><text x="160" y="812">a verso il centro</text><text x="304" y="768">a = π²/5 m/s²</text><text x="304" y="812">v e a perpendicolari</text><text x="28" y="900">Le frecce mostrano le direzioni, non una scala</text><text x="28" y="932">comune fra velocità e accelerazione.</text><text x="28" y="966">Il cerchio conserva raggio e posizione nelle tre tappe.</text></g></g></svg>
