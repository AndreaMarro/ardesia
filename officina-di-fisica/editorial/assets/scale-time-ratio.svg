<svg xmlns="http://www.w3.org/2000/svg" width="320" height="650" viewBox="0 0 320 650" role="img" aria-labelledby="title desc">
<title id="title">Due tempi nella stessa unità</title>
<desc id="desc">Tre tappe verticali. I tempi quattro per dieci alla meno tre secondi e due per dieci alla meno quattro secondi diventano quaranta e due volte dieci alla meno quattro secondi. Nel confronto finale ogni cella rappresenta due per dieci alla meno quattro secondi: il primo tempo contiene venti celle e il secondo una. Le barre hanno la stessa scala lineare.</desc>
<rect width="320" height="650" fill="#fffdf8"/>
<g fill="#193d43" font-family="sans-serif" font-size="18">
<text x="16" y="32">1. Leggi i due tempi</text>
<text x="24" y="84">t₁ = 4 × 10⁻³ s</text><text x="24" y="122">t₂ = 2 × 10⁻⁴ s</text>
<text x="16" y="203">2. Usa una potenza comune</text>
<text x="24" y="255">t₁ = 40 × 10⁻⁴ s</text><text x="24" y="293">t₂ = 2 × 10⁻⁴ s</text>
<text x="16" y="374">3. Conta intervalli uguali</text>
<text x="24" y="411" font-size="16">Una cella vale 2 × 10⁻⁴ s.</text>
<text x="16" y="456">t₁</text><text x="16" y="518">t₂</text>
<text x="24" y="586">t₁ / t₂ = 40 / 2 = 20</text>
<text x="24" y="626" font-size="16">Stessa scala per entrambe le barre.</text>
</g>
<g fill="#e6efec" stroke="#193d43" stroke-width="1.5">
<rect x="48" y="430" width="240" height="36"/><rect x="48" y="492" width="12" height="36"/>
<path fill="none" d="M60 430v36M72 430v36M84 430v36M96 430v36M108 430v36M120 430v36M132 430v36M144 430v36M156 430v36M168 430v36M180 430v36M192 430v36M204 430v36M216 430v36M228 430v36M240 430v36M252 430v36M264 430v36M276 430v36"/>
</g></svg>
