<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1850" viewBox="0 0 640 1850" role="img" aria-labelledby="title desc"><title id="title">Sovrapressione di una goccia a una interfaccia</title><desc id="desc">Una goccia di raggio due millimetri e tensione venti millinewton al metro ha sovrapressione venti pascal. La pressione assoluta interna è la pressione esterna più questo salto. Con tensione fissata il raggio doppio dimezza il salto. L’ultimo pannello confronta due prove in cui cambia anche la tensione.</desc>
<rect width="640" height="1850" fill="#fffdf6"/><g font-family="Arial,sans-serif" fill="#192f3d" font-size="22">
<text x="35" y="48" font-size="27" font-weight="bold">1. Una sola interfaccia sferica</text>
<text x="35" y="95">γ = 20 mN/m; r = 2 mm; Δp = 20 Pa</text>
<text x="35" y="140">Scala geometrica: 40 px/mm</text>
<circle cx="220" cy="300" r="80" fill="#dceef8" stroke="#1664a7" stroke-width="3"/>
<circle cx="220" cy="300" r="4" fill="#192f3d"/>
<path d="M220 300H300" fill="none" stroke="#192f3d" stroke-width="2"/>
<text x="228" y="285">2 mm</text>
<text x="350" y="270">Raggio 80 px</text>
<text x="350" y="325">Una interfaccia</text>
<text x="35" y="435">Pressione esterna assoluta: 100000 Pa</text>
<text x="35" y="480">Pressione interna assoluta: 100020 Pa</text>
<text x="35" y="525">Δp = p_in − p_ext = 20 Pa</text>
<text x="35" y="570">Il raggio disegnato non è una forza.</text>
<path d="M35 610H605" stroke="#c9d1d4"/>
<text x="35" y="660" font-size="27" font-weight="bold">2. Qui γ resta uguale: 20 mN/m</text>
<text x="35" y="705">Gravità deformante trascurata</text>
<text x="35" y="770">r_A = 2 mm</text><text x="355" y="770">r_B = 4 mm</text>
<circle cx="140" cy="975" r="80" fill="#dceef8" stroke="#1664a7" stroke-width="3"/>
<circle cx="450" cy="975" r="160" fill="#dceef8" stroke="#1664a7" stroke-width="3"/>
<circle cx="140" cy="975" r="4" fill="#192f3d"/><circle cx="450" cy="975" r="4" fill="#192f3d"/>
<path d="M140 975H220M450 975H610" fill="none" stroke="#192f3d" stroke-width="2"/>
<text x="35" y="1180">Δp_A = 20 Pa</text><text x="355" y="1180">Δp_B = 10 Pa</text>
<text x="35" y="1235">Raggi 80 e 160 px, stessa scala 40 px/mm</text>
<path d="M35 1280H605" stroke="#c9d1d4"/>
<text x="35" y="1330" font-size="27" font-weight="bold">3. Ora cambiano sia γ sia r</text>
<text x="35" y="1375">A: γ = 20 mN/m, r = 2 mm → Δp = 20 Pa</text>
<rect x="100" y="1410" width="100" height="30" fill="#1664a7"/>
<text x="250" y="1435">100 px</text>
<text x="35" y="1515">B: γ = 30 mN/m, r = 4 mm → Δp = 15 Pa</text>
<rect x="100" y="1550" width="75" height="30" fill="#1664a7"/>
<text x="250" y="1575">75 px</text>
<text x="35" y="1655">Barre di sovrapressione: 5 px/Pa</text>
<text x="35" y="1705">Rapporto Δp_B/Δp_A = (3/2)/2 = 3/4</text>
<text x="35" y="1755">La pressione è scalare: le barre non sono forze.</text>
<text x="35" y="1805">Non si rappresentano le pressioni assolute.</text>
</g></svg>
