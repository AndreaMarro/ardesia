<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 750" role="img" aria-labelledby="title desc">
<title id="title">Andata, ritorno e spostamento risultante</title><desc id="desc">Tre pannelli con asse da zero a cinque metri. Prima freccia verso est da zero a quattro, seconda freccia verso ovest da quattro a tre, terza freccia risultante da zero a tre. Il cammino è cinque metri e lo spostamento ha modulo tre metri.</desc>
<defs><marker id="east" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="750" rx="20" fill="#faf8f2"/>
<g font-family="system-ui,sans-serif" fill="#142f3b">
<text x="28" y="38" font-size="23" font-weight="700">Stessa origine, stessa scala</text>
<g font-size="19"><text x="28" y="84">1 · Andata: +4 m verso est</text><text x="28" y="292">2 · Ritorno: −1 m verso ovest</text><text x="28" y="500">3 · Partenza → arrivo: +3 m</text></g>
<g stroke="#6b7477" stroke-width="2"><path d="M60 175H560M60 383H560M60 591H560"/><path d="M60 168V182M160 168V182M260 168V182M360 168V182M460 168V182M560 168V182M60 376V390M160 376V390M260 376V390M360 376V390M460 376V390M560 376V390M60 584V598M160 584V598M260 584V598M360 584V598M460 584V598M560 584V598"/></g>
<g font-size="18" text-anchor="middle"><text x="60" y="205">0</text><text x="160" y="205">1</text><text x="260" y="205">2</text><text x="360" y="205">3</text><text x="460" y="205">4</text><text x="560" y="205">5 m</text><text x="60" y="413">0</text><text x="160" y="413">1</text><text x="260" y="413">2</text><text x="360" y="413">3</text><text x="460" y="413">4</text><text x="560" y="413">5 m</text><text x="60" y="621">0</text><text x="160" y="621">1</text><text x="260" y="621">2</text><text x="360" y="621">3</text><text x="460" y="621">4</text><text x="560" y="621">5 m</text></g>
<path d="M60 133H460" stroke="#12617c" stroke-width="6" marker-end="url(#east)"/><path d="M460 341H360" stroke="#9b4b20" stroke-width="6" marker-end="url(#east)"/><path d="M60 549H360" stroke="#12617c" stroke-width="6" marker-end="url(#east)"/>
<g font-size="18"><text x="60" y="235">Partenza</text><text x="430" y="235">Fine andata</text><text x="290" y="445">Arrivo a 3 m</text><text x="28" y="680">Cammino: 4 m + 1 m = 5 m</text><text x="28" y="716">Modulo dello spostamento: |4 m − 1 m| = 3 m</text></g></g></svg>
