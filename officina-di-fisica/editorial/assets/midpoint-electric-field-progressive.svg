<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1310" role="img" aria-labelledby="title desc">
<title id="title">Due campi opposti nel punto medio</title>
<desc id="desc">Due sorgenti positive di tre e un nanocoulomb sono a un metro da P. Il campo da sinistra è ventisette verso destra, quello da destra nove verso sinistra, totale diciotto newton per coulomb verso destra. Le componenti sono disegnate dalla stessa origine numerica. Una seconda prova con sette e tre nanocoulomb dà trentasei, e la media dei totali è ventisette.</desc>
<defs><marker id="field" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#165a87"/></marker></defs>
<rect width="640" height="1310" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Stesse distanze, campi opposti</text>
<text x="32" y="83" font-size="18">Q_s = 3 nC ; Q_d = 1 nC ; asse +x verso destra.</text>
<circle cx="110" cy="165" r="15" fill="none" stroke="#b45328" stroke-width="2"/>
<circle cx="490" cy="165" r="15" fill="none" stroke="#b45328" stroke-width="2"/>
<text x="102" y="172">+</text><text x="482" y="172">+</text>
<circle cx="300" cy="165" r="4" fill="#14243a"/>
<text x="84" y="208">Q_s</text><text x="288" y="208">P</text><text x="466" y="208">Q_d</text>
<path d="M110 250H300M110 239V261M300 239V261" stroke="#14243a" stroke-width="2" fill="none"/>
<path d="M300 250H490M490 239V261" stroke="#14243a" stroke-width="2" fill="none"/>
<text x="186" y="287">1 m</text><text x="376" y="287">1 m</text>
<text x="32" y="331" font-size="18">I campi escono dalle sorgenti positive e si oppongono.</text>
<path d="M32 367H608" stroke="#9babbc"/>
<text x="32" y="412" font-size="25" font-weight="bold">2 · Componenti in P, con segno</text>
<text x="32" y="452" font-size="18">Origine e scala comuni dei valori in N/C.</text>
<path d="M270 490V735" stroke="#14243a" stroke-width="2"/>
<path d="M270 535H486" stroke="#165a87" stroke-width="4" marker-end="url(#field)"/>
<path d="M270 615H198" stroke="#165a87" stroke-width="4" marker-end="url(#field)"/>
<path d="M270 695H414" stroke="#165a87" stroke-width="4" marker-end="url(#field)"/>
<text x="32" y="543">E_s</text><text x="500" y="543">+27 N/C</text>
<text x="32" y="623">E_d</text><text x="94" y="623">−9 N/C</text>
<text x="32" y="703">Totale</text><text x="430" y="703">+18 N/C</text>
<text x="264" y="773">0</text>
<text x="32" y="819" font-size="18">Somma orientata: +27 − 9 = +18 N/C.</text>
<path d="M32 854H608" stroke="#9babbc"/>
<text x="32" y="899" font-size="25" font-weight="bold">3 · Due totali e la loro media</text>
<text x="32" y="937" font-size="18">A: Q_s = 3, Q_d = 1 nC ; C: Q_s = 7, Q_d = 3 nC.</text>
<path d="M150 966V1200" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="986" width="180" height="34" fill="#165a87"/>
<rect x="150" y="1057" width="360" height="34" fill="#b45328"/>
<rect x="150" y="1128" width="270" height="34" fill="#28664d"/>
<text x="50" y="1012">A</text><text x="350" y="1012">18 N/C</text>
<text x="50" y="1083">C</text><text x="530" y="1083">36 N/C</text>
<text x="32" y="1154">Media</text><text x="440" y="1154">27 N/C</text>
<text x="125" y="1195">0</text>
<text x="32" y="1247" font-size="18">Media delle uscite: (18 + 36)/2 = 27 N/C.</text>
<text x="32" y="1279" font-size="18">Origine e scala comuni nel pannello delle barre.</text>
</g></svg>
