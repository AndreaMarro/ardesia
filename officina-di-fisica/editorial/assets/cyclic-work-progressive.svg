<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1380" viewBox="0 0 640 1380" role="img" aria-labelledby="title desc"><title id="title">Lavoro di un ciclo dai trasferimenti energetici</title><desc id="desc">Tre pannelli: schema di una macchina ciclica con cento joule entranti, quaranta ceduti e sessanta utili; ripartizione delle energie alla stessa scala; confronto fra due lavori sessanta e centoquaranta joule con media cento. Le frecce di trasferimento sono schematiche.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#196082"/></marker></defs><rect width="640" height="1380" rx="20" fill="#f5faff"/><g font-family="Arial,sans-serif" font-size="20" fill="#163047"><text x="35" y="50" font-size="26" font-weight="bold">1 · Il fluido torna allo stesso stato</text><rect x="40" y="105" width="180" height="70" rx="8" fill="#f4ddce"/><text x="78" y="147">Sorgente calda</text><rect x="270" y="170" width="180" height="130" rx="8" fill="#e0edf3" stroke="#163047" stroke-width="3"/><text x="329" y="210">Ciclo</text><text x="292" y="262">ΔU_ciclo = 0</text><rect x="40" y="340" width="180" height="70" rx="8" fill="#d9ebe4"/><text x="70" y="382">Sorgente fredda</text><path d="M220 140H245V205H260" fill="none" stroke="#196082" stroke-width="4" marker-end="url(#arrow)"/><path d="M260 265H245V375H230" fill="none" stroke="#196082" stroke-width="4" marker-end="url(#arrow)"/><path d="M460 235H590" stroke="#196082" stroke-width="4" marker-end="url(#arrow)"/><text x="42" y="230">Q_h = 100 J</text><text x="42" y="305">Q_c = 40 J</text><text x="470" y="210">W = 60 J</text><text x="35" y="460" font-size="18">Frecce schematiche, senza scala metrica.</text><text x="35" y="495" font-size="18">ΔU torna a zero sul ciclo, non su ogni singolo tratto.</text><path d="M35 530H605" stroke="#b5cbd9"/><text x="35" y="585" font-size="26" font-weight="bold">2 · Separare le due uscite</text><text x="35" y="635">Scala comune: 4 px/J, barre da zero</text><rect x="100" y="670" width="400" height="45" fill="#163047"/><text x="230" y="700" fill="white">Q_h = 100 J</text><rect x="100" y="750" width="160" height="50" fill="#39745b"/><rect x="260" y="750" width="240" height="50" fill="#196082"/><text x="114" y="783" fill="white">Q_c = 40 J</text><text x="325" y="783" fill="white">W = 60 J</text><text x="35" y="860">100 J = 40 J + 60 J</text><text x="35" y="905">Il lavoro è Q_h − Q_c, non la loro somma.</text><path d="M35 945H605" stroke="#b5cbd9"/><text x="35" y="1000" font-size="26" font-weight="bold">3 · Media di due prove distinte</text><text x="35" y="1050" font-size="18">A: (100 − 40) J · B: (200 − 60) J</text><text x="45" y="1110">A</text><rect x="110" y="1085" width="180" height="35" fill="#196082"/><text x="310" y="1110">60 J</text><text x="45" y="1180">B</text><rect x="110" y="1155" width="420" height="35" fill="#196082"/><text x="545" y="1180">140 J</text><text x="35" y="1250">Media</text><rect x="110" y="1225" width="300" height="35" fill="#39745b"/><text x="430" y="1250">100 J</text><text x="35" y="1310" font-size="18">Scala di questo pannello: 3 px/J.</text><text x="35" y="1350" font-size="18">(60 + 140) J / 2 = 100 J, non una potenza.</text></g></svg>
