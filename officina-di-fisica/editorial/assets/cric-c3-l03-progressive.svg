<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Capacità termica, contatto e dispersione</title><desc id="desc">Grafico di energia contro incremento termico del campione; trasferimento di tremila joule fra campione e acqua; bilancio cinquecento joule uguale quattrocento rimasti e cento persi.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7350b0"/></marker></defs><rect width="640" height="1500" fill="#faf7ee"/><text x="30" y="40" font-size="25" fill="#302a3e">1. Capacità totale e specifica</text><text x="30" y="85" font-size="21" fill="#302a3e">Campione: 0,200 kg; nessun cambio di fase</text><path d="M140 410V120M140 410H540" fill="none" stroke="#726d81" stroke-width="2"/><path d="M140 410L500 140" fill="none" stroke="#147979" stroke-width="4"/><text x="52" y="130" font-size="21" fill="#302a3e">Q (J)</text><text x="70" y="150" font-size="21" fill="#302a3e">540</text><text x="110" y="442" font-size="21" fill="#302a3e">0</text><text x="495" y="442" font-size="21" fill="#302a3e">6</text><text x="470" y="480" font-size="21" fill="#302a3e">ΔT (K)</text><text x="185" y="290" font-size="21" fill="#302a3e">C = 90 J/K</text><text x="40" y="520" font-size="21" fill="#302a3e">c = C/m = 450 J/(kg·K)</text><text x="30" y="590" font-size="25" fill="#302a3e">2. Il calore attraversa un confine</text><rect x="70" y="650" width="170" height="105" fill="#d49332"/><rect x="400" y="650" width="170" height="105" fill="#68bdcf"/><text x="92" y="695" font-size="18" fill="#302a3e">Campione: 70 °C</text><text x="425" y="695" font-size="18" fill="#302a3e">Acqua: 20 °C</text><path d="M245 710H390" fill="none" stroke="#7350b0" stroke-width="4" marker-end="url(#arrow)"/><text x="265" y="660" font-size="19" fill="#302a3e">3000 J</text><text x="110" y="800" font-size="21" fill="#302a3e">−3000 J</text><text x="415" y="800" font-size="21" fill="#302a3e">+3000 J</text><text x="95" y="860" font-size="21" fill="#302a3e">Equilibrio comune: 30 °C</text><text x="40" y="915" font-size="21" fill="#302a3e">Il sistema complessivo è isolato.</text><text x="30" y="1000" font-size="25" fill="#302a3e">3. Energia fornita e perdita</text><text x="30" y="1040" font-size="21" fill="#302a3e">Campione: C = 80 J/K; aumento di 5 K</text><path d="M140 1350V1080M140 1350H500" fill="none" stroke="#726d81" stroke-width="2"/><rect x="140" y="1110" width="300" height="45" fill="#7350b0"/><rect x="140" y="1230" width="240" height="45" fill="#147979"/><rect x="380" y="1230" width="60" height="45" fill="#d49332"/><text x="150" y="1095" font-size="21" fill="#302a3e">500 J forniti</text><text x="170" y="1210" font-size="21" fill="#302a3e">400 J rimasti</text><text x="455" y="1260" font-size="18" fill="#302a3e">100 J fuori</text><text x="110" y="1380" font-size="21" fill="#302a3e">0</text><text x="420" y="1380" font-size="21" fill="#302a3e">500</text><text x="500" y="1420" font-size="21" fill="#302a3e">E (J)</text><text x="40" y="1470" font-size="21" fill="#302a3e">500 J = 400 J + 100 J</text></svg>
