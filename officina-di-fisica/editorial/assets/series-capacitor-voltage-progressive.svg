<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc"><title id="title">Ripartire dodici volt su due condensatori in serie</title><desc id="desc">Nodo intermedio neutro e carica comune. Primo e secondo condensatore hanno sei volt ciascuno se uguali; riducendo il primo a un microfarad le cadute diventano otto e quattro volt. Medie delle cadute sul primo per altre due preparazioni.</desc><rect width="640" height="1540" rx="16" fill="#f7f9fc"/>
<text x="32" y="44" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">1 · Stessa carica, cadute sulle piastre</text>
<text x="32" y="87" font-family="Arial,sans-serif" font-size="21" fill="#182c46">E = 12 V ; C₁ = C₂ = 2 μF ; Q = 12 μC</text>
<path d="M100 195H235M255 195H385M405 195H540" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M235 170V220" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M255 170V220" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M385 170V220" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M405 170V220" fill="none" stroke="#182c46" stroke-width="4"/>
<circle cx="100" cy="195" r="4" fill="#182c46"/>
<circle cx="320" cy="195" r="4" fill="#182c46"/>
<circle cx="540" cy="195" r="4" fill="#182c46"/>
<text x="80" y="157" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="310" y="157" font-family="Arial,sans-serif" font-size="21" fill="#182c46">M</text>
<text x="535" y="157" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="178" y="265" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₁ = 2 μF</text>
<text x="378" y="265" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₂ = 2 μF</text>
<path d="M100 299V310H320V299M320 299V310H540V299" fill="none" stroke="#182c46" stroke-width="2"/>
<text x="165" y="351" font-family="Arial,sans-serif" font-size="21" fill="#182c46">V₁ = 6 V</text>
<text x="385" y="351" font-family="Arial,sans-serif" font-size="21" fill="#182c46">V₂ = 6 V</text>
<text x="32" y="410" font-family="Arial,sans-serif" font-size="21" fill="#182c46">M è neutro ; le due cadute sommano 12 V.</text>
<path d="M32 466H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="514" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">2 · Cambia soltanto C₁</text>
<text x="32" y="557" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Blu: caduta su C₁ ; arancio: caduta su C₂.</text>
<text x="32" y="607" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="196" y="627" font-family="Arial,sans-serif" font-size="21" fill="#182c46">6 V</text>
<text x="400" y="627" font-family="Arial,sans-serif" font-size="21" fill="#182c46">6 V</text>
<rect x="150" y="650" width="180" height="42" fill="#185d83"/>
<rect x="330" y="650" width="180" height="42" fill="#b85322"/>
<text x="32" y="736" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Modificato: C₁ = 1 μF, C₂ = 2 μF</text>
<text x="198" y="776" font-family="Arial,sans-serif" font-size="21" fill="#182c46">8 V</text>
<text x="415" y="776" font-family="Arial,sans-serif" font-size="21" fill="#182c46">4 V</text>
<rect x="150" y="800" width="240" height="42" fill="#185d83"/>
<rect x="390" y="800" width="120" height="42" fill="#b85322"/>
<text x="32" y="900" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Somma e scala comuni: sempre 12 V.</text>
<path d="M32 953H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="1003" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">3 · Altre due preparazioni</text>
<text x="32" y="1046" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A: 2 e 2 μF ; B: 3 e 1 μF</text>
<text x="32" y="1088" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Si confronta solo la caduta sul primo.</text>
<path d="M150 1120V1420" fill="none" stroke="#182c46" stroke-width="2"/>
<rect x="150" y="1150" width="240" height="42" fill="#185d83"/>
<text x="32" y="1180" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="408" y="1180" font-family="Arial,sans-serif" font-size="21" fill="#182c46">6 V</text>
<rect x="150" y="1250" width="120" height="42" fill="#b85322"/>
<text x="32" y="1280" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="288" y="1280" font-family="Arial,sans-serif" font-size="21" fill="#182c46">3 V</text>
<rect x="150" y="1350" width="180" height="42" fill="#35654e"/>
<text x="32" y="1380" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Media</text>
<text x="348" y="1380" font-family="Arial,sans-serif" font-size="21" fill="#182c46">9/2 V</text>
<text x="118" y="1445" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="32" y="1495" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Origine e scala comuni entro il pannello.</text>
</svg>
