<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1620" viewBox="0 0 640 1620" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Centro di massa e momenti di forze</title><desc id="desc">Media pesata di due coordinate, braccio perpendicolare e trave con due reazioni verticali.</desc><rect x="0" y="0" width="640" height="1620" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Posizioni, bracci e momenti</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · La media è pesata con le masse</text><line x1="80" y1="270" x2="560" y2="270" stroke="#697b87" stroke-width="2"/><polygon points="560,270 552.0,274.0 552.0,266.0" fill="#697b87"/><circle cx="100" cy="270" r="8" fill="#986c35"/><circle cx="500" cy="270" r="13.856406460551018" fill="#306f8c"/><circle cx="400" cy="270" r="6" fill="white" stroke="#306f8c" stroke-width="3"/><text x="100" y="210" font-size="19" fill="#203247" text-anchor="middle">1 kg</text><text x="500" y="210" font-size="19" fill="#203247" text-anchor="middle">3 kg</text><text x="100" y="315" font-size="18" fill="#203247" text-anchor="middle">0</text><text x="500" y="315" font-size="18" fill="#203247" text-anchor="middle">4/5 m</text><text x="400" y="370" font-size="19" fill="#203247" text-anchor="middle">x_CM = 3/5 m</text><text x="35" y="445" font-size="19" fill="#203247" text-anchor="start">Il centro è più vicino alla massa maggiore.</text><text x="35" y="560" font-size="21" fill="#203247" text-anchor="start">2 · Il braccio è perpendicolare alla forza</text><text x="390" y="630" font-size="19" fill="#203247" text-anchor="start">α = 30°</text><circle cx="150" cy="740" r="4" fill="#306f8c"/><line x1="150" y1="740" x2="390" y2="740" stroke="#607383" stroke-width="2"/><line x1="390" y1="740" x2="493.92304845413264" y2="680" stroke="#306f8c" stroke-width="2"/><polygon points="493.92304845413264,680 488.9948452238571,687.4641016151378 484.9948452238571,680.5358983848622" fill="#306f8c"/><line x1="390" y1="740" x2="210" y2="843.9230484541326" stroke="#607383" stroke-width="2"/><line x1="150" y1="740" x2="210" y2="843.9230484541326" stroke="#637e55" stroke-width="2"/><text x="130" y="720" font-size="19" fill="#203247" text-anchor="start">O</text><text x="270" y="710" font-size="18" fill="#203247" text-anchor="middle">r = 2/5 m</text><text x="490" y="740" font-size="18" fill="#203247" text-anchor="start">F = 15 N</text><text x="50" y="875" font-size="19" fill="#203247" text-anchor="start">b = 1/5 m</text><text x="35" y="960" font-size="19" fill="#203247" text-anchor="start">|τ| = F b = (15 N) · (1/5 m) = 3 N·m</text><text x="35" y="1060" font-size="21" fill="#203247" text-anchor="start">3 · Due appoggi, un carico decentrato</text><line x1="100" y1="1210" x2="500" y2="1210" stroke="#203247" stroke-width="5"/><line x1="100" y1="1210" x2="100" y2="1120" stroke="#637e55" stroke-width="2"/><polygon points="100,1120 104.0,1128.0 96.0,1128.0" fill="#637e55"/><line x1="500" y1="1210" x2="500" y2="1180" stroke="#637e55" stroke-width="2"/><polygon points="500,1180 504.0,1188.0 496.0,1188.0" fill="#637e55"/><line x1="200" y1="1210" x2="200" y2="1330" stroke="#986c35" stroke-width="2"/><polygon points="200,1330 196.0,1322.0 204.0,1322.0" fill="#986c35"/><text x="45" y="1100" font-size="18" fill="#203247" text-anchor="start">R_S = 45/2 N</text><text x="430" y="1150" font-size="18" fill="#203247" text-anchor="start">R_D = 15/2 N</text><text x="220" y="1320" font-size="19" fill="#203247" text-anchor="start">P = 30 N</text><line x1="100" y1="1360" x2="200" y2="1360" stroke="#607383" stroke-width="2"/><text x="150" y="1395" font-size="18" fill="#203247" text-anchor="middle">1/2 m</text><line x1="100" y1="1440" x2="500" y2="1440" stroke="#607383" stroke-width="2"/><text x="300" y="1475" font-size="18" fill="#203247" text-anchor="middle">2 m</text><text x="35" y="1540" font-size="19" fill="#203247" text-anchor="start">R_S + R_D = 30 N; i momenti si equilibrano.</text></svg>
