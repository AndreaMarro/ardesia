<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1310" role="img" aria-labelledby="title desc">
<title id="title">Potenziali che si sommano, campi che possono annullarsi</title>
<desc id="desc">Due sorgenti positive da uno e due nanocoulomb a tre metri da P danno tre e sei volt, totale nove con zero all’infinito. Un distinto caso con sorgenti uguali da un nanocoulomb e simmetriche ha campo nullo in P ma potenziale sei volt. Due letture nove e quindici volt danno media dodici.</desc>
<defs><marker id="field" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#165a87"/></marker></defs>
<rect width="640" height="1310" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · I potenziali sono scalari</text>
<text x="32" y="83" font-size="18">Q₁ = 1 nC ; Q₂ = 2 nC ; zero all’infinito.</text>
<circle cx="110" cy="165" r="15" fill="none" stroke="#b45328" stroke-width="2"/>
<circle cx="490" cy="165" r="15" fill="none" stroke="#b45328" stroke-width="2"/>
<text x="102" y="172">+</text><text x="482" y="172">+</text>
<circle cx="300" cy="165" r="4" fill="#14243a"/>
<text x="94" y="208">Q₁</text><text x="288" y="208">P</text><text x="474" y="208">Q₂</text>
<path d="M110 250H300M110 239V261M300 239V261" stroke="#14243a" stroke-width="2" fill="none"/>
<path d="M300 250H490M490 239V261" stroke="#14243a" stroke-width="2" fill="none"/>
<text x="186" y="287">3 m</text><text x="376" y="287">3 m</text>
<text x="32" y="331" font-size="18">V₁ = 3 V ; V₂ = 6 V ; V_P = 3 + 6 = 9 V.</text>
<text x="32" y="363" font-size="18">Nessuna freccia per V: il potenziale non ha verso.</text>
<path d="M32 396H608" stroke="#9babbc"/>
<text x="32" y="441" font-size="25" font-weight="bold">2 · Ora le due sorgenti sono uguali</text>
<text x="32" y="481" font-size="18">Q₁ = Q₂ = 1 nC ; stessa simmetria e distanze 3 m.</text>
<path d="M300 565H420" stroke="#165a87" stroke-width="4" marker-end="url(#field)"/>
<path d="M300 565H180" stroke="#165a87" stroke-width="4" marker-end="url(#field)"/>
<text x="173" y="531">1 N/C</text><text x="371" y="531">1 N/C</text>
<text x="289" y="610">P</text>
<text x="32" y="660" font-size="20">Campi opposti in P: E(P) = 0.</text>
<text x="32" y="708" font-size="20">Potenziali positivi: V_P = 3 + 3 = 6 V.</text>
<text x="32" y="756" font-size="18">Le frecce rappresentano campi, non potenziali.</text>
<text x="32" y="789" font-size="18">Campo nullo non impone V_P = 0 con questo zero.</text>
<path d="M32 846H608" stroke="#9babbc"/>
<text x="32" y="891" font-size="25" font-weight="bold">3 · La media di due letture</text>
<text x="32" y="931" font-size="18">A: Q₁ = 1, Q₂ = 2 nC ; C: Q₁ = 2, Q₂ = 3 nC.</text>
<path d="M150 963V1200" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="985" width="216" height="34" fill="#165a87"/>
<rect x="150" y="1056" width="360" height="34" fill="#b45328"/>
<rect x="150" y="1127" width="288" height="34" fill="#28664d"/>
<text x="50" y="1011">A</text><text x="386" y="1011">9 V</text>
<text x="50" y="1082">C</text><text x="530" y="1082">15 V</text>
<text x="32" y="1153">Media</text><text x="458" y="1153">12 V</text>
<text x="125" y="1194">0</text>
<text x="32" y="1247" font-size="18">Media delle uscite: (9 + 15)/2 = 12 V.</text>
<text x="32" y="1279" font-size="18">Origine e scala comuni delle barre del potenziale.</text>
</g></svg>
