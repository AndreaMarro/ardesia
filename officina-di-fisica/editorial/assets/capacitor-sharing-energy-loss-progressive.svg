<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1650" viewBox="0 0 640 1650" role="img" aria-labelledby="title desc"><title id="title">Carica conservata ed energia convertita</title><desc id="desc">Due condensatori da un microfarad inizialmente a quattro e due volt raggiungono tre volt comuni. L’energia iniziale dieci microjoule diventa nove microjoule di campo e uno di calore, senza perdita di energia complessiva. Conversioni di altre prove: uno, quattro e cinque mezzi microjoule.</desc><rect width="640" height="1650" rx="16" fill="#f7f9fc"/>
<text x="32" y="44" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">1 · Prima 4 e 2 V ; alla fine 3 V</text>
<text x="32" y="86" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C = 1 μF per ciascun condensatore.</text>
<text x="32" y="128" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Circuito finale ; generatori scollegati.</text>
<path d="M110 230V350M530 230V350" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M110 230H290M310 230H530" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M290 205V255" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M310 205V255" fill="none" stroke="#182c46" stroke-width="4"/>
<circle cx="110" cy="230" r="4" fill="#182c46"/>
<circle cx="530" cy="230" r="4" fill="#182c46"/>
<path d="M110 350H290M310 350H530" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M290 325V375" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M310 325V375" fill="none" stroke="#182c46" stroke-width="4"/>
<circle cx="110" cy="350" r="4" fill="#182c46"/>
<circle cx="530" cy="350" r="4" fill="#182c46"/>
<text x="67" y="220" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="548" y="220" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="234" y="185" font-family="Arial,sans-serif" font-size="21" fill="#182c46">3 μC su A</text>
<text x="234" y="305" font-family="Arial,sans-serif" font-size="21" fill="#182c46">3 μC su A</text>
<text x="32" y="420" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Q_A = 6 μC ; V_f = 3 V</text>
<path d="M32 473H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="521" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">2 · Bilancio: campo e calore</text>
<text x="32" y="565" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Prima: energia del campo 10 μJ.</text>
<rect x="150" y="610" width="400" height="44" fill="#185d83"/>
<text x="32" y="640" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Prima</text>
<text x="440" y="595" font-family="Arial,sans-serif" font-size="21" fill="#182c46">10 μJ</text>
<text x="32" y="714" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Dopo: 9 μJ di campo + 1 μJ di calore.</text>
<rect x="150" y="765" width="360" height="44" fill="#185d83"/>
<rect x="510" y="765" width="40" height="44" fill="#b85322"/>
<text x="32" y="795" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Dopo</text>
<text x="322" y="748" font-family="Arial,sans-serif" font-size="21" fill="#182c46">9 μJ</text>
<text x="514" y="850" font-family="Arial,sans-serif" font-size="21" fill="#182c46">1 μJ</text>
<text x="32" y="906" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Scala comune ; la somma resta 10 μJ.</text>
<text x="32" y="948" font-family="Arial,sans-serif" font-size="21" fill="#182c46">L = U_i − U_f = 1 μJ &gt; 0</text>
<path d="M32 999H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="1049" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">3 · Conversioni di altre preparazioni</text>
<text x="32" y="1091" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A: 4 e 2 V ; B: 8 e 4 V</text>
<path d="M150 1140V1480" fill="none" stroke="#182c46" stroke-width="2"/>
<rect x="150" y="1170" width="80" height="44" fill="#185d83"/>
<text x="32" y="1200" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="248" y="1200" font-family="Arial,sans-serif" font-size="21" fill="#182c46">1 μJ</text>
<rect x="150" y="1280" width="320" height="44" fill="#b85322"/>
<text x="32" y="1310" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="488" y="1310" font-family="Arial,sans-serif" font-size="21" fill="#182c46">4 μJ</text>
<rect x="150" y="1390" width="200" height="44" fill="#35654e"/>
<text x="32" y="1420" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Media</text>
<text x="368" y="1420" font-family="Arial,sans-serif" font-size="21" fill="#182c46">5/2 μJ</text>
<text x="118" y="1510" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="32" y="1570" font-family="Arial,sans-serif" font-size="21" fill="#182c46">L positiva ; non è l’energia finale del campo.</text>
<text x="32" y="1610" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Origine e scala comuni entro il pannello.</text>
</svg>
