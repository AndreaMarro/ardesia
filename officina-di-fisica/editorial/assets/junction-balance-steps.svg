<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1580" viewBox="0 0 640 1580" role="img" aria-labelledby="title desc">
<title id="title">Flussi orientati e bilancio a un nodo</title><desc id="desc">Un ingresso di dieci litri al secondo alimenta uscite da quattro e sei. Le frecce sono proporzionate alle portate. Due barre confrontano poi gli stati dieci uguale quattro più sei e dodici uguale cinque più sette alla stessa scala.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1580" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" font-size="22" fill="#172c3b">
<text x="35" y="48" font-size="27" font-weight="bold">1. Dichiarare i versi dei flussi</text>
<text x="35" y="90">Stazionario, senza accumulo o fughe</text>
<g fill="none" stroke="#8797a0" stroke-width="3"><path d="M45 270H300L395 180H580"/><path d="M300 270L390 380H580"/></g>
<path d="M65 245H265" fill="none" stroke="#155fa0" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M420 160H500" fill="none" stroke="#247143" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M420 360H540" fill="none" stroke="#a33430" stroke-width="5" marker-end="url(#arrow)"/>
<text x="65" y="205">Entra: 10 L/s</text><text x="400" y="125">Esce: 4 L/s</text><text x="400" y="425">Esce: 6 L/s</text>
<text x="35" y="475">Scala frecce: 20 px / (L/s)</text>
<text x="35" y="515">200 px = 80 px + 120 px</text>
<text x="35" y="555">Schema dei raccordi: geometria non in scala</text>
<line x1="35" x2="605" y1="590" y2="590" stroke="#b9c4c9"/>
<text x="35" y="640" font-size="27" font-weight="bold">2. Ricomporre ciò che esce</text>
<text x="35" y="680">Stato A: Q ingresso = 10 L/s</text>
<rect x="90" y="710" width="200" height="30" fill="#155fa0"/><text x="365" y="733">10 L/s</text>
<rect x="90" y="765" width="80" height="30" fill="#247143"/><rect x="170" y="765" width="120" height="30" fill="#a33430"/><text x="365" y="788">4 + 6 L/s</text>
<text x="35" y="845">Le due uscite riempiono la stessa barra.</text>
<text x="35" y="885">Q ingresso − Q prima − Q seconda = 0</text>
<line x1="35" x2="605" y1="920" y2="920" stroke="#b9c4c9"/>
<text x="35" y="970" font-size="27" font-weight="bold">3. Confrontare un’altra prova</text>
<text x="35" y="1010">Stato B: Q ingresso = 12 L/s</text>
<rect x="90" y="1040" width="240" height="30" fill="#155fa0"/><text x="365" y="1063">12 L/s</text>
<rect x="90" y="1095" width="100" height="30" fill="#247143"/><rect x="190" y="1095" width="140" height="30" fill="#a33430"/><text x="365" y="1118">5 + 7 L/s</text>
<text x="35" y="1175">Scala comune: 20 px / (L/s)</text>
<text x="35" y="1215">240 px = 100 px + 140 px</text>
<text x="35" y="1270">Una cella equivale a 1 L/s:</text>
<g stroke="#172c3b" stroke-width="1"><rect x="90" y="1300" width="20" height="25" fill="#247143"/><rect x="110" y="1300" width="20" height="25" fill="#247143"/><rect x="130" y="1300" width="20" height="25" fill="#247143"/><rect x="150" y="1300" width="20" height="25" fill="#247143"/><rect x="170" y="1300" width="20" height="25" fill="#247143"/><rect x="190" y="1300" width="20" height="25" fill="#a33430"/><rect x="210" y="1300" width="20" height="25" fill="#a33430"/><rect x="230" y="1300" width="20" height="25" fill="#a33430"/><rect x="250" y="1300" width="20" height="25" fill="#a33430"/><rect x="270" y="1300" width="20" height="25" fill="#a33430"/><rect x="290" y="1300" width="20" height="25" fill="#a33430"/><rect x="310" y="1300" width="20" height="25" fill="#a33430"/></g>
<text x="35" y="1390">5 celle + 7 celle = 12 celle</text>
<text x="35" y="1440">Più 2 L/s all’ingresso, più 1 alla prima:</text>
<text x="35" y="1480">resta più 1 L/s per la seconda uscita.</text>
<text x="35" y="1535">Le portate non indicano forze o pressioni.</text>
</g></svg>
