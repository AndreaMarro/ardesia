<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1640" width="640" height="1640" role="img" aria-labelledby="title desc">
<title id="title">Somme algebriche, opposizione e quadrato dell’ampiezza</title>
<desc id="desc">Tre barre positive sommano uno virgola due e zero virgola otto in due millimetri. Barre con segni opposti mostrano cinque meno tre uguale due millimetri. Due scale separate mostrano ampiezza doppia e intensità quadrupla per onde concordi in fase.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1640" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" fill="#202c39">
<text x="32" y="52" font-size="27" font-weight="bold">1. La somma conserva il segno</text>
<text x="32" y="95" font-size="23">Stesso punto e istante; spostamenti in mm.</text>
<path d="M140 160V420H580" fill="none" stroke="#304d63" stroke-width="3"/>
<text x="47" y="178" font-size="23">y (mm)</text>
<text x="95" y="228" font-size="23">2</text>
<text x="75" y="308" font-size="23">1,2</text>
<text x="75" y="348" font-size="23">0,8</text>
<rect x="190" y="300" width="70" height="120" fill="#26728d"/>
<rect x="330" y="340" width="70" height="80" fill="#986c35"/>
<rect x="470" y="220" width="70" height="200" fill="#4e876d"/>
<text x="109" y="452" font-size="23">0</text>
<text x="206" y="470" font-size="23">y₁</text>
<text x="346" y="470" font-size="23">y₂</text>
<text x="476" y="470" font-size="23">y totale</text>
<text x="32" y="525" font-size="23">+1,2 mm + 0,8 mm = +2,0 mm.</text>
<line x1="32" y1="560" x2="608" y2="560" stroke="#b8c4ca"/>
<text x="32" y="615" font-size="27" font-weight="bold">2. L’opposizione lascia un residuo</text>
<text x="32" y="658" font-size="23">Coefficienti dei coseni alla stessa fase.</text>
<path d="M140 700V1060M140 920H580" fill="none" stroke="#304d63" stroke-width="3"/>
<text x="104" y="948" font-size="23">0</text>
<rect x="190" y="720" width="70" height="200" fill="#26728d"/>
<rect x="330" y="920" width="70" height="120" fill="#986c35"/>
<rect x="470" y="840" width="70" height="80" fill="#4e876d"/>
<text x="186" y="705" font-size="23">+5 mm</text>
<text x="326" y="1074" font-size="23">−3 mm</text>
<text x="466" y="824" font-size="23">+2 mm</text>
<text x="32" y="1122" font-size="23">L’ampiezza della somma è 2 mm, non 8 mm.</text>
<line x1="32" y1="1155" x2="608" y2="1155" stroke="#b8c4ca"/>
<text x="32" y="1209" font-size="27" font-weight="bold">3. Ampiezza e intensità distinte</text>
<text x="32" y="1252" font-size="23">Onde progressive concordi e in fase.</text>
<text x="45" y="1303" font-size="23">A</text>
<rect x="180" y="1280" width="100" height="30" fill="#26728d"/>
<text x="45" y="1353" font-size="23">2A</text>
<rect x="180" y="1330" width="200" height="30" fill="#26728d"/>
<text x="405" y="1354" font-size="23">Scala: ampiezza</text>
<line x1="32" y1="1393" x2="608" y2="1393" stroke="#b8c4ca"/>
<text x="45" y="1443" font-size="23">I₁</text>
<rect x="180" y="1420" width="80" height="30" fill="#986c35"/>
<text x="45" y="1503" font-size="23">4I₁</text>
<rect x="180" y="1480" width="320" height="30" fill="#986c35"/>
<text x="32" y="1570" font-size="23">Ogni coppia ha la propria scala comune.</text>
<text x="32" y="1610" font-size="23">Intensità proporzionale al quadrato di A.</text>
</g></svg>
