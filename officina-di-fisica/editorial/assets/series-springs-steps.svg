<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1250" role="img" aria-labelledby="title desc">
<title id="title">Serie: stessa forza e allungamenti sommati</title><desc id="desc">Due molle con rigidezze due e quattro newton al metro trasmettono quattro newton. Le loro lunghezze naturali illustrative sono un metro ciascuna; si allungano di due e un metro. Allungamento totale tre metri e costante equivalente quattro terzi di newton al metro.</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1250" rx="24" fill="#faf8f2"/>
<g font-family="sans-serif" font-size="20" fill="#183746">
<text x="28" y="42" font-size="24" font-weight="bold">1 · Le lunghezze si accumulano</text>
<text x="28" y="88">Scala: 60 px/m. L₀,₁ = L₀,₂ = 1 m illustrative.</text>
<path d="M80 120V190M80 155H85L90 145L100 165L110 145L120 165L130 145L135 155H140M140 155H145L150 145L160 165L170 145L180 165L190 145L195 155H200" stroke="#81968d" stroke-width="2" fill="none"/>
<circle cx="140" cy="155" r="4"/><circle cx="200" cy="155" r="4"/>
<text x="245" y="162">Riferimento naturale</text>
<path d="M80 260V340M80 300H90L100 285L120 315L140 285L160 315L180 285L200 315L220 285L240 315L250 300H260M260 300H270L280 285L300 315L320 285L340 315L360 285L370 300H380" stroke="#16728a" stroke-width="2" fill="none"/>
<circle cx="260" cy="300" r="4"/><circle cx="380" cy="300" r="4"/>
<text x="128" y="365">L₁ = 3 m</text><text x="285" y="365">L₂ = 2 m</text>
<text x="28" y="420">k₁ = 2 N/m; k₂ = 4 N/m; F = 4 N.</text>
<text x="28" y="465">ℓ₁ = 3 − 1 = 2 m; ℓ₂ = 2 − 1 = 1 m.</text>
<text x="28" y="515">Zigzag simbolici. Lunghezze dalla parete in scala.</text>
<text x="28" y="585" font-size="24" font-weight="bold">2 · Il raccordo equilibra le forze</text>
<text x="28" y="630">Raccordo di massa trascurabile, nessun altro carico.</text>
<circle cx="300" cy="710" r="6"/>
<path d="M300 710H220" stroke="#16728a" stroke-width="3" marker-end="url(#a)"/><path d="M300 710H380" stroke="#16728a" stroke-width="3" marker-end="url(#a)"/>
<text x="127" y="680">4 N</text><text x="410" y="680">4 N</text>
<text x="28" y="775">Forze: 20 px/N. Due richiami opposti di 80 px.</text>
<text x="28" y="835" font-size="24" font-weight="bold">3 · Somma gli allungamenti</text>
<text x="28" y="895">ℓ = ℓ₁ + ℓ₂ = 3 m</text>
<text x="28" y="945">K = F/ℓ = 4/3 N/m</text>
<text x="28" y="1000">K &lt; 2 N/m e K &lt; 4 N/m: gruppo più cedevole.</text>
<text x="28" y="1055">Per ogni ramo: ℓᵢ = F/kᵢ.</text>
<text x="28" y="1110">1/K = 1/k₁ + 1/k₂</text>
<text x="28" y="1170">Forza comune non significa allungamenti uguali.</text>
<text x="28" y="1220" font-size="18">Scale distinte: lunghezze 60 px/m, forze 20 px/N.</text>
</g></svg>
