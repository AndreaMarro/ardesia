<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1580" role="img" aria-labelledby="title desc"><title id="title">Una coppia ha risultante nulla e momento non nullo</title><desc id="desc">Forze verticali opposte, sinistra verso il basso e destra verso l’alto. Separazione due metri, duecento pixel alla scala cento pixel per metro. Nel primo esempio ciascuna forza è due newton, sessanta pixel alla scala trenta pixel per newton: momento antiorario quattro newton metro. Spostando il polo da sinistra al punto medio i momenti diventano due più due e il totale non cambia. Ultimo esempio distinto: ciascuna forza cinque newton, centocinquanta pixel, stessa separazione due metri; risultante zero e momento dieci newton metro.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="640" height="1580" rx="24" fill="#faf8f2"/><g fill="#16323f" font-family="system-ui,sans-serif" font-size="20">
<text x="28" y="42" font-size="24" font-weight="700">1 · Somma delle forze e momento</text><text x="28" y="90">Lunghezze: 100 px/m. Forze: 30 px/N.</text><path d="M160 150V350M360 150V350" stroke="#b7c7bf" stroke-width="2" stroke-dasharray="4 4"/><path d="M160 250H360" stroke="#81968d" stroke-width="5"/><path d="M160 250V310" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 250V190" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="160" cy="250" r="5" fill="#16323f"/><text x="48" y="290">F = 2 N</text><text x="400" y="215">F = 2 N</text><text x="132" y="235">O</text><path d="M160 390H360M160 380V400M360 380V400" stroke="#81968d" stroke-width="2"/><text x="215" y="435">d = 2 m</text><text x="28" y="485">Forze: −2 N + 2 N = 0 N.</text><text x="28" y="530">Momento in O: 0 + Fd = +4 N·m.</text>
<text x="28" y="610" font-size="24" font-weight="700">2 · Cambiare polo non cambia la coppia</text><text x="28" y="655">Antiorario positivo. O′ è 1 m a destra di O.</text><path d="M160 770H360" stroke="#81968d" stroke-width="5"/><path d="M160 770V830" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 770V710" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="160" cy="770" r="5" fill="#16323f"/><circle cx="260" cy="770" r="6" fill="#b44b2c"/><text x="135" y="745">O</text><text x="242" y="815">O′</text><text x="392" y="735">F = 2 N</text><text x="48" y="815">F = 2 N</text><path d="M160 875H360M160 865V885M260 865V885M360 865V885" stroke="#81968d" stroke-width="2"/><text x="173" y="920">1 m</text><text x="285" y="920">1 m</text><text x="28" y="970">In O′: +2 N·m + 2 N·m = +4 N·m.</text><text x="28" y="1015">Il cambio del polo moltiplica la risultante zero.</text>
<text x="28" y="1095" font-size="24" font-weight="700">3 · Un’altra coppia: ciascuna forza 5 N</text><path d="M160 1300H360" stroke="#81968d" stroke-width="5"/><path d="M160 1300V1450" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 1300V1150" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="1375">F = 5 N</text><text x="400" y="1205">F = 5 N</text><path d="M160 1480H360M160 1470V1490M360 1470V1490" stroke="#81968d" stroke-width="2"/><text x="215" y="1520">d = 2 m</text><text x="28" y="1560" font-size="18">Risultante 0 N; momento 10 N·m. Stesse scale dei pannelli precedenti.</text>
</g></svg>
