<title id="title">Il periodo ridotto non è un ciclo completo</title><desc id="desc">Massa su molla orizzontale, grafico del moto armonico in funzione della fase t su tau e confronto fra tau mezzo secondo e due secondi. Il periodo completo è due pi greco volte tau.</desc>
