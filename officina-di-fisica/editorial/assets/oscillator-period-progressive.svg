<text x="35" y="390">Schizzo del sistema e del verso di richiamo.</text>
<text x="35" y="435">Geometria e forza senza scala metrica/N.</text>
<text x="35" y="480">ω = 2 s⁻¹ · τ = 1/2 s · T = π s</text>
