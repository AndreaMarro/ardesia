<svg xmlns="http://www.w3.org/2000/svg" width="640" height="930" viewBox="0 0 640 930" role="img" aria-labelledby="title desc">
<title id="title">Uguale tempo, distanze diverse</title><desc id="desc">Tre tappe. Il disegno sceglie due intervalli da un secondo. Velocità positive di due e sei metri al secondo danno distanze due e sei metri. Il secondo tratto è sei ottavi, cioè tre quarti della distanza totale. Nel grafico velocità-tempo le scale sono cento pixel per secondo e trenta pixel per metro al secondo. Le barre di distanza usano quaranta pixel per metro.</desc>
<rect width="640" height="930" fill="#fffdf7"/>
<g fill="#173d50" font-family="sans-serif" font-size="23">
<text x="28" y="42" font-weight="bold">1 · Stessa durata: τ = 1 s nel disegno</text>
<text x="28" y="82">v–t: 100 px/s e 30 px per m/s</text>
<rect x="100" y="250" width="100" height="60" fill="#cee2de"/><rect x="200" y="130" width="100" height="180" fill="#efd9c2"/>
<path d="M100 110V310H360" stroke="#173d50" stroke-width="2" fill="none"/>
<path d="M100 250H200M200 130H300" stroke="#173d50" stroke-width="4"/>
<text x="44" y="257">2</text><text x="44" y="137">6</text><text x="86" y="347">0</text><text x="190" y="347">1</text><text x="290" y="347">2 s</text><text x="330" y="174">v₂ = 6 m/s</text><text x="330" y="272">v₁ = 2 m/s</text>
<text x="28" y="412" font-weight="bold">2 · Le distanze non sono uguali</text><text x="28" y="451">Barre: 40 px per metro</text>
<rect x="100" y="489" width="80" height="30" fill="#cee2de" stroke="#173d50"/><rect x="100" y="564" width="240" height="30" fill="#efd9c2" stroke="#173d50"/>
<text x="205" y="513">d₁ = 2 m</text><text x="365" y="588">d₂ = 6 m</text>
<text x="28" y="666" font-weight="bold">3 · Secondo tratto / totale</text>
<text x="28" y="713">d₂ / (d₁ + d₂) = 6 / 8 = 3/4</text>
<text x="28" y="768">Metà del tempo, tre quarti dello spazio.</text>
<text x="28" y="823">Durata totale: 2 s · distanza totale: 8 m</text>
<text x="28" y="878">Media: 8 m / 2 s = 4 m/s</text>
</g></svg>
