<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1240" role="img" aria-labelledby="title desc"><title id="title">La componente del peso su un piano liscio</title><desc id="desc">Esempio con seno tre quinti e coseno quattro quinti, forniti come rapporti di un triangolo tre-quattro-cinque. Il campo vale dieci metri al secondo quadrato. Nel disegno si sceglie massa un chilogrammo per mostrare peso dieci newton, componente parallela sei newton e normale otto newton. Scala di tutte le forze dieci pixel per newton: peso cento pixel, componente parallela sessanta pixel e componente normale ottanta pixel. Le componenti tratteggiate sostituiscono il peso, non sono altre forze. Accelerazione sei metri al secondo quadrato in discesa, indipendente dalla massa, rappresentata in pannello separato a dieci pixel per metro al secondo quadrato.</desc><defs><marker id="p" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b44b2c"/></marker><marker id="n" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#14647b"/></marker><marker id="c" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#78649a"/></marker></defs>
<rect width="640" height="1240" rx="24" fill="#faf8f2"/><g font-family="system-ui, sans-serif" font-size="20" fill="#16323f">
<text x="28" y="42" font-size="24" font-weight="700">1 · Usa i rapporti già noti</text>
<path d="M160 130H320V250Z" fill="#e9eee7" stroke="#788781" stroke-width="2"/><path d="M200 130 A40 40 0 0 1 192 154" fill="none" stroke="#16323f" stroke-width="2"/>
<text x="235" y="115">4</text><text x="333" y="195">3</text><text x="220" y="215">5</text><text x="205" y="159">θ</text>
<text x="380" y="135">sinθ = 3/5</text><text x="380" y="180">cosθ = 4/5</text><text x="28" y="300">Lati nella stessa unità: rapporti puri.</text><text x="28" y="340">Nessun angolo numerico da calcolare.</text>
<text x="28" y="415" font-size="24" font-weight="700">2 · Scomponi il peso</text><text x="28" y="457">Nel disegno: m = 1 kg, g = 10 m/s².</text>
<path d="M134 508L422 724" stroke="#788781" stroke-width="3"/><g transform="matrix(0.8 0.6 -0.6 0.8 262 604)"><rect x="-40" y="-60" width="80" height="60" fill="#d6e6df" stroke="#16323f" stroke-width="2"/></g><circle cx="280" cy="580" r="4" fill="#16323f"/>
<path d="M280 580L280 680" stroke="#b44b2c" stroke-width="3" marker-end="url(#p)"/><path d="M280 580L328 516" stroke="#14647b" stroke-width="3" marker-end="url(#n)"/>
<path d="M280 580L328 616" stroke="#78649a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#c)"/><path d="M280 580L232 644" stroke="#78649a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#c)"/>
<path d="M328 616L280 680L232 644" fill="none" stroke="#b7a9c9" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="350" y="518" fill="#14647b">N = 8 N</text><text x="350" y="618" fill="#78649a">P∥ = 6 N</text><text x="58" y="673" fill="#78649a">P⊥ = 8 N</text><text x="293" y="710" fill="#b44b2c">P = mg = 10 N</text>
<text x="28" y="770">Forze: 10 px/N. N equilibra P⊥, non tutto P.</text><text x="28" y="810">Le componenti tratteggiate sostituiscono il peso.</text>
<text x="28" y="885" font-size="24" font-weight="700">3 · Dividi la risultante per la massa</text>
<path d="M100 940L300 1090" stroke="#788781" stroke-width="2"/><circle cx="180" cy="1000" r="5" fill="#16323f"/><path d="M180 1000L228 1036" stroke="#14647b" stroke-width="3" marker-end="url(#n)"/>
<text x="315" y="1015">A = 6 m/s²</text><text x="315" y="1055">Verso la discesa.</text>
<text x="28" y="1130">mA = mgs; A = gs = 6 m/s² per ogni m &gt; 0.</text><text x="28" y="1175" font-size="18">A: 10 px per m/s². Scala di dimensione diversa dalle forze.</text>
</g></svg>
