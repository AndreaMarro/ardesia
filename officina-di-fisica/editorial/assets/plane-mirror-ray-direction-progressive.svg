<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1740" viewBox="0 0 640 1740" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Riflessione: direzioni e normale</title><desc id="desc">Nel piano, vettore incidente a trenta gradi e riflesso a sessanta rispetto all’orizzontale, su specchio a quarantacinque. Seguono barre di direzioni e grafico con incidenza direzionale fissa.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#306f8c"/></marker></defs><rect x="0" y="0" width="640" height="1740" fill="white"/><text x="35" y="48" font-size="25" fill="#203247" text-anchor="start">Dall’asse oppure dalla normale?</text><text x="35" y="105" font-size="22" fill="#203247" text-anchor="start">1 · Una riflessione nel piano</text><line x1="80" y1="320" x2="560" y2="320" stroke="#8e9ca4" stroke-width="2" stroke-dasharray="6 5"/><path d="M300 320L550 320" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><line x1="160" y1="460" x2="440" y2="180" stroke="#203247" stroke-width="4"/><line x1="180" y1="200" x2="420" y2="440" stroke="#8e9ca4" stroke-width="2" stroke-dasharray="7 6"/><path d="M144.11542731880104 410L300 320" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M300 320L390 164.11542731880104" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><text x="425" y="160" font-size="19" fill="#203247" text-anchor="start">φ = 45°</text><text x="75" y="450" font-size="19" fill="#203247" text-anchor="start">α = 30°</text><text x="430" y="260" font-size="19" fill="#203247" text-anchor="start">β = 60°</text><text x="400" y="485" font-size="19" fill="#203247" text-anchor="start">normale</text><text x="540" y="355" font-size="18" fill="#203247" text-anchor="start">+x</text><text x="35" y="550" font-size="19" fill="#203247" text-anchor="start">θ_i = θ_r = 75°: angoli dalla normale.</text><text x="35" y="590" font-size="19" fill="#203247" text-anchor="start">α e β indicano invece vettori di propagazione.</text><text x="35" y="665" font-size="22" fill="#203247" text-anchor="start">2 · Due direzioni e la loro media</text><text x="130" y="757" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="150" y="735" width="180" height="30" fill="#3d7791"/><text x="340" y="759" font-size="18" fill="#203247" text-anchor="start">60°</text><text x="130" y="857" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="150" y="835" width="315" height="30" fill="#986c35"/><text x="475" y="859" font-size="18" fill="#203247" text-anchor="start">105°</text><text x="130" y="957" font-size="18" fill="#203247" text-anchor="end">media</text><rect x="150" y="935" width="247.5" height="30" fill="#637e55"/><text x="407.5" y="959" font-size="18" fill="#203247" text-anchor="start">165/2°</text><text x="35" y="1030" font-size="19" fill="#203247" text-anchor="start">A: (φ,α) = (45°,30°) · B: (60°,15°)</text><text x="35" y="1120" font-size="22" fill="#203247" text-anchor="start">3 · Solo α = 30°; 30° &lt; φ &lt; 90°</text><line x1="150" y1="1530" x2="560" y2="1530" stroke="#526474" stroke-width="2"/><line x1="150" y1="1530" x2="150" y2="1180" stroke="#526474" stroke-width="2"/><line x1="270" y1="1470" x2="510" y2="1230" stroke="#306f8c" stroke-width="2"/><circle cx="270" cy="1470" r="5" fill="white" stroke="#306f8c" stroke-width="2"/><circle cx="510" cy="1230" r="5" fill="white" stroke="#306f8c" stroke-width="2"/><circle cx="330" cy="1410" r="5" fill="#266b89"/><circle cx="390" cy="1350" r="5" fill="#266b89"/><line x1="270" y1="1524" x2="270" y2="1536" stroke="#526474" stroke-width="2"/><text x="270" y="1572" font-size="18" fill="#203247" text-anchor="middle">30</text><line x1="330" y1="1524" x2="330" y2="1536" stroke="#526474" stroke-width="2"/><text x="330" y="1572" font-size="18" fill="#203247" text-anchor="middle">45</text><line x1="390" y1="1524" x2="390" y2="1536" stroke="#526474" stroke-width="2"/><text x="390" y="1572" font-size="18" fill="#203247" text-anchor="middle">60</text><line x1="510" y1="1524" x2="510" y2="1536" stroke="#526474" stroke-width="2"/><text x="510" y="1572" font-size="18" fill="#203247" text-anchor="middle">90</text><line x1="144" y1="1410" x2="156" y2="1410" stroke="#526474" stroke-width="2"/><text x="132" y="1416" font-size="18" fill="#203247" text-anchor="end">60</text><line x1="144" y1="1350" x2="156" y2="1350" stroke="#526474" stroke-width="2"/><text x="132" y="1356" font-size="18" fill="#203247" text-anchor="end">90</text><line x1="144" y1="1230" x2="156" y2="1230" stroke="#526474" stroke-width="2"/><text x="132" y="1236" font-size="18" fill="#203247" text-anchor="end">150</text><text x="170" y="1190" font-size="20" fill="#203247" text-anchor="start">β (gradi)</text><text x="485" y="1620" font-size="19" fill="#203247" text-anchor="start">φ (gradi)</text><text x="35" y="1690" font-size="19" fill="#203247" text-anchor="start">Gli estremi aperti sono bordi esclusi del settore.</text></svg>
