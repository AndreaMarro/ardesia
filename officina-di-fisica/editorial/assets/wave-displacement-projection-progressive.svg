<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1610" viewBox="0 0 640 1610" role="img" aria-labelledby="title desc"><title id="title">Una proiezione non è l’intera ampiezza</title><desc id="desc">Raggio quattro millimetri e proiezione orizzontale due millimetri al coseno un mezzo. Grafico normalizzato lineare fra coseno assegnato e spostamento su ampiezza, con zero escluso e uno incluso. Barre dei due spostamenti due e tre millimetri.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#145d81"/></marker></defs><rect width="640" height="1610" rx="20" fill="#f7fbff"/><g font-family="system-ui,sans-serif" font-size="20" fill="#142d40">
<text x="35" y="48" font-size="25" font-weight="700">1 · Proiettare una fase assegnata</text><text x="35" y="90">A = 4 mm · cosφ = 1/2 · 40 px/mm</text><text x="35" y="130">Costruzione geometrica, non traiettoria.</text>
<circle cx="260" cy="350" r="160" fill="none" stroke="#b3cbd9" stroke-width="2"/><path d="M70 350H480" stroke="#142d40" marker-end="url(#a)"/><text x="490" y="357">s</text>
<path d="M260 350L340 211.436" stroke="#145d81" stroke-width="4" marker-end="url(#a)"/><text x="365" y="230">A = 4 mm</text><path d="M340 211.436V350" stroke="#6e8b9c" stroke-dasharray="5 5"/><path d="M260 350H340" stroke="#226a4b" stroke-width="5"/>
<path d="M300 350A40 40 0 0 0 280 315.359" stroke="#c65919" fill="none" stroke-width="2"/><text x="306" y="323">φ</text><circle cx="260" cy="350" r="4" fill="#142d40"/><circle cx="340" cy="211.436" r="5" fill="#145d81"/>
<text x="245" y="390">0</text><text x="285" y="415">s = 2 mm</text><text x="35" y="555">Raggio 160 px · proiezione 80 px.</text><text x="35" y="595">Il rapporto s/A è il coseno, senza unità.</text><path d="M35 625H605" stroke="#b3cbd9"/>
<text x="35" y="670" font-size="25" font-weight="700">2 · Il dominio del coseno positivo</text><text x="35" y="710">Grafico s/A = c_φ, non legge oraria</text><text x="35" y="750">Orizzontale: 320 px/unità · verticale: 200</text>
<path d="M80 1000H485" stroke="#142d40" marker-end="url(#a)"/><path d="M100 1020V780" stroke="#142d40" marker-end="url(#a)"/><text x="505" y="1007">c_φ</text><text x="55" y="785">s/A</text>
<path d="M100 1000L420 800" stroke="#226a4b" stroke-width="4"/><path d="M100 800H420V1000M260 900V1000" stroke="#6e8b9c" stroke-dasharray="5 5" fill="none"/>
<circle cx="100" cy="1000" r="6" fill="#f7fbff" stroke="#226a4b" stroke-width="3"/><circle cx="420" cy="800" r="6" fill="#226a4b"/><circle cx="260" cy="900" r="5" fill="#c65919"/>
<text x="45" y="807">1</text><text x="90" y="1060">0</text><text x="245" y="1060">1/2</text><text x="410" y="1060">1</text><text x="35" y="1110">Cerchio vuoto: 0 escluso · 1 incluso.</text><path d="M35 1140H605" stroke="#b3cbd9"/>
<text x="35" y="1185" font-size="25" font-weight="700">3 · Due spostamenti, ampiezze diverse</text><text x="35" y="1225">Barre da zero: 60 px/mm</text>
<text x="35" y="1270">A · ampiezza 4 mm · coseno 1/2</text><rect x="100" y="1300" width="120" height="35" fill="#145d81"/><text x="240" y="1327">s = 2 mm</text>
<text x="35" y="1410">B · ampiezza 3 mm · coseno 1</text><rect x="100" y="1440" width="180" height="35" fill="#c65919"/><text x="300" y="1467">s = 3 mm</text><path d="M100 1285V1350M100 1425V1490" stroke="#6e8b9c" stroke-dasharray="5 5"/>
<text x="35" y="1545">Il rapporto B/A fra spostamenti è 3/2.</text><text x="35" y="1585">In ogni prova resta 0 &lt; s ≤ A.</text></g></svg>
