<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Lunghezza d’onda nel mezzo</title><desc id="desc">Tre tappe: fronti alla stessa frequenza con distanza seicento nanometri nel vuoto e trecento nel mezzo di indice due; barre delle due letture e della media; grafico lineare a indice due fissato.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Lunghezza d’onda nel mezzo</text><text x="32" y="92" font-size="22" text-anchor="start">1 · Due regioni, stessa frequenza</text><text x="32" y="135" font-size="18" text-anchor="start">Vuoto: λ₀ = 600 nm</text><text x="32" y="310" font-size="18" text-anchor="start">Mezzo con n = 2: λ = 300 nm</text><line x1="150" y1="165" x2="150" y2="215" stroke="#316b9b" stroke-width="2"/><line x1="330" y1="165" x2="330" y2="215" stroke="#316b9b" stroke-width="2"/><line x1="510" y1="165" x2="510" y2="215" stroke="#316b9b" stroke-width="2"/><line x1="150" y1="235" x2="330" y2="235" stroke="#52667a" stroke-width="2"/><line x1="150" y1="228" x2="150" y2="242" stroke="#52667a" stroke-width="2"/><line x1="330" y1="228" x2="330" y2="242" stroke="#52667a" stroke-width="2"/><text x="190" y="267" font-size="18" text-anchor="start">600 nm</text><line x1="150" y1="340" x2="150" y2="390" stroke="#a76d20" stroke-width="2"/><line x1="240" y1="340" x2="240" y2="390" stroke="#a76d20" stroke-width="2"/><line x1="330" y1="340" x2="330" y2="390" stroke="#a76d20" stroke-width="2"/><line x1="420" y1="340" x2="420" y2="390" stroke="#a76d20" stroke-width="2"/><line x1="510" y1="340" x2="510" y2="390" stroke="#a76d20" stroke-width="2"/><line x1="150" y1="410" x2="240" y2="410" stroke="#52667a" stroke-width="2"/><line x1="150" y1="403" x2="150" y2="417" stroke="#52667a" stroke-width="2"/><line x1="240" y1="403" x2="240" y2="417" stroke="#52667a" stroke-width="2"/><text x="165" y="443" font-size="18" text-anchor="start">300 nm</text><text x="32" y="485" font-size="18" text-anchor="start">Fronti di fase alla stessa scala spaziale.</text><text x="32" y="550" font-size="22" text-anchor="start">2 · Due preparazioni e la media</text><text x="32" y="592" font-size="18" text-anchor="start">A: 600 nm, n = 2 · B: 800 nm, n = 3/2</text><text x="128" y="674" font-size="18" text-anchor="end">A</text><rect x="150" y="650" width="135" height="32" fill="#316b9b"/><text x="297" y="674" font-size="18" text-anchor="start">300 nm</text><text x="128" y="764" font-size="18" text-anchor="end">B</text><rect x="150" y="740" width="240" height="32" fill="#316b9b"/><text x="402" y="764" font-size="18" text-anchor="start">1600/3 nm</text><text x="128" y="854" font-size="18" text-anchor="end">Media</text><rect x="150" y="830" width="187.5" height="32" fill="#316b9b"/><text x="349.5" y="854" font-size="18" text-anchor="start">1250/3 nm</text><text x="32" y="910" font-size="18" text-anchor="start">Barre di λ con origine e scala comuni.</text><text x="32" y="960" font-size="22" text-anchor="start">3 · Solo λ₀ varia, n = 2</text><line x1="145" y1="1280" x2="560" y2="1280" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1285" x2="150" y2="1030" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1280" x2="550" y2="1080" stroke="#52667a" stroke-width="2"/><circle cx="150" cy="1280" r="4" fill="#f7fafc" stroke="#316b9b" stroke-width="2"/><circle cx="450" cy="1130" r="5" fill="#316b9b"/><text x="470" y="1135" font-size="18" text-anchor="start">A</text><text x="128" y="1305" font-size="18" text-anchor="end">0</text><text x="450" y="1310" font-size="18" text-anchor="middle">600</text><text x="128" y="1136" font-size="18" text-anchor="end">300</text><text x="420" y="1350" font-size="18" text-anchor="start">λ₀ (nm)</text><text x="75" y="1015" font-size="18" text-anchor="start">λ (nm)</text><text x="32" y="1400" font-size="18" text-anchor="start">La relazione è λ = λ₀/2 a questo indice.</text><text x="32" y="1440" font-size="18" text-anchor="start">L’origine è un limite: si richiede λ₀ > 0.</text></g></svg>
