<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1580" viewBox="0 0 640 1580" role="img" aria-labelledby="title desc"><title id="title">Carica iniziale e tensione condivisa</title><desc id="desc">Prima del collegamento il futuro nodo positivo ha dodici microcoulomb sul primo condensatore e zero sul secondo. Alla fine le capacità uguali condividono tre volt e portano sei microcoulomb ciascuna su quel nodo. Ultime barre: tensioni finali tre, quattro e sette mezzi volt.</desc><rect width="640" height="1580" rx="16" fill="#f7f9fc"/>
<text x="32" y="44" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">1 · Prima: soltanto C₀ è carico</text>
<text x="32" y="86" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₀ = 2 μF, 6 V ; C = 2 μF, scarico</text>
<path d="M150 130V325" fill="none" stroke="#182c46" stroke-width="2"/>
<rect x="150" y="155" width="360" height="42" fill="#185d83"/>
<text x="32" y="185" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₀</text>
<text x="520" y="185" font-family="Arial,sans-serif" font-size="21" fill="#182c46">12 μC</text>
<circle cx="150" cy="270" r="4" fill="#182c46"/>
<text x="32" y="278" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C</text>
<text x="172" y="278" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0 μC</text>
<text x="118" y="354" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="32" y="402" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Carica del futuro nodo A: 12 μC.</text>
<path d="M32 454H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="503" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">2 · Dopo: tensione comune</text>
<text x="32" y="547" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Generatori scollegati ; transitorio concluso.</text>
<path d="M110 650V780M530 650V780" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M110 650H290M310 650H530" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M290 625V675" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M310 625V675" fill="none" stroke="#182c46" stroke-width="4"/>
<circle cx="110" cy="650" r="4" fill="#182c46"/>
<circle cx="530" cy="650" r="4" fill="#182c46"/>
<path d="M110 780H290M310 780H530" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M290 755V805" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M310 755V805" fill="none" stroke="#182c46" stroke-width="4"/>
<circle cx="110" cy="780" r="4" fill="#182c46"/>
<circle cx="530" cy="780" r="4" fill="#182c46"/>
<text x="67" y="640" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="548" y="640" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="215" y="603" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₀ = 2 μF ; Q₀,f = 6 μC</text>
<text x="215" y="737" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C = 2 μF ; Q_f = 6 μC</text>
<text x="32" y="863" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Q_A = 6 μC + 6 μC = 12 μC</text>
<text x="32" y="905" font-family="Arial,sans-serif" font-size="21" fill="#182c46">V_f = 12 μC / (4 μF) = 3 V</text>
<text x="32" y="948" font-family="Arial,sans-serif" font-size="21" fill="#182c46">L’energia del solo campo può diminuire.</text>
<path d="M32 997H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="1047" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">3 · Tensioni finali di altre prove</text>
<text x="32" y="1090" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A: 6 V, 2 μF ; B: 12 V, 4 μF</text>
<path d="M150 1130V1440" fill="none" stroke="#182c46" stroke-width="2"/>
<rect x="150" y="1160" width="240" height="42" fill="#185d83"/>
<text x="32" y="1190" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="408" y="1190" font-family="Arial,sans-serif" font-size="21" fill="#182c46">3 V</text>
<rect x="150" y="1260" width="320" height="42" fill="#b85322"/>
<text x="32" y="1290" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="488" y="1290" font-family="Arial,sans-serif" font-size="21" fill="#182c46">4 V</text>
<rect x="150" y="1360" width="280" height="42" fill="#35654e"/>
<text x="32" y="1390" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Media</text>
<text x="448" y="1390" font-family="Arial,sans-serif" font-size="21" fill="#182c46">7/2 V</text>
<text x="118" y="1470" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="32" y="1520" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Origine e scala comuni entro il pannello.</text>
</svg>
