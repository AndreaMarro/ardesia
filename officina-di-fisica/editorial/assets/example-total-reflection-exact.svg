<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1760" viewBox="0 0 640 1760" role="img" aria-labelledby="title desc">
<title id="title">Acqua e aria nel modello a indice quattro terzi</title><desc id="desc">Tre casi con angoli misurati alla normale: angolo critico con seno tre quarti, trasmissione a incidenza trenta gradi e riflessione totale a sessanta gradi. Gli indici sono dati del modello. Ogni raggio è un path distinto con verso di propagazione; nessun raggio trasmesso propagante è disegnato nel caso di riflessione totale. Lunghezze dei raggi non confrontano intensità.</desc>
<defs><marker id="in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#155fa0"/></marker><marker id="out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a33430"/></marker><marker id="trans" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#217548"/></marker></defs>
<rect width="640" height="1760" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" font-size="22" fill="#172c3b">
<text x="35" y="48" font-size="27">1. Il limite: trasmissione radente</text>
<text x="35" y="90" font-size="22">Modello: acqua n₁ = 4/3; aria n₂ = 1</text>
<rect x="35" y="310" width="570" height="175" fill="#e6eff5"/>
<path d="M35 310H605" stroke="#6e7f88" stroke-width="2" fill="none"/>
<path d="M320 140V475" fill="none" stroke="#6e7f88" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M170.000000 442.287566L320.000000 310.000000" fill="none" stroke="#155fa0" stroke-width="4" marker-end="url(#in)"/>
<path d="M320.000000 310.000000L470.000000 442.287566" fill="none" stroke="#a33430" stroke-width="4" marker-end="url(#out)"/>
<path d="M320.000000 310.000000L570.000000 310.000000" fill="none" stroke="#217548" stroke-width="4" marker-end="url(#trans)"/>
<path d="M320 365A55 55 0 0 1 278.75 346.379081" stroke="#172c3b" fill="none"/>
<text x="255" y="420" font-size="22">θc</text>
<text x="400" y="280" font-size="22">90° alla normale</text>
<text x="50" y="195" font-size="22">aria</text>
<text x="50" y="480" font-size="22">acqua</text>
<text x="35" y="530" font-size="22">sin θc = 3/4; 45° &lt; θc &lt; 60°</text>
<text x="35" y="615" font-size="27">2. Incidenza 30°: il raggio esce</text>
<text x="35" y="655" font-size="22">sin θ₂ = (4/3) · (1/2) = 2/3</text>
<rect x="35" y="870" width="570" height="220" fill="#e6eff5"/>
<path d="M35 870H605" stroke="#6e7f88" stroke-width="2" fill="none"/>
<path d="M320 700V1080" fill="none" stroke="#6e7f88" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M220.000000 1043.205081L320.000000 870.000000" fill="none" stroke="#155fa0" stroke-width="4" marker-end="url(#in)"/>
<path d="M320.000000 870.000000L420.000000 1043.205081" fill="none" stroke="#a33430" stroke-width="4" marker-end="url(#out)"/>
<path d="M320.000000 870.000000L453.333333 720.928802" fill="none" stroke="#217548" stroke-width="4" marker-end="url(#trans)"/>
<path d="M320 940A70 70 0 0 1 285 930.621778" stroke="#172c3b" fill="none"/><path d="M320 800A70 70 0 0 1 366.666667 817.825081" stroke="#172c3b" fill="none"/>
<text x="265" y="1020" font-size="22">30°</text>
<text x="365" y="780" font-size="22">θ₂</text>
<text x="50" y="750" font-size="22">aria</text>
<text x="50" y="1080" font-size="22">acqua</text>
<text x="35" y="1130" font-size="22">30° &lt; θ₂ &lt; 45°; riflesso a 30°</text>
<text x="35" y="1210" font-size="27">3. Incidenza 60°: riflessione totale</text>
<text x="35" y="1255" font-size="22">Nessun raggio trasmesso propagante</text>
<rect x="35" y="1450" width="570" height="170" fill="#e6eff5"/>
<path d="M35 1450H605" stroke="#6e7f88" stroke-width="2" fill="none"/>
<path d="M320 1300V1610" fill="none" stroke="#6e7f88" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M146.794919 1550.000000L320.000000 1450.000000" fill="none" stroke="#155fa0" stroke-width="4" marker-end="url(#in)"/>
<path d="M320.000000 1450.000000L493.205081 1550.000000" fill="none" stroke="#a33430" stroke-width="4" marker-end="url(#out)"/>
<path d="M320 1515A65 65 0 0 1 263.708349 1482.5" stroke="#172c3b" fill="none"/><path d="M320 1515A65 65 0 0 0 376.291651 1482.5" stroke="#172c3b" fill="none"/>
<text x="230" y="1535" font-size="22">60°</text>
<text x="380" y="1535" font-size="22">60°</text>
<text x="50" y="1370" font-size="22">aria</text>
<text x="50" y="1600" font-size="22">acqua</text>
<text x="35" y="1670" font-size="22">(4/3) sin 60° = 2√3/3 &gt; 1</text>
<text x="35" y="1715" font-size="22">Il raggio riflesso resta nell’acqua.</text>
</g></svg>
