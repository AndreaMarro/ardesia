<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1140" role="img" aria-labelledby="title desc">
<title id="title">La risultante radiale nel moto circolare uniforme</title>
<desc id="desc">Un corpo di massa due chilogrammi percorre una circonferenza di raggio due metri con rapidità due metri al secondo. Scala geometrica cinquanta pixel per metro. In P la velocità è tangente verso l’alto con freccia lunga sessanta pixel a trenta pixel per metro al secondo. Nella seconda tappa in P la risultante punta verso il centro O con freccia lunga ottanta pixel a venti pixel per newton. La risultante vale quattro newton ed è la somma delle forze reali. Scale di dimensioni diverse, non confrontabili fra loro.</desc>
<defs><marker id="v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#14647b"/></marker><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#b44b2c"/></marker></defs>
<rect width="640" height="1140" rx="24" fill="#faf8f2"/>
<g font-family="system-ui, sans-serif" fill="#16323f" font-size="20">
<text x="28" y="42" font-size="24" font-weight="700">1 · Leggi la cinematica</text>
<circle cx="180" cy="210" r="100" fill="none" stroke="#72828a" stroke-width="2"/>
<path d="M180 210 L280 210" fill="none" stroke="#72828a" stroke-width="2"/>
<path d="M280 210 L280 150" fill="none" stroke="#14647b" stroke-width="4" marker-end="url(#v)"/>
<circle cx="180" cy="210" r="4" fill="#16323f"/><circle cx="280" cy="210" r="5" fill="#14647b"/>
<text x="162" y="240">O</text><text x="288" y="235">P</text><text x="190" y="194">r₀ = 2 m</text>
<text x="320" y="155" fill="#14647b">v = 2 m/s</text><text x="320" y="195">Massa m = 2 kg</text>
<text x="28" y="350">Geometria: 50 px/m</text><text x="28" y="385">Velocità: 30 px per m/s</text>
<text x="28" y="438" font-size="24" font-weight="700">2 · La risultante punta verso O</text>
<circle cx="180" cy="580" r="100" fill="none" stroke="#72828a" stroke-width="2"/>
<path d="M280 580 L200 580" fill="none" stroke="#b44b2c" stroke-width="4" marker-end="url(#f)"/>
<circle cx="180" cy="580" r="4" fill="#16323f"/><circle cx="280" cy="580" r="5" fill="#14647b"/>
<text x="162" y="610">O</text><text x="290" y="605">P</text>
<text x="225" y="555" fill="#b44b2c">F = 4 N</text>
<text x="330" y="620">Risultante delle</text><text x="330" y="651">forze reali.</text>
<text x="28" y="725">Forza: 20 px/N</text><text x="28" y="760">Scale di dimensioni diverse: non confrontarle.</text>
<text x="28" y="822" font-size="24" font-weight="700">3 · Applica la legge di Newton</text>
<text x="28" y="875">A = v²/r₀ = (2 m/s)²/(2 m) = 2 m/s²</text>
<text x="28" y="920">F = mA = (2 kg)(2 m/s²) = 4 N</text>
<text x="28" y="980">La risultante tangenziale è nulla.</text>
<text x="28" y="1025">La forza centripeta è la risultante radiale,</text>
<text x="28" y="1065">non una forza ulteriore da sommare.</text>
</g></svg>
