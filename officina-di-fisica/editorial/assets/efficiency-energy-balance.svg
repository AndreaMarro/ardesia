<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" role="img" aria-labelledby="title desc">
<title id="title">Rendimento: seguire tutta l'energia</title>
<desc id="desc">Un ciclo riceve quattro joule e ne fornisce due utili. La stessa barra energetica è suddivisa in due metà uguali: due joule utili e due joule in uscite non utili. Senza accumulo, tutte le uscite sommano l'ingresso. Il rendimento è due diviso quattro, un mezzo, equivalente al cinquanta per cento.</desc>
<rect width="640" height="1010" fill="#faf8f0"/>
<g fill="#241e35" font-family="Georgia,serif" font-size="23">
<text x="30" y="44" font-size="27" font-weight="bold">1 · Definire ciò che entra</text>
<text x="30" y="88">Un ciclo; nessun accumulo netto.</text>
<text x="30" y="132">Ingresso E in = 4 J</text>
<rect x="70" y="163" width="320" height="60" fill="#ded7ed" stroke="#241e35" stroke-width="2"/>
<text x="194" y="202">4 J</text>
<text x="30" y="270">La barra misura energia: scala80px/J.</text>
<path d="M30 305h580" stroke="#8b8298"/>
<text x="30" y="352" font-size="27" font-weight="bold">2 · Separare le uscite</text>
<text x="30" y="397">La stessa energia esce in due parti.</text>
<rect x="70" y="430" width="160" height="60" fill="#ded7ed" stroke="#241e35" stroke-width="2"/>
<rect x="230" y="430" width="160" height="60" fill="#eee9dc" stroke="#241e35" stroke-width="2"/>
<text x="124" y="469">2 J</text><text x="284" y="469">2 J</text>
<text x="70" y="530">utili</text><text x="260" y="530">non utili</text>
<text x="30" y="578">Bilancio: 4 J = 2 J + 2 J.</text>
<text x="30" y="620">Le uscite non utili non sono energia</text>
<text x="30" y="653">distrutta o sparita dal bilancio.</text>
<path d="M30 687h580" stroke="#8b8298"/>
<text x="30" y="734" font-size="27" font-weight="bold">3 · Calcolare la frazione utile</text>
<text x="30" y="780">η = E u / E in = 2 J / 4 J = 1/2.</text>
<text x="30" y="825">J/J = 1: nessuna unità di energia.</text>
<text x="30" y="870">1/2 = 50/100 = 50%.</text>
<text x="30" y="915">Qui il rapporto è richiesto come1/2,</text>
<text x="30" y="956">con0 &lt; η &lt; 1 in ogni ciclo ammesso.</text>
</g></svg>
