<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1470" viewBox="0 0 640 1470" role="img" aria-labelledby="title desc">
<title id="title">Carico e cavi: potenze e frazioni</title><desc id="desc">Circuito in serie con carico da 3 ohm e cavi da 1 ohm, alimentato nella prova illustrata con 4 volt e 1 ampere. Barre da 3 watt e 1 watt con medesima scala. Le ultime barre mostrano quote 3/4, 1/2 e media 5/8 su una scala distinta, adimensionale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#182c46"/></marker></defs>
<rect width="640" height="1470" rx="16" fill="#f7f9fc"/>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="32" y="44" font-size="25" font-weight="700">1 · La corrente è comune</text><text x="32" y="84">Esempio alimentato: I = 1 A, sorgente da 4 V.</text></g>
<g fill="none" stroke="#182c46" stroke-width="3"><path d="M100 190H180M350 190H410M510 190H550V340H100V235"/><circle cx="100" cy="212" r="23"/><rect x="180" y="168" width="170" height="44" stroke="#185d83"/><rect x="410" y="168" width="100" height="44" stroke="#b85322"/><path d="M110 190H155" marker-end="url(#arrow)"/></g>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="218" y="150">R_L = 3 Ω</text><text x="410" y="150">R_c = 1 Ω</text><text x="91" y="202">+</text><text x="93" y="229">−</text><text x="310" y="297">I = 1 A</text><text x="32" y="401">P_L = 3 W ; P_c = 1 W ; totale = 4 W.</text><text x="32" y="444">Simboli resistivi schematici; nessun ramo aggiunto.</text></g>
<path d="M32 480H608" stroke="#c4cfdb" stroke-width="2"/>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="32" y="528" font-size="25" font-weight="700">2 · Utile e perdita sullo stesso totale</text><text x="32" y="570">Barre di potenza riferite all’esempio I = 1 A.</text><text x="48" y="655">Carico</text><text x="48" y="735">Cavi</text><text x="48" y="815">Totale</text></g>
<path d="M150 610V860" fill="none" stroke="#182c46" stroke-width="2"/><rect x="150" y="625" width="180" height="42" fill="#185d83"/><rect x="150" y="705" width="60" height="42" fill="#b85322"/><rect x="150" y="785" width="240" height="42" fill="#35654e"/>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="347" y="654">3 W</text><text x="227" y="734">1 W</text><text x="407" y="814">4 W</text><text x="118" y="883">0</text><text x="32" y="930">η = 3 W / 4 W = 3/4.</text><text x="32" y="970">Energia nei cavi: conversione, non scomparsa.</text></g>
<path d="M32 1010H608" stroke="#c4cfdb" stroke-width="2"/>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="32" y="1056" font-size="25" font-weight="700">3 · Due quote e la loro media</text><text x="32" y="1096">A: (3 Ω, 1 Ω) ; B: (2 Ω, 2 Ω).</text><text x="63" y="1176">A</text><text x="63" y="1256">B</text><text x="32" y="1336">Media</text></g>
<path d="M150 1130V1378" fill="none" stroke="#182c46" stroke-width="2"/><rect x="150" y="1146" width="300" height="42" fill="#185d83"/><rect x="150" y="1226" width="200" height="42" fill="#b85322"/><rect x="150" y="1306" width="250" height="42" fill="#35654e"/>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="468" y="1176">3/4</text><text x="368" y="1256">1/2</text><text x="418" y="1336">5/8</text><text x="118" y="1402">0</text><text x="32" y="1440">Scala comune delle quote, distinta dalle potenze.</text></g>
</svg>
