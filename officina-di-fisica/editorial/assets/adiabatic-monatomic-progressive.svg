<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
<title id="title">Compressione adiabatica reversibile: volume e temperatura</title>
<desc id="desc">Due stati di equilibrio di un gas monoatomico. Volumi in rapporto otto a uno, temperature assolute cento e quattrocento kelvin. La radice cubica di otto è due e il suo quadrato è quattro.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#165a87"/></marker></defs>
<rect width="640" height="1080" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Due stati, non un urto del pistone</text>
<rect x="65" y="105" width="320" height="100" fill="#dceef6" stroke="#14243a" stroke-width="2"/><rect x="475" y="105" width="40" height="100" fill="#f9e4cc" stroke="#14243a" stroke-width="2"/>
<path d="M400 155H458" stroke="#165a87" stroke-width="4" marker-end="url(#arrow)"/>
<text x="65" y="240">V₁ = 8 V*</text><text x="451" y="240">V₂ = V*</text>
<text x="65" y="272">T₁ = 100 K</text><text x="451" y="272">T₂ = 400 K</text>
<text x="32" y="310" font-size="17">V* è un volume positivo; aree a pari altezza: 8 : 1.</text>
<text x="32" y="338" font-size="17">Collegamento reversibile, Q = 0; freccia schematica.</text>
<path d="M32 365H608" stroke="#9babbc"/>
<text x="32" y="409" font-size="25" font-weight="bold">2 · La temperatura assoluta cresce</text>
<path d="M130 435V635" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="460" width="100" height="36" fill="#165a87"/><rect x="130" y="540" width="400" height="36" fill="#ab5b22"/>
<text x="55" y="487">T₁</text><text x="247" y="487">100 K</text><text x="55" y="567">T₂</text><text x="535" y="567">400 K</text>
<text x="32" y="673" font-size="18">Origine comune x = 130; scala 1 px/K.</text>
<text x="32" y="707" font-size="18">Compressione: W del gas &lt; 0, quindi ΔU = −W &gt; 0.</text>
<path d="M32 739H608" stroke="#9babbc"/>
<text x="32" y="783" font-size="25" font-weight="bold">3 · Un percorso senza calcolatrice</text>
<rect x="55" y="829" width="130" height="70" rx="8" fill="#dceef6"/><rect x="255" y="829" width="130" height="70" rx="8" fill="#dceef6"/><rect x="455" y="829" width="130" height="70" rx="8" fill="#e1efe7"/>
<text x="77" y="871">∛8 = 2</text><text x="278" y="871">2² = 4</text><text x="471" y="871">100 × 4</text>
<path d="M194 864H245" stroke="#165a87" stroke-width="3" marker-end="url(#arrow)"/><path d="M394 864H445" stroke="#165a87" stroke-width="3" marker-end="url(#arrow)"/>
<text x="32" y="951">T₂ / T₁ = r²ᐟ³ = 4, non 8.</text>
<text x="32" y="992" font-size="18">Stessa quantità di gas, capacità molari costanti.</text>
<text x="32" y="1026" font-size="18">Non si applica questa legge all’espansione libera.</text>
</g></svg>
