<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1500" width="640" height="1500" font-family="Arial, sans-serif" font-size="20" fill="#182d42" role="img" aria-labelledby="title desc">
<title id="title">Tensione e spinta sostengono insieme il peso</title><desc id="desc">Un corpo di massa tre chilogrammi e volume un litro è completamente immerso in acqua, sospeso dall'alto. Peso trenta newton verso il basso, spinta dieci e tensione venti verso l'alto. Proiezioni dei vettori e barre separate verificano il bilancio.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1500" fill="white"/>
<text x="32" y="46" font-size="24" font-weight="bold">1. Il corpo resta completamente immerso</text><text x="32" y="84">m = 3 kg, V = 1 L; acqua a 1 kg/L.</text>
<rect x="80" y="235" width="460" height="160" fill="#b5dcf1"/><path d="M65 235H555" stroke="#287aab" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M200 120V160M200 205V280" stroke="#263f55" stroke-width="2"/><rect x="185" y="160" width="30" height="45" rx="6" fill="#dbe5e6" stroke="#263f55" stroke-width="2"/>
<rect x="180" y="280" width="40" height="40" fill="#e9bb70" stroke="#263f55" stroke-width="2"/>
<text x="260" y="186">Dinamometro: T = 20 N.</text><text x="280" y="306">Cubo: 10 × 10 × 10 cm.</text>
<text x="32" y="446">Fronte 40 × 40 px, scala geometrica 4 px/cm.</text><text x="32" y="484">Filo ideale; nessun contatto con fondo o pareti.</text>
<path d="M32 524H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="574" font-size="24" font-weight="bold">2. Proietta le tre forze verticali</text><text x="32" y="614">g = 10 m/s²; ogni freccia ha scala 4 px/N.</text>
<path d="M100 850V770" stroke="#6c6eaa" stroke-width="3" marker-end="url(#a)"/><path d="M300 850V810" stroke="#237b98" stroke-width="3" marker-end="url(#a)"/><path d="M500 770V890" stroke="#b46145" stroke-width="3" marker-end="url(#a)"/>
<text x="55" y="734">T = 20 N.</text><text x="245" y="774">F_A = 10 N.</text><text x="442" y="934">P = 30 N.</text>
<text x="32" y="994">Lunghezze: 80 px, 40 px e 120 px.</text><text x="32" y="1030">Sono proiezioni separate, non punti di applicazione.</text>
<path d="M32 1070H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="1120" font-size="24" font-weight="bold">3. Ricomponi l’equilibrio</text>
<rect x="150" y="1180" width="80" height="40" fill="#9294c4"/><rect x="230" y="1180" width="40" height="40" fill="#84c7eb"/><text x="310" y="1208">T + F_A = 30 N.</text>
<rect x="150" y="1260" width="120" height="40" fill="#cf9983"/><text x="310" y="1288">P = 30 N.</text>
<text x="32" y="1350">T = P − F_A = 30 N − 10 N = 20 N.</text><text x="32" y="1394">Le barre usano ancora 4 px/N.</text><text x="32" y="1440">Il peso reale resta 30 N; la massa resta 3 kg.</text><text x="32" y="1474" font-size="18">m &gt; ρV: il filo dall’alto mantiene tensione positiva.</text>
</svg>
