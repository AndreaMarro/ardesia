<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc"><title id="title">Quanti genitori rimangono in media</title><desc id="desc">Tre tappe: dimezzamenti di una popolazione media iniziale di sessantaquattro milioni; curva esponenziale dello stesso campione; ricostruzione di un altro campione dai valori medi quarantotto milioni dopo un’ora e dodici dopo tre ore.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1600" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Quanti genitori rimangono in media</text><text x="32" y="96" font-size="22" text-anchor="start">1 · Valori medi a intervalli di un’emivita</text><text x="128" y="183" font-size="18" text-anchor="end">0 h</text><rect x="150" y="160" width="320" height="30" fill="#316b9b"/><text x="482" y="183" font-size="18" text-anchor="start">64 milioni</text><text x="128" y="253" font-size="18" text-anchor="end">1 h</text><rect x="150" y="230" width="160" height="30" fill="#316b9b"/><text x="322" y="253" font-size="18" text-anchor="start">32 milioni</text><text x="128" y="323" font-size="18" text-anchor="end">2 h</text><rect x="150" y="300" width="80" height="30" fill="#316b9b"/><text x="242" y="323" font-size="18" text-anchor="start">16 milioni</text><text x="128" y="393" font-size="18" text-anchor="end">3 h</text><rect x="150" y="370" width="40" height="30" fill="#316b9b"/><text x="202" y="393" font-size="18" text-anchor="start">8 milioni</text><text x="32" y="453" font-size="18" text-anchor="start">T½ = 1 h · nessun nuovo genitore</text><text x="32" y="520" font-size="22" text-anchor="start">2 · Curva del solo campione N₀ = 64 milioni</text><line x1="145" y1="1000" x2="550" y2="1000" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1005" x2="150" y2="630" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="610" font-size="18" text-anchor="start">N (milioni)</text><text x="485" y="1070" font-size="18" text-anchor="start">t (h)</text><path d="M150.0000 680.0000 L152.7500 685.4974 L155.5000 690.9004 L158.2500 696.2105 L161.0000 701.4294 L163.7500 706.5587 L166.5000 711.5999 L169.2500 716.5544 L172.0000 721.4238 L174.7500 726.2096 L177.5000 730.9131 L180.2500 735.5359 L183.0000 740.0792 L185.7500 744.5445 L188.5000 748.9331 L191.2500 753.2463 L194.0000 757.4853 L196.7500 761.6516 L199.5000 765.7463 L202.2500 769.7706 L205.0000 773.7258 L207.7500 777.6131 L210.5000 781.4336 L213.2500 785.1884 L216.0000 788.8787 L218.7500 792.5057 L221.5000 796.0703 L224.2500 799.5737 L227.0000 803.0169 L229.7500 806.4009 L232.5000 809.7269 L235.2500 812.9956 L238.0000 816.2083 L240.7500 819.3657 L243.5000 822.4689 L246.2500 825.5188 L249.0000 828.5162 L251.7500 831.4622 L254.5000 834.3576 L257.2500 837.2032 L260.0000 840.0000 L262.7500 842.7487 L265.5000 845.4502 L268.2500 848.1053 L271.0000 850.7147 L273.7500 853.2794 L276.5000 855.7999 L279.2500 858.2772 L282.0000 860.7119 L284.7500 863.1048 L287.5000 865.4566 L290.2500 867.7679 L293.0000 870.0396 L295.7500 872.2723 L298.5000 874.4665 L301.2500 876.6231 L304.0000 878.7427 L306.7500 880.8258 L309.5000 882.8731 L312.2500 884.8853 L315.0000 886.8629 L317.7500 888.8065 L320.5000 890.7168 L323.2500 892.5942 L326.0000 894.4394 L328.7500 896.2528 L331.5000 898.0351 L334.2500 899.7868 L337.0000 901.5084 L339.7500 903.2005 L342.5000 904.8634 L345.2500 906.4978 L348.0000 908.1041 L350.7500 909.6828 L353.5000 911.2344 L356.2500 912.7594 L359.0000 914.2581 L361.7500 915.7311 L364.5000 917.1788 L367.2500 918.6016 L370.0000 920.0000 L372.7500 921.3744 L375.5000 922.7251 L378.2500 924.0526 L381.0000 925.3574 L383.7500 926.6397 L386.5000 927.9000 L389.2500 929.1386 L392.0000 930.3560 L394.7500 931.5524 L397.5000 932.7283 L400.2500 933.8840 