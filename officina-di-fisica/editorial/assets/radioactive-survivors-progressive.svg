 campione: due misure e l’inizio</text><text x="32" y="1170" font-size="18" text-anchor="start">L’emivita inizialmente non è nota.</text><text x="128" y="1243" font-size="18" text-anchor="end">0 h</text><rect x="150" y="1220" width="288" height="30" fill="#a76d20"/><text x="450" y="1243" font-size="18" text-anchor="start">96 milioni</text><text x="128" y="1343" font-size="18" text-anchor="end">1 h</text><rect x="150" y="1320" width="144" height="30" fill="#316b9b"/><text x="306" y="1343" font-size="18" text-anchor="start">48 milioni</text><text x="128" y="1443" font-size="18" text-anchor="end">3 h</text><rect x="150" y="1420" width="36" height="30" fill="#316b9b"/><text x="198" y="1443" font-size="18" text-anchor="start">12 milioni</text><text x="32" y="1515" font-size="18" text-anchor="start">Blu: misure · Ocra: valore iniziale ricostruito</text><text x="32" y="1560" font-size="18" text-anchor="start">Il rapporto su 2 h dà q² = 1/4, quindi q = 1/2.</text></g></svg>
