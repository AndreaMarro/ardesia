<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc"><title id="title">Forze e corse in un sistema idraulico</title><desc id="desc">Tre pannelli distinti: aree in rapporto uno a nove con forze venticinque e duecentoventicinque newton; corse ventiquattro e tre centimetri per aree in rapporto uno a otto; volume sei millilitri spostato da dodici centimetri quadrati per mezzo centimetro.</desc><rect width="640" height="1450" fill="#faf7ef"/><g font-family="Arial,sans-serif" font-size="22" fill="#252438">
<text x="32" y="48" font-size="27" font-weight="bold">Trasmettere pressione e volume</text><text x="32" y="94">1. Aree, non diametri: A₂ / A₁ = 9</text>
<rect x="95" y="315" width="30" height="65" fill="#dcd7f3" stroke="#41366b" stroke-width="3"/><rect x="290" y="315" width="270" height="65" fill="#d9eddf" stroke="#246d54" stroke-width="3"/>
<path d="M110 290V310" stroke="#5b36b1" stroke-width="5"/><path d="m103 300 7 10 7-10" fill="none" stroke="#5b36b1" stroke-width="4"/>
<path d="M425 130V310" stroke="#5b36b1" stroke-width="5"/><path d="m415 293 10 17 10-17" fill="none" stroke="#5b36b1" stroke-width="5"/>
<text x="50" y="260">F₁ = 25 N</text><text x="454" y="220">225 N</text><text x="90" y="420">A₁</text><text x="400" y="420">A₂ = 9 A₁</text><text x="110" y="468">Stessa sovrapressione F₁/A₁ = F₂/A₂</text>
<path d="M32 505H608" stroke="#b3abbf"/><text x="32" y="550">2. Esempio distinto: A₂ / A₁ = 8</text>
<path d="M160 600V840" stroke="#286594" stroke-width="6"/><path d="m148 822 12 18 12-18" fill="none" stroke="#286594" stroke-width="6"/>
<path d="M450 840V810" stroke="#286594" stroke-width="6"/><path d="m440 824 10-14 10 14" fill="none" stroke="#286594" stroke-width="5"/>
<text x="205" y="704">s₁ = 24 cm</text><text x="370" y="780">s₂ = 3 cm</text><text x="105" y="895">A₁ · 24 cm = 8 A₁ · 3 cm</text><text x="100" y="938">Frecce: moduli e versi delle corse</text>
<path d="M32 980H608" stroke="#b3abbf"/><text x="32" y="1025">3. Un piccolo volume spostato</text>
<rect x="160" y="1120" width="300" height="150" fill="#dce7f6" stroke="#286594" stroke-width="3"/>
<path d="M160 1120 205 1085H505V1235L460 1270M460 1120 505 1085M460 1120V1270" fill="none" stroke="#286594" stroke-width="3"/>
<text x="205" y="1204">A = 12 cm²</text><text x="350" y="1057">s = 0,5 cm</text><text x="165" y="1330">ΔV = A s = 6 cm³ = 6 mL</text><text x="80" y="1390">Le facce delimitano il volume geometrico</text>
</g></svg>