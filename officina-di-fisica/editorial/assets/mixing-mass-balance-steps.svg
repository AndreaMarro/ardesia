<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1640" viewBox="0 0 640 1640" role="img" aria-labelledby="title desc">
<title id="title">Conservare il tracciante e sommare i volumi assegnati additivi</title><desc id="desc">Nel primo secondo un litro a un grammo al litro e un litro a tre grammi al litro producono due litri a due grammi al litro. Un secondo confronto aumenta il flusso più concentrato: dieci grammi al secondo in quattro litri al secondo danno cinque mezzi grammi al litro.</desc>
<rect width="640" height="1640" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" font-size="22" fill="#172c3b">
<text x="35" y="48" font-size="27" font-weight="bold">1. Contare ciò che entra in 1 s</text>
<text x="35" y="90">Cella = 1 L; punto = 1 g di tracciante</text>
<rect x="95" y="140" width="100" height="100" fill="#e0eef7" stroke="#155fa0" stroke-width="3"/><circle cx="145" cy="190" r="9" fill="#172c3b"/>
<rect x="375" y="140" width="100" height="100" fill="#f8e5d9" stroke="#a33430" stroke-width="3"/><g fill="#172c3b"><circle cx="395" cy="190" r="9"/><circle cx="425" cy="190" r="9"/><circle cx="455" cy="190" r="9"/></g>
<text x="90" y="285">1 L e 1 g</text><text x="370" y="285">1 L e 3 g</text>
<text x="90" y="330">c₁ = 1 g/L</text><text x="370" y="330">c₂ = 3 g/L</text>
<text x="35" y="385">Volumi additivi e nessuna reazione</text>
<line x1="35" x2="605" y1="420" y2="420" stroke="#b9c4c9"/>
<text x="35" y="470" font-size="27" font-weight="bold">2. Distribuire il totale nella miscela</text>
<rect x="155" y="515" width="100" height="100" fill="#e5f1e6" stroke="#247143" stroke-width="3"/><rect x="255" y="515" width="100" height="100" fill="#e5f1e6" stroke="#247143" stroke-width="3"/>
<g fill="#172c3b"><circle cx="185" cy="565" r="9"/><circle cx="225" cy="565" r="9"/><circle cx="285" cy="565" r="9"/><circle cx="325" cy="565" r="9"/></g>
<text x="95" y="670">4 g in 2 L: c = 4/2 = 2 g/L</text>
<text x="35" y="715">Miscela uniforme: 2 g per ogni litro</text>
<text x="35" y="760">Celle e punti sono conteggi simbolici.</text>
<text x="35" y="800">Non descrivono molecole o dimensioni reali.</text>
<line x1="35" x2="605" y1="835" y2="835" stroke="#b9c4c9"/>
<text x="35" y="885" font-size="27" font-weight="bold">3. Aumentare il flusso concentrato</text>
<text x="35" y="925">Q₁ = 1 L/s; Q₂ = 3 L/s</text>
<text x="35" y="975">Flussi di tracciante, scala 20 px / (g/s)</text>
<rect x="90" y="1005" width="20" height="28" fill="#155fa0"/><rect x="110" y="1005" width="180" height="28" fill="#a33430"/>
<text x="350" y="1028">1 + 9 = 10 g/s</text>
<text x="35" y="1090">Portate di soluzione, scala 40 px / (L/s)</text>
<rect x="90" y="1120" width="40" height="28" fill="#155fa0"/><rect x="130" y="1120" width="120" height="28" fill="#a33430"/>
<text x="350" y="1143">1 + 3 = 4 L/s</text>
<text x="35" y="1210">Le scale delle due barre sono diverse.</text>
<text x="35" y="1255">Concentrazione: 10/4 = 5/2 g/L</text>
<text x="35" y="1320">Non si sommano 1 g/L e 3 g/L:</text>
<text x="35" y="1360">prima si conservano i grammi trasportati,</text>
<text x="35" y="1400">poi si divide per il volume totale.</text>
<text x="35" y="1475">c resta fra 1 e 3 g/L per portate positive.</text>
<text x="35" y="1540">I due flussi pesano in proporzione</text>
<text x="35" y="1580">ai rispettivi volumi al secondo.</text>
</g></svg>
