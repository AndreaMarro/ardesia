ight="27" fill="#316b9b" rx="3"/><text x="395" y="621" font-size="19" fill="#20354d" text-anchor="start">6 μC</text><text x="125" y="702" font-size="19" fill="#20354d" text-anchor="end">B</text><rect x="150" y="685" width="120" height="27" fill="#a76d20" rx="3"/><text x="275" y="706" font-size="19" fill="#20354d" text-anchor="start">3 μC</text><text x="125" y="787" font-size="19" fill="#20354d" text-anchor="end">media</text><rect x="150" y="770" width="180.0" height="27" fill="#488265" rx="3"/><text x="335.0" y="791" font-size="19" fill="#20354d" text-anchor="start">4.5 μC</text><text x="32" y="885" font-size="18" fill="#20354d" text-anchor="start">A: Q₀ = 12 μC, s = 2 · B: Q₀ = 9 μC, s = 3</text><text x="32" y="960" font-size="22" fill="#20354d" text-anchor="start">3 · Solo Q₀ = 12 μC: tre punti esatti</text><line x1="145" y1="1320" x2="520" y2="1320" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1325" x2="150" y2="1030" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><circle cx="250" cy="1080" r="5" fill="#316b9b"/><text x="250" y="1350" font-size="18" fill="#20354d" text-anchor="middle">1</text><text x="128" y="1086" font-size="18" fill="#20354d" text-anchor="end">12</text><circle cx="350" cy="1200" r="5" fill="#316b9b"/><text x="350" y="1350" font-size="18" fill="#20354d" text-anchor="middle">2</text><text x="128" y="1206" font-size="18" fill="#20354d" text-anchor="end">6</text><circle cx="450" cy="1240" r="5" fill="#316b9b"/><text x="450" y="1350" font-size="18" fill="#20354d" text-anchor="middle">3</text><text x="128" y="1246" font-size="18" fill="#20354d" text-anchor="end">4</text><text x="132" y="1344" font-size="18" fill="#20354d" text-anchor="end">0</text><text x="535" y="1330" font-size="18" fill="#20354d" text-anchor="start">s</text><text x="90" y="1015" font-size="18" fill="#20354d" text-anchor="start">Q (μC)</text><text x="32" y="1410" font-size="18" fill="#20354d" text-anchor="start">Punti distinti, senza i