<g font-size="19"><text x="365" y="162">vᵢ = 2 m/s</text><text x="365" y="195">a = 2 m/s²</text><text x="365" y="535">a·t = 4 m/s</text><text x="155" y="653">Δt = 2 s</text><text x="365" y="895">V = +6 m/s</text><text x="155" y="1013">Δt = 2 s</text><text x="28" y="1140">Retta continua: accelerazione costante.</text><text x="28" y="1175">Leggi una velocità: non l’area sotto la retta.</text></g></g></svg>
