<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1220" role="img" aria-labelledby="title desc">
<title id="title">Velocità finale con accelerazione costante</title><desc id="desc">Tre grafici velocità-tempo con scala identica: 120 unità SVG per secondo e 40 per metro al secondo. La velocità iniziale è due metri al secondo; l’accelerazione costante di due metri al secondo quadrato porta a quattro metri al secondo a un secondo e sei a due secondi. La retta continua è la legge della velocità, perché l’accelerazione è costante.</desc>
<rect width="640" height="1220" rx="18" fill="#faf8f2"/>
<g font-family="system-ui,sans-serif" fill="#142f3b"><text x="28" y="37" font-size="23" font-weight="700">Partenza + incremento = finale</text>
<g font-size="21" font-weight="650"><text x="28" y="79">1 · Conserva la velocità iniziale</text><text x="28" y="439">2 · Aggiungi 2 m/s ogni secondo</text><text x="28" y="799">3 · Leggi il valore finale</text></g>
<g stroke="#59696d" stroke-width="2" fill="none"><path d="M100 90V340H400M100 450V700H400M100 810V1060H400"/><path d="M94 100H106M94 180H106M94 260H106M220 334V346M340 334V346M94 460H106M94 540H106M94 620H106M220 694V706M340 694V706M94 820H106M94 900H106M94 980H106M220 1054V1066M340 1054V1066"/></g>
<g font-size="18" text-anchor="middle"><text x="100" y="367">0</text><text x="220" y="367">1</text><text x="340" y="367">2</text><text x="100" y="727">0</text><text x="220" y="727">1</text><text x="340" y="727">2</text><text x="100" y="1087">0</text><text x="220" y="1087">1</text><text x="340" y="1087">2</text></g>
<g font-size="18" text-anchor="end"><text x="83" y="106">6</text><text x="83" y="186">4</text><text x="83" y="266">2</text><text x="83" y="346">0</text><text x="83" y="466">6</text><text x="83" y="546">4</text><text x="83" y="626">2</text><text x="83" y="706">0</text><text x="83" y="826">6</text><text x="83" y="906">4</text><text x="83" y="986">2</text><text x="83" y="1066">0</text></g>
<g font-size="18"><text x="110" y="112">v (m/s)</text><text x="411" y="346">t (s)</text><text x="110" y="472">v (m/s)</text><text x="411" y="706">t (s)</text><text x="110" y="832">v (m/s)</text><text x="411" y="1066">t (s)</text></g>
<g fill="#12617c"><circle cx="100" cy="260" r="6"/><circle cx="100" cy="620" r="6"/><circle cx="340" cy="460" r="6"/><circle cx="100" cy="980" r="6"/><circle cx="340" cy="820" r="6"/></g>
