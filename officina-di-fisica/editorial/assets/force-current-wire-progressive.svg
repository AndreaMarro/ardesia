<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Corrente, tratto immerso e forza</title><desc id="desc">Tre pannelli: direzioni schematiche per un filo orizzontale con corrente a destra e campo entrante; barre delle forze sessanta e quaranta millinewton e loro media cinquanta; grafico della forza contro corrente a lunghezza tre centimetri fissata.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24">Corrente, tratto immerso e forza</text><text x="32" y="92" font-size="22">1 · B = 1 T, perpendicolare al filo</text><line x1="200" y1="300" x2="460" y2="300" stroke="#316b9b" stroke-width="14"/><line x1="220" y1="240" x2="450" y2="240" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="430" y="218" font-size="19" text-anchor="middle">I = 2 A</text><line x1="330" y1="300" x2="330" y2="165" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="185" font-size="19">F = 60 mN</text><circle cx="100" cy="300" r="18" fill="none" stroke="#52667a" stroke-width="2"/><path d="M88 288L112 312M88 312L112 288" stroke="#52667a" stroke-width="2" fill="none"/><text x="45" y="345" font-size="18">B entrante</text><path d="M200 345V365M460 345V365M200 355H460" stroke="#52667a" stroke-width="2" fill="none"/><text x="330" y="395" font-size="19" text-anchor="middle">L = 3 cm</text><text x="32" y="455" font-size="18">La lunghezza orientata segue la corrente.</text><text x="32" y="485" font-size="18">Frecce schematiche: grandezze con unità diverse.</text><text x="32" y="550" font-size="22">2 · Due letture e la loro media</text><line x1="145" y1="575" x2="145" y2="825" stroke="#52667a" stroke-width="2"/><text x="125" y="617" font-size="19" text-anchor="end">A</text><rect x="150" y="600" width="300" height="27" rx="3" fill="#316b9b"/><text x="460" y="621" font-size="19">60 mN</text><text x="125" y="702" font-size="19" text-anchor="end">B</text><rect x="150" y="685" width="200" height="27" rx="3" fill="#a76d20"/><text x="360" y="706" font-size="19">40 mN</text><text x="125" y="787" font-size="19" text-anchor="end">media</text><rect x="150" y="770" width="250" height="27" rx="3" fill="#488265"/><text x="410" y="791" font-size="19">50 mN</text><text x="32" y="875" font-size="18">A: I = 2 A, L = 3 cm · B: I = 1 A, L = 4 cm</text><text x="32" y="950" font-size="22">3 · Solo L = 3 cm e B = 1 T</text><line x1="145" y1="1300" x2="520" y2="1300" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1305" x2="150" y2="1040" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1300" x2="430" y2="1120" stroke="#316b9b" stroke-width="2"/><circle cx="150" cy="1300" r="4" fill="#f7fafc" stroke="#316b9b" stroke-width="2"/><circle cx="430" cy="1120" r="4" fill="#316b9b"/><text x="128" y="1325" font-size="18" text-anchor="end">0</text><text x="430" y="1330" font-size="18" text-anchor="middle">2</text><text x="128" y="1126" font-size="18" text-anchor="end">60</text><text x="535" y="1310" font-size="18">I (A)</text><text x="95" y="1025" font-size="18">F (mN)</text><text x="32" y="1380" font-size="18">Tratto mostrato: 0 &lt; I ≤ 2 A.</text><text x="32" y="1420" font-size="18">Barre e grafico hanno scale indipendenti.</text></g></svg>
