<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
<title id="title">Stato del gas, unità SI e volume senza arrotondamenti</title>
<desc id="desc">Recipiente schematico con un cinquantesimo di mole, temperatura assoluta trecento kelvin e pressione assoluta cento kilopascal. Il prodotto nRT è quarantanove virgola ottocentottantaquattro joule; dividendo per centomila pascal e convertendo in litri si ottiene zero virgola quattro nove otto otto quattro litri. A tre cifre significative circa zero virgola quattro nove nove litri.</desc>
<rect width="640" height="1080" rx="22" fill="#faf8f2"/>
<g font-family="system-ui,sans-serif" font-size="22" fill="#16323f">
<text x="28" y="44" font-size="25" font-weight="700">1 · Definisci lo stato del campione</text>
<path d="M82 106V300H244V106" fill="#d6e6df" stroke="#16323f" stroke-width="3"/>
<path d="M80 118H246" stroke="#14647b" stroke-width="8"/>
<text x="107" y="204">Gas ideale</text><text x="132" y="254">V = ?</text>
<text x="282" y="142">n = 1/50 mol</text><text x="282" y="198">T = 300 K assoluti</text>
<text x="282" y="254">p = 100 kPa assoluti</text>
<text x="28" y="364">pV = nRT; recipiente non in scala.</text>
<text x="28" y="432" font-size="25" font-weight="700">2 · Rendi coerenti le unità</text>
<text x="28" y="492">100 kPa = 100000 Pa</text>
<text x="28" y="548">nT = (300/50) mol·K = 6 mol·K</text>
<text x="28" y="604">nRT = 6 × 8,314 J = 49,884 J</text>
<text x="28" y="660">J / Pa = m³</text>
<text x="28" y="730" font-size="25" font-weight="700">3 · Calcola, poi arrotonda se richiesto</text>
<text x="28" y="792">V = (49,884/100000) m³</text>
<text x="28" y="848">V = 0,49884 L nel modello assegnato</text>
<text x="28" y="910">V ≈ 0,499 L a tre cifre significative</text>
<text x="28" y="978" font-size="20">Il segno ≈ indica l’arrotondamento.</text>
<text x="28" y="1030" font-size="20">I dati di p e T sono assoluti, non relativi.</text>
</g></svg>
