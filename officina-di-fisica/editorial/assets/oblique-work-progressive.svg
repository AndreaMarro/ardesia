<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1230" role="img" aria-labelledby="title desc"><title id="title">Proiettare la forza per calcolare il lavoro</title><desc id="desc">Forza due newton inclinata sessanta gradi su uno spostamento verso destra. Il coseno un mezzo è fornito. Freccia forza centosessanta pixel a ottanta pixel per newton, proiezione parallela un newton lunga ottanta pixel alla medesima scala. Spostamento due metri lungo centosessanta pixel a ottanta pixel per metro in un altro pannello. Grafico forza parallela spostamento: altezza un newton e base due metri, area due joule.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="640" height="1230" rx="24" fill="#faf8f2"/><g font-family="system-ui,sans-serif" font-size="20" fill="#16323f">
<text x="28" y="42" font-size="24" font-weight="700">1 · Proietta sulla direzione dello spostamento</text><text x="28" y="90">Dato: cos60° = 1/2.</text><path d="M180 290H340" transform="rotate(-60 180 290)" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><path d="M180 290H260" stroke="#b44b2c" stroke-width="3" marker-end="url(#arrow)"/><path d="M180 320H490" stroke="#9aada6" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="175" fill="#14647b">F = 2 N</text><text x="280" y="280" fill="#b44b2c">F∥ = 1 N</text><text x="212" y="255">60°</text><text x="270" y="355">direzione dello spostamento</text><text x="28" y="405">Forze: 80 px/N per F e per la sua proiezione.</text>
<text x="28" y="485" font-size="24" font-weight="700">2 · Leggi la lunghezza nella sua scala</text><circle cx="180" cy="590" r="6" fill="#14647b"/><path d="M180 590H340" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="635">s = 2 m · spostamento rettilineo</text><text x="28" y="695">Lunghezze: 80 px/m. Non è una scala di forza.</text>
<text x="28" y="785" font-size="24" font-weight="700">3 · Moltiplica la componente per la distanza</text><path d="M100 1080V880M100 1080H410" stroke="#16323f" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="1000" width="160" height="80" fill="#b7d8cf" stroke="#14647b" stroke-width="2"/><text x="36" y="995">1 N</text><text x="75" y="1115">0</text><text x="245" y="1115">2 m</text><text x="115" y="1048">W = 2 J</text><text x="105" y="915">F∥</text><text x="425" y="1086">s</text><text x="28" y="1160">Area = 1 N · 2 m = 2 J.</text><text x="28" y="1200" font-size="18">Asse verticale: 80 px/N. Asse orizzontale: 80 px/m.</text>
</g></svg>
