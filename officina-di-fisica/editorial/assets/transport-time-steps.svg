<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1450" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc">
<title id="title">Portata costante e volume consegnato</title><desc id="desc">A tre litri al secondo si consegnano dodici litri in quattro secondi. Dodici celle simboliche da un litro sono riunite in quattro gruppi da tre. Una portata quattro litri al secondo raggiunge lo stesso volume in tre secondi. Il grafico cumulato termina al volume richiesto.</desc>
<rect width="640" height="1450" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" font-size="22" fill="#172c3b">
<text x="35" y="48" font-size="27" font-weight="bold">1. Tre litri in ogni secondo</text>
<text x="35" y="90">Q = 3 L/s; volume obiettivo V = 12 L</text>
<g fill="#dcecf6" stroke="#155fa0" stroke-width="2"><rect x="70" y="150" width="20" height="40"/><rect x="90" y="150" width="20" height="40"/><rect x="110" y="150" width="20" height="40"/><rect x="180" y="150" width="20" height="40"/><rect x="200" y="150" width="20" height="40"/><rect x="220" y="150" width="20" height="40"/><rect x="290" y="150" width="20" height="40"/><rect x="310" y="150" width="20" height="40"/><rect x="330" y="150" width="20" height="40"/><rect x="400" y="150" width="20" height="40"/><rect x="420" y="150" width="20" height="40"/><rect x="440" y="150" width="20" height="40"/></g>
<text x="60" y="235">0–1 s</text><text x="170" y="235">1–2 s</text><text x="280" y="235">2–3 s</text><text x="390" y="235">3–4 s</text>
<text x="35" y="295">Ogni cella è 1 L: 4 gruppi × 3 L = 12 L.</text>
<text x="35" y="340">Celle simboliche; il flusso è continuo.</text>
<line x1="35" x2="605" y1="375" y2="375" stroke="#b9c4c9"/>
<text x="35" y="425" font-size="27" font-weight="bold">2. Più portata, stessa consegna</text>
<text x="35" y="470">Portate: scala 30 px / (L/s)</text>
<rect x="120" y="510" width="90" height="28" fill="#155fa0"/><text x="280" y="533">3 L/s → t = 4 s</text>
<rect x="120" y="580" width="120" height="28" fill="#a33430"/><text x="280" y="603">4 L/s → t = 3 s</text>
<text x="35" y="670">Le barre misurano Q, non una velocità.</text>
<text x="35" y="715">Il tempo si ricava da t = V/Q.</text>
<line x1="35" x2="605" y1="750" y2="750" stroke="#b9c4c9"/>
<text x="35" y="800" font-size="27" font-weight="bold">3. Leggere quando si raggiungono 12 L</text>
<text x="35" y="845">V cumulato = Q τ; τ è il tempo trascorso.</text>
<g stroke="#172c3b" stroke-width="2" fill="none"><path d="M100 1280V965"/><path d="M100 1280H425"/><path d="M280 1275V1285"/><path d="M340 1275V1285"/><path d="M95 1100H105"/></g>
<path d="M100 1100H340" stroke="#748892" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M100 1280L340 1100" stroke="#155fa0" stroke-width="4"/><path d="M100 1280L280 1100" stroke="#a33430" stroke-width="4"/>
<circle cx="340" cy="1100" r="6" fill="#155fa0"/><circle cx="280" cy="1100" r="6" fill="#a33430"/>
<text x="35" y="940">V cumulato (L)</text><text x="55" y="1108">12</text><text x="160" y="1055">Q = 4 L/s</text><text x="370" y="1110">Q = 3 L/s</text>
<text x="77" y="1320">0</text><text x="273" y="1320">3</text><text x="333" y="1320">4</text><text x="445" y="1288">τ (s)</text>
<text x="35" y="1370">τ: 60 px/s; volume: 15 px/L</text>
<text x="35" y="1410">Entrambe le rette terminano alla consegna.</text>
</g></svg>
