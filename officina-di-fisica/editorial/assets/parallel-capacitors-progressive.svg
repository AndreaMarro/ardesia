<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc"><title id="title">Parallelo, polarità e capacità equivalente</title><desc id="desc">Due condensatori da due e tre microfarad condividono i nodi A e B. Nel caso autonomo con polarità opposte, sei microcoulomb positivi e sei negativi sul futuro nodo A si compensano. Infine capacità equivalenti cinque, otto e tredici mezzi microfarad.</desc><rect width="640" height="1500" rx="16" fill="#f7f9fc"/>
<text x="32" y="44" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">1 · Stessi due nodi, stessa tensione</text>
<text x="32" y="86" font-family="Arial,sans-serif" font-size="21" fill="#182c46">V_A − V_B = 2 V ; simboli schematici.</text>
<path d="M110 195V315M530 195V315" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M110 195H290M310 195H530" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M290 170V220M310 170V220" fill="none" stroke="#182c46" stroke-width="4"/>
<circle cx="110" cy="195" r="4" fill="#182c46"/>
<circle cx="530" cy="195" r="4" fill="#182c46"/>
<path d="M110 315H290M310 315H530" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M290 290V340M310 290V340" fill="none" stroke="#182c46" stroke-width="4"/>
<circle cx="110" cy="315" r="4" fill="#182c46"/>
<circle cx="530" cy="315" r="4" fill="#182c46"/>
<text x="67" y="187" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="548" y="187" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="210" y="150" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₁ = 2 μF ; Q₁ = 4 μC</text>
<text x="210" y="270" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₂ = 3 μF ; Q₂ = 6 μC</text>
<text x="32" y="385" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Q_A = Q₁ + Q₂ = 10 μC</text>
<text x="32" y="425" font-family="Arial,sans-serif" font-size="21" fill="#182c46">S = Q_A / V = 5 μF</text>
<path d="M32 475H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="524" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">2 · Caso separato: polarità opposte</text>
<text x="32" y="565" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C_a = 1 μF, 6 V ; C_b = 2 μF, 3 V</text>
<path d="M180 600V880M180 740H545" fill="none" stroke="#182c46" stroke-width="2"/>
<rect x="240" y="620" width="70" height="120" fill="#b85322"/>
<rect x="420" y="740" width="70" height="120" fill="#185d83"/>
<text x="232" y="604" font-family="Arial,sans-serif" font-size="21" fill="#182c46">+6 μC</text>
<text x="410" y="892" font-family="Arial,sans-serif" font-size="21" fill="#182c46">−6 μC</text>
<text x="146" y="748" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="235" y="780" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C_a</text>
<text x="420" y="716" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C_b</text>
<text x="32" y="943" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Somma sul futuro nodo A: 0 μC.</text>
<text x="32" y="983" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Capacità totale 3 μF ; V_f = 0 V.</text>
<path d="M32 1030H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="1078" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">3 · Somme e media delle uscite</text>
<text x="32" y="1120" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A: (2 + 3) μF ; B: (3 + 5) μF</text>
<path d="M150 1150V1400" fill="none" stroke="#182c46" stroke-width="2"/>
<rect x="150" y="1170" width="200" height="40" fill="#185d83"/>
<text x="32" y="1199" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="368" y="1199" font-family="Arial,sans-serif" font-size="21" fill="#182c46">5 μF</text>
<rect x="150" y="1250" width="320" height="40" fill="#b85322"/>
<text x="32" y="1279" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="488" y="1279" font-family="Arial,sans-serif" font-size="21" fill="#182c46">8 μF</text>
<rect x="150" y="1330" width="260" height="40" fill="#35654e"/>
<text x="32" y="1359" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Media</text>
<text x="428" y="1359" font-family="Arial,sans-serif" font-size="21" fill="#182c46">13/2 μF</text>
<text x="118" y="1420" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="32" y="1462" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Origine e scala comuni entro il pannello.</text>
</svg>
