<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1280" role="img" aria-labelledby="title desc">
<title id="title">Molla verticale: allungamento di equilibrio</title><desc id="desc">Con massa due chilogrammi e campo dieci metri al secondo quadrato il peso è venti newton. Una molla ideale da due newton al metro si allunga di dieci metri alla quiete. La lunghezza naturale illustrativa è due metri. Peso e richiamo opposti ed uguali, non punto di inversione dinamico.</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1280" rx="24" fill="#faf8f2"/>
<g font-family="sans-serif" font-size="20" fill="#183746">
<text x="28" y="42" font-size="24" font-weight="bold">1 · Misura dalla lunghezza naturale</text>
<text x="28" y="88">Lunghezze: 20 px/m. L₀ = 2 m illustrativa.</text>
<path d="M110 120H190M310 120H390" stroke="#183746" stroke-width="4"/>
<path d="M150 120V125L140 130L160 140L140 150L150 155V160" stroke="#81968d" stroke-width="2" fill="none"/>
<path d="M350 120V130L335 140L365 160L335 180L365 200L335 220L365 240L335 260L365 280L335 300L365 320L350 340V360" stroke="#16728a" stroke-width="2" fill="none"/>
<path d="M120 160H490M470 160V360M460 160H480M460 360H480" stroke="#81968d" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
<rect x="325" y="360" width="50" height="40" fill="#d7e8eb" stroke="#183746" stroke-width="2"/>
<text x="495" y="270">ℓ = 10 m</text>
<text x="76" y="205">Indeformata</text><text x="400" y="395">m = 2 kg</text>
<text x="28" y="450">L finale = 12 m; ℓ = 12 − 2 = 10 m.</text>
<text x="28" y="495">Zigzag simbolici. Regime lineare ideale assunto.</text>
<text x="28" y="560" font-size="24" font-weight="bold">2 · La massa è ferma all’equilibrio</text>
<text x="28" y="605">Forze: 5 px/N. g = 10 m/s²; k = 2 N/m.</text>
<circle cx="270" cy="740" r="6"/>
<path d="M270 740V640" stroke="#16728a" stroke-width="3" marker-end="url(#a)"/>
<path d="M270 740V840" stroke="#b84e32" stroke-width="3" marker-end="url(#a)"/>
<text x="325" y="665" fill="#16728a">kℓ = 20 N</text><text x="325" y="825" fill="#b84e32">mg = 20 N</text>
<text x="28" y="890">Verso positivo in discesa: mg − kℓ = 0.</text>
<text x="28" y="955" font-size="24" font-weight="bold">3 · Dividi il peso per la rigidezza</text>
<text x="28" y="1010">ℓ = mg/k = 20 N / (2 N/m) = 10 m</text>
<text x="28" y="1065">Non si cerca la lunghezza totale della molla.</text>
<text x="28" y="1120">Non è un punto di inversione durante una caduta.</text>
<text x="28" y="1175">Si osserva l’equilibrio finale senza altre forze.</text>
<text x="28" y="1235" font-size="18">Scale distinte: lunghezze 20 px/m, forze 5 px/N.</text>
</g></svg>
