<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1220" role="img" aria-labelledby="title desc">
<title id="title">Spostamenti come aree da fermo</title><desc id="desc">Tre grafici velocità-tempo identici in scala: 120 unità SVG per secondo, 60 per metro al secondo. Con accelerazione costante due metri al secondo quadrato la retta passa da zero a quattro metri al secondo in due secondi. L’area totale del triangolo è quattro metri. Nel primo secondo l’area è un metro, nel secondo tre metri.</desc>
<rect width="640" height="1220" rx="18" fill="#faf8f2"/>
<g font-family="system-ui,sans-serif" fill="#142f3b"><text x="28" y="37" font-size="23" font-weight="700">Lo spostamento è un’area</text>
<g font-size="21" font-weight="650"><text x="28" y="79">1 · Da fermo: v cresce come a·t</text><text x="28" y="439">2 · Calcola l’area del triangolo</text><text x="28" y="799">3 · Separa i due secondi</text></g>
<path d="M100 700H340V460Z" fill="#c9e4e8"/><path d="M100 1060H220V940Z" fill="#c9e4e8"/><path d="M220 1060H340V820L220 940Z" fill="#eed7c2"/>
<g stroke="#59696d" stroke-width="2" fill="none"><path d="M100 90V340H400M100 450V700H400M100 810V1060H400"/><path d="M94 100H106M94 220H106M220 334V346M340 334V346M94 460H106M94 580H106M220 694V706M340 694V706M94 820H106M94 940H106M220 1054V1066M340 1054V1066"/></g>
<g font-size="18" text-anchor="middle"><text x="100" y="367">0</text><text x="220" y="367">1</text><text x="340" y="367">2</text><text x="100" y="727">0</text><text x="220" y="727">1</text><text x="340" y="727">2</text><text x="100" y="1087">0</text><text x="220" y="1087">1</text><text x="340" y="1087">2</text></g>
<g font-size="18" text-anchor="end"><text x="83" y="106">4</text><text x="83" y="226">2</text><text x="83" y="346">0</text><text x="83" y="466">4</text><text x="83" y="586">2</text><text x="83" y="706">0</text><text x="83" y="826">4</text><text x="83" y="946">2</text><text x="83" y="1066">0</text></g>
<g font-size="18"><text x="110" y="112">v (m/s)</text><text x="411" y="346">t (s)</text><text x="110" y="472">v (m/s)</text><text x="411" y="706">t (s)</text><text x="110" y="832">v (m/s)</text><text x="411" y="1066">t (s)</text></g>
<g stroke="#12617c" stroke-width="4" fill="none"><path d="M100 340L340 100M100 700L340 460M100 1060L340 820"/></g>
<g stroke="#59696d" stroke-width="2" stroke-dasharray="5 5" fill="none"><path d="M340 460V700M220 940V1060"/></g>
<g fill="#12617c"><circle cx="220" cy="220" r="5"/><circle cx="340" cy="100" r="5"/><circle cx="220" cy="940" r="5"/></g>
<g font-size="19"><text x="365" y="162">a = 2 m/s²</text><text x="365" y="198">v₀ = 0</text><text x="365" y="530">Base: 2 s</text><text x="365" y="564">Altezza: 4 m/s</text><text x="365" y="598">Area: 4 m</text><text x="365" y="890">0 → 1 s: 1 m</text><text x="365" y="928">1 → 2 s: 3 m</text><text x="28" y="1140">Durate uguali, spostamenti diversi:</text><text x="28" y="1175">la velocità continua ad aumentare.</text></g></g></svg>
