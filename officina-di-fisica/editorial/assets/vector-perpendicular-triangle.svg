<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1130" role="img" aria-labelledby="title desc">
<title id="title">Componenti ortogonali, diagonale e cammino</title><desc id="desc">Tre tappe con scala identica. Tre metri verso est e quattro verso nord formano un angolo retto. La diagonale misura cinque metri per Pitagora. Il cammino lungo i due lati misura sette metri, due in più del modulo dello spostamento.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1130" rx="18" fill="#faf8f2"/>
<g font-family="system-ui,sans-serif" fill="#142f3b"><text x="28" y="36" font-size="23" font-weight="700">Dal percorso al modulo</text>
<g font-size="21" font-weight="650"><text x="28" y="76">1 · Costruisci le componenti</text><text x="28" y="414">2 · Collega partenza e arrivo</text><text x="28" y="752">3 · Confronta le lunghezze</text></g>
<g stroke="#12617c" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M88 338H268"/><path d="M268 338V98"/><path d="M88 676H268"/><path d="M268 676V436"/><path d="M88 1014H268"/><path d="M268 1014V774"/></g>
<g stroke="#142f3b" stroke-width="2" fill="none"><path d="M248 338V318H268M248 676V656H268M248 1014V994H268"/></g>
<g stroke="#9b4b20" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M88 676L268 436"/><path d="M88 1014L268 774"/></g>
<g font-size="19"><text x="139" y="366">3 m est</text><text x="284" y="218">4 m nord</text><text x="139" y="704">3 m est</text><text x="284" y="556">4 m nord</text><text x="125" y="534" fill="#9b4b20">5 m</text><text x="139" y="1042">3 m est</text><text x="284" y="894">4 m nord</text><text x="125" y="872" fill="#9b4b20">5 m</text><text x="366" y="140">Cateti:</text><text x="366" y="168">3 m e 4 m</text><text x="366" y="254">Angolo: 90°</text><text x="366" y="476">9 + 16 = 25</text><text x="366" y="508">√25 = 5</text><text x="352" y="806">Cammino: 7 m</text><text x="352" y="838">Modulo: 5 m</text><text x="352" y="870">Eccesso: 2 m</text><text x="28" y="1098">Le tre figure mantengono la stessa scala.</text></g></g></svg>
