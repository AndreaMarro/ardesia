<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1510" viewBox="0 0 640 1510" role="img" aria-labelledby="title desc">
<title id="title">Due raggi, due salti di pressione</title><desc id="desc">Raggi uno e quattro millimetri alla stessa scala. Barre delle sovrapressioni venti e cinque pascal e loro differenza quindici. Una seconda prova con raggi due e cinque dà dieci e quattro pascal, differenza sei.</desc>
<rect width="640" height="1510" rx="20" fill="#f7fbff"/>
<g font-family="system-ui,sans-serif" fill="#142d40" font-size="20">
<text x="35" y="48" font-size="25" font-weight="700">1 · Una sola interfaccia e γ comune</text>
<text x="35" y="90">γ = 10 mN/m · pₑ uguale per entrambe</text>
<circle cx="150" cy="245" r="25" fill="#d7f1fa" stroke="#145d81" stroke-width="3"/>
<circle cx="440" cy="245" r="100" fill="#d7f1fa" stroke="#145d81" stroke-width="3"/>
<path d="M150 245H175" stroke="#145d81" stroke-width="2"/><path d="M440 245H540" stroke="#145d81" stroke-width="2"/>
<text x="95" y="390">r₁ = 1 mm</text><text x="385" y="390">r₂ = 4 mm</text>
<text x="35" y="440">Raggi: 25 px/mm · p₁ &gt; p₂</text>
<text x="35" y="485">Il valore assoluto di pₑ non è assegnato.</text>
<path d="M35 520H605" stroke="#b3cbd9"/>
<text x="35" y="570" font-size="25" font-weight="700">2 · Salti rispetto allo stesso esterno</text>
<text x="35" y="615">Barre da zero: 10 px/Pa</text>
<text x="35" y="690">p₁ − pₑ</text><rect x="160" y="660" width="200" height="35" fill="#145d81"/><text x="380" y="687">20 Pa</text>
<text x="35" y="780">p₂ − pₑ</text><rect x="160" y="750" width="50" height="35" fill="#6eaac5"/><text x="230" y="777">5 Pa</text>
<text x="35" y="870">D</text><rect x="160" y="840" width="150" height="35" fill="#c65919"/><text x="330" y="867">15 Pa</text>
<path d="M160 640V895" stroke="#6e8b9c" stroke-dasharray="6 5"/>
<text x="35" y="940">D = 2γ/r₁ − 2γ/r₂ = (20 − 5) Pa</text>
<path d="M35 980H605" stroke="#b3cbd9"/>
<text x="35" y="1030" font-size="25" font-weight="700">3 · B cambia entrambi i raggi</text>
<text x="35" y="1070">r₁ = 2 mm · r₂ = 5 mm · stessa γ</text>
<text x="35" y="1145">p₁ − pₑ</text><rect x="160" y="1115" width="100" height="35" fill="#145d81"/><text x="280" y="1142">10 Pa</text>
<text x="35" y="1235">p₂ − pₑ</text><rect x="160" y="1205" width="40" height="35" fill="#6eaac5"/><text x="220" y="1232">4 Pa</text>
<text x="35" y="1325">D</text><rect x="160" y="1295" width="60" height="35" fill="#c65919"/><text x="240" y="1322">6 Pa</text>
<path d="M160 1095V1350" stroke="#6e8b9c" stroke-dasharray="6 5"/>
<text x="35" y="1400">Sempre 10 px/Pa · Dᴮ/Dᴬ = 6/15 = 2/5</text>
<text x="35" y="1450">Si sottraggono curvature, non raggi.</text>
</g></svg>
