<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1430" role="img" aria-labelledby="title desc">
<title id="title">Distribuire una forza e leggere una densità</title><desc id="desc">Tre pannelli distinti: forza normale 45 newton su 0,015 metri quadrati; stessa forza su aree nel rapporto uno a tre e pressioni 18 e 6 kilopascal; retta massa volume con densità d’esempio un grammo per millilitro.</desc>
<rect width="640" height="1430" fill="#faf7ef"/><g font-family="Arial,sans-serif" fill="#252438" font-size="22">
<text x="32" y="48" font-size="27" font-weight="bold">Forza, area e densità</text><text x="32" y="92">1. Una forza normale distribuita</text>
<rect x="155" y="275" width="330" height="72" fill="#dcd7f3" stroke="#41366b" stroke-width="3"/>
<path d="M320 160V260" stroke="#5b36b1" stroke-width="6"/><path d="m308 242 12 18 12-18" fill="none" stroke="#5b36b1" stroke-width="6"/>
<text x="355" y="213">F = 45 N</text><text x="190" y="321">A = 0,015 m²</text><text x="160" y="398">p = (45 N) / (0,015 m²)</text><text x="190" y="440">p = 3000 Pa = 3 kPa</text>
<path d="M32 480H608" stroke="#b3abbf"/><text x="32" y="525">2. La stessa forza, area tripla</text>
<path d="M140 570V650" stroke="#5b36b1" stroke-width="5"/><path d="m130 634 10 16 10-16" fill="none" stroke="#5b36b1" stroke-width="5"/>
<path d="M420 570V650" stroke="#5b36b1" stroke-width="5"/><path d="m410 634 10 16 10-16" fill="none" stroke="#5b36b1" stroke-width="5"/>
<text x="168" y="615">F</text><text x="448" y="615">F</text>
<rect x="100" y="675" width="80" height="70" fill="#dcd7f3" stroke="#41366b" stroke-width="3"/><rect x="300" y="675" width="240" height="70" fill="#d9eddf" stroke="#246d54" stroke-width="3"/>
<text x="105" y="790">4 cm²</text><text x="385" y="790">12 cm²</text><text x="85" y="840">18 kPa</text><text x="380" y="840">6 kPa</text><text x="115" y="895">p₁A₁ = p₂A₂ : forza uguale</text>
<path d="M32 940H608" stroke="#b3abbf"/><text x="32" y="985">3. Un esempio: ρ = 1 g/mL</text>
<path d="M120 1290H560M120 1290V1040" stroke="#252438" stroke-width="3" fill="none"/><path d="M120 1290 480 1090" stroke="#246d54" stroke-width="5"/>
<path d="M300 1290V1190H120M480 1290V1090H120" stroke="#978eab" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
<text x="45" y="1030">m (g)</text><text x="86" y="1320">0</text><text x="70" y="1198">20</text><text x="70" y="1098">40</text><text x="285" y="1320">20</text><text x="465" y="1320">40</text><text x="460" y="1365">V (mL)</text><text x="135" y="1400">Pendenza = Δm / ΔV = ρ</text>
</g></svg>