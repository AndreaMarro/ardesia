<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc">
 <title id="title">Dal lancio al primo ritorno: quota e componente verticale</title>
 <desc id="desc">Campo g di due metri al secondo quadrato, lancio a due metri al secondo. Origine al lancio. Quota massima un metro a un secondo, ritorno a due secondi. La componente verticale va da più due a meno due metri al secondo; aree positiva e negativa di un metro si compensano.</desc>
 <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#334155"/></marker></defs>
 <rect width="600" height="1000" fill="#fff"/>
 <g font-family="Arial,sans-serif" font-size="17" fill="#172033" stroke-linecap="round">
  <text x="28" y="35" font-size="22" font-weight="bold">1 · Fissa origine e verso</text>
  <path d="M110 222V70" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="76" y="66">+y</text>
  <path d="M140 210H480M140 90H480" stroke="#94a3b8" stroke-dasharray="5 5"/>
  <circle cx="180" cy="210" r="6" fill="#245ca4"/><circle cx="180" cy="90" r="6" fill="#245ca4"/>
  <path d="M190 200V100" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M220 100V200" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="83">apice: t = 1 s, y = 1 m</text>
  <text x="150" y="242">y = 0 · lancio t = 0 · ritorno t = 2 s</text>
  <text x="250" y="142">v₀ = +2 m/s</text><text x="250" y="174">aᵧ = −2 m/s² sempre</text>
  <text x="28" y="300" font-size="22" font-weight="bold">2 · Cerca lo zero futuro della quota</text>
  <text x="28" y="332">Scale: 120 px/s; 120 px/m · y = 2t − t² (SI)</text>
  <path d="M100 540V365M85 520H415" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="48" y="373">y (m)</text><text x="426" y="526">t (s)</text>
  <path d="M100 400H340M220 400V520M340 400V520" stroke="#94a3b8" stroke-dasharray="4 5"/>
  <path d="M100 520Q220 280 340 520" fill="none" stroke="#245ca4" stroke-width="3"/>
  <g fill="#245ca4"><circle cx="100" cy="520" r="5"/><circle cx="220" cy="400" r="5"/><circle cx="340" cy="520" r="5"/></g>
  <text x="69" y="406">1</text><text x="69" y="526">0</text>
  <text x="95" y="565">0</text><text x="215" y="565">1</text><text x="335" y="565">2</text>
  <text x="365" y="470">T = 2 s</text>
  <text x="28" y="625" font-size="22" font-weight="bold">3 · Leggi le aree con il segno</text>
  <text x="28" y="657">Scale: 120 px/s; 50 px/(m/s) · vᵧ = 2 − 2t (SI)</text>
  <path d="M100 820V720L220 820Z" fill="#dbeafe"/><path d="M220 820H340V920Z" fill="#fce7df"/>
  <path d="M100 940V692M85 820H415" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M100 720L340 920" fill="none" stroke="#245ca4" stroke-width="3"/>
  <path d="M95 720H105M95 920H105M220 815V825M340 815V825" stroke="#334155"/>
  <text x="24" y="695">vᵧ (m/s)</text><text x="426" y="826">t (s)</text>
  <text x="49" y="726">+2</text><text x="64" y="826">0</text><text x="49" y="926">−2</text>
  <text x="94" y="853">0</text><text x="215" y="853">1</text><text x="335" y="853">2</text>
  <text x="115" y="800">+1 m</text><text x="277" y="850">−1 m</text>
  <text x="100" y="975">Δy = 0; distanza percorsa = 1 m + 1 m = 2 m</text>
 </g>
</svg>
