<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1510" viewBox="0 0 640 1510" role="img" aria-labelledby="title desc"><title id="title">Recipienti rigidi prima e dopo il collegamento</title><desc id="desc">Due volumi uguali a temperatura comune contengono inizialmente quattro e otto unità normalizzate di gas. Dopo il collegamento ciascuno ne contiene sei. Il totale dodici è conservato e il confine esterno resta rigido.</desc><rect width="640" height="1510" rx="24" fill="#f5faff"/><g font-family="Arial,sans-serif" font-size="20" fill="#163047"><text x="35" y="50" font-size="26" font-weight="bold">1 · Prima: stesso V, stessa T</text><text x="35" y="105" font-size="20">Ogni punto vale la stessa quantità n₀.</text><text x="35" y="145" font-size="20">Rappresentazione proporzionale, non in scala.</text><rect x="55" y="205" width="200" height="170" fill="white" stroke="#163047" stroke-width="3"/><circle cx="90" cy="255" r="11" fill="#196082"/><circle cx="133" cy="255" r="11" fill="#196082"/><circle cx="176" cy="255" r="11" fill="#196082"/><circle cx="219" cy="255" r="11" fill="#196082"/><rect x="385" y="205" width="200" height="170" fill="white" stroke="#163047" stroke-width="3"/><circle cx="420" cy="255" r="11" fill="#bc5315"/><circle cx="463" cy="255" r="11" fill="#bc5315"/><circle cx="506" cy="255" r="11" fill="#bc5315"/><circle cx="549" cy="255" r="11" fill="#bc5315"/><circle cx="420" cy="320" r="11" fill="#bc5315"/><circle cx="463" cy="320" r="11" fill="#bc5315"/><circle cx="506" cy="320" r="11" fill="#bc5315"/><circle cx="549" cy="320" r="11" fill="#bc5315"/><path d="M255 290H385" stroke="#163047" stroke-width="8"/><path d="M310 265V315M330 265V315" stroke="#a53338" stroke-width="6"/><text x="60" y="420" font-size="20">n₁ = 4 n₀ · p₁ = 100 kPa</text><text x="370" y="460" font-size="20">n₂ = 8 n₀ · p₂ = 200 kPa</text><text x="35" y="515" font-size="20">Totale: n = 12 n₀ · volume esterno 2V</text><path d="M35 550H605" stroke="#b5cbd9"/><text x="35" y="610" font-size="26" font-weight="bold">2 · Dopo: pressione e T comuni</text><rect x="55" y="680" width="200" height="170" fill="white" stroke="#163047" stroke-width="3"/><circle cx="90" cy="730" r="11" fill="#196082"/><circle cx="133" cy="730" r="11" fill="#196082"/><circle cx="176" cy="730" r="11" fill="#196082"/><circle cx="219" cy="730" r="11" fill="#196082"/><circle cx="90" cy="795" r="11" fill="#196082"/><circle cx="133" cy="795" r="11" fill="#196082"/><rect x="385" y="680" width="200" height="170" fill="white" stroke="#163047" stroke-width="3"/><circle cx="420" cy="730" r="11" fill="#196082"/><circle cx="463" cy="730" r="11" fill="#196082"/><circle cx="506" cy="730" r="11" fill="#196082"/><circle cx="549" cy="730" r="11" fill="#196082"/><circle cx="420" cy="795" r="11" fill="#196082"/><circle cx="463" cy="795" r="11" fill="#196082"/><path d="M255 765H385" stroke="#163047" stroke-width="8"/><text x="60" y="895" font-size="20">n₁,f = 6 n₀</text><text x="390" y="895" font-size="20">n₂,f = 6 n₀</text><text x="35" y="950" font-size="20">p_f = (100 + 200)/2 kPa = 150 kPa</text><text x="35" y="1000" font-size="20">In ogni recipiente: 6/12 = 1/2 del totale</text><path d="M35 1040H605" stroke="#b5cbd9"/><text x="35" y="1100" font-size="26" font-weight="bold">3 · Un bilancio, non un pistone</text><text x="35" y="1160" font-size="20">n totale conservato · T mantenuta</text><text x="35" y="1220" font-size="20">p_f (2V) = (p₁ + p₂) V</text><text x="35" y="1280" font-size="20">Confine esterno fisso → W esterno = 0</text><text x="35" y="1340" font-size="20">Nessun lavoro reversibile nRT ln 2 dedotto</text><text x="35" y="1400" font-size="20">Le pressioni iniziali possono anche coincidere.</text><text x="35" y="1460" font-size="20">L’inversa positiva richiede 2p_f &gt; p₂.</text></g></svg>
