<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1390" role="img" aria-labelledby="title desc"><title id="title">Impulso: area forza tempo</title><desc id="desc">Forza costante positiva due newton per due secondi: impulso quattro newton secondo. Due pulsazioni distinte, sei newton per due secondi e quattro newton per tre secondi, hanno entrambe impulso dodici newton secondo. L’impulso della risultante dà la variazione della quantità di moto, non automaticamente la quantità di moto finale.</desc><rect width="640" height="1390" rx="24" fill="#faf8f2"/><g font-family="sans-serif" font-size="20" fill="#183746">
<text x="28" y="42" font-size="24" font-weight="bold">1 · Una risultante costante dà un rettangolo</text><text x="28" y="88">Asse positivo nel verso della forza. F_x = +2 N.</text>
<path d="M100 410V180M75 380H410" stroke="#81968d" stroke-width="2" fill="none"/><rect x="100" y="300" width="160" height="80" fill="#cfe4e5" stroke="#16728a" stroke-width="2"/><text x="28" y="175">F_x (N)</text><text x="430" y="387">t (s)</text><text x="65" y="307">2</text><text x="65" y="387">0</text><text x="94" y="435">0</text><text x="254" y="435">2</text><text x="115" y="347">J_x = +4 N·s</text>
<text x="28" y="495">Tempo: 80 px/s. Forza: 40 px/N.</text><text x="28" y="545">Area = (2 N)(2 s) = 4 N·s.</text>
<text x="28" y="625" font-size="24" font-weight="bold">2 · Stesso impulso non significa stessa forza</text><text x="28" y="680">Due prove, stessa scala: 60 px/s e 20 px/N.</text>
<path d="M80 1000V760M60 970H240M350 1000V760M330 970H560" stroke="#81968d" stroke-width="2" fill="none"/>
<rect x="80" y="850" width="120" height="120" fill="#cfe4e5" stroke="#16728a" stroke-width="2"/><rect x="350" y="890" width="180" height="80" fill="#cfe4e5" stroke="#16728a" stroke-width="2"/>
<text x="30" y="845">6 N</text><text x="295" y="885">4 N</text><text x="92" y="1025">2 s</text><text x="403" y="1025">3 s</text><text x="88" y="920">12 N·s</text><text x="400" y="940">12 N·s</text>
<text x="28" y="1085">6 · 2 = 4 · 3 = 12 N·s.</text>
<text x="28" y="1160" font-size="24" font-weight="bold">3 · Leggi ciò che cambia nel corpo</text><text x="28" y="1220">J_x = Δp_x: impulso della risultante.</text><text x="28" y="1270">Per p_finale occorre anche p_iniziale.</text><text x="28" y="1320">N·s = kg·m/s. Non è l’unità joule dell’energia.</text><text x="28" y="1365" font-size="18">I due grafici usano scale dichiarate diverse fra i pannelli.</text></g></svg>
