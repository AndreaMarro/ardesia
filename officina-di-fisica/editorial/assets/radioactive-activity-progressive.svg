<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc"><title id="title">Dai genitori presenti all’attività</title><desc id="desc">Tre tappe: venti nuclei distinti dal tasso di attività; alcuni conteggi interi e corrispondenti attività a emivita due secondi nel modello numerico assegnato; media di sette e sette decimi becquerel.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1600" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Dai genitori presenti all’attività</text><text x="32" y="96" font-size="22" text-anchor="start">1 · Conteggio presente e tasso medio</text><text x="32" y="145" font-size="18" text-anchor="start">N = 20 nuclei · T = 2 s</text><text x="32" y="190" font-size="18" text-anchor="start">Legge fisica: 𝒜 = (ln 2) N/T</text><circle cx="170" cy="245" r="8" fill="#316b9b"/><circle cx="215" cy="245" r="8" fill="#316b9b"/><circle cx="260" cy="245" r="8" fill="#316b9b"/><circle cx="305" cy="245" r="8" fill="#316b9b"/><circle cx="350" cy="245" r="8" fill="#316b9b"/><circle cx="170" cy="281" r="8" fill="#316b9b"/><circle cx="215" cy="281" r="8" fill="#316b9b"/><circle cx="260" cy="281" r="8" fill="#316b9b"/><circle cx="305" cy="281" r="8" fill="#316b9b"/><circle cx="350" cy="281" r="8" fill="#316b9b"/><circle cx="170" cy="317" r="8" fill="#316b9b"/><circle cx="215" cy="317" r="8" fill="#316b9b"/><circle cx="260" cy="317" r="8" fill="#316b9b"/><circle cx="305" cy="317" r="8" fill="#316b9b"/><circle cx="350" cy="317" r="8" fill="#316b9b"/><circle cx="170" cy="353" r="8" fill="#316b9b"/><circle cx="215" cy="353" r="8" fill="#316b9b"/><circle cx="260" cy="353" r="8" fill="#316b9b"/><circle cx="305" cy="353" r="8" fill="#316b9b"/><circle cx="350" cy="353" r="8" fill="#316b9b"/><text x="32" y="420" font-size="18" text-anchor="start">Modello numerico: η = 7/10, 𝒜ₘ = 7 Bq</text><text x="32" y="460" font-size="18" text-anchor="start">Il coefficiente assegnato approssima ln 2.</text><text x="32" y="530" font-size="22" text-anchor="start">2 · Solo alcuni N interi, a T = 2 s</text><line x1="145" y1="1000" x2="550" y2="1000" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1005" x2="150" y2="630" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="610" font-size="18" text-anchor="start">𝒜ₘ (Bq)</text><text x="460" y="1070" font-size="18" text-anchor="start">N (nuclei)</text><circle cx="190" cy="965" r="5" fill="#316b9b"/><circle cx="230" cy="930" r="5" fill="#316b9b"/><circle cx="270" cy="895" r="5" fill="#316b9b"/><circle cx="310" cy="860" r="5" fill="#316b9b"/><circle cx="350" cy="825" r="5" fill="#316b9b"/><circle cx="390" cy="790" r="5" fill="#316b9b"/><circle cx="430" cy="755" r="5" fill="#316b9b"/><circle cx="470" cy="720" r="5" fill="#316b9b"/><line x1="310" y1="994" x2="310" y2="1006" stroke="#52667a" stroke-width="2"/><text x="310" y="1040" font-size="18" text-anchor="middle">20</text><line x1="144" y1="860" x2="156" y2="860" stroke="#52667a" stroke-width="2"/><text x="130" y="866" font-size="18" text-anchor="end">7</text><line x1="470" y1="994" x2="470" y2="1006" stroke="#52667a" stroke-width="2"/><text x="470" y="1040" font-size="18" text-anchor="middle">40</text><line x1="144" y1="720" x2="156" y2="720" stroke="#52667a" stroke-width="2"/><text x="130" y="726" font-size="18" text-anchor="end">14</text><circle cx="150" cy="1000" r="4" fill="none" stroke="#316b9b" stroke-width="2"/><text x="130" y="1040" font-size="18" text-anchor="end">0</text><text x="32" y="1130" font-size="22" text-anchor="start">3 · Due preparazioni e la media dei tassi</text><text x="32" y="1170" font-size="18" text-anchor="start">A: N = 20, T = 2 s · B: N = 1, T = 1 s</text><text x="128" y="1243" font-size="18" text-anchor="end">A</text><rect x="150" y="1220" width="280" height="30" fill="#316b9b"/><text x="442" y="1243" font-size="18" text-anchor="start">7 Bq</text><text x="128" y="1343" font-size="18" text-anchor="end">B</text><rect x="150" y="1320" width="28" height="30" fill="#316b9b"/><text x="190" y="1343" font-size="18" text-anchor="start">7/10 Bq</text><text x="128" y="1443" font-size="18" text-anchor="end">Media</text><rect x="150" y="1420" width="154" height="30" fill="#316b9b"/><text x="316" y="1443" font-size="18" text-anchor="start">77/20 Bq</text><text x="32" y="1515" font-size="18" text-anchor="start">Le tre attività hanno origine e scala comuni.</text><text x="32" y="1560" font-size="18" text-anchor="start">Un valore medio in Bq non è un conteggio intero.</text></g></svg>
