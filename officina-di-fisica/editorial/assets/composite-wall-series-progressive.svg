<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1320" role="img" aria-labelledby="title desc">
<title id="title">Stessa potenza attraverso due strati in serie</title>
<desc id="desc">Uno strato spesso un metro con conducibilità uno e uno spesso due metri con conducibilità due hanno uguale resistenza. Il salto totale di sessanta kelvin dà trenta watt. Il profilo scende di trenta kelvin in ciascuno strato. Le barre confrontano trenta e quindici watt e la media ventidue e mezzo.</desc>
<defs><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1320" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Due strati, una sola potenza</text>
<text x="32" y="85" font-size="18">A = 1 m² ; k₁ = 1 e k₂ = 2 W/(m·K)</text>
<text x="265" y="130">P = 30 W</text>
<rect x="130" y="155" width="120" height="120" fill="#fce6dc" stroke="#14243a" stroke-width="2"/><rect x="250" y="155" width="240" height="120" fill="#e4f3fa" stroke="#14243a" stroke-width="2"/>
<path d="M110 213H527" stroke="#b45328" stroke-width="4" marker-end="url(#heat)"/>
<text x="39" y="183">Caldo</text><text x="520" y="183">Freddo</text>
<text x="148" y="313">L₁ = 1 m</text><text x="322" y="313">L₂ = 2 m</text>
<text x="32" y="360" font-size="18">R₁ = 1 K/W ; R₂ = 1 K/W ; ΔT = 60 K.</text>
<text x="32" y="394" font-size="18">Lato della faccia: 1 m. Contatto ideale fra gli strati.</text>
<text x="32" y="428" font-size="18">Nessuna potenza si accumula all’interfaccia.</text>
<path d="M32 458H608" stroke="#9babbc"/>
<text x="32" y="502" font-size="25" font-weight="bold">2 · Stessa caduta in spessori diversi</text>
<text x="32" y="541" font-size="18">Eccesso termico Θ(x) = T(x) − T_c, in K</text>
<path d="M100 785V575M100 785H520" fill="none" stroke="#14243a" stroke-width="2"/>
<path d="M100 585L220 685" fill="none" stroke="#b45328" stroke-width="4"/><path d="M220 685L460 785" fill="none" stroke="#165a87" stroke-width="4"/>
<path d="M100 685H220V785" fill="none" stroke="#8292a2" stroke-dasharray="5 5"/>
<g fill="#14243a"><circle cx="100" cy="585" r="5"/><circle cx="220" cy="685" r="5"/><circle cx="460" cy="785" r="5"/></g>
<text x="59" y="592">60</text><text x="59" y="692">30</text><text x="65" y="792">0</text><text x="82" y="819">0</text><text x="211" y="819">1</text><text x="451" y="819">3</text><text x="531" y="791">x / m</text>
<text x="32" y="860" font-size="18">La temperatura è continua nel contatto perfetto.</text>
<path d="M32 890H608" stroke="#9babbc"/>
<text x="32" y="934" font-size="25" font-weight="bold">3 · Media di due prove complete</text>
<path d="M130 957V1211" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="980" width="240" height="34" fill="#165a87"/><rect x="130" y="1056" width="120" height="34" fill="#165a87"/><rect x="130" y="1132" width="180" height="34" fill="#28664d"/>
<text x="50" y="1005">A</text><text x="389" y="1005">30 W</text><text x="50" y="1081">B</text><text x="269" y="1081">15 W</text><text x="32" y="1157">Media</text><text x="329" y="1157">45/2 W</text>
<text x="32" y="1254" font-size="18">In B entrambi gli spessori sono doppi rispetto ad A.</text>
<text x="32" y="1285" font-size="18">Potenze in W, origine comune per le tre barre.</text>
</g></svg>
