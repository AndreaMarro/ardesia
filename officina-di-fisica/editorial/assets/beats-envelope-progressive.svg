<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1670" viewBox="0 0 640 1670" role="img" aria-labelledby="title desc"><title id="title">Massimi lenti e Doppler distinto</title><desc id="desc">La fase relativa torna concorde ogni mezzo secondo per frequenze 302 e300 hertz. Inviluppo di modulo due volte A con tre massimi da zero a un secondo. Schema separato dei fronti davanti e dietro una sorgente in moto subsonico.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#145d81"/></marker></defs><rect width="640" height="1670" rx="20" fill="#f7fbff"/><g font-family="system-ui,sans-serif" font-size="20" fill="#142d40">
<text x="35" y="48" font-size="25" font-weight="700">1 · Due fasi stabili, non uguali sempre</text><text x="35" y="90">f₁ = 302 Hz · f₂ = 300 Hz · differenza 2 Hz</text><text x="35" y="135">Δφ(t) = 4π t/(1 s)</text>
<text x="35" y="195">t = 0 s</text><text x="250" y="195">Δφ = 0 · concordi</text>
<path d="M100 240H160" stroke="#145d81" stroke-width="4" marker-end="url(#a)"/><path d="M100 280H160" stroke="#c65919" stroke-width="4" marker-end="url(#a)"/>
<text x="35" y="340">t = 1/4 s</text><text x="250" y="340">Δφ = π · opposti</text>
<path d="M160 385H100" stroke="#145d81" stroke-width="4" marker-end="url(#a)"/><path d="M100 425H160" stroke="#c65919" stroke-width="4" marker-end="url(#a)"/>
<text x="35" y="485">t = 1/2 s</text><text x="250" y="485">Δφ = 2π · concordi</text>
<path d="M100 530H160" stroke="#145d81" stroke-width="4" marker-end="url(#a)"/><path d="M100 570H160" stroke="#c65919" stroke-width="4" marker-end="url(#a)"/>
<text x="35" y="625">Frecce schematiche: segni dei contributi,</text><text x="35" y="660">righe separate nello stesso punto.</text><path d="M35 690H605" stroke="#b3cbd9"/>
<text x="35" y="735" font-size="25" font-weight="700">2 · Solo il modulo dell’inviluppo</text><text x="35" y="775">E/A = 2|cos[2πt/(1 s)]|, non la portante rapida</text><text x="35" y="815">400 px/s · 60 px per unità di E/A</text>
<path d="M80 950H555" stroke="#142d40" marker-end="url(#a)"/><path d="M100 980V820" stroke="#142d40" marker-end="url(#a)"/><text x="565" y="957">t</text><text x="45" y="842">2</text><text x="50" y="960">0</text>
