<text x="35" y="1475">Dietro: (c + v)/f₀ · davanti: (c − v)/f₀</text><text x="35" y="1520">Schema dei fronti, senza scala metrica.</text><text x="35" y="1565">c è la velocità nel mezzo · 0 &lt; v &lt; c</text><text x="35" y="1625">Non si usa f_b per invertire il Doppler.</text></g></svg>
