<text x="35" y="1155" font-size="25" font-weight="700">3 · Il Doppler è un caso separato</text><text x="35" y="1195">Sorgente verso destra · osservatore fermo</text>
<path d="M115 1260V1420M235 1260V1420M435 1260V1420M515 1260V1420M595 1260V1420" stroke="#6e8b9c" stroke-width="3"/>
