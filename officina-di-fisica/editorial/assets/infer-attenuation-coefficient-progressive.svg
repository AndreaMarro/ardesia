<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Inferire il coefficiente e separare un fondo</title><desc id="desc">Quattro dimezzamenti, coefficienti mediati e un esperimento autonomo con fondo costante.</desc><rect x="0" y="0" width="640" height="1600" fill="#fff"/><text x="35" y="48" font-size="25" fill="#203247" text-anchor="start">Dal fascio al coefficiente</text><text x="35" y="103" font-size="22" fill="#203247" text-anchor="start">1 · Un centimetro, quattro dimezzamenti</text><text x="130" y="171" font-size="18" fill="#203247" text-anchor="end">0 cm</text><rect x="150" y="150" width="320" height="25" fill="#3d7791"/><text x="480" y="171" font-size="18" fill="#203247" text-anchor="start">64 mW/m²</text><text x="130" y="231" font-size="18" fill="#203247" text-anchor="end">1/4 cm</text><rect x="150" y="210" width="160" height="25" fill="#3d7791"/><text x="320" y="231" font-size="18" fill="#203247" text-anchor="start">32 mW/m²</text><text x="130" y="291" font-size="18" fill="#203247" text-anchor="end">1/2 cm</text><rect x="150" y="270" width="80" height="25" fill="#3d7791"/><text x="240" y="291" font-size="18" fill="#203247" text-anchor="start">16 mW/m²</text><text x="130" y="351" font-size="18" fill="#203247" text-anchor="end">3/4 cm</text><rect x="150" y="330" width="40" height="25" fill="#3d7791"/><text x="200" y="351" font-size="18" fill="#203247" text-anchor="start">8 mW/m²</text><text x="130" y="411" font-size="18" fill="#203247" text-anchor="end">1 cm</text><rect x="150" y="390" width="20" height="25" fill="#3d7791"/><text x="180" y="411" font-size="18" fill="#203247" text-anchor="start">4 mW/m²</text><text x="35" y="485" font-size="19" fill="#203247" text-anchor="start">a = 4 cm⁻¹ · μ = (4 ln 2) cm⁻¹</text><text x="35" y="555" font-size="22" fill="#203247" text-anchor="start">2 · Coefficienti di due prove distinte</text><text x="130" y="641" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="150" y="620" width="320" height="28" fill="#3d7791"/><text x="480" y="642" font-size="18" fill="#203247" text-anchor="start">4 cm⁻¹</text><text x="130" y="721" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="150" y="700" width="80" height="28" fill="#986c35"/><text x="240" y="722" font-size="18" fill="#203247" text-anchor="start">1 cm⁻¹</text><text x="130" y="801" font-size="18" fill="#203247" text-anchor="end">media</text><rect x="150" y="780" width="200" height="28" fill="#637e55"/><text x="360" y="802" font-size="18" fill="#203247" text-anchor="start">(5/2) cm⁻¹</text><text x="35" y="885" font-size="19" fill="#203247" text-anchor="start">A: I = 4 mW/m², d = 1 cm</text><text x="35" y="920" font-size="19" fill="#203247" text-anchor="start">B: I = 16 mW/m², d = 2 cm</text><text x="35" y="990" font-size="22" fill="#203247" text-anchor="start">3 · Caso autonomo: un fondo additivo</text><text x="35" y="1030" font-size="19" fill="#203247" text-anchor="start">S(d) = A exp(−μd) + B</text><text x="35" y="1070" font-size="19" fill="#203247" text-anchor="start">A = 32 · B = 8 · stessa unità del segnale</text><text x="130" y="1184" font-size="18" fill="#203247" text-anchor="end">1 cm</text><rect x="150" y="1160" width="240" height="35" fill="#3d7791"/><rect x="150" y="1160" width="80" height="35" fill="#b8bfc6"/><text x="400" y="1187" font-size="19" fill="#203247" text-anchor="start">24</text><text x="130" y="1284" font-size="18" fill="#203247" text-anchor="end">2 cm</text><rect x="150" y="1260" width="160" height="35" fill="#3d7791"/><rect x="150" y="1260" width="80" height="35" fill="#b8bfc6"/><text x="320" y="1287" font-size="19" fill="#203247" text-anchor="start">16</text><text x="130" y="1384" font-size="18" fill="#203247" text-anchor="end">3 cm</text><rect x="150" y="1360" width="120" height="35" fill="#3d7791"/><rect x="150" y="1360" width="80" height="35" fill="#b8bfc6"/><text x="280" y="1387" font-size="19" fill="#203247" text-anchor="start">12</text><text x="35" y="1460" font-size="19" fill="#203247" text-anchor="start">Differenze: 24 − 16 = 8; 16 − 12 = 4</text><text x="35" y="1500" font-size="19" fill="#203247" text-anchor="start">Rapporto delle differenze: 4/8 = 1/2</text><text x="35" y="1540" font-size="19" fill="#203247" text-anchor="start">Il grigio indica il fondo comune B = 8.</text></svg>
