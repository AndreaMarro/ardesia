<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1240" role="img" aria-labelledby="title desc"><title id="title">Momento:braccio,modulo e verso</title><desc id="desc">Primo esempio:braccio due metri lungo duecento pixel,cento pixel per metro;forza perpendicolare due newton lunga quaranta pixel,venti pixel per newton. Punto a destra del fulcro e forza verso l’alto danno momento antiorario positivo quattro newton metro. Caso finale distinto:forza otto newton lunga centosessanta pixel alla stessa scala,con retta d’azione passante per il fulcro,braccio perpendicolare zero e momento zero.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="640" height="1240" rx="24" fill="#faf8f2"/><g font-family="system-ui,sans-serif" font-size="20" fill="#16323f">
<text x="28" y="42" font-size="24" font-weight="700">1 · Perpendicolare: la distanza è il braccio</text><text x="28" y="90">Distanze: 100 px/m. Forze: 20 px/N.</text><path d="M160 300H360" stroke="#81968d" stroke-width="5"/><circle cx="160" cy="300" r="7" fill="#16323f"/><circle cx="360" cy="300" r="4" fill="#16323f"/><path d="M360 300V260" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><path d="M340 300V280H360" stroke="#14647b" stroke-width="1.5" fill="none"/><text x="400" y="276">F = 2 N</text><text x="135" y="340">O</text><path d="M160 365H360M160 355V375M360 355V375" stroke="#81968d" stroke-width="2"/><text x="230" y="410">r = 2 m</text>
<text x="28" y="490" font-size="24" font-weight="700">2 · Scegli il segno dopo la geometria</text><text x="28" y="545">In questo esempio: antiorario positivo.</text><path d="M210 650A50 50 0 0 0 160 600" stroke="#b44b2c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="260" y="630">M_z = +4 N·m</text><text x="260" y="675">Modulo M = 4 N·m</text><text x="28" y="745">M = F r. Non è un lavoro già compiuto.</text>
<text x="28" y="830" font-size="24" font-weight="700">3 · Caso separato: retta attraverso O</text><text x="28" y="880">La forza resta non nulla: F = 8 N.</text><path d="M100 1000H570" stroke="#b7c7bf" stroke-width="2" stroke-dasharray="4 4"/><circle cx="160" cy="1000" r="7" fill="#16323f"/><circle cx="360" cy="1000" r="5" fill="#16323f"/><path d="M360 1000H520" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><text x="148" y="1045">O</text><text x="330" y="1075">punto di applicazione</text><text x="28" y="1130">Braccio perpendicolare b = 0: M = F b = 0.</text><text x="28" y="1175">La retta d’azione contiene il fulcro.</text><text x="28" y="1215" font-size="18">Forze: stessa scala 20 px/N in entrambi gli esempi.</text>
</g></svg>
