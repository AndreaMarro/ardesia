<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1450" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc"><title id="title">Venturi: pressione statica e contributo cinetico si compensano</title><desc id="desc">Canale rettangolare di profondità un centimetro e altezze quattro e due centimetri: rapporto di aree due. Geometria cinquanta pixel per centimetro, velocità quaranta pixel per metro al secondo. Frecce ottanta e centosessanta pixel. Pressioni statiche centosei e cento kilopascal, contributi cinetici due e otto. Due barre complessive di centootto kilopascal alla scala quattro pixel per kilopascal.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1450" rx="20" fill="#faf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Continuità nel condotto orizzontale</text><text x="28" y="90">Profondità fuori foglio1cm, profili uniformi.</text><path d="M60 200H220L340 250H560V350H340L220 400H60Z" fill="#bad9e5"/><path d="M60 200H220L340 250H560M60 400H220L340 350H560" fill="none" stroke="#597f83" stroke-width="3"/><path d="M100 300H180" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M370 300H530" stroke="#b46145" stroke-width="3" marker-end="url(#a)"/><text x="70" y="160">A₁ = 4cm²</text><text x="375" y="205">A₂ = 2cm²</text><text x="70" y="450">v₁ = 2m/s</text><text x="375" y="450">v₂ = 4m/s</text><text x="28" y="505">Geometria50px/cm; velocità40px/(m/s).</text><text x="28" y="550">r = A₁/A₂ = 2; p₁ = 106kPa, p₂ = 100kPa assoluti.</text><text x="28" y="635" font-size="25">2 · La somma energetica resta108kPa</text><rect x="100" y="710" width="424" height="42" fill="#a8b8aa"/><rect x="524" y="710" width="8" height="42" fill="#e7c994"/><rect x="100" y="830" width="400" height="42" fill="#a8b8aa"/><rect x="500" y="830" width="32" height="42" fill="#e7c994"/><text x="100" y="790">Larga:106 statici + 2 cinetici</text><text x="100" y="910">Stretta:100 statici + 8 cinetici</text><text x="28" y="975">Barre:4px/kPa; entrambi i totali432px.</text><text x="28" y="1020">Verde:pressione statica. Giallo:ρv²/2.</text><text x="28" y="1100" font-size="25">3 · Una differenza, non una perdita ideale</text><text x="28" y="1150">p₁ − p₂ = (8 − 2)kPa = 6kPa.</text><text x="28" y="1200">p + ρv²/2 = 108kPa in entrambe le sezioni.</text><text x="28" y="1250">La quota è uguale; la portata è comune.</text><text x="28" y="1300">Modello ideale: nessuna dissipazione aggiunta.</text><text x="28" y="1350">Pressioni con lo stesso riferimento del vuoto.</text><text x="28" y="1400">L’acqua resta liquida nelle condizioni assunte.</text></g></svg>
