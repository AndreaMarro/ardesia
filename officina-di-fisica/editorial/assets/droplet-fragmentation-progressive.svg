<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc">
<title id="title">Otto figlie conservano volume, creano superficie</title><desc id="desc">Una sfera di raggio un millimetro e otto sfere di raggio mezzo millimetro alla stessa scala. L’area finale è doppia. Barre energetiche distinguono energia iniziale, finale e incremento.</desc>
<rect width="640" height="1540" rx="20" fill="#f7fbff"/>
<g font-family="system-ui,sans-serif" fill="#142d40" font-size="20">
<text x="35" y="48" font-size="25" font-weight="700">1 · Il volume fissa il raggio figlio</text>
<text x="35" y="90">Sezioni centrali delle sfere: 50 px/mm</text>
<circle cx="150" cy="220" r="50" fill="#a7d8ec" stroke="#145d81" stroke-width="3"/>
<g fill="#d7f1fa" stroke="#145d81" stroke-width="2">
<circle cx="355" cy="180" r="25"/><circle cx="425" cy="180" r="25"/><circle cx="495" cy="180" r="25"/><circle cx="565" cy="180" r="25"/>
<circle cx="355" cy="260" r="25"/><circle cx="425" cy="260" r="25"/><circle cx="495" cy="260" r="25"/><circle cx="565" cy="260" r="25"/>
</g>
<g text-anchor="middle"><text x="355" y="187">1</text><text x="425" y="187">2</text><text x="495" y="187">3</text><text x="565" y="187">4</text><text x="355" y="267">5</text><text x="425" y="267">6</text><text x="495" y="267">7</text><text x="565" y="267">8</text></g>
<text x="90" y="330">R = 1 mm</text><text x="355" y="330">r = R/2 = 1/2 mm</text>
<text x="35" y="395">8r³ = R³ · N è un intero, non una frazione</text>
<text x="35" y="440">Ogni figlia ha 1/8 del volume iniziale.</text>
<path d="M35 475H605" stroke="#b3cbd9"/>
<text x="35" y="525" font-size="25" font-weight="700">2 · La superficie totale aumenta</text>
<text x="35" y="565">A₀ = 4πR² · barre: 100 px per A₀</text>
<text x="35" y="630">A_i</text><rect x="100" y="600" width="100" height="40" fill="#145d81"/><text x="220" y="630">A₀</text>
<text x="35" y="750">A_f</text><rect x="100" y="720" width="100" height="40" fill="#145d81"/><rect x="200" y="720" width="100" height="40" fill="#c65919"/><text x="320" y="750">2 A₀</text>
<path d="M100 585V780" stroke="#6e8b9c" stroke-dasharray="6 5"/>
<text x="35" y="830">A_f = 8 · 4π(R/2)² = 2 A₀</text>
<text x="35" y="875">Conservare volume non conserva area.</text>
<path d="M35 910H605" stroke="#b3cbd9"/>
<text x="35" y="960" font-size="25" font-weight="700">3 · Energia finale e incremento</text>
<text x="35" y="1000">γ = 10 mN/m · 100 px per π/25 µJ</text>
<text x="35" y="1080">E_i</text><rect x="100" y="1050" width="100" height="35" fill="#145d81"/><text x="220" y="1077">π/25 µJ</text>
<text x="35" y="1190">E_f</text><rect x="100" y="1160" width="200" height="35" fill="#145d81"/><text x="320" y="1187">2π/25 µJ</text>
<text x="35" y="1300">ΔE</text><rect x="100" y="1270" width="100" height="35" fill="#c65919"/><text x="220" y="1297">π/25 µJ</text>
<path d="M100 1035V1330" stroke="#6e8b9c" stroke-dasharray="6 5"/>
<text x="35" y="1385">ΔE = E_f − E_i = γ(A_f − A_i)</text>
<text x="35" y="1430">Solo questo incremento è lavoro reversibile</text>
<text x="35" y="1470">minimo se non cambiano altre energie.</text>
<text x="35" y="1510">La dissipazione può richiedere più lavoro.</text>
</g></svg>
