<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1040" role="img" aria-labelledby="title desc">
<title id="title">Sollevare: energia richiesta e tempo utile</title>
<desc id="desc">Tre tappe. Il carico di due chilogrammi sale di due metri con velocità costante. Il lavoro utile è quaranta joule, rappresentato da quattro porzioni uguali di dieci joule. A due watt ciascuna porzione richiede cinque secondi, per venti secondi totali.</desc>
<rect width="640" height="1040" fill="#faf8f0"/>
<g fill="#241e35" font-family="Georgia,serif" font-size="23">
<text x="30" y="42" font-size="27" font-weight="bold">1 · Quanto sale il carico?</text>
<text x="30" y="82">m = 2 kg; g = 10 m/s²; velocità costante.</text>
<path d="M65 155h180M65 275h180" stroke="#7c728b" stroke-width="2"/>
<rect x="85" y="135" width="70" height="40" fill="#ded7ed" stroke="#241e35" stroke-width="2"/>
<rect x="85" y="255" width="70" height="40" fill="#ded7ed" stroke="#241e35" stroke-width="2"/>
<path d="M220 155v120m-7-112 7-8 7 8m-14 104 7 8 7-8" fill="none" stroke="#241e35" stroke-width="2"/>
<text x="275" y="187">h = 2 m</text><text x="275" y="226">ΔK = 0</text>
<text x="275" y="266">Peso = 20 N</text>
<text x="30" y="328" font-size="19">Quote dei centri: scala60px/m; carico schematico.</text>
<path d="M30 353h580" stroke="#8b8298"/>
<text x="30" y="400" font-size="27" font-weight="bold">2 · Quanta energia occorre?</text>
<text x="30" y="446">W utile = mgh = 40 J</text>
<g fill="#ded7ed" stroke="#241e35" stroke-width="2"><rect x="40" y="476" width="125" height="64"/><rect x="165" y="476" width="125" height="64"/><rect x="290" y="476" width="125" height="64"/><rect x="415" y="476" width="125" height="64"/></g>
<text x="76" y="516">10 J</text><text x="201" y="516">10 J</text><text x="326" y="516">10 J</text><text x="451" y="516">10 J</text>
<text x="30" y="585">Quattro porzioni uguali: 4 × 10 J = 40 J.</text>
<path d="M30 620h580" stroke="#8b8298"/>
<text x="30" y="668" font-size="27" font-weight="bold">3 · A quale ritmo arriva?</text>
<text x="30" y="712">P utile = 2 W = 2 J/s</text>
<text x="30" y="757">Ogni porzione: 10 J / (2 J/s) = 5 s.</text>
<path d="M40 810h500M40 797v26m125-26v26m125-26v26m125-26v26m125-26v26" stroke="#241e35" stroke-width="2"/>
<text x="35" y="855">0</text><text x="152" y="855">5</text><text x="273" y="855">10</text><text x="398" y="855">15</text><text x="523" y="855">20 s</text>
<text x="30" y="910">T = 40 J / (2 J/s) = 20 s.</text>
<text x="30" y="956">Il lavoro della gravità è negativo;</text>
<text x="30" y="991">il lavoro utile dell’argano è positivo.</text>
</g></svg>
