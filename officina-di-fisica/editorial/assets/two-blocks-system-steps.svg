<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc"><title id="title">Due blocchi collegati da una fune tesa</title><desc id="desc">Tre tappe sul piano liscio, soltanto proiezioni orizzontali. Dietro il blocco di massa m due chilogrammi, davanti M due chilogrammi; forza esterna due newton a destra applicata a M. I blocchi non sono in contatto, li collega la fune. Diagrammi separati: sul posteriore T un newton a destra, sull’anteriore T un newton a sinistra e F due newton a destra. Le tensioni sono lunghe quaranta pixel, F ottanta, scala quaranta pixel per newton. Sistema totale quattro chilogrammi, accelerazione un mezzo metro al secondo quadrato. Disegno geometrico schematico senza scala spaziale.</desc><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#14647b"/></marker><marker id="t" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b44b2c"/></marker></defs><rect width="640" height="1120" rx="24" fill="#faf8f2"/>
<g font-family="system-ui, sans-serif" font-size="20" fill="#16323f">
<text x="28" y="45" font-size="24" font-weight="700">1 · Scegli il sistema e la fune</text>
<rect x="130" y="135" width="90" height="65" fill="#d6e6df" stroke="#16323f" stroke-width="2"/><rect x="380" y="135" width="90" height="65" fill="#e6d6bf" stroke="#16323f" stroke-width="2"/>
<text x="140" y="173">m = 2 kg</text><text x="390" y="173">M = 2 kg</text><path d="M220 167 L380 167" stroke="#788781" stroke-width="2"/><text x="252" y="142">fune tesa</text>
<path d="M470 167 L550 167" stroke="#14647b" stroke-width="3" marker-end="url(#a)"/><text x="490" y="128">F = 2 N</text><path d="M80 210 L580 210" stroke="#788781" stroke-width="2"/>
<text x="28" y="260">Piano liscio; nessun contatto fra i blocchi.</text><text x="28" y="300">Geometria schematica; destra positiva.</text>
<text x="28" y="370" font-size="24" font-weight="700">2 · Isola ciascun blocco</text>
<rect x="130" y="480" width="90" height="65" fill="#d6e6df" stroke="#16323f" stroke-width="2"/><rect x="380" y="480" width="90" height="65" fill="#e6d6bf" stroke="#16323f" stroke-width="2"/>
<text x="140" y="518">m = 2 kg</text><text x="390" y="518">M = 2 kg</text>
<path d="M220 512 L260 512" stroke="#b44b2c" stroke-width="3" marker-end="url(#t)"/><path d="M380 512 L340 512" stroke="#b44b2c" stroke-width="3" marker-end="url(#t)"/><path d="M470 512 L550 512" stroke="#14647b" stroke-width="3" marker-end="url(#a)"/>
<text x="223" y="460">T = 1 N</text><text x="300" y="585">T = 1 N</text><text x="493" y="460">F = 2 N</text>
<text x="28" y="640">Posteriore: T = mA = 1 N.</text><text x="28" y="680">Anteriore: F − T = MA = 1 N.</text>
<text x="28" y="750" font-size="24" font-weight="700">3 · Somma le equazioni</text>
<rect x="150" y="815" width="300" height="65" rx="12" fill="#e4e9e1" stroke="#16323f" stroke-width="2"/><text x="178" y="855">Sistema: M + m = 4 kg</text><path d="M450 847 L530 847" stroke="#14647b" stroke-width="3" marker-end="url(#a)"/><text x="485" y="808">F = 2 N</text>
<text x="28" y="935">F = (M + m)A; A = 2/4 m/s² = 1/2 m/s².</text><text x="28" y="980">T interna si cancella; sul singolo blocco non è nulla.</text><text x="28" y="1025">Forze in tutti i pannelli: 40 px/N.</text><text x="28" y="1070">Forze verticali equilibrate, omesse dai diagrammi.</text>
</g></svg>
