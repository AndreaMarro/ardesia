<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Allontanare le piastre isolate</title><desc id="desc">Tre tappe: separazione raddoppiata a carica libera invariata; energie di due preparazioni e media; energia finale contro fattore di separazione nel dominio da uno in su.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#20354d" text-anchor="start">Allontanare le piastre isolate</text><text x="32" y="92" font-size="22" fill="#20354d" text-anchor="start">1 · Q costante: la capacità diminuisce</text><text x="45" y="132" font-size="19" fill="#20354d" text-anchor="start">Prima: U₀ = 2 μJ</text><text x="350" y="132" font-size="19" fill="#20354d" text-anchor="start">Dopo: U = 4 μJ</text><rect x="100" y="165" width="10" height="160" fill="#316b9b" rx="3"/><rect x="160" y="165" width="10" height="160" fill="#316b9b" rx="3"/><rect x="370" y="165" width="10" height="160" fill="#316b9b" rx="3"/><rect x="480" y="165" width="10" height="160" fill="#316b9b" rx="3"/><text x="75" y="215" font-size="22" fill="#20354d" text-anchor="start">+</text><text x="185" y="215" font-size="22" fill="#20354d" text-anchor="start">−</text><text x="345" y="215" font-size="22" fill="#20354d" text-anchor="start">+</text><text x="505" y="215" font-size="22" fill="#20354d" text-anchor="start">−</text><text x="80" y="368" font-size="19" fill="#20354d" text-anchor="start">stesso Q</text><text x="355" y="368" font-size="19" fill="#20354d" text-anchor="start">stesso Q</text><line x1="110" y1="400" x2="160" y2="400" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="380" y1="400" x2="480" y2="400" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="135" y="435" font-size="19" fill="#20354d" text-anchor="middle">d₀</text><text x="430" y="435" font-size="19" fill="#20354d" text-anchor="middle">2d₀</text><text x="32" y="480" font-size="18" fill="#20354d" text-anchor="start">La sezione laterale è schematica; area invariata.</text><text x="32" y="540" font-size="22" fill="#20354d" text-anchor="start">2 · Energie finali e loro media</text><line x1="145" y1="560" x2="145" y2="815" stroke="#52667a" stroke-width="2"/><text x="125" y="607" font-size="19" fill="#20354d" text-anchor="end">A</text><rect x="150" y="590" width="128" height="27" fill="#316b9b" rx="3"/><text x="283" y="611" font-size="19" fill="#20354d" text-anchor="start">4 μJ</text><text x="125" y="692" font-size="19" fill="#20354d" text-anchor="end">B</text><rect x="150" y="675" width="288" height="27" fill="#a76d20" rx="3"/><text x="443" y="696" font-size="19" fill="#20354d" text-anchor="start">9 μJ</text><text x="125" y="777" font-size="19" fill="#20354d" text-anchor="end">media</text><rect x="150" y="760" width="208.0" height="27" fill="#488265" rx="3"/><text x="363.0" y="781" font-size="19" fill="#20354d" text-anchor="start">6.5 μJ</text><text x="32" y="875" font-size="18" fill="#20354d" text-anchor="start">A: U₀ = 2 μJ, s = 2 · B: U₀ = 3 μJ, s = 3</text><text x="32" y="950" font-size="22" fill="#20354d" text-anchor="start">3 · Solo U₀ = 2 μJ: U = sU₀</text><line x1="145" y1="1300" x2="520" y2="1300" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1305" x2="150" y2="1040" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="250" y1="1260" x2="450" y2="1180" stroke="#316b9b" stroke-width="2"/><circle cx="250" cy="1260" r="4" fill="#316b9b"/><text x="132" y="1324" font-size="18" fill="#20354d" text-anchor="end">0</text><text x="250" y="1330" font-size="18" fill="#20354d" text-anchor="middle">1</text><text x="450" y="1330" font-size="18" fill="#20354d" text-anchor="middle">3</text><text x="128" y="1266" font-size="18" fill="#20354d" text-anchor="end">2</text><text x="128" y="1186" font-size="18" fill="#20354d" text-anchor="end">6</text><text x="535" y="1310" font-size="18" fill="#20354d" text-anchor="start">s</text><text x="100" y="1025" font-size="18" fill="#20354d" text-anchor="start">U (μJ)</text><text x="32" y="1390" font-size="18" fill="#20354d" text-anchor="start">Il segmento rappresenta soltanto 1 ≤ s ≤ 3.</text></g></svg>
