<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1800" viewBox="0 0 640 1800" role="img" aria-labelledby="title desc"><title id="title">Forze su una colonna orizzontale</title><desc id="desc">Colonna materiale lunga due metri, massa un quinto di chilogrammo. Spinte di pressione undici e dieci newton opposte danno un newton. Il peso due newton è equilibrato dalle pareti. Accelerazione cinque metri al secondo quadrato. Confronto finale fra colonne diverse.</desc>
<defs><marker id="b" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#1664a7"/></marker><marker id="r" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#a83832"/></marker><marker id="g" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#347348"/></marker></defs>
<rect width="640" height="1800" fill="#fffdf6"/><g font-family="Arial,sans-serif" fill="#192f3d" font-size="22">
<text x="35" y="48" font-size="27" font-weight="bold">1. Pressioni opposte, risultante non nulla</text>
<text x="35" y="95">ρ = 1000 kg/m³; A = 1 cm²; L = 2 m</text>
<text x="35" y="140">Sezione ingrandita in modo schematico</text>
<text x="35" y="205">p₁ = 110 kPa</text><text x="420" y="205">p₂ = 100 kPa</text>
<rect x="220" y="250" width="200" height="150" fill="#dceef8" stroke="#1664a7" stroke-width="2"/>
<path d="M100 325H210" stroke="#1664a7" stroke-width="3" marker-end="url(#b)"/>
<path d="M540 325H440" stroke="#a83832" stroke-width="3" marker-end="url(#r)"/>
<text x="80" y="290">+11 N</text><text x="460" y="290">−10 N</text>
<path d="M320 305V325" stroke="#a83832" stroke-width="2" marker-end="url(#r)"/>
<path d="M320 380V360" stroke="#347348" stroke-width="2" marker-end="url(#g)"/>
<text x="35" y="400">Peso: 2 N ↓</text><text x="440" y="430">Pareti: 2 N ↑</text>
<path d="M220 440V460M220 450H420M420 440V460" stroke="#192f3d" fill="none"/>
<text x="260" y="490">L = 2 m</text>
<text x="35" y="535">Lunghezza: 100 px/m, corpo lungo 200 px</text>
<text x="35" y="580">Forze: 10 px/N; spinte 110 e 100 px</text>
<text x="35" y="625">A g = 10 m/s²: verticali da 20 px opposte</text>
<path d="M35 665H605" stroke="#c9d1d4"/>
<text x="35" y="715" font-size="27" font-weight="bold">2. Una sola risultante entra in m·a</text>
<text x="35" y="760">Massa: ρ A L = 1/5 kg</text>
<text x="35" y="805">Asse x verso destra; risultante verticale zero</text>
<circle cx="220" cy="875" r="7" fill="#192f3d"/>
<path d="M220 875H320" stroke="#1664a7" stroke-width="3" marker-end="url(#b)"/>
<text x="345" y="883">F = +1 N</text>
<text x="35" y="940">Qui scala F: 100 px/N, distinta dal pannello 1</text>
<path d="M220 1010H320" stroke="#347348" stroke-width="3" marker-end="url(#g)"/>
<text x="345" y="1018">a = +5 m/s²</text>
<text x="35" y="1070">Scala a: 20 px/(m/s²), freccia 100 px</text>
<text x="35" y="1115">Lunghezze uguali, grandezze e unità diverse</text>
<text x="35" y="1160">1 N = (1/5 kg) × (5 m/s²)</text>
<path d="M35 1200H605" stroke="#c9d1d4"/>
<text x="35" y="1250" font-size="27" font-weight="bold">3. Due colonne, due accelerazioni</text>
<text x="35" y="1295">A: L = 2 m, a = 5 m/s² → F = 1 N</text>
<rect x="100" y="1330" width="100" height="30" fill="#1664a7"/>
<text x="35" y="1420">B: L = 4 m, a = 2 m/s² → F = 4/5 N</text>
<rect x="100" y="1455" width="80" height="30" fill="#1664a7"/>
<text x="35" y="1545">Barre delle risultanti: 100 px/N</text>
<text x="35" y="1590">Massa doppia × accelerazione pari a 2/5</text>
<text x="35" y="1635">Rapporto F_B / F_A = 4/5</text>
<text x="35" y="1690">Nessuna ipotesi di velocità costante.</text>
<text x="35" y="1740">Il peso non è la risultante orizzontale.</text>
</g></svg>
