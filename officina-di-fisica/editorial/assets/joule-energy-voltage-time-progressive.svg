<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1570" role="img" aria-labelledby="title desc">
<title id="title">Potenza costante ed energia nell’intervallo</title>
<desc id="desc">Un resistore da 2 ohm a tensione costante 2 volt assorbe potenza 2 watt. Il rettangolo potenza-tempo, alto 2 watt e largo 3 secondi, rappresenta energia 6 joule. L’energia cumulata cresce linearmente da zero a 6 joule. Due preparazioni finali distinte danno energie 6 e 16 joule e media 11 joule; la seconda ha tensione 4 volt e durata 2 secondi.</desc>
<rect width="680" height="1570" fill="#fffdf6"/>
<text x="34" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18364a">1 · Il rettangolo sotto la potenza</text>
<text x="34" y="88" font-family="Arial,sans-serif" font-size="20" fill="#18364a">R = 2 Ω ; V = 2 V ; P = 2 W ; T = 3 s.</text>
<path d="M100 170V400H530" stroke="#526a78" stroke-width="2" fill="none"/>
<rect x="100" y="280" width="300" height="120" fill="#d9eaf5" stroke="#165a87" stroke-width="3"/>
<text x="34" y="185" font-family="Arial,sans-serif" font-size="20" fill="#18364a">P (W)</text><text x="520" y="430" font-family="Arial,sans-serif" font-size="20" fill="#18364a">τ (s)</text>
<text x="75" y="425" font-family="Arial,sans-serif" font-size="16" fill="#18364a">0</text><text x="393" y="425" font-family="Arial,sans-serif" font-size="16" fill="#18364a">3</text>
<text x="74" y="286" font-family="Arial,sans-serif" font-size="16" fill="#18364a">2</text><text x="210" y="345" font-family="Arial,sans-serif" font-size="22" fill="#18364a">E = 6 J</text>
<text x="34" y="475" font-family="Arial,sans-serif" font-size="18" fill="#18364a">Area fisica: (2 W) · (3 s) = 6 J.</text>
<text x="34" y="555" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18364a">2 · L’energia cumulata cresce</text>
<text x="34" y="595" font-family="Arial,sans-serif" font-size="20" fill="#18364a">Stessa prova: E(τ) = (2 W) τ, fino a T = 3 s.</text>
<path d="M100 620V880H540" stroke="#526a78" stroke-width="2" fill="none"/>
<path d="M100 880L400 640" stroke="#165a87" stroke-width="4" fill="none"/>
<circle cx="100" cy="880" r="4" fill="#165a87"/><circle cx="400" cy="640" r="5" fill="#165a87"/>
<text x="35" y="635" font-family="Arial,sans-serif" font-size="20" fill="#18364a">E (J)</text><text x="525" y="910" font-family="Arial,sans-serif" font-size="20" fill="#18364a">τ (s)</text>
<text x="75" y="905" font-family="Arial,sans-serif" font-size="16" fill="#18364a">0</text><text x="394" y="905" font-family="Arial,sans-serif" font-size="16" fill="#18364a">3</text><text x="415" y="645" font-family="Arial,sans-serif" font-size="20" fill="#18364a">6 J</text>
<text x="34" y="950" font-family="Arial,sans-serif" font-size="18" fill="#18364a">La tensione resta costante: non è una rampa V(τ).</text>
<text x="34" y="1030" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18364a">3 · Due prove e la loro media</text>
<text x="34" y="1070" font-family="Arial,sans-serif" font-size="20" fill="#18364a">A: 2 V per 3 s ; B: 4 V per 2 s ; sempre R = 2 Ω.</text>
<line x1="150" y1="1110" x2="150" y2="1400" stroke="#526a78" stroke-width="2"/><line x1="150" y1="1400" x2="510" y2="1400" stroke="#526a78" stroke-width="2"/>
<rect x="150" y="1130" width="120" height="34" fill="#165a87"/><rect x="150" y="1230" width="320" height="34" fill="#28664d"/><rect x="150" y="1330" width="220" height="34" fill="#9a4f23"/>
<text x="80" y="1155" font-family="Arial,sans-serif" font-size="20" fill="#18364a">A</text><text x="285" y="1155" font-family="Arial,sans-serif" font-size="20" fill="#18364a">6 J</text>
<text x="80" y="1255" font-family="Arial,sans-serif" font-size="20" fill="#18364a">B</text><text x="485" y="1255" font-family="Arial,sans-serif" font-size="20" fill="#18364a">16 J</text>
<text x="44" y="1355" font-family="Arial,sans-serif" font-size="20" fill="#18364a">Media</text><text x="385" y="1355" font-family="Arial,sans-serif" font-size="20" fill="#18364a">11 J</text>
<text x="125" y="1425" font-family="Arial,sans-serif" font-size="16" fill="#18364a">0</text><text x="460" y="1425" font-family="Arial,sans-serif" font-size="16" fill="#18364a">16 J</text>
<text x="34" y="1480" font-family="Arial,sans-serif" font-size="18" fill="#18364a">Le tre barre hanno origine e scala comuni.</text>
<text x="34" y="1515" font-family="Arial,sans-serif" font-size="18" fill="#18364a">Ai dati medi V = 3 V e T = 5/2 s, E = 45/4 J.</text>
</svg>
