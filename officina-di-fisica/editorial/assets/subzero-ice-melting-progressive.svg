<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1190" role="img" aria-labelledby="title desc">
<title id="title">Dal ghiaccio a meno dieci gradi all’acqua a zero</title>
<desc id="desc">Primo pannello: per un grammo la lettura sale da meno dieci a zero gradi Celsius assorbendo venti joule, poi resta a zero per trecento joule di fusione. Secondo: i due contributi sommano trecentoventi joule. Terzo: le energie di due prove sono trecentoventi e seicentottanta joule, con media cinquecento.</desc>
<rect width="640" height="1190" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Prima scaldare, poi cambiare fase</text>
<text x="32" y="83" font-size="18">Un grammo; lettura iniziale −10 °C.</text>
<g fill="none" stroke="#14243a" stroke-width="2"><path d="M100 350V125"/><path d="M100 350H535"/></g>
<path d="M100 320L120 220H420" stroke="#165a87" stroke-width="4" fill="none"/>
<path d="M120 220V350M420 220V350" stroke="#8292a2" stroke-dasharray="5 5" fill="none"/>
<g fill="#165a87"><circle cx="100" cy="320" r="5"/><circle cx="120" cy="220" r="5"/><circle cx="420" cy="220" r="5"/></g>
<text x="25" y="327">−10 °C</text><text x="39" y="227">0 °C</text><text x="40" y="119">T / °C</text>
<text x="89" y="381">0</text><text x="109" y="381">20</text><text x="402" y="381">320</text><text x="548" y="356">Q / J</text>
<text x="146" y="185">Fusione completa a T costante</text>
<text x="32" y="422" font-size="18">Assi: 1 px/J; 10 px/K per le differenze verticali.</text>
<text x="32" y="454" font-size="18">0 °C è la fusione; non è lo zero assoluto.</text>
<path d="M32 483H608" stroke="#9babbc"/>
<text x="32" y="527" font-size="25" font-weight="bold">2 · Due energie entrambe assorbite</text>
<path d="M130 548V777" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="570" width="24" height="34" fill="#165a87"/><rect x="130" y="638" width="360" height="34" fill="#28664d"/>
<rect x="130" y="706" width="24" height="34" fill="#165a87"/><rect x="154" y="706" width="360" height="34" fill="#28664d"/>
<text x="33" y="595">Sensibile</text><text x="171" y="595">20 J</text>
<text x="33" y="663">Fusione</text><text x="507" y="663">300 J</text>
<text x="33" y="731">Totale</text><text x="531" y="731">320 J</text>
<text x="32" y="809" font-size="18">Scala comune: 1,2 px/J; 20 J + 300 J = 320 J.</text>
<path d="M32 838H608" stroke="#9babbc"/>
<text x="32" y="882" font-size="25" font-weight="bold">3 · La media delle due prove</text>
<path d="M130 901V1100" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="918" width="192" height="30" fill="#165a87"/><rect x="130" y="978" width="408" height="30" fill="#165a87"/><rect x="130" y="1038" width="300" height="30" fill="#28664d"/>
<text x="50" y="941">A</text><text x="339" y="941">320 J</text><text x="50" y="1001">B</text><text x="554" y="1001">680 J</text><text x="32" y="1061">Media</text><text x="447" y="1061">500 J</text>
<text x="32" y="1134" font-size="18">A: 1 g, 10 K; B: 2 g, 20 K. Barre a 0,6 px/J.</text>
<text x="32" y="1166" font-size="18">Sono trasferimenti di prove separate, non calori contenuti.</text>
</g></svg>
