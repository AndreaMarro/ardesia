<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
<title id="title">Il salto termico diventa lavoro nel ciclo di Carnot</title>
<desc id="desc">Tre pannelli con barre a origine comune: temperature calda 400 e fredda 200 kelvin; calore assorbito 400, ceduto 200 e lavoro netto 200 joule; lavori di due prove 200 e 300 joule con media 250.</desc>
<rect width="640" height="1120" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Temperature assolute e salto</text>
<path d="M130 74V232" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="95" width="400" height="34" fill="#ab5b22"/><rect x="130" y="165" width="200" height="34" fill="#165a87"/>
<text x="45" y="120">Tₕ</text><text x="535" y="120">400 K</text><text x="45" y="190">T꜀</text><text x="345" y="190">200 K</text>
<text x="32" y="270">Tₕ − T꜀ = 200 K</text>
<text x="32" y="305" font-size="18">Scale termiche: 1 px/K; origine comune x = 130.</text>
<path d="M32 338H608" stroke="#9babbc"/>
<text x="32" y="382" font-size="25" font-weight="bold">2 · Un ciclo: 400 − 200 = 200 J</text>
<path d="M130 405V630" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="425" width="400" height="34" fill="#ab5b22"/><rect x="130" y="495" width="200" height="34" fill="#165a87"/><rect x="130" y="565" width="200" height="34" fill="#28664d"/>
<text x="45" y="450">Qₕ</text><text x="535" y="450">400 J</text><text x="45" y="520">Q꜀</text><text x="345" y="520">200 J</text><text x="45" y="590">W</text><text x="345" y="590">200 J</text>
<text x="32" y="666" font-size="18">c = nR ln 2 = 1 J/K; tutte le barre a 1 px/J.</text>
<text x="32" y="700" font-size="18">ΔU del ciclo = 0 ; W = Qₕ − Q꜀ (moduli dei Q).</text>
<path d="M32 733H608" stroke="#9babbc"/>
<text x="32" y="777" font-size="25" font-weight="bold">3 · Due lavori e la loro media</text>
<path d="M130 801V1007" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="821" width="200" height="32" fill="#165a87"/><rect x="130" y="884" width="300" height="32" fill="#165a87"/><rect x="130" y="947" width="250" height="32" fill="#28664d"/>
<text x="45" y="845">A</text><text x="345" y="845">200 J</text><text x="45" y="908">B</text><text x="445" y="908">300 J</text><text x="32" y="971">Media</text><text x="395" y="971">250 J</text>
<text x="32" y="1046" font-size="18">A: 400/200 K; B: 600/300 K. Barre a 1 px/J.</text>
<text x="32" y="1080" font-size="18">Due isoterme, due adiabatiche: il ciclo è di Carnot.</text>
</g></svg>
