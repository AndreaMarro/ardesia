<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1470" viewBox="0 0 640 1470" role="img" aria-labelledby="title desc"><title id="title">Salire nel liquido diminuisce la pressione</title><desc id="desc">Acqua in un manometro a U fra due gas. Gas uno cento kilopascal con interfaccia bassa a quota zero; gas due novantotto kilopascal con interfaccia venti centimetri più alta. Scala dieci pixel per centimetro. Si sottraggono due kilopascal salendo; barra del solo salto con scala cento pixel per kilopascal.</desc><rect width="640" height="1470" rx="20" fill="#faf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Il gas che spinge di più abbassa il pelo</text><text x="28" y="90">Acqua; peso dei gas e capillarità trascurabili.</text><text x="85" y="150">Gas 1: 100 kPa</text><text x="385" y="150">Gas 2: 98 kPa</text><path d="M140 420H220V530H420V220H500V610H140Z" fill="#bad9e5"/><path d="M140 180V610H500V180M220 180V530H420V180" fill="none" stroke="#597f83" stroke-width="3"/><path d="M120 420H520" stroke="#193a49" stroke-dasharray="6 5"/><circle cx="180" cy="420" r="5" fill="#193a49"/><circle cx="460" cy="420" r="5" fill="#193a49"/><text x="165" y="455">A</text><text x="450" y="455">B</text><text x="250" y="405">z = 0</text><path d="M550 220V420M540 220H560M540 420H560" stroke="#193a49" fill="none"/><text x="560" y="330">20 cm</text><text x="28" y="665">Scala geometrica: 10 px/cm. Δh = 20 cm.</text><text x="28" y="710">A e B sono alla stessa quota: p_A = p_B.</text>
<text x="28" y="790" font-size="25">2 · Alla quota bassa le pressioni coincidono</text><text x="28" y="845">p_A = p₁; p_B = p₂ + ρgΔh.</text><text x="28" y="895">p₁ − p₂ = ρgΔh = 2 kPa.</text><rect x="230" y="930" width="200" height="34" fill="#9ac9d4"/><text x="28" y="955">Solo il salto:</text><text x="460" y="955">2 kPa</text><text x="28" y="1010">Scala del salto: 100 px/kPa, distinta dalla geometria.</text><text x="28" y="1055">p₂ = 100 kPa − 2 kPa = 98 kPa.</text>
<text x="28" y="1135" font-size="25">3 · Convertire mantiene il segno corretto</text><text x="28" y="1190">20 cm = 1/5 m.</text><text x="28" y="1235">ρg = 10000 Pa/m; ρgΔh = 2000 Pa.</text><text x="28" y="1280">2000 Pa = 2 kPa; salendo si sottraggono.</text><text x="28" y="1335">Pressioni assolute positive: p₁ &gt; ρgΔh.</text><text x="28" y="1380">p₁ è già assoluta: non aggiungere un’atmosfera.</text><text x="28" y="1430">La barra rappresenta una differenza, non p₁ o p₂.</text></g></svg>
