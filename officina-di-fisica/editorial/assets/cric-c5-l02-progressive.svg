<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1560" width="640" height="1560" role="img" aria-labelledby="title desc">
<title id="title">Spazio dell’onda, fase e propagazione della cresta</title>
<desc id="desc">Una sinusoide ha creste separate da trentasei centimetri e valle intermedia a diciotto. Un cerchio di fase mostra un quarto di giro, non il moto della corda. Il grafico finale delle differenze mostra uno spostamento di uno virgola venti metri in zero virgola zero otto secondi.</desc>
