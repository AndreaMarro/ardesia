<svg xmlns="http://www.w3.org/2000/svg" width="320" height="680" viewBox="0 0 320 680" role="img" aria-labelledby="title desc">
<title id="title">Due cubi: sedici cubetti</title>
<desc id="desc">Tre tappe verticali. Il volume contiene due vecchie unità cubiche. Ciascuna unità è suddivisa in due strati. Ogni strato contiene quattro cubetti, disposti in due righe e due colonne. Due cubi per due strati per quattro cubetti danno sedici cubetti.</desc>
<rect width="320" height="680" fill="#fffdf8"/>
<g fill="#193d43" font-family="sans-serif" font-size="18">
<text x="16" y="30">1. Parti da due cubi</text><text x="16" y="57" font-size="16">Ogni lato cambia scala di 2.</text>
<text x="16" y="236">2. Apri un cubo in due strati</text><text x="16" y="263" font-size="16">Ogni strato: 2 righe × 2 colonne.</text>
<text x="16" y="455">3. Riunisci il conteggio</text><text x="16" y="482" font-size="16">8 cubetti per ogni vecchio cubo.</text>
</g>
<g fill="#e6efec" stroke="#193d43" stroke-width="2" stroke-linejoin="round">
<path d="M35 110h70v70H35zM35 110l25-25h70v70l-25 25M105 110l25-25M35 110h70"/>
<path d="M180 110h70v70h-70zM180 110l25-25h70v70l-25 25M250 110l25-25M180 110h70"/>
<rect x="40" y="295" width="90" height="90"/><rect x="190" y="295" width="90" height="90"/>
<path d="M85 295v90M40 340h90M235 295v90M190 340h90"/>
</g>
<g fill="#193d43" font-family="sans-serif" font-size="17" text-anchor="middle">
<text x="85" y="414">strato 1: 4</text><text x="235" y="414">strato 2: 4</text>
<text x="160" y="535">Un cubo: 4 + 4 = 8</text><text x="160" y="578">Due cubi: 8 + 8 = 16</text><text x="160" y="642">Volume fisico invariato</text>
</g></svg>
