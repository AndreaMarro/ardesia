<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1310" role="img" aria-labelledby="title desc"><title id="title">Leva:bilancio dei momenti e delle forze</title><desc id="desc">Leva orizzontale ideale senza peso con bracci entrambi due metri,centosessanta pixel alla scala ottanta pixel per metro. Forze verticali verso il basso di due newton a sinistra e a destra,con momenti opposti. Le frecce delle forze hanno scala trenta pixel per newton,sessanta pixel ciascuna. Il terzo pannello mostra proiezioni separate delle due forze verso il basso e della reazione del fulcro quattro newton verso l’alto,lunga centoventi pixel alla medesima scala. La reazione non ha momento rispetto al fulcro.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="640" height="1310" rx="24" fill="#faf8f2"/><g font-family="system-ui,sans-serif" font-size="20" fill="#16323f">
<text x="28" y="42" font-size="24" font-weight="700">1 · Misura i bracci perpendicolari</text><text x="28" y="90">Asta orizzontale senza peso; forze verticali.</text><path d="M160 220H480" stroke="#81968d" stroke-width="6"/><path d="M320 220L300 250H340Z" fill="#d5e3dc" stroke="#16323f" stroke-width="2"/><path d="M160 220V280" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 220V280" stroke="#b44b2c" stroke-width="3" marker-end="url(#arrow)"/><text x="85" y="205">F = 2 N</text><text x="485" y="205">R = 2 N</text><text x="310" y="290">O</text><path d="M160 350H480M160 340V360M320 340V360M480 340V360" stroke="#81968d" stroke-width="2"/><text x="205" y="395">a = 2 m</text><text x="365" y="395">b = 2 m</text><text x="28" y="445">Bracci: 80 px/m. Forze: 30 px/N.</text>
<text x="28" y="525" font-size="24" font-weight="700">2 · I due momenti hanno segni opposti</text><text x="28" y="580">Convenzione: antiorario positivo.</text><text x="28" y="635">Momento di F: +aF = +4 N·m</text><text x="28" y="685">Momento di R: −bR = −4 N·m</text><text x="28" y="735">Somma dei momenti in O: aF − bR = 0.</text><text x="28" y="785">La reazione in O ha braccio nullo.</text>
<text x="28" y="865" font-size="24" font-weight="700">3 · Anche le forze devono equilibrarsi</text><text x="28" y="910">Proiezioni verticali separate: 30 px/N.</text><path d="M160 1030V1090" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 1030V1090" stroke="#b44b2c" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 1030V910" stroke="#746493" stroke-width="3" marker-end="url(#arrow)"/><text x="125" y="1140">F = 2 N</text><text x="285" y="1140">R = 2 N</text><text x="430" y="1070">R_O = 4 N</text><text x="28" y="1200">Verso l’alto positivo: R_O − F − R = 0.</text><text x="28" y="1250">La cerniera fornisce una forza, nessuna coppia.</text><text x="28" y="1290" font-size="18">Equilibrio di forze e momenti sono condizioni distinte.</text>
</g></svg>
