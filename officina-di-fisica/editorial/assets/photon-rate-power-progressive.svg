<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Dalla potenza al tasso di fotoni</title><desc id="desc">Tre tappe: energia per fotone distinta dalla potenza; cinquanta e venticinque milioni di fotoni per secondo a potenza uguale e frequenza doppia; grafico lineare del tasso rispetto alla potenza a frequenza fissata.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Dalla potenza al tasso di fotoni</text><text x="32" y="92" font-size="22" text-anchor="start">1 · Energia per fotone e potenza</text><text x="32" y="145" font-size="18" text-anchor="start">f = 10¹⁵ Hz · P = 33 pW</text><text x="32" y="205" font-size="18" text-anchor="start">hf = (33/5)·10⁻¹⁹ J</text><line x1="320" y1="240" x2="320" y2="310" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="360" font-size="18" text-anchor="start">Ṅ = P / (hf) = 50 milioni/s</text><text x="32" y="420" font-size="18" text-anchor="start">È un tasso medio, non la frequenza del campo.</text><text x="32" y="480" font-size="18" text-anchor="start">h è il valore prescritto dal quesito.</text><text x="32" y="550" font-size="22" text-anchor="start">2 · Stessa potenza, frequenza doppia</text><text x="32" y="595" font-size="18" text-anchor="start">P = 33 pW in entrambe le prove</text><text x="128" y="704" font-size="18" text-anchor="end">u = 1</text><rect x="150" y="680" width="250" height="32" fill="#316b9b"/><text x="412" y="704" font-size="18" text-anchor="start">50 milioni/s</text><text x="128" y="824" font-size="18" text-anchor="end">u = 2</text><rect x="150" y="800" width="125" height="32" fill="#316b9b"/><text x="287" y="824" font-size="18" text-anchor="start">25 milioni/s</text><text x="32" y="910" font-size="18" text-anchor="start">Barre di tasso con origine e scala comuni.</text><text x="32" y="960" font-size="22" text-anchor="start">3 · Frequenza fissata: f = 10¹⁵ Hz</text><line x1="145" y1="1280" x2="550" y2="1280" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1285" x2="150" y2="1010" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1280" x2="480" y2="1030" stroke="#52667a" stroke-width="2"/><circle cx="150" cy="1280" r="4" fill="#f7fafc" stroke="#316b9b" stroke-width="2"/><circle cx="480" cy="1030" r="5" fill="#316b9b"/><text x="128" y="1305" font-size="18" text-anchor="end">0</text><text x="480" y="1310" font-size="18" text-anchor="middle">33</text><text x="128" y="1036" font-size="18" text-anchor="end">50</text><text x="450" y="1350" font-size="18" text-anchor="start">P (pW)</text><text x="45" y="990" font-size="18" text-anchor="start">Ṅ (milioni/s)</text><text x="32" y="1400" font-size="18" text-anchor="start">Il tasso medio è proporzionale alla potenza.</text><text x="32" y="1440" font-size="18" text-anchor="start">L’origine è un limite dei dati positivi.</text></g></svg>
