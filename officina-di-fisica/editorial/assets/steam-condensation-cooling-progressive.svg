<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1210" role="img" aria-labelledby="title desc">
<title id="title">Condensare il vapore e raffreddare l’acqua</title>
<desc id="desc">Per un grammo la condensazione cede 2400 joule alla temperatura di fase; il liquido cede poi 100 joule raffreddandosi di 25 kelvin. Le energie cedute sono moduli positivi; il calore con segno del campione è negativo. Due prove cedono 2500 e 5200 joule, media 3850.</desc>
<rect width="640" height="1210" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Prima condensare, poi raffreddare</text>
<text x="32" y="83" font-size="18">Un grammo; il liquido resta nel campo ammesso.</text>
<text x="32" y="123">(T − Tₛ) / K</text>
<g fill="none" stroke="#14243a" stroke-width="2"><path d="M100 350V145"/><path d="M100 350H535"/></g>
<path d="M100 220H460L475 320" stroke="#165a87" stroke-width="4" fill="none"/>
<path d="M460 220V350M475 320V350M100 320H475" stroke="#8292a2" stroke-dasharray="5 5" fill="none"/>
<g fill="#165a87"><circle cx="100" cy="220" r="5"/><circle cx="460" cy="220" r="5"/><circle cx="475" cy="320" r="5"/></g>
<text x="65" y="227">0</text><text x="42" y="327">−25</text><text x="89" y="381">0</text><text x="423" y="383">2400</text><text x="475" y="411">2500</text><text x="545" y="356">Q꜀ / J</text>
<text x="144" y="184">Condensazione a Tₛ costante</text>
<text x="32" y="450" font-size="18">Assi: calore ceduto in J e differenza termica in K.</text>
<text x="32" y="482" font-size="18">T − Tₛ è un intervallo: non è T assoluta negativa.</text>
<path d="M32 511H608" stroke="#9babbc"/>
<text x="32" y="555" font-size="25" font-weight="bold">2 · Due cessioni, un solo modulo totale</text>
<path d="M130 576V805" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="598" width="360" height="34" fill="#28664d"/><rect x="130" y="666" width="15" height="34" fill="#165a87"/>
<rect x="130" y="734" width="360" height="34" fill="#28664d"/><rect x="490" y="734" width="15" height="34" fill="#165a87"/>
<text x="33" y="623">Latente</text><text x="506" y="623">2400 J</text><text x="33" y="691">Sensibile</text><text x="162" y="691">100 J</text><text x="33" y="759">Totale</text><text x="522" y="759">2500 J</text>
<text x="32" y="837" font-size="18">Calore ceduto Q꜀ = 2500 J; ricevuto Q = −2500 J.</text>
<path d="M32 866H608" stroke="#9babbc"/>
<text x="32" y="910" font-size="25" font-weight="bold">3 · Media dei moduli di due prove</text>
<path d="M120 929V1128" stroke="#14243a" stroke-width="2"/>
<rect x="120" y="946" width="200" height="30" fill="#165a87"/><rect x="120" y="1006" width="416" height="30" fill="#165a87"/><rect x="120" y="1066" width="308" height="30" fill="#28664d"/>
<text x="50" y="969">A</text><text x="337" y="969">2500 J</text><text x="50" y="1029">B</text><text x="552" y="1029">5200 J</text><text x="32" y="1089">Media</text><text x="445" y="1089">3850 J</text>
<text x="32" y="1162" font-size="18">A: 1 g, 25 K; B: 2 g, 50 K. Energie in J.</text>
</g></svg>
