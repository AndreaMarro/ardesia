<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1370" viewBox="0 0 640 1370" role="img" aria-labelledby="title desc"><title id="title">Carnot: temperature e rendimento</title><desc id="desc">Temperature assolute400 e200 kelvin alla stessa scala con origine zero. Una realizzazione energetica aggiuntiva100 joule in ingresso,50 ceduti e50 di lavoro. Confronto dei rendimenti di400/200 kelvin e900/300 kelvin. Le scale dei tre pannelli sono distinte.</desc><rect width="640" height="1370" rx="20" fill="#f5faff"/><g font-family="Arial,sans-serif" font-size="20" fill="#163047"><text x="35" y="50" font-size="26" font-weight="bold">1 · Il rapporto usa lo zero assoluto</text><text x="35" y="100">Scala comune: 1/2 px/K · A</text><path d="M80 120V360H520" fill="none" stroke="#17394e" stroke-width="2"/><rect x="140" y="160" width="85" height="200" fill="#c77c47"/><rect x="350" y="260" width="85" height="100" fill="#447f99"/><text x="140" y="140">400 K</text><text x="350" y="240">200 K</text><text x="140" y="395">T_h</text><text x="350" y="395">T_c</text><text x="30" y="365">0 K</text><text x="35" y="445">η_A = 1 − 200/400 = 1/2</text><path d="M35 490H605" stroke="#b5cbd9"/><text x="35" y="545" font-size="26" font-weight="bold">2 · Un possibile bilancio energetico</text><text x="35" y="590">Esempio aggiuntivo: Q_h = 100 J · A</text><text x="35" y="630">Barre da zero, scala comune 3 px/J</text><rect x="100" y="675" width="300" height="45" fill="#163047"/><text x="170" y="705" fill="white">Q_h = 100 J</text><rect x="100" y="755" width="150" height="45" fill="#39745b"/><rect x="250" y="755" width="150" height="45" fill="#196082"/><text x="115" y="785" fill="white">Q_c = 50 J</text><text x="270" y="785" fill="white">W = 50 J</text><text x="35" y="850">Le sole temperature non fissano Q_h o W.</text><text x="35" y="890">Fissano il rapporto W/Q_h = 1/2.</text><path d="M35 935H605" stroke="#b5cbd9"/><text x="35" y="990" font-size="26" font-weight="bold">3 · Due rendimenti, non due lavori</text><text x="35" y="1035">A: 400 K / 200 K · B: 900 K / 300 K</text><text x="35" y="1080">Scala: 360 px per unità di rendimento</text><text x="50" y="1150">A</text><rect x="140" y="1125" width="180" height="35" fill="#196082"/><text x="335" y="1150">1/2</text><text x="50" y="1220">B</text><rect x="140" y="1195" width="240" height="35" fill="#196082"/><text x="395" y="1220">2/3</text><text x="35" y="1290">η_B / η_A = (2/3) / (1/2) = 4/3</text><text x="35" y="1335">Entrambi i rendimenti restano minori di 1.</text></g></svg>
