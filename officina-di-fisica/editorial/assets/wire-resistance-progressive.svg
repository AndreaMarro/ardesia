<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1460" role="img" aria-labelledby="title desc">
<title id="title">Resistività, lunghezza e area del filo</title><desc id="desc">Viste schematiche indipendenti di filo lungo cento metri e area due millimetri quadrati. Conversione dell’area e resistenza un ohm. Grafico a sezione fissa e confronto finale uno, quattro e media cinque mezzi ohm.</desc>
<rect width="640" height="1460" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="20" fill="#14243a">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Materiale e geometria</text><text x="32" y="83" font-size="18">Due viste schematiche, su scale indipendenti.</text>
<rect x="100" y="180" width="300" height="45" rx="6" fill="#e2e8f0" stroke="#8292a2" stroke-width="2"/><circle cx="520" cy="202" r="33" fill="#e2e8f0" stroke="#8292a2" stroke-width="2"/>
<path d="M100 252V268M400 252V268M100 260H400" fill="none" stroke="#14243a" stroke-width="2"/><text x="175" y="305">L = 100 m</text><text x="445" y="305">A = 2 mm²</text>
<text x="32" y="354">ρ = 2 × 10⁻⁸ Ω·m</text><text x="32" y="397">2 mm² = 2 × 10⁻⁶ m² ; R = 1 Ω</text>
<path d="M32 435H608" stroke="#9babbc"/>
<text x="32" y="480" font-size="25" font-weight="bold">2 · R(L) con sezione fissa</text><text x="32" y="521" font-size="18">Area 2 mm² ; L in m, R in Ω.</text>
<path d="M130 850V570M130 850H565" fill="none" stroke="#14243a" stroke-width="2"/><path d="M130 850L530 610" stroke="#165a87" stroke-width="4"/>
<circle cx="130" cy="850" r="4" fill="#f8fafc" stroke="#165a87" stroke-width="2"/><circle cx="330" cy="730" r="5" fill="#165a87"/><circle cx="530" cy="610" r="5" fill="#165a87"/>
<path d="M130 730H330V850M130 610H530V850" fill="none" stroke="#8292a2" stroke-dasharray="5 5"/>
<text x="92" y="617">2</text><text x="92" y="737">1</text><text x="92" y="857">0</text><text x="118" y="887">0</text><text x="309" y="887">100</text><text x="509" y="887">200</text><text x="500" y="926">L in m</text>
<path d="M32 960H608" stroke="#9babbc"/>
<text x="32" y="1005" font-size="25" font-weight="bold">3 · Media di due resistenze</text><path d="M130 1035V1300" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="1060" width="80" height="38" fill="#165a87"/><rect x="130" y="1140" width="320" height="38" fill="#165a87"/><rect x="130" y="1220" width="200" height="38" fill="#28664d"/>
<text x="50" y="1088">A</text><text x="230" y="1088">1 Ω</text><text x="50" y="1168">B</text><text x="470" y="1168">4 Ω</text><text x="32" y="1248">Media</text><text x="350" y="1248">5/2 Ω</text><text x="104" y="1294">0</text>
<text x="32" y="1342" font-size="18">A: 100 m, 2 mm² ; B: 200 m, 1 mm².</text><text x="32" y="1378" font-size="18">B non appartiene alla retta a sezione fissa 2 mm².</text><text x="32" y="1414" font-size="18">Barre in Ω, stessa origine e scala comune.</text>
</g></svg>
