<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1410" viewBox="0 0 640 1410" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Energie e potenze di un motore e un frigorifero</title><desc id="desc">Tre pannelli con scale indipendenti, comuni alle tre barre entro ciascun pannello: energie al limite di Carnot; potenze ricevuta utile e ceduta; energie del frigorifero con lavoro entrante cinquanta joule.</desc><rect x="0" y="0" width="640" height="1410" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Motore e frigorifero: tre bilanci</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Limite fra 600 K e 300 K</text><text x="35" y="190" font-size="19" fill="#203247" text-anchor="start">Q caldo</text><rect x="220" y="165" width="300" height="28" fill="#986c35"/><text x="540" y="190" font-size="19" fill="#203247" text-anchor="start">900 J</text><text x="35" y="265" font-size="19" fill="#203247" text-anchor="start">W massimo</text><rect x="220" y="240" width="150" height="28" fill="#637e55"/><text x="395" y="265" font-size="19" fill="#203247" text-anchor="start">450 J</text><text x="35" y="340" font-size="19" fill="#203247" text-anchor="start">Q freddo minimo</text><rect x="220" y="315" width="150" height="28" fill="#3d7791"/><text x="395" y="340" font-size="19" fill="#203247" text-anchor="start">450 J</text><text x="35" y="410" font-size="19" fill="#203247" text-anchor="start">Bilancio reversibile: 900 J = 450 J + 450 J</text><text x="35" y="520" font-size="21" fill="#203247" text-anchor="start">2 · Potenze medie: rendimento 0,22</text><text x="35" y="600" font-size="19" fill="#203247" text-anchor="start">P ricevuta</text><rect x="220" y="575" width="300" height="28" fill="#986c35"/><text x="540" y="600" font-size="19" fill="#203247" text-anchor="start">1500 W</text><text x="35" y="680" font-size="19" fill="#203247" text-anchor="start">P utile</text><rect x="220" y="655" width="66" height="28" fill="#637e55"/><text x="310" y="680" font-size="19" fill="#203247" text-anchor="start">330 W</text><text x="35" y="760" font-size="19" fill="#203247" text-anchor="start">P ceduta</text><rect x="220" y="735" width="234" height="28" fill="#3d7791"/><text x="480" y="760" font-size="19" fill="#203247" text-anchor="start">1170 W</text><text x="35" y="840" font-size="19" fill="#203247" text-anchor="start">330 / 1500 = 22 / 100</text><text x="35" y="950" font-size="21" fill="#203247" text-anchor="start">3 · Frigorifero: quale calore al numeratore?</text><text x="35" y="1030" font-size="19" fill="#203247" text-anchor="start">W entrante</text><rect x="220" y="1005" width="60" height="28" fill="#637e55"/><text x="305" y="1030" font-size="19" fill="#203247" text-anchor="start">50 J</text><text x="35" y="1110" font-size="19" fill="#203247" text-anchor="start">Q dal vano</text><rect x="220" y="1085" width="180" height="28" fill="#3d7791"/><text x="425" y="1110" font-size="19" fill="#203247" text-anchor="start">150 J</text><text x="35" y="1190" font-size="19" fill="#203247" text-anchor="start">Q alla stanza</text><rect x="220" y="1165" width="240" height="28" fill="#986c35"/><text x="485" y="1190" font-size="19" fill="#203247" text-anchor="start">200 J</text><text x="35" y="1280" font-size="19" fill="#203247" text-anchor="start">200 J = 150 J + 50 J</text><text x="35" y="1350" font-size="19" fill="#203247" text-anchor="start">COP frigorifero = 150 J / 50 J = 3</text></svg>
