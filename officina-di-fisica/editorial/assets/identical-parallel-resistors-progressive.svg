<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1500" role="img" aria-labelledby="title desc">
<title id="title">Tre rami identici e due confronti distinti</title>
<desc id="desc">Tre resistori da 12 ohm collegati fra A e B danno equivalente 4 ohm. A resistenza di ramo fissa, un solo ramo dà 12 ohm. Nelle due preparazioni finali i valori equivalenti sono 4 e 3 ohm e la media è 7/2 ohm. Le scale sono comuni solo entro ciascun pannello di barre.</desc>
<rect width="680" height="1500" fill="#fffdf6" />
<text x="34" y="48" font-family="Arial,sans-serif" fill="#18364a" font-size="26" font-weight="700">1 · La stessa coppia di nodi</text>
<text x="34" y="88" font-family="Arial,sans-serif" fill="#18364a" font-size="20">r = 12 Ω ; N = 3 rami identici.</text>
<path d="M90 250H160V160H520V340H160V250M520 250H600M160 250H300M400 250H520" stroke="#24485c" stroke-width="3" fill="none" />
<rect x="300" y="145" width="100" height="30" stroke="#165a87" stroke-width="3" fill="#eaf3f8" />
<rect x="300" y="235" width="100" height="30" stroke="#165a87" stroke-width="3" fill="#eaf3f8" />
<rect x="300" y="325" width="100" height="30" stroke="#165a87" stroke-width="3" fill="#eaf3f8" />
<circle cx="160" cy="250" r="6" fill="#24485c" /><circle cx="520" cy="250" r="6" fill="#24485c" />
<text x="85" y="224" font-family="Arial,sans-serif" fill="#18364a" font-size="20">A</text><text x="600" y="224" font-family="Arial,sans-serif" fill="#18364a" font-size="20">B</text>
<text x="318" y="130" font-family="Arial,sans-serif" fill="#18364a" font-size="20">12 Ω</text><text x="318" y="220" font-family="Arial,sans-serif" fill="#18364a" font-size="20">12 Ω</text><text x="318" y="310" font-family="Arial,sans-serif" fill="#18364a" font-size="20">12 Ω</text>
<text x="34" y="402" font-family="Arial,sans-serif" fill="#18364a" font-size="20">Ogni ramo riceve V_AB ; I_T = 3 V_AB / (12 Ω).</text>
<text x="34" y="438" font-family="Arial,sans-serif" fill="#18364a" font-size="20">G_T = 3 / (12 Ω) = 1/4 S ; R = 4 Ω.</text>
<text x="34" y="515" font-family="Arial,sans-serif" fill="#18364a" font-size="26" font-weight="700">2 · Rimuovere due percorsi</text>
<text x="34" y="555" font-family="Arial,sans-serif" fill="#18364a" font-size="20">Qui r resta 12 Ω ; N passa da 3 a 1.</text>
<line x1="150" y1="595" x2="150" y2="790" stroke="#526a78" stroke-width="2" /><line x1="150" y1="790" x2="430" y2="790" stroke="#526a78" stroke-width="2" />
<rect x="150" y="620" width="80" height="38" fill="#165a87" /><rect x="150" y="710" width="240" height="38" fill="#9a4f23" />
<text x="48" y="647" font-family="Arial,sans-serif" fill="#18364a" font-size="20">N = 3</text><text x="245" y="647" font-family="Arial,sans-serif" fill="#18364a" font-size="20">4 Ω</text><text x="48" y="737" font-family="Arial,sans-serif" fill="#18364a" font-size="20">N = 1</text><text x="405" y="737" font-family="Arial,sans-serif" fill="#18364a" font-size="20">12 Ω</text>
<text x="125" y="815" font-family="Arial,sans-serif" fill="#18364a" font-size="16">0</text><text x="223" y="815" font-family="Arial,sans-serif" fill="#18364a" font-size="16">4</text><text x="303" y="815" font-family="Arial,sans-serif" fill="#18364a" font-size="16">8</text><text x="380" y="815" font-family="Arial,sans-serif" fill="#18364a" font-size="16">12 Ω</text>
<text x="34" y="858" font-family="Arial,sans-serif" fill="#18364a" font-size="18">Un ramo è ammesso: R coincide con r.</text>
<text x="34" y="940" font-family="Arial,sans-serif" fill="#18364a" font-size="26" font-weight="700">3 · Due preparazioni e la media</text>
<text x="34" y="980" font-family="Arial,sans-serif" fill="#18364a" font-size="20">A: r = 12 Ω, N = 3 ; B: r = 15 Ω, N = 5.</text>
<line x1="150" y1="1020" x2="150" y2="1310" stroke="#526a78" stroke-width="2" /><line x1="150" y1="1310" x2="390" y2="1310" stroke="#526a78" stroke-width="2" />
<rect x="150" y="1040" width="160" height="34" fill="#165a87" /><rect x="150" y="1140" width="120" height="34" fill="#28664d" /><rect x="150" y="1240" width="140" height="34" fill="#9a4f23" />
<text x="80" y="1065" font-family="Arial,sans-serif" fill="#18364a" font-size="20">A</text><text x="326" y="1065" font-family="Arial,sans-serif" fill="#18364a" font-size="20">4 Ω</text><text x="80" y="1165" font-family="Arial,sans-serif" fill="#18364a" font-size="20">B</text><text x="286" y="1165" font-family="Arial,sans-serif" fill="#18364a" font-size="20">3 Ω</text><text x="44" y="1265" font-family="Arial,sans-serif" fill="#18364a" font-size="20">Media</text><text x="306" y="1265" font-family="Arial,sans-serif" fill="#18364a" font-size="20">7/2 Ω</text>
<text x="125" y="1335" font-family="Arial,sans-serif" fill="#18364a" font-size="16">0</text><text x="302" y="1335" font-family="Arial,sans-serif" fill="#18364a" font-size="16">4 Ω</text>
<text x="34" y="1390" font-family="Arial,sans-serif" fill="#18364a" font-size="18">Origine e scala comuni entro ogni pannello di barre.</text>
<text x="34" y="1430" font-family="Arial,sans-serif" fill="#18364a" font-size="18">Ai dati medi: r = 27/2 Ω, N = 4, R = 27/8 Ω.</text>
<text x="34" y="1470" font-family="Arial,sans-serif" fill="#18364a" font-size="18">Le scale dei pannelli 2 e 3 sono indipendenti.</text>
</svg>
