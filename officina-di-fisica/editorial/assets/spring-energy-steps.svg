<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1370" role="img" aria-labelledby="title desc">
<title id="title">Energia elastica: area triangolare e quadrato</title><desc id="desc">Con k due newton al metro e deformazione due metri la forza finale è quattro newton. L’area triangolare sotto il grafico forza deformazione è quattro joule. A rigidezza fissa raddoppiare la deformazione porta da quattro a sedici joule: il grafico dell’energia è quadratico.</desc>
<rect width="640" height="1370" rx="24" fill="#faf8f2"/>
<g font-family="sans-serif" font-size="20" fill="#183746">
<text x="28" y="42" font-size="24" font-weight="bold">1 · La forza cresce durante la deformazione</text>
<text x="28" y="88">k = 2 N/m. Grafico dei moduli nel regime lineare.</text>
<path d="M100 470V170M75 440H465" stroke="#81968d" stroke-width="2" fill="none"/>
<path d="M100 440H340V200Z" fill="#cfe4e5"/>
<path d="M100 440L340 200" stroke="#16728a" stroke-width="3"/>
<path d="M100 200H340M100 320H220V440" stroke="#81968d" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
<circle cx="340" cy="200" r="5" fill="#16728a"/><circle cx="220" cy="320" r="4" fill="#16728a"/>
<text x="32" y="165">F (N)</text><text x="485" y="447">ℓ (m)</text>
<text x="65" y="207">4</text><text x="65" y="327">2</text><text x="65" y="447">0</text>
<text x="94" y="485">0</text><text x="214" y="485">1</text><text x="334" y="485">2</text>
<text x="385" y="215">F_finale = 4 N</text>
<text x="28" y="545">ℓ: 120 px/m; F: 60 px/N. Base 2 m, altezza 4 N.</text>
<text x="28" y="615" font-size="24" font-weight="bold">2 · Prendi metà del rettangolo</text>
<text x="28" y="670">Rettangolo: 2 m · 4 N = 8 J</text>
<text x="28" y="720">Triangolo: U = (1/2) · 2 m · 4 N = 4 J</text>
<text x="28" y="775">La forza finale non agisce costante su tutta la corsa.</text>
<text x="28" y="850" font-size="24" font-weight="bold">3 · L’energia dipende da ℓ²</text>
<text x="28" y="900">Stessa k. ℓ: 80 px/m; U: 10 px/J.</text>
<path d="M100 1200V990M75 1180H465" stroke="#81968d" stroke-width="2" fill="none"/>
<path d="M100 1180Q260 1180 420 1020" stroke="#16728a" stroke-width="3" fill="none"/>
<path d="M100 1140H260V1180M100 1020H420V1180" stroke="#81968d" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
<circle cx="260" cy="1140" r="5" fill="#16728a"/><circle cx="420" cy="1020" r="5" fill="#16728a"/>
<text x="28" y="980">U (J)</text><text x="485" y="1187">ℓ (m)</text>
<text x="50" y="1027">16</text><text x="65" y="1147">4</text><text x="65" y="1187">0</text>
<text x="94" y="1230">0</text><text x="254" y="1230">2</text><text x="414" y="1230">4</text>
<text x="28" y="1290">ℓ raddoppia: U passa da 4 a 16 J, rapporto 4.</text>
<text x="28" y="1340" font-size="18">Zero di U alla configurazione naturale; scale dei grafici diverse.</text>
</g></svg>
