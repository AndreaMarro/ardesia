<title id="title">Sottrarre ampiezze, sommare spostamenti</title><desc id="desc">Tre coseni con zeri distinti mostrano contributi quattro e meno uno e risultante tre millimetri. Barre positive confrontano le ampiezze e i residui di due prove.</desc>
