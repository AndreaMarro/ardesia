<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1710" viewBox="0 0 640 1710" role="img" aria-labelledby="title desc"><title id="title">Stesso volume, corse diverse e quote finali diverse</title><desc id="desc">Grafici area per corsa con asse orizzontale dieci pixel per centimetro quadrato e verticale venti pixel per centimetro. Due per dieci e venti per uno danno venti centimetri cubi, rettangoli di uguale area grafica. Barre volume separate dieci pixel per centimetro cubo. Ultimo esempio di quote: ingresso scende dieci centimetri e uscita sale un centimetro da uno stesso livello, dislivello finale undici centimetri.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1710" rx="20" fill="#faf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Grafici area × corsa, non profili di cilindri</text><text x="28" y="90">Orizzontale: 10 px/cm². Verticale: 20 px/cm.</text><rect x="100" y="250" width="20" height="200" fill="#e7c994"/><rect x="340" y="430" width="200" height="20" fill="#bad9e5"/><path d="M100 200V450H280M340 200V450H590" stroke="#597f83" fill="none"/><text x="28" y="260">10 cm</text><text x="550" y="425">1 cm</text><text x="85" y="505">A_i = 2 cm²</text><text x="355" y="505">A_o = 20 cm²</text><text x="28" y="560">Corsa d_i = 10 cm; corsa d_o = 1 cm.</text><text x="28" y="605">Ogni rettangolo: 4000 px², cioè 20 cm³.</text>
<text x="28" y="685" font-size="25">2 · Il volume ceduto è quello ricevuto</text><rect x="230" y="755" width="200" height="35" fill="#e7c994"/><rect x="230" y="835" width="200" height="35" fill="#bad9e5"/><text x="28" y="782">Ingresso</text><text x="28" y="862">Uscita</text><text x="460" y="782">20 cm³</text><text x="460" y="862">20 cm³</text><text x="28" y="930">Volume: 10 px/cm³, entrambe le barre 200 px.</text><text x="28" y="975">(2 cm²)(10 cm) = (20 cm²)(1 cm).</text><text x="28" y="1020">Nessuna perdita, nessun accumulo elastico.</text>
<text x="28" y="1100" font-size="25">3 · Esempio separato delle quote dopo le corse</text><text x="28" y="1145">Partenza alla stessa quota: linea tratteggiata.</text><path d="M100 1250H540" stroke="#597f83" stroke-dasharray="6 5"/><path d="M180 1250V1450" stroke="#b46145" stroke-width="3" marker-end="url(#a)"/><path d="M460 1250V1230" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><circle cx="180" cy="1450" r="5" fill="#b46145"/><circle cx="460" cy="1230" r="5" fill="#08869b"/><text x="355" y="1190">Uscita: sale 1 cm</text><text x="85" y="1495">Ingresso: scende 10 cm</text><text x="28" y="1550">Quote: 20 px/cm. Dislivello finale = 11 cm.</text><text x="28" y="1595">La continuità resta valida con quote diverse.</text><text x="28" y="1640">Per il lavoro servono anche forze e bilanci energetici.</text><text x="28" y="1685">Le sole corse non fissano pressione o carico.</text></g></svg>
