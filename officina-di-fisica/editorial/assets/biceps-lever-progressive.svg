<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1440" role="img" aria-labelledby="title desc"><title id="title">Avambraccio come leva ideale</title><desc id="desc">Modello biomeccanico semplificato,non rappresentazione anatomica. Asta orizzontale senza peso incernierata al gomito. Carico dieci newton verso il basso a trenta centimetri,forza muscolare sessanta newton verso l’alto a cinque centimetri. Geometria mille pixel per metro,bracci di trecento e cinquanta pixel. Forze due pixel per newton:muscolo centoventi pixel,carico venti pixel,reazione del gomito cento pixel verso il basso nel pannello separato. Due momenti opposti da tre newton metro.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="640" height="1440" rx="24" fill="#faf8f2"/><g font-family="system-ui,sans-serif" font-size="20" fill="#16323f">
<text x="28" y="42" font-size="24" font-weight="700">1 · Una leva biomeccanica idealizzata</text><text x="28" y="90">Avambraccio rigido orizzontale senza peso.</text><text x="28" y="135">Geometria: 1000 px/m. Forze: 2 px/N.</text><path d="M100 350H400" stroke="#81968d" stroke-width="6"/><circle cx="100" cy="350" r="8" fill="#16323f"/><path d="M150 350V230" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><path d="M400 350V370" stroke="#b44b2c" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="260">F = 60 N</text><text x="430" y="385">W = 10 N</text><text x="78" y="402">O</text><path d="M100 430H150M100 420V440M150 420V440" stroke="#81968d" stroke-width="2"/><text x="90" y="478">b = 5 cm</text><path d="M100 515H400M100 505V525M400 505V525" stroke="#81968d" stroke-width="2"/><text x="225" y="565">L = 30 cm</text><text x="28" y="610" font-size="18">Forza muscolare verticale nell’esempio. Cerniera priva di coppia.</text>
<text x="28" y="690" font-size="24" font-weight="700">2 · Compensa il momento del carico</text><text x="28" y="745">Antiorario positivo: F b − W L = 0.</text><text x="28" y="795">F b = (60 N)(1/20 m) = +3 N·m</text><text x="28" y="845">−W L = −(10 N)(3/10 m) = −3 N·m</text><text x="28" y="895">F/W = L/b = 30/5 = 6. Il braccio corto costa forza.</text>
<text x="28" y="975" font-size="24" font-weight="700">3 · Equilibra anche le forze verticali</text><text x="28" y="1020">Proiezioni separate, stessa scala 2 px/N.</text><path d="M160 1170V1050" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 1170V1190" stroke="#b44b2c" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 1170V1270" stroke="#746493" stroke-width="3" marker-end="url(#arrow)"/><text x="103" y="1230">F = 60 N</text><text x="278" y="1230">W = 10 N</text><text x="435" y="1320">R_O = 50 N</text><text x="28" y="1370">Verso l’alto: 60 N − 10 N − 50 N = 0.</text><text x="28" y="1410" font-size="18">La reazione agisce nel gomito e non compensa momenti residui.</text>
</g></svg>
