<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1560" width="640" height="1560" role="img" aria-labelledby="title desc">
<title id="title">Ampiezza, intervalli fra massimi e altezze decrescenti</title>
<desc id="desc">Gli estremi a più e meno sette millimetri distano ciascuno sette millimetri dal centro. Sei massimi da zero virgola dieci a zero virgola ottantacinque secondi delimitano cinque intervalli di zero virgola quindici secondi. Tre barre di altezze otto, sei e quattro virgola cinque millimetri rappresentano massimi successivi.</desc>
<rect width="640" height="1560" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" font-size="23" fill="#202c39">
<text x="32" y="52" font-size="27" font-weight="bold">1. Dal centro a un solo estremo</text>
<text x="32" y="95">Posizioni rispetto all’equilibrio, in mm.</text>
<path d="M320 150V480M130 320H510" fill="none" stroke="#304d63" stroke-width="3"/>
<path d="M140 180H480M140 460H480" fill="none" stroke="#899a9f" stroke-width="2" stroke-dasharray="7 7"/>
<circle cx="320" cy="180" r="8" fill="#26728d"/><circle cx="320" cy="460" r="8" fill="#26728d"/>
<text x="78" y="188">+7</text><text x="89" y="328">0</text><text x="78" y="468">−7</text>
<path d="M500 180V320M490 180H510M490 320H510M500 320V460M490 460H510" fill="none" stroke="#986c35" stroke-width="3"/>
<text x="516" y="257">7 mm</text><text x="516" y="397">7 mm</text>
<text x="32" y="520">Ampiezza: 7 mm. Corsa completa: 14 mm.</text>
<line x1="32" y1="555" x2="608" y2="555" stroke="#b8c4ca"/>
<text x="32" y="612" font-size="27" font-weight="bold">2. Sei tacche, cinque intervalli</text>
<text x="32" y="655">Massimi consecutivi del medesimo moto.</text>
<path d="M90 760H550" fill="none" stroke="#304d63" stroke-width="3"/>
<g stroke="#26728d" stroke-width="4"><path d="M100 745V775M180 745V775M260 745V775M340 745V775M420 745V775M500 745V775"/></g>
<text x="76" y="815">0,10</text><text x="156" y="815">0,25</text><text x="236" y="815">0,40</text><text x="316" y="815">0,55</text><text x="396" y="815">0,70</text><text x="476" y="815">0,85</text>
<text x="525" y="855">t (s)</text>
<path d="M100 875V895H500V875" fill="none" stroke="#986c35" stroke-width="3"/>
<text x="151" y="940">Tempo complessivo: 0,75 s</text>
<text x="32" y="995">Ogni intervallo dura 0,75 s / 5 = 0,15 s.</text>
<line x1="32" y1="1030" x2="608" y2="1030" stroke="#b8c4ca"/>
<text x="32" y="1085" font-size="27" font-weight="bold">3. L’altezza non è un tempo</text>
<text x="32" y="1128">Altezze di tre massimi successivi.</text>
<path d="M140 1180V1440H580" fill="none" stroke="#304d63" stroke-width="3"/>
<text x="32" y="1195">A (mm)</text><text x="98" y="1288">8</text><text x="98" y="1328">6</text><text x="75" y="1358">4,5</text>
<path d="M140 1280H220M140 1320H360M140 1350H500" fill="none" stroke="#899a9f" stroke-dasharray="5 6" stroke-width="2"/>
<rect x="190" y="1280" width="60" height="160" fill="#26728d"/><rect x="330" y="1320" width="60" height="120" fill="#986c35"/><rect x="470" y="1350" width="60" height="90" fill="#4e876d"/>
<text x="109" y="1470">0</text><text x="213" y="1474">1</text><text x="353" y="1474">2</text><text x="493" y="1474">3</text>
<text x="32" y="1525">Ordine dei massimi; stessa scala verticale.</text>
</g></svg>
