<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1270" role="img" aria-labelledby="title desc"><title id="title">Urto fra masse uguali in versi opposti</title><desc id="desc">Masse uguali illustrative quattro chilogrammi. Il primo corpo va a destra a quattro metri al secondo, il secondo a sinistra a un metro al secondo. Dopo l’urto si uniscono e vanno a destra a tre mezzi metri al secondo. Quantità di moto totale dodici chilogrammi metro al secondo; energia cinetica scende da trentaquattro a nove joule.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="640" height="1270" rx="24" fill="#faf8f2"/><g font-family="sans-serif" font-size="20" fill="#183746">
<text x="28" y="42" font-size="24" font-weight="bold">1 · I due contributi hanno segni opposti</text><text x="28" y="88">Asse +x a destra. Massa illustrativa: 4 kg ciascuno.</text><rect x="100" y="220" width="60" height="55" fill="#cfe4e5" stroke="#183746"/><rect x="400" y="220" width="60" height="55" fill="#e7d8bf" stroke="#183746"/><path d="M130 180H290" stroke="#16728a" stroke-width="3" marker-end="url(#a)"/><path d="M430 180H390" stroke="#b84e32" stroke-width="3" marker-end="url(#a)"/><text x="140" y="145">+u = +4 m/s</text><text x="405" y="145">−w = −1 m/s</text><text x="28" y="350">p_i = 4 · 4 − 4 · 1 = +12 kg·m/s</text>
<text x="28" y="430" font-size="24" font-weight="bold">2 · Massa finale doppia, velocità comune</text><rect x="220" y="560" width="70" height="55" fill="#cfe4e5" stroke="#183746"/><rect x="290" y="560" width="70" height="55" fill="#e7d8bf" stroke="#183746"/><path d="M290 520H350" stroke="#16728a" stroke-width="3" marker-end="url(#a)"/><text x="380" y="527">V = +3/2 m/s</text><text x="28" y="675">p_f = 8 · (3/2) = +12 kg·m/s</text><text x="28" y="720">Velocità: 40 px per m/s, uguale nei due pannelli.</text>
<text x="28" y="800" font-size="24" font-weight="bold">3 · Controlla anche l’energia cinetica</text><text x="28" y="850">Senza lavoro esterno. Energia: 5 px/J.</text><path d="M180 890V1080" stroke="#81968d" stroke-width="2"/><rect x="180" y="915" width="170" height="35" fill="#cfe4e5"/><rect x="180" y="1010" width="45" height="35" fill="#cfe4e5"/><text x="28" y="940">K_i = 34 J</text><text x="28" y="1035">K_f = 9 J</text><text x="370" y="1035">ΔK = −25 J</text><text x="28" y="1130">25 J passano all’energia interna; p resta conservata.</text><text x="28" y="1180">Per ogni m &gt; 0: V = (u − w)/2.</text><text x="28" y="1230" font-size="18">Corpi schematici; scale diverse per velocità ed energia.</text></g></svg>
