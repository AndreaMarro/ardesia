<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1490" viewBox="0 0 640 1490" role="img" aria-labelledby="title desc"><title id="title">Cariche d’armatura e capacità</title><desc id="desc">Sei simboli positivi e sei negativi rappresentano sei microcoulomb su ciascuna armatura con segni opposti. Grafico della carica su una piastra contro la tensione a capacità due microfarad costante. Barre dei moduli sei, cinque e undici mezzi microcoulomb.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185d83"/></marker></defs><rect width="640" height="1490" rx="16" fill="#f7f9fc"/>
<text x="32" y="44" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">1 · Due segni, un modulo per armatura</text>
<text x="32" y="84" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C = 2 μF ; V = 3 V ; ogni segno vale 1 μC.</text>
<rect x="130" y="140" width="12" height="245" fill="#b85322"/>
<rect x="500" y="140" width="12" height="245" fill="#185d83"/>
<text x="155" y="170" font-family="Arial,sans-serif" font-size="24" fill="#182c46">+</text>
<text x="470" y="170" font-family="Arial,sans-serif" font-size="24" fill="#182c46">−</text>
<text x="155" y="210" font-family="Arial,sans-serif" font-size="24" fill="#182c46">+</text>
<text x="470" y="210" font-family="Arial,sans-serif" font-size="24" fill="#182c46">−</text>
<text x="155" y="250" font-family="Arial,sans-serif" font-size="24" fill="#182c46">+</text>
<text x="470" y="250" font-family="Arial,sans-serif" font-size="24" fill="#182c46">−</text>
<text x="155" y="290" font-family="Arial,sans-serif" font-size="24" fill="#182c46">+</text>
<text x="470" y="290" font-family="Arial,sans-serif" font-size="24" fill="#182c46">−</text>
<text x="155" y="330" font-family="Arial,sans-serif" font-size="24" fill="#182c46">+</text>
<text x="470" y="330" font-family="Arial,sans-serif" font-size="24" fill="#182c46">−</text>
<text x="155" y="370" font-family="Arial,sans-serif" font-size="24" fill="#182c46">+</text>
<text x="470" y="370" font-family="Arial,sans-serif" font-size="24" fill="#182c46">−</text>
<text x="230" y="245" font-family="Arial,sans-serif" font-size="21" fill="#182c46">+Q = +6 μC</text>
<text x="230" y="295" font-family="Arial,sans-serif" font-size="21" fill="#182c46">−Q = −6 μC</text>
<text x="32" y="430" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Modulo su una piastra: Q = 6 μC ; totale = 0.</text>
<path d="M32 475H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="523" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">2 · Q(V) a capacità mantenuta fissa</text>
<text x="32" y="565" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Pendenza C = 2 μF.</text>
<text x="32" y="615" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Q / μC</text>
<path d="M150 630V850H530" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M450 850V670H150" fill="none" stroke="#aabaca" stroke-width="2"/>
<path d="M150 850L450 670" fill="none" stroke="#185d83" stroke-width="4"/>
<circle cx="150" cy="850" r="5" fill="#f7f9fc"/>
<circle cx="150" cy="850" r="5" fill="none" stroke="#185d83" stroke-width="2"/>
<circle cx="250" cy="790" r="4" fill="#185d83"/>
<circle cx="450" cy="670" r="5" fill="#185d83"/>
<text x="118" y="678" font-family="Arial,sans-serif" font-size="21" fill="#182c46">6</text>
<text x="118" y="880" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="445" y="880" font-family="Arial,sans-serif" font-size="21" fill="#182c46">3</text>
<text x="538" y="858" font-family="Arial,sans-serif" font-size="21" fill="#182c46">V / V</text>
<text x="266" y="802" font-family="Arial,sans-serif" font-size="21" fill="#182c46">1 V, 2 μC</text>
<text x="32" y="940" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Stati con V &gt; 0 ; origine mostrata come limite.</text>
<text x="32" y="980" font-family="Arial,sans-serif" font-size="21" fill="#182c46">La prova B sotto ha capacità diversa.</text>
<path d="M32 1020H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="1068" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">3 · Media dei moduli, non dei segni</text>
<text x="32" y="1110" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A: 2 μF, 3 V ; B: 1 μF, 5 V.</text>
<path d="M150 1140V1380" fill="none" stroke="#182c46" stroke-width="2"/>
<rect x="150" y="1155" width="300" height="42" fill="#185d83"/>
<text x="32" y="1185" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="468" y="1185" font-family="Arial,sans-serif" font-size="21" fill="#182c46">6 μC</text>
<rect x="150" y="1235" width="250" height="42" fill="#b85322"/>
<text x="32" y="1265" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="418" y="1265" font-family="Arial,sans-serif" font-size="21" fill="#182c46">5 μC</text>
<rect x="150" y="1315" width="275" height="42" fill="#35654e"/>
<text x="32" y="1345" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Media</text>
<text x="443" y="1345" font-family="Arial,sans-serif" font-size="21" fill="#182c46">11/2 μC</text>
<text x="118" y="1406" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="32" y="1450" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Stessa origine e scala delle tre barre.</text>
</svg>
