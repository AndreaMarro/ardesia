<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1390" viewBox="0 0 640 1390" role="img" aria-labelledby="title desc">
<title id="title">Una molla cede energia al blocco</title><desc id="desc">Tre tappe: compressione iniziale, distacco e area del grafico forza compressione. Geometria 100 pixel per metro, rapidità 80 pixel per metro al secondo; assi del grafico con scale proprie.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1390" rx="20" fill="#faf8f1"/>
<g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Un joule nella molla compressa</text><text x="28" y="90">k = 2 N/m; m = 2 kg; blocco inizialmente fermo.</text>
<path d="M100 140V280M100 240H550" stroke="#6b8685" stroke-width="2" fill="none"/><path d="M100 200H120L135 180L155 220L175 180L195 220L215 180L235 220L255 180L275 220L290 200H300" fill="none" stroke="#08869b" stroke-width="3"/><rect x="300" y="170" width="60" height="70" fill="#cde4e6" stroke="#193a49"/>
<path d="M400 140V300" stroke="#a2b9b5" stroke-dasharray="6 5"/><path d="M300 290H400M300 282V298M400 282V298" stroke="#193a49" fill="none"/><text x="300" y="330">ℓ = 1 m</text><text x="28" y="380">Estremo libero naturale: linea tratteggiata.</text><text x="28" y="425">Geometria: 100 px/m. U iniziale = 1 J.</text>
<text x="28" y="500" font-size="25">2 · Alla lunghezza naturale si stacca</text>
<path d="M100 545V680M100 640H550" stroke="#6b8685" stroke-width="2" fill="none"/><path d="M100 600H120L145 580L175 620L205 580L235 620L265 580L295 620L325 580L355 620L380 600H400" fill="none" stroke="#08869b" stroke-width="3"/><rect x="400" y="570" width="60" height="70" fill="#cde4e6" stroke="#193a49"/>
<path d="M430 540H510" fill="none" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><text x="350" y="700">V = 1 m/s verso destra</text><text x="28" y="750">Rapidità: 80 px per m/s; K finale = 1 J.</text><text x="28" y="795">Dopo il distacco la molla non tira il blocco.</text>
<text x="28" y="875" font-size="25">3 · La forza non resta al valore iniziale</text><path d="M100 1170V930M75 1140H460" stroke="#6b8685" stroke-width="2" fill="none"/><path d="M100 1140H300V980Z" fill="#cde4e6"/><path d="M100 1140L300 980" stroke="#08869b" stroke-width="3"/><text x="28" y="925">|F| (N)</text><text x="65" y="990">2</text><text x="75" y="1165">0</text><text x="290" y="1175">1</text><text x="420" y="1195">q (m)</text><text x="190" y="1110">1 J</text>
<text x="28" y="1240">q: compressione residua. 200 px/m, 80 px/N.</text><text x="28" y="1285">Area = (1 m)(2 N)/2 = 1 J.</text><text x="28" y="1330">Rilascio: q passa da 1 m a 0; lavoro +1 J.</text><text x="28" y="1365">Nessun attrito, nessuna variazione di quota.</text></g></svg>
