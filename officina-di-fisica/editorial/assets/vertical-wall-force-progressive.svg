<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1470" viewBox="0 0 640 1470" role="img" aria-labelledby="title desc"><title id="title">Pressione variabile e forza netta sulla parete</title><desc id="desc">Parete due metri per due alla scala cento pixel per metro. Profilo laterale con profondità alla stessa scala e segmenti normali proporzionali alla pressione relativa quattro pixel per kilopascal. Pressione media dieci kilopascal su quattro metri quadrati, forza quaranta kilonewton in proiezione separata cinque pixel per kilonewton.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1470" rx="20" fill="#faf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Vista frontale della parete bagnata</text><text x="28" y="90">b = 2 m, h = 2 m. Scala: 100 px/m.</text><rect x="100" y="160" width="200" height="200" fill="#bad9e5" stroke="#597f83" stroke-width="3"/><path d="M80 160H320" stroke="#08869b" stroke-dasharray="6 5"/><path d="M100 400H300M100 390V410M300 390V410M350 160V360M340 160H360M340 360H360" stroke="#193a49" fill="none"/><text x="160" y="445">b = 2 m</text><text x="375" y="270">h = 2 m</text><text x="385" y="165">pelo libero</text><text x="28" y="495">Area bagnata A = 4 m²; stessa atmosfera ai lati.</text>
<text x="28" y="575" font-size="25">2 · Profilo laterale: pressione crescente</text><text x="28" y="620">z verso il basso; p relativa = ρgz.</text><path d="M250 680V880" stroke="#597f83" stroke-width="4"/><path d="M250 730H270" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M250 780H290" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M250 830H310" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M250 880H330" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M250 680L330 880" stroke="#8fb4b9" stroke-dasharray="5 5" fill="none"/><text x="95" y="685">z = 0</text><text x="370" y="685">p = 0</text><text x="95" y="885">z = 2 m</text><text x="370" y="885">p = 20 kPa</text><text x="28" y="945">Profondità: 100 px/m. Segmenti: 4 px/kPa.</text><text x="28" y="990">Il verso indica la forza normale sulla parete.</text><text x="28" y="1035">Pressione media = (0 + 20)/2 = 10 kPa.</text>
<text x="28" y="1115" font-size="25">3 · Sommare le forze, non usare il massimo</text><text x="28" y="1170">F = pressione media × area bagnata.</text><text x="28" y="1215">F = (10 kPa)(4 m²) = 40 kN.</text><path d="M150 1290H350" stroke="#08869b" stroke-width="4" marker-end="url(#a)"/><text x="390" y="1297">F = 40 kN</text><text x="28" y="1350">Proiezione separata: 5 px/kN; lunghezza 200 px.</text><text x="28" y="1395">Qui non si rappresenta il punto di applicazione.</text><text x="28" y="1440">Pressione di fondo per tutta l’area darebbe 80 kN.</text></g></svg>
