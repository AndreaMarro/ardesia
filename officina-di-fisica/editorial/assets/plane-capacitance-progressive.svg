<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2040" viewBox="0 0 640 2040" role="img" aria-labelledby="title desc"><title id="title">Capacità, materiale conduttore e campo tra piastre</title><desc id="desc">Quattro pannelli distinti: geometria schematica del condensatore; campo nullo nel materiale conduttore all’equilibrio; campo uniforme da quaranta volt a zero volt fra piastre distanti due centimetri; barre quantitative delle capacità cento, duecento e centocinquanta picofarad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185d83"/></marker></defs><rect width="640" height="2040" rx="16" fill="#f7f9fc"/>
<text x="32" y="44" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">1 · Geometria e permittività</text>
<text x="32" y="84" font-family="Arial,sans-serif" font-size="21" fill="#182c46">ε = 10 pF/m ; modello ideale senza bordi.</text>
<text x="32" y="124" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Vista in sezione: quote schematiche.</text>
<rect x="180" y="190" width="320" height="12" fill="#185d83"/>
<rect x="180" y="280" width="320" height="12" fill="#b85322"/>
<text x="210" y="176" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Area affacciata A = 100 cm²</text>
<text x="190" y="245" font-family="Arial,sans-serif" font-size="21" fill="#182c46">dielettrico uniforme</text>
<path d="M530 202V280" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M522 202H538M522 280H538" fill="none" stroke="#182c46" stroke-width="2"/>
<text x="32" y="341" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Separazione d = 1 mm ; C = 100 pF.</text>
<text x="32" y="385" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Lati e distanza non sono in scala reciproca.</text>
<path d="M32 430H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="480" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">2 · Un altro caso: il materiale conduttore</text>
<text x="32" y="520" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Equilibrio elettrostatico, anche con campo esterno.</text>
<rect x="170" y="590" width="320" height="160" fill="#dce7ef"/>
<path d="M50 620H130" fill="none" stroke="#185d83" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M530 620H610" fill="none" stroke="#185d83" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M50 700H130" fill="none" stroke="#185d83" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M530 700H610" fill="none" stroke="#185d83" stroke-width="3" marker-end="url(#arrow)"/>
<text x="178" y="620" font-family="Arial,sans-serif" font-size="23" fill="#182c46">−</text>
<text x="464" y="620" font-family="Arial,sans-serif" font-size="23" fill="#182c46">+</text>
<text x="178" y="665" font-family="Arial,sans-serif" font-size="23" fill="#182c46">−</text>
<text x="464" y="665" font-family="Arial,sans-serif" font-size="23" fill="#182c46">+</text>
<text x="178" y="710" font-family="Arial,sans-serif" font-size="23" fill="#182c46">−</text>
<text x="464" y="710" font-family="Arial,sans-serif" font-size="23" fill="#182c46">+</text>
<text x="250" y="653" font-family="Arial,sans-serif" font-size="21" fill="#182c46">E = 0</text>
<text x="220" y="705" font-family="Arial,sans-serif" font-size="21" fill="#182c46">potenziale uniforme</text>
<text x="32" y="800" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Le cariche libere si sono ridistribuite.</text>
<text x="32" y="840" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Questo pannello riguarda il materiale, non la cavità.</text>
<path d="M32 890H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="940" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">3 · Campo tra le armature</text>
<text x="32" y="982" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Caso distinto: 40 V su una distanza di 2 cm.</text>
<rect x="140" y="1070" width="12" height="260" fill="#b85322"/>
<rect x="500" y="1070" width="12" height="260" fill="#185d83"/>
<text x="112" y="1044" font-family="Arial,sans-serif" font-size="21" fill="#182c46">+40 V</text>
<text x="484" y="1044" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0 V</text>
<path d="M220 1120H425" fill="none" stroke="#185d83" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M220 1200H425" fill="none" stroke="#185d83" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M220 1280H425" fill="none" stroke="#185d83" stroke-width="3" marker-end="url(#arrow)"/>
<text x="255" y="1163" font-family="Arial,sans-serif" font-size="21" fill="#182c46">E verso destra</text>
<path d="M152 1360H500" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M152 1352V1368M500 1352V1368" fill="none" stroke="#182c46" stroke-width="2"/>
<text x="292" y="1397" font-family="Arial,sans-serif" font-size="21" fill="#182c46">2 cm</text>
<text x="32" y="1440" font-family="Arial,sans-serif" font-size="21" fill="#182c46">E = 2000 V/m ; metallo e spazio interno distinti.</text>
<path d="M32 1490H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="1540" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">4 · Capacità di prove separate</text>
<text x="32" y="1582" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A: 100 cm², 1 mm ; B: 400 cm², 2 mm.</text>
<path d="M150 1625V1900" fill="none" stroke="#182c46" stroke-width="2"/>
<rect x="150" y="1645" width="160" height="42" fill="#185d83"/>
<text x="32" y="1675" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="328" y="1675" font-family="Arial,sans-serif" font-size="21" fill="#182c46">100 pF</text>
<rect x="150" y="1730" width="320" height="42" fill="#b85322"/>
<text x="32" y="1760" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="488" y="1760" font-family="Arial,sans-serif" font-size="21" fill="#182c46">200 pF</text>
<rect x="150" y="1815" width="240" height="42" fill="#35654e"/>
<text x="32" y="1845" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Media</text>
<text x="408" y="1845" font-family="Arial,sans-serif" font-size="21" fill="#182c46">150 pF</text>
<text x="118" y="1930" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="32" y="1980" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Barre con origine e scala comuni nel pannello.</text>
</svg>
