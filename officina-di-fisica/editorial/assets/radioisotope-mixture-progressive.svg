<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc"><title id="title">Due genitori, due contributi di attività</title><desc id="desc">Tre tappe: le due attività iniziali da otto becquerel diventano quattro e due dopo un’ora; somma affine al variare soltanto del primo ingresso; due preparazioni hanno attività totali sei e dodici con media nove becquerel.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1600" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Due genitori, due contributi di attività</text><text x="32" y="96" font-size="22" text-anchor="start">1 · Una ora, due emivite diverse</text><text x="32" y="142" font-size="18" text-anchor="start">Blu: primo genitore · Ocra: secondo genitore</text><text x="128" y="223" font-size="18" text-anchor="end">0 h</text><rect x="150" y="200" width="160" height="30" fill="#316b9b"/><rect x="310" y="200" width="160" height="30" fill="#a76d20"/><text x="230.0" y="270" font-size="18" text-anchor="middle">8 Bq</text><text x="390.0" y="270" font-size="18" text-anchor="middle">8 Bq</text><text x="128" y="353" font-size="18" text-anchor="end">1 h</text><rect x="150" y="330" width="80" height="30" fill="#316b9b"/><rect x="230" y="330" width="40" height="30" fill="#a76d20"/><text x="190.0" y="400" font-size="18" text-anchor="middle">4 Bq</text><text x="250.0" y="400" font-size="18" text-anchor="middle">2 Bq</text><text x="32" y="465" font-size="18" text-anchor="start">T½ del primo: 1 h · T½ del secondo: 30 min</text><text x="32" y="535" font-size="22" text-anchor="start">2 · Varia solo A₁; A₂ resta 8 Bq</text><line x1="145" y1="1000" x2="550" y2="1000" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1005" x2="150" y2="630" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="610" font-size="18" text-anchor="start">A_tot dopo 1 h (Bq)</text><text x="465" y="1070" font-size="18" text-anchor="start">A₁ (Bq)</text><line x1="150" y1="940" x2="470" y2="700" stroke="#52667a" stroke-width="2"/><circle cx="150" cy="940" r="4" fill="none" stroke="#316b9b" stroke-width="2"/><text x="128" y="1040" font-size="18" text-anchor="end">0</text><circle cx="310" cy="820" r="5" fill="#316b9b"/><line x1="310" y1="994" x2="310" y2="1006" stroke="#52667a" stroke-width="2"/><text x="310" y="1040" font-size="18" text-anchor="middle">8</text><line x1="144" y1="820" x2="156" y2="820" stroke="#52667a" stroke-width="2"/><text x="130" y="826" font-size="18" text-anchor="end">6</text><circle cx="470" cy="700" r="5" fill="#316b9b"/><line x1="470" y1="994" x2="470" y2="1006" stroke="#52667a" stroke-width="2"/><text x="470" y="1040" font-size="18" text-anchor="middle">16</text><line x1="144" y1="700" x2="156" y2="700" stroke="#52667a" stroke-width="2"/><text x="130" y="706" font-size="18" text-anchor="end">10</text><line x1="144" y1="940" x2="156" y2="940" stroke="#52667a" stroke-width="2"/><text x="130" y="946" font-size="18" text-anchor="end">2</text><text x="32" y="1130" font-size="22" text-anchor="start">3 · Due preparazioni e la media del totale</text><text x="32" y="1170" font-size="18" text-anchor="start">A: A₁ = A₂ = 8 Bq · B: A₁ = A₂ = 16 Bq</text><text x="128" y="1243" font-size="18" text-anchor="end">A</text><rect x="150" y="1220" width="150" height="30" fill="#316b9b"/><text x="312" y="1243" font-size="18" text-anchor="start">6 Bq</text><text x="128" y="1343" font-size="18" text-anchor="end">B</text><rect x="150" y="1320" width="300" height="30" fill="#316b9b"/><text x="462" y="1343" font-size="18" text-anchor="start">12 Bq</text><text x="128" y="1443" font-size="18" text-anchor="end">Media</text><rect x="150" y="1420" width="225" height="30" fill="#316b9b"/><text x="387" y="1443" font-size="18" text-anchor="start">9 Bq</text><text x="32" y="1515" font-size="18" text-anchor="start">Le tre barre del totale hanno la stessa scala.</text><text x="32" y="1560" font-size="18" text-anchor="start">Nel grafico, A₁ = 0 è solo un limite di bordo.</text></g></svg>
