<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1390" role="img" aria-labelledby="title desc">
<title id="title">Il campo equilibra il peso della carica positiva</title>
<desc id="desc">Una massa di un milligrammo con carica due microcoulomb è in equilibrio in un campo verso l’alto di cinque newton al coulomb. La forza elettrica e il peso valgono entrambi dieci micronewton e hanno versi opposti. Le conversioni portano entrambi i prefissi a dieci alla meno sei in SI. Le barre confrontano campi cinque e venti e la media venticinque mezzi.</desc>
<defs><marker id="electric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#28664d"/></marker><marker id="weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker><marker id="field" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#165a87"/></marker></defs>
<rect width="640" height="1390" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Due forze sullo stesso corpo</text>
<text x="32" y="85" font-size="18">g = 10 m/s² ; verso positivo verticale verso l’alto.</text>
<path d="M100 400V145" stroke="#165a87" stroke-width="4" marker-end="url(#field)"/>
<text x="35" y="126" fill="#165a87">E = 5 N/C</text>
<circle cx="320" cy="260" r="28" fill="#fce6dc" stroke="#b45328" stroke-width="2"/>
<text x="310" y="270" font-size="28">+</text>
<path d="M320 232V120" stroke="#28664d" stroke-width="5" marker-end="url(#electric)"/>
<path d="M320 288V400" stroke="#b45328" stroke-width="5" marker-end="url(#weight)"/>
<text x="355" y="171" fill="#28664d">qE = 10 μN</text>
<text x="355" y="363" fill="#b45328">mg = 10 μN</text>
<text x="240" y="440">m = 1 mg ; q = 2 μC</text>
<text x="32" y="480" font-size="18">qE − mg = 0 ; le due forze restano non nulle.</text>
<path d="M32 510H608" stroke="#9babbc"/>
<text x="32" y="554" font-size="25" font-weight="bold">2 · Dalle unità al quoziente</text>
<text x="65" y="602">m = 1 mg = 10⁻⁶ kg</text>
<text x="65" y="647">q = 2 μC = 2 · 10⁻⁶ C</text>
<text x="65" y="692">m g = 10 · 10⁻⁶ N</text>
<text x="65" y="737">E = (10 · 10⁻⁶ N) / (2 · 10⁻⁶ C) = 5 N/C</text>
<text x="32" y="785" font-size="18">Un milligrammo è 10⁻³ g, quindi 10⁻⁶ kg.</text>
<text x="32" y="817" font-size="18">Campo e forza non hanno la stessa unità.</text>
<path d="M32 849H608" stroke="#9babbc"/>
<text x="32" y="893" font-size="25" font-weight="bold">3 · Media dei campi necessari</text>
<path d="M130 920V1195" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="945" width="80" height="38" fill="#165a87"/>
<rect x="130" y="1025" width="320" height="38" fill="#165a87"/>
<rect x="130" y="1105" width="200" height="38" fill="#28664d"/>
<text x="50" y="973">A</text><text x="230" y="973">5 N/C</text>
<text x="50" y="1053">B</text><text x="470" y="1053">20 N/C</text>
<text x="32" y="1133">Media</text><text x="350" y="1133">25/2 N/C</text>
<text x="104" y="1189">0</text>
<text x="32" y="1237" font-size="18">A: m = 1 mg, q = 2 μC ; B: m = 2 mg, q = 1 μC.</text>
<text x="32" y="1269" font-size="18">Moduli in N/C, origine e scala comuni.</text>
<text x="32" y="1301" font-size="18">Ai dati medi si avrebbe 10 N/C, non questa media.</text>
<text x="32" y="1333" font-size="18">Le frecce in alto riguardano la sola prova A.</text>
<text x="32" y="1365" font-size="18">Per equilibrare il peso, q &gt; 0 richiede E verso l’alto.</text>
</g></svg>
