<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif" font-size="21" fill="#272536" stroke-linejoin="round" stroke-linecap="round">
<title id="title">Potenziale, campo e variazioni di energia</title><desc id="desc">Tre problemi distinti: potenziale in P da due sorgenti equidistanti; piani equipotenziali in campo uniforme; variazioni opposte di energia potenziale e cinetica di un elettrone. Le barre delle due variazioni condividono origine e scala, non descrivono energie assolute.</desc><defs><marker id="g" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#147c76"/></marker><marker id="v" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#6852a3"/></marker></defs><rect width="640" height="1540" fill="#fffdf7"/>

<text x="40" y="55" font-size="25" font-weight="bold">1 · Sommare potenziali con i segni</text><text x="40" y="108">Nel vuoto, con zero all’infinito.</text>
<path d="M140 250H500" fill="none" stroke="#999" stroke-dasharray="6 4"/><circle cx="140" cy="250" r="6" fill="#ae4740"/><circle cx="500" cy="250" r="6" fill="#6852a3"/><circle cx="320" cy="250" r="4" fill="#272536"/>
<text x="140" y="195" text-anchor="middle">+2,0 nC</text><text x="500" y="195" text-anchor="middle">−1,0 nC</text><text x="320" y="220" text-anchor="middle">P</text>
<path d="M140 290V315H320V290M320 315H500V290" fill="none" stroke="#888"/><text x="230" y="355" text-anchor="middle">0,10 m</text><text x="410" y="355" text-anchor="middle">0,10 m</text><text x="125" y="415">+180 V − 90 V = 90 V</text>
<path d="M40 465H600" stroke="#cbc6bc"/>
<text x="40" y="520" font-size="25" font-weight="bold">2 · Campo uniforme fra equipotenziali</text>
<text x="140" y="620" text-anchor="middle">12 V</text><text x="240" y="620" text-anchor="middle">8 V</text><text x="340" y="620" text-anchor="middle">4 V</text><text x="440" y="620" text-anchor="middle">0 V</text>
<path d="M140 650V840M240 650V840M340 650V840M440 650V840" fill="none" stroke="#6852a3" stroke-width="2"/><path d="M180 760H400" fill="none" stroke="#147c76" stroke-width="3" marker-end="url(#g)"/><text x="470" y="767">E</text>
<path d="M140 865V885H440V865" fill="none" stroke="#888"/><text x="290" y="930" text-anchor="middle">3,0 cm</text><text x="65" y="980">E = (12 V) / (0,030 m) = 400 V/m</text>
<path d="M40 1020H600" stroke="#cbc6bc"/>
<text x="40" y="1080" font-size="25" font-weight="bold">3 · Due variazioni opposte</text><text x="40" y="1130">Elettrone: q = −e ; da 2 V a 17 V</text>
<path d="M320 1180V1470" fill="none" stroke="#888"/>
<rect x="140" y="1230" width="180" height="50" fill="#b45d48"/><rect x="320" y="1360" width="180" height="50" fill="#147c76"/>
<text x="55" y="1265">ΔU</text><text x="55" y="1395">ΔK</text><text x="205" y="1210">−15 eV</text><text x="380" y="1450">+15 eV</text><text x="320" y="1510" text-anchor="middle">0</text>

</svg>
