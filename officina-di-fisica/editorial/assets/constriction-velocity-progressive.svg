<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1530" viewBox="0 0 640 1530" role="img" aria-labelledby="title desc"><title id="title">Sezioni diverse trasportano lo stesso volume per secondo</title><desc id="desc">Canale rettangolare, profondità fuori foglio un centimetro, altezze quattro e due centimetri a cinquanta pixel per centimetro. Frecce separate di ottanta e centosessanta pixel a quaranta pixel per centimetro al secondo. Grafici area per avanzamento in un secondo, assi venti pixel per centimetro quadrato e quaranta pixel per centimetro, rettangoli ottanta per ottanta e quaranta per centosessanta. Apparati distinti hanno portate otto e sei centimetri cubi al secondo.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1530" rx="20" fill="#faf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Un solo tubo, stessa Q nelle due sezioni</text><text x="28" y="90">Canale rettangolare, profondità fuori foglio1cm.</text><path d="M60 200H220L340 250H560V350H340L220 400H60Z" fill="#bad9e5"/><path d="M60 200H220L340 250H560M60 400H220L340 350H560" fill="none" stroke="#597f83" stroke-width="3"/><path d="M100 300H180" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M370 300H530" stroke="#b46145" stroke-width="3" marker-end="url(#a)"/><text x="65" y="160">Altezza4cm</text><text x="375" y="205">Altezza2cm</text><text x="60" y="450">A₁ = 4cm²; v₁ = 2cm/s</text><text x="350" y="450">A₂ = 2cm²; v₂ = 4cm/s</text><text x="28" y="505">Geometria:50px/cm. Velocità:40px/(cm/s).</text><text x="28" y="550">Q = 8cm³/s in entrambe le sezioni.</text><text x="28" y="635" font-size="25">2 · Grafici area × avanzamento, Δt = 1s</text><rect x="120" y="740" width="80" height="80" fill="#e7c994"/><rect x="380" y="660" width="40" height="160" fill="#bad9e5"/><path d="M120 650V820H280M380 650V820H540" fill="none" stroke="#597f83"/><text x="50" y="780">2cm</text><text x="445" y="730">4cm</text><text x="115" y="865">4cm²</text><text x="375" y="865">2cm²</text><text x="28" y="925">Area:20px/cm². Avanzamento:40px/cm.</text><text x="28" y="970">Entrambi:6400px² rappresentano8cm³.</text><text x="28" y="1055" font-size="25">3 · Apparati diversi: Q non è fissata fra prove</text><rect x="200" y="1120" width="160" height="38" fill="#a8b8aa"/><rect x="200" y="1210" width="120" height="38" fill="#e7c994"/><text x="28" y="1147">A:Q = 8cm³/s</text><text x="28" y="1237">B:Q = 6cm³/s</text><text x="28" y="1310">Barre:20px/(cm³/s), lunghezze160e120px.</text><text x="28" y="1360">B: A₁ = 3cm²,A₂ = 1cm²,v₁ = 2cm/s.</text><text x="28" y="1410">v₂,B = 6cm/s, pur con Q minore di A.</text><text x="28" y="1460">Continuità entro ogni apparato, non fra apparati.</text></g></svg>
