<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1900"><title>Bilanci di forze e proiezioni</title><desc>Tre diagrammi distinti. Peso 50 N bilanciato da normale 38 N e trazione verticale 12 N. Due spinte ortogonali 6 e 8 N con risultante 10 N. Su rampa a 60 gradi peso 20 N e normale 10 N opposta alla componente normale del peso.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#28738d" /></marker></defs><rect width="640" height="1900" fill="white" /><g font-family="Arial,sans-serif" fill="#18354b" font-size="20"><text x="32" y="44" font-size="26">Isolare il corpo, poi proiettare</text><text x="32" y="105" font-size="23">1 · La fune sostiene parte del peso</text><rect x="180" y="345" width="240" height="20" fill="#e5edf0" stroke="#879da8" /><path d="M200 355V203" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><path d="M400 355V307" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><path d="M300 355V555" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><text x="72" y="215">N = 38 N</text><text x="420" y="300">Tᵧ = 12 N</text><text x="320" y="545">P = 50 N</text><text x="32" y="610">Bilancio verticale: 38 N + 12 N = 50 N.</text><text x="32" y="650">Frecce separate sul corpo per leggerle.</text><text x="32" y="725" font-size="23">2 · Sommare due spinte ortogonali</text><path d="M170 1010H440M200 1040V750" stroke="#879da8" fill="none" /><path d="M200 770H380V1010" fill="none" stroke="#879da8" stroke-dasharray="6 5" /><path d="M200 1010H380" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><path d="M200 1010V770" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><path d="M200 1010L380 770" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><text x="165" y="1045">O</text><text x="260" y="1045">6 N</text><text x="115" y="860">8 N</text><text x="400" y="900">10 N</text><text x="32" y="1120">Risultante: √(6² + 8²) N = 10 N.</text><text x="32" y="1160">Massa 5 kg: a = 10 N / (5 kg) = 2 m/s².</text><text x="32" y="1250" font-size="23">3 · Normale su una rampa a 60°</text><path d="M130 1710L350 1328.949M130 1710H390" stroke="#879da8" stroke-width="2" fill="none" /><path d="M170 1710A40 40 0 0 0 150 1675.359" stroke="#a66e36" fill="none" /><text x="180" y="1685">60°</text><circle cx="224.019" cy="1487.154" r="5" fill="#18354b" /><path d="M224.019 1487.154V1627.154" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><path d="M224.019 1487.154L163.397 1452.154" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><path d="M224.019 1487.154L284.641 1522.154" stroke="#28738d" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#a)" /><text x="70" y="1425">N = 10 N</text><text x="305" y="1555">mg cos 60° = 10 N</text><text x="250" y="1630">P = 20 N</text><text x="32" y="1790">La freccia tratteggiata è una componente</text><text x="32" y="1825">del peso, non una forza aggiuntiva.</text><text x="32" y="1870">N bilancia soltanto la componente normale.</text></g></svg>