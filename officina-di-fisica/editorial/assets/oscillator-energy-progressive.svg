<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1530" viewBox="0 0 640 1530" role="img" aria-labelledby="title desc">
<title id="title">Energia ideale e smorzamento separati</title><desc id="desc">Equilibrio e due estremi di un oscillatore con ampiezza due metri. Energia elastica e cinetica si scambiano mantenendo quattro joule. Un esempio separato di attrito riduce ampiezza ed energia ai massimi di istanti distinti.</desc>
<rect width="640" height="1530" rx="20" fill="#f7fbff"/>
<g font-family="system-ui,sans-serif" fill="#142d40" font-size="20">
<text x="35" y="48" font-size="25" font-weight="700">1 · Tre posizioni alternative</text>
<text x="35" y="90">Ideale · k = 2 N/m · A = 2 m</text>
<path d="M80 230H570" stroke="#6e8b9c" stroke-width="2"/>
<path d="M320 160V280" stroke="#6e8b9c" stroke-dasharray="6 5"/>
<circle cx="200" cy="230" r="15" fill="#d7f1fa" stroke="#145d81" stroke-width="2"/><circle cx="320" cy="230" r="15" fill="#145d81"/><circle cx="440" cy="230" r="15" fill="#d7f1fa" stroke="#145d81" stroke-width="2"/>
<text x="160" y="315">−2 m</text><text x="300" y="315">0</text><text x="415" y="315">+2 m</text>
<path d="M320 360H440M320 350V370M440 350V370" stroke="#c65919" fill="none" stroke-width="2"/>
<text x="320" y="405">A = 2 m</text>
<text x="35" y="450">Scala x: 60 px/m · estremi distanti 4 m</text>
<path d="M35 490H605" stroke="#b3cbd9"/>
<text x="35" y="540" font-size="25" font-weight="700">2 · La ripartizione cambia, E resta</text>
<text x="35" y="585">Barre: 25 px/J · blu U, arancio K</text>
<text x="35" y="650">Estremo: v = 0, U = 4 J, K = 0</text>
<rect x="100" y="680" width="100" height="35" fill="#145d81"/><text x="230" y="707">E = 4 J</text>
<text x="35" y="790">Centro: x = 0, U = 0, K = 4 J</text>
<rect x="100" y="820" width="100" height="35" fill="#c65919"/><text x="230" y="847">E = 4 J</text>
<text x="35" y="925">E = K + U = kA²/2</text>
<path d="M35 965H605" stroke="#b3cbd9"/>
<text x="35" y="1015" font-size="25" font-weight="700">3 · Altro caso: attrito debole</text>
<text x="35" y="1058">Due massimi distinti, stessa k = 2 N/m</text>
<text x="110" y="1120">Ampiezza</text><text x="410" y="1120">Energia</text>
<path d="M160 1160H280" stroke="#145d81" stroke-width="4"/><circle cx="280" cy="1160" r="7" fill="#145d81"/>
<rect x="420" y="1145" width="100" height="30" fill="#145d81"/>
<text x="165" y="1210">2 m</text><text x="535" y="1170">4 J</text>
<path d="M160 1290H220" stroke="#145d81" stroke-width="4"/><circle cx="220" cy="1290" r="7" fill="#145d81"/>
<rect x="420" y="1275" width="25" height="30" fill="#145d81"/>
<text x="165" y="1340">1 m</text><text x="465" y="1300">1 J</text>
<path d="M160 1135V1315" stroke="#6e8b9c" stroke-dasharray="6 5"/>
<text x="35" y="1410">Ampiezza: 60 px/m · energia: 25 px/J</text>
<text x="35" y="1460">La perdita meccanica diventa energia interna.</text>
<text x="35" y="1500">Questo ultimo caso non è l’oscillatore ideale.</text>
</g></svg>
