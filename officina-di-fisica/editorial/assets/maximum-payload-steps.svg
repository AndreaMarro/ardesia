<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1470" width="640" height="1470" font-family="Arial, sans-serif" font-size="20" fill="#182d42" role="img" aria-labelledby="title desc">
<title id="title">Capacità aggiuntiva al limite di immersione completa</title><desc id="desc">Piattaforma piena di volume venti litri e massa dieci chilogrammi. Senza carico è immersa per metà. Con dieci chilogrammi aggiuntivi raggiunge la piena immersione senza margine emerso. Una barra separa la massa propria da quella aggiuntiva nel totale sostenibile di venti chilogrammi.</desc>
<rect width="640" height="1470" fill="white"/>
<text x="32" y="46" font-size="24" font-weight="bold">1. Il volume disponibile ha un limite</text><text x="32" y="84">Piattaforma: 5 × 4 × 1 dm, V = 20 L.</text><text x="32" y="122">ρ_p = 1/2 kg/L; acqua a ρ = 1 kg/L.</text>
<rect x="55" y="300" width="250" height="120" fill="#b5dcf1"/><rect x="350" y="300" width="250" height="120" fill="#b5dcf1"/>
<rect x="75" y="280" width="200" height="40" fill="#e9bb70" stroke="#263f55" stroke-width="2"/><rect x="370" y="300" width="200" height="40" fill="#e9bb70" stroke="#263f55" stroke-width="2"/>
<rect x="430" y="250" width="60" height="50" fill="#cf9983" stroke="#263f55" stroke-width="2"/><path d="M45 300H315M340 300H610" stroke="#287aab" stroke-width="2" stroke-dasharray="6 4"/>
<text x="75" y="232">Senza carico.</text><text x="390" y="226">Carico: 10 kg.</text><text x="75" y="464">Immersione: 1/2 dm.</text><text x="370" y="464">Immersione: 1 dm.</text>
<text x="32" y="514">Scala 40 px/dm; fronti 200 × 40 px.</text><text x="32" y="548">Immersioni: 20 e 40 px; terza dimensione: 4 dm.</text>
<path d="M32 588H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="638" font-size="24" font-weight="bold">2. Sottrai la massa propria</text><text x="32" y="678">Al limite: ρV = 20 kg totali sostenibili.</text><text x="32" y="716">Massa propria della piattaforma: 10 kg.</text>
<rect x="110" y="775" width="100" height="46" fill="#e9bb70"/><rect x="210" y="775" width="100" height="46" fill="#cf9983"/>
<text x="350" y="806">Totale: 20 kg.</text><text x="80" y="870">Propria: 10 kg.</text><text x="340" y="870">Aggiuntiva: 10 kg.</text>
<text x="32" y="928">Barre: 100 + 100 = 200 px, scala 10 px/kg.</text><text x="32" y="966">Sono masse; i pesi corrispondenti contengono g.</text>
<path d="M32 1006H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="1056" font-size="24" font-weight="bold">3. Il limite non lascia margine emerso</text><text x="32" y="1100">m_lim = (ρ − ρ_p)V = 10 kg.</text>
<text x="32" y="1160">Sotto 10 kg: una parte della piattaforma emerge.</text><text x="32" y="1200">A 10 kg: tutta la piattaforma esclude liquido.</text><text x="32" y="1240">Il carico rimane asciutto e non sposta acqua.</text>
<text x="32" y="1300">Oltre 10 kg: il volume V non basta al bilancio.</text><text x="32" y="1340">Non c’è altro equilibrio con queste ipotesi.</text><text x="32" y="1400" font-size="18">È un limite idrostatico teorico senza riserva emersa,</text><text x="32" y="1434" font-size="18">non un carico operativo garantito.</text>
</svg>
