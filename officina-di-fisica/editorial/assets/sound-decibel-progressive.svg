<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1460" viewBox="0 0 640 1460" role="img" aria-labelledby="t d"><title id="t">Rapporto di intensità e livello in decibel</title><desc id="d">Tre passi: formare un rapporto puro, leggerlo su una scala logaritmica, ricostruire l’intensità con il riferimento. Il confine a zero decibel non è intensità nulla.</desc><rect width="640" height="1460" rx="24" fill="#f5faff"/><g fill="#163047" font-family="Arial,sans-serif" font-size="20"><text x="35" y="48" font-size="26" font-weight="bold">1 · Prima il rapporto puro</text><text x="35" y="98">I = 1000 pW/m²</text><text x="35" y="140">Iᵣ = 10 pW/m² · riferimento assegnato</text><text x="35" y="195">R = I/Iᵣ = 100 = 10²</text><text x="35" y="250">Stessa unità sopra e sotto: [R] = 1</text><text x="35" y="305">1 pW = 10⁻¹² W</text><text x="35" y="360">Nessuna soglia percettiva implicita</text><path d="M35 405H605" stroke="#b5cbd9"/><text x="35" y="455" font-size="26" font-weight="bold">2 · Un passo per ogni fattore 10</text><text x="35" y="500">L = 10 log₁₀(R) dB · scala 10 px/dB</text><path d="M120 640H420" stroke="#163047" stroke-width="3"/><g stroke="#163047" stroke-width="3"><path d="M120 625V655"/><path d="M220 625V655"/><path d="M320 625V655"/><path d="M420 625V655"/></g><text x="113" y="600">1</text><text x="206" y="600">10</text><text x="300" y="600">100</text><text x="394" y="600">1000</text><text x="470" y="600">R</text><text x="113" y="690">0</text><text x="206" y="690">10</text><text x="306" y="690">20</text><text x="406" y="690">30</text><text x="470" y="690">L (dB)</text><circle cx="320" cy="640" r="9" fill="#bc5315"/><text x="35" y="760">A: R = 100 → esponente 2 → L = 20 dB</text><text x="35" y="812">100 px = 10 dB = fattore 10 in R</text><text x="35" y="865">Le intensità non crescono linearmente</text><path d="M35 910H605" stroke="#b5cbd9"/><text x="35" y="965" font-size="26" font-weight="bold">3 · Tornare all’intensità</text><text x="35" y="1025">L = 20 dB → R = 10² = 100</text><text x="35" y="1085">I = Iᵣ R = 1000 pW/m²</text><text x="35" y="1150">Confine: L = 0 dB → R = 10⁰ = 1</text><text x="35" y="1210">Quindi I = Iᵣ, non I = 0</text><text x="35" y="1280">Cambiare Iᵣ cambia il livello della stessa I.</text><text x="35" y="1340">Stesso livello non prova uguale sensazione</text><text x="35" y="1380">per toni con frequenze diverse.</text></g></svg>
