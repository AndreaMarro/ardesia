<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif" font-size="21" fill="#272536">
<title id="title">Scegliere la normale e distinguere gli angoli</title><desc id="desc">Tre problemi distinti. Uno specchio piano riflette un raggio a venticinque gradi dalla superficie, cioè sessantacinque dalla normale. Rifrazione da indice uno a radice di due con angoli quarantacinque e trenta gradi dalla normale. Due segmenti verso sorgente e ricevitore aprono sessanta gradi quando ciascuno forma trenta gradi con la normale.</desc>
<defs><marker id="g" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#147c76"/></marker><marker id="v" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#6852a3"/></marker></defs><rect width="640" height="1540" fill="#fffdf7"/>
<text x="40" y="55" font-size="25" font-weight="bold">1 · Due riferimenti complementari</text><text x="40" y="108">Specchio fermo ; normale perpendicolare.</text><path d="M80 300H560" fill="none" stroke="#888" stroke-width="4"/><path d="M320 140V360" stroke="#999" stroke-dasharray="6 4"/>
<g transform="translate(320 300) rotate(25)"><path d="M-220 0H0" stroke="#147c76" stroke-width="3" marker-end="url(#g)"/></g><g transform="translate(320 300) rotate(-25)"><path d="M0 0H220" stroke="#6852a3" stroke-width="3" marker-end="url(#v)"/></g>
<path d="M320 240A60 60 0 0 0 265.6215 274.6429M320 240A60 60 0 0 1 374.3785 274.6429" fill="none" stroke="#888"/><text x="250" y="225">65°</text><text x="365" y="225">65°</text><text x="180" y="285">25°</text><text x="340" y="160">Normale</text><text x="320" y="420" text-anchor="middle">90° − 25° = 65°</text><path d="M40 475H600" stroke="#cbc6bc"/>
<text x="40" y="530" font-size="25" font-weight="bold">2 · Gli angoli sono dalla normale</text><text x="40" y="585">n₁ = 1 ; n₂ = √2</text><path d="M50 815H590" stroke="#888" stroke-width="2"/><path d="M320 650V1000" stroke="#999" stroke-dasharray="6 4"/>
<g transform="translate(320 815) rotate(-45)"><path d="M0 -200V0" stroke="#147c76" stroke-width="3" marker-end="url(#g)"/></g><g transform="translate(320 815) rotate(-30)"><path d="M0 0V180" stroke="#6852a3" stroke-width="3" marker-end="url(#v)"/></g>
<path d="M320 755A60 60 0 0 0 277.5736 772.5736M320 875A60 60 0 0 0 350 866.9615" fill="none" stroke="#888"/><text x="270" y="715">45°</text><text x="335" y="915">30°</text><text x="70" y="745">n₁</text><text x="70" y="930">n₂</text><path d="M40 1030H600" stroke="#cbc6bc"/>
<text x="40" y="1085" font-size="25" font-weight="bold">3 · Segmenti verso i due estremi</text><text x="80" y="1170">Verso sorgente</text><text x="400" y="1170">Verso ricevitore</text><path d="M80 1390H560" stroke="#888" stroke-width="4"/><path d="M320 1180V1460" stroke="#999" stroke-dasharray="6 4"/>
<g transform="translate(320 1390) rotate(-30)"><path d="M0 -210V0" stroke="#147c76" stroke-width="3" marker-end="url(#g)"/></g><g transform="translate(320 1390) rotate(30)"><path d="M0 0V-210" stroke="#6852a3" stroke-width="3" marker-end="url(#v)"/></g>
<path d="M282.5 1325.0481A75 75 0 0 1 357.5 1325.0481" fill="none" stroke="#94631e" stroke-width="2"/><text x="275" y="1260">30°</text><text x="335" y="1260">30°</text><text x="420" y="1320">β = 60°</text><text x="340" y="1435">P</text><text x="320" y="1500" text-anchor="middle">L’apertura usa i segmenti uscenti da P.</text>
</svg>
