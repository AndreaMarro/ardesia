<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif" font-size="21" fill="#272536">
<title id="title">Conteggi nucleari, frazioni attese e attività</title><desc id="desc">Tre problemi distinti. Emissione alfa: da numero di massa 210 e 84 protoni a numero di massa 206 e 82 protoni, con neutroni da 126 a 124. Cinque barre di popolazione attesa da uno a un sedicesimo. Un’efficienza del venticinque percento riduce un’attività di 720 becquerel a 180 segnali contati al secondo.</desc>
<rect width="640" height="1540" fill="#fffdf7"/>
<text x="40" y="55" font-size="25" font-weight="bold">1 · Tre conteggi da non confondere</text><text x="40" y="108">A = Z + N ; una particella α porta 2p e 2n.</text>
<text x="260" y="170" text-anchor="middle">A</text><text x="380" y="170" text-anchor="middle">Z</text><text x="500" y="170" text-anchor="middle">N</text>
<rect x="215" y="190" width="330" height="55" fill="#eee9da"/><rect x="215" y="285" width="330" height="55" fill="#dceee9"/><rect x="215" y="380" width="330" height="55" fill="#eee1c8"/>
<text x="50" y="225">Genitore</text><text x="260" y="225" text-anchor="middle">210</text><text x="380" y="225" text-anchor="middle">84</text><text x="500" y="225" text-anchor="middle">126</text>
<text x="50" y="320">Figlio</text><text x="260" y="320" text-anchor="middle">206</text><text x="380" y="320" text-anchor="middle">82</text><text x="500" y="320" text-anchor="middle">124</text>
<text x="50" y="415">Particella α</text><text x="260" y="415" text-anchor="middle">4</text><text x="380" y="415" text-anchor="middle">2</text><text x="500" y="415" text-anchor="middle">2</text><path d="M40 475H600" stroke="#cbc6bc"/>
<text x="40" y="530" font-size="25" font-weight="bold">2 · Quattro dimezzamenti attesi</text><text x="40" y="580">Tempo in emivite ; popolazione rispetto a N₀.</text>
<rect x="140" y="630" width="400" height="25" fill="#147c76"/><rect x="140" y="685" width="200" height="25" fill="#147c76"/><rect x="140" y="740" width="100" height="25" fill="#147c76"/><rect x="140" y="795" width="50" height="25" fill="#147c76"/><rect x="140" y="850" width="25" height="25" fill="#147c76"/>
<text x="80" y="651">0</text><text x="80" y="706">1</text><text x="80" y="761">2</text><text x="80" y="816">3</text><text x="80" y="871">4</text>
<text x="565" y="651">1</text><text x="565" y="706">1/2</text><text x="565" y="761">1/4</text><text x="565" y="816">1/8</text><text x="565" y="871">1/16</text>
<text x="40" y="950">Resta 1/16 ; è già decaduto 15/16.</text><text x="40" y="990" font-size="18">Frazioni attese, non appuntamenti individuali.</text><path d="M40 1030H600" stroke="#cbc6bc"/>
<text x="40" y="1085" font-size="25" font-weight="bold">3 · Il rivelatore ne conta una frazione</text>
<text x="160" y="1175">Attività: 720 Bq</text><rect x="160" y="1200" width="360" height="40" fill="#6852a3"/>
<text x="160" y="1300">Efficienza: 25%</text><text x="160" y="1360">Tasso netto: 180 s⁻¹</text><rect x="160" y="1380" width="90" height="40" fill="#147c76"/>
<text x="320" y="1500" text-anchor="middle">(25/100)×720 s⁻¹ = 180 s⁻¹</text>
</svg>
