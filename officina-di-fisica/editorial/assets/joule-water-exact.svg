<svg xmlns="http://www.w3.org/2000/svg" width="480" height="730" viewBox="0 0 480 730" role="img" aria-labelledby="title desc"><title id="title">Dall’energia all’aumento termico</title><desc id="desc">Alla scala di un pixel per joule:240J dissipati,180J ricevuti dall’acqua,60J altrove. Capacità210J/K, aumento6/7K.</desc><rect width="480" height="730" fill="#faf7ef"/><g fill="#163e38" font-family="sans-serif" font-size="26"><text x="24" y="48" font-weight="bold">Dalla resistenza all’acqua</text><text x="24" y="112">Energia dissipata: 240 J</text><rect x="64" y="134" width="240" height="38" rx="5"/><text x="24" y="233">All’acqua: 3/4 · 240 J = 180 J</text><rect x="64" y="255" width="180" height="38" rx="5" fill="#28766a"/><text x="24" y="354">Altrove: 60 J</text><rect x="64" y="376" width="60" height="38" rx="5" fill="#b74c2d"/><path d="M64 455H304M64 448v14M124 448v14M184 448v14M244 448v14M304 448v14" fill="none" stroke="#163e38" stroke-width="2"/><text x="56" y="496">0</text><text x="100" y="496">60</text><text x="274" y="496">240 J</text><text x="24" y="556">Capacità: 210 J/K</text><text x="24" y="606">ΔT = 180/210 K = 6/7 K</text><text x="24" y="668">Bilancio: 180 J + 60 J = 240 J</text><text x="24" y="708">Stessa scala per le tre energie</text></g></svg>
