<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1580" viewBox="0 0 640 1580" role="img" aria-labelledby="title desc"><title id="title">La pressione fornisce quota e velocità al getto</title><desc id="desc">Getto un metro sopra la superficie, cento pixel per metro. Pressioni assolute centododici e cento kilopascal. Differenza dodici, somma di dieci kilopascal per quota e due per energia cinetica. Barre venti pixel per kilopascal. Grafico finale della differenza contro il quadrato della velocità, a quota un metro; intercetta dieci kilopascal e punti quattro-dodici, sedici-diciotto.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1580" rx="20" fill="#faf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Il getto è sopra la superficie</text><text x="28" y="90">Acqua: ρ = 1000 kg/m³, g = 10 m/s².</text><rect x="80" y="300" width="170" height="160" fill="#bad9e5"/><path d="M80 260V460H250V260" fill="none" stroke="#597f83" stroke-width="3"/><path d="M65 300H285" stroke="#597f83" stroke-dasharray="5 5"/><path d="M250 420H360V200H470" stroke="#08869b" stroke-width="10" fill="none"/><path d="M470 200H530" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M300 300V200" stroke="#b46145" stroke-width="2"/><text x="80" y="240">p_s = 112 kPa</text><text x="380" y="150">p_j = 100 kPa</text><text x="395" y="270">h = 1 m</text><text x="395" y="345">v = 2 m/s</text><text x="28" y="515">Quota:100px/m; h è il dislivello verso l’alto.</text><text x="28" y="560">Le pressioni indicate sono assolute.</text><text x="28" y="600">Freccia:30px/(m/s), lunghezza60px.</text><text x="28" y="640" font-size="25">2 · Due contributi, una differenza</text><rect x="100" y="700" width="200" height="42" fill="#e7c994"/><rect x="300" y="700" width="40" height="42" fill="#bad9e5"/><text x="95" y="795">Quota:10kPa</text><text x="345" y="795">Cinetico:2kPa</text><text x="28" y="855">20px/kPa:200 + 40 = 240px, totale12kPa.</text><text x="28" y="905">Δp = ρgh + ρv²/2, con perdite trascurate.</text><text x="28" y="985" font-size="25">3 · A quota fissa, grafico contro v²</text><text x="28" y="1030">x:10px/(m²/s²). y:10px/kPa. h = 1m.</text><path d="M100 1450H400" stroke="#193a49" marker-end="url(#a)"/><path d="M100 1450V1190" stroke="#193a49" marker-end="url(#a)"/><path d="M100 1350L260 1270" stroke="#b46145" stroke-width="3" fill="none"/><circle cx="100" cy="1350" r="5" fill="#b46145"/><circle cx="140" cy="1330" r="5" fill="#b46145"/><circle cx="260" cy="1270" r="5" fill="#b46145"/><text x="325" y="1265">(16,18)</text><text x="325" y="1320">(4,12)</text><text x="45" y="1358">10</text><text x="75" y="1485">0</text><text x="420" y="1485">v² (m²/s²)</text><text x="32" y="1160">Δp (kPa)</text><text x="28" y="1540">L’intercetta è il costo della quota, non zero.</text></g></svg>
