<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1450" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc"><title id="title">Il dinamometro misura la tensione, non il peso diminuito</title><desc id="desc">Proiezioni di forze: in aria tensione dieci newton uguale al peso; in acqua tensione cinque più spinta cinque newton contro peso dieci. Tutte le frecce e barre a venti pixel per newton. Esempio g dieci e volume un mezzo litro ricavato dalla spinta. Famiglia di corpi con pesate proporzionali, densità due chilogrammi per litro invariata.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="640" height="1450" rx="20" fill="#faf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a49"><text x="28" y="42" font-size="25">1 · Proiezioni delle forze sullo stesso corpo</text><text x="28" y="90">Aria: spinta trascurata. Acqua: immersione completa.</text><text x="105" y="155">ARIA</text><text x="365" y="155">ACQUA</text><path d="M120 400V200" stroke="#b46145" stroke-width="3" marker-end="url(#a)"/><path d="M240 200V400" stroke="#193a49" stroke-width="3" marker-end="url(#a)"/><path d="M370 400V300" stroke="#b46145" stroke-width="3" marker-end="url(#a)"/><path d="M460 400V300" stroke="#08869b" stroke-width="3" marker-end="url(#a)"/><path d="M550 200V400" stroke="#193a49" stroke-width="3" marker-end="url(#a)"/><text x="65" y="450">T = 10 N</text><text x="200" y="495">P = 10 N</text><text x="325" y="450">T = 5 N</text><text x="430" y="495">S = 5 N</text><text x="510" y="540">P = 10 N</text><text x="28" y="590">20 px/N: frecce200px o100px.</text><text x="28" y="630">Il peso resta10N. In acqua: T + S − P = 0.</text><text x="28" y="710" font-size="25">2 · La differenza delle letture è la spinta</text><rect x="200" y="760" width="200" height="38" fill="#a8b8aa"/><rect x="200" y="850" width="100" height="38" fill="#bad9e5"/><text x="28" y="787">W_a = 10 N</text><text x="28" y="877">S = 5 N</text><text x="28" y="940">Barre:20px/N. W_a/S = 2, rapporto puro.</text><text x="28" y="985">ρ_c = ρ_w W_a/S = 2 kg/L.</text><text x="28" y="1070" font-size="25">3 · Una densità, corpi di dimensioni diverse</text><text x="28" y="1120">Esempio g = 10 m/s², acqua1kg/L.</text><text x="28" y="1170">S = 5 N → volume1/2L; W_a = 10 N → massa1kg.</text><text x="28" y="1220">W_a = 20 N, W_i = 10 N: spinta10N.</text><text x="28" y="1270">Volume1L, massa2kg: ancoraρ_c = 2kg/L.</text><text x="28" y="1330">W_a = 2W_i non determina il volume totale.</text><text x="28" y="1380">La lettura immersa è una tensione positiva.</text></g></svg>
