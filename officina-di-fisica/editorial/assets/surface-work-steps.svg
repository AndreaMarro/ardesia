<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1800" viewBox="0 0 640 1800" role="img" aria-labelledby="title desc"><title id="title">Lavoro per l’area totale creata</title><desc id="desc">Cinque centimetri quadrati totali costano dieci microjoule a venti millinewton al metro. Un esempio con due nuove facce da cinque mezzi centimetri quadrati ha lo stesso totale, da non raddoppiare. Barre finali confrontano lavori dieci e quindici microjoule.</desc><rect width="640" height="1800" fill="#fffdf6"/><g font-family="Arial,sans-serif" fill="#192f3d" font-size="22">
<text x="35" y="48" font-size="27" font-weight="bold">1. Ogni area nuova è contata una volta</text>
<text x="35" y="95">γ = 20 mN/m; ΔA totale = 5 cm²</text>
<text x="35" y="140">Cinque caselle di area da 1 cm²</text>
<rect x="100" y="230" width="50" height="50" fill="#dceef8" stroke="#1664a7" stroke-width="2"/>
<rect x="150" y="230" width="50" height="50" fill="#dceef8" stroke="#1664a7" stroke-width="2"/>
<rect x="200" y="230" width="50" height="50" fill="#dceef8" stroke="#1664a7" stroke-width="2"/>
<rect x="250" y="230" width="50" height="50" fill="#dceef8" stroke="#1664a7" stroke-width="2"/>
<rect x="300" y="230" width="50" height="50" fill="#dceef8" stroke="#1664a7" stroke-width="2"/>
<text x="35" y="335">Scala geometrica: 50 px/cm</text>
<text x="35" y="380">Ogni casella ha area 50 × 50 px².</text>
<text x="35" y="425">1 cm² costa 2 µJ nelle condizioni assegnate.</text>
<text x="35" y="470">5 × 2 µJ = 10 µJ di lavoro reversibile</text>
<text x="35" y="515">Sono aree di interfaccia, non volumi.</text>
<path d="M35 560H605" stroke="#c9d1d4"/>
<text x="35" y="610" font-size="27" font-weight="bold">2. Un esempio con due interfacce</text>
<text x="35" y="655">Viste separate delle nuove aree di un film</text>
<text x="100" y="735">Faccia 1</text>
<text x="350" y="735">Faccia 2</text>
<rect x="100" y="780" width="125" height="50" fill="#dceef8" stroke="#1664a7" stroke-width="2"/><rect x="350" y="780" width="125" height="50" fill="#f1dfb6" stroke="#92611c" stroke-width="2"/>
<text x="100" y="880">5/2 cm²</text>
<text x="350" y="880">5/2 cm²</text>
<text x="35" y="935">Stessa scala: 50 px/cm, lati 125 × 50 px</text>
<text x="35" y="980">ΔA = 5/2 + 5/2 = 5 cm² già totali</text>
<text x="35" y="1025">W = γ ΔA = 10 µJ, senza un altro due</text>
<text x="35" y="1070">Le due viste non creano due film aggiuntivi.</text>
<path d="M35 1120H605" stroke="#c9d1d4"/>
<text x="35" y="1170" font-size="27" font-weight="bold">3. Confrontare due trasformazioni</text>
<text x="35" y="1215">Barre del lavoro: 10 px/µJ</text>
<text x="35" y="1280">A: γ = 20 mN/m, ΔA = 5 cm²</text>
<rect x="100" y="1315" width="100" height="30" fill="#1664a7"/>
<text x="250" y="1340">10 µJ, barra 100 px</text>
<text x="35" y="1420">B: γ = 50 mN/m, ΔA = 3 cm²</text>
<rect x="100" y="1455" width="150" height="30" fill="#1664a7"/>
<text x="285" y="1480">15 µJ, barra 150 px</text>
<text x="35" y="1560">Rapporto W_B/W_A = 15/10 = 3/2</text>
<text x="35" y="1610">Media dei due lavori: (10 + 15)/2 = 25/2 µJ</text>
<text x="35" y="1660">Una media statistica, senza divisione per tempo</text>
<text x="35" y="1720">Le barre rappresentano lavori, non aree.</text>
</g></svg>
