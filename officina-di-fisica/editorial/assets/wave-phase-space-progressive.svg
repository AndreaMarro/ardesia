<title id="title">Fase spaziale non ridotta</title><desc id="desc">Una fotografia illustrativa dell’onda confronta due punti simultanei distanti un metro rispetto alla lunghezza d’onda quattro metri. Segmenti alla stessa scala, poi grafico della fase accumulata che prosegue oltre un giro.</desc>
