<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Confini del sistema e letture di temperatura</title><desc id="desc">Tre pannelli: vapore che lascia il liquido, barre a trecento e seicento kelvin con origine comune, tre stati di raffreddamento da trentacinque a trentuno e venticinque gradi Celsius.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7350b0"/></marker></defs>
<rect width="640" height="1480" fill="#faf7ee"/><g fill="#302a3e" font-size="21"><text x="30" y="40" font-size="25">1. Scegliere il confine</text><text x="30" y="80">Sistema: il liquido rimasto nella pentola</text></g>
<rect x="150" y="215" width="320" height="150" rx="10" fill="#68bdcf"/><path d="M130 200V390H490V200" fill="none" stroke="#726d81" stroke-width="8"/>
<rect x="145" y="205" width="330" height="170" fill="none" stroke="#7350b0" stroke-dasharray="9 7" stroke-width="3"/>
<path d="M320 240V125" stroke="#7350b0" stroke-width="5" marker-end="url(#arrow)"/><text x="350" y="158" fill="#302a3e" font-size="21">vapore in uscita</text>
<path d="M320 453V400" stroke="#7350b0" stroke-width="5" marker-end="url(#arrow)"/><text x="360" y="445" fill="#302a3e" font-size="20">calore entrante</text><text x="40" y="483" fill="#302a3e" font-size="20">La materia attraversa il confine: sistema aperto.</text>
<g fill="#302a3e" font-size="21"><text x="30" y="550" font-size="25">2. Raddoppiare i kelvin</text><text x="30" y="590">Origine delle barre: 0 K</text></g>
<path d="M140 835V620M140 835H510" stroke="#726d81" fill="none" stroke-width="2"/>
<rect x="140" y="650" width="150" height="45" fill="#147979"/><rect x="140" y="735" width="300" height="45" fill="#7350b0"/>
<g fill="#302a3e" font-size="20"><text x="305" y="680">300 K → 26,85 °C</text><text x="160" y="817">600 K → 326,85 °C</text><text x="114" y="862">0</text><text x="275" y="862">300</text><text x="425" y="862">600</text><text x="500" y="865">T (K)</text><text x="40" y="915">Il rapporto riguarda le temperature assolute.</text></g>
<g fill="#302a3e" font-size="21"><text x="30" y="990" font-size="25">3. Sommare due cali</text><text x="30" y="1030">Stati successivi, senza durate assegnate</text></g>
<path d="M130 1360V1080M130 1360H530" stroke="#726d81" stroke-width="2" fill="none"/>
<path d="M180 1120L330 1168L480 1240" stroke="#147979" stroke-width="4" fill="none"/><g fill="#147979"><circle cx="180" cy="1120" r="6"/><circle cx="330" cy="1168" r="6"/><circle cx="480" cy="1240" r="6"/></g>
<g fill="#302a3e" font-size="20"><text x="60" y="1090">t (°C)</text><text x="145" y="1100">35 °C</text><text x="300" y="1144">31 °C</text><text x="470" y="1280">25 °C</text><text x="175" y="1390">0</text><text x="325" y="1390">1</text><text x="475" y="1390">2</text><text x="245" y="1440">indice dello stato</text><text x="220" y="1176">−4 K</text><text x="377" y="1236">−6 K</text></g>
</svg>
