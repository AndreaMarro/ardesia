<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1860" width="640" height="1860" font-family="Arial, sans-serif" font-size="20" fill="#182d42" role="img" aria-labelledby="title desc">
<title id="title">Spinta: differenza delle pressioni, stesso volume</title><desc id="desc">Un parallelepipedo di volume due litri, dieci per dieci per venti centimetri, è collocato a due profondità. Le pressioni relative sulle facce superiore e inferiore aumentano insieme. La differenza delle forze resta venti newton verso l'alto.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1860" fill="white"/>
<text x="32" y="46" font-size="24" font-weight="bold">1. Stesso corpo, due profondità</text><text x="32" y="84">ρ = 1 kg/L; g = 10 m/s²; liquido in quiete.</text><text x="32" y="122">Dimensioni: 10 × 10 × 20 cm, V = 2 L.</text>
<rect x="80" y="230" width="210" height="200" fill="#b5dcf1"/><rect x="350" y="230" width="210" height="200" fill="#b5dcf1"/>
<path d="M70 230H300M340 230H570" stroke="#407b9f" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="165" y="270" width="40" height="80" fill="#e9bb70" stroke="#263f55" stroke-width="2"/><rect x="435" y="310" width="40" height="80" fill="#e9bb70" stroke="#263f55" stroke-width="2"/>
<text x="90" y="205">A</text><text x="360" y="205">B</text><text x="84" y="472">Facce a 10 e 30 cm.</text><text x="354" y="472">Facce a 20 e 40 cm.</text><text x="32" y="518">Sezioni frontali: 40 × 80 px, scala 4 px/cm.</text><text x="32" y="552">La faccia orizzontale misura 1 dm².</text><text x="32" y="586" font-size="18">La terza dimensione è 10 cm, non visibile in sezione.</text>
<path d="M32 626H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="676" font-size="24" font-weight="bold">2. Sottrai i contributi verticali</text><text x="32" y="714">Pressioni relative rispetto alla superficie.</text>
<path d="M100 870V750" stroke="#237b98" stroke-width="3" marker-end="url(#a)"/><path d="M350 790V830" stroke="#b46145" stroke-width="3" marker-end="url(#a)"/>
<text x="130" y="775">30 N su fondo.</text><text x="380" y="824">10 N su tetto.</text><text x="32" y="922">A: 3 kPa × 1 dm² − 1 kPa × 1 dm² = 20 N.</text>
<path d="M100 1150V990" stroke="#237b98" stroke-width="3" marker-end="url(#a)"/><path d="M350 1030V1110" stroke="#b46145" stroke-width="3" marker-end="url(#a)"/>
<text x="130" y="1015">40 N su fondo.</text><text x="380" y="1094">20 N su tetto.</text><text x="32" y="1200">B: 4 kPa × 1 dm² − 2 kPa × 1 dm² = 20 N.</text><text x="32" y="1250">Proiezioni separate; scala delle forze 4 px/N.</text><text x="32" y="1284" font-size="18">Le azioni laterali si compensano a coppie.</text>
<path d="M32 1324H608" stroke="#6a7d8a" stroke-width="2"/>
<text x="32" y="1374" font-size="24" font-weight="bold">3. Riconosci la spinta di Archimede</text><text x="32" y="1414">F_A = ρgV = (2 kg)(10 m/s²) = 20 N.</text>
<path d="M160 1570V1490" stroke="#237b98" stroke-width="4" marker-end="url(#a)"/><text x="210" y="1536">20 N verso l’alto.</text><text x="32" y="1626">80 px alla scala 4 px/N, in entrambe le prove.</text><text x="32" y="1680">La pressione superficiale uniforme si compensa.</text><text x="32" y="1718">La profondità non cambia ρ né V.</text><text x="32" y="1770">Sono mostrate le sole forze del liquido.</text><text x="32" y="1808">Peso e sostegno non sono assegnati nel disegno.</text>
</svg>
