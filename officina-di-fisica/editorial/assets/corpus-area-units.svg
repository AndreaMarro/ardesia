<svg xmlns="http://www.w3.org/2000/svg" width="320" height="630" viewBox="0 0 320 630" role="img" aria-labelledby="title desc">
<title id="title">La stessa superficie, da due a otto caselle</title>
<desc id="desc">Tre tappe verticali. Due quadrati uguali formano il rettangolo. Ogni lato viene diviso in due. Ogni quadrato contiene così quattro caselle nuove, per otto caselle complessive. Il bordo esterno è invariato.</desc>
<rect width="320" height="630" fill="#fffdf8"/>
<g fill="#193d43" font-family="sans-serif" font-size="18">
<text x="16" y="30">1. Due unità di area</text><text x="16" y="57" font-size="16">Il bordo fissa la superficie.</text>
<text x="16" y="228">2. Due intervalli su ogni lato</text><text x="16" y="255" font-size="16">Ogni vecchia casella: 2 × 2.</text>
<text x="16" y="426">3. Conta le nuove caselle</text><text x="16" y="453" font-size="16">Due gruppi da quattro: 8.</text>
</g>
<g fill="#e6efec" stroke="#193d43" stroke-width="2">
<path d="M70 85h180v90H70zM160 85v90"/>
<path d="M70 283h180v90H70zM160 283v90"/>
<path d="M70 481h180v90H70zM160 481v90"/>
</g>
<g stroke="#8e4b16" stroke-width="2" fill="none">
<path d="M115 283v90M205 283v90M70 328h180M115 481v90M205 481v90M70 526h180"/>
</g>
<g fill="#193d43" font-family="sans-serif" font-size="19" text-anchor="middle">
<text x="115" y="138">1</text><text x="205" y="138">2</text>
<text x="92" y="511">1</text><text x="137" y="511">2</text><text x="182" y="511">5</text><text x="227" y="511">6</text>
<text x="92" y="556">3</text><text x="137" y="556">4</text><text x="182" y="556">7</text><text x="227" y="556">8</text>
<text x="160" y="610">Superficie invariata</text>
</g></svg>
