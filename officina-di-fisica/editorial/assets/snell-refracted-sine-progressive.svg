<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1750" viewBox="0 0 640 1750" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Snell dalla normale e lastra parallela</title><desc id="desc">Un raggio in aria rifratto nel mezzo, due facce parallele e confronto di seni trasmessi con barre comuni.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#306f8c"/></marker></defs><rect x="0" y="0" width="640" height="1750" fill="white"/><text x="35" y="48" font-size="25" fill="#203247" text-anchor="start">Direzioni, non angoli decimali</text><text x="35" y="108" font-size="22" fill="#203247" text-anchor="start">1 · Aria verso n = 2</text><rect x="60" y="350" width="520" height="205" fill="#e4eef3"/><line x1="60" y1="350" x2="580" y2="350" stroke="#526474" stroke-width="2"/><line x1="320" y1="155" x2="320" y2="545" stroke="#72818c" stroke-width="2" stroke-dasharray="7 6"/><path d="M240 211.43593539448983L320 350" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M320 350L360 504.9193338482967" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><text x="80" y="180" font-size="19" fill="#203247" text-anchor="start">n = 1 · sin θ_i = 1/2</text><text x="380" y="470" font-size="18" fill="#203247" text-anchor="start">sin θ_r = 1/4</text><text x="345" y="535" font-size="19" fill="#203247" text-anchor="start">n = 2</text><text x="335" y="290" font-size="17" fill="#203247" text-anchor="start">normale</text><text x="35" y="610" font-size="19" fill="#203247" text-anchor="start">Il seno diminuisce nel mezzo di indice maggiore.</text><text x="35" y="690" font-size="22" fill="#203247" text-anchor="start">2 · Due facce parallele, n = 3/2</text><rect x="60" y="860" width="520" height="150" fill="#e4eef3"/><line x1="60" y1="860" x2="580" y2="860" stroke="#526474" stroke-width="2"/><line x1="60" y1="1010" x2="580" y2="1010" stroke="#526474" stroke-width="2"/><line x1="210" y1="740" x2="210" y2="960" stroke="#72818c" stroke-width="2" stroke-dasharray="7 6"/><line x1="275.4653670707977" y1="950" x2="275.4653670707977" y2="1170" stroke="#72818c" stroke-width="2" stroke-dasharray="7 6"/><path d="M120 740L210 860" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M210 860L275.4653670707977 1010" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M275.4653670707977 1010L365.4653670707977 1130" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><text x="340" y="795" font-size="18" fill="#203247" text-anchor="start">aria · sin θ_in = 3/5</text><text x="350" y="930" font-size="18" fill="#203247" text-anchor="start">sin θ_int = 2/5</text><text x="340" y="1168" font-size="18" fill="#203247" text-anchor="start">sin θ_out = 3/5</text><text x="80" y="1225" font-size="19" fill="#203247" text-anchor="start">Le normali sono parallele: direzione recuperata.</text><text x="35" y="1300" font-size="22" fill="#203247" text-anchor="start">3 · Due seni trasmessi e la loro media</text><text x="130" y="1392" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="150" y="1370" width="160.0" height="30" fill="#3d7791"/><text x="320.0" y="1394" font-size="18" fill="#203247" text-anchor="start">1/4</text><text x="130" y="1492" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="150" y="1470" width="320.0" height="30" fill="#986c35"/><text x="480.0" y="1494" font-size="18" fill="#203247" text-anchor="start">1/2</text><text x="130" y="1592" font-size="18" fill="#203247" text-anchor="end">media</text><rect x="150" y="1570" width="240.0" height="30" fill="#637e55"/><text x="400.0" y="1594" font-size="18" fill="#203247" text-anchor="start">3/8</text><text x="35" y="1680" font-size="19" fill="#203247" text-anchor="start">Barre adimensionali, non misure di angoli in gradi.</text></svg>
