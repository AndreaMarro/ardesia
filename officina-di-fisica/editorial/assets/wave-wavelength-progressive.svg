<title id="title">Una distanza nello spazio, un ciclo nel tempo</title><desc id="desc">Istantanea di un’onda trasversale illustrativa con creste ogni quattro metri. Un sensore fermo registra tre cicli al secondo. Confronto fra lunghezze quattro e cinque metri, senza confondere propagazione e moto del mezzo.</desc>
