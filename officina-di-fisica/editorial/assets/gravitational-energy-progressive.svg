<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1180" role="img" aria-labelledby="title desc"><title id="title">Salita, energia e circuito chiuso</title><desc id="desc">Massa due chilogrammi in campo uniforme dieci metri al secondo quadrato. Dislivello due metri, cento pixel alla scala cinquanta pixel per metro. Peso venti newton lungo sessanta pixel alla scala tre pixel per newton. Energia potenziale più quaranta joule e lavoro del peso meno quaranta joule sono barre di centosessanta pixel, quattro pixel per joule, in un pannello separato. Il circuito ha salita e discesa di due metri: lavori meno quaranta e più quaranta joule, totale zero.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="640" height="1180" rx="24" fill="#faf8f2"/><g font-family="system-ui,sans-serif" font-size="20" fill="#16323f">
<text x="28" y="42" font-size="24" font-weight="700">1 · Conta il dislivello fra gli estremi</text><text x="28" y="88">m = 2 kg · g = 10 m/s²</text><path d="M100 200H430M100 300H430" stroke="#9aada6" stroke-width="2"/><text x="100" y="180">arrivo: y = 2 m</text><text x="100" y="334">partenza: y = 0</text><circle cx="180" cy="200" r="9" fill="#14647b"/><path d="M180 200V260" stroke="#b44b2c" stroke-width="3" marker-end="url(#arrow)"/><text x="205" y="250" fill="#b44b2c">peso = 20 N</text><path d="M470 300V200" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><text x="490" y="255">h = 2 m</text><text x="28" y="375">Quote: 50 px/m. Peso: 3 px/N, scala distinta.</text>
<text x="28" y="450" font-size="24" font-weight="700">2 · Distingui i due segni energetici</text><path d="M320 490V690" stroke="#16323f" stroke-width="2"/><text x="310" y="478">0</text><rect x="320" y="510" width="160" height="40" fill="#b7d8cf"/><rect x="160" y="610" width="160" height="40" fill="#e6c1b5"/><text x="345" y="538">U = +40 J</text><text x="163" y="638">W_g = −40 J</text><text x="28" y="720">Barre: 4 px/J. U = −W_g, stessa variazione.</text>
<text x="28" y="800" font-size="24" font-weight="700">3 · Torna alla quota iniziale</text><path d="M140 1040V940" stroke="#b44b2c" stroke-width="3" marker-end="url(#arrow)"/><path d="M140 940H420" stroke="#7d8f88" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 940V1040" stroke="#14647b" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 1040H140" stroke="#7d8f88" stroke-width="3" marker-end="url(#arrow)"/><text x="58" y="995">−40 J</text><text x="445" y="995">+40 J</text><text x="240" y="920">W_g = 0</text><text x="240" y="1075">W_g = 0</text><text x="28" y="1120">W_g totale = −40 J + 40 J = 0.</text><text x="28" y="1158" font-size="18">Quote: 50 px/m. Le frecce del circuito indicano il percorso.</text></g></svg>
