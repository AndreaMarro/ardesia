<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1320" role="img" aria-labelledby="title desc">
<title id="title">Condurre energia attraverso una lastra ferma</title>
<desc id="desc">La lastra della prova A conduce venti watt con un salto di dieci kelvin. Un profilo lineare collega i due lati. Le barre confrontano venti e ottanta watt di prove diverse e la media cinquanta watt.</desc>
<defs><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1320" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Un solido fermo, una potenza non nulla</text>
<text x="32" y="85" font-size="18">A = 0,01 m² ; L = 0,01 m ; k = 2 W/(m·K)</text>
<rect x="310" y="125" width="17" height="170" fill="#e0e7ee" stroke="#14243a" stroke-width="2"/>
<path d="M310 125V295" stroke="#b45328" stroke-width="7"/><path d="M327 125V295" stroke="#165a87" stroke-width="7"/>
<text x="96" y="154">Caldo T_h</text><text x="438" y="154">Freddo T_c</text>
<path d="M120 220H510" stroke="#b45328" stroke-width="4" marker-end="url(#heat)"/>
<text x="380" y="262">P = 20 W</text>
<path d="M298 125H285V295H298" fill="none" stroke="#14243a" stroke-width="2"/><text x="200" y="191">10 cm</text>
<path d="M310 315V330H327V315" fill="none" stroke="#14243a" stroke-width="2"/>
<text x="274" y="362">L = 1 cm</text>
<text x="32" y="405" font-size="18">Schema della lastra: la freccia indica energia.</text>
<text x="32" y="435" font-size="18">ΔT = 10 K ; G = kA/L = 2 W/K.</text>
<path d="M32 465H608" stroke="#9babbc"/>
<text x="32" y="510" font-size="25" font-weight="bold">2 · Il salto è distribuito nello spessore</text>
<text x="32" y="549" font-size="18">Eccesso sul lato freddo: T(x) − T_c, in K</text>
<path d="M100 790V585M100 790H535" fill="none" stroke="#14243a" stroke-width="2"/>
<path d="M100 590L500 790" stroke="#165a87" stroke-width="4" fill="none"/>
<circle cx="100" cy="590" r="5" fill="#165a87"/><circle cx="500" cy="790" r="5" fill="#165a87"/>
<path d="M100 590H500V790" fill="none" stroke="#8292a2" stroke-dasharray="5 5"/>
<text x="59" y="597">10</text><text x="65" y="797">0</text><text x="82" y="824">0</text><text x="482" y="824">1</text><text x="542" y="795">x / cm</text>
<text x="32" y="863" font-size="18">Facce isoterme, lati isolati, nessuna sorgente interna.</text>
<path d="M32 892H608" stroke="#9babbc"/>
<text x="32" y="936" font-size="25" font-weight="bold">3 · Media delle due potenze</text>
<path d="M130 960V1211" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="982" width="80" height="34" fill="#165a87"/><rect x="130" y="1058" width="320" height="34" fill="#165a87"/><rect x="130" y="1134" width="200" height="34" fill="#28664d"/>
<text x="50" y="1007">A</text><text x="228" y="1007">20 W</text><text x="50" y="1083">B</text><text x="468" y="1083">80 W</text><text x="32" y="1159">Media</text><text x="348" y="1159">50 W</text>
<text x="32" y="1255" font-size="18">A: k = 2, ΔT = 10 K ; B: k = 4, ΔT = 20 K.</text>
<text x="32" y="1286" font-size="18">Potenze in W, origine comune per le tre barre.</text>
</g></svg>
