<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1310" role="img" aria-labelledby="title desc"><title id="title">Pesi delle masse e moto del loro centro</title><desc id="desc">Coordinate a novanta pixel per metro. Primo caso:due masse da due chilogrammi alle coordinate zero e due metri,centro a un metro. Secondo caso:prima massa due chilogrammi e seconda quattro alle stesse coordinate,centro a quattro terzi di metro. Terzo caso separato:se la forza esterna è zero,un centro inizialmente a un metro con velocità un metro al secondo ha coordinate uno,due e tre metri ai tempi zero,uno e due secondi. Le dimensioni dei simboli delle masse sono schematiche.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="640" height="1310" rx="24" fill="#faf8f2"/><g font-family="system-ui,sans-serif" font-size="20" fill="#16323f">
<text x="28" y="42" font-size="24" font-weight="700">1 · Masse uguali,punto medio</text><text x="28" y="90">Configurazione A · coordinate:90 px/m.</text><path d="M75 220H430" stroke="#81968d" stroke-width="2" marker-end="url(#arrow)"/><circle cx="100" cy="220" r="11" fill="#81968d"/><circle cx="280" cy="220" r="11" fill="#81968d"/><circle cx="190" cy="220" r="6" fill="#14647b"/><path d="M100 240V252M280 240V252M190 235V275" stroke="#14647b" stroke-width="2"/><text x="48" y="180">M = 2 kg</text><text x="280" y="180">m = 2 kg</text><text x="90" y="286">0</text><text x="270" y="286">2 m</text><text x="153" y="322" fill="#14647b">X_A = 1 m</text><text x="28" y="375">La massa nell’origine resta nel denominatore.</text>
<text x="28" y="455" font-size="24" font-weight="700">2 · Più massa a destra sposta il centro</text><text x="28" y="500">Configurazione B · stessi punti e scala.</text><path d="M75 600H430" stroke="#81968d" stroke-width="2" marker-end="url(#arrow)"/><circle cx="100" cy="600" r="11" fill="#81968d"/><circle cx="280" cy="600" r="11" fill="#81968d"/><circle cx="220" cy="600" r="6" fill="#14647b"/><path d="M100 620V632M280 620V632M220 615V655" stroke="#14647b" stroke-width="2"/><text x="48" y="560">M = 2 kg</text><text x="280" y="560">m = 4 kg</text><text x="90" y="666">0</text><text x="270" y="666">2 m</text><text x="180" y="712" fill="#14647b">X_B = 4/3 m</text><text x="28" y="757">Il centro resta interno,più vicino alla massa maggiore.</text>
<text x="28" y="835" font-size="24" font-weight="700">3 · Caso separato:forza esterna nulla</text><text x="28" y="880">Esempio: X_CM(0) = 1 m, V_CM = +1 m/s.</text><path d="M100 950H430M100 1030H430M100 1110H430" stroke="#b7c7bf" stroke-width="2"/><path d="M100 925V1135" stroke="#81968d" stroke-width="2" stroke-dasharray="4 4"/><circle cx="190" cy="950" r="6" fill="#14647b"/><circle cx="280" cy="1030" r="6" fill="#14647b"/><circle cx="370" cy="1110" r="6" fill="#14647b"/><text x="175" y="934">1 m</text><text x="265" y="1014">2 m</text><text x="355" y="1094">3 m</text><text x="465" y="956">t = 0</text><text x="465" y="1036">t = 1 s</text><text x="465" y="1116">t = 2 s</text><text x="90" y="1160">x = 0 · stessa origine nelle tre righe</text><text x="28" y="1215">Accelerazione nulla non impone velocità nulla.</text><text x="28" y="1260">Le masse possono muoversi anche rispetto al centro.</text><text x="28" y="1295" font-size="18">Tutte le coordinate:90 px/m. Simboli delle masse schematici.</text>
</g></svg>
