<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Energia per fotone e per pacchetto</title><desc id="desc">Tre tappe: cinque e dieci fotoni della stessa frequenza, energia per fotone distinta dal conteggio, due energie trentatré e centotrentadue unità q E con media centosessantacinque mezzi. La media dei conteggi non è un nuovo pacchetto fisico.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Energia per fotone e per pacchetto</text><text x="32" y="92" font-size="22" text-anchor="start">1 · Stessa frequenza, più fotoni</text><text x="32" y="134" font-size="18" text-anchor="start">u = 1: energia per fotone (33/5)q_E</text><text x="32" y="168" font-size="18" text-anchor="start">q_E = 10⁻²⁰ J</text><text x="45" y="230" font-size="18" text-anchor="start">N = 5</text><text x="45" y="350" font-size="18" text-anchor="start">N = 10</text><circle cx="210" cy="220" r="10" fill="#316b9b"/><circle cx="280" cy="220" r="10" fill="#316b9b"/><circle cx="350" cy="220" r="10" fill="#316b9b"/><circle cx="420" cy="220" r="10" fill="#316b9b"/><circle cx="490" cy="220" r="10" fill="#316b9b"/><circle cx="210" cy="330" r="10" fill="#316b9b"/><circle cx="280" cy="330" r="10" fill="#316b9b"/><circle cx="350" cy="330" r="10" fill="#316b9b"/><circle cx="420" cy="330" r="10" fill="#316b9b"/><circle cx="490" cy="330" r="10" fill="#316b9b"/><circle cx="210" cy="375" r="10" fill="#316b9b"/><circle cx="280" cy="375" r="10" fill="#316b9b"/><circle cx="350" cy="375" r="10" fill="#316b9b"/><circle cx="420" cy="375" r="10" fill="#316b9b"/><circle cx="490" cy="375" r="10" fill="#316b9b"/><text x="210" y="270" font-size="18" text-anchor="start">E = 33q_E</text><text x="210" y="430" font-size="18" text-anchor="start">E = 66q_E</text><text x="32" y="480" font-size="18" text-anchor="start">Il conteggio cambia; hf resta uguale.</text><text x="32" y="550" font-size="22" text-anchor="start">2 · Isolare il conteggio</text><text x="32" y="600" font-size="18" text-anchor="start">Energia totale: E = N E_γ</text><line x1="320" y1="630" x2="320" y2="690" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="735" font-size="18" text-anchor="start">Energia di un fotone: E_γ = hf</text><text x="32" y="785" font-size="18" text-anchor="start">N = E / E_γ: deve essere intero positivo.</text><text x="32" y="850" font-size="18" text-anchor="start">Non si identifica il display continuo con N.</text><text x="32" y="935" font-size="22" text-anchor="start">3 · Due pacchetti e la media</text><text x="32" y="978" font-size="18" text-anchor="start">A: N = 5, u = 1 · B: N = 10, u = 2</text><text x="128" y="1064" font-size="18" text-anchor="end">A</text><rect x="150" y="1040" width="66" height="32" fill="#316b9b"/><text x="228" y="1064" font-size="18" text-anchor="start">33q_E</text><text x="128" y="1174" font-size="18" text-anchor="end">B</text><rect x="150" y="1150" width="264" height="32" fill="#316b9b"/><text x="426" y="1174" font-size="18" text-anchor="start">132q_E</text><text x="128" y="1284" font-size="18" text-anchor="end">Media</text><rect x="150" y="1260" width="165" height="32" fill="#316b9b"/><text x="327" y="1284" font-size="18" text-anchor="start">(165/2)q_E</text><text x="32" y="1380" font-size="18" text-anchor="start">Barre energetiche alla stessa scala.</text><text x="32" y="1420" font-size="18" text-anchor="start">N medio = 15/2 non è un pacchetto ammesso.</text></g></svg>
