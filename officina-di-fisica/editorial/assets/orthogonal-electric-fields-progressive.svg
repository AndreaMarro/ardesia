<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1720" role="img" aria-labelledby="title desc">
<title id="title">Somma di campi elettrici perpendicolari</title><desc id="desc">Primo triangolo con cateti tre e quattro e ipotenusa cinque newton al coulomb. Secondo triangolo con componenti uguali tre e tre, direzione quarantacinque gradi. Barre finali cinque, tredici e media nove newton al coulomb.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#165a87"/></marker><marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1720" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="20" fill="#14243a">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Il triangolo 3–4–5</text><text x="32" y="83" font-size="18">Campi nello stesso punto ; unità comuni N/C.</text>
<path d="M400 470V150H160" fill="none" stroke="#8292a2" stroke-dasharray="6 6" stroke-width="2"/>
<path d="M160 470H400" stroke="#165a87" stroke-width="4" marker-end="url(#blue)"/><path d="M160 470V150" stroke="#165a87" stroke-width="4" marker-end="url(#blue)"/><path d="M160 470L400 150" stroke="#b45328" stroke-width="5" marker-end="url(#red)"/>
<path d="M160 447H183V470" fill="none" stroke="#14243a" stroke-width="2"/>
<circle cx="160" cy="470" r="4" fill="#14243a"/><text x="128" y="502">P</text><text x="255" y="510" fill="#165a87">E₁ = 3</text><text x="42" y="300" fill="#165a87">E₂ = 4</text><text x="315" y="330" fill="#b45328">E = 5</text>
<text x="32" y="551" font-size="18">Stessa scala per componenti e risultante.</text><text x="32" y="586" font-size="18">La diagonale è un campo, non una traiettoria.</text>
<path d="M32 620H608" stroke="#9babbc"/>
<text x="32" y="665" font-size="25" font-weight="bold">2 · Uguali componenti, bisettrice</text><text x="32" y="707" font-size="18">Caso separato: E_x = E_y = 3 N/C.</text>
<path d="M380 1005V795H170" fill="none" stroke="#8292a2" stroke-dasharray="6 6" stroke-width="2"/>
<path d="M170 1005H380" stroke="#165a87" stroke-width="4" marker-end="url(#blue)"/><path d="M170 1005V795" stroke="#165a87" stroke-width="4" marker-end="url(#blue)"/><path d="M170 1005L380 795" stroke="#b45328" stroke-width="5" marker-end="url(#red)"/>
<path d="M230 1005A60 60 0 0 0 212.426 962.574" fill="none" stroke="#28664d" stroke-width="2"/><text x="249" y="984" fill="#28664d">45°</text>
<text x="140" y="1039">P</text><text x="260" y="1048" fill="#165a87">3 N/C</text><text x="65" y="890" fill="#165a87">3 N/C</text><text x="355" y="884" fill="#b45328">E</text>
<text x="32" y="1093" font-size="18">La risultante è nel primo quadrante.</text><text x="32" y="1128" font-size="18">Gli angoli acuti uguali sommano 90°.</text>
<path d="M32 1162H608" stroke="#9babbc"/>
<text x="32" y="1207" font-size="25" font-weight="bold">3 · Media di due moduli</text>
<path d="M130 1237V1507" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="1265" width="120" height="38" fill="#165a87"/><rect x="130" y="1345" width="312" height="38" fill="#165a87"/><rect x="130" y="1425" width="216" height="38" fill="#28664d"/>
<text x="50" y="1293">A</text><text x="270" y="1293">5 N/C</text><text x="50" y="1373">B</text><text x="462" y="1373">13 N/C</text><text x="32" y="1453">Media</text><text x="366" y="1453">9 N/C</text><text x="104" y="1501">0</text>
<text x="32" y="1550" font-size="18">A: 3 e 4 N/C ; B: 5 e 12 N/C.</text><text x="32" y="1586" font-size="18">Le barre hanno origine e scala comuni.</text><text x="32" y="1622" font-size="18">Componenti medie 4 e 8 N/C: modulo 4√5 N/C.</text><text x="32" y="1658" font-size="18">Quel modulo non è la media 9 N/C rappresentata.</text>
</g></svg>
