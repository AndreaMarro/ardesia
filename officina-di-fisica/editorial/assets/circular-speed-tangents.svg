<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1100" role="img" aria-labelledby="title desc">
<title id="title">Giro, tangenti e rapidità</title><desc id="desc">Tre tappe per moto circolare uniforme di raggio un metro e periodo pi greco secondi. Il giro misura due pi greco metri. Due istanti mostrano velocità tangenti di modulo due metri al secondo: verso l’alto a destra e verso sinistra in alto, per rotazione antioraria. La rapidità è due metri al secondo, mentre sul giro completo la velocità media vettoriale è zero. Geometria a cento unità SVG per metro; frecce della velocità a quaranta per metro al secondo. Le due scale misurano grandezze diverse.</desc>
<defs><marker id="velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#12617c"/></marker></defs>
<rect width="640" height="1100" rx="18" fill="#faf8f2"/>
<g font-family="system-ui,sans-serif" fill="#142f3b"><g font-size="23" font-weight="700"><text x="28" y="42">1 · Misura la lunghezza del giro</text><text x="28" y="402">2 · Osserva due istanti distinti</text><text x="28" y="802">3 · Dividi per il periodo</text></g>
<g fill="none" stroke="#6b7b7d" stroke-width="2"><circle cx="180" cy="210" r="100"/><circle cx="180" cy="560" r="100"/><path d="M180 210H280"/></g>
<g fill="#142f3b"><circle cx="180" cy="210" r="4"/><circle cx="180" cy="560" r="4"/></g>
<g font-size="20"><text x="161" y="239">O</text><text x="194" y="192">r = 1 m</text><text x="325" y="181">Un giro: C = 2π m</text><text x="325" y="223">Periodo: T = π s</text><text x="28" y="345">Geometria: 100 px/m</text></g>
<g stroke="#12617c" stroke-width="5" fill="none" marker-end="url(#velocity)"><path d="M280 560V480"/><path d="M180 460H100"/></g>
<g fill="#12617c"><circle cx="280" cy="560" r="5"/><circle cx="180" cy="460" r="5"/></g>
<g font-size="20"><text x="288" y="588">P</text><text x="188" y="448">Q</text><text x="146" y="586">O</text><text x="320" y="495">v in P: 2 m/s</text><text x="36" y="438">v in Q: 2 m/s</text><text x="320" y="549">Uguale modulo,</text><text x="320" y="580">direzioni diverse.</text><text x="28" y="720">Velocità: 40 px per m/s</text><text x="28" y="754">Le frecce non misurano distanze percorse.</text></g>
<g font-size="23"><text x="28" y="858">V = C/T = (2π m)/(π s) = 2 m/s</text><text x="28" y="921">Sul giro completo:</text><text x="28" y="964">spostamento netto = 0 m</text><text x="28" y="1007">velocità media vettoriale = 0 m/s</text></g></g></svg>
