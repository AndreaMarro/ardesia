<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1310" role="img" aria-labelledby="title desc">
<title id="title">Un campo radiale appartiene al punto di osservazione</title>
<desc id="desc">Una sorgente positiva di un nanocoulomb dà campo uscente di un newton per coulomb a tre metri. Alla distanza di un metro, con la stessa sorgente, il campo è nove. Un altro confronto usa quattro nanocoulomb a due metri e dà ancora nove, con media cinque fra uno e nove.</desc>
<defs><marker id="field" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#165a87"/></marker></defs>
<rect width="640" height="1310" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Il campo in P è diretto all’esterno</text>
<text x="32" y="83" font-size="18">Sorgente Q = 1 nC ; punto P a r = 3 m.</text>
<circle cx="110" cy="180" r="15" fill="none" stroke="#b45328" stroke-width="2"/>
<text x="102" y="187">+</text><text x="73" y="225">Q fissa</text>
<circle cx="350" cy="180" r="4" fill="#14243a"/>
<path d="M355 180H515" stroke="#165a87" stroke-width="4" marker-end="url(#field)"/>
<text x="337" y="225">P</text><text x="372" y="142">E(P) = 1 N/C</text>
<path d="M110 270H350M110 258V282M350 258V282" stroke="#14243a" stroke-width="2" fill="none"/>
<text x="205" y="307">3 m</text>
<text x="32" y="352" font-size="18">Freccia locale schematica; nessuna prova q disegnata.</text>
<path d="M32 387H608" stroke="#9babbc"/>
<text x="32" y="432" font-size="25" font-weight="bold">2 · La stessa sorgente, un punto vicino</text>
<text x="32" y="471" font-size="18">Q = 1 nC fissata ; campo in N/C.</text>
<path d="M150 510V730" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="540" width="40" height="38" fill="#165a87"/>
<rect x="150" y="640" width="360" height="38" fill="#28664d"/>
<text x="45" y="568">r = 3 m</text><text x="210" y="568">1 N/C</text>
<text x="45" y="668">r = 1 m</text><text x="530" y="668">9 N/C</text>
<text x="125" y="724">0</text>
<text x="32" y="776" font-size="18">Distanza divisa per tre ; campo moltiplicato per nove.</text>
<text x="32" y="809" font-size="18">Le due barre condividono origine e scala.</text>
<path d="M32 846H608" stroke="#9babbc"/>
<text x="32" y="891" font-size="25" font-weight="bold">3 · Una seconda prova e la media</text>
<text x="32" y="931" font-size="18">A: 1 nC a 3 m ; C: 4 nC a 2 m.</text>
<path d="M150 963V1200" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="985" width="40" height="34" fill="#165a87"/>
<rect x="150" y="1056" width="360" height="34" fill="#b45328"/>
<rect x="150" y="1127" width="200" height="34" fill="#28664d"/>
<text x="50" y="1011">A</text><text x="210" y="1011">1 N/C</text>
<text x="50" y="1082">C</text><text x="530" y="1082">9 N/C</text>
<text x="32" y="1153">Media</text><text x="370" y="1153">5 N/C</text>
<text x="125" y="1194">0</text>
<text x="32" y="1247" font-size="18">Media delle uscite: (1 + 9)/2 = 5 N/C.</text>
<text x="32" y="1279" font-size="18">Campi di prove diverse, non forze da sommare.</text>
</g></svg>
