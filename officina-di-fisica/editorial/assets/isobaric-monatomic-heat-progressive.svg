<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
<title id="title">Gas monoatomico, capacità ed energie distinte</title>
<desc id="desc">Tre pannelli: capacità totali a volume e pressione costante; ripartizione del calore di cinquanta joule in trenta joule di energia interna e venti di lavoro; caso separato con aumento di due kelvin, dieci joule di calore, sei di energia interna e quattro di lavoro.</desc>
<rect width="640" height="1120" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" font-size="20" fill="#14243a">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Capacità dell’intero campione</text>
<text x="32" y="82">nR = 2 J/K; gas ideale monoatomico</text>
<text x="40" y="143">Cᵥ</text><rect x="105" y="118" width="150" height="34" fill="#28664d"/><text x="272" y="143">3 J/K</text>
<text x="40" y="208">Cₚ</text><rect x="105" y="183" width="250" height="34" fill="#165a87"/><text x="372" y="208">5 J/K</text>
<text x="32" y="264">Cₚ − Cᵥ = nR = 2 J/K</text>
<text x="32" y="299" font-size="18">Scale delle barre: 50 px per J/K.</text>
<path d="M32 330H608" stroke="#9babbc"/>
<text x="32" y="375" font-size="25" font-weight="bold">2 · Riscaldamento di 10 K</text>
<text x="32" y="415">Q = ΔU + W = 30 J + 20 J = 50 J</text>
<text x="52" y="475">Q</text><rect x="105" y="448" width="400" height="38" fill="#14243a"/><text x="522" y="475">50 J</text>
<rect x="105" y="519" width="240" height="52" fill="#28664d"/>
<rect x="345" y="519" width="160" height="52" fill="#165a87"/>
<text x="132" y="552" fill="#fff">ΔU = 30 J</text><text x="364" y="552" fill="#fff">W = 20 J</text>
<text x="32" y="616" font-size="18">Stessa scala per tutte le energie: 8 px/J.</text>
<text x="32" y="650" font-size="18">Il lavoro esce; l’aumento di U rimane nel gas.</text>
<path d="M32 683H608" stroke="#9babbc"/>
<text x="32" y="729" font-size="25" font-weight="bold">3 · Caso separato: aumento di 2 K</text>
<text x="32" y="770">Stesso nR; la domanda 03 chiede ΔU.</text>
<text x="45" y="832">Q</text><rect x="110" y="807" width="250" height="34" fill="#14243a"/><text x="377" y="832">10 J</text>
<text x="32" y="899">ΔU</text><rect x="110" y="874" width="150" height="34" fill="#28664d"/><text x="277" y="899">6 J</text>
<text x="45" y="966">W</text><rect x="110" y="941" width="100" height="34" fill="#165a87"/><text x="227" y="966">4 J</text>
<text x="32" y="1022">ΔU = Cᵥ ΔT; Q = Cₚ ΔT</text>
<text x="32" y="1062" font-size="18">Scale delle barre del pannello 3: 25 px/J.</text>
<text x="32" y="1094" font-size="18">Il vincolo isobaro non rende Q uguale a ΔU.</text>
</g></svg>
