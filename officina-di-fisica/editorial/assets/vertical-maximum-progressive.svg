<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1380" viewBox="0 0 640 1380" role="img" aria-labelledby="title desc">
<title id="title">Guadagno di quota fino all’apice</title><desc id="desc">Tre tappe per lancio verso l’alto a due metri al secondo con campo uniforme di modulo due metri al secondo quadrato. Zero temporale al lancio, zero della quota relativa al punto di lancio. Il disegno spaziale usa centoventi pixel per metro e mostra un metro di salita. Il grafico della componente di velocità usa centosessanta pixel per secondo e ottanta per metro al secondo: velocità due al lancio e zero a un secondo, area un metro. Il grafico del guadagno di quota usa centosessanta pixel per secondo e centosessanta per metro: z=2t−t² in unità SI, tangente orizzontale all’apice di un metro a un secondo. L’accelerazione rimane negativa anche all’apice. Si mostra la sola salita.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#173d50"/></marker></defs>
<rect width="640" height="1380" fill="#fffdf7"/>
<g fill="#173d50" font-family="sans-serif" font-size="23">
<text x="28" y="42" font-weight="bold">1 · La quota si misura dal lancio</text><text x="28" y="82">z = y − y₀ · disegno spaziale: 120 px/m</text>
<path d="M100 340V176" stroke="#173d50" stroke-width="2" marker-end="url(#arrow)"/><path d="M150 340H500" stroke="#879b9a" stroke-width="2"/>
<path d="M200 340V220" stroke="#173d50" stroke-width="3" marker-end="url(#arrow)"/><circle cx="200" cy="340" r="7"/><circle cx="200" cy="220" r="7"/>
<text x="62" y="166">+z</text><text x="71" y="347">0</text><text x="61" y="227">1 m</text><text x="230" y="226">apice: u = 0</text><text x="230" y="348">lancio: t = 0</text>
<text x="330" y="278">v₀ = +2 m/s</text><text x="330" y="314">aᵧ = −2 m/s²</text>
<text x="28" y="444" font-weight="bold">2 · Il primo zero della velocità</text><text x="28" y="486">u–t: 160 px/s; 80 px per m/s</text>
<path d="M100 760V600L260 760Z" fill="#cee2de"/>
<path d="M100 570V760H350" stroke="#879b9a" stroke-width="2" fill="none"/><path d="M100 600L260 760" stroke="#173d50" stroke-width="4" fill="none"/>
<text x="110" y="576">u (m/s)</text><text x="51" y="607">+2</text><text x="76" y="767">0</text><text x="90" y="798">0</text><text x="250" y="798">1</text><text x="362" y="768">t (s)</text>
<text x="385" y="611">T = v₀/g = 1 s</text><text x="385" y="658">Area: H = 1 m</text>
<text x="28" y="901" font-weight="bold">3 · La quota ha tangente orizzontale</text><text x="28" y="944">z–t: 160 px/s; 160 px/m</text>
<path d="M100 1020V1210H350" stroke="#879b9a" stroke-width="2" fill="none"/>
<path d="M100 1210Q180 1050 260 1050" stroke="#173d50" stroke-width="4" fill="none"/>
<path d="M230 1050H330" stroke="#879b9a" stroke-width="2" stroke-dasharray="6 5"/><circle cx="260" cy="1050" r="6"/>
<text x="110" y="1024">z (m)</text><text x="62" y="1057">1</text><text x="76" y="1217">0</text><text x="90" y="1248">0</text><text x="250" y="1248">1</text><text x="362" y="1218">t (s)</text><text x="335" y="1094">z(1 s) = H = 1 m</text>
<text x="28" y="1320">All’apice u = 0, ma aᵧ = −g rimane non nulla.</text><text x="28" y="1364">I grafici mostrano la sola salita.</text>
</g></svg>
