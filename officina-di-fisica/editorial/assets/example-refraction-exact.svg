<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1470" viewBox="0 0 640 1470" role="img" aria-labelledby="title desc">
<title id="title">Aria e vetro: angoli alla normale e seno esatto</title><desc id="desc">Tre tappe: la superficie e la normale sono perpendicolari; incidenza e riflessione valgono quarantacinque gradi. Il raggio trasmesso ha seno radice di due diviso tre. Il triangolo dei rapporti ha lati radice di due, radice di sette e tre, tutti disegnati con la stessa scala. Le lunghezze dei raggi non rappresentano intensità.</desc>
<defs><marker id="in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#155fa0"/></marker><marker id="out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a33430"/></marker><marker id="trans" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#217548"/></marker></defs>
<rect width="640" height="1470" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" font-size="22" fill="#172c3b">
<text x="35" y="48" font-size="27">1. Prima la normale, poi gli angoli</text>
<text x="35" y="90" font-size="22">45° dalla superficie → 45° dalla normale</text>
<rect x="35" y="320" width="570" height="240" fill="#e6eff5"/>
<path d="M35 320H605" stroke="#6e7f88" stroke-width="2" fill="none"/>
<path d="M340 125V550" fill="none" stroke="#6e7f88" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M170.000000 150.000000L340.000000 320.000000" fill="none" stroke="#155fa0" stroke-width="4" marker-end="url(#in)"/>
<path d="M340.000000 320.000000L510.000000 150.000000" fill="none" stroke="#a33430" stroke-width="4" marker-end="url(#out)"/>
<path d="M340.000000 320.000000L424.852814 478.745079" fill="none" stroke="#217548" stroke-width="4" marker-end="url(#trans)"/>
<path d="M340 265A55 55 0 0 0 301.109127 281.109127" stroke="#172c3b" fill="none"/><path d="M340 265A55 55 0 0 1 378.890873 281.109127" stroke="#172c3b" fill="none"/>
<path d="M340 385A65 65 0 0 0 370.641294 377.324612" stroke="#172c3b" fill="none"/>
<text x="80" y="265" font-size="22">incidente</text>
<text x="470" y="265" font-size="22">riflesso</text>
<text x="275" y="220" font-size="22">45°</text>
<text x="385" y="220" font-size="22">45°</text>
<text x="425" y="405" font-size="22">θ₂</text>
<text x="50" y="510" font-size="22">vetro: n₂ = 3/2</text>
<text x="50" y="175" font-size="22">aria: n₁ = 1</text>
<text x="350" y="535" font-size="22">normale</text>
<text x="35" y="605" font-size="27">2. Snell dà un rapporto esatto</text>
<text x="35" y="650" font-size="22">sin θ₂ = (2/3) · (√2/2) = √2/3</text>
<path d="M220 760V892.287566H290.710678Z" fill="#e9f2e8" stroke="#217548" stroke-width="3"/><path d="M220 875H237V892.287566" fill="none" stroke="#172c3b"/>
<text x="155" y="835" font-size="22">√7</text>
<text x="240" y="935" font-size="22">√2</text>
<text x="290" y="815" font-size="22">3</text>
<text x="185" y="750" font-size="22">θ₂</text>
<text x="35" y="985" font-size="22">Triangolo dei rapporti: scala 50 px/unità</text>
<text x="35" y="1025" font-size="22">(√2)² + (√7)² = 9 = 3²</text>
<text x="35" y="1100" font-size="27">3. Confrontare senza calcolare gradi</text>
<text x="35" y="1145" font-size="22">sin² θ₂ = 2/9; sin² 30° = 1/4</text>
<text x="35" y="1190" font-size="22">2/9 &lt; 1/4 perché 8 &lt; 9</text>
<text x="35" y="1235" font-size="22">Nel primo quadrante: 0° &lt; θ₂ &lt; 30°</text>
<text x="35" y="1290" font-size="22">θ₂ = arcsin(√2/3), senza arrotondare</text>
<text x="35" y="1345" font-size="22">Inversa: n₂ = n₁ sin θ₁ / sin θ₂</text>
<text x="35" y="1400" font-size="22">Gli indici e i seni sono adimensionali.</text>
</g></svg>
