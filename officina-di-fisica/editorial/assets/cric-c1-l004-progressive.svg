<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1820"><title>Arresto, ritorno e accelerazione radiale</title><desc>Tre modelli distinti. Triangolo velocità tempo fino al primo arresto a 2 secondi. Quota di un lancio verticale che ritorna a zero a 6/5 secondi. Disco con velocità angolare comune e accelerazioni radiali in rapporto 2.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#28738d" /></marker></defs><rect width="640" height="1820" fill="white" /><g font-family="Arial,sans-serif" font-size="20" fill="#18354b"><text x="32" y="44" font-size="26">Leggere l’accelerazione</text><text x="32" y="105" font-size="23">1 · Arrestarsi senza prolungare il moto</text><path d="M120 440V160M100 410H520" stroke="#879da8" fill="none" /><text x="75" y="150">v (m/s)</text><text x="530" y="415">t (s)</text><path d="M120 170L440 410H120Z" fill="#c5e1eb" /><path d="M120 170L440 410" stroke="#28738d" stroke-width="4" /><text x="80" y="180">4</text><text x="90" y="435">0</text><text x="432" y="445">2</text><text x="200" y="345">Area: 4 m</text><text x="32" y="510">D = metà di (2 s) × (4 m/s) = 4 m.</text><text x="32" y="550">Il modello si ferma al primo arresto.</text><text x="32" y="630" font-size="23">2 · Ritornare alla stessa quota</text><path d="M120 1060V750M100 1030H530" stroke="#879da8" fill="none" /><text x="75" y="740">y (m)</text><text x="535" y="1035">t (s)</text><path d="M120 1030Q300 670 480 1030" stroke="#28738d" stroke-width="4" fill="none" /><path d="M120 850H300V1030" stroke="#a66e36" stroke-dasharray="6 5" fill="none" /><text x="60" y="858">9/5</text><text x="90" y="1055">0</text><text x="275" y="1070">3/5</text><text x="460" y="1070">6/5</text><text x="32" y="1130">Salita: 3/5 s. Ritorno: 6/5 s.</text><text x="32" y="1170">La curva rappresenta la quota nel tempo.</text><text x="32" y="1250" font-size="23">3 · Stesso disco, stessa ω</text><circle cx="300" cy="1500" r="160" stroke="#879da8" fill="none" /><circle cx="300" cy="1500" r="80" stroke="#879da8" fill="none" /><circle cx="300" cy="1500" r="4" fill="#18354b" /><text x="270" y="1528">O</text><circle cx="300" cy="1420" r="4" fill="#18354b" /><circle cx="460" cy="1500" r="4" fill="#18354b" /><path d="M300 1420V1470" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><path d="M460 1500H360" stroke="#28738d" stroke-width="4" marker-end="url(#a)" /><text x="310" y="1400">r</text><text x="480" y="1490">2r</text><text x="318" y="1450">a₁</text><text x="360" y="1570">a₂ = 2a₁</text><text x="32" y="1730">Le frecce a₁ e a₂ usano la stessa scala.</text><text x="32" y="1770">Entrambe puntano al centro; a_c = ω²r.</text></g></svg>