<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
<title id="title">Compressione e calore, due ingressi energetici</title>
<desc id="desc">Calore e lavoro di compressione entrano nel gas. Venti joule come calore e trenta come lavoro producono aumento interno di cinquanta joule. Una somma a barre e il confronto fra due prove mostrano i segni e la media.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#165a87"/></marker></defs>
<rect width="640" height="1120" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" font-size="20" fill="#14243a">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Entrambi gli scambi entrano</text>
<rect x="230" y="100" width="180" height="160" rx="8" fill="#e6f1e9" stroke="#14243a" stroke-width="3"/>
<text x="271" y="139">Gas chiuso</text><text x="263" y="194">ΔU = 50 J</text>
<path d="M120 160H220" stroke="#165a87" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M570 215H420" stroke="#165a87" stroke-width="4" marker-end="url(#arrow)"/>
<text x="72" y="132">Q = 20 J</text><text x="439" y="180">L_on = 30 J</text>
<text x="32" y="306">W_by = −L_on = −30 J</text>
<text x="32" y="341" font-size="18">Frecce schematiche; ΔU = Q − W_by = Q + L_on.</text>
<path d="M32 372H608" stroke="#9babbc"/>
<text x="32" y="417" font-size="25" font-weight="bold">2 · Sommare le energie ricevute</text>
<rect x="100" y="459" width="120" height="48" fill="#165a87"/>
<rect x="220" y="459" width="180" height="48" fill="#28664d"/>
<text x="116" y="491" fill="#fff">Q: 20 J</text><text x="240" y="491" fill="#fff">L_on: 30 J</text>
<rect x="100" y="545" width="300" height="48" fill="#14243a"/>
<text x="181" y="577" fill="#fff">ΔU = 50 J</text>
<text x="32" y="638">20 J + 30 J = 50 J</text>
<text x="32" y="673" font-size="18">Scale comuni: 6 px/J per ingressi e aumento.</text>
<path d="M32 706H608" stroke="#9babbc"/>
<text x="32" y="751" font-size="25" font-weight="bold">3 · Due aumenti e la loro media</text>
<text x="48" y="819">A</text><rect x="100" y="796" width="250" height="32" fill="#165a87"/><text x="367" y="819">50 J</text>
<text x="48" y="879">B</text><rect x="100" y="856" width="450" height="32" fill="#165a87"/><text x="566" y="879">90 J</text>
<text x="18" y="939">Media</text><rect x="100" y="916" width="350" height="32" fill="#28664d"/><text x="467" y="939">70 J</text>
<text x="32" y="990">Media ΔU = (50 + 90) J / 2 = 70 J</text>
<text x="32" y="1031" font-size="18">Barre a 5 px/J. Media Q = 30 J; media L_on = 40 J.</text>
<text x="32" y="1066" font-size="18">La somma lineare conserva questa media.</text>
<text x="32" y="1100" font-size="18">Il lavoro ricevuto positivo va sommato al calore.</text>
</g></svg>
