<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1560" width="640" height="1560" role="img" aria-labelledby="title desc">
<title id="title">Energia sul sensore, espansione e proiezione dell’area</title>
<desc id="desc">Il sensore riceve dodici millijoule in tre secondi. Barre normalizzate mostrano intensità finale metà quando potenza e distanza raddoppiano. La sezione laterale del sensore forma trenta gradi col raggio e la sua normale sessanta; la proiezione ha metà lunghezza e, a profondità uguale, metà area.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1560" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" fill="#202c39">
<text x="32" y="52" font-size="27" font-weight="bold">1. Dal sensore all’intensità</text>
<text x="32" y="95" font-size="23">Energia ricevuta con potenza costante.</text>
<path d="M140 145V460H555" fill="none" stroke="#304d63" stroke-width="3"/>
<path d="M140 460L500 180" fill="none" stroke="#26728d" stroke-width="4"/>
<path d="M140 180H500V460M140 320H320V460" fill="none" stroke="#304d63" stroke-width="2" stroke-dasharray="7 7"/>
<text x="32" y="151" font-size="23">E (mJ)</text>
<text x="91" y="189" font-size="23">12</text>
<text x="102" y="329" font-size="23">6</text>
<text x="105" y="494" font-size="23">0</text>
<text x="308" y="494" font-size="23">1,5</text>
<text x="493" y="494" font-size="23">3</text>
<text x="532" y="533" font-size="23">t (s)</text>
<text x="32" y="576" font-size="23">P = 4 mW; S = 2 cm²; I = 20 W/m².</text>
<line x1="32" y1="609" x2="608" y2="609" stroke="#b8c4ca"/>
<text x="32" y="664" font-size="27" font-weight="bold">2. Più potenza, ma più lontano</text>
<text x="32" y="707" font-size="23">Potenza doppia, distanza doppia.</text>
<path d="M180 740V920" fill="none" stroke="#304d63" stroke-width="3"/>
<text x="131" y="760" font-size="23">0</text>
<text x="43" y="801" font-size="23">Iᵢ</text>
<rect x="180" y="770" width="320" height="45" fill="#26728d"/>
<text x="43" y="886" font-size="23">I_f</text>
<rect x="180" y="855" width="160" height="45" fill="#986c35"/>
<text x="362" y="887" font-size="23">Iᵢ / 2</text>
<text x="32" y="967" font-size="23">Barre sulla stessa scala normalizzata.</text>
<line x1="32" y1="1000" x2="608" y2="1000" stroke="#b8c4ca"/>
<text x="32" y="1055" font-size="27" font-weight="bold">3. L’area vista dal fascio</text>
<text x="32" y="1098" font-size="23">Sezione laterale a profondità uguale.</text>
<path d="M80 1340H550" fill="none" stroke="#26728d" stroke-width="3" marker-end="url(#tip)"/>
<path d="M150.096189 1265L409.903811 1415" fill="none" stroke="#986c35" stroke-width="7"/>
<path d="M280 1340L340 1236.076952" fill="none" stroke="#4e876d" stroke-width="3" marker-end="url(#tip)"/>
<path d="M150.096189 1265H530M409.903811 1415H530" fill="none" stroke="#304d63" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M530 1265V1415M520 1265H540M520 1415H540" fill="none" stroke="#a1473c" stroke-width="3"/>
<path d="M340 1340A60 60 0 0 0 310 1288.038476" fill="none" stroke="#304d63" stroke-width="2"/>
<text x="349" y="1228" font-size="23">normale</text>
<text x="350" y="1296" font-size="23">60°</text>
<text x="442" y="1318" font-size="23">raggio</text>
<text x="115" y="1465" font-size="23">sensore</text>
<text x="405" y="1465" font-size="23">proiezione</text>
<text x="32" y="1532" font-size="23">Area: 4 m² → 2 m² efficaci. Potenza: 10 W.</text>
</g></svg>
