<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1310" role="img" aria-labelledby="title desc">
<title id="title">La forza diminuisce con il quadrato della distanza</title>
<desc id="desc">Due cariche positive da un microcoulomb sono distanti tre centimetri. La forza su quella a destra è repulsiva e vale dieci newton. Raddoppiare la distanza riduce il modulo a cinque mezzi newton. Una diversa configurazione con due microcoulomb a un centimetro dà centottanta newton; la media di dieci e centottanta è novantacinque.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1310" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · La forza su Q punta via da q</text>
<text x="32" y="83" font-size="18">q = Q = 1 μC ; separazione r = 3 cm.</text>
<circle cx="110" cy="180" r="15" fill="none" stroke="#165a87" stroke-width="2"/>
<circle cx="350" cy="180" r="15" fill="none" stroke="#b45328" stroke-width="2"/>
<text x="102" y="187">+</text><text x="342" y="187">+</text>
<path d="M366 180H526" stroke="#b45328" stroke-width="4" marker-end="url(#arrow)"/>
<text x="404" y="150">F = 10 N</text>
<text x="71" y="226">q fissa</text><text x="338" y="226">Q</text>
<path d="M110 270H350M110 258V282M350 258V282" fill="none" stroke="#14243a" stroke-width="2"/>
<text x="199" y="307">3 cm</text>
<text x="32" y="352" font-size="18">Simboli puntiformi; è disegnata la sola forza su Q.</text>
<path d="M32 387H608" stroke="#9babbc"/>
<text x="32" y="432" font-size="25" font-weight="bold">2 · Le stesse cariche, distanza doppia</text>
<text x="32" y="471" font-size="18">Q = 1 μC e q = 1 μC in entrambe le prove.</text>
<path d="M150 510V730" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="540" width="320" height="38" fill="#165a87"/>
<rect x="150" y="640" width="80" height="38" fill="#28664d"/>
<text x="45" y="568">r = 3 cm</text><text x="490" y="568">10 N</text>
<text x="45" y="668">r = 6 cm</text><text x="250" y="668">5/2 N</text>
<text x="125" y="724">0</text>
<text x="32" y="776" font-size="18">Forze in N, stessa origine e scala.</text>
<text x="32" y="809" font-size="18">Distanza ×2 ; forza ×1/4.</text>
<path d="M32 846H608" stroke="#9babbc"/>
<text x="32" y="891" font-size="25" font-weight="bold">3 · Ora cambia anche Q</text>
<text x="32" y="931" font-size="18">A: 1 μC a 3 cm ; C: 2 μC a 1 cm ; q sempre 1 μC.</text>
<path d="M150 963V1200" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="985" width="20" height="34" fill="#165a87"/>
<rect x="150" y="1056" width="360" height="34" fill="#b45328"/>
<rect x="150" y="1127" width="190" height="34" fill="#28664d"/>
<text x="50" y="1011">A</text><text x="190" y="1011">10 N</text>
<text x="50" y="1082">C</text><text x="530" y="1082">180 N</text>
<text x="32" y="1153">Media</text><text x="360" y="1153">95 N</text>
<text x="125" y="1194">0</text>
<text x="32" y="1247" font-size="18">Media delle uscite: (10 + 180)/2 = 95 N.</text>
<text x="32" y="1279" font-size="18">Ogni pannello conserva la propria scala delle forze.</text>
</g></svg>
