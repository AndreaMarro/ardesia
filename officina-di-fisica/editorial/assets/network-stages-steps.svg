<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1750" viewBox="0 0 640 1750" role="img" aria-labelledby="title desc"><title id="title">Rete di stadi e canali</title><desc id="desc">Due stadi con quattro canali ciascuno, poi due stadi con due canali ciascuno. Portata totale quattro litri al secondo. Infine barre di resistenza per due reti distinte.</desc><defs><marker id="a" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#1664a7"/></marker></defs><rect width="640" height="1750" fill="#fffdf6"/><g font-family="Arial,sans-serif" fill="#192f3d" font-size="22">
<text x="35" y="48" font-size="26" font-weight="bold">1. Due stadi, quattro canali per stadio</text>
<text x="35" y="95">N_s = 2; N_p = 4; R₀ = 2 kPa·s/L</text>
<text x="35" y="140">Q_T = 4 L/s; ogni canale porta 1 L/s</text>
<text x="85" y="190">104 kPa</text>
<text x="285" y="190">102 kPa</text>
<text x="490" y="190">100 kPa</text>
