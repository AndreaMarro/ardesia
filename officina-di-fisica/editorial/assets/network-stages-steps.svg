<path d="M360 955H500" fill="none" stroke="#83949c" stroke-width="2"/>
<rect x="420" y="941" width="40" height="28" fill="#f1dfb6" stroke="#92611c"/>
<path d="M365 955h40" fill="none" stroke="#1664a7" stroke-width="3" marker-end="url(#a)"/>
<path d="M60 910h80" fill="none" stroke="#1664a7" stroke-width="3" marker-end="url(#a)"/>
<path d="M280 910h80" fill="none" stroke="#1664a7" stroke-width="3" marker-end="url(#a)"/>
<path d="M500 910h80" fill="none" stroke="#1664a7" stroke-width="3" marker-end="url(#a)"/>
<text x="35" y="1020">Canali da 40 px, stessa scala di portata</text>
<text x="35" y="1065">Stadio: 2/2 = 1 kPa·s/L</text>
<text x="35" y="1110">Serie: 1 + 1 = 2 kPa·s/L</text>
<text x="35" y="1155">La portata comune non è il salto comune:</text>
<text x="35" y="1195">ogni stadio aggiunge una caduta.</text>
<path d="M35 1235H605" fill="none" stroke="#83949c" stroke-width="2"/>
<text x="35" y="1285" font-size="26" font-weight="bold">3. Barre delle resistenze equivalenti</text>
<text x="35" y="1330">Scala R: 60 px/(kPa·s/L)</text>
<text x="35" y="1375">A: N_s = 2, N_p = 4 → R_eq = 1</text>
<rect x="100" y="1400" width="30" height="30" fill="#1664a7"/><rect x="130" y="1400" width="30" height="30" fill="#a83832"/>
<text x="35" y="1485">B: N_s = 3, N_p = 2 → R_eq = 3</text>
<rect x="100" y="1510" width="60" height="30" fill="#1664a7"/><rect x="160" y="1510" width="60" height="30" fill="#a83832"/><rect x="220" y="1510" width="60" height="30" fill="#1664a7"/>
<text x="35" y="1590">Un segmento per stadio, somme 60 e 180 px</text>
<text x="35" y="1635">Le barre non sono portate né lunghezze di tubi.</text>
<text x="35" y="1680">Le reti sopra sono schemi senza scala metrica.</text>
<text x="35" y="1725">R₀ è uguale per tutti i canali disegnati.</text>
</g></svg>
