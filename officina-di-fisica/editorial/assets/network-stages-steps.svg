<path d="M365 285h20" fill="none" stroke="#1664a7" stroke-width="3" marker-end="url(#a)"/>
<path d="M360 330H500" fill="none" stroke="#83949c" stroke-width="2"/>
<rect x="420" y="316" width="40" height="28" fill="#f1dfb6" stroke="#92611c"/>
<path d="M365 330h20" fill="none" stroke="#1664a7" stroke-width="3" marker-end="url(#a)"/>
<path d="M360 375H500" fill="none" stroke="#83949c" stroke-width="2"/>
<rect x="420" y="361" width="40" height="28" fill="#f1dfb6" stroke="#92611c"/>
<path d="M365 375h20" fill="none" stroke="#1664a7" stroke-width="3" marker-end="url(#a)"/>
<path d="M60 307.5h80" fill="none" stroke="#1664a7" stroke-width="3" marker-end="url(#a)"/>
<path d="M280 307.5h80" fill="none" stroke="#1664a7" stroke-width="3" marker-end="url(#a)"/>
<path d="M500 307.5h80" fill="none" stroke="#1664a7" stroke-width="3" marker-end="url(#a)"/>
<text x="35" y="445">Frecce: 20 px/(L/s), canali da 20 px</text>
<text x="35" y="490">Totale: 80 px prima, fra e dopo gli stadi</text>
<text x="35" y="535">Ogni stadio: 2/4 = 1/2 kPa·s/L</text>
<text x="35" y="580">Serie: 1/2 + 1/2 = 1 kPa·s/L</text>
<path d="M35 620H605" fill="none" stroke="#83949c" stroke-width="2"/>
<text x="35" y="670" font-size="26" font-weight="bold">2. Restano due canali per stadio</text>
<text x="35" y="715">N_s = 2; N_p = 2; stesso R₀ e Q_T</text>
<text x="35" y="760">Ogni canale ora porta 2 L/s</text>
<text x="85" y="810">108 kPa</text>
<text x="285" y="810">104 kPa</text>
<text x="490" y="810">100 kPa</text>
<path d="M140 865V955" fill="none" stroke="#83949c" stroke-width="2"/>
<path d="M280 865V955" fill="none" stroke="#83949c" stroke-width="2"/>
