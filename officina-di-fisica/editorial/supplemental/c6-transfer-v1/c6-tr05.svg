<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 216" role="img" aria-labelledby="title desc"><title id="title">Lavoro sotto un tratto inclinato</title><desc id="desc">Grafico con x orizzontale e forza verticale. Il segmento da (0 m, 2 N) a (6 m, 6 N) delimita un rettangolo e un triangolo, la cui somma è il lavoro.</desc><rect x="0" y="0" width="460" height="216" rx="9" fill="#faf8ee"/><g fill="#172644" stroke="#172644" stroke-width="2" font-family="sans-serif" font-size="17"><text x="25" y="24" stroke="none">F (N)</text><path d="M75 134 L343 134 L343 62 Z" fill="#b0daba"/><rect x="75" y="134" width="268" height="36" fill="#bddded"/><path d="M75 170 L393 170" fill="none" /><path d="M75 170 L75 41" fill="none" /><path d="M75 134 L343 62" fill="none" /><text x="39" y="139" stroke="none">2</text><text x="39" y="67" stroke="none">6</text><text x="69" y="195" stroke="none">0</text><text x="335" y="195" stroke="none">6</text><text x="385" y="196" stroke="none">x (m)</text></g></svg>
