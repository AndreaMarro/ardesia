<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1600" width="640" height="1600" role="img" aria-labelledby="title desc">
<title id="title">Proiezione del campo, verso di Lenz e media nel tempo</title>
<desc id="desc">La spira è vista di taglio con normale verso l’alto; B è inclinato di sessanta gradi rispetto alla normale e la componente normale è metà del modulo. Un flusso entrante crescente richiede corrente antioraria. Il grafico finale sale da zero a otto milliweber in quattro millisecondi e resta costante fino a otto millisecondi.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1600" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" fill="#202c39" font-size="23">
<text x="32" y="53" font-size="27" font-weight="bold">1. L’angolo appartiene alla normale</text>
<text x="32" y="95">B = 0,30 T; A = 0,020 m².</text>
<path d="M80 440H515" fill="none" stroke="#986c35" stroke-width="7"/>
<path d="M180 440V150" fill="none" stroke="#8a9a9f" stroke-width="3" marker-end="url(#tip)"/>
<path d="M180 440L405.166605 310" fill="none" stroke="#26728d" stroke-width="4" marker-end="url(#tip)"/>
<path d="M405.166605 310H180" fill="none" stroke="#8a9a9f" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M180 440V310" fill="none" stroke="#4e876d" stroke-width="4" marker-end="url(#tip)"/>
<path d="M180 350A90 90 0 0 1 257.942286 395" fill="none" stroke="#304d63" stroke-width="2"/>
<text x="146" y="176">n</text><text x="418" y="308">B</text><text x="89" y="339">Bₙ</text><text x="216" y="362">60°</text>
<text x="320" y="477">spira di taglio</text>
<text x="32" y="519">Bₙ = 0,15 T; Φ = +3 mWb.</text>
<line x1="32" y1="553" x2="608" y2="553" stroke="#b8c4ca"/>
<text x="32" y="608" font-size="27" font-weight="bold">2. Opporsi al cambiamento</text>
<text x="32" y="650">Il flusso esterno entrante sta aumentando.</text>
<circle cx="320" cy="805" r="100" fill="none" stroke="#986c35" stroke-width="5"/>
<path d="M420 805A100 100 0 0 0 320 705" fill="none" stroke="#26728d" stroke-width="4" marker-end="url(#tip)"/>
<g fill="none" stroke="#8a9a9f" stroke-width="3"><path d="M274 761L294 781M274 781L294 761M344 761L364 781M344 781L364 761M274 831L294 851M274 851L294 831M344 831L364 851M344 851L364 831"/></g>
<text x="440" y="747">I</text><text x="32" y="959">Corrente antioraria → contributo uscente.</text>
<text x="32" y="1001">Qui la risposta contrasta un aumento entrante.</text>
<line x1="32" y1="1037" x2="608" y2="1037" stroke="#b8c4ca"/>
<text x="32" y="1092" font-size="27" font-weight="bold">3. Contare anche il tratto piatto</text>
<text x="32" y="1134">La media richiesta comprende tutti gli 8 ms.</text>
<path d="M140 1180V1430H575" fill="none" stroke="#304d63" stroke-width="3"/>
<path d="M140 1430L340 1230H540" fill="none" stroke="#26728d" stroke-width="5"/>
<path d="M140 1230H340V1430M540 1230V1430" fill="none" stroke="#8a9a9f" stroke-width="2" stroke-dasharray="7 7"/>
<text x="32" y="1196">Φ (mWb)</text><text x="107" y="1240">8</text><text x="104" y="1464">0</text><text x="334" y="1464">4</text><text x="534" y="1464">8</text><text x="511" y="1504">t (ms)</text>
<text x="32" y="1554">|f.e.m. media| = 8 mWb / 8 ms = 1 V.</text>
</g></svg>
