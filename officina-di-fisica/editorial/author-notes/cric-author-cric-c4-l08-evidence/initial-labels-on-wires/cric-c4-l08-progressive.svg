<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1560" width="640" height="1560" role="img" aria-labelledby="title desc">
<title id="title">Condensatori fra nodi, capacità in serie e carica condivisa</title>
<desc id="desc">Tre capacità in parallelo da due, tre e cinque microfarad vedono quattro volt. Barre a scala comune confrontano nove, quattro virgola cinque e tre microfarad. Due somme di cariche, sedici più ventiquattro e dieci più trenta microcoulomb, hanno entrambe totale quaranta.</desc>
<rect width="640" height="1560" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" fill="#202c39" font-size="23">
<text x="32" y="53" font-size="27" font-weight="bold">1. Tre capacità, gli stessi due nodi</text>
<text x="32" y="95">Preparazione scarica, generatore da 4 V.</text>
<g fill="none" stroke="#304d63" stroke-width="4">
<path d="M80 265V170H550M80 335V430H550M220 170V260M220 290V430M350 170V260M350 290V430M480 170V260M480 290V430"/>
<path d="M185 260H255M185 290H255M315 260H385M315 290H385M445 260H515M445 290H515" stroke="#26728d" stroke-width="7"/>
<circle cx="80" cy="300" r="35" fill="#ffffff"/>
</g>
<text x="57" y="309">4 V</text><text x="112" y="250">+</text><text x="112" y="354">−</text>
<text x="183" y="365">2 μF</text><text x="313" y="365">3 μF</text><text x="443" y="365">5 μF</text>
<text x="560" y="179">A</text><text x="560" y="439">B</text>
<text x="32" y="493">Q₊ = (8 + 12 + 20) μC = 40 μC.</text>
<text x="32" y="531">Il filo ideale conserva l’identità dei nodi.</text>
<line x1="32" y1="565" x2="608" y2="565" stroke="#b8c4ca"/>
<text x="32" y="619" font-size="27" font-weight="bold">2. L’equivalente di una serie</text>
<text x="32" y="660">9 μF in serie con 4,5 μF danno 3 μF.</text>
<line x1="160" y1="704" x2="160" y2="968" stroke="#304d63" stroke-width="3"/>
<text x="112" y="723">0</text>
<text x="47" y="769">C₁</text><rect x="160" y="735" width="270" height="42" fill="#26728d"/><text x="451" y="767">9 μF</text>
<text x="47" y="855">Cₓ</text><rect x="160" y="821" width="135" height="42" fill="#986c35"/><text x="315" y="853">4,5 μF</text>
<text x="47" y="940">Cₛ</text><rect x="160" y="906" width="90" height="42" fill="#4e876d"/><text x="270" y="938">3 μF</text>
<text x="32" y="1008">Le tre barre condividono origine e scala.</text>
<line x1="32" y1="1040" x2="608" y2="1040" stroke="#b8c4ca"/>
<text x="32" y="1095" font-size="27" font-weight="bold">3. La carica del nodo si conserva</text>
<text x="32" y="1137">C₁ = 2 μF, C₂ = 6 μF; polarità concordi.</text>
<text x="32" y="1190">Prima: 8 V e 4 V</text>
<rect x="160" y="1212" width="160" height="55" fill="#26728d"/><rect x="320" y="1212" width="240" height="55" fill="#986c35"/>
<text x="193" y="1247" fill="#ffffff">16 μC</text><text x="402" y="1247" fill="#ffffff">24 μC</text>
<text x="32" y="1320">Dopo: entrambi a 5 V</text>
<rect x="160" y="1342" width="100" height="55" fill="#26728d"/><rect x="260" y="1342" width="300" height="55" fill="#986c35"/>
<text x="177" y="1377" fill="#ffffff">10 μC</text><text x="372" y="1377" fill="#ffffff">30 μC</text>
<path d="M160 1200V1410M560 1200V1410" fill="none" stroke="#8a9a9f" stroke-width="2" stroke-dasharray="7 7"/>
<text x="32" y="1465">Stessa somma: 40 μC. Stessa scala di carica.</text>
<text x="32" y="1515">La tensione finale è una media pesata con C.</text>
</g></svg>
