<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Potenziale, elasticità e dissipazione</title><desc id="desc">Una salita, due deformazioni elastiche e il bilancio di un sistema blocco-piano isolato.</desc><rect x="0" y="0" width="640" height="1600" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Configurazioni ed energia del sistema</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · L’aumento di quota cambia U_g</text><line x1="80" y1="380" x2="550" y2="380" stroke="#607383" stroke-width="2"/><circle cx="180" cy="380" r="9" fill="#306f8c"/><circle cx="330" cy="230" r="9" fill="#306f8c"/><line x1="330" y1="230" x2="330" y2="380" stroke="#607383" stroke-width="2"/><line x1="450" y1="380" x2="450" y2="230" stroke="#986c35" stroke-width="2"/><polygon points="450,230 454.0,238.0 446.0,238.0" fill="#986c35"/><line x1="330" y1="230" x2="330" y2="310" stroke="#306f8c" stroke-width="2"/><polygon points="330,310 326.0,302.0 334.0,302.0" fill="#306f8c"/><text x="100" y="425" font-size="19" fill="#203247" text-anchor="start">Quota iniziale</text><text x="350" y="290" font-size="19" fill="#203247" text-anchor="start">P = 2 N</text><text x="470" y="305" font-size="19" fill="#203247" text-anchor="start">3/2 m</text><text x="35" y="485" font-size="19" fill="#203247" text-anchor="start">ΔU_g = (2 N) · (3/2 m) = 3 J</text><text x="35" y="590" font-size="21" fill="#203247" text-anchor="start">2 · Deformazioni e loro energie</text><text x="125" y="697" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="150" y="675" width="100" height="25" fill="#637e55"/><text x="270" y="697" font-size="19" fill="#203247" text-anchor="start">x = 2 cm · U = 4/5 J</text><text x="125" y="837" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="150" y="815" width="250" height="25" fill="#986c35"/><text x="420" y="837" font-size="19" fill="#203247" text-anchor="start">x = 5 cm</text><text x="420" y="880" font-size="19" fill="#203247" text-anchor="start">U = 5 J</text><text x="35" y="955" font-size="19" fill="#203247" text-anchor="start">U cresce come x²; k è lo stesso.</text><text x="35" y="1065" font-size="21" fill="#203247" text-anchor="start">3 · Il sistema isolato conserva l’energia</text><text x="35" y="1120" font-size="19" fill="#203247" text-anchor="start">Blocco e piano: aumento interno, non perdita totale.</text><text x="125" y="1227" font-size="18" fill="#203247" text-anchor="end">Prima</text><rect x="150" y="1205" width="360" height="30" fill="#3d7791"/><text x="330" y="1190" font-size="18" fill="#203247" text-anchor="middle">K_i = 20 J</text><text x="125" y="1377" font-size="18" fill="#203247" text-anchor="end">Dopo</text><rect x="150" y="1355" width="126" height="30" fill="#3d7791"/><rect x="276" y="1355" width="234" height="30" fill="#986c35"/><text x="213" y="1325" font-size="18" fill="#203247" text-anchor="middle">K_f = 7 J</text><text x="393" y="1425" font-size="18" fill="#203247" text-anchor="middle">ΔU_int = 13 J</text><text x="35" y="1510" font-size="19" fill="#203247" text-anchor="start">20 J = 7 J + 13 J; stessa scala nelle barre.</text></svg>
