<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1550" viewBox="0 0 640 1550" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Tre letture della stessa lezione</title><desc id="desc">Forze sulla scatola alla soglia, lunghezze di una molla e campo gravitazionale a due distanze dal centro.</desc><rect x="0" y="0" width="640" height="1550" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Contatto, lunghezza e distanza dal centro</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Alla soglia, prima dello scorrimento</text><rect x="290" y="280" width="80" height="40" fill="#e5edf2"/><line x1="330" y1="300" x2="330" y2="120" stroke="#306f8c" stroke-width="2"/><polygon points="330,120 334.0,128.0 326.0,128.0" fill="#306f8c"/><line x1="330" y1="300" x2="330" y2="480" stroke="#986c35" stroke-width="2"/><polygon points="330,480 326.0,472.0 334.0,472.0" fill="#986c35"/><line x1="330" y1="300" x2="384" y2="300" stroke="#306f8c" stroke-width="2"/><polygon points="384,300 376.0,304.0 376.0,296.0" fill="#306f8c"/><line x1="330" y1="300" x2="276" y2="300" stroke="#637e55" stroke-width="2"/><polygon points="276,300 284.0,296.0 284.0,304.0" fill="#637e55"/><text x="350" y="150" font-size="19" fill="#203247" text-anchor="start">N = 60 N</text><text x="350" y="465" font-size="19" fill="#203247" text-anchor="start">P = 60 N</text><text x="405" y="290" font-size="19" fill="#203247" text-anchor="start">T = 18 N</text><text x="110" y="345" font-size="19" fill="#203247" text-anchor="start">f_s = 18 N</text><text x="35" y="535" font-size="19" fill="#203247" text-anchor="start">Fino alla soglia: 0 ≤ |f_s| ≤ 18 N.</text><text x="35" y="620" font-size="21" fill="#203247" text-anchor="start">2 · Una lunghezza comprende la deformazione</text><text x="35" y="678" font-size="19" fill="#203247" text-anchor="start">A riposo</text><rect x="150" y="710" width="220" height="24" fill="#637e55"/><text x="390" y="730" font-size="19" fill="#203247" text-anchor="start">11 cm</text><text x="35" y="810" font-size="19" fill="#203247" text-anchor="start">Sotto tiro</text><rect x="150" y="842" width="220" height="24" fill="#637e55"/><rect x="370" y="842" width="60" height="24" fill="#986c35"/><text x="450" y="862" font-size="19" fill="#203247" text-anchor="start">14 cm</text><line x1="370" y1="900" x2="430" y2="900" stroke="#607383" stroke-width="2"/><text x="400" y="934" font-size="18" fill="#203247" text-anchor="middle">3 cm</text><text x="35" y="985" font-size="19" fill="#203247" text-anchor="start">Stessa origine; il tratto aggiunto è x = F/k.</text><text x="35" y="1080" font-size="21" fill="#203247" text-anchor="start">3 · Quota R, distanza dal centro 2 R</text><circle cx="180" cy="1200" r="60" fill="#e5edf2"/><circle cx="180" cy="1200" r="3" fill="#306f8c"/><circle cx="240" cy="1200" r="4" fill="#306f8c"/><circle cx="300" cy="1200" r="4" fill="#306f8c"/><line x1="180" y1="1200" x2="300" y2="1200" stroke="#607383" stroke-width="2"/><text x="180" y="1300" font-size="18" fill="#203247" text-anchor="middle">O</text><text x="240" y="1240" font-size="18" fill="#203247" text-anchor="middle">R</text><text x="300" y="1240" font-size="18" fill="#203247" text-anchor="middle">2 R</text><text x="355" y="1170" font-size="19" fill="#203247" text-anchor="start">g(R) = 8 m/s²</text><rect x="355" y="1190" width="160" height="22" fill="#3d7791"/><text x="355" y="1270" font-size="19" fill="#203247" text-anchor="start">g(2 R) = 2 m/s²</text><rect x="355" y="1290" width="40" height="22" fill="#637e55"/><text x="35" y="1410" font-size="19" fill="#203247" text-anchor="start">Il campo esterno diminuisce come 1/r².</text><text x="35" y="1460" font-size="19" fill="#203247" text-anchor="start">r è misurato dal centro, non dalla superficie.</text></svg>
