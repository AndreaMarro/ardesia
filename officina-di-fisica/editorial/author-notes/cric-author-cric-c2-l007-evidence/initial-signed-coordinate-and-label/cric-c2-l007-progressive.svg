<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1860" viewBox="0 0 640 1860" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Gradiente, viscosità e profilo</title><desc id="desc">Tre prove distinte: Couette, retta costitutiva e parabola della velocità lungo un diametro del tubo.</desc><rect x="0" y="0" width="640" height="1860" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Dal profilo allo sforzo</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Gradiente medio fra piastre</text><line x1="100" y1="420" x2="500" y2="420" stroke="#607383" stroke-width="2"/><line x1="100" y1="220" x2="500" y2="220" stroke="#607383" stroke-width="2"/><line x1="180" y1="370" x2="230" y2="370" stroke="#306f8c" stroke-width="2"/><polygon points="230,370 222.0,374.0 222.0,366.0" fill="#306f8c"/><line x1="180" y1="320" x2="280" y2="320" stroke="#306f8c" stroke-width="2"/><polygon points="280,320 272.0,324.0 272.0,316.0" fill="#306f8c"/><line x1="180" y1="270" x2="330" y2="270" stroke="#306f8c" stroke-width="2"/><polygon points="330,270 322.0,274.0 322.0,266.0" fill="#306f8c"/><line x1="180" y1="220" x2="380" y2="220" stroke="#306f8c" stroke-width="2"/><polygon points="380,220 372.0,224.0 372.0,216.0" fill="#306f8c"/><line x1="180" y1="420" x2="380" y2="220" stroke="#986c35" stroke-width="2"/><text x="90" y="470" font-size="19" fill="#203247" text-anchor="start">parete ferma</text><text x="385" y="190" font-size="19" fill="#203247" text-anchor="start">0,020 m/s</text><text x="35" y="325" font-size="18" fill="#203247" text-anchor="start">0,50 mm</text><text x="35" y="535" font-size="19" fill="#203247" text-anchor="start">G = Δv_x / Δy = 40 s⁻¹</text><text x="35" y="640" font-size="21" fill="#203247" text-anchor="start">2 · Una prova autonoma: τ = η G</text><line x1="120" y1="1010" x2="120" y2="720" stroke="#607383" stroke-width="2"/><line x1="100" y1="990" x2="520" y2="990" stroke="#607383" stroke-width="2"/><line x1="120" y1="990" x2="420" y2="774" stroke="#306f8c" stroke-width="4"/><line x1="420" y1="774" x2="420" y2="990" stroke="#986c35" stroke-width="2"/><line x1="120" y1="774" x2="420" y2="774" stroke="#986c35" stroke-width="2"/><text x="65" y="705" font-size="19" fill="#203247" text-anchor="start">τ (Pa)</text><text x="500" y="1030" font-size="18" fill="#203247" text-anchor="middle">G (s⁻¹)</text><text x="65" y="780" font-size="19" fill="#203247" text-anchor="start">3,6</text><text x="412" y="1020" font-size="19" fill="#203247" text-anchor="start">12</text><text x="90" y="1015" font-size="19" fill="#203247" text-anchor="start">0</text><text x="35" y="1100" font-size="19" fill="#203247" text-anchor="start">Pendenza: 3,6 Pa / (12 s⁻¹) = 0,30 Pa·s.</text><text x="35" y="1200" font-size="21" fill="#203247" text-anchor="start">3 · Valore locale nel tubo</text><line x1="220" y1="1300" x2="220" y2="1660" stroke="#607383" stroke-width="2"/><line x1="200" y1="1480" x2="560" y2="1480" stroke="#607383" stroke-width="2"/><line x1="220" y1="1300" x2="220" y2="1660" stroke="#607383" stroke-width="4"/><path d="M220 1300Q700 1480 220 1660" fill="none" stroke="#986c35" stroke-width="3"/><line x1="220" y1="1336" x2="306.4" y2="1336" stroke="#306f8c" stroke-width="2"/><polygon points="306.4,1336 298.4,1340.0 298.4,1332.0" fill="#306f8c"/><line x1="220" y1="1390" x2="400" y2="1390" stroke="#306f8c" stroke-width="2"/><polygon points="400,1390 392.0,1394.0 392.0,1386.0" fill="#306f8c"/><line x1="220" y1="1480" x2="460" y2="1480" stroke="#306f8c" stroke-width="2"/><polygon points="460,1480 452.0,1484.0 452.0,1476.0" fill="#306f8c"/><line x1="220" y1="1570" x2="400" y2="1570" stroke="#306f8c" stroke-width="2"/><polygon points="400,1570 392.0,1574.0 392.0,1566.0" fill="#306f8c"/><line x1="220" y1="1624" x2="306.4" y2="1624" stroke="#306f8c" stroke-width="2"/><polygon points="306.4,1624 298.4,1628.0 298.4,1620.0" fill="#306f8c"/><text x="125" y="1310" font-size="19" fill="#203247" text-anchor="start">r/R = −1</text><text x="150" y="1485" font-size="19" fill="#203247" text-anchor="start">0</text><text x="130" y="1665" font-size="19" fill="#203247" text-anchor="start">+1</text><text x="475" y="1485" font-size="18" fill="#203247" text-anchor="start">v_max</text><text x="320" y="1330" font-size="18" fill="#203247" text-anchor="start">r/R = −4/5</text><text x="35" y="1740" font-size="19" fill="#203247" text-anchor="start">A |r|/R = 4/5 : v/v_max = 9/25.</text><text x="35" y="1790" font-size="19" fill="#203247" text-anchor="start">La media d’area vale invece 1/2.</text></svg>
