<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1570" viewBox="0 0 640 1570" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Un bilancio energetico e due calcoli di lavoro</title><desc id="desc">Barre dei moduli di calore 35 joule e lavoro 60 joule; trapezio pressione volume fra 1 e 4 litri e 200 e 100 kilopascal; volume spazzato da un pistone di area 25 centimetri quadrati che avanza 4 centimetri.</desc><rect x="0" y="0" width="640" height="1570" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Trasferimenti, area e pistone</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Due trasferimenti, un solo bilancio</text><text x="35" y="190" font-size="19" fill="#203247" text-anchor="start">Q entrante</text><rect x="200" y="165" width="175" height="32" fill="#3d7791"/><text x="400" y="190" font-size="19" fill="#203247" text-anchor="start">+35 J</text><text x="35" y="270" font-size="19" fill="#203247" text-anchor="start">W uscente</text><rect x="200" y="245" width="300" height="32" fill="#986c35"/><text x="525" y="270" font-size="19" fill="#203247" text-anchor="start">60 J</text><text x="35" y="350" font-size="19" fill="#203247" text-anchor="start">ΔU = 35 J − 60 J = −25 J</text><text x="35" y="402" font-size="19" fill="#203247" text-anchor="start">Le barre confrontano i moduli dei trasferimenti.</text><text x="35" y="505" font-size="21" fill="#203247" text-anchor="start">2 · Lavoro come area sotto il percorso</text><line x1="140" y1="850" x2="520" y2="850" stroke="#607383" stroke-width="2"/><line x1="140" y1="850" x2="140" y2="570" stroke="#607383" stroke-width="2"/><text x="130" y="880" font-size="18" fill="#203247" text-anchor="end">0</text><text x="530" y="885" font-size="18" fill="#203247" text-anchor="end">V [L]</text><text x="85" y="560" font-size="18" fill="#203247" text-anchor="start">p [kPa]</text><polygon points="220,850 220,610 460,730 460,850" fill="#d9ecf1"/><line x1="220" y1="610" x2="460" y2="730" stroke="#306f8c" stroke-width="3"/><line x1="310" y1="655" x2="370" y2="685" stroke="#306f8c" stroke-width="2"/><polygon points="370,685 361.05572809000085,685.0 364.63343685400054,677.8445824720006" fill="#306f8c"/><line x1="220" y1="730" x2="460" y2="730" stroke="#607383" stroke-width="2"/><text x="128" y="618" font-size="18" fill="#203247" text-anchor="end">200</text><text x="128" y="738" font-size="18" fill="#203247" text-anchor="end">100</text><text x="220" y="885" font-size="18" fill="#203247" text-anchor="middle">1</text><text x="460" y="885" font-size="18" fill="#203247" text-anchor="middle">4</text><text x="320" y="710" font-size="19" fill="#203247" text-anchor="middle">150 J</text><text x="340" y="795" font-size="19" fill="#203247" text-anchor="middle">300 J</text><text x="35" y="945" font-size="19" fill="#203247" text-anchor="start">Pressione lineare: W = 150 kPa × 3 L = 450 J</text><text x="35" y="1050" font-size="21" fill="#203247" text-anchor="start">3 · Il volume spazzato non è un’area</text><rect x="140" y="1150" width="240" height="150" fill="#d9ecf1"/><rect x="380" y="1150" width="100" height="150" fill="#efe1ce"/><line x1="380" y1="1140" x2="380" y2="1310" stroke="#607383" stroke-width="5"/><line x1="480" y1="1140" x2="480" y2="1310" stroke="#306f8c" stroke-width="5"/><line x1="385" y1="1350" x2="480" y2="1350" stroke="#306f8c" stroke-width="2"/><polygon points="480,1350 472.0,1354.0 472.0,1346.0" fill="#306f8c"/><text x="432" y="1390" font-size="19" fill="#203247" text-anchor="middle">4 cm</text><text x="160" y="1232" font-size="19" fill="#203247" text-anchor="start">A = 25 cm²</text><text x="35" y="1460" font-size="19" fill="#203247" text-anchor="start">ΔV = A s = 100 cm³ = 1/10 L</text><text x="35" y="1520" font-size="19" fill="#203247" text-anchor="start">p esterna = 100 kPa; W = 10 J</text></svg>
