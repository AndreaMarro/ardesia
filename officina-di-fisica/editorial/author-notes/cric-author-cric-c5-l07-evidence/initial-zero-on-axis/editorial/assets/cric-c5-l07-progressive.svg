<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif" font-size="21" fill="#272536">
<title id="title">Trasmissioni successive e misure del fascio</title><desc id="desc">Tre problemi distinti. Cento unità incidenti diventano ottanta e poi venti. Il logaritmo naturale della trasmissione scende da zero a meno due virgola uno su tre centimetri. Un tasso di tre per dieci alla quindicesima fotoni al secondo, ciascuno da quattro per dieci alla meno diciannove joule, dà un virgola due milliwatt.</desc>
<defs><marker id="g" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#147c76"/></marker></defs><rect width="640" height="1540" fill="#fffdf7"/>
<text x="40" y="55" font-size="25" font-weight="bold">1 · Il secondo filtro riceve già meno luce</text><text x="40" y="105" font-size="18">Un solo riferimento per le tre barre: intensità iniziale.</text>
<rect x="140" y="180" width="400" height="40" fill="#6852a3"/><rect x="140" y="285" width="320" height="40" fill="#147c76"/><rect x="140" y="390" width="80" height="40" fill="#94631e"/>
<text x="50" y="208">100</text><text x="50" y="313">80</text><text x="50" y="418">20</text><text x="250" y="265">T₁ = 80%</text><text x="250" y="370">T₂ = 25% dell’ingresso locale</text><path d="M40 475H600" stroke="#cbc6bc"/>
<text x="40" y="530" font-size="25" font-weight="bold">2 · Le ordinate sono già logaritmi</text><text x="40" y="585">ln(I/I₀)</text><text x="505" y="610">x (cm)</text>
<path d="M140 940V620M140 650H560" fill="none" stroke="#888"/><path d="M140 650L500 890" fill="none" stroke="#147c76" stroke-width="3"/>
<path d="M140 730H260V650M140 810H380V650M140 890H500V650" fill="none" stroke="#aaa" stroke-dasharray="5 4"/>
<circle cx="140" cy="650" r="4" fill="#94631e"/><circle cx="260" cy="730" r="4" fill="#94631e"/><circle cx="380" cy="810" r="4" fill="#94631e"/><circle cx="500" cy="890" r="4" fill="#94631e"/>
<text x="110" y="657" text-anchor="end">0</text><text x="110" y="737" text-anchor="end">−0,7</text><text x="110" y="817" text-anchor="end">−1,4</text><text x="110" y="897" text-anchor="end">−2,1</text>
<text x="140" y="630" text-anchor="middle">0</text><text x="260" y="630" text-anchor="middle">1</text><text x="380" y="630" text-anchor="middle">2</text><text x="500" y="630" text-anchor="middle">3</text><text x="240" y="975">μ = 0,70 cm⁻¹</text><path d="M40 1020H600" stroke="#cbc6bc"/>
<text x="40" y="1080" font-size="25" font-weight="bold">3 · Energia unitaria per tasso medio</text>
<rect x="50" y="1160" width="230" height="110" rx="8" fill="#eee9da" stroke="#888"/><rect x="360" y="1160" width="230" height="110" rx="8" fill="#eee9da" stroke="#888"/>
<text x="165" y="1195" text-anchor="middle">Fotoni al secondo</text><text x="165" y="1240" text-anchor="middle">3×10¹⁵ s⁻¹</text><text x="475" y="1195" text-anchor="middle">Ogni fotone</text><text x="475" y="1240" text-anchor="middle">4×10⁻¹⁹ J</text>
<path d="M165 1285V1320H320V1360" fill="none" stroke="#147c76" stroke-width="2" marker-end="url(#g)"/><path d="M475 1285V1320H320" fill="none" stroke="#147c76" stroke-width="2"/>
