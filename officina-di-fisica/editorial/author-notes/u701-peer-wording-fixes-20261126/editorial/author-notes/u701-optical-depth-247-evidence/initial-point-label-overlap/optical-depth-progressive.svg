<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1580" viewBox="0 0 640 1580" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Prodotto mu d e spessore ottico</title><desc id="desc">Due percorsi in lastre diverse, barre di spessore ottico e curva fra preparazioni vincolate.</desc><rect x="0" y="0" width="640" height="1580" fill="#fff"/><text x="35" y="48" font-size="25" fill="#203247" text-anchor="start">Spessore ottico: un numero puro</text><text x="35" y="103" font-size="22" fill="#203247" text-anchor="start">1 · Percorsi geometrici alla stessa scala</text><rect x="150" y="160" width="160" height="75" fill="#dfebf0"/><line x1="150" y1="198" x2="310" y2="198" stroke="#306f8c" stroke-width="2"/><text x="150" y="140" font-size="19" fill="#203247" text-anchor="start">A: μ = 1 cm⁻¹</text><text x="150" y="274" font-size="19" fill="#203247" text-anchor="start">d = 2 cm · τ = 2</text><rect x="150" y="350" width="240" height="75" fill="#dfebf0"/><line x1="150" y1="388" x2="390" y2="388" stroke="#306f8c" stroke-width="2"/><text x="150" y="330" font-size="19" fill="#203247" text-anchor="start">B: μ = 2 cm⁻¹</text><text x="150" y="464" font-size="19" fill="#203247" text-anchor="start">d = 3 cm · τ = 6</text><text x="35" y="525" font-size="19" fill="#203247" text-anchor="start">Il colore è schematico, non una misura di I.</text><text x="35" y="585" font-size="22" fill="#203247" text-anchor="start">2 · I prodotti e la loro media</text><text x="130" y="672" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="150" y="650" width="100" height="28" fill="#3d7791"/><text x="260" y="672" font-size="19" fill="#203247" text-anchor="start">2</text><text x="130" y="752" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="150" y="730" width="300" height="28" fill="#986c35"/><text x="460" y="752" font-size="19" fill="#203247" text-anchor="start">6</text><text x="130" y="832" font-size="18" fill="#203247" text-anchor="end">media</text><rect x="150" y="810" width="200" height="28" fill="#637e55"/><text x="360" y="832" font-size="19" fill="#203247" text-anchor="start">4</text><text x="35" y="900" font-size="19" fill="#203247" text-anchor="start">τ è adimensionale; non è la trasmittanza.</text><text x="35" y="970" font-size="22" fill="#203247" text-anchor="start">3 · Solo nel vincolo μ = (1/2 cm⁻²) d</text><text x="35" y="1012" font-size="19" fill="#203247" text-anchor="start">Ogni punto descrive una lastra omogenea diversa.</text><line x1="150" y1="1460" x2="550" y2="1460" stroke="#526474" stroke-width="2"/><line x1="150" y1="1460" x2="150" y2="1080" stroke="#526474" stroke-width="2"/><path d="M150.0000 1460.0000 L153.0000 1459.9781 L156.0000 1459.9125 L159.0000 1459.8031 L162.0000 1459.6500 L165.0000 1459.4531 L168.0000 1459.2125 L171.0000 1458.9281 L174.0000 1458.6000 L177.0000 1458.2281 L180.0000 1457.8125 L183.0000 1457.3531 L186.0000 1456.8500 L189.0000 1456.3031 L192.0000 1455.7125 L195.0000 1455.0781 L198.0000 1454.4000 L201.0000 1453.6781 L204.0000 1452.9125 L207.0000 1452.1031 L210.0000 1451.2500 L213.0000 1450.3531 L216.0000 1449.4125 L219.0000 1448.4281 L222.0000 1447.4000 L225.0000 1446.3281 L228.0000 1445.2125 L231.0000 1444.0531 L234.0000 1442.8500 L237.0000 1441.6031 L240.0000 1440.3125 L243.0000 1438.9781 L246.0000 1437.6000 L249.0000 1436.1781 L252.0000 1434.7125 L255.0000 1433.2031 L258.0000 1431.6500 L261.0000 1430.0531 L264.0000 1428.4125 L267.0000 1426.7281 L270.0000 1425.0000 L273.0000 1423.2281 L276.0000 1421.4125 L279.0000 1419.5531 L282.0000 1417.6500 L285.0000 1415.7031 L288.0000 1413.7125 L291.0000 1411.6781 L294.0000 1409.6000 L297.0000 1407.4781 L300.0000 1405.3125 L303.0000 1403.1031 L306.0000 1400.8500 L309.0000 1398.5531 L312.0000 1396.2125 L315.0000 1393.8281 L318.0000 1391.4000 L321.0000 1388.9281 L324.0000 1386.4125 L327.0000 1383.8531 L330.0000 1381.2500 L333.0000 1378.6031 L336.0000 1375.9125 L339.0000 1373.1781 L342.0000 1370.4000 L345.