<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Dimezzamenti, spessore e media su due aree</title><desc id="desc">Intensità attenuate, curva per la sorgente da sessantaquattro e due mezze aree con percorsi distinti.</desc><rect x="0" y="0" width="640" height="1600" fill="#fff"/><text x="35" y="48" font-size="25" fill="#203247" text-anchor="start">Attenuazione del fascio diretto</text><text x="35" y="100" font-size="22" fill="#203247" text-anchor="start">1 · Ogni centimetro dimezza l’intensità</text><text x="130" y="173" font-size="18" fill="#203247" text-anchor="end">0 cm</text><rect x="150" y="150" width="320" height="28" fill="#3d7791"/><text x="480" y="173" font-size="18" fill="#203247" text-anchor="start">64 mW/m²</text><text x="130" y="238" font-size="18" fill="#203247" text-anchor="end">1 cm</text><rect x="150" y="215" width="160" height="28" fill="#3d7791"/><text x="320" y="238" font-size="18" fill="#203247" text-anchor="start">32 mW/m²</text><text x="130" y="303" font-size="18" fill="#203247" text-anchor="end">2 cm</text><rect x="150" y="280" width="80" height="28" fill="#3d7791"/><text x="240" y="303" font-size="18" fill="#203247" text-anchor="start">16 mW/m²</text><text x="130" y="368" font-size="18" fill="#203247" text-anchor="end">3 cm</text><rect x="150" y="345" width="40" height="28" fill="#3d7791"/><text x="200" y="368" font-size="18" fill="#203247" text-anchor="start">8 mW/m²</text><text x="35" y="440" font-size="19" fill="#203247" text-anchor="start">0 cm: riferimento incidente; μ = (ln 2) cm⁻¹</text><text x="35" y="480" font-size="22" fill="#203247" text-anchor="start">2 · Una sorgente fissa: I₀ = 64 mW/m²</text><line x1="150" y1="1010" x2="550" y2="1010" stroke="#526474" stroke-width="2"/><line x1="150" y1="1010" x2="150" y2="640" stroke="#526474" stroke-width="2"/><line x1="150" y1="1004" x2="150" y2="1016" stroke