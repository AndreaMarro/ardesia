<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Beta meno: un passo e una media</title><desc id="desc">Bilancio nucleare con A invariato, tre conteggi atomici interi e barre comuni di due uscite e della loro media.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#306f8c"/></marker></defs><rect x="0" y="0" width="640" height="1500" fill="white"/><text x="35" y="48" font-size="25" fill="#203247" text-anchor="start">Contare protoni dopo un β⁻</text><text x="35" y="105" font-size="22" fill="#203247" text-anchor="start">1 · Cambia un nucleone, non il totale A</text><rect x="70" y="155" width="170" height="100" fill="#e1edf1"/><text x="95" y="195" font-size="22" fill="#203247" text-anchor="start">neutrone</text><text x="95" y="235" font-size="18" fill="#203247" text-anchor="start">nel nucleo</text><path d="M255 205L365 205" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><rect x="385" y="155" width="170" height="100" fill="#e1edf1"/><text x="420" y="210" font-size="22" fill="#203247" text-anchor="start">protone</text><text x="270" y="160" font-size="20" fill="#203247" text-anchor="start">β⁻</text><text x="140" y="315" font-size="19" fill="#203247" text-anchor="start">elettrone + antineutrino elettronico</text><text x="150" y="360" font-size="19" fill="#203247" text-anchor="start">A resta uguale · Z aumenta di 1</text><text x="35" y="440" font-size="22" fill="#203247" text-anchor="start">2 · Una catena assegnata con Z₀ = 20</text><line x1="140" y1="790" x2="550" y2="790" stroke="#526474" stroke-width="2"/><line x1="140" y1="790" x2="140" y2="490" stroke="#526474" stroke-width="2"/><circle cx="170" cy="730" r="5" fill="#266b89"/><text x="170" y="825" font-size="18" fill="#203247" text-anchor="middle">0</text><line x1="170" y1="784" x2="170" y2="796" stroke="#526474" stroke-width="2"/><text x="182" y="715" font-size="19" fill="#203247" text-anchor="start">20</text><path d="M180 724L310 651" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><circle cx="320" cy="645" r="5" fill="#266b89"/><text x="320" y="825" font-size="18" fill="#203247" text-anchor="middle">1</text><line x1="320" y1="784" x2="320" y2="796" stroke="#526474" stroke-width="2"/><text x="332" y="630" font-size="19" fill="#203247" text-anchor="start">21</text><path d="M330 639L460 566" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><circle cx="470" cy="560" r="5" fill="#266b89"/><text x="470" y="825" font-size="18" fill="#203247" text-anchor="middle">2</text><line x1="470" y1="784" x2="470" y2="796" stroke="#526474" stroke-width="2"/><text x="482" y="545" font-size="19" fill="#203247" text-anchor="start">22</text><line x1="134" y1="730" x2="146" y2="730" stroke="#526474" stroke-width="2"/><text x="123" y="736" font-size="18" fill="#203247" text-anchor="end">20</text><line x1="134" y1="645" x2="146" y2="645" stroke="#526474" stroke-width="2"/><text x="123" y="651" font-size="18" fill="#203247" text-anchor="end">21</text><line x1="134" y1="560" x2="146" y2="560" stroke="#526474" stroke-width="2"/><text x="123" y="566" font-size="18" fill="#203247" text-anchor="end">22</text><text x="100" y="485" font-size="20" fill="#203247" text-anchor="start">Z</text><text x="565" y="796" font-size="20" fill="#203247" text-anchor="start">n</text><text x="35" y="885" font-size="19" fill="#203247" text-anchor="start">n = 0 è il riferimento iniziale; i passi sono interi.</text><text x="35" y="965" font-size="22" fill="#203247" text-anchor="start">3 · Uscite di due catene e media</text><text x="130" y="1062" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="150" y="1040" width="252" height="30" fill="#3d7791"/><text x="412" y="1064" font-size="18" fill="#203247" text-anchor="start">21</text><text x="130" y="1162" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="150" y="1140" width="312" height="30" fill="#986c35"/><text x="472" y="1164" font-size="18" fill="#203247" text-anchor="start">26</text><text x="130" y="1262" font-size="18" fill="#203247" text-anchor="end">media</text><rect x="150" y="1240" width="282.0" height="30" fill="#637e55"/><text x="442.0" y="1264" font-size="18" fill="#203247" text-anchor="start">47/2</text><text x="35" y="1355" font-size="19" fill="#203247" text-anchor="start">A: Z₀ = 20, n = 1 · B: Z₀ = 24, n = 2</text><text x="35" y="1400" font-size="19" fill="#203247" text-anchor="start">La media 47/2 non è lo Z di un singolo nucleo.</text><text x="35" y="1445" font-size="19" fill="#203247" text-anchor="start">Barre del numero atomico: origine comune.</text></svg>
