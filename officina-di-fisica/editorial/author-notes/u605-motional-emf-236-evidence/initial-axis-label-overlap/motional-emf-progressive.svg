<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc">
<title id="title">Una sbarretta mobile genera una f.e.m.</title><desc id="desc">Campo entrante e sbarretta verticale in moto verso destra: estremo superiore positivo. Misura quasi aperta. Retta della f.e.m. rispetto alla rapidità con campo due tesla e lunghezza mezzo metro. Barre tre volt, due volt e media cinque mezzi volt.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20334a"/></marker></defs>
<rect width="640" height="1500" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#20334a">
<text x="36" y="42" font-size="24" font-weight="700">1. Moto, campo e poli della misura</text>
<text x="40" y="83" font-size="17">Vista frontale; guide aperte a sinistra, versi schematici.</text>
<path d="M110 155H360M110 355H360" fill="none" stroke="#6e7d89" stroke-width="4"/>
<path d="M360 155V355" stroke="#2773ae" stroke-width="10"/>
<path d="M180 209L196 225M196 209L180 225M264 209L280 225M280 209L264 225M180 279L196 295M196 279L180 295M264 279L280 295M280 279L264 295" stroke="#71849a" stroke-width="3"/>
<path d="M400 255H515" fill="none" stroke="#20334a" stroke-width="3" marker-end="url(#a)"/>
<text x="444" y="238" font-size="19">v</text><text x="390" y="150" font-size="22">a +</text><text x="390" y="369" font-size="22">b −</text>
<text x="155" y="125" font-size="18">B entrante</text><text x="420" y="320" font-size="18">L = 1/2 m</text>
<text x="40" y="410" font-size="18">La f.e.m. può esserci anche con corrente trascurabile.</text>
<text x="36" y="475" font-size="24" font-weight="700">2. A campo fissato, E cresce con v</text>
<text x="40" y="515" font-size="18">B = 2 T; L = 1/2 m.</text>
<path d="M130 900V555M115 880H560" fill="none" stroke="#20334a" stroke-width="2"/>
<text x="65" y="565" font-size="18">E (V)</text><text x="507" y="920" font-size="18">v (m/s)</text><text x="96" y="908" font-size="17">0</text>
<path d="M130 640H120M130 560H120M430 880V891M530 880V891" stroke="#20334a" stroke-width="2"/>
<text x="99" y="646" font-size="17">3</text><text x="99" y="566" font-size="17">4</text><text x="425" y="914" font-size="17">3</text><text x="525" y="914" font-size="17">4</text>
<path d="M130 880L530 560" fill="none" stroke="#2773ae" stroke-width="4"/>
<circle cx="430" cy="640" r="6" fill="#2773ae"/><text x="452" y="649" font-size="18">A</text>
<text x="40" y="970" font-size="18">Origine limite: i quesiti numerici richiedono v &gt; 0.</text>
<text x="36" y="1045" font-size="24" font-weight="700">3. Due prove e la loro media</text>
<text x="40" y="1087" font-size="17">A: 2 T, 3 m/s; B: 1 T, 4 m/s.</text>
<text x="55" y="1165" font-size="20">A</text><rect x="150" y="1135" width="300" height="44" fill="#2773ae"/><text x="465" y="1165" font-size="20">3 V</text>
<text x="55" y="1255" font-size="20">B</text><rect x="150" y="1225" width="200" height="44" fill="#9b436f"/><text x="365" y="1255" font-size="20">2 V</text>
<text x="35" y="1345" font-size="20">media</text><rect x="150" y="1315" width="250" height="44" fill="#377f65"/><text x="415" y="1345" font-size="20">5/2 V</text>
<path d="M150 1120V1390" stroke="#20334a" stroke-width="2"/><text x="116" y="1410" font-size="17">0</text>
<text x="40" y="1455" font-size="18">Le tre barre hanno la stessa origine e scala in volt.</text>
</g></svg>
