<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><title id="title">Campo uniforme e forza su una carica negativa</title><desc id="desc">Il campo tra le armature va dalla positiva alla negativa. Una carica di prova negativa subisce una forza opposta.</desc><defs><marker id="a123c39" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#123c39"/></marker><marker id="aac3825" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#ac3825"/></marker><marker id="a16736b" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#16736b"/></marker><marker id="a7d8981" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#7d8981"/></marker></defs><rect x="0" y="0" width="640" height="250" rx="0" fill="#faf7ee" stroke="none" stroke-width="0"/><rect x="92" y="49" width="12" height="141" rx="0" fill="#ac3825" stroke="none" stroke-width="0"/><rect x="527" y="49" width="12" height="141" rx="0" fill="#16736b" stroke="none" stroke-width="0"/><text x="98" y="33" font-size="23" text-anchor="middle" fill="#ac3825" font-weight="500">+</text><text x="535" y="33" font-size="23" text-anchor="middle" fill="#16736b" font-weight="500">−</text><line x1="111" y1="69" x2="515" y2="69" stroke="#16736b" stroke-width="2" marker-end="url(#a16736b)"/><line x1="111" y1="160" x2="515" y2="160" stroke="#16736b" stroke-width="2" marker-end="url(#a16736b)"/><text x="422" y="148" font-size="17" text-anchor="middle" fill="#16736b" font-weight="500">campo E</text><circle cx="326" cy="111" r="14" fill="#faf7ee" stroke="#123c39" stroke-width="2"/><text x="326" y="117" font-size="19" text-anchor="middle" fill="#123c39" font-weight="500">−</text><line x1="308" y1="111" x2="191" y2="111" stroke="#ac3825" stroke-width="3" marker-end="url(#aac3825)"/><text x="244" y="101" font-size="17" text-anchor="middle" fill="#ac3825" font-weight="500">forza F</text><text x="320" y="221" font-size="19" text-anchor="middle" fill="#123c39" font-weight="500">F = qE   con q &lt; 0</text></svg>
