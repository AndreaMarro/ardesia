<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1220" role="img" aria-labelledby="title desc">
<title id="title">Tempo per raffreddare e congelare completamente</title>
<desc id="desc">Per un grammo inizialmente a venti gradi Celsius e dieci watt termici netti, il raffreddamento dura otto secondi. Seguono trenta secondi a zero gradi durante la solidificazione. Le barre separano ottanta e trecento joule e le corrispondenti durate, con scale comuni dichiarate.</desc>
<rect width="640" height="1220" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Temperatura e tempo non coincidono</text>
<text x="32" y="83" font-size="18">m = 1 g ; P termica netta = 10 W</text>
<text x="38" y="123">T / °C</text>
<g fill="none" stroke="#14243a" stroke-width="2"><path d="M100 350V140"/><path d="M100 350H535"/></g>
<path d="M100 160L164 320H404" stroke="#165a87" stroke-width="4" fill="none"/>
<path d="M164 320V350M404 320V350M100 160H164" stroke="#8292a2" stroke-dasharray="5 5" fill="none"/>
<g fill="#165a87"><circle cx="100" cy="160" r="5"/><circle cx="164" cy="320" r="5"/><circle cx="404" cy="320" r="5"/></g>
<text x="59" y="167">20</text><text x="65" y="327">0</text><text x="89" y="383">0</text><text x="157" y="383">8</text><text x="392" y="383">38</text><text x="548" y="356">t / s</text>
<text x="187" y="229">Liquido in raffreddamento</text><text x="207" y="293">Solidificazione a 0 °C</text>
<text x="32" y="431" font-size="18">Assi: 8 px/s; 8 px/K per gli intervalli verticali.</text>
<text x="32" y="463" font-size="18">A 38 s tutto il campione è ghiaccio a 0 °C.</text>
<path d="M32 494H608" stroke="#9babbc"/>
<text x="32" y="538" font-size="25" font-weight="bold">2 · Due energie cedute dallo stesso corpo</text>
<path d="M130 563V789" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="585" width="80" height="34" fill="#165a87"/>
<rect x="130" y="652" width="300" height="34" fill="#28664d"/>
<rect x="130" y="719" width="80" height="34" fill="#165a87"/><rect x="210" y="719" width="300" height="34" fill="#28664d"/>
<text x="33" y="610">Sensibile</text><text x="228" y="610">80 J</text><text x="33" y="677">Latente</text><text x="448" y="677">300 J</text><text x="33" y="744">Totale</text><text x="526" y="744">380 J</text>
<text x="32" y="824" font-size="18">Barre: 1 px/J. Sono moduli positivi di calore ceduto.</text>
<path d="M32 855H608" stroke="#9babbc"/>
<text x="32" y="899" font-size="25" font-weight="bold">3 · La potenza è costante in entrambi</text>
<path d="M130 923V1144" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="945" width="64" height="34" fill="#165a87"/>
<rect x="130" y="1012" width="240" height="34" fill="#28664d"/>
<rect x="130" y="1079" width="64" height="34" fill="#165a87"/><rect x="194" y="1079" width="240" height="34" fill="#28664d"/>
<text x="33" y="970">Liquido</text><text x="212" y="970">8 s</text><text x="33" y="1037">Fase</text><text x="388" y="1037">30 s</text><text x="33" y="1104">Totale</text><text x="452" y="1104">38 s</text>
<text x="32" y="1180" font-size="18">Barre: 8 px/s. Ogni durata è energia divisa per P.</text>
</g></svg>
