<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1200" role="img" aria-labelledby="title desc">
<title id="title">Fondere tutto il ghiaccio prima di scaldare l’acqua</title>
<desc id="desc">Cinque mezzi di grammo di ghiaccio a zero gradi assorbono 750 joule nella fusione e altri 50 per arrivare a cinque gradi Celsius. Le barre distinguono i due contributi. Gli incrementi dal punto di fusione in due prove sono cinque e cinquanta kelvin, media ventisette e mezzo.</desc>
<rect width="640" height="1200" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · La temperatura sale dopo la fusione</text>
<text x="32" y="83" font-size="18">m = 5/2 g ; Q totale = 800 J</text>
<text x="38" y="123">T / °C</text>
<g fill="none" stroke="#14243a" stroke-width="2"><path d="M100 350V145"/><path d="M100 350H535"/></g>
<path d="M100 320H400L420 220" stroke="#165a87" stroke-width="4" fill="none"/>
<path d="M400 320V350M420 220V350M100 220H420" stroke="#8292a2" stroke-dasharray="5 5" fill="none"/>
<g fill="#165a87"><circle cx="100" cy="320" r="5"/><circle cx="400" cy="320" r="5"/><circle cx="420" cy="220" r="5"/></g>
<text x="65" y="327">0</text><text x="65" y="227">5</text><text x="89" y="381">0</text><text x="364" y="383">750</text><text x="417" y="411">800</text><text x="548" y="356">Q / J</text>
<text x="153" y="290">Fusione a 0 °C</text><text x="440" y="222">Acqua</text>
<text x="32" y="450" font-size="18">Assi: 0,4 px/J; 20 px/K per le differenze verticali.</text>
<text x="32" y="482" font-size="18">Il riferimento 0 °C non è lo zero assoluto.</text>
<path d="M32 511H608" stroke="#9babbc"/>
<text x="32" y="555" font-size="25" font-weight="bold">2 · Prima 750 J, poi altri 50 J</text>
<path d="M130 576V805" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="598" width="300" height="34" fill="#28664d"/><rect x="130" y="666" width="20" height="34" fill="#165a87"/>
<rect x="130" y="734" width="300" height="34" fill="#28664d"/><rect x="430" y="734" width="20" height="34" fill="#165a87"/>
<text x="33" y="623">Fusione</text><text x="447" y="623">750 J</text><text x="33" y="691">Sensibile</text><text x="167" y="691">50 J</text><text x="33" y="759">Totale</text><text x="467" y="759">800 J</text>
<text x="32" y="837" font-size="18">Barre a 0,4 px/J; Θ = 50 J / (10 J/K) = 5 K.</text>
<path d="M32 866H608" stroke="#9babbc"/>
<text x="32" y="910" font-size="25" font-weight="bold">3 · Incrementi sopra la fusione</text>
<path d="M130 929V1128" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="946" width="20" height="30" fill="#165a87"/><rect x="130" y="1006" width="200" height="30" fill="#165a87"/><rect x="130" y="1066" width="110" height="30" fill="#28664d"/>
<text x="50" y="969">A</text><text x="167" y="969">5 K</text><text x="50" y="1029">B</text><text x="347" y="1029">50 K</text><text x="32" y="1089">Media</text><text x="257" y="1089">55/2 K</text>
<text x="32" y="1162" font-size="18">Barre a 4 px/K; letture: 5, 50 e 55/2 °C.</text>
</g></svg>
