<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Moli, volume e pendenze nel gas perfetto</title><desc id="desc">Pressioni centosessanta e centoventi kilopascal; volumi uno virgola ottanta e due virgola dieci litri; due rette pressione-temperatura a volumi V e due V con pendenze nel rapporto due.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7350b0"/></marker></defs><rect width="640" height="1500" fill="#faf7ee"/><text x="30" y="40" font-size="25" fill="#302a3e">1. La frazione rimasta</text><text x="30" y="85" font-size="21" fill="#302a3e">Volume e temperatura uguali nei due stati</text><path d="M140 350V120M140 350H520" fill="none" stroke="#726d81" stroke-width="2"/><rect x="140" y="160" width="320" height="45" fill="#7350b0"/><rect x="140" y="245" width="240" height="45" fill="#147979"/><text x="150" y="145" font-size="21" fill="#302a3e">Prima: 160 kPa</text><text x="150" y="230" font-size="21" fill="#302a3e">Dopo: 120 kPa</text><text x="112" y="380" font-size="21" fill="#302a3e">0</text><text x="295" y="380" font-size="21" fill="#302a3e">80</text><text x="440" y="380" font-size="21" fill="#302a3e">160</text><text x="490" y="420" font-size="21" fill="#302a3e">p (kPa)</text><text x="40" y="460" font-size="21" fill="#302a3e">Restano 3/4 delle moli; esce 1/4 = 25%.</text><text x="30" y="530" font-size="25" fill="#302a3e">2. Volume e temperatura assoluta</text><text x="30" y="575" font-size="21" fill="#302a3e">Stessa pressione e stessa quantità di gas</text><path d="M140 850V600M140 850H520" fill="none" stroke="#726d81" stroke-width="2"/><rect x="140" y="640" width="252" height="45" fill="#7350b0"/><rect x="140" y="740" width="294" height="45" fill="#147979"/><text x="150" y="625" font-size="21" fill="#302a3e">1,80 L a 270 K</text><text x="150" y="725" font-size="21" fill="#302a3e">2,10 L a 315 K</text><text x="110" y="880" font-size="21" fill="#302a3e">0</text><text x="265" y="880" font-size="21" fill="#302a3e">1</text><text x="405" y="880" font-size="21" fill="#302a3e">2</text><text x="490" y="920" font-size="21" fill="#302a3e">V (L)</text><text x="40" y="960" font-size="21" fill="#302a3e">Il rapporto dei volumi è 315/270 = 7/6.</text><text x="30" y="1030" font-size="25" fill="#302a3e">3. Due pendenze, stesse moli</text><text x="30" y="1070" font-size="21" fill="#302a3e">T* &gt; 0; p* = nRT*/V</text><path d="M140 1420V1120M140 1420H530" fill="none" stroke="#726d81" stroke-width="2"/><path d="M140 1420L480 1140" fill="none" stroke="#147979" stroke-width="4"/><path d="M140 1420L480 1280" fill="none" stroke="#7350b0" stroke-width="4"/><text x="500" y="1150" font-size="21" fill="#302a3e">V</text><text x="500" y="1290" font-size="21" fill="#302a3e">2V</text><text x="60" y="1135" font-size="21" fill="#302a3e">p/p*</text><text x="110" y="1450" font-size="21" fill="#302a3e">0</text><text x="302" y="1450" font-size="21" fill="#302a3e">1</text><text x="470" y="1450" font-size="21" fill="#302a3e">2</text><text x="530" y="1480" font-size="21" fill="#302a3e">T/T*</text></svg>
