<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1450" viewBox="0 0 560 1450" role="img" aria-labelledby="title desc">
<title id="title">Energia e massa trasformata</title><desc id="desc">CampioneA 2 g con calore latente 100 J/g: in tre stati cresce la frazione liquida da 0 a 1 a temperatura di transizione costante. EnergieA 200 JB 800 J, media 500 J distinta dal prodotto dei medi 450 J.</desc>
<rect width="560" height="1450" fill="#fffaf1"/>
<g font-family="Arial,sans-serif" fill="#352d42" font-size="18">
<text x="25" y="40" font-size="25" font-weight="bold">1 · Cambia la fase, non la temperatura</text>
<text x="25" y="80">A:m=2 g · L=100 J/g · schema di fasi</text>
<rect x="30" y="125" width="150" height="120" fill="#d8dce7" stroke="#726d81" stroke-width="2"/>
<rect x="205" y="125" width="75" height="120" fill="#d8dce7"/><rect x="280" y="125" width="75" height="120" fill="#68bdcf"/><rect x="205" y="125" width="150" height="120" fill="none" stroke="#726d81" stroke-width="2"/>
<rect x="380" y="125" width="150" height="120" fill="#68bdcf" stroke="#726d81" stroke-width="2"/>
<text x="65" y="175">Solido</text><text x="222" y="175">Solido+liquido</text><text x="415" y="175">Liquido</text>
<text x="45" y="280">Q=0 J</text><text x="220" y="280">Q=100 J</text><text x="395" y="280">Q=200 J</text>
<text x="45" y="320">f=0</text><text x="220" y="320">f=1/2</text><text x="395" y="320">f=1</text>
<text x="45" y="360">T=T_tr</text><text x="220" y="360">T=T_tr</text><text x="395" y="360">T=T_tr</text>
<text x="25" y="410">Q=m_trasformata L · in coesistenza ΔT=0</text>
<text x="25" y="445">I riquadri sono schematici, non molecole in scala.</text>
<line x1="25" y1="480" x2="535" y2="480" stroke="#b8ada0"/>
<text x="25" y="525" font-size="25" font-weight="bold">2 · Due masse e due valori specifici</text>
<text x="25" y="565">Energia · scala comune 0,5 px/J</text>
<line x1="110" y1="600" x2="110" y2="830" stroke="#352d42" stroke-width="2"/>
<text x="25" y="640">A</text><rect x="110" y="615" width="100" height="45" fill="#147979"/><text x="225" y="645">2 g × 100 J/g =200 J</text>
<text x="25" y="740">B</text><rect x="110" y="715" width="400" height="45" fill="#7350b0"/><text x="125" y="745" fill="white">4 g × 200 J/g =800 J</text>
<text x="106" y="815">0</text><text x="480" y="815">800 J</text>
<text x="25" y="870">Rapporto energetico Q_B/Q_A=4</text>
<line x1="25" y1="910" x2="535" y2="910" stroke="#b8ada0"/>
<text x="25" y="955" font-size="25" font-weight="bold">3 · Media delle energie già calcolate</text>
<text x="25" y="995">Stessa scala energetica 0,5 px/J</text>
<line x1="140" y1="1030" x2="140" y2="1255" stroke="#352d42" stroke-width="2"/>
<text x="25" y="1070">MediaQ</text><rect x="140" y="1045" width="250" height="45" fill="#147979"/><text x="405" y="1075">500 J</text>
<text x="25" y="1165">Ingressi</text><text x="25" y="1190">medi</text><rect x="140" y="1145" width="225" height="45" fill="#d49332"/><text x="380" y="1175">450 J</text>
<text x="136" y="1240">0</text><text x="25" y="1300">(200+800)/2=500 J</text>
<text x="25" y="1340">m_medio=3 g · L_medio=150 J/g</text>
<text x="25" y="1380">3 g × 150 J/g =450 J, una prova diversa.</text>
<text x="25" y="1420">Fra prove L può cambiare; entro una prova no.</text>
</g></svg>
