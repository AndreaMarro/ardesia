<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1500" viewBox="0 0 560 1500" role="img" aria-labelledby="title desc">
<title id="title">Dalla potenza netta alla durata</title><desc id="desc">Tre pannelli con scale dichiarate: differenza di potenze 20 meno 5 W, energia netta 15 t fino a 120 J e media di durate 8 e 6 s.</desc>
<rect width="560" height="1500" fill="#fffaf1"/>
<g font-family="Arial,sans-serif" fill="#352d42" font-size="19">
<text x="25" y="40" font-size="25" font-weight="bold">1 · Che cosa resta nel campione?</text>
<text x="25" y="75">Potenza costante · scala 20 px/W</text>
<line x1="100" y1="115" x2="100" y2="355" stroke="#352d42" stroke-width="2"/>
<text x="25" y="150">P</text><rect x="100" y="125" width="400" height="40" fill="#147979"/><text x="108" y="151" fill="white">20 W entrano</text>
<text x="25" y="220">P_d</text><rect x="100" y="195" width="100" height="40" fill="#b94f48"/><text x="215" y="222">5 W escono</text>
<text x="25" y="300">P_net</text><rect x="100" y="275" width="300" height="40" fill="#7350b0"/><text x="110" y="302" fill="white">15 W rimangono</text>
<text x="96" y="350">0</text><text x="291" y="350">10</text><text x="489" y="350">20 W</text>
<text x="25" y="395">20 − 5 = 15 J ogni secondo</text>
<line x1="25" y1="430" x2="535" y2="430" stroke="#b8ada0"/>
<text x="25" y="475" font-size="25" font-weight="bold">2 · Accumulare 120 J netti</text>
<text x="25" y="510">Asse t:40 px/s · asse Q:8/3 px/J</text>
<line x1="100" y1="910" x2="460" y2="910" stroke="#352d42" stroke-width="2"/>
<line x1="100" y1="910" x2="100" y2="550" stroke="#352d42" stroke-width="2"/>
<path d="M100 590H420V910" fill="none" stroke="#b94f48" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M100 910L420 590" fill="none" stroke="#147979" stroke-width="5"/>
<circle cx="420" cy="590" r="6" fill="#b94f48"/>
<text x="32" y="595">120 J</text><text x="68" y="915">0</text><text x="405" y="942">8 s</text>
<text x="175" y="690">Q_netto = 15 t</text>
<text x="25" y="990">A 8 s:160 J entranti − 40 J usciti =120 J</text>
<line x1="25" y1="1030" x2="535" y2="1030" stroke="#b8ada0"/>
<text x="25" y="1075" font-size="25" font-weight="bold">3 · Due prove, una media</text>
<text x="25" y="1110">Durate · scala 40 px/s</text>
<line x1="100" y1="1140" x2="100" y2="1375" stroke="#352d42" stroke-width="2"/>
<text x="25" y="1180">A</text><rect x="100" y="1155" width="320" height="40" fill="#147979"/><text x="435" y="1182">8 s</text>
<text x="25" y="1250">B</text><rect x="100" y="1225" width="240" height="40" fill="#d49332"/><text x="355" y="1252">6 s</text>
<text x="25" y="1320">Media</text><rect x="100" y="1295" width="280" height="40" fill="#7350b0"/><text x="395" y="1322">7 s</text>
<text x="96" y="1370">0</text><text x="25" y="1420">Media a pesi uguali:(8+6)/2=7 s</text>
<text x="25" y="1460">Ogni pannello dichiara la propria scala.</text>
</g></svg>
