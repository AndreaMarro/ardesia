<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2120" viewBox="0 0 640 2120" role="img" aria-labelledby="title desc" font-family="Arial,sans-serif" font-size="21" fill="#272536">
<title id="title">Quattro bilanci integrativi distinti</title><desc id="desc">Due sensori delimitano un solo tragitto di trenta centimetri in duecento microsecondi. Portate di novanta unità all’ingresso e trenta e quarantotto in uscita, con dodici trattenute nel serbatoio. Due aree orientate corrente-tempo, più un virgola due e meno zero virgola cinque coulomb, danno più zero virgola sette coulomb. Un bilancio separato scalda quattro grammi d’acqua di mezzo kelvin con otto joule ogni secondo.</desc>
<defs><marker id="green" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#147c76"/></marker></defs><rect width="640" height="2120" fill="#fffdf7"/>
<text x="40" y="55" font-size="25" font-weight="bold">1 · Un solo tratto fra due sensori</text><text x="40" y="108">Acqua: v = 1500 m/s ; strumenti fermi.</text>
<rect x="90" y="175" width="50" height="160" fill="#eee9da" stroke="#888"/><rect x="500" y="175" width="50" height="160" fill="#eee9da" stroke="#888"/><path d="M140 255H500" stroke="#147c76" stroke-width="3" marker-end="url(#green)"/>
<text x="115" y="155" text-anchor="middle">Avvio</text><text x="525" y="155" text-anchor="middle">Arresto</text><path d="M140 350V375H500V350" fill="none" stroke="#888"/><text x="320" y="420" text-anchor="middle">30 cm ; Δt = 200 μs</text><path d="M40 475H600" stroke="#cbc6bc"/>
<text x="40" y="530" font-size="25" font-weight="bold">2 · Entrata, uscite e accumulo</text><text x="40" y="580">Portate in mL/min, sulla stessa scala.</text>
<text x="50" y="650">Entrata</text><rect x="160" y="625" width="405" height="35" fill="#6852a3"/><text x="575" y="650">90</text>
<text x="50" y="740">Ramo 1</text><rect x="160" y="715" width="135" height="35" fill="#147c76"/><text x="310" y="740">30</text>
<text x="50" y="830">Ramo 3</text><rect x="160" y="805" width="216" height="35" fill="#147c76"/><text x="390" y="830">48</text>
<text x="40" y="920" font-size="18">Trattenuto</text><rect x="160" y="895" width="54" height="35" fill="#94631e"/><text x="230" y="920">12</text><text x="320" y="985" text-anchor="middle">90 = 30 + 48 + 12</text><path d="M40 1030H600" stroke="#cbc6bc"/>
<text x="40" y="1085" font-size="25" font-weight="bold">3 · La carica è un’area orientata</text><text x="40" y="1140">i (A)</text><text x="530" y="1385">t (s)</text>
<path d="M100 1400V1160M100 1290H575" fill="none" stroke="#888"/><rect x="100" y="1200" width="200" height="90" fill="#dceee9"/><rect x="300" y="1290" width="250" height="30" fill="#eee1c8"/><path d="M100 1200H300V1320H550" fill="none" stroke="#147c76" stroke-width="3"/>
<path d="M100 1200H85M100 1320H85M300 1290V1350M550 1290V1350" fill="none" stroke="#aaa" stroke-dasharray="4 4"/>
<text x="80" y="1208" text-anchor="end">+0,30</text><text x="80" y="1328" text-anchor="end">−0,10</text><text x="80" y="1285" text-anchor="end">0</text><text x="100" y="1380" text-anchor="middle">0</text><text x="300" y="1380" text-anchor="middle">4</text><text x="550" y="1355" text-anchor="middle">9</text>
<text x="200" y="1245" text-anchor="middle">+1,2 C</text><text x="430" y="1270" text-anchor="middle">−0,5 C</text><text x="320" y="1480" text-anchor="middle">q netto = +0,7 C</text><path d="M40 1530H600" stroke="#cbc6bc"/>
<text x="40" y="1585" font-size="25" font-weight="bold">4 · La stessa acqua attraversa il banco</text><text x="40" y="1640" font-size="18">Regime stazionario ; niente dispersioni o fase.</text>
<rect x="55" y="1710" width="220" height="145" rx="8" fill="#eee9da" stroke="#888"/><rect x="365" y="1710" width="220" height="145" rx="8" fill="#dceee9" stroke="#888"/>
<text x="165" y="1750" text-anchor="middle">Ingresso</text><text x="165" y="1795" text-anchor="middle">4 g ogni secondo</text><text x="475" y="1750" text-anchor="middle">Uscita</text><text x="475" y="1795" text-anchor="middle">Stessa massa</text><text x="475" y="1830" text-anchor="middle">+0,50 K</text><path d="M280 1780H360" stroke="#147c76" stroke-width="3" marker-end="url(#green)"/>
<text x="320" y="1920" text-anchor="middle">Il riscaldatore fornisce 8 J ogni secondo.</text><text x="320" y="1980" text-anchor="middle">ρ = 1000 kg/m³ ; c = 4000 J/(kg K)</text><text x="320" y="2040" text-anchor="middle">Portata: 4 g/s = 4 mL/s</text>
</svg>
