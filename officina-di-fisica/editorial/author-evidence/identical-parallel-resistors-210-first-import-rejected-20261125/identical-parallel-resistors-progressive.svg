<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1500" viewBox="0 0 680 1500" role="img" aria-labelledby="title desc">
<title id="title">Tre rami identici e due confronti distinti</title>
<desc id="desc">Tre resistori da 12 ohm collegati fra A e B danno equivalente 4 ohm. A resistenza di ramo fissa, un solo ramo dà 12 ohm. Nelle due preparazioni finali i valori equivalenti sono 4 e 3 ohm e la media è 7/2 ohm. Le scale sono comuni solo entro ciascun pannello di barre.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18364a;font-size:20px}.h{font-size:26px;font-weight:700}.small{font-size:18px}.wire{stroke:#24485c;stroke-width:3;fill:none}.res{stroke:#165a87;stroke-width:3;fill:#eaf3f8}.axis{stroke:#526a78;stroke-width:2}.tick{font-size:16px}</style>
<rect width="680" height="1500" fill="#fffdf6"/>
<text class="h" x="34" y="48">1 · La stessa coppia di nodi</text>
<text x="34" y="88">r = 12 Ω ; N = 3 rami identici.</text>
<path class="wire" d="M90 250H160V160H520V340H160V250M520 250H600M160 250H300M400 250H520"/>
<rect class="res" x="300" y="145" width="100" height="30"/>
<rect class="res" x="300" y="235" width="100" height="30"/>
<rect class="res" x="300" y="325" width="100" height="30"/>
<circle cx="160" cy="250" r="6" fill="#24485c"/><circle cx="520" cy="250" r="6" fill="#24485c"/>
<text x="85" y="224">A</text><text x="600" y="224">B</text>
<text x="318" y="130">12 Ω</text><text x="318" y="220">12 Ω</text><text x="318" y="310">12 Ω</text>
<text x="34" y="402">Ogni ramo riceve V_AB ; I_T = 3 V_AB / (12 Ω).</text>
<text x="34" y="438">G_T = 3 / (12 Ω) = 1/4 S ; R = 4 Ω.</text>
<text class="h" x="34" y="515">2 · Rimuovere due percorsi</text>
<text x="34" y="555">Qui r resta 12 Ω ; N passa da 3 a 1.</text>
<line class="axis" x1="150" y1="595" x2="150" y2="790"/><line class="axis" x1="150" y1="790" x2="430" y2="790"/>
<rect x="150" y="620" width="80" height="38" fill="#165a87"/><rect x="150" y="710" width="240" height="38" fill="#9a4f23"/>
<text x="48" y="647">N = 3</text><text x="245" y="647">4 Ω</text><text x="48" y="737">N = 1</text><text x="405" y="737">12 Ω</text>
<text class="tick" x="125" y="815">0</text><text class="tick" x="223" y="815">4</text><text class="tick" x="303" y="815">8</text><text class="tick" x="380" y="815">12 Ω</text>
<text class="small" x="34" y="858">Un ramo è ammesso: R coincide con r.</text>
<text class="h" x="34" y="940">3 · Due preparazioni e la media</text>
<text x="34" y="980">A: r = 12 Ω, N = 3 ; B: r = 15 Ω, N = 5.</text>
<line class="axis" x1="150" y1="1020" x2="150" y2="1310"/><line class="axis" x1="150" y1="1310" x2="390" y2="1310"/>
<rect x="150" y="1040" width="160" height="34" fill="#165a87"/><rect x="150" y="1140" width="120" height="34" fill="#28664d"/><rect x="150" y="1240" width="140" height="34" fill="#9a4f23"/>
<text x="80" y="1065">A</text><text x="326" y="1065">4 Ω</text><text x="80" y="1165">B</text><text x="286" y="1165">3 Ω</text><text x="44" y="1265">Media</text><text x="306" y="1265">7/2 Ω</text>
<text class="tick" x="125" y="1335">0</text><text class="tick" x="302" y="1335">4 Ω</text>
<text class="small" x="34" y="1390">Origine e scala comuni entro ogni pannello di barre.</text>
<text class="small" x="34" y="1430">Ai dati medi: r = 27/2 Ω, N = 4, R = 27/8 Ω.</text>
<text class="small" x="34" y="1470">Le scale dei pannelli 2 e 3 sono indipendenti.</text>
</svg>
