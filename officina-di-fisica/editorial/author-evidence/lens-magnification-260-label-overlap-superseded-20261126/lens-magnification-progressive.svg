<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1740" viewBox="0 0 640 1740" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Ingrandimento reale e scala non identificata</title><desc id="desc">Due raggi costruiscono un’immagine reale capovolta con modulo due. Seguono barre dei moduli e della media, poi la famiglia q uguale due p con origine esclusa. Altezze del primo schema amplificate rispetto alle distanze assiali.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#306f8c"/></marker></defs><rect width="640" height="1740" fill="white"/><text x="35" y="48" font-size="25" fill="#203247" text-anchor="start">Modulo positivo, immagine capovolta</text><text x="35" y="108" font-size="22" fill="#203247" text-anchor="start">1 · p = 3 cm, q = 6 cm, f = 2 cm</text><text x="35" y="156" font-size="17" fill="#203247" text-anchor="start">Altezze amplificate; distanze assiali in cm.</text><line x1="45" y1="300" x2="600" y2="300" stroke="#697b87" stroke-width="2"/><line x1="260" y1="185" x2="260" y2="405" stroke="#697b87" stroke-width="2"/><path d="M110 300V270" fill="none" stroke="#306f8c" stroke-width="2"/><polygon points="110,270 106,278 114,278" fill="#306f8c"/><path d="M560 300V360" fill="none" stroke="#306f8c" stroke-width="2"/><polygon points="560,360 556,352 564,352" fill="#306f8c"/><path d="M110 270H260" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M260 270L590 369" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M110 270L590 366" fill="none" stroke="#966638" stroke-width="2" marker-end="url(#arr)"/><circle cx="160" cy="300" r="3" fill="#306f8c" stroke="#306f8c" stroke-width="2"/><text x="160" y="334" font-size="18" fill="#203247" text-anchor="middle">F</text><circle cx="260" cy="300" r="3" fill="#306f8c" stroke="#306f8c" stroke-width="2"/><text x="260" y="334" font-size="18" fill="#203247" text-anchor="middle">O</text><circle cx="360" cy="300" r="3" fill="#306f8c" stroke="#306f8c" stroke-width="2"/><text x="360" y="334" font-size="18" fill="#203247" text-anchor="middle">F′</text><text x="65" y="230" font-size="18" fill="#203247" text-anchor="start">h_o = 1 mm</text><text x="435" y="407" font-size="18" fill="#203247" text-anchor="start">h_i = −2 mm</text><line x1="110" y1="435" x2="260" y2="435" stroke="#697b87" stroke-width="2"/><text x="185" y="472" font-size="18" fill="#203247" text-anchor="middle">p = 3 cm</text><line x1="260" y1="510" x2="560" y2="510" stroke="#697b87" stroke-width="2"/><text x="410" y="547" font-size="18" fill="#203247" text-anchor="middle">q = 6 cm</text><text x="35" y="600" font-size="19" fill="#203247" text-anchor="start">m = −2 · M = 2 · i segni hanno ruoli distinti.</text><text x="35" y="685" font-size="22" fill="#203247" text-anchor="start">2 · Due moduli e la loro media</text><text x="135" y="773" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="155" y="750" width="240" height="30" fill="#3d7791"/><text x="405" y="774" font-size="18" fill="#203247" text-anchor="start">2</text><text x="135" y="873" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="155" y="850" width="180" height="30" fill="#986c35"/><text x="345" y="874" font-size="18" fill="#203247" text-anchor="start">3/2</text><text x="135" y="973" font-size="18" fill="#203247" text-anchor="end">media</text><rect x="155" y="950" width="210" height="30" fill="#637e55"/><text x="375" y="974" font-size="18" fill="#203247" text-anchor="start">7/4</text><text x="35" y="1040" font-size="18" fill="#203247" text-anchor="start">A: q = 6 cm, p = 3 cm · B: q = 9 cm, p = 6 cm</text><text x="35" y="1080" font-size="19" fill="#203247" text-anchor="start">Barre pure con origine e scala comuni.</text><text x="35" y="1160" font-size="22" fill="#203247" text-anchor="start">3 · q = 2 p: una famiglia di preparazioni</text><line x1="160" y1="1580" x2="580" y2="1580" stroke="#697b87" stroke-width="2"/><line x1="160" y1="1580" x2="160" y2="1200" stroke="#697b87" stroke-width="2"/><path d="M160 1580L520 1220" fill="none" stroke="#306f8c" stroke-width="3"/><circle cx="160" cy="1580" r="5" fill="white" stroke="#306f8c" stroke-width="2"/><circle cx="220" cy="1520" r="4" fill="#306f8c" stroke="#306f8c" stroke-width="2"/><line x1="220" y1="1574" x2="220" y2="1586" stroke="#697b87" stroke-width="2"/><text x="220" y="1620" font-size="18" fill="#203247" text-anchor="middle">1</text><line x1="154" y1="1520" x2="166" y2="1520" stroke="#697b87" stroke-width="2"/><text x="140" y="1526" font-size="18" fill="#203247" text-anchor="end">2</text><circle cx="340" cy="1400" r="4" fill="#306f8c" stroke="#306f8c" stroke-width="2"/><line x1="340" y1="1574" x2="340" y2="1586" stroke="#697b87" stroke-width="2"/><text x="340" y="1620" font-size="18" fill="#203247" text-anchor="middle">3</text><line x1="154" y1="1400" x2="166" y2="1400" stroke="#697b87" stroke-width="2"/><text x="140" y="1406" font-size="18" fill="#203247" text-anchor="end">6</text><circle cx="520" cy="1220" r="4" fill="#306f8c" stroke="#306f8c" stroke-width="2"/><line x1="520" y1="1574" x2="520" y2="1586" stroke="#697b87" stroke-width="2"/><text x="520" y="1620" font-size="18" fill="#203247" text-anchor="middle">6</text><line x1="154" y1="1220" x2="166" y2="1220" stroke="#697b87" stroke-width="2"/><text x="140" y="1226" font-size="18" fill="#203247" text-anchor="end">12</text><text x="145" y="1600" font-size="18" fill="#203247" text-anchor="end">0</text><text x="175" y="1210" font-size="19" fill="#203247" text-anchor="start">q (cm)</text><text x="525" y="1660" font-size="19" fill="#203247" text-anchor="start">p (cm)</text><text x="345" y="1360" font-size="18" fill="#203247" text-anchor="start">(3 cm, 6 cm)</text><text x="35" y="1710" font-size="18" fill="#203247" text-anchor="start">p &gt; 0; M = 2. La focale cambia come f = 2 p/3.</text></svg>
