<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc">
<title id="title">Campi opposti e rapporto delle distanze</title><desc id="desc">Due cariche positive separate da tre metri: con cariche uno e quattro nanocoulomb il punto di campo nullo è a uno e due metri dalle sorgenti. Scambiando le cariche le distanze si scambiano. Le barre finali confrontano i rapporti un mezzo, due e media cinque quarti.</desc>
<defs><marker id="e1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#165a87"/></marker><marker id="e2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1450" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="20" fill="#14243a">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Cancellare i campi in P</text>
<text x="32" y="83" font-size="18">A: Q₁ = 1 nC ; Q₂ = 4 nC ; separazione 3 m.</text>
<path d="M140 220H500" stroke="#8292a2" stroke-width="2"/>
<circle cx="140" cy="220" r="23" fill="#fce6dc" stroke="#b45328"/><circle cx="500" cy="220" r="23" fill="#fce6dc" stroke="#b45328"/><text x="132" y="228">+</text><text x="492" y="228">+</text>
<path d="M260 220H350" stroke="#165a87" stroke-width="5" marker-end="url(#e1)"/><path d="M260 220H170" stroke="#b45328" stroke-width="5" marker-end="url(#e2)"/>
<circle cx="260" cy="220" r="5" fill="#14243a"/><text x="252" y="183">P</text>
<text x="290" y="185" fill="#165a87">E₁ = 9 N/C</text><text x="165" y="265" fill="#b45328">E₂ = 9 N/C</text>
<path d="M140 293V309M260 293V309M500 293V309M140 301H500" fill="none" stroke="#14243a" stroke-width="2"/>
<text x="164" y="343">d₁ = 1 m</text><text x="330" y="343">d₂ = 2 m</text>
<text x="32" y="389" font-size="18">Distanze sulla retta ; frecce di campo su scala diversa.</text>
<text x="32" y="424" font-size="18">In P i due vettori si sommano a zero.</text>
<path d="M32 456H608" stroke="#9babbc"/>
<text x="32" y="501" font-size="25" font-weight="bold">2 · Scambiare le sorgenti</text>
<text x="32" y="542" font-size="18">B: Q₁ = 4 nC ; Q₂ = 1 nC ; stessa separazione.</text>
<path d="M140 655H500" stroke="#8292a2" stroke-width="2"/>
<circle cx="140" cy="655" r="23" fill="#fce6dc" stroke="#b45328"/><circle cx="500" cy="655" r="23" fill="#fce6dc" stroke="#b45328"/><text x="132" y="663">+</text><text x="492" y="663">+</text>
<path d="M380 655H470" stroke="#165a87" stroke-width="5" marker-end="url(#e1)"/><path d="M380 655H290" stroke="#b45328" stroke-width="5" marker-end="url(#e2)"/>
<circle cx="380" cy="655" r="5" fill="#14243a"/><text x="372" y="613">P</text>
<text x="195" y="607" fill="#b45328">E₂ = 9 N/C</text><text x="390" y="704" fill="#165a87">E₁ = 9 N/C</text>
<path d="M140 739V755M380 739V755M500 739V755M140 747H500" fill="none" stroke="#14243a" stroke-width="2"/>
<text x="212" y="790">d₁ = 2 m</text><text x="397" y="790">d₂ = 1 m</text>
<text x="32" y="839" font-size="18">r_A = 1/2 ; r_B = 2 ; r_B / r_A = 4.</text>
<text x="32" y="874" font-size="18">Il punto nullo è più vicino alla carica minore.</text>
<path d="M32 908H608" stroke="#9babbc"/>
<text x="32" y="953" font-size="25" font-weight="bold">3 · Media dei rapporti</text>
<path d="M130 983V1250" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="1010" width="80" height="38" fill="#165a87"/><rect x="130" y="1090" width="320" height="38" fill="#165a87"/><rect x="130" y="1170" width="200" height="38" fill="#28664d"/>
<text x="55" y="1038">A</text><text x="230" y="1038">1/2</text><text x="55" y="1118">B</text><text x="470" y="1118">2</text><text x="32" y="1198">Media</text><text x="350" y="1198">5/4</text><text x="104" y="1244">0</text>
<text x="32" y="1294" font-size="18">r è puro: le barre condividono origine e scala.</text>
<text x="32" y="1330" font-size="18">Alle cariche medie uguali si avrebbe invece r = 1.</text>
<text x="32" y="1366" font-size="18">La media non è una somma di campi fra prove diverse.</text>
<text x="32" y="1402" font-size="18">Ogni configurazione mantiene le sorgenti ferme.</text>
</g></svg>
