<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1540" role="img" aria-labelledby="title desc">
<title id="title">Potenza Joule, corrente e confronto fra prove</title>
<desc id="desc">Un resistore da 3 ohm percorso da 2 ampere ha caduta 6 volt e potenza 12 watt. Il grafico a resistenza 3 ohm segue una parabola esatta fra corrente 1 e 2 ampere, con potenze 3 e 12 watt. Le due preparazioni delle barre hanno potenze 12 e 4 watt e media 8 watt; nella seconda cambia anche la resistenza a 4 ohm.</desc>
<rect width="680" height="1540" fill="#fffdf6"/>
<text x="34" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18364a">1 · Una caduta e una corrente</text>
<text x="34" y="88" font-family="Arial,sans-serif" font-size="20" fill="#18364a">R = 3 Ω ; I = 2 A entra dal morsetto A.</text>
<path d="M100 230H270M410 230H580" stroke="#24485c" stroke-width="3" fill="none"/>
<rect x="270" y="200" width="140" height="60" stroke="#165a87" stroke-width="3" fill="#eaf3f8"/>
<circle cx="100" cy="230" r="5" fill="#24485c"/><circle cx="580" cy="230" r="5" fill="#24485c"/>
<text x="90" y="200" font-family="Arial,sans-serif" font-size="20" fill="#18364a">A (+)</text><text x="550" y="200" font-family="Arial,sans-serif" font-size="20" fill="#18364a">B (−)</text>
<text x="305" y="180" font-family="Arial,sans-serif" font-size="20" fill="#18364a">3 Ω</text>
<text x="34" y="325" font-family="Arial,sans-serif" font-size="20" fill="#18364a">V_A − V_B = IR = 6 V.</text>
<text x="34" y="365" font-family="Arial,sans-serif" font-size="20" fill="#18364a">P = VI = I²R = 12 W ; potenza assorbita.</text>
<text x="34" y="405" font-family="Arial,sans-serif" font-size="18" fill="#18364a">L’energia convertita può poi uscire come calore.</text>
<text x="34" y="485" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18364a">2 · R resta 3 Ω</text>
<text x="34" y="525" font-family="Arial,sans-serif" font-size="20" fill="#18364a">P è quadratica in I ; qui 1 A ≤ I ≤ 2 A.</text>
<path d="M100 550V800H540" stroke="#526a78" stroke-width="2" fill="none"/>
<path d="M240 740Q310 680 380 560" stroke="#165a87" stroke-width="4" fill="none"/>
<circle cx="240" cy="740" r="5" fill="#165a87"/><circle cx="380" cy="560" r="5" fill="#165a87"/>
<text x="35" y="565" font-family="Arial,sans-serif" font-size="20" fill="#18364a">P (W)</text><text x="525" y="830" font-family="Arial,sans-serif" font-size="20" fill="#18364a">I (A)</text>
<text x="75" y="825" font-family="Arial,sans-serif" font-size="16" fill="#18364a">0</text><text x="234" y="825" font-family="Arial,sans-serif" font-size="16" fill="#18364a">1</text><text x="374" y="825" font-family="Arial,sans-serif" font-size="16" fill="#18364a">2</text>
<text x="255" y="730" font-family="Arial,sans-serif" font-size="20" fill="#18364a">3 W</text><text x="395" y="565" font-family="Arial,sans-serif" font-size="20" fill="#18364a">12 W</text>
<text x="34" y="875" font-family="Arial,sans-serif" font-size="18" fill="#18364a">Il grafico confronta correnti preparate, non istanti.</text>
<text x="34" y="955" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18364a">3 · Cambiano I e R fra le prove</text>
<text x="34" y="995" font-family="Arial,sans-serif" font-size="20" fill="#18364a">A: 2 A e 3 Ω ; B: 1 A e 4 Ω.</text>
<line x1="150" y1="1040" x2="150" y2="1330" stroke="#526a78" stroke-width="2"/><line x1="150" y1="1330" x2="450" y2="1330" stroke="#526a78" stroke-width="2"/>
<rect x="150" y="1060" width="240" height="34" fill="#165a87"/><rect x="150" y="1160" width="80" height="34" fill="#28664d"/><rect x="150" y="1260" width="160" height="34" fill="#9a4f23"/>
<text x="80" y="1085" font-family="Arial,sans-serif" font-size="20" fill="#18364a">A</text><text x="405" y="1085" font-family="Arial,sans-serif" font-size="20" fill="#18364a">12 W</text>
<text x="80" y="1185" font-family="Arial,sans-serif" font-size="20" fill="#18364a">B</text><text x="245" y="1185" font-family="Arial,sans-serif" font-size="20" fill="#18364a">4 W</text>
<text x="44" y="1285" font-family="Arial,sans-serif" font-size="20" fill="#18364a">Media</text><text x="325" y="1285" font-family="Arial,sans-serif" font-size="20" fill="#18364a">8 W</text>
<text x="125" y="1355" font-family="Arial,sans-serif" font-size="16" fill="#18364a">0</text><text x="380" y="1355" font-family="Arial,sans-serif" font-size="16" fill="#18364a">12 W</text>
<text x="34" y="1410" font-family="Arial,sans-serif" font-size="18" fill="#18364a">Barre con origine e scala comuni ; B ha R = 4 Ω.</text>
<text x="34" y="1450" font-family="Arial,sans-serif" font-size="18" fill="#18364a">Ai dati medi I = 3/2 A e R = 7/2 Ω:</text>
<text x="34" y="1485" font-family="Arial,sans-serif" font-size="18" fill="#18364a">P = 63/8 W, diversa dalla media 8 W.</text>
</svg>
