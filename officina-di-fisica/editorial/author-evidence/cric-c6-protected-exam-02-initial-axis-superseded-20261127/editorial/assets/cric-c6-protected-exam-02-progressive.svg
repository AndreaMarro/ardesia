<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2200" viewBox="0 0 640 2200" role="img" aria-labelledby="title desc" font-family="Arial,sans-serif" font-size="21" fill="#272536">
<title id="title">Quattro problemi distinti della seconda simulazione</title><desc id="desc">Aree dei pistoni di quattro e cento centimetri quadrati e incrementi di forza otto e duecento newton, su due scale distinte. Oggetto e immagine reale uguali in modulo a trentadue centimetri da una lente di focale sedici centimetri. Ciclo antiorario schematico a tre tratti con area dodici joule e primi calori più quaranta e meno quindici joule. Spira vista dal lettore: campo esterno uscente crescente, corrente oraria e campo indotto entrante.</desc>
<defs><marker id="g" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#147c76"/></marker><marker id="o" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#94631e"/></marker></defs><rect width="640" height="2200" fill="#fffdf7"/>
<text x="40" y="55" font-size="25" font-weight="bold">1 · Stessa pressione, forze diverse</text><text x="40" y="105" font-size="18">Pistoni alla stessa quota; confronto di incrementi.</text>
<text x="55" y="194">A₁</text><rect x="170" y="170" width="16" height="30" fill="#6852a3"/><text x="205" y="194">4 cm²</text><text x="55" y="269">A₂</text><rect x="170" y="245" width="400" height="30" fill="#6852a3"/><text x="370" y="308" text-anchor="middle">100 cm²</text>
<text x="45" y="359">ΔF₁</text><rect x="170" y="335" width="16" height="30" fill="#147c76"/><text x="205" y="359">8 N</text><text x="45" y="434">ΔF₂</text><rect x="170" y="410" width="400" height="30" fill="#147c76"/><text x="370" y="475" text-anchor="middle">200 N</text><text x="40" y="510" font-size="18">Scale distinte per aree e incrementi di forza.</text><path d="M40 540H600" stroke="#cbc6bc"/>
<text x="40" y="595" font-size="25" font-weight="bold">2 · La lente a metà del banco</text><text x="40" y="645">Oggetto–schermo: 64 cm ; altezze schematiche.</text><path d="M70 850H585M320 695V965" fill="none" stroke="#888"/>
<path d="M160 810H320L480 890" fill="none" stroke="#147c76" stroke-width="2"/><path d="M160 810L480 890" fill="none" stroke="#6852a3" stroke-width="2"/><path d="M160 850V810M480 850V890" fill="none" stroke="#94631e" stroke-width="3" marker-end="url(#o)"/>
<path d="M240 842V858M400 842V858" stroke="#888"/><text x="240" y="900" text-anchor="middle">F</text><text x="400" y="935" text-anchor="middle">F′</text><text x="320" y="680" text-anchor="middle">Lente</text>
<path d="M160 980V995H320V980M320 995H480V980" fill="none" stroke="#888"/><text x="240" y="1030" text-anchor="middle">p = 32 cm</text><text x="400" y="1030" text-anchor="middle">q = 32 cm</text><text x="95" y="765">Oggetto</text><text x="490" y="950">Immagine</text><path d="M40 1080H600" stroke="#cbc6bc"/>
<text x="40" y="1135" font-size="25" font-weight="bold">3 · Un ciclo antiorario a tre tratti</text><text x="40" y="1180" font-size="18">Schema del verso; assi senza scala numerica.</text><path d="M115 1530V1200M115 1480H575" fill="none" stroke="#888"/><text x="90" y="1215">p</text><text x="575" y="1525">V</text>
<path d="M160 1480H500" fill="none" stroke="#147c76" stroke-width="3" marker-end="url(#g)"/><path d="M500 1480L160 1240" fill="none" stroke="#147c76" stroke-width="3" marker-end="url(#g)"/><path d="M160 1240V1480" fill="none" stroke="#147c76" stroke-width="3" marker-end="url(#g)"/>
<text x="330" y="1300">Q₂ = −15 J</text><text x="25" y="1370">Q₃</text><text x="330" y="1555" text-anchor="middle">Q₁ = +40 J</text><text x="320" y="1605" text-anchor="middle">Area: 12 kPa·L = 12 J ; W gas = −12 J</text><path d="M40 1645H600" stroke="#cbc6bc"/>
<text x="40" y="1700" font-size="25" font-weight="bold">4 · La vista è quella del lettore</text><text x="40" y="1750" font-size="18">Campo esterno uscente crescente; circuito resistivo.</text>
