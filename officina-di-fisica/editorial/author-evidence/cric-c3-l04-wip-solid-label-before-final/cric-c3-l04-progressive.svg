<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Plateau, durata di fusione e controllo energetico</title><desc id="desc">Un plateau solido-liquido; energia lineare nel tempo fino a centosessantasette secondi; energia cedibile ottomilatrecentosessanta joule ripartita in tremilatrecentoquaranta di fusione e cinquemilaventi residui.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7350b0"/></marker></defs><rect width="640" height="1500" fill="#faf7ee"/><text x="30" y="40" font-size="25" fill="#302a3e">1. Temperatura ferma, fase variabile</text><text x="30" y="85" font-size="21" fill="#302a3e">Campione puro a pressione costante</text><path d="M130 420V125M130 420H540" fill="none" stroke="#726d81" stroke-width="2"/><path d="M150 390L260 280H420L510 170" fill="none" stroke="#147979" stroke-width="4"/><path d="M130 280H260" fill="none" stroke="#726d81" stroke-width="1.5" stroke-dasharray="7 6"/><text x="35" y="145" font-size="21" fill="#302a3e">T</text><text x="30" y="285" font-size="21" fill="#302a3e">T fus</text><text x="485" y="460" font-size="21" fill="#302a3e">Q fornito</text><text x="275" y="245" font-size="21" fill="#302a3e">solido + liquido</text><text x="150" y="365" font-size="18" fill="#302a3e">solido</text><text x="445" y="150" font-size="18" fill="#302a3e">liquido</text><text x="40" y="500" font-size="21" fill="#302a3e">Nel plateau cresce la frazione liquida.</text><text x="30" y="570" font-size="25" fill="#302a3e">2. Fondere con potenza costante</text><text x="30" y="615" font-size="21" fill="#302a3e">40 g di ghiaccio a 0 °C; P netta = 80 W</text><path d="M140 930V650M140 930H540" fill="none" stroke="#726d81" stroke-width="2"/><path d="M140 930L474 662.8" fill="none" stroke="#7350b0" stroke-width="4"/><path d="M474 662.8V930" fill="none" stroke="#726d81" stroke-width="1.5" stroke-dasharray="7 6"/><text x="35" y="662" font-size="21" fill="#302a3e">E (J)</text><text x="375" y="650" font-size="19" fill="#302a3e">13360 J</text><text x="112" y="960" font-size="21" fill="#302a3e">0</text><text x="448" y="960" font-size="21" fill="#302a3e">167</text><text x="520" y="1005" font-size="21" fill="#302a3e">t (s)</text><text x="170" y="830" font-size="21" fill="#302a3e">E = Pt</text><text x="30" y="1075" font-size="25" fill="#302a3e">3. Il ghiaccio fonde tutto?</text><path d="M140 1400V1100M140 1400H575" fill="none" stroke="#726d81" stroke-width="2"/><rect x="140" y="1135" width="418" height="45" fill="#7350b0"/><rect x="140" y="1255" width="167" height="45" fill="#68bdcf"/><rect x="307" y="1255" width="251" height="45" fill="#147979"/><text x="155" y="1120" font-size="21" fill="#302a3e">8360 J cedibili fino a 0 °C</text><text x="145" y="1230" font-size="18" fill="#302a3e">3340 J per fondere</text><text x="330" y="1330" font-size="21" fill="#302a3e">5020 J residui</text><text x="112" y="1430" font-size="21" fill="#302a3e">0</text><text x="490" y="1468" font-size="21" fill="#302a3e">Energia (J)</text></svg>
