<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1650" viewBox="0 0 640 1650" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Tre letture: volume, tara e spostamento</title><desc id="desc">Un prisma di volume equivalente alla micropipetta, tre barre di massa sulla stessa scala e uno spostamento di quattro metri verso nord. Pannelli indipendenti con unità fisiche dichiarate.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#306f8c"/></marker></defs><rect width="640" height="1650" fill="white"/><text x="35" y="48" font-size="25" fill="#203247" text-anchor="start">Misurare prima di confrontare</text><text x="35" y="110" font-size="22" fill="#203247" text-anchor="start">1 · Un volume equivalente: 250 µL</text><text x="35" y="165" font-size="19" fill="#203247" text-anchor="start">1 µL = 1 mm³; la forma non cambia il volume.</text><text x="35" y="210" font-size="18" fill="#203247" text-anchor="start">Prisma di lati 5 mm, 5 mm e 10 mm.</text><polygon points="170,350 270,350 340.710678,279.289322 240.710678,279.289322" fill="#dcebf2" stroke="#306f8c" stroke-width="2"/><polygon points="270,350 340.710678,279.289322 340.710678,479.289322 270,550" fill="#c9dfe9" stroke="#306f8c" stroke-width="2"/><rect x="170" y="350" width="100" height="200" fill="#edf4f7" stroke="#306f8c" stroke-width="2"/><text x="220" y="585" font-size="19" fill="#203247" text-anchor="middle">5 mm</text><text x="75" y="455" font-size="19" fill="#203247" text-anchor="start">10 mm</text><text x="365" y="315" font-size="19" fill="#203247" text-anchor="start">5 mm</text><text x="35" y="625" font-size="18" fill="#203247" text-anchor="start">5 × 5 × 10 = 250; il volume è 250 mm³.</text><text x="35" y="690" font-size="22" fill="#203247" text-anchor="start">2 · Togliere la tara nella stessa unità</text><text x="135" y="764" font-size="18" fill="#203247" text-anchor="end">piena</text><rect x="155" y="740" width="273" height="30" fill="#3d7791"/><text x="438" y="764" font-size="18" fill="#203247" text-anchor="start">54,6 g</text><text x="135" y="864" font-size="18" fill="#203247" text-anchor="end">vuota</text><rect x="155" y="840" width="210" height="30" fill="#986c35"/><text x="375" y="864" font-size="18" fill="#203247" text-anchor="start">42,0 g</text><text x="135" y="964" font-size="18" fill="#203247" text-anchor="end">contenuto</text><rect x="155" y="940" width="63" height="30" fill="#637e55"/><text x="228" y="964" font-size="18" fill="#203247" text-anchor="start">12,6 g</text><text x="35" y="1030" font-size="19" fill="#203247" text-anchor="start">0,0420 kg = 42,0 g</text><text x="35" y="1070" font-size="19" fill="#203247" text-anchor="start">54,6 g − 42,0 g = 12,6 g</text><text x="35" y="1150" font-size="22" fill="#203247" text-anchor="start">3 · Un vettore spostamento verso nord</text><text x="320" y="1225" font-size="22" fill="#203247" text-anchor="middle">N</text><path d="M320 1500V1300" fill="none" stroke="#306f8c" stroke-width="3" marker-end="url(#arr)"/><line x1="313" y1="1500" x2="327" y2="1500" stroke="#6c7d89" stroke-width="2"/><line x1="313" y1="1450" x2="327" y2="1450" stroke="#6c7d89" stroke-width="2"/><text x="295" y="1456" font-size="18" fill="#203247" text-anchor="end">1 m</text><line x1="313" y1="1400" x2="327" y2="1400" stroke="#6c7d89" stroke-width="2"/><text x="295" y="1406" font-size="18" fill="#203247" text-anchor="end">2 m</text><line x1="313" y1="1350" x2="327" y2="1350" stroke="#6c7d89" stroke-width="2"/><text x="295" y="1356" font-size="18" fill="#203247" text-anchor="end">3 m</text><line x1="313" y1="1300" x2="327" y2="1300" stroke="#6c7d89" stroke-width="2"/><text x="295" y="1306" font-size="18" fill="#203247" text-anchor="end">4 m</text><text x="295" y="1510" font-size="18" fill="#203247" text-anchor="end">O</text><text x="355" y="1400" font-size="22" fill="#203247" text-anchor="start">Δr</text><text x="35" y="1580" font-size="19" fill="#203247" text-anchor="start">Il modulo è 4 m; la freccia aggiunge il verso.</text><text x="35" y="1620" font-size="18" fill="#203247" text-anchor="start">Non è un percorso obbligato né una forza.</text></svg>
