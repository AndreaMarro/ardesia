<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif" font-size="21" fill="#272536" stroke-linejoin="round" stroke-linecap="round">
<title id="title">Conduttori, carica totale e dielettrico</title><desc id="desc">Tre situazioni distinte. Bacchetta negativa vicina a un conduttore neutro isolato: difetto di elettroni vicino, eccesso lontano. Due porzioni della superficie sommano meno 6 e più 6 nanocoulomb. Un dielettrico di permittività relativa 3 fra piastre isolate riduce il campo da 12 a 4 kilovolt per metro. I simboli delle cariche e le dimensioni dei corpi non rappresentano densità fisiche.</desc><defs><marker id="g" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#147c76"/></marker><marker id="v" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#6852a3"/></marker></defs><rect width="640" height="1540" fill="#fffdf7"/>

<text x="40" y="55" font-size="25" font-weight="bold">1 · Induzione senza contatto</text><text x="40" y="105">La sfera isolata resta complessivamente neutra.</text>
<rect x="60" y="190" width="115" height="36" rx="12" fill="#dcd5f1" stroke="#6852a3" stroke-width="2"/><text x="117" y="216" text-anchor="middle">− − −</text>
<circle cx="380" cy="250" r="90" fill="#eee9da" stroke="#888" stroke-width="2"/>
<text x="325" y="225">+</text><text x="315" y="265">+</text><text x="330" y="303">+</text><text x="415" y="225">−</text><text x="425" y="265">−</text><text x="410" y="303">−</text>
<text x="200" y="385">Difetto di elettroni vicino</text><text x="200" y="425">Eccesso di elettroni lontano</text>
<path d="M40 465H600" stroke="#cbc6bc"/>
<text x="40" y="520" font-size="25" font-weight="bold">2 · Due parti di una superficie neutra</text>
<circle cx="320" cy="735" r="115" fill="#eee9da" stroke="#888" stroke-width="2"/><path d="M320 620V850" fill="none" stroke="#999" stroke-dasharray="6 4"/>
<text x="255" y="743" text-anchor="middle">−6 nC</text><text x="385" y="743" text-anchor="middle">+6 nC</text><text x="320" y="925" text-anchor="middle">q_tot = (−6 + 6) nC = 0</text><text x="40" y="975" font-size="18">Porzioni simboliche, non una mappa della densità.</text>
<path d="M40 1020H600" stroke="#cbc6bc"/>
<text x="40" y="1080" font-size="25" font-weight="bold">3 · Stessa carica libera sulle piastre</text>
<rect x="390" y="1180" width="160" height="180" fill="#e8e3f0"/><path d="M80 1180V1360M260 1180V1360M380 1180V1360M560 1180V1360" fill="none" stroke="#888" stroke-width="6"/>
<text x="80" y="1150" text-anchor="middle">+</text><text x="260" y="1150" text-anchor="middle">−</text><text x="380" y="1150" text-anchor="middle">+</text><text x="560" y="1150" text-anchor="middle">−</text>
<path d="M130 1280H220" fill="none" stroke="#147c76" stroke-width="3" marker-end="url(#g)"/><path d="M430 1280H460" fill="none" stroke="#147c76" stroke-width="3" marker-end="url(#g)"/>
<text x="170" y="1400" text-anchor="middle">Vuoto</text><text x="470" y="1400" text-anchor="middle">ε_r = 3</text><text x="170" y="1450" text-anchor="middle">12 kV/m</text><text x="470" y="1450" text-anchor="middle">4 kV/m</text><text x="40" y="1510" font-size="18">Carica libera fissata; riempimento completo.</text>

</svg>
