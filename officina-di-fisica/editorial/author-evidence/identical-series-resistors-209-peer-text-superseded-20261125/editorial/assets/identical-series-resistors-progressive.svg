<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1390" role="img" aria-labelledby="title desc">
<title id="title">Tre e quattro resistori sono conteggi interi</title><desc id="desc">Una catena da tre resistori identici di2 ohm ha resistenza6 ohm. Un’altra da quattro resistori di3 ohm vale12 ohm. I simboli sono schematici; le barre quantitative finali hanno valori6,12 e media9 ohm. Non si costruisce una catena con sette mezzi elementi.</desc>
<rect width="640" height="1390" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Tre addendi identici</text>
<text x="32" y="83" font-size="18">N_A = 3 ; ogni elemento vale r_A = 2 Ω.</text>
<g fill="none" stroke="#14243a" stroke-width="3"><path d="M70 180H130M210 180H280M360 180H430M510 180H570"/><rect x="130" y="160" width="80" height="40"/><rect x="280" y="160" width="80" height="40"/><rect x="430" y="160" width="80" height="40"/></g>
<text x="150" y="140">2 Ω</text><text x="300" y="140">2 Ω</text><text x="450" y="140">2 Ω</text>
<text x="32" y="260">R_A = 2 Ω + 2 Ω + 2 Ω = 6 Ω.</text>
<text x="32" y="305" font-size="18">Nessuna derivazione ; corrente comune ai tre elementi.</text>
<path d="M32 352H608" stroke="#9babbc"/>
<text x="32" y="397" font-size="25" font-weight="bold">2 · Quattro addendi, tutti nuovi</text>
<text x="32" y="438" font-size="18">N_B = 4 ; ogni elemento vale r_B = 3 Ω.</text>
<g fill="none" stroke="#14243a" stroke-width="3"><path d="M60 555H100M170 555H210M280 555H320M390 555H430M500 555H570"/><rect x="100" y="535" width="70" height="40"/><rect x="210" y="535" width="70" height="40"/><rect x="320" y="535" width="70" height="40"/><rect x="430" y="535" width="70" height="40"/></g>
<text x="115" y="515">3 Ω</text><text x="225" y="515">3 Ω</text><text x="335" y="515">3 Ω</text><text x="445" y="515">3 Ω</text>
<text x="32" y="635">R_B = 4 · (3 Ω) = 12 Ω.</text>
<text x="32" y="682" font-size="18">Simboli schematici ; il conteggio è esattamente quattro.</text>
<path d="M32 730H608" stroke="#9babbc"/>
<text x="32" y="775" font-size="25" font-weight="bold">3 · Media delle letture</text>
<path d="M150 830V1110" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="855" width="180" height="34" fill="#165a87"/><rect x="150" y="945" width="360" height="34" fill="#b45328"/><rect x="150" y="1035" width="270" height="34" fill="#28664d"/>
<text x="50" y="880">A</text><text x="350" y="880">6 Ω</text><text x="50" y="970">B</text><text x="530" y="970">12 Ω</text>
<text x="32" y="1060">Media</text><text x="440" y="1060">9 Ω</text><text x="125" y="1104">0</text>
<text x="32" y="1170" font-size="18">Barre con origine e scala comuni in ohm.</text>
<text x="32" y="1220" font-size="18">Una media di letture non è una nuova catena.</text>
<text x="32" y="1270" font-size="18">N medio = 7/2 non è un conteggio ammesso.</text>
<text x="32" y="1320" font-size="18">Nelle due prove N resta intero positivo.</text>
</g></svg>
