<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Il tempo di un’orbita magnetica</title><desc id="desc">Tre tappe: il periodo completo distinto dal tempo ridotto, confronto fra due preparazioni e loro media alla stessa scala, tre valori esatti di tau a massa e carica fissate con campo uno due quattro tesla.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif" fill="#20354d"><text x="32" y="42" font-size="24" text-anchor="start">Il tempo di un’orbita magnetica</text><text x="32" y="92" font-size="22" text-anchor="start">1 · Periodo completo e tempo ridotto</text><text x="32" y="132" font-size="18" text-anchor="start">m = 1 mg · |q| = 1 μC · B = 2 T</text><circle cx="320" cy="280" r="80" fill="none" stroke="#316b9b" stroke-width="2"/><path d="M320 200A80 80 0 1 1 240 280" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="320" y1="360" x2="450" y2="360" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="466" y="367" font-size="18" text-anchor="start">v</text><text x="32" y="408" font-size="18" text-anchor="start">Un giro completo: T = π s</text><text x="32" y="445" font-size="18" text-anchor="start">Tempo ridotto: τ = T/(2π) = 1/2 s</text><text x="32" y="480" font-size="18" text-anchor="start">Il cerchio è schematico: il raggio non è dato.</text><text x="32" y="550" font-size="22" text-anchor="start">2 · Due preparazioni e la media</text><text x="32" y="590" font-size="18" text-anchor="start">A: 1 mg, 2 T · B: 2 mg, 1 T</text><text x="128" y="674" font-size="18" text-anchor="end">A</text><rect x="150" y="650" width="80" height="32" fill="#316b9b"/><text x="242" y="674" font-size="18" text-anchor="start">1/2 s</text><text x="128" y="764" font-size="18" text-anchor="end">B</text><rect x="150" y="740" width="320" height="32" fill="#316b9b"/><text x="482" y="764" font-size="18" text-anchor="start">2 s</text><text x="128" y="854" font-size="18" text-anchor="end">Media</text><rect x="150" y="830" width="200" height="32" fill="#316b9b"/><text x="362" y="854" font-size="18" text-anchor="start">5/4 s</text><text x="32" y="910" font-size="18" text-anchor="start">Barre di τ alla stessa scala; T = 2πτ.</text><text x="32" y="960" font-size="22" text-anchor="start">3 · Stessa massa e carica</text><line x1="145" y1="1280" x2="520" y2="1280" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1285" x2="150" y2="1030" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><text x="128" y="1305" font-size="18" text-anchor="end">0</text><text x="535" y="1290" font-size="18" text-anchor="start">B (T)</text><text x="95" y="1015" font-size="18" text-anchor="start">τ (s)</text><circle cx="230" cy="1120" r="5" fill="#316b9b"/><text x="230" y="1310" font-size="18" text-anchor="middle">1</text><text x="128" y="1126" font-size="18" text-anchor="end">1</text><circle cx="310" cy="1200" r="5" fill="#316b9b"/><text x="310" y="1310" font-size="18" text-anchor="middle">2</text><text x="128" y="1206" font-size="18" text-anchor="end">1/2</text><circle cx="470" cy="1240" r="5" fill="#316b9b"/><text x="470" y="1310" font-size="18" text-anchor="middle">4</text><text x="128" y="1246" font-size="18" text-anchor="end">1/4</text><text x="32" y="1380" font-size="18" text-anchor="start">Punti distinti, senza interpolazione lineare.</text><text x="32" y="1420" font-size="18" text-anchor="start">L’origine è degli assi: B = 0 non è ammesso.</text></g></svg>
