<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1660" viewBox="0 0 640 1660" role="img" aria-labelledby="title desc"><title id="title">Serie, parallelo e nodo intermedio</title><desc id="desc">Due condensatori in serie con nodo intermedio neutro e cariche interne opposte. Gli stessi due componenti da due microfarad confrontati in parallelo, non commutati nel tempo. Capacità di serie uno e due microfarad e media tre mezzi.</desc><rect width="640" height="1660" rx="16" fill="#f7f9fc"/>
<text x="32" y="44" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">1 · Serie: nodo intermedio neutro</text>
<text x="32" y="86" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₁ = C₂ = 2 μF ; simboli schematici.</text>
<path d="M100 195H235M255 195H385M405 195H540" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M235 170V220" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M255 170V220" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M385 170V220" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M405 170V220" fill="none" stroke="#182c46" stroke-width="4"/>
<circle cx="100" cy="195" r="4" fill="#182c46"/>
<circle cx="320" cy="195" r="4" fill="#182c46"/>
<circle cx="540" cy="195" r="4" fill="#182c46"/>
<text x="78" y="240" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="310" y="240" font-family="Arial,sans-serif" font-size="21" fill="#182c46">M</text>
<text x="538" y="240" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="194" y="153" font-family="Arial,sans-serif" font-size="21" fill="#182c46">+Q</text>
<text x="263" y="153" font-family="Arial,sans-serif" font-size="21" fill="#182c46">−Q</text>
<text x="343" y="153" font-family="Arial,sans-serif" font-size="21" fill="#182c46">+Q</text>
<text x="413" y="153" font-family="Arial,sans-serif" font-size="21" fill="#182c46">−Q</text>
<text x="178" y="291" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₁ = 2 μF</text>
<text x="382" y="291" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₂ = 2 μF</text>
<text x="32" y="352" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Sul nodo M: −Q + Q = 0.</text>
<text x="32" y="396" font-family="Arial,sans-serif" font-size="21" fill="#182c46">V = Q/C₁ + Q/C₂ ; S = 1 μF.</text>
<path d="M32 460H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="510" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">2 · Confronto distinto: parallelo</text>
<text x="32" y="554" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Stessi componenti, diversi collegamenti.</text>
<path d="M110 650V780M530 650V780" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M110 650H290M310 650H530" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M290 625V675" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M310 625V675" fill="none" stroke="#182c46" stroke-width="4"/>
<circle cx="110" cy="650" r="4" fill="#182c46"/>
<circle cx="530" cy="650" r="4" fill="#182c46"/>
<path d="M110 780H290M310 780H530" fill="none" stroke="#182c46" stroke-width="2"/>
<path d="M290 755V805" fill="none" stroke="#182c46" stroke-width="4"/>
<path d="M310 755V805" fill="none" stroke="#182c46" stroke-width="4"/>
<circle cx="110" cy="780" r="4" fill="#182c46"/>
<circle cx="530" cy="780" r="4" fill="#182c46"/>
<text x="67" y="646" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="548" y="646" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="234" y="608" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₁ = 2 μF</text>
<text x="234" y="738" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C₂ = 2 μF</text>
<text x="32" y="864" font-family="Arial,sans-serif" font-size="21" fill="#182c46">C_parallelo = 4 μF ; C_serie = 1 μF.</text>
<text x="32" y="906" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Rapporto 4 ; nessun vincolo di commutazione.</text>
<path d="M32 974H608" fill="none" stroke="#c4cfdb" stroke-width="2"/>
<text x="32" y="1025" font-family="Arial,sans-serif" font-size="25" fill="#182c46" font-weight="700">3 · Altre preparazioni in serie</text>
<text x="32" y="1068" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A: 2 e 2 μF ; B: 3 e 6 μF</text>
<path d="M150 1130V1510" fill="none" stroke="#182c46" stroke-width="2"/>
<rect x="150" y="1160" width="160" height="44" fill="#185d83"/>
<text x="32" y="1190" font-family="Arial,sans-serif" font-size="21" fill="#182c46">A</text>
<text x="328" y="1190" font-family="Arial,sans-serif" font-size="21" fill="#182c46">1 μF</text>
<rect x="150" y="1280" width="320" height="44" fill="#b85322"/>
<text x="32" y="1310" font-family="Arial,sans-serif" font-size="21" fill="#182c46">B</text>
<text x="488" y="1310" font-family="Arial,sans-serif" font-size="21" fill="#182c46">2 μF</text>
<rect x="150" y="1400" width="240" height="44" fill="#35654e"/>
<text x="32" y="1430" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Media</text>
<text x="408" y="1430" font-family="Arial,sans-serif" font-size="21" fill="#182c46">3/2 μF</text>
<text x="118" y="1540" font-family="Arial,sans-serif" font-size="21" fill="#182c46">0</text>
<text x="32" y="1592" font-family="Arial,sans-serif" font-size="21" fill="#182c46">Origine e scala comuni entro il pannello.</text>
</svg>
