<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc">
<title id="title">Energia di fusione e tempi alimentati</title><desc id="desc">Confronto dell’energia di fusione: 10 mg richiedono 2 joule, 80 mg richiedono 16 joule. Nel grafico della prova A a potenza 2 watt, l’energia elettrica cresce da zero a 2 joule fra zero e 1 secondo e la curva si ferma al completamento della fusione. Le barre finali confrontano durate 1 secondo,2secondi e media3/2secondi.</desc>
<rect width="640" height="1480" rx="16" fill="#f7f9fc"/>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="32" y="44" font-size="25" font-weight="700">1 · Già alla temperatura di fusione</text><text x="32" y="84">Solo energia di fase: L_f = 200 J/g.</text><text x="32" y="124">A: m = 10 mg ; B: m = 80 mg.</text><text x="60" y="215">A</text><text x="60" y="315">B</text></g>
<path d="M150 165V355" fill="none" stroke="#182c46" stroke-width="2"/><rect x="150" y="185" width="40" height="42" fill="#185d83"/><rect x="150" y="285" width="320" height="42" fill="#b85322"/>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="210" y="215">2 J</text><text x="490" y="315">16 J</text><text x="118" y="380">0</text><text x="32" y="425">Barre di energia: stessa origine e scala.</text></g>
<path d="M32 470H608" stroke="#c4cfdb" stroke-width="2"/>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="32" y="520" font-size="25" font-weight="700">2 · Fornire l’energia alla prova A</text><text x="32" y="562">I = 1 A ; R = 2 Ω ; P = 2 W.</text><text x="35" y="620">E / J</text></g>
<g fill="none" stroke="#182c46" stroke-width="2"><path d="M150 610V850H550"/><path d="M450 850V650H150" stroke="#a9b9c9" stroke-dasharray="5 5"/></g>
<path d="M150 850L450 650" fill="none" stroke="#185d83" stroke-width="4"/><circle cx="450" cy="650" r="5" fill="#185d83"/>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="118" y="880">0</text><text x="443" y="880">1</text><text x="558" y="858">t / s</text><text x="118" y="658">2</text><text x="325" y="705">fusione completa</text><text x="32" y="938">Il segmento termina a t = 1 s, E = 2 J.</text><text x="32" y="976">Non descrive il riscaldamento successivo.</text></g>
<path d="M32 1015H608" stroke="#c4cfdb" stroke-width="2"/>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="32" y="1062" font-size="25" font-weight="700">3 · Tempi di due prove separate</text><text x="32" y="1104">A: 10 mg, 1 A ; B: 80 mg, 2 A.</text><text x="65" y="1184">A</text><text x="65" y="1264">B</text><text x="32" y="1344">Media</text></g>
<path d="M150 1140V1380" fill="none" stroke="#182c46" stroke-width="2"/><rect x="150" y="1154" width="160" height="42" fill="#185d83"/><rect x="150" y="1234" width="320" height="42" fill="#b85322"/><rect x="150" y="1314" width="240" height="42" fill="#35654e"/>
<g fill="#182c46" font-family="Arial,sans-serif" font-size="21"><text x="330" y="1184">1 s</text><text x="490" y="1264">2 s</text><text x="410" y="1344">3/2 s</text><text x="118" y="1405">0</text><text x="32" y="1448">Le durate sono pesate ugualmente.</text></g>
</svg>
