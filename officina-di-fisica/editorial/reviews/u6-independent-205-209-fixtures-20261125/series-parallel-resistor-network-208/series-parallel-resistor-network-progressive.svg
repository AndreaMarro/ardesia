<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1460" role="img" aria-labelledby="title desc">
<title id="title">Prima il parallelo, poi la serie</title><desc id="desc">Un resistore r è esterno al parallelo r,R. Con r eR entrambi2 ohm il parallelo vale1 e il totale3. Con r3 eR6 ohm il parallelo vale2 e il totale5. La media dei due totali è4 ohm.</desc>
<rect width="640" height="1460" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Lo stesso r in due posizioni</text>
<text x="32" y="82" font-size="18">Il resistore esterno non condivide i due nodi del blocco.</text>
<g fill="none" stroke="#14243a" stroke-width="3"><path d="M60 240H120M220 240H300V165H380M480 165H550V315H480M380 315H300V240M550 240H590"/><rect x="120" y="220" width="100" height="40"/><rect x="380" y="145" width="100" height="40"/><rect x="380" y="295" width="100" height="40"/></g>
<circle cx="300" cy="240" r="5" fill="#165a87"/><circle cx="550" cy="240" r="5" fill="#165a87"/>
<text x="143" y="198">r = 2 Ω</text><text x="381" y="130">r = 2 Ω</text><text x="381" y="375">R = 2 Ω</text>
<text x="32" y="422">Il blocco interno vale 1 Ω ; T = 2 Ω + 1 Ω.</text>
<path d="M32 464H608" stroke="#9babbc"/>
<text x="32" y="509" font-size="25" font-weight="bold">2 · Contributi al totale, in ohm</text>
<text x="32" y="550" font-size="18">Blu: resistore esterno ; verde: parallelo interno.</text>
<path d="M150 585V820" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="610" width="80" height="40" fill="#165a87"/><rect x="230" y="610" width="40" height="40" fill="#28664d"/>
<rect x="150" y="720" width="120" height="40" fill="#165a87"/><rect x="270" y="720" width="80" height="40" fill="#28664d"/>
<text x="50" y="638">A</text><text x="290" y="638">2 Ω + 1 Ω = 3 Ω</text>
<text x="50" y="748">B</text><text x="370" y="748">3 Ω + 2 Ω = 5 Ω</text><text x="125" y="814">0</text>
<text x="32" y="873" font-size="18">A: r = R = 2 Ω ; B: r = 3 Ω,R = 6 Ω.</text>
<text x="32" y="911" font-size="18">Stessa origine e stessa scala per entrambi i segmenti.</text>
<path d="M32 952H608" stroke="#9babbc"/>
<text x="32" y="997" font-size="25" font-weight="bold">3 · La media dei due totali</text>
<path d="M150 1040V1310" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="1060" width="180" height="34" fill="#165a87"/><rect x="150" y="1145" width="300" height="34" fill="#b45328"/><rect x="150" y="1230" width="240" height="34" fill="#28664d"/>
<text x="50" y="1085">A</text><text x="350" y="1085">3 Ω</text><text x="50" y="1170">B</text><text x="470" y="1170">5 Ω</text>
<text x="32" y="1255">Media</text><text x="410" y="1255">4 Ω</text><text x="125" y="1304">0</text>
<text x="32" y="1360" font-size="18">Barre del totale con origine e scala comuni.</text><text x="32" y="1400" font-size="18">Ai dati medi: T = 105/26 Ω, diverso da 4 Ω.</text>
</g></svg>
