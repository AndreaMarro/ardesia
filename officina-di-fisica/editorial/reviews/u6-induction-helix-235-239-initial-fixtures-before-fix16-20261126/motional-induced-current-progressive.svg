<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1520" viewBox="0 0 640 1520" role="img" aria-labelledby="title desc">
<title id="title">Una f.e.m. in un circuito chiuso</title><desc id="desc">Una sbarretta mobile verso destra in campo entrante chiude il circuito resistivo. La corrente risale la sbarretta e circola in senso antiorario. Grafico corrente rispetto alla velocità a resistenza un ohm. Barre quattro ampere, un ampere e media cinque mezzi ampere.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20334a"/></marker></defs>
<rect width="640" height="1520" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#20334a">
<text x="36" y="42" font-size="24" font-weight="700">1. Corrente solo nel percorso chiuso</text>
<text x="40" y="84" font-size="17">B entrante; sbarretta verso destra; versi schematici.</text>
<path d="M115 150H450V350H115V290L103 280L127 262L103 244L127 226L103 208L115 198V150" fill="none" stroke="#6e7d89" stroke-width="4"/>
<path d="M450 150V350" stroke="#2773ae" stroke-width="10"/>
<path d="M245 200L261 216M261 200L245 216M335 200L351 216M351 200L335 216M245 280L261 296M261 280L245 296M335 280L351 296M351 280L335 296" stroke="#71849a" stroke-width="3"/>
<path d="M450 305V195" fill="none" stroke="#20334a" stroke-width="3" marker-end="url(#a)"/>
<path d="M380 150H240" fill="none" stroke="#20334a" stroke-width="3" marker-end="url(#a)"/>
<path d="M190 350H325" fill="none" stroke="#20334a" stroke-width="3" marker-end="url(#a)"/>
<path d="M483 250H570" fill="none" stroke="#20334a" stroke-width="3" marker-end="url(#a)"/>
<text x="505" y="228" font-size="19">v</text><text x="422" y="257" font-size="20">I</text>
<text x="61" y="251" font-size="20">R</text><text x="280" y="125" font-size="18">corrente antioraria</text>
<text x="40" y="400" font-size="18">B = 1 T; L = 2 m; autoinduzione trascurata.</text>
<text x="40" y="434" font-size="17">L’agente mantiene v; l’energia fornita diventa calore.</text>
<text x="36" y="495" font-size="24" font-weight="700">2. A resistenza fissata</text>
<text x="40" y="535" font-size="18">R = 1 Ω; I = BLv / R.</text>
<path d="M130 920V585M115 900H535" fill="none" stroke="#20334a" stroke-width="2"/>
<text x="40" y="580" font-size="18">I (A)</text><text x="500" y="970" font-size="18">v (m/s)</text><text x="96" y="928" font-size="17">0</text>
<path d="M130 700H120M130 600H120M370 900V911M490 900V911" stroke="#20334a" stroke-width="2"/>
<text x="98" y="706" font-size="17">4</text><text x="98" y="606" font-size="17">6</text><text x="365" y="936" font-size="17">2</text><text x="485" y="936" font-size="17">3</text>
<path d="M130 900L490 600" fill="none" stroke="#2773ae" stroke-width="4"/>
<circle cx="370" cy="700" r="6" fill="#2773ae"/><text x="391" y="709" font-size="18">A</text>
<text x="40" y="1010" font-size="17">Origine limite; il dominio dei quesiti ha v &gt; 0.</text>
<text x="36" y="1060" font-size="24" font-weight="700">3. Medie di preparazioni distinte</text>
<text x="40" y="1102" font-size="17">A: 2 m/s, 1 Ω; B: 1 m/s, 2 Ω.</text>
<text x="55" y="1175" font-size="20">A</text><rect x="150" y="1145" width="320" height="44" fill="#2773ae"/><text x="485" y="1175" font-size="20">4 A</text>
<text x="55" y="1265" font-size="20">B</text><rect x="150" y="1235" width="80" height="44" fill="#9b436f"/><text x="245" y="1265" font-size="20">1 A</text>
<text x="35" y="1355" font-size="20">media</text><rect x="150" y="1325" width="200" height="44" fill="#377f65"/><text x="365" y="1355" font-size="20">5/2 A</text>
<path d="M150 1130V1400" stroke="#20334a" stroke-width="2"/><text x="116" y="1420" font-size="17">0</text>
<text x="40" y="1470" font-size="18">Barre con stessa origine e stessa scala in ampere.</text>
</g></svg>
