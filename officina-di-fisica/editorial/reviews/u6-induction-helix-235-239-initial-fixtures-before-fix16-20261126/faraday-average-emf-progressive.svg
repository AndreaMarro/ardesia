<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc">
<title id="title">Dal flusso alla f.e.m. media</title><desc id="desc">Vista frontale di un campo uscente crescente e del campo indotto entrante. Due variazioni lineari per spira di sei milliweber in due millisecondi e dodici in tre. Barre dei moduli medi trenta e quaranta volt e della loro media trentacinque.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20334a"/></marker></defs>
<rect width="640" height="1500" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#20334a">
<text x="36" y="42" font-size="24" font-weight="700">1. Quale variazione contrastare</text>
<text x="40" y="80" font-size="17">Vista dell’osservatore; versi schematici.</text>
<circle cx="180" cy="220" r="70" fill="none" stroke="#2773ae" stroke-width="3"/>
<circle cx="450" cy="220" r="70" fill="none" stroke="#9b436f" stroke-width="3"/>
<circle cx="155" cy="205" r="5" fill="#2773ae"/><circle cx="205" cy="205" r="5" fill="#2773ae"/><circle cx="180" cy="245" r="5" fill="#2773ae"/>
<path d="M426 201L440 215M440 201L426 215M460 201L474 215M474 201L460 215M443 239L457 253M457 239L443 253" stroke="#9b436f" stroke-width="3"/>
<path d="M450 150A70 70 0 0 1 520 220" fill="none" stroke="#20334a" stroke-width="3" marker-end="url(#a)"/>
<text x="65" y="330" font-size="19">B esterno uscente</text><text x="95" y="360" font-size="18">sta aumentando</text>
<text x="345" y="330" font-size="19">B indotto entrante</text><text x="356" y="360" font-size="18">corrente oraria</text>
<text x="40" y="410" font-size="17">Normale uscente: variazione positiva, f.e.m. negativa.</text>
<text x="36" y="460" font-size="24" font-weight="700">2. Le pendenze del flusso per spira</text>
<path d="M130 875V490M115 860H545" fill="none" stroke="#20334a" stroke-width="2"/>
<text x="50" y="500" font-size="17">Φ</text><text x="40" y="524" font-size="17">(mWb)</text>
<text x="525" y="898" font-size="17">t (ms)</text><text x="98" y="888" font-size="17">0</text>
<path d="M130 680H120M130 500H120M370 860V870M490 860V870" stroke="#20334a" stroke-width="2"/>
<text x="97" y="686" font-size="17">6</text><text x="85" y="506" font-size="17">12</text>
<text x="365" y="892" font-size="17">2</text><text x="485" y="892" font-size="17">3</text>
<path d="M130 860L370 680" fill="none" stroke="#2773ae" stroke-width="4"/>
<path d="M130 860L490 500" fill="none" stroke="#9b436f" stroke-width="4"/>
<circle cx="370" cy="680" r="5" fill="#2773ae"/><circle cx="490" cy="500" r="5" fill="#9b436f"/>
<text x="390" y="685" font-size="18" fill="#2773ae">A</text><text x="510" y="510" font-size="18" fill="#9b436f">B</text>
<text x="40" y="940" font-size="18">N = 10: E = N |ΔΦ| / Δt.</text>
<text x="40" y="974" font-size="17">Le rette sono esempi; Faraday media usa gli estremi.</text>
<text x="36" y="1045" font-size="24" font-weight="700">3. Prima le uscite, poi la media</text>
<text x="40" y="1090" font-size="17">E = |ε media|, in volt; scala comune alle tre barre.</text>
<text x="55" y="1165" font-size="20">A</text><rect x="150" y="1135" width="240" height="44" fill="#2773ae"/><text x="405" y="1165" font-size="20">30 V</text>
<text x="55" y="1255" font-size="20">B</text><rect x="150" y="1225" width="320" height="44" fill="#9b436f"/><text x="485" y="1255" font-size="20">40 V</text>
<text x="35" y="1345" font-size="20">media</text><rect x="150" y="1315" width="280" height="44" fill="#377f65"/><text x="445" y="1345" font-size="20">35 V</text>
<path d="M150 1120V1390" stroke="#20334a" stroke-width="2"/><text x="116" y="1410" font-size="17">0</text>
<text x="40" y="1455" font-size="18">La media fra prove non unisce i loro intervalli temporali.</text>
</g></svg>
