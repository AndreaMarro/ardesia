<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1310" role="img" aria-labelledby="title desc">
<title id="title">Due dispersioni fra le stesse temperature</title>
<desc id="desc">Sostegno e superficie convettiva collegano in parallelo un corpo caldo al medesimo ambiente. Con differenza dieci kelvin e conduttanze cinque watt per kelvin ciascuna, i due rami cedono cinquanta watt ciascuno e il totale è cento watt. Un successivo confronto ha potenze cento e trecento watt, media duecento.</desc>
<defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1310" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Stessi estremi, percorsi diversi</text>
<text x="32" y="83" font-size="18">Prova A: differenza comune ΔT = 10 K.</text>
<rect x="45" y="130" width="150" height="200" rx="10" fill="#fce6dc" stroke="#b45328"/>
<rect x="445" y="130" width="150" height="200" rx="10" fill="#e4f3fa" stroke="#165a87"/>
<text x="76" y="218">Corpo</text><text x="76" y="254">caldo</text><text x="472" y="218">Stesso</text><text x="461" y="254">ambiente</text>
<path d="M213 170H427" stroke="#b45328" stroke-width="4" marker-end="url(#flow)"/>
<path d="M213 276H427" stroke="#b45328" stroke-width="4" marker-end="url(#flow)"/>
<text x="219" y="147" font-size="18">Sostegno: G = 5 W/K</text><text x="271" y="202">50 W</text>
<text x="222" y="251" font-size="18">Superficie: hA = 5 W/K</text><text x="271" y="310">50 W</text>
<text x="32" y="375" font-size="18">Schema dei collegamenti; frecce senza scala metrica.</text>
<path d="M32 407H608" stroke="#9babbc"/>
<text x="32" y="452" font-size="25" font-weight="bold">2 · Si sommano le potenze dei rami</text>
<text x="32" y="491" font-size="18">Contributi della prova A, tutti in W.</text>
<path d="M145 520V773" stroke="#14243a" stroke-width="2"/>
<rect x="145" y="544" width="175" height="34" fill="#b45328"/>
<rect x="145" y="617" width="175" height="34" fill="#165a87"/>
<rect x="145" y="690" width="175" height="34" fill="#b45328"/><rect x="320" y="690" width="175" height="34" fill="#165a87"/>
<text x="32" y="570">Sostegno</text><text x="339" y="570">50 W</text>
<text x="32" y="643">Convezione</text><text x="339" y="643">50 W</text>
<text x="32" y="716">Totale</text><text x="514" y="716">100 W</text>
<text x="120" y="767">0</text>
<text x="32" y="815" font-size="18">Conduttanza totale: 5 + 5 = 10 W/K.</text>
<path d="M32 847H608" stroke="#9babbc"/>
<text x="32" y="892" font-size="25" font-weight="bold">3 · Due prove e la loro media</text>
<text x="32" y="931" font-size="18">B: ΔT = 20 K, h = 10 W/(m²·K); G resta fisso.</text>
<path d="M145 957V1208" stroke="#14243a" stroke-width="2"/>
<rect x="145" y="979" width="120" height="34" fill="#165a87"/>
<rect x="145" y="1052" width="360" height="34" fill="#b45328"/>
<rect x="145" y="1125" width="240" height="34" fill="#28664d"/>
<text x="50" y="1005">A</text><text x="284" y="1005">100 W</text>
<text x="50" y="1078">B</text><text x="524" y="1078">300 W</text>
<text x="32" y="1151">Media</text><text x="404" y="1151">200 W</text>
<text x="120" y="1202">0</text>
<text x="32" y="1249" font-size="18">Media delle uscite: (100 + 300)/2 = 200 W.</text>
<text x="32" y="1281" font-size="18">In ogni pannello le barre hanno un’origine comune.</text>
</g></svg>
