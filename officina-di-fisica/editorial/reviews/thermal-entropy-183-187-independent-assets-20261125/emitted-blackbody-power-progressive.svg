<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1310" role="img" aria-labelledby="title desc">
<title id="title">La quarta potenza riguarda la temperatura assoluta</title>
<desc id="desc">Una superficie nera schematica di cinque centimetri quadrati a duecento kelvin emette quarantotto milliwatt nel modello assegnato. Ad area fissa le temperature normalizzate uno, due e tre producono tre, quarantotto e duecentoquarantatré milliwatt. Un altro confronto fra prove con aree diverse dà quarantotto e quattrocentottantasei milliwatt e media duecentosessantasette.</desc>
<defs><marker id="emission" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1310" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Emissione alla temperatura assoluta</text>
<text x="32" y="83" font-size="18">σ* assegnata: 6 × 10⁻⁸ W/(m²·K⁴)</text>
<rect x="80" y="125" width="160" height="140" rx="8" fill="#14243a"/>
<text x="98" y="163" fill="white">Superficie nera</text><text x="98" y="205" fill="white">A = 5 cm²</text><text x="98" y="242" fill="white">T = 200 K</text>
<path d="M258 160H458" stroke="#b45328" stroke-width="4" marker-end="url(#emission)"/>
<path d="M258 226H458" stroke="#b45328" stroke-width="4" marker-end="url(#emission)"/>
<text x="315" y="198">P_em = 48 mW</text>
<text x="32" y="306" font-size="18">Superficie e frecce schematiche, senza scala metrica.</text>
<text x="32" y="338" font-size="18">È la potenza emessa, prima di sottrarre assorbimenti.</text>
<path d="M32 371H608" stroke="#9babbc"/>
<text x="32" y="416" font-size="25" font-weight="bold">2 · Stessa area, tre temperature</text>
<text x="32" y="455" font-size="18">A = 5 cm²; θ = T/(100 K). Potenze in mW.</text>
<path d="M130 485V742" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="511" width="4.5" height="34" fill="#165a87"/>
<rect x="130" y="584" width="72" height="34" fill="#165a87"/>
<rect x="130" y="657" width="364.5" height="34" fill="#165a87"/>
<text x="43" y="537">θ = 1</text><text x="154" y="537">3 mW</text>
<text x="43" y="610">θ = 2</text><text x="221" y="610">48 mW</text>
<text x="43" y="683">θ = 3</text><text x="511" y="683">243 mW</text>
<text x="105" y="737">0</text>
<text x="32" y="782" font-size="18">Rapporto delle potenze: 1 : 16 : 81.</text>
<text x="32" y="814" font-size="18">Le barre rappresentano emissioni, non temperature.</text>
<path d="M32 847H608" stroke="#9babbc"/>
<text x="32" y="891" font-size="25" font-weight="bold">3 · Un altro confronto: cambia anche A</text>
<text x="32" y="930" font-size="18">A: θ = 2, area 5 cm²; B: θ = 3, area 10 cm².</text>
<path d="M130 956V1207" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="978" width="36" height="34" fill="#165a87"/>
<rect x="130" y="1051" width="364.5" height="34" fill="#b45328"/>
<rect x="130" y="1124" width="200.25" height="34" fill="#28664d"/>
<text x="50" y="1004">A</text><text x="184" y="1004">48 mW</text>
<text x="50" y="1077">B</text><text x="511" y="1077">486 mW</text>
<text x="32" y="1150">Media</text><text x="349" y="1150">267 mW</text>
<text x="105" y="1201">0</text>
<text x="32" y="1248" font-size="18">Media delle uscite: (48 + 486)/2 = 267 mW.</text>
<text x="32" y="1280" font-size="18">Potenze totali dalla stessa origine, in ciascun pannello.</text>
</g></svg>
