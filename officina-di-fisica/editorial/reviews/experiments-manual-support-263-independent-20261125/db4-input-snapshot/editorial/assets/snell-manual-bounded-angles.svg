<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1140" viewBox="0 0 640 1140" role="img" aria-labelledby="title description"><title id="title">Rifrazione verso la normale</title><desc id="description">La superficie è orizzontale, la normale verticale tratteggiata. Raggi incidenti0,30,45gradi, rifratti0,arcsin(1/3),arcsin(√2/3); stime19,5e28,1gradi esplicitamente approssimate.</desc><rect x="0" y="0" width="640" height="1140" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="24" y="45" font-size="30" fill="#172033" text-anchor="start" font-family="sans-serif">Rifrazione verso la normale</text><g transform="translate(0 90)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">1. Incidenza normale</text><rect x="45" y="165" width="550" height="105" fill="#dbeafe" stroke="#93a8c4" stroke-width="2"/><line x1="45" y1="165" x2="595" y2="165" stroke="#172033" stroke-width="2"/><line x1="325" y1="60" x2="325" y2="157" stroke="#9a3412" stroke-width="4"/><polygon points="325,165 319,151 331,151" fill="#9a3412"/><line x1="325" y1="165" x2="325" y2="252" stroke="#1d4ed8" stroke-width="4"/><polygon points="325,260 319,246 331,246" fill="#1d4ed8"/><line x1="325" y1="50" x2="325" y2="285" stroke="#172033" stroke-width="2" stroke-dasharray="8 6"/><text x="60" y="95" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">aria n₁ = 1</text><text x="60" y="250" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">vetro n₂ = 3/2</text><text x="390" y="95" font-size="23" fill="#172033" text-anchor="start" font-family="sans-serif">normale</text><text x="55" y="309" font-size="25" fill="#172033" text-anchor="start" font-family="sans-serif">θ₁ = 0°; θ₂ = 0°</text></g><g transform="translate(0 430)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">2. Incidenza di 30°</text><rect x="45" y="165" width="550" height="105" fill="#dbeafe" stroke="#93a8c4" stroke-width="2"/><line x1="45" y1="165" x2="595" y2="165" stroke="#172033" stroke-width="2"/><line x1="272.5" y1="74.0673" x2="321" y2="158.072" stroke="#9a3412" stroke-width="4"/><polygon points="325,165 312.804,155.876 323.196,149.876" fill="#9a3412"/><line x1="325" y1="165" x2="354" y2="247.024" stroke="#1d4ed8" stroke-width="4"/><polygon points="356.667,254.567 346.343,243.368 357.657,239.368" fill="#1d4ed8"/><line x1="325" y1="50" x2="325" y2="285" stroke="#172033" stroke-width="2" stroke-dasharray="8 6"/><text x="60" y="95" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">aria n₁ = 1</text><text x="60" y="250" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">vetro n₂ = 3/2</text><text x="390" y="95" font-size="23" fill="#172033" text-anchor="start" font-family="sans-serif">normale</text><text x="55" y="309" font-size="25" fill="#172033" text-anchor="start" font-family="sans-serif">θ₁ = 30°; θ₂ ≈ 19,5°</text></g><g transform="translate(0 770)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">3. Incidenza di 45°</text><rect x="45" y="165" width="550" height="105" fill="#dbeafe" stroke="#93a8c4" stroke-width="2"/><line x1="45" y1="165" x2="595" y2="165" stroke="#172033" stroke-width="2"/><line x1="250.754" y1="90.7538" x2="319.343" y2="159.343" stroke="#9a3412" stroke-width="4"/><polygon points="325,165 310.858,159.343 319.343,150.858" fill="#9a3412"/><line x1="325" y1="165" x2="366.012" y2="241.727" stroke="#1d4ed8" stroke-width="4"/><polygon points="369.783,248.782 357.892,239.264 368.475,233.607" fill="#1d4ed8"/><line x1="325" y1="50" x2="325" y2="285" stroke="#172033" stroke-width="2" stroke-dasharray="8 6"/><text x="60" y="95" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">aria n₁ = 1</text><text x="60" y="250" font-size="24" fill="#172033" text-anchor="start" font-family="sans-serif">vetro n₂ = 3/2</text><text x="390" y="95" font-size="23" fill="#172033" text-anchor="start" font-family="sans-serif">normale</text><text x="55" y="309" font-size="25" fill="#172033" text-anchor="start" font-family="sans-serif">θ₁ = 45°; θ₂ ≈ 28,1°</text></g></svg>
