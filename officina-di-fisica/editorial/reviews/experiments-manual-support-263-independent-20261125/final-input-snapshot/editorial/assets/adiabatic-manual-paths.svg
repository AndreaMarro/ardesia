<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1140" viewBox="0 0 640 1140" role="img" aria-labelledby="title description"><title id="title">Espansione adiabatica</title><desc id="description">Sezione costante: la larghezza del gas è proporzionale al volume. Stesso gas, γ=3/2; tre stati a V/V0=1,9/4,4, con pressioni100,800/27,25/2 kPa.</desc><rect x="0" y="0" width="640" height="1140" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="24" y="45" font-size="30" fill="#172033" text-anchor="start" font-family="sans-serif">Espansione adiabatica</text><g transform="translate(0 90)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">1. Stato iniziale</text><rect x="80" y="105" width="90" height="100" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="170" y="99" width="12" height="112" fill="#d1d5db" stroke="#172033" stroke-width="2"/><text x="80" y="85" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">V/V₀ = 1</text><text x="52" y="250" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">p = 100 kPa</text><text x="52" y="292" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">T/T₀ = 1</text></g><g transform="translate(0 430)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">2. Radice e poi cubo</text><rect x="80" y="105" width="202.5" height="100" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="282.5" y="99" width="12" height="112" fill="#d1d5db" stroke="#172033" stroke-width="2"/><text x="80" y="85" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">V/V₀ = 9/4</text><text x="52" y="250" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">p = 800/27 kPa</text><text x="52" y="292" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">T/T₀ = 2/3</text></g><g transform="translate(0 770)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">3. Volume quadruplicato</text><rect x="80" y="105" width="360" height="100" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="440" y="99" width="12" height="112" fill="#d1d5db" stroke="#172033" stroke-width="2"/><text x="80" y="85" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">V/V₀ = 4</text><text x="52" y="250" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">p = 25/2 kPa</text><text x="52" y="292" font-size="26" fill="#172033" text-anchor="start" font-family="sans-serif">T/T₀ = 1/2</text></g></svg>
