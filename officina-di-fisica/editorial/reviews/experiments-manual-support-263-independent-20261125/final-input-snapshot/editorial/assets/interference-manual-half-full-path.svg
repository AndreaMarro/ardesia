<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1140" viewBox="0 0 640 1140" role="img" aria-labelledby="title description"><title id="title">Sovrapposizione alla sonda</title><desc id="description">I pannelli scelgono l’istante in cui y1=+2cm; y2 è+2,-2,+2cm per differenze di cammino0,1/2,1onda. Barre: spostamenti con segno; ampiezze della somma4,0,4cm.</desc><rect x="0" y="0" width="640" height="1140" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="24" y="45" font-size="30" fill="#172033" text-anchor="start" font-family="sans-serif">Sovrapposizione alla sonda</text><g transform="translate(0 90)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">1. Arrivo in fase</text><line x1="70" y1="190" x2="570" y2="190" stroke="#172033" stroke-width="2"/><text x="72" y="95" font-size="22" fill="#172033" text-anchor="start" font-family="sans-serif">cm</text><rect x="118" y="130" width="44" height="60" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="140" y="120" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">+2</text><text x="140" y="277" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">y₁</text><rect x="278" y="130" width="44" height="60" fill="#9a3412" stroke="#9a3412" stroke-width="2"/><text x="300" y="120" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">+2</text><text x="300" y="277" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">y₂</text><rect x="448" y="70" width="44" height="120" fill="#047857" stroke="#047857" stroke-width="2"/><text x="470" y="60" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">+4</text><text x="470" y="277" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">somma</text><text x="50" y="310" font-size="23" fill="#172033" text-anchor="start" font-family="sans-serif">Δs/λ = 0; ampiezza = 4 cm</text></g><g transform="translate(0 430)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">2. Opposizione di fase</text><line x1="70" y1="190" x2="570" y2="190" stroke="#172033" stroke-width="2"/><text x="72" y="95" font-size="22" fill="#172033" text-anchor="start" font-family="sans-serif">cm</text><rect x="118" y="130" width="44" height="60" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="140" y="120" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">+2</text><text x="140" y="277" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">y₁</text><rect x="278" y="190" width="44" height="60" fill="#9a3412" stroke="#9a3412" stroke-width="2"/><text x="300" y="180" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">-2</text><text x="300" y="277" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">y₂</text><line x1="448" y1="190" x2="492" y2="190" stroke="#047857" stroke-width="5"/><text x="470" y="180" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">0</text><text x="470" y="277" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">somma</text><text x="50" y="310" font-size="23" fill="#172033" text-anchor="start" font-family="sans-serif">Δs/λ = 1/2; ampiezza = 0 cm</text></g><g transform="translate(0 770)"><rect x="20" y="0" width="600" height="320" fill="#ffffff" stroke="#a6afbd" stroke-width="2"/><text x="42" y="38" font-size="28" fill="#172033" text-anchor="start" font-family="sans-serif">3. Un ciclo di ritardo</text><line x1="70" y1="190" x2="570" y2="190" stroke="#172033" stroke-width="2"/><text x="72" y="95" font-size="22" fill="#172033" text-anchor="start" font-family="sans-serif">cm</text><rect x="118" y="130" width="44" height="60" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="140" y="120" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">+2</text><text x="140" y="277" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">y₁</text><rect x="278" y="130" width="44" height="60" fill="#9a3412" stroke="#9a3412" stroke-width="2"/><text x="300" y="120" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">+2</text><text x="300" y="277" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">y₂</text><rect x="448" y="70" width="44" height="120" fill="#047857" stroke="#047857" stroke-width="2"/><text x="470" y="60" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">+4</text><text x="470" y="277" font-size="24" fill="#172033" text-anchor="middle" font-family="sans-serif">somma</text><text x="50" y="310" font-size="23" fill="#172033" text-anchor="start" font-family="sans-serif">Δs/λ = 1; ampiezza = 4 cm</text></g></svg>
