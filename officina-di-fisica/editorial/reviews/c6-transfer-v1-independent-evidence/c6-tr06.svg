<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 216" role="img" aria-labelledby="title desc"><title id="title">Il fondo nel confronto fra due sorgenti sonore</title><desc id="desc">Due barre di intensità contengono lo stesso tratto di fondo. Tolto quel tratto, la seconda parte utile è quattro volte la prima. Il confronto delle ampiezze richiede la radice del rapporto.</desc><rect x="0" y="0" width="460" height="216" rx="9" fill="#faf8ee"/><g fill="#172644" stroke="#172644" stroke-width="2" font-family="sans-serif" font-size="17"><text x="25" y="27" stroke="none">Sottrai il fondo in entrambe le prove</text><text x="25" y="91" stroke="none">Prima</text><text x="25" y="156" stroke="none">Seconda</text><rect x="110" y="64" width="50" height="40" fill="#d5a66d"/><rect x="160" y="64" width="50" height="40" fill="#bddded"/><rect x="110" y="129" width="50" height="40" fill="#d5a66d"/><rect x="160" y="129" width="200" height="40" fill="#bddded"/><text x="104" y="200" stroke="none">fondo</text><text x="184" y="200" stroke="none">segnale utile</text></g></svg>
