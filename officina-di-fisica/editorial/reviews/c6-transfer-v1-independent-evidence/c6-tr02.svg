<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 216" role="img" aria-labelledby="title desc"><title id="title">La stessa potenza su una faccia più piccola</title><desc id="desc">Due facce affiancate con uguale freccia di potenza. La prima ha larghezza doppia della seconda. L’area più piccola riceve il doppio della potenza per metro quadrato.</desc><rect x="0" y="0" width="460" height="216" rx="9" fill="#faf8ee"/><g fill="#172644" stroke="#172644" stroke-width="2" font-family="sans-serif" font-size="17"><text x="25" y="28" stroke="none">Potenza fissata in entrambe le prove</text><path d="M25 79 L128 79" fill="none" /><path d="M120 74 L128 79 L120 84" fill="none"/><path d="M25 163 L128 163" fill="none" /><path d="M120 158 L128 163 L120 168" fill="none"/><rect x="151" y="62" width="146" height="36" fill="#bddded"/><rect x="151" y="146" width="73" height="36" fill="#bddded"/><text x="314" y="86" stroke="none">600 cm²</text><text x="244" y="171" stroke="none">300 cm²</text></g></svg>
