<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 216" role="img" aria-labelledby="title desc"><title id="title">Due strati uguali in serie</title><desc id="desc">Tre misure sullo stesso fascio: intensità iniziale, quella dopo il primo filtro e quella dopo il secondo. A ciascuna interfaccia si moltiplica per T.</desc><rect x="0" y="0" width="460" height="216" rx="9" fill="#faf8ee"/><g fill="#172644" stroke="#172644" stroke-width="2" font-family="sans-serif" font-size="17"><text x="25" y="28" stroke="none">Applica T al fascio che arriva</text><path d="M31 110 L140 110" fill="none" /><path d="M132 105 L140 110 L132 115" fill="none"/><path d="M160 110 L284 110" fill="none" /><path d="M276 105 L284 110 L276 115" fill="none"/><path d="M304 110 L422 110" fill="none" /><path d="M414 105 L422 110 L414 115" fill="none"/><rect x="145" y="60" width="10" height="94" fill="#734e81"/><rect x="290" y="60" width="10" height="94" fill="#734e81"/><text x="56" y="145" stroke="none">I₀</text><text x="191" y="145" stroke="none">T I₀</text><text x="347" y="145" stroke="none">T² I₀</text></g></svg>
