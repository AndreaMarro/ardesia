<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 216" role="img" aria-labelledby="title desc"><title id="title">Quanto rimane nell’accumulatore</title><desc id="desc">Una freccia da 12 J al secondo entra nel contorno dell’accumulatore e una da 3 J al secondo ne esce. Il contorno delimita l’energia da contabilizzare.</desc><rect x="0" y="0" width="460" height="216" rx="9" fill="#faf8ee"/><g fill="#172644" stroke="#172644" stroke-width="2" font-family="sans-serif" font-size="17"><text x="25" y="28" stroke="none">Bilancio per un secondo</text><rect x="150" y="68" width="154" height="72" fill="#bddded"/><path d="M30 104 L150 104" fill="none" /><path d="M142 99 L150 104 L142 109" fill="none"/><path d="M304 104 L418 104" fill="none" /><path d="M410 99 L418 104 L410 109" fill="none"/><text x="25" y="85" stroke="none">12 J entrano</text><text x="315" y="85" stroke="none">3 J escono</text><text x="159" y="110" stroke="none">accumulatore</text><text x="150" y="181" stroke="none">Saldo: +9 J</text></g></svg>
