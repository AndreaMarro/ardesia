<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><title id="title">Campo di un filo percorso da corrente</title><desc id="desc">La corrente esce dal foglio. La circonferenza di campo è antioraria; nel punto P a destra del filo B è verso l’alto.</desc><defs><marker id="a123c39" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#123c39"/></marker><marker id="aac3825" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#ac3825"/></marker><marker id="a16736b" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#16736b"/></marker><marker id="a7d8981" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#7d8981"/></marker></defs><rect x="0" y="0" width="640" height="250" rx="0" fill="#faf7ee" stroke="none" stroke-width="0"/><circle cx="291" cy="119" r="79" fill="none" stroke="#16736b" stroke-width="2.5"/><circle cx="291" cy="119" r="17" fill="#faf7ee" stroke="#123c39" stroke-width="2"/><circle cx="291" cy="119" r="5" fill="#123c39" stroke="none" stroke-width="2"/><circle cx="370" cy="119" r="4" fill="#123c39" stroke="none" stroke-width="2"/><line x1="370" y1="117" x2="370" y2="50" stroke="#16736b" stroke-width="3" marker-end="url(#a16736b)"/><text x="391" y="67" font-size="20" text-anchor="middle" fill="#16736b" font-weight="500">B</text><text x="394" y="130" font-size="17" text-anchor="middle" fill="#123c39" font-weight="500">P</text><text x="162" y="166" font-size="17" text-anchor="middle" fill="#123c39" font-weight="500">I uscente</text><text x="320" y="231" font-size="15" text-anchor="middle" fill="#123c39" font-weight="500">Il punto indica la punta di una freccia verso chi guarda.</text></svg>
