<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="title desc">
<title id="title">Due resistori in parallelo e resistenza equivalente</title>
<desc id="desc">Due rami condividono il nodo iniziale e il nodo finale. Nel primo ramo resistenza 12 ohm, nel secondo resistenza sconosciuta Rx. L'equivalente è 4 ohm, da cui Rx è 6 ohm.</desc>
<rect width="800" height="310" fill="#f8f5ea"/>
<g font-family="Arial,sans-serif" fill="#221c30">
<text x="32" y="40" font-size="22" font-weight="700">Nel parallelo i resistori condividono i due nodi</text>
<path d="M120 144H240V96H340M460 96H560V144H680M240 144V211H340M460 211H560V144" fill="none" stroke="#221c30" stroke-width="5"/>
<rect x="340" y="75" width="120" height="42" rx="4" fill="#e4dcfa" stroke="#5936ae" stroke-width="4"/>
<rect x="340" y="190" width="120" height="42" rx="4" fill="#eef3ce" stroke="#221c30" stroke-width="4"/>
<text x="400" y="103" text-anchor="middle" font-size="23" font-weight="700">12 Ω</text>
<text x="400" y="218" text-anchor="middle" font-size="23" font-weight="700">Rₓ = ?</text>
<circle cx="240" cy="144" r="7" fill="#95354b"/><circle cx="560" cy="144" r="7" fill="#95354b"/>
<text x="120" y="168" font-size="19" text-anchor="middle">A</text><text x="680" y="168" font-size="19" text-anchor="middle">B</text>
<text x="400" y="276" text-anchor="middle" font-size="22" font-weight="700">1 / R eq = 1 / 12 + 1 / Rₓ</text>
<text x="400" y="303" text-anchor="middle" font-size="18">R eq = 4 Ω → 1 / Rₓ = 1 / 6 Ω → Rₓ = 6 Ω</text>
</g></svg>