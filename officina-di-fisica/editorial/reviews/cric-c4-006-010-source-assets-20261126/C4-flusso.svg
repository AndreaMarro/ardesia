<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><title id="title">Angolo fra B e normale alla spira</title><desc id="desc">La spira piana è vista di taglio come una linea orizzontale; la normale è verticale, e θ è compreso fra B e la normale.</desc><defs><marker id="a123c39" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#123c39"/></marker><marker id="aac3825" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#ac3825"/></marker><marker id="a16736b" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#16736b"/></marker><marker id="a7d8981" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#7d8981"/></marker></defs><rect x="0" y="0" width="640" height="250" rx="0" fill="#faf7ee" stroke="none" stroke-width="0"/><text x="320" y="30" font-size="19" text-anchor="middle" fill="#123c39" font-weight="700">La spira vista di taglio</text><line x1="124" y1="172" x2="495" y2="172" stroke="#123c39" stroke-width="4"/><text x="474" y="199" font-size="17" text-anchor="middle" fill="#123c39" font-weight="500">piano</text><line x1="278" y1="171" x2="278" y2="54" stroke="#123c39" stroke-width="2.5" marker-end="url(#a123c39)"/><text x="260" y="60" font-size="17" text-anchor="middle" fill="#123c39" font-weight="500">n</text><line x1="278" y1="172" x2="396" y2="75" stroke="#16736b" stroke-width="3" marker-end="url(#a16736b)"/><text x="413" y="78" font-size="20" text-anchor="middle" fill="#16736b" font-weight="500">B</text><path d="M278 122 A50 50 0 0 1 317 140" fill="none" stroke="#ac3825" stroke-width="2"/><text x="303" y="114" font-size="21" text-anchor="middle" fill="#ac3825" font-weight="500">θ</text><text x="320" y="230" font-size="19" text-anchor="middle" fill="#123c39" font-weight="500">Φ = BA cos θ</text></svg>
