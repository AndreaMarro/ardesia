<svg xmlns="http://www.w3.org/2000/svg" width="368" height="214" viewBox="0 0 368 214" role="img" aria-labelledby="titolo descrizione" font-family="Arial, Helvetica, sans-serif">
  <title id="titolo">La componente del campo perpendicolare alla spira</title>
  <desc id="descrizione">La spira vista di taglio è orizzontale. Dal suo centro la normale punta verso l’alto, mentre B forma con essa 60 gradi. La proiezione della punta di B sulla normale indica Bₙ, metà del campo.</desc>
  <rect width="368" height="214" fill="#faf7ee"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M29 163 H337" stroke="#323c38" stroke-width="4"/>
    <path d="M109 163 V31" stroke="#323c38" stroke-width="2"/>
    <path d="M104 39 L109 29 L114 39" stroke="#323c38" stroke-width="2"/>
    <path d="M109 163 L232 92" stroke="#086461" stroke-width="4"/>
    <path d="M221 93 L232 92 L226 102" stroke="#086461" stroke-width="3"/>
    <path d="M109 92 H232" stroke="#526962" stroke-width="1.8" stroke-dasharray="4 4"/>
    <path d="M109 163 V92 M104 96 L109 90 L114 96" stroke="#95422b" stroke-width="4"/>
    <path d="M109 121 A42 42 0 0 1 145.37 142" stroke="#323c38" stroke-width="1.8"/>
    <path d="M109 152 H120 V163" stroke="#323c38" stroke-width="1.5"/>
  </g>
  <circle cx="109" cy="163" r="3.2" fill="#323c38"/>
  <g font-size="16" fill="#24312d">
    <text x="109" y="19" text-anchor="middle">normale</text>
    <text x="242" y="91" fill="#075955" font-weight="bold">B</text>
    <text x="96" y="111" text-anchor="end" fill="#843820" font-weight="bold">Bₙ</text>
    <text x="135" y="130">60°</text>
    <text x="179" y="190" text-anchor="middle">piano della spira visto di taglio</text>
  </g>
</svg>
