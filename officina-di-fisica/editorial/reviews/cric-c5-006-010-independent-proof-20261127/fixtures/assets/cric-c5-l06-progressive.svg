<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif" font-size="21" fill="#272536">
<title id="title">Lunghezza d’onda, intensità e tempo di ritorno</title><desc id="desc">Tre problemi distinti. Profilo schematico con una lunghezza d’onda di due metri. Confronti di ampiezza uno a tre e di intensità uno a nove, con scale distinte. Andata e ritorno della luce fra rivelatore e specchio fermi: due tratti da un metro e ottanta centimetri in dodici nanosecondi complessivi.</desc>
<defs><marker id="g" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#147c76"/></marker><marker id="v" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#6852a3"/></marker></defs><rect width="640" height="1540" fill="#fffdf7"/>
<text x="40" y="55" font-size="25" font-weight="bold">1 · Una ripetizione nello spazio</text><text x="40" y="108">Nel vuoto: f = 150 MHz ; c = 3×10⁸ m/s</text>
<path d="M65 255H470M80 345V160" fill="none" stroke="#999"/><path d="M80 255C109 214 131 190 160 190C189 190 211 214 240 255C269 296 291 320 320 320C349 320 371 296 400 255" fill="none" stroke="#147c76" stroke-width="3"/>
<text x="485" y="263">x</text><text x="40" y="155">E</text><path d="M80 350V375H400V350" fill="none" stroke="#888"/><text x="240" y="420" text-anchor="middle">λ₀ = 2 m</text><path d="M40 465H600" stroke="#cbc6bc"/>
<text x="40" y="520" font-size="25" font-weight="bold">2 · Ampiezza e intensità sono diverse</text><text x="40" y="565" font-size="18">Stessa onda piana nel vuoto; ampiezza iniziale positiva.</text>
<path d="M110 730H490" stroke="#999"/><path d="M160 730V690" stroke="#6852a3" stroke-width="3" marker-end="url(#v)"/><path d="M420 730V610" stroke="#6852a3" stroke-width="3" marker-end="url(#v)"/>
<text x="160" y="770" text-anchor="middle">E₀</text><text x="420" y="770" text-anchor="middle">3E₀</text>
<rect x="140" y="830" width="40" height="35" fill="#147c76"/><rect x="140" y="900" width="360" height="35" fill="#147c76"/><text x="65" y="856">Iᵢ</text><text x="65" y="926">9Iᵢ</text><text x="40" y="985" font-size="18">Scale distinte per ampiezza e intensità.</text><path d="M40 1020H600" stroke="#cbc6bc"/>
<text x="40" y="1080" font-size="25" font-weight="bold">3 · Due tratti nello stesso intervallo</text><text x="40" y="1130">Tempo totale: 12 ns</text>
<rect x="60" y="1170" width="80" height="170" fill="#eee9da" stroke="#888"/><path d="M520 1170V1340" stroke="#888" stroke-width="5"/><path d="M140 1210H520" stroke="#147c76" stroke-width="3" marker-end="url(#g)"/><path d="M520 1300H140" stroke="#6852a3" stroke-width="3" marker-end="url(#v)"/>
<text x="260" y="1190">andata</text><text x="260" y="1335">ritorno</text><text x="40" y="1390" font-size="18">Rivelatore fermo</text><text x="460" y="1390" font-size="18">Specchio fermo</text>
<path d="M140 1410V1430H520V1410" fill="none" stroke="#888"/><text x="330" y="1470" text-anchor="middle">d = 1,8 m</text>
</svg>
