<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1490" role="img" aria-labelledby="title desc"><title id="title">Tre letture idrostatiche</title><desc id="desc">Profilo triangolare della sovrapressione sullo sportello da zero a duemila pascal; proiezione verticale di un tratto lungo mezzo metro a trenta gradi; incremento di pressione 4,5 kilopascal in mezzo metro di profondità.</desc><rect width="640" height="1490" fill="#faf7ef"/><g font-family="Arial,sans-serif" font-size="22" fill="#252438">
