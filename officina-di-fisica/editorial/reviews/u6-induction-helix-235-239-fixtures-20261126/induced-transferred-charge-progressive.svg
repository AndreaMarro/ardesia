<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1720" viewBox="0 0 640 1720" role="img" aria-labelledby="title desc">
<title id="title">La carica trasferita dipende dal flusso totale</title><desc id="desc">Con resistenza due ohm, due crescite lineari dello stesso flusso di sei milliweber durano uno o due secondi. Rettangoli corrente-tempo di tre milliampere per un secondo e tre mezzi milliampere per due secondi hanno uguale carica tre millicoulomb. Ultime barre per prove diverse: tre e quattro millicoulomb e media sette mezzi.</desc>
<rect width="640" height="1720" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#20334a">
<text x="36" y="42" font-size="24" font-weight="700">1. Stessa variazione, durate diverse</text>
<text x="40" y="84" font-size="18">Due esempi lineari, entrambi con R = 2 Ω.</text>
<path d="M130 570V180M115 550H555" fill="none" stroke="#20334a" stroke-width="2"/>
<text x="40" y="188" font-size="18">Φ (mWb)</text><text x="505" y="620" font-size="18">t (s)</text>
<text x="97" y="578" font-size="17">0</text><text x="97" y="256" font-size="17">6</text>
<path d="M130 250H120M310 550V562M490 550V562" stroke="#20334a" stroke-width="2"/>
<text x="305" y="590" font-size="17">1</text><text x="485" y="590" font-size="17">2</text>
<path d="M130 550L310 250" fill="none" stroke="#2773ae" stroke-width="4"/><path d="M130 550L490 250" fill="none" stroke="#9b436f" stroke-width="4"/>
<circle cx="310" cy="250" r="6" fill="#2773ae"/><circle cx="490" cy="250" r="6" fill="#9b436f"/>
<text x="260" y="215" font-size="18" fill="#2773ae">1 s</text><text x="485" y="215" font-size="18" fill="#9b436f">2 s</text>
<text x="40" y="665" font-size="18">Il flusso totale cambia di 6 mWb in entrambi i casi.</text>
<text x="36" y="725" font-size="24" font-weight="700">2. Le aree I-tempo sono uguali</text>
<text x="40" y="767" font-size="17">Correnti costanti negli esempi, non ipotesi generale.</text>
<text x="100" y="840" font-size="19" fill="#2773ae">3 mA per 1 s</text><text x="350" y="840" font-size="19" fill="#9b436f">3/2 mA per 2 s</text>
<text x="45" y="930" font-size="17">I (mA)</text><text x="365" y="930" font-size="17">I (mA)</text>
<path d="M100 1115V945M85 1100H250" fill="none" stroke="#20334a" stroke-width="2"/><path d="M350 1115V945M335 1100H610" fill="none" stroke="#20334a" stroke-width="2"/>
<rect x="100" y="980" width="120" height="120" fill="#2773ae" fill-opacity="0.7"/><rect x="350" y="1040" width="240" height="60" fill="#9b436f" fill-opacity="0.7"/>
<text x="70" y="986" font-size="17">3</text><text x="285" y="1046" font-size="17">3/2</text><text x="70" y="1137" font-size="17">0</text><text x="320" y="1137" font-size="17">0</text>
<text x="215" y="1137" font-size="17">1</text><text x="585" y="1137" font-size="17">2</text>
<text x="165" y="1175" font-size="17">t (s)</text><text x="500" y="1175" font-size="17">t (s)</text>
<text x="40" y="1225" font-size="19">3 mA · 1 s = (3/2 mA) · 2 s = 3 mC.</text>
<text x="36" y="1290" font-size="24" font-weight="700">3. Due altre prove e la loro media</text>
<text x="40" y="1330" font-size="17">A: 6 mWb, 2 Ω; B: 12 mWb, 3 Ω.</text>
<text x="55" y="1410" font-size="20">A</text><rect x="150" y="1380" width="240" height="44" fill="#2773ae"/><text x="405" y="1410" font-size="20">3 mC</text>
<text x="55" y="1495" font-size="20">B</text><rect x="150" y="1465" width="320" height="44" fill="#9b436f"/><text x="485" y="1495" font-size="20">4 mC</text>
<text x="35" y="1580" font-size="20">media</text><rect x="150" y="1550" width="280" height="44" fill="#377f65"/><text x="445" y="1580" font-size="20">7/2 mC</text>
<path d="M150 1365V1620" stroke="#20334a" stroke-width="2"/><text x="116" y="1645" font-size="17">0</text>
<text x="40" y="1690" font-size="18">Le tre barre condividono origine e scala in mC.</text>
</g></svg>
