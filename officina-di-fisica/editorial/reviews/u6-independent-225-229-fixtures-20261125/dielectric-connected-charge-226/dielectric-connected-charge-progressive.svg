<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Tensione fissata, carica diversa</title><desc id="desc">Tre tappe: condensatore riempito con generatore collegato; barre delle cariche finali; retta carica contro capacità iniziale a costante relativa due.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#20354d" text-anchor="start">Tensione fissata, carica diversa</text><text x="32" y="92" font-size="22" fill="#20354d" text-anchor="start">1 · Il generatore resta nel circuito</text><text x="42" y="132" font-size="19" fill="#20354d" text-anchor="start">C₀ = 2 μF · κ = 2 · C = 4 μF</text><rect x="218" y="175" width="10" height="150" fill="#316b9b" rx="3"/><rect x="350" y="175" width="10" height="150" fill="#316b9b" rx="3"/><rect x="230" y="186" width="118" height="128" fill="#c9dfed" rx="3"/><text x="190" y="220" font-size="22" fill="#20354d" text-anchor="start">+</text><text x="375" y="220" font-size="22" fill="#20354d" text-anchor="start">−</text><line x1="218" y1="250" x2="100" y2="250" stroke="#52667a" stroke-width="2"/><line x1="100" y1="250" x2="100" y2="420" stroke="#52667a" stroke-width="2"/><line x1="100" y1="420" x2="280" y2="420" stroke="#52667a" stroke-width="2"/><line x1="360" y1="250" x2="540" y2="250" stroke="#52667a" stroke-width="2"/><line x1="540" y1="250" x2="540" y2="420" stroke="#52667a" stroke-width="2"/><line x1="540" y1="420" x2="320" y2="420" stroke="#52667a" stroke-width="2"/><line x1="280" y1="398" x2="280" y2="442" stroke="#52667a" stroke-width="2"/><line x1="320" y1="408" x2="320" y2="432" stroke="#52667a" stroke-width="2"/><text x="278" y="472" font-size="18" fill="#20354d" text-anchor="middle">+</text><text x="320" y="472" font-size="18" fill="#20354d" text-anchor="middle">−</text><text x="348" y="460" font-size="19" fill="#20354d" text-anchor="start">V_g = 2 V</text><text x="175" y="360" font-size="19" fill="#20354d" text-anchor="start">Q = 8 μC su una armatura</text><text x="32" y="535" font-size="22" fill="#20354d" text-anchor="start">2 · Moduli di carica e loro media</text><line x1="145" y1="555" x2="145" y2="810" stroke="#52667a" stroke-width="2"/><text x="125" y="602" font-size="19" fill="#20354d" text-anchor="end">A</text><rect x="150" y="585" width="320" height="27" fill="#316b9b" rx="3"/><text x="475" y="606" font-size="19" fill="#20354d" text-anchor="start">8 μC</text><text x="125" y="687" font-size="19" fill="#20354d" text-anchor="end">B</text><rect x="150" y="670" width="240" height="27" fill="#a76d20" rx="3"/><text x="395" y="691" font-size="19" fill="#20354d" text-anchor="start">6 μC</text><text x="125" y="772" font-size="19" fill="#20354d" text-anchor="end">media</text><rect x="150" y="755" width="280" height="27" fill="#488265" rx="3"/><text x="435" y="776" font-size="19" fill="#20354d" text-anchor="start">7 μC</text><text x="32" y="870" font-size="18" fill="#20354d" text-anchor="start">A: C₀ = 2 μF, κ = 2 · B: C₀ = 1 μF, κ = 3</text><text x="32" y="950" font-size="22" fill="#20354d" text-anchor="start">3 · Solo κ = 2 e V_g = 2 V</text><line x1="145" y1="1300" x2="520" y2="1300" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1305" x2="150" y2="1040" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1300" x2="470" y2="1140" stroke="#316b9b" stroke-width="2"/><text x="132" y="1324" font-size="18" fill="#20354d" text-anchor="end">0</text><text x="470" y="1330" font-size="18" fill="#20354d" text-anchor="middle">2</text><text x="128" y="1146" font-size="18" fill="#20354d" text-anchor="end">8</text><text x="525" y="1345" font-size="18" fill="#20354d" text-anchor="start">C₀ (μF)</text><text x="105" y="1025" font-size="18" fill="#20354d" text-anchor="start">Q (μC)</text><text x="32" y="1400" font-size="18" fill="#20354d" text-anchor="start">La retta riguarda C₀ variabile e κ fissato.</text></g></svg>
