<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Forza magnetica: modulo e direzione</title><desc id="desc">Tre tappe: velocità a destra, campo entrante e forza verso l’alto per carica positiva; barre dei moduli e loro media; retta del modulo contro rapidità a campo tre millitesla.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#20354d" text-anchor="start">Forza magnetica: modulo e direzione</text><text x="32" y="92" font-size="22" fill="#20354d" text-anchor="start">1 · Direzioni istantanee, q positiva</text><line x1="300" y1="300" x2="470" y2="300" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="300" x2="300" y2="160" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><circle cx="300" cy="300" r="12" fill="#316b9b"/><text x="300" y="306" font-size="19" fill="white" text-anchor="middle">+</text><text x="470" y="335" font-size="22" fill="#20354d" text-anchor="middle">v</text><text x="322" y="197" font-size="22" fill="#20354d" text-anchor="start">F_B</text><path d="M300 270H330V300" fill="none" stroke="#52667a" stroke-width="2"/><circle cx="150" cy="300" r="17" fill="none" stroke="#52667a" stroke-width="2"/><line x1="139" y1="289" x2="161" y2="311" stroke="#52667a" stroke-width="2"/><line x1="139" y1="311" x2="161" y2="289" stroke="#52667a" stroke-width="2"/><text x="65" y="395" font-size="19" fill="#20354d" text-anchor="start">B entrante nel foglio</text><text x="32" y="450" font-size="18" fill="#20354d" text-anchor="start">Frecce schematiche: v e F_B hanno unità diverse.</text><text x="32" y="485" font-size="18" fill="#20354d" text-anchor="start">Forza ortogonale a v: potenza magnetica nulla.</text><text x="32" y="550" font-size="22" fill="#20354d" text-anchor="start">2 · Moduli della forza e loro media</text><line x1="145" y1="570" x2="145" y2="825" stroke="#52667a" stroke-width="2"/><text x="125" y="617" font-size="19" fill="#20354d" text-anchor="end">A</text><rect x="150" y="600" width="300" height="27" fill="#316b9b" rx="3"/><text x="455" y="621" font-size="19" fill="#20354d" text-anchor="start">6 μN</text><text x="125" y="702" font-size="19" fill="#20354d" text-anchor="end">seconda</text><rect x="150" y="685" width="200" height="27" fill="#a76d20" rx="3"/><text x="355" y="706" font-size="19" fill="#20354d" text-anchor="start">4 μN</text><text x="125" y="787" font-size="19" fill="#20354d" text-anchor="end">media</text><rect x="150" y="770" width="250" height="27" fill="#488265" rx="3"/><text x="405" y="791" font-size="19" fill="#20354d" text-anchor="start">5 μN</text><text x="32" y="885" font-size="18" fill="#20354d" text-anchor="start">A: v = 2 km/s, B = 3 mT</text><text x="32" y="915" font-size="18" fill="#20354d" text-anchor="start">Seconda: v = 1 km/s, B = 4 mT</text><text x="32" y="985" font-size="22" fill="#20354d" text-anchor="start">3 · Solo B = 3 mT e q = 1 μC</text><line x1="145" y1="1310" x2="520" y2="1310" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1315" x2="150" y2="1060" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1310" x2="470" y2="1130" stroke="#316b9b" stroke-width="2"/><circle cx="150" cy="1310" r="4" fill="#f7fafc" stroke="#316b9b" stroke-width="2"/><text x="132" y="1334" font-size="18" fill="#20354d" text-anchor="end">0</text><text x="470" y="1340" font-size="18" fill="#20354d" text-anchor="middle">2</text><text x="128" y="1136" font-size="18" fill="#20354d" text-anchor="end">6</text><text x="510" y="1375" font-size="18" fill="#20354d" text-anchor="start">v (km/s)</text><text x="80" y="1045" font-size="18" fill="#20354d" text-anchor="start">F_B (μN)</text><text x="32" y="1420" font-size="18" fill="#20354d" text-anchor="start">Origine aperta: limite v = 0, fuori da v > 0.</text></g></svg>
