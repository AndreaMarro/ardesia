<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc"><title id="title">Carica libera fissata, tensione diversa</title><desc id="desc">Tre tappe: due sezioni schematiche con generatore scollegato; confronto delle tensioni finali; retta tensione finale contro iniziale a costante relativa due.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667a"/></marker></defs><rect width="640" height="1480" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#20354d" text-anchor="start">Carica libera fissata, tensione diversa</text><text x="32" y="92" font-size="22" fill="#20354d" text-anchor="start">1 · Prima e dopo, senza generatore</text><text x="42" y="130" font-size="19" fill="#20354d" text-anchor="start">C₀ = 1 μF, V₀ = 12 V</text><text x="340" y="130" font-size="19" fill="#20354d" text-anchor="start">κ = 2, C = 2 μF</text><rect x="105" y="160" width="9" height="185" fill="#316b9b" rx="3"/><rect x="177" y="160" width="9" height="185" fill="#316b9b" rx="3"/><text x="93" y="205" font-size="22" fill="#20354d" text-anchor="end">+</text><text x="203" y="205" font-size="22" fill="#20354d" text-anchor="start">−</text><rect x="422" y="172" width="56" height="160" fill="#c9dfed" rx="3"/><rect x="410" y="160" width="9" height="185" fill="#316b9b" rx="3"/><rect x="482" y="160" width="9" height="185" fill="#316b9b" rx="3"/><text x="398" y="205" font-size="22" fill="#20354d" text-anchor="end">+</text><text x="508" y="205" font-size="22" fill="#20354d" text-anchor="start">−</text><text x="65" y="390" font-size="19" fill="#20354d" text-anchor="start">Q = 12 μC</text><text x="372" y="390" font-size="19" fill="#20354d" text-anchor="start">Q = 12 μC</text><text x="65" y="425" font-size="19" fill="#20354d" text-anchor="start">V₀ = 12 V</text><text x="372" y="425" font-size="19" fill="#20354d" text-anchor="start">V = 6 V</text><text x="32" y="475" font-size="18" fill="#20354d" text-anchor="start">Sezioni schematiche: stessa carica libera.</text><text x="32" y="540" font-size="22" fill="#20354d" text-anchor="start">2 · Uscite di due preparazioni e loro media</text><line x1="145" y1="560" x2="145" y2="815" stroke="#52667a" stroke-width="2"/><text x="125" y="607" font-size="19" fill="#20354d" text-anchor="end">A</text><rect x="150" y="590" width="240" height="27" fill="#316b9b" rx="3"/><text x="395" y="611" font-size="19" fill="#20354d" text-anchor="start">6 V</text><text x="125" y="692" font-size="19" fill="#20354d" text-anchor="end">B</text><rect x="150" y="675" width="120" height="27" fill="#a76d20" rx="3"/><text x="275" y="696" font-size="19" fill="#20354d" text-anchor="start">3 V</text><text x="125" y="777" font-size="19" fill="#20354d" text-anchor="end">media</text><rect x="150" y="760" width="180.0" height="27" fill="#488265" rx="3"/><text x="335.0" y="781" font-size="19" fill="#20354d" text-anchor="start">4.5 V</text><text x="32" y="875" font-size="18" fill="#20354d" text-anchor="start">A: V₀ = 12 V, κ = 2 · B: V₀ = 9 V, κ = 3</text><text x="32" y="950" font-size="22" fill="#20354d" text-anchor="start">3 · Solo κ = 2: V cresce con V₀</text><line x1="145" y1="1300" x2="520" y2="1300" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1305" x2="150" y2="1040" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="1300" x2="470" y2="1140" stroke="#316b9b" stroke-width="2"/><text x="132" y="1324" font-size="18" fill="#20354d" text-anchor="end">0</text><text x="470" y="1330" font-size="18" fill="#20354d" text-anchor="middle">12</text><text x="128" y="1146" font-size="18" fill="#20354d" text-anchor="end">6</text><text x="535" y="1310" font-size="18" fill="#20354d" text-anchor="start">V₀ (V)</text><text x="115" y="1025" font-size="18" fill="#20354d" text-anchor="start">V (V)</text><text x="32" y="1390" font-size="18" fill="#20354d" text-anchor="start">Le barre e il grafico usano scale indipendenti.</text></g></svg>
