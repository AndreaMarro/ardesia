<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Tre variazioni di entropia</title><desc id="desc">Primi due pannelli con la stessa scala di entropia e origini indicate: meno due e più quattro joule per kelvin. Terzo pannello a scala diversa comune alle sue tre barre orientate: meno un quarto, più tre decimi e più un ventesimo di joule per kelvin.</desc><rect x="0" y="0" width="640" height="1500" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">L’entropia ha un confine e un verso</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Il serbatoio cede calore</text><text x="35" y="185" font-size="19" fill="#203247" text-anchor="start">T = 320 K; Q ricevuto = −640 J</text><line x1="100" y1="330" x2="530" y2="330" stroke="#607383" stroke-width="2"/><rect x="140" y="295" width="160" height="30" fill="#986c35"/><line x1="300" y1="275" x2="140" y2="275" stroke="#986c35" stroke-width="2"/><polygon points="140,275 148.0,271.0 148.0,279.0" fill="#986c35"/><text x="140" y="370" font-size="19" fill="#203247" text-anchor="middle">−2 J/K</text><text x="300" y="370" font-size="19" fill="#203247" text-anchor="middle">0</text><text x="35" y="440" font-size="19" fill="#203247" text-anchor="start">ΔS = Q ricevuto / T = −2 J/K</text><text x="35" y="550" font-size="21" fill="#203247" text-anchor="start">2 · Fusione reversibile</text><text x="35" y="625" font-size="19" fill="#203247" text-anchor="start">T = 250 K; Q ricevuto = +1000 J</text><line x1="100" y1="750" x2="530" y2="750" stroke="#607383" stroke-width="2"/><rect x="140" y="715" width="320" height="30" fill="#637e55"/><line x1="140" y1="695" x2="460" y2="695" stroke="#637e55" stroke-width="2"/><polygon points="460,695 452.0,699.0 452.0,691.0" fill="#637e55"/><text x="140" y="790" font-size="19" fill="#203247" text-anchor="middle">0</text><text x="460" y="790" font-size="19" fill="#203247" text-anchor="middle">+4 J/K</text><text x="35" y="855" font-size="19" fill="#203247" text-anchor="start">La stessa scala di entropia del primo pannello.</text><text x="35" y="970" font-size="21" fill="#203247" text-anchor="start">3 · Un solo trasferimento: caldo e freddo</text><text x="35" y="1035" font-size="19" fill="#203247" text-anchor="start">90 J da 360 K a 300 K</text><line x1="340" y1="1100" x2="340" y2="1320" stroke="#607383" stroke-width="2"/><text x="35" y="1142" font-size="19" fill="#203247" text-anchor="start">caldo</text><rect x="140" y="1120" width="200" height="28" fill="#986c35"/><text x="300" y="1180" font-size="19" fill="#203247" text-anchor="end">−1/4 J/K</text><text x="35" y="1222" font-size="19" fill="#203247" text-anchor="start">freddo</text><rect x="340" y="1200" width="240" height="28" fill="#3d7791"/><text x="580" y="1260" font-size="19" fill="#203247" text-anchor="end">+3/10 J/K</text><text x="35" y="1302" font-size="19" fill="#203247" text-anchor="start">totale</text><rect x="340" y="1280" width="40" height="28" fill="#637e55"/><text x="380" y="1340" font-size="19" fill="#203247" text-anchor="end">+1/20 J/K</text><text x="340" y="1380" font-size="19" fill="#203247" text-anchor="middle">0</text><text x="35" y="1450" font-size="19" fill="#203247" text-anchor="start">Somma orientata positiva: 1/20 J/K</text></svg>
