<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Tre conti per un ciclo</title><desc id="desc">Triangolo orario con base quattro litri e altezza sessanta kilopascal; conteggio di centocinquanta cicli in un minuto; rettangolo di lavoro centocinquanta joule con intervallo di volume tre litri.</desc><rect x="0" y="0" width="640" height="1540" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Area, ripetizioni e bilancio ciclico</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Triangolo orario: lavoro positivo</text><line x1="100" y1="440" x2="540" y2="440" stroke="#607383" stroke-width="2"/><line x1="100" y1="440" x2="100" y2="155" stroke="#607383" stroke-width="2"/><polygon points="180,360 180,240 500,360" fill="#d9ecf1"/><line x1="180" y1="360" x2="180" y2="240" stroke="#306f8c" stroke-width="3"/><line x1="180" y1="240" x2="500" y2="360" stroke="#306f8c" stroke-width="3"/><line x1="500" y1="360" x2="180" y2="360" stroke="#306f8c" stroke-width="3"/><line x1="180" y1="330" x2="180" y2="275" stroke="#306f8c" stroke-width="2"/><polygon points="180,275 184.0,283.0 176.0,283.0" fill="#306f8c"/><line x1="300" y1="285" x2="380" y2="315" stroke="#306f8c" stroke-width="2"/><polygon points="380,315 371.1048728130941,315.93632917756906 373.9138603458012,308.44569575701667" fill="#306f8c"/><line x1="420" y1="360" x2="330" y2="360" stroke="#306f8c" stroke-width="2"/><polygon points="330,360 338.0,356.0 338.0,364.0" fill="#306f8c"/><text x="90" y="470" font-size="18" fill="#203247" text-anchor="end">0</text><text x="545" y="505" font-size="18" fill="#203247" text-anchor="end">V [L]</text><text x="70" y="140" font-size="18" fill="#203247" text-anchor="middle">p [kPa]</text><text x="90" y="248" font-size="18" fill="#203247" text-anchor="end">100</text><text x="90" y="368" font-size="18" fill="#203247" text-anchor="end">40</text><text x="180" y="475" font-size="18" fill="#203247" text-anchor="middle">1</text><text x="500" y="475" font-size="18" fill="#203247" text-anchor="middle">5</text><text x="35" y="555" font-size="19" fill="#203247" text-anchor="start">Base 4 L; altezza 60 kPa; W = 120 J</text><text x="35" y="640" font-size="21" fill="#203247" text-anchor="start">2 · Ripetere un lavoro per ciclo</text><rect x="80" y="710" width="180" height="100" fill="#d9ecf1"/><text x="170" y="750" font-size="20" fill="#203247" text-anchor="middle">1 ciclo</text><text x="170" y="790" font-size="20" fill="#203247" text-anchor="middle">24 J</text><line x1="280" y1="760" x2="340" y2="760" stroke="#306f8c" stroke-width="2"/><polygon points="340,760 332.0,764.0 332.0,756.0" fill="#306f8c"/><rect x="365" y="710" width="200" height="100" fill="#e5eddc"/><text x="465" y="750" font-size="20" fill="#203247" text-anchor="middle">150 cicli</text><text x="465" y="790" font-size="20" fill="#203247" text-anchor="middle">3600 J</text><text x="35" y="875" font-size="19" fill="#203247" text-anchor="start">Durata totale: 60 s</text><text x="35" y="935" font-size="19" fill="#203247" text-anchor="start">Potenza media: 3600 J / 60 s = 60 W</text><text x="35" y="1040" font-size="21" fill="#203247" text-anchor="start">3 · Rettangolo: ricavare ΔV</text><line x1="100" y1="1390" x2="540" y2="1390" stroke="#607383" stroke-width="2"/><line x1="100" y1="1390" x2="100" y2="1110" stroke="#607383" stroke-width="2"/><rect x="180" y="1190" width="240" height="100" fill="#d9ecf1"/><line x1="180" y1="1290" x2="180" y2="1190" stroke="#306f8c" stroke-width="3"/><line x1="180" y1="1190" x2="420" y2="1190" stroke="#306f8c" stroke-width="3"/><line x1="420" y1="1190" x2="420" y2="1290" stroke="#306f8c" stroke-width="3"/><line x1="420" y1="1290" x2="180" y2="1290" stroke="#306f8c" stroke-width="3"/><line x1="240" y1="1190" x2="320" y2="1190" stroke="#306f8c" stroke-width="2"/><polygon points="320,1190 312.0,1194.0 312.0,1186.0" fill="#306f8c"/><line x1="360" y1="1290" x2="280" y2="1290" stroke="#306f8c" stroke-width="2"/><polygon points="280,1290 288.0,1286.0 288.0,1294.0" fill="#306f8c"/><text x="90" y="1420" font-size="18" fill="#203247" text-anchor="end">0</text><text x="545" y="1425" font-size="18" fill="#203247" text-anchor="end">V [L]</text><text x="70" y="1100" font-size="18" fill="#203247" text-anchor="middle">p [kPa]</text><text x="90" y="1198" font-size="18" fill="#203247" text-anchor="end">100</text><text x="90" y="1298" font-size="18" fill="#203247" text-anchor="end">50</text><text x="180" y="1425" font-size="18" fill="#203247" text-anchor="middle">1</text><text x="420" y="1425" font-size="18" fill="#203247" text-anchor="middle">4</text><text x="300" y="1248" font-size="21" fill="#203247" text-anchor="middle">150 J</text><text x="35" y="1490" font-size="19" fill="#203247" text-anchor="start">Δp = 50 kPa; ΔV = 150 J / 50 kPa = 3 L</text></svg>
