<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><title id="title">Sovrapposizione nel punto medio di un dipolo</title><desc id="desc">A sinistra una sorgente positiva, a destra una negativa. I due contributi al campo in P sono orientati verso destra.</desc><defs><marker id="a123c39" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#123c39"/></marker><marker id="aac3825" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#ac3825"/></marker><marker id="a16736b" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#16736b"/></marker><marker id="a7d8981" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#7d8981"/></marker></defs><rect x="0" y="0" width="640" height="250" rx="0" fill="#faf7ee" stroke="none" stroke-width="0"/><text x="320" y="30" font-size="19" text-anchor="middle" fill="#123c39" font-weight="700">I due contributi in P</text><line x1="119" y1="112" x2="523" y2="112" stroke="#7d8981" stroke-width="1.7" stroke-dasharray="5 5"/><circle cx="112" cy="112" r="20" fill="#f2d8c7" stroke="#ac3825" stroke-width="2"/><circle cx="528" cy="112" r="20" fill="#d5e7df" stroke="#16736b" stroke-width="2"/><text x="112" y="119" font-size="24" text-anchor="middle" fill="#ac3825" font-weight="500">+</text><text x="528" y="119" font-size="24" text-anchor="middle" fill="#16736b" font-weight="500">−</text><circle cx="320" cy="112" r="5" fill="#123c39" stroke="none" stroke-width="2"/><text x="320" y="93" font-size="17" text-anchor="middle" fill="#123c39" font-weight="500">P</text><line x1="320" y1="133" x2="397" y2="133" stroke="#ac3825" stroke-width="3" marker-end="url(#aac3825)"/><line x1="320" y1="163" x2="397" y2="163" stroke="#16736b" stroke-width="3" marker-end="url(#a16736b)"/><text x="424" y="140" font-size="17" text-anchor="middle" fill="#ac3825" font-weight="500">E₊</text><text x="424" y="170" font-size="17" text-anchor="middle" fill="#16736b" font-weight="500">E₋</text><text x="320" y="217" font-size="15" text-anchor="middle" fill="#123c39" font-weight="500">Frecce sfalsate per leggerle separatamente</text></svg>
