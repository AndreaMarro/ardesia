<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><title id="title">Campo e linee equipotenziali</title><desc id="desc">Il campo uniforme punta verso destra. Attraversando in quel verso le linee verticali, il potenziale decresce.</desc><defs><marker id="a123c39" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#123c39"/></marker><marker id="aac3825" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#ac3825"/></marker><marker id="a16736b" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#16736b"/></marker><marker id="a7d8981" markerWidth="6" markerHeight="6" refX="5.6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 L1.4,3 Z" fill="#7d8981"/></marker></defs><rect x="0" y="0" width="640" height="250" rx="0" fill="#faf7ee" stroke="none" stroke-width="0"/><text x="320" y="30" font-size="19" text-anchor="middle" fill="#123c39" font-weight="700">Attraversare le equipotenziali</text><line x1="147" y1="67" x2="147" y2="176" stroke="#7d8981" stroke-width="2" stroke-dasharray="5 6"/><line x1="261" y1="67" x2="261" y2="176" stroke="#7d8981" stroke-width="2" stroke-dasharray="5 6"/><line x1="375" y1="67" x2="375" y2="176" stroke="#7d8981" stroke-width="2" stroke-dasharray="5 6"/><line x1="489" y1="67" x2="489" y2="176" stroke="#7d8981" stroke-width="2" stroke-dasharray="5 6"/><text x="147" y="199" font-size="17" text-anchor="middle" fill="#123c39" font-weight="500">60 V</text><text x="261" y="199" font-size="17" text-anchor="middle" fill="#123c39" font-weight="500">40 V</text><text x="375" y="199" font-size="17" text-anchor="middle" fill="#123c39" font-weight="500">20 V</text><text x="489" y="199" font-size="17" text-anchor="middle" fill="#123c39" font-weight="500">0 V</text><line x1="98" y1="117" x2="548" y2="117" stroke="#16736b" stroke-width="3" marker-end="url(#a16736b)"/><text x="553" y="100" font-size="20" text-anchor="middle" fill="#16736b" font-weight="500">E</text><text x="320" y="231" font-size="15" text-anchor="middle" fill="#123c39" font-weight="500">Spostamento lungo E  →  potenziale decrescente</text></svg>
