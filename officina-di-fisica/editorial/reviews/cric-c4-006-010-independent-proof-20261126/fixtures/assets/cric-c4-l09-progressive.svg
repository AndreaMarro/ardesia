<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1560" width="640" height="1560" role="img" aria-labelledby="title desc">
<title id="title">Corrente invertita, forza sulla carica negativa e periodo</title>
<desc id="desc">Due sezioni di filo con correnti uscente ed entrante e frecce del campo magnetico opposte nei punti a destra. Una carica negativa ha velocità verso destra, campo entrante e forza verso il basso. Quattro intervalli uguali di zero virgola quaranta millisecondi formano un periodo di uno virgola sessanta millisecondi.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="640" height="1560" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" fill="#202c39" font-size="23">
<text x="32" y="53" font-size="27" font-weight="bold">1. Stesso punto, corrente invertita</text>
<text x="32" y="96">Contributo del solo filo; vista in sezione.</text>
<circle cx="165" cy="280" r="85" fill="none" stroke="#8a9a9f" stroke-width="3" stroke-dasharray="7 7"/>
<circle cx="465" cy="280" r="85" fill="none" stroke="#8a9a9f" stroke-width="3" stroke-dasharray="7 7"/>
<circle cx="165" cy="280" r="22" fill="#e0edf1" stroke="#304d63" stroke-width="3"/><circle cx="165" cy="280" r="6" fill="#304d63"/>
<circle cx="465" cy="280" r="22" fill="#e0edf1" stroke="#304d63" stroke-width="3"/><path d="M453 268L477 292M453 292L477 268" fill="none" stroke="#304d63" stroke-width="3"/>
<path d="M250 280V210" fill="none" stroke="#26728d" stroke-width="4" marker-end="url(#tip)"/>
<path d="M550 280V350" fill="none" stroke="#986c35" stroke-width="4" marker-end="url(#tip)"/>
<circle cx="250" cy="280" r="5" fill="#304d63"/><circle cx="550" cy="280" r="5" fill="#304d63"/>
<text x="268" y="234">B</text><text x="569" y="339">B</text><text x="108" y="421">I uscente</text><text x="408" y="421">I entrante</text>
<text x="32" y="478">A destra del filo i versi del campo si invertono.</text>
<text x="32" y="519">Circonferenze e frecce non fissano un modulo.</text>
<line x1="32" y1="555" x2="608" y2="555" stroke="#b8c4ca"/>
<text x="32" y="610" font-size="27" font-weight="bold">2. Prima il prodotto, poi il segno</text>
<text x="32" y="653">Carica negativa, B entrante nel foglio.</text>
<g stroke="#8a9a9f" stroke-width="3" fill="none"><path d="M428 705L452 729M428 729L452 705M518 705L542 729M518 729L542 705M428 825L452 849M428 849L452 825M518 825L542 849M518 849L542 825"/></g>
<circle cx="200" cy="770" r="20" fill="#ffffff" stroke="#304d63" stroke-width="3"/>
<text x="194" y="779">−</text>
<path d="M225 770H380" fill="none" stroke="#26728d" stroke-width="4" marker-end="url(#tip)"/>
<path d="M200 795V920" fill="none" stroke="#a1473c" stroke-width="4" marker-end="url(#tip)"/>
<text x="316" y="747">v</text><text x="223" y="905">F</text>
<text x="32" y="979">Per q positiva la forza sarebbe verso l’alto.</text>
<text x="32" y="1019">Le lunghezze di v e F sono schematiche.</text>
<line x1="32" y1="1055" x2="608" y2="1055" stroke="#b8c4ca"/>
<text x="32" y="1110" font-size="27" font-weight="bold">3. Quattro quarti fanno un giro</text>
<text x="32" y="1152">Moto uniforme: un quarto dura 0,40 ms.</text>
<rect x="100" y="1230" width="100" height="55" fill="#26728d"/><rect x="200" y="1230" width="100" height="55" fill="#77a5b7"/><rect x="300" y="1230" width="100" height="55" fill="#26728d"/><rect x="400" y="1230" width="100" height="55" fill="#77a5b7"/>
<text x="139" y="1265" fill="#ffffff">¼</text><text x="239" y="1265">¼</text><text x="339" y="1265" fill="#ffffff">¼</text><text x="439" y="1265">¼</text>
<path d="M100 1305H500M100 1295V1315M200 1295V1315M300 1295V1315M400 1295V1315M500 1295V1315" fill="none" stroke="#304d63" stroke-width="3"/>
<text x="93" y="1346">0</text><text x="176" y="1346">0,40</text><text x="276" y="1346">0,80</text><text x="376" y="1346">1,20</text><text x="476" y="1346">1,60</text><text x="523" y="1384">t (ms)</text>
<text x="32" y="1436">T = 1,60 ms = 1/625 s.</text>
<text x="32" y="1480">f = 625 Hz: frequenza dei giri completi.</text>
<text x="32" y="1524">I quattro intervalli hanno la stessa scala.</text>
</g></svg>
