<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1560" width="640" height="1560" role="img" aria-labelledby="title desc">
<title id="title">Nodi, potenza a tensione comune ed energia nel tempo</title>
<desc id="desc">Tre pannelli: generatore da nove volt, dieci ohm in serie al parallelo di trenta e sessanta ohm; barre della potenza di uno virgola due e zero virgola sei watt a sei volt comuni; energia che sale linearmente a uno virgola due joule in trenta secondi.</desc>
<rect width="640" height="1560" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" fill="#202c39" font-size="23">
<text x="32" y="53" font-size="27" font-weight="bold">1. Prima i nodi, poi le somme</text>
<text x="32" y="94">Il blocco fra A e B è in parallelo.</text>
<g fill="none" stroke="#304d63" stroke-width="4">
<path d="M90 240V190H190M270 190H420M490 190H550V440H90V330M350 190V380H420M490 380H550"/>
<rect x="190" y="175" width="80" height="30" fill="#dceaf0"/>
<rect x="420" y="175" width="70" height="30" fill="#dceaf0"/>
<rect x="420" y="365" width="70" height="30" fill="#eadbc8"/>
<circle cx="90" cy="285" r="45" fill="#ffffff"/>
</g>
<circle cx="350" cy="190" r="6" fill="#304d63"/><circle cx="550" cy="190" r="6" fill="#304d63"/>
<text x="196" y="150">10 Ω</text><text x="421" y="150">30 Ω</text><text x="421" y="348">60 Ω</text>
<text x="332" y="138">A</text><text x="551" y="138">B</text><text x="67" y="294">9 V</text>
<text x="119" y="245">+</text><text x="119" y="344">−</text>
<text x="32" y="492">Rₚ = 20 Ω; R totale = 30 Ω.</text>
<text x="32" y="531">Schema dei collegamenti, non scala resistiva.</text>
<line x1="32" y1="566" x2="608" y2="566" stroke="#b8c4ca"/>
<text x="32" y="620" font-size="27" font-weight="bold">2. Due rami sulla stessa tensione</text>
<text x="32" y="662">Confronto separato: V = 6 V in entrambi.</text>
<line x1="150" y1="702" x2="150" y2="881" stroke="#304d63" stroke-width="3"/>
<text x="101" y="724">0</text>
<text x="38" y="771">30 Ω</text><rect x="150" y="735" width="300" height="45" fill="#26728d"/><text x="472" y="768">1,2 W</text>
<text x="38" y="860">60 Ω</text><rect x="150" y="824" width="150" height="45" fill="#986c35"/><text x="320" y="858">0,6 W</text>
<text x="32" y="930">P = V²/R: metà resistenza, doppia potenza.</text>
<text x="32" y="972">Barre con origine e scala comuni.</text>
<line x1="32" y1="1014" x2="608" y2="1014" stroke="#b8c4ca"/>
<text x="32" y="1070" font-size="27" font-weight="bold">3. Energia accumulata nel resistore</text>
<text x="32" y="1110">I = 20 mA, R = 100 Ω, P = 0,040 W.</text>
<path d="M140 1150V1440H555M140 1440L500 1170" fill="none" stroke="#304d63" stroke-width="3"/>
<path d="M140 1440L500 1170" fill="none" stroke="#26728d" stroke-width="5"/>
<path d="M140 1170H500V1440M140 1305H320V1440" fill="none" stroke="#8a9a9f" stroke-width="2" stroke-dasharray="7 7"/>
<text x="38" y="1155">E (J)</text><text x="84" y="1180">1,20</text><text x="84" y="1314">0,60</text><text x="105" y="1470">0</text>
<text x="307" y="1470">15</text><text x="487" y="1470">30</text><text x="548" y="1505">t (s)</text>
<text x="32" y="1537">La pendenza della retta è la potenza costante.</text>
</g></svg>
