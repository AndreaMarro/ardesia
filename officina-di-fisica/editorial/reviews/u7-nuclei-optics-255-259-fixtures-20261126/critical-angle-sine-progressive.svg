<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1610" viewBox="0 0 640 1610" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Soglia radente e riflessione totale</title><desc id="desc">Al limite con indice interno due ed esterno uno il raggio trasmesso è radente. Sopra il limite si disegna soltanto il riflesso propagante. Seguono barre dei seni limite.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#306f8c"/></marker></defs><rect x="0" y="0" width="640" height="1610" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Il limite non è ancora un angolo superiore</text><text x="35" y="108" font-size="22" fill="#203247" text-anchor="start">1 · n_i = 2 → n_e = 1; θ_c = 30°</text><rect x="60" y="330" width="520" height="210" fill="#e4eef3"/><line x1="60" y1="330" x2="580" y2="330" stroke="#526474" stroke-width="2"/><line x1="320" y1="165" x2="320" y2="525" stroke="#72818c" stroke-width="2" stroke-dasharray="7 6"/><path d="M240 468.56406460551017L320 330" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M320 330L550 330" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><text x="75" y="245" font-size="19" fill="#203247" text-anchor="start">n_e = 1</text><text x="75" y="510" font-size="19" fill="#203247" text-anchor="start">n_i = 2</text><text x="355" y="285" font-size="19" fill="#203247" text-anchor="start">θ_t = 90°</text><text x="280" y="430" font-size="18" fill="#203247" text-anchor="start">30°</text><text x="340" y="515" font-size="17" fill="#203247" text-anchor="start">normale</text><text x="35" y="585" font-size="19" fill="#203247" text-anchor="start">Il raggio trasmesso è radente alla superficie.</text><text x="35" y="665" font-size="22" fill="#203247" text-anchor="start">2 · Stessi mezzi; θ_i = 45° &gt; θ_c</text><rect x="60" y="830" width="520" height="200" fill="#e4eef3"/><line x1="60" y1="830" x2="580" y2="830" stroke="#526474" stroke-width="2"/><line x1="320" y1="710" x2="320" y2="1020" stroke="#72818c" stroke-width="2" stroke-dasharray="7 6"/><path d="M200 950L320 830" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><path d="M320 830L440 950" fill="none" stroke="#306f8c" stroke-width="2" marker-end="url(#arr)"/><text x="75" y="755" font-size="19" fill="#203247" text-anchor="start">n_e = 1</text><text x="75" y="1020" font-size="19" fill="#203247" text-anchor="start">n_i = 2</text><text x="259" y="918" font-size="18" fill="#203247" text-anchor="start">45°</text><text x="342" y="918" font-size="18" fill="#203247" text-anchor="start">45°</text><text x="35" y="1080" font-size="19" fill="#203247" text-anchor="start">Solo raggio riflesso propagante; campo evanescente</text><text x="35" y="1112" font-size="19" fill="#203247" text-anchor="start">non rappresentato nel disegno geometrico.</text><text x="35" y="1190" font-size="22" fill="#203247" text-anchor="start">3 · Confronto dei seni limite</text><text x="130" y="1282" font-size="18" fill="#203247" text-anchor="end">A</text><rect x="150" y="1260" width="240.0" height="30" fill="#3d7791"/><text x="400.0" y="1284" font-size="18" fill="#203247" text-anchor="start">1/2</text><text x="130" y="1382" font-size="18" fill="#203247" text-anchor="end">B</text><rect x="150" y="1360" width="320.0" height="30" fill="#986c35"/><text x="480.0" y="1384" font-size="18" fill="#203247" text-anchor="start">2/3</text><text x="130" y="1482" font-size="18" fill="#203247" text-anchor="end">media</text><rect x="150" y="1460" width="280.0" height="30" fill="#637e55"/><text x="440.0" y="1484" font-size="18" fill="#203247" text-anchor="start">7/12</text><text x="35" y="1565" font-size="19" fill="#203247" text-anchor="start">A: (n_e,n_i) = (1,2) · B: (2,3)</text></svg>
