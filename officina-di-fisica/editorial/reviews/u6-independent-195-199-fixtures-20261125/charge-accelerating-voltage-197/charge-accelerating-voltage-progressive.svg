<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc">
<title id="title">Dal lavoro elettrico al modulo della velocità</title>
<desc id="desc">Un lavoro di due millijoule diventa energia cinetica di due millijoule. Un corpo di massa un grammo ha rapidità finale due metri al secondo. A massa fissata, il grafico dell’energia cinetica cresce col quadrato della rapidità. Le barre confrontano rapidità due e tre metri al secondo e la media cinque mezzi.</desc>
<rect width="640" height="1450" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Lo stesso trasferimento di energia</text>
<text x="32" y="83" font-size="18">q = 1 μC ; U = 2 kV ; m = 1 g ; partenza da fermo.</text>
<path d="M150 115V310" stroke="#14243a" stroke-width="2"/>
<rect x="150" y="145" width="200" height="40" fill="#b45328"/>
<rect x="150" y="235" width="200" height="40" fill="#165a87"/>
<text x="60" y="174">qU</text><text x="370" y="174">2 mJ</text>
<text x="60" y="264">K_f</text><text x="370" y="264">2 mJ</text>
<text x="124" y="305">0</text>
<text x="32" y="353" font-size="18">Il lavoro del campo è tutta l’energia cinetica finale.</text>
<text x="32" y="385" font-size="18">Non sono due energie da sommare.</text>
<text x="32" y="417" font-size="18">v² = 4 m²/s² ; rapidità finale v = 2 m/s.</text>
<path d="M32 450H608" stroke="#9babbc"/>
<text x="32" y="494" font-size="25" font-weight="bold">2 · A massa fissata: K(v)</text>
<text x="32" y="533" font-size="18">m = 1 g ; K in mJ ; v in m/s.</text>
<path d="M100 830V570M100 830H540" stroke="#14243a" stroke-width="2" fill="none"/>
<path d="M100 830Q300 830 500 590" stroke="#165a87" stroke-width="4" fill="none"/>
<path d="M100 770H300V830M100 590H500V830" stroke="#8292a2" stroke-dasharray="5 5" fill="none"/>
<circle cx="300" cy="770" r="5" fill="#165a87"/><circle cx="500" cy="590" r="5" fill="#165a87"/>
<text x="65" y="597">8</text><text x="65" y="777">2</text><text x="65" y="837">0</text>
<text x="82" y="865">0</text><text x="291" y="865">2</text><text x="491" y="865">4</text>
<text x="32" y="905" font-size="18">È un grafico energetico, non una traiettoria.</text>
<path d="M32 938H608" stroke="#9babbc"/>
<text x="32" y="982" font-size="25" font-weight="bold">3 · Media delle rapidità finali</text>
<path d="M130 1010V1282" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="1035" width="200" height="38" fill="#165a87"/>
<rect x="130" y="1115" width="300" height="38" fill="#165a87"/>
<rect x="130" y="1195" width="250" height="38" fill="#28664d"/>
<text x="50" y="1063">A</text><text x="350" y="1063">2 m/s</text>
<text x="50" y="1143">B</text><text x="450" y="1143">3 m/s</text>
<text x="32" y="1223">Media</text><text x="400" y="1223">5/2 m/s</text>
<text x="104" y="1276">0</text>
<text x="32" y="1324" font-size="18">A: U = 2 kV, m = 1 g ; B: U = 9 kV, m = 2 g.</text>
<text x="32" y="1356" font-size="18">Moduli in m/s, origine e scala comuni.</text>
<text x="32" y="1388" font-size="18">La prova B non usa la massa della curva centrale.</text>
<text x="32" y="1420" font-size="18">Ogni prova ha velocità iniziale nulla.</text>
</g></svg>
