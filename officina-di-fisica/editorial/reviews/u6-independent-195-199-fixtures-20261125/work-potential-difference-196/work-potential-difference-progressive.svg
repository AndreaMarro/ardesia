<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1440" role="img" aria-labelledby="title desc">
<title id="title">Il lavoro cambia segno insieme alla carica</title>
<desc id="desc">Una carica positiva scende da tre a zero volt: perde sei microjoule di energia potenziale e il campo compie sei microjoule di lavoro. Le barre confrontano lavori sei e cinque e la media undici mezzi. Un caso separato mostra un elettrone che da meno due sale a più tre kilovolt e acquista cinque kiloelettronvolt di energia cinetica.</desc>
<defs><marker id="path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#28664d"/></marker></defs>
<rect width="640" height="1440" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Carica positiva, caduta positiva</text>
<text x="32" y="83" font-size="18">Un riferimento possibile: V_A = 3 V, V_B = 0 V.</text>
<rect x="55" y="125" width="205" height="160" rx="9" fill="#fce6dc" stroke="#b45328"/>
<rect x="380" y="125" width="205" height="160" rx="9" fill="#e4f3fa" stroke="#165a87"/>
<text x="80" y="164">A: V = 3 V</text><text x="78" y="205">q = +2 μC</text><text x="78" y="250">U_e = 6 μJ</text>
<text x="405" y="164">B: V = 0 V</text><text x="402" y="205">q = +2 μC</text><text x="407" y="250">U_e = 0</text>
<path d="M280 210H360" stroke="#28664d" stroke-width="4" marker-end="url(#path)"/>
<text x="32" y="330" font-size="18">δ = V_A − V_B = 3 V ; ΔU_e = −6 μJ.</text>
<text x="32" y="362" font-size="18">W_campo = −ΔU_e = +6 μJ.</text>
<text x="32" y="394" font-size="18">Freccia schematica del passaggio, senza scala spaziale.</text>
<text x="32" y="426" font-size="18">Il solo lavoro elettrico non determina sempre ΔK.</text>
<path d="M32 459H608" stroke="#9babbc"/>
<text x="32" y="503" font-size="25" font-weight="bold">2 · Media dei lavori di due prove</text>
<text x="32" y="542" font-size="18">A: q = 2 μC, δ = 3 V ; B: q = 1 μC, δ = 5 V.</text>
<path d="M130 570V830" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="595" width="240" height="38" fill="#165a87"/>
<rect x="130" y="675" width="200" height="38" fill="#165a87"/>
<rect x="130" y="755" width="220" height="38" fill="#28664d"/>
<text x="50" y="622">A</text><text x="390" y="622">6 μJ</text>
<text x="50" y="702">B</text><text x="350" y="702">5 μJ</text>
<text x="32" y="782">Media</text><text x="370" y="782">11/2 μJ</text>
<text x="104" y="824">0</text>
<text x="32" y="873" font-size="18">Lavori in μJ, origine e scala comuni.</text>
<text x="32" y="905" font-size="18">Non sono contributi da sommare nello stesso percorso.</text>
<path d="M32 937H608" stroke="#9babbc"/>
<text x="32" y="981" font-size="25" font-weight="bold">3 · Un altro caso: l’elettrone</text>
<text x="32" y="1020" font-size="18">Parte da fermo; agisce soltanto la forza elettrostatica.</text>
<rect x="55" y="1057" width="205" height="135" rx="9" fill="#e4f3fa" stroke="#165a87"/>
<rect x="380" y="1057" width="205" height="135" rx="9" fill="#e8f3ed" stroke="#28664d"/>
<text x="76" y="1100">A: −2 kV</text><text x="82" y="1148">K_i = 0</text>
<text x="400" y="1100">B: +3 kV</text><text x="397" y="1148">K_f = 5 keV</text>
<path d="M280 1125H360" stroke="#28664d" stroke-width="4" marker-end="url(#path)"/>
<text x="286" y="1080">q = −e</text>
<text x="32" y="1238" font-size="18">V_A − V_B = −5 kV ; q = −e, con e &gt; 0.</text>
<text x="32" y="1270" font-size="18">W = (−e)(−5 kV) = +5 keV.</text>
<text x="32" y="1302" font-size="18">Qui ΔK = W, quindi l’energia finale è positiva.</text>
<text x="32" y="1334" font-size="18">Il keV misura energia: 1 eV = e · 1 V.</text>
<text x="32" y="1366" font-size="18">L’elettrone sale di potenziale e perde energia potenziale.</text>
<text x="32" y="1398" font-size="18">Non serve ricavare la sua velocità.</text>
</g></svg>
