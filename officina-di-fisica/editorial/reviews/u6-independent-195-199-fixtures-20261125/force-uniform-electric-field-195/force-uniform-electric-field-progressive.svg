<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1440" role="img" aria-labelledby="title desc">
<title id="title">Forza di prova e induzione sono casi distinti</title>
<desc id="desc">Una carica positiva di due microcoulomb in un campo assegnato di tre kilonewton al coulomb subisce sei millinewton nel verso del campo. Le barre confrontano sei e quattro millinewton e la media cinque. Un pannello separato mostra induzione su una sfera neutra isolata, con campo nullo nel metallo all’equilibrio.</desc>
<defs><marker id="field" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#165a87"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45328"/></marker></defs>
<rect width="640" height="1440" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#14243a" font-size="20">
<text x="32" y="42" font-size="25" font-weight="bold">1 · Il campo assegna una forza</text>
<text x="32" y="83" font-size="18">q = 2 μC ; E = 3 kN/C ; F = qE = 6 mN.</text>
<path d="M65 135H570" stroke="#165a87" stroke-width="3" marker-end="url(#field)"/>
<path d="M65 320H570" stroke="#165a87" stroke-width="3" marker-end="url(#field)"/>
<circle cx="260" cy="225" r="26" fill="#fce6dc" stroke="#b45328" stroke-width="2"/>
<text x="250" y="233" font-size="28">+</text>
<path d="M286 225H466" stroke="#b45328" stroke-width="5" marker-end="url(#force)"/>
<text x="345" y="200">F = 6 mN</text><text x="225" y="284">q &gt; 0</text>
<text x="375" y="365" fill="#165a87">Verso di E</text>
<text x="32" y="405" font-size="18">Frecce schematiche; forza e campo hanno unità diverse.</text>
<text x="32" y="437" font-size="18">La forza sulla prova positiva è concorde con E.</text>
<path d="M32 470H608" stroke="#9babbc"/>
<text x="32" y="514" font-size="25" font-weight="bold">2 · Media di due prove separate</text>
<text x="32" y="553" font-size="18">A: q = 2 μC, E = 3 kN/C ; B: q = 1 μC, E = 4 kN/C.</text>
<path d="M130 580V837" stroke="#14243a" stroke-width="2"/>
<rect x="130" y="607" width="240" height="38" fill="#165a87"/>
<rect x="130" y="685" width="160" height="38" fill="#165a87"/>
<rect x="130" y="763" width="200" height="38" fill="#28664d"/>
<text x="50" y="635">A</text><text x="390" y="635">6 mN</text>
<text x="50" y="713">B</text><text x="310" y="713">4 mN</text>
<text x="32" y="791">Media</text><text x="350" y="791">5 mN</text>
<text x="104" y="831">0</text>
<text x="32" y="880" font-size="18">Moduli in mN, origine e scala comuni.</text>
<text x="32" y="912" font-size="18">Il prodotto dei dati medi darebbe 21/4 mN.</text>
<path d="M32 945H608" stroke="#9babbc"/>
<text x="32" y="989" font-size="25" font-weight="bold">3 · Un altro caso: induzione</text>
<text x="32" y="1028" font-size="18">Sfera metallica neutra, isolata, senza contatto.</text>
<circle cx="95" cy="1150" r="37" fill="#fce6dc" stroke="#b45328" stroke-width="2"/>
<text x="81" y="1161" font-size="36" fill="#b45328">+</text>
<text x="39" y="1220">Corpo vicino</text>
<circle cx="430" cy="1150" r="93" fill="#e0e7ee" stroke="#14243a" stroke-width="2"/>
<g font-size="28"><text x="365" y="1111" fill="#165a87">−</text><text x="353" y="1159" fill="#165a87">−</text><text x="365" y="1206" fill="#165a87">−</text><text x="477" y="1111" fill="#b45328">+</text><text x="490" y="1159" fill="#b45328">+</text><text x="477" y="1206" fill="#b45328">+</text></g>
<text x="385" y="1157" font-size="18">E_int = 0</text>
<text x="345" y="1280">Q_sfera = 0</text>
<text x="32" y="1325" font-size="18">Segni schematici: la carica totale resta nulla.</text>
<text x="32" y="1357" font-size="18">Campo totale nullo nel materiale metallico in equilibrio.</text>
<text x="32" y="1389" font-size="18">Qui il campo si ridistribuisce: non è il caso della prova.</text>
</g></svg>
