<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1550" viewBox="0 0 640 1550" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Lavoro obliquo, area e bilancio cinetico</title><desc id="desc">Proiezione di una forza a sessanta gradi, area trapezoidale sotto la forza e due energie cinetiche.</desc><rect x="0" y="0" width="640" height="1550" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Il lavoro segue lo spostamento</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Una forza obliqua, una proiezione</text><line x1="100" y1="360" x2="550" y2="360" stroke="#607383" stroke-width="2"/><line x1="150" y1="360" x2="250" y2="360" stroke="#637e55" stroke-width="2"/><polygon points="250,360 242.0,364.0 242.0,356.0" fill="#637e55"/><line x1="150" y1="360" x2="250" y2="186.79491924311228" stroke="#306f8c" stroke-width="2"/><polygon points="250,186.79491924311228 249.46410161513776,195.72312247338778 242.53589838486224,191.72312247338778" fill="#306f8c"/><text x="270" y="195" font-size="19" fill="#203247" text-anchor="start">F = 16 N</text><text x="270" y="350" font-size="19" fill="#203247" text-anchor="start">F_x = 8 N</text><text x="185" y="325" font-size="19" fill="#203247" text-anchor="start">60°</text><line x1="150" y1="440" x2="500" y2="440" stroke="#986c35" stroke-width="2"/><polygon points="500,440 492.0,444.0 492.0,436.0" fill="#986c35"/><text x="325" y="485" font-size="19" fill="#203247" text-anchor="middle">d = 5 m</text><text x="35" y="545" font-size="19" fill="#203247" text-anchor="start">Le forze condividono una scala; d ne usa un’altra.</text><text x="35" y="635" font-size="21" fill="#203247" text-anchor="start">2 · Il lavoro è un’area con segno</text><line x1="150" y1="1030" x2="550" y2="1030" stroke="#607383" stroke-width="2"/><line x1="150" y1="1030" x2="150" y2="700" stroke="#607383" stroke-width="2"/><polygon points="150,1030 150,970 470,730 470,1030" fill="#e5edf2"/><line x1="150" y1="970" x2="470" y2="730" stroke="#306f8c" stroke-width="3"/><line x1="150" y1="970" x2="470" y2="970" stroke="#986c35" stroke-width="2"/><text x="165" y="720" font-size="19" fill="#203247" text-anchor="start">F_x (N)</text><text x="480" y="1080" font-size="19" fill="#203247" text-anchor="start">x (m)</text><text x="135" y="1035" font-size="18" fill="#203247" text-anchor="end">0</text><text x="135" y="975" font-size="18" fill="#203247" text-anchor="end">2</text><text x="135" y="735" font-size="18" fill="#203247" text-anchor="end">10</text><text x="470" y="1065" font-size="18" fill="#203247" text-anchor="middle">2/5</text><text x="220" y="1008" font-size="19" fill="#203247" text-anchor="start">4/5 J</text><text x="300" y="905" font-size="19" fill="#203247" text-anchor="start">8/5 J</text><text x="35" y="1130" font-size="19" fill="#203247" text-anchor="start">Area totale: 4/5 J + 8/5 J = 12/5 J.</text><text x="35" y="1210" font-size="21" fill="#203247" text-anchor="start">3 · Un bilancio fra due energie cinetiche</text><text x="125" y="1292" font-size="18" fill="#203247" text-anchor="end">K_i</text><rect x="150" y="1270" width="100" height="25" fill="#637e55"/><text x="265" y="1290" font-size="19" fill="#203247" text-anchor="start">5 J</text><text x="125" y="1392" font-size="18" fill="#203247" text-anchor="end">K_f</text><rect x="150" y="1370" width="340" height="25" fill="#3d7791"/><text x="505" y="1390" font-size="19" fill="#203247" text-anchor="start">17 J</text><text x="35" y="1475" font-size="19" fill="#203247" text-anchor="start">W_tot = +18 J − 6 J = +12 J.</text></svg>
