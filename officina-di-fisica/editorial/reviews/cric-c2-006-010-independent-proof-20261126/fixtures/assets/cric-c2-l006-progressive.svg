<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1900" viewBox="0 0 640 1900" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Bilanci ideali di corrente</title><desc id="desc">Dilatazione orizzontale con recupero di pressione, aumento di quota a velocità costante e confronto istantaneo di due battenti.</desc><rect x="0" y="0" width="640" height="1900" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Quota, velocità e pressione</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Recupero ideale in una dilatazione</text><line x1="80" y1="260" x2="280" y2="260" stroke="#607383" stroke-width="2"/><line x1="80" y1="310" x2="280" y2="310" stroke="#607383" stroke-width="2"/><line x1="280" y1="260" x2="380" y2="235" stroke="#607383" stroke-width="2"/><line x1="280" y1="310" x2="380" y2="335" stroke="#607383" stroke-width="2"/><line x1="380" y1="235" x2="570" y2="235" stroke="#607383" stroke-width="2"/><line x1="380" y1="335" x2="570" y2="335" stroke="#607383" stroke-width="2"/><line x1="130" y1="285" x2="230" y2="285" stroke="#306f8c" stroke-width="2"/><polygon points="230,285 222.0,289.0 222.0,281.0" fill="#306f8c"/><line x1="440" y1="285" x2="490" y2="285" stroke="#306f8c" stroke-width="2"/><polygon points="490,285 482.0,289.0 482.0,281.0" fill="#306f8c"/><text x="160" y="220" font-size="19" fill="#203247" text-anchor="middle">A₁</text><text x="470" y="190" font-size="19" fill="#203247" text-anchor="middle">A₂ = 2 A₁</text><text x="110" y="375" font-size="19" fill="#203247" text-anchor="start">v₁ = 2 m/s</text><text x="400" y="375" font-size="19" fill="#203247" text-anchor="start">v₂ = 1 m/s</text><text x="35" y="440" font-size="19" fill="#203247" text-anchor="start">p₂ − p₁ = 1500 Pa</text><text x="35" y="490" font-size="19" fill="#203247" text-anchor="start">La quota è la stessa; la portata è comune.</text><text x="35" y="595" font-size="21" fill="#203247" text-anchor="start">2 · Salire senza cambiare velocità</text><line x1="120" y1="970" x2="120" y2="680" stroke="#607383" stroke-width="2"/><line x1="105" y1="950" x2="135" y2="950" stroke="#607383" stroke-width="2"/><line x1="105" y1="710" x2="135" y2="710" stroke="#607383" stroke-width="2"/><line x1="135" y1="950" x2="260" y2="950" stroke="#607383" stroke-width="2"/><line x1="135" y1="710" x2="260" y2="710" stroke="#607383" stroke-width="2"/><text x="75" y="990" font-size="18" fill="#203247" text-anchor="start">z₁ = 0</text><text x="155" y="690" font-size="19" fill="#203247" text-anchor="start">z₂ = 3/4 m</text><text x="300" y="765" font-size="19" fill="#203247" text-anchor="start">ρ = 800 kg/m³</text><text x="300" y="820" font-size="19" fill="#203247" text-anchor="start">g = 10 m/s²</text><text x="300" y="880" font-size="19" fill="#203247" text-anchor="start">p₁ − p₂ = 6000 Pa</text><text x="35" y="1050" font-size="19" fill="#203247" text-anchor="start">Il contributo di quota cresce di 6000 Pa.</text><text x="35" y="1150" font-size="21" fill="#203247" text-anchor="start">3 · Torricelli: h e 4h</text><rect x="80" y="1330" width="150" height="40" fill="#d9ecf1"/><line x1="80" y1="1160" x2="80" y2="1370" stroke="#607383" stroke-width="2"/><line x1="80" y1="1370" x2="230" y2="1370" stroke="#607383" stroke-width="2"/><line x1="230" y1="1160" x2="230" y2="1363" stroke="#607383" stroke-width="2"/><line x1="230" y1="1370" x2="330" y2="1370" stroke="#306f8c" stroke-width="2"/><polygon points="330,1370 322.0,1374.0 322.0,1366.0" fill="#306f8c"/><text x="300" y="1240" font-size="19" fill="#203247" text-anchor="start">A: battente h</text><text x="300" y="1300" font-size="19" fill="#203247" text-anchor="start">v_A = 2 m/s</text><rect x="80" y="1520" width="150" height="160" fill="#d9ecf1"/><line x1="80" y1="1470" x2="80" y2="1680" stroke="#607383" stroke-width="2"/><line x1="80" y1="1680" x2="230" y2="1680" stroke="#607383" stroke-width="2"/><line x1="230" y1="1470" x2="230" y2="1673" stroke="#607383" stroke-width="2"/><line x1="230" y1="1680" x2="430" y2="1680" stroke="#306f8c" stroke-width="2"/><polygon points="430,1680 422.0,1684.0 422.0,1676.0" fill="#306f8c"/><text x="300" y="1550" font-size="19" fill="#203247" text-anchor="start">B: battente 4h</text><text x="300" y="1610" font-size="19" fill="#203247" text-anchor="start">v_B = 4 m/s</text><text x="35" y="1775" font-size="19" fill="#203247" text-anchor="start">Battente ×4 → rapidità ×2.</text><text x="35" y="1825" font-size="19" fill="#203247" text-anchor="start">Due stati distinti, stessa gravità.</text></svg>
