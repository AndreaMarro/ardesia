<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1660" viewBox="0 0 640 1660" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Reti idrauliche lineari</title><desc id="desc">Tre resistenze consecutive, rete mista e quote di portata a raggi diversi, con pressioni o portate controllate dichiarate.</desc><rect x="0" y="0" width="640" height="1660" fill="white"/><text x="35" y="48" font-size="23" fill="#203247" text-anchor="start">Seguire i nodi prima delle formule</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Tre cadute in serie</text><line x1="65" y1="230" x2="575" y2="230" stroke="#607383" stroke-width="2"/><rect x="100" y="210" width="65" height="40" fill="#d9ecf1"/><text x="132" y="238" font-size="20" fill="#203247" text-anchor="middle">2</text><rect x="270" y="210" width="65" height="40" fill="#d9ecf1"/><text x="302" y="238" font-size="20" fill="#203247" text-anchor="middle">5</text><rect x="440" y="210" width="65" height="40" fill="#d9ecf1"/><text x="472" y="238" font-size="20" fill="#203247" text-anchor="middle">1</text><text x="35" y="330" font-size="19" fill="#203247" text-anchor="start">R in kPa·s/mL; Q = 1,5 mL/s</text><text x="35" y="390" font-size="19" fill="#203247" text-anchor="start">Δp: 3 kPa + 7,5 kPa + 1,5 kPa = 12 kPa</text><text x="35" y="520" font-size="21" fill="#203247" text-anchor="start">2 · Un tratto, poi due rami</text><line x1="60" y1="830" x2="200" y2="830" stroke="#607383" stroke-width="2"/><rect x="85" y="810" width="65" height="40" fill="#d9ecf1"/><text x="117" y="838" font-size="20" fill="#203247" text-anchor="middle">2</text><text x="185" y="875" font-size="19" fill="#203247" text-anchor="start">A</text><text x="535" y="875" font-size="19" fill="#203247" text-anchor="start">B</text><circle cx="200" cy="830" r="5" fill="#306f8c"/><circle cx="540" cy="830" r="5" fill="#306f8c"/><line x1="200" y1="830" x2="250" y2="690" stroke="#607383" stroke-width="2"/><line x1="250" y1="690" x2="490" y2="690" stroke="#607383" stroke-width="2"/><line x1="490" y1="690" x2="540" y2="830" stroke="#607383" stroke-width="2"/><rect x="330" y="670" width="70" height="40" fill="#d9ecf1"/><text x="365" y="697" font-size="20" fill="#203247" text-anchor="middle">6</text><line x1="200" y1="830" x2="250" y2="970" stroke="#607383" stroke-width="2"/><line x1="250" y1="970" x2="490" y2="970" stroke="#607383" stroke-width="2"/><line x1="490" y1="970" x2="540" y2="830" stroke="#607383" stroke-width="2"/><rect x="330" y="950" width="70" height="40" fill="#d9ecf1"/><text x="365" y="977" font-size="20" fill="#203247" text-anchor="middle">6</text><line x1="540" y1="830" x2="590" y2="830" stroke="#607383" stroke-width="2"/><text x="35" y="1080" font-size="19" fill="#203247" text-anchor="start">R in kPa·s/mL; Δp totale = 20 kPa</text><text x="35" y="1130" font-size="19" fill="#203247" text-anchor="start">R_eq = (2 + 3) kPa·s/mL</text><text x="35" y="1260" font-size="21" fill="#203247" text-anchor="start">3 · Due raggi, quote molto diverse</text><text x="35" y="1350" font-size="19" fill="#203247" text-anchor="start">r</text><rect x="170" y="1320" width="20" height="30" fill="#637e55"/><text x="35" y="1430" font-size="19" fill="#203247" text-anchor="start">2r</text><rect x="170" y="1400" width="320" height="30" fill="#3d7791"/><text x="220" y="1350" font-size="19" fill="#203247" text-anchor="start">Q₀</text><text x="505" y="1430" font-size="19" fill="#203247" text-anchor="start">16Q₀</text><text x="35" y="1525" font-size="19" fill="#203247" text-anchor="start">Portata totale: 17Q₀</text><text x="35" y="1580" font-size="19" fill="#203247" text-anchor="start">Frazione del ramo stretto: 1/17</text></svg>
