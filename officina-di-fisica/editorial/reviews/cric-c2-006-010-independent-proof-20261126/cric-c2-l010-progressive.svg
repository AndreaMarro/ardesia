<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1790" viewBox="0 0 640 1790" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Area, film e gocce</title><desc id="desc">Area piana di tre centimetri quadrati, due forze superficiali concordi e gocce con raggio e sovrapressione in rapporto inverso.</desc><rect x="0" y="0" width="640" height="1790" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Contare le superfici, poi calcolare</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Nuova area di una sola interfaccia</text><rect x="150" y="230" width="300" height="100" fill="#d9ecf1"/><text x="300" y="205" font-size="20" fill="#203247" text-anchor="middle">3 cm</text><text x="70" y="285" font-size="19" fill="#203247" text-anchor="start">1 cm</text><text x="300" y="290" font-size="20" fill="#203247" text-anchor="middle">3 cm²</text><text x="35" y="420" font-size="19" fill="#203247" text-anchor="start">γ = 0,050 N/m; ΔE = 15 µJ</text><text x="35" y="540" font-size="21" fill="#203247" text-anchor="start">2 · Un film: due contributi sul bordo</text><rect x="150" y="640" width="300" height="180" fill="#d9ecf1"/><line x1="150" y1="820" x2="450" y2="820" stroke="#607383" stroke-width="5"/><line x1="220" y1="820" x2="220" y2="720" stroke="#306f8c" stroke-width="2"/><polygon points="220,720 224.0,728.0 216.0,728.0" fill="#306f8c"/><line x1="380" y1="820" x2="380" y2="720" stroke="#306f8c" stroke-width="2"/><polygon points="380,720 384.0,728.0 376.0,728.0" fill="#306f8c"/><text x="220" y="690" font-size="19" fill="#203247" text-anchor="middle">1 mN</text><text x="380" y="690" font-size="19" fill="#203247" text-anchor="middle">1 mN</text><text x="300" y="880" font-size="20" fill="#203247" text-anchor="middle">ℓ = 4 cm</text><text x="35" y="955" font-size="19" fill="#203247" text-anchor="start">Due facce: F = 2γℓ = 2 mN</text><text x="35" y="1080" font-size="21" fill="#203247" text-anchor="start">3 · Raggio e sovrapressione</text><circle cx="170" cy="1280" r="30" fill="#d9ecf1"/><circle cx="440" cy="1280" r="120" fill="#d9ecf1"/><line x1="170" y1="1280" x2="200" y2="1280" stroke="#607383" stroke-width="2"/><line x1="440" y1="1280" x2="560" y2="1280" stroke="#607383" stroke-width="2"/><text x="170" y="1450" font-size="20" fill="#203247" text-anchor="middle">R = 1 mm</text><text x="440" y="1450" font-size="20" fill="#203247" text-anchor="middle">R = 4 mm</text><text x="35" y="1540" font-size="19" fill="#203247" text-anchor="start">piccola</text><rect x="180" y="1515" width="240" height="28" fill="#986c35"/><text x="440" y="1540" font-size="19" fill="#203247" text-anchor="start">120 Pa</text><text x="35" y="1620" font-size="19" fill="#203247" text-anchor="start">grande</text><rect x="180" y="1595" width="60" height="28" fill="#3d7791"/><text x="265" y="1620" font-size="19" fill="#203247" text-anchor="start">30 Pa</text><text x="35" y="1720" font-size="19" fill="#203247" text-anchor="start">Una interfaccia sferica: Δp = 2γ/R</text></svg>
