<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1810" viewBox="0 0 640 1810" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Quarta potenza, unità e potenza meccanica</title><desc id="desc">Raggi di due tubi e cadute alla stessa portata, conversione di portata e rettangolo pressione-portata per la potenza.</desc><rect x="0" y="0" width="640" height="1810" fill="white"/><text x="35" y="48" font-size="24" fill="#203247" text-anchor="start">Il controllo cambia il rapporto</text><text x="35" y="110" font-size="21" fill="#203247" text-anchor="start">1 · Stessa portata, raggi diversi</text><circle cx="180" cy="250" r="90" fill="#d9ecf1"/><circle cx="440" cy="250" r="60" fill="#d9ecf1"/><line x1="180" y1="250" x2="270" y2="250" stroke="#607383" stroke-width="2"/><line x1="440" y1="250" x2="500" y2="250" stroke="#607383" stroke-width="2"/><text x="170" y="375" font-size="19" fill="#203247" text-anchor="middle">r_A = 3 mm</text><text x="445" y="375" font-size="19" fill="#203247" text-anchor="middle">r_B = 2 mm</text><text x="35" y="455" font-size="19" fill="#203247" text-anchor="start">Δp_A</text><rect x="170" y="430" width="64" height="28" fill="#3d7791"/><text x="35" y="535" font-size="19" fill="#203247" text-anchor="start">Δp_B</text><rect x="170" y="510" width="324" height="28" fill="#986c35"/><text x="35" y="600" font-size="19" fill="#203247" text-anchor="start">Δp_B / Δp_A = 81/16</text><text x="35" y="710" font-size="21" fill="#203247" text-anchor="start">2 · Prima le unità, poi il prodotto</text><text x="75" y="800" font-size="19" fill="#203247" text-anchor="start">Q = 2,5 mL/s</text><text x="75" y="860" font-size="19" fill="#203247" text-anchor="start">Q = (5/2) × 10⁻⁶ m³/s</text><text x="75" y="940" font-size="19" fill="#203247" text-anchor="start">R_h = 8 × 10⁸ Pa·s/m³</text><text x="75" y="1020" font-size="19" fill="#203247" text-anchor="start">Δp = 2000 Pa = 2 kPa</text><text x="35" y="1150" font-size="21" fill="#203247" text-anchor="start">3 · Un rettangolo di potenza</text><line x1="150" y1="1620" x2="150" y2="1280" stroke="#607383" stroke-width="2"/><line x1="130" y1="1600" x2="530" y2="1600" stroke="#607383" stroke-width="2"/><rect x="150" y="1360" width="200" height="240" fill="#d9ecf1"/><line x1="150" y1="1360" x2="350" y2="1360" stroke="#607383" stroke-width="2"/><line x1="350" y1="1360" x2="350" y2="1600" stroke="#607383" stroke-width="2"/><text x="55" y="1260" font-size="19" fill="#203247" text-anchor="start">Δp (kPa)</text><text x="70" y="1370" font-size="19" fill="#203247" text-anchor="start">3</text><text x="120" y="1630" font-size="19" fill="#203247" text-anchor="start">0</text><text x="345" y="1630" font-size="19" fill="#203247" text-anchor="start">4</text><text x="500" y="1665" font-size="18" fill="#203247" text-anchor="middle">Q (mL/s)</text><text x="185" y="1500" font-size="22" fill="#203247" text-anchor="start">12 mW</text><text x="35" y="1740" font-size="19" fill="#203247" text-anchor="start">1 kPa × 1 mL/s = 1 mW</text></svg>
