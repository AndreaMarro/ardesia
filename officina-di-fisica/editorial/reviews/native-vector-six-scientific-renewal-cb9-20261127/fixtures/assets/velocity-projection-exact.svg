<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-labelledby="title desc"><title id="title">Proiezione di una velocità a modulo costante</title><desc id="desc">Tre orientamenti della stessa freccia: concorde, perpendicolare e opposto all’asse positivo. La componente è rispettivamente positiva, nulla e negativa.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10" fill="#8f4615"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10" fill="#165b8c"/></marker></defs><rect width="860" height="290" fill="#fff"/><g font-family="sans-serif" font-size="17" fill="#172b43"><g><text x="34" y="43">1. θ = 0°</text><line x1="32" y1="145" x2="270" y2="145" stroke="#718198" stroke-width="1"/><line x1="137" y1="145" x2="209" y2="145" stroke="#165b8c" stroke-width="4" marker-end="url(#b)"/><circle cx="137" cy="145" r="3"/><text x="34" y="218">v = 4 m/s</text><text x="34" y="250">+4 m/s</text></g><g><text x="314" y="43">2. θ = 90°</text><line x1="312" y1="145" x2="550" y2="145" stroke="#718198" stroke-width="1"/><line x1="417" y1="145" x2="417" y2="73" stroke="#165b8c" stroke-width="4" marker-end="url(#b)"/><circle cx="417" cy="145" r="3"/><text x="314" y="218">v = 4 m/s</text><text x="314" y="250">0 m/s</text></g><g><text x="594" y="43">3. θ = 180°</text><line x1="592" y1="145" x2="830" y2="145" stroke="#718198" stroke-width="1"/><line x1="697" y1="145" x2="625" y2="145" stroke="#165b8c" stroke-width="4" marker-end="url(#b)"/><circle cx="697" cy="145" r="3"/><text x="594" y="218">v = 4 m/s</text><text x="594" y="250">−4 m/s</text></g></g></svg>
