<?xml version="1.0" encoding="UTF-8"?>
<!-- (c) Andrea Marro - 29/05/2026 - ELAB Tutor - Tutti i diritti riservati
     Swarm 4 Visual Polish + Morfismo (2026-05-29).
     Morfismo Sense 2 upload illustration: USB-C cable arrowing into the
     Nano R4. Vol3 Red accent (the volume that introduces Arduino) +
     Navy primary. Aesthetic: Lego Education physical-first, no Material
     Design generic upload-arrow icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="ELAB Tutor pronti a caricare sul Nano R4">
  <title>Caricamento pronto - collegare il Nano R4 via USB</title>
  <desc>Illustrazione Morfismo: cavo USB-C collegato alla scheda Nano R4, palette Vol3 Rosso Volumi cartacei ELAB</desc>
  <defs>
    <linearGradient id="hcuCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F7F8"/>
    </linearGradient>
    <linearGradient id="hcuBoard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E4D8C"/>
      <stop offset="100%" stop-color="#163A6B"/>
    </linearGradient>
    <linearGradient id="hcuCable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#5A5A6B"/>
    </linearGradient>
  </defs>
  <!-- Background card -->
  <rect x="6" y="6" width="228" height="148" rx="14" fill="url(#hcuCard)" stroke="#E5E5EA" stroke-width="1"/>
  <!-- Vol3 Red accent strip left - Morfismo palette stampa Volume 3 -->
  <rect x="6" y="6" width="6" height="148" rx="3" fill="#E54B3D"/>
  <!-- USB-C cable arching from left -->
  <g>
    <!-- cable curve -->
    <path d="M16 80 Q42 30 80 60" stroke="url(#hcuCable)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- USB-C plug (right end going into board) -->
    <rect x="70" y="54" width="16" height="14" rx="2" fill="#1A1A2E"/>
    <rect x="76" y="58" width="8" height="6" rx="1" fill="#5A5A6B"/>
    <!-- cable host end left edge -->
    <rect x="10" y="74" width="10" height="14" rx="2" fill="#1A1A2E"/>
  </g>
  <!-- Nano R4 board right of cable plug -->
  <g transform="translate(86 44)">
    <rect x="0" y="0" width="120" height="42" rx="3" fill="url(#hcuBoard)"/>
    <!-- pin headers -->
    <g fill="#0D2A52">
      <rect x="2" y="2" width="116" height="5" rx="1"/>
      <rect x="2" y="35" width="116" height="5" rx="1"/>
    </g>
    <!-- pin holes top -->
    <g fill="#FAFAF7" opacity="0.9">
      <circle cx="8" cy="4.5" r="1"/><circle cx="16" cy="4.5" r="1"/><circle cx="24" cy="4.5" r="1"/>
      <circle cx="32" cy="4.5" r="1"/><circle cx="40" cy="4.5" r="1"/><circle cx="48" cy="4.5" r="1"/>
      <circle cx="56" cy="4.5" r="1"/><circle cx="64" cy="4.5" r="1"/><circle cx="72" cy="4.5" r="1"/>
      <circle cx="80" cy="4.5" r="1"/><circle cx="88" cy="4.5" r="1"/><circle cx="96" cy="4.5" r="1"/>
      <circle cx="104" cy="4.5" r="1"/><circle cx="112" cy="4.5" r="1"/>
      <circle cx="8" cy="37.5" r="1"/><circle cx="16" cy="37.5" r="1"/><circle cx="24" cy="37.5" r="1"/>
      <circle cx="32" cy="37.5" r="1"/><circle cx="40" cy="37.5" r="1"/><circle cx="48" cy="37.5" r="1"/>
      <circle cx="56" cy="37.5" r="1"/><circle cx="64" cy="37.5" r="1"/><circle cx="72" cy="37.5" r="1"/>
      <circle cx="80" cy="37.5" r="1"/><circle cx="88" cy="37.5" r="1"/><circle cx="96" cy="37.5" r="1"/>
      <circle cx="104" cy="37.5" r="1"/><circle cx="112" cy="37.5" r="1"/>
    </g>
    <!-- microcontroller chip -->
    <rect x="50" y="14" width="20" height="14" rx="2" fill="#1A1A2E"/>
    <!-- power LED Lime (kit identity Vol1 success palette) -->
    <circle cx="14" cy="20" r="1.8" fill="#4A7A25"/>
    <!-- wordmark -->
    <text x="60" y="24" text-anchor="middle" font-family="Oswald, sans-serif" font-size="5.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">ELAB NANO R4</text>
  </g>
  <!-- Animated arrow indicating flow direction (static SVG, animation
       comes from polish CSS on the host element) -->
  <g transform="translate(104 110)" fill="#E54B3D">
    <path d="M0 0 L20 0 L20 -4 L30 4 L20 12 L20 8 L0 8 Z"/>
  </g>
  <!-- Caption -->
  <text x="120" y="138" text-anchor="middle" font-family="Open Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#C62828">Collegate il Nano R4</text>
  <text x="120" y="150" text-anchor="middle" font-family="Open Sans, system-ui, sans-serif" font-size="9" fill="#5A5A6B">Cavo USB-C dal Nano al computer</text>
</svg>
