[project]
name = "lessonos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "networkx>=3.6.1",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
lessonos = "lessonos.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lessonos"]
