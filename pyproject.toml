[project]
name = "lessonos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6.1",
]

[project.scripts]
lessonos = "lessonos.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.155.2",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lessonos"]
