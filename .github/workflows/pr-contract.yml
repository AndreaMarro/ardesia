name: pr-contract

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: PR contract (owner + acceptance + evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: python3 bin/ci/test_pr_contract_gate.py
      - name: Validate current PR metadata pinned to this event head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 bin/ci/pr_contract_gate.py --current-github
