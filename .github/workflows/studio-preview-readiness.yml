name: studio-preview-readiness

on:
  push:
    branches: [main, "codex/**", "feat/**", "docs/**"]
    paths:
      - ".github/workflows/studio-preview-readiness.yml"
      - ".gitignore"
      - "apps/studio/**"
      - "bin/monorepo.sh"
      - "package.json"
      - "vercel.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/studio-preview-readiness.yml"
      - ".gitignore"
      - "apps/studio/**"
      - "bin/monorepo.sh"
      - "package.json"
      - "vercel.json"

permissions:
  contents: read

concurrency:
  group: studio-preview-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-deploy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: bash -n bin/monorepo.sh
      - name: Studio install policy + materialize
        run: bash bin/monorepo.sh policy-studio-install-check && npm --prefix apps/studio ci --ignore-scripts --no-audit --no-fund
      - run: npm run preview:studio:check
