name: studio-preview-readiness

on:
  # NON aggiungere `branches:` sotto `pull_request`. Il filtro guarda la BASE
  # della PR, non il contenuto: con `branches: [main]` una PR impilata (base
  # wip/..., feat/..., qualunque cosa) non fa MAI partire questo workflow e
  # arriva con un check in meno. Visto il 2026-07-29 su #218 (base
  # wip/desktop-loop-continuity): 4 check contro i 5 di #217 (base main).
  # Il buco si auto-guarisce quando la PR padre entra in main e GitHub
  # ri-punta la base -> a posteriori l'evidenza sparisce e nessuno se ne
  # accorge. Lista di prefissi = allowlist da aggiornare a mano: regredisce
  # al primo prefisso nuovo (il repo ne ha gia' 18). L'unica forma che non
  # regredisce e' nessun filtro: ogni PR, qualunque base.
  # Invariante applicata da bin/ci/workflow_trigger_gate.py nel job hygiene.
  #
  # `paths:` invece filtra sul CONTENUTO del diff ed e' voluto: se la PR non
  # tocca lo studio non c'e' niente da verificare. Attenzione pero' a renderlo
  # required in branch protection: un check required che non parte mai lascia
  # la PR bloccata su "Expected — waiting for status to be reported". Servirebbe
  # prima un job che riporta sempre, anche a skip.
  pull_request:
    paths:
      - ".github/workflows/studio-preview-readiness.yml"
      - ".gitignore"
      - "apps/studio/**"
      - "bin/monorepo.sh"
      - "package.json"
      - "vercel.json"
  # Su push solo main: e' lo stato INTEGRATO dopo il merge, l'unico che il
  # check sulla PR non ha mai visto (due PR verdi possono confliggere in
  # semantica). I prefissi di branch che stavano qui (codex/**, feat/**,
  # docs/**) servivano a rimediare al filtro sopra: ora sono rumore che
  # duplica ogni run gia' coperta da `pull_request`.
  push:
    branches: [main]
    paths:
      - ".github/workflows/studio-preview-readiness.yml"
      - ".gitignore"
      - "apps/studio/**"
      - "bin/monorepo.sh"
      - "package.json"
      - "vercel.json"

permissions:
  contents: read

concurrency:
  group: studio-preview-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-deploy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: bash -n bin/monorepo.sh
      - run: npm --prefix apps/studio ci
      - run: npm run preview:studio:check
