name: Cric corpus engineering
on:
  pull_request:
    paths:
      - 'officina-di-fisica/**'
      - '.github/workflows/cric-corpus.yml'
  push:
    branches: [officina-di-fisica]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cric-corpus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-24.04
    # Full corpus rendering remains exhaustive, in bounded isolated processes.
    timeout-minutes: 180
    env:
      ASTRA_CHROME: /usr/bin/google-chrome
      ASTRA_RESULTS: var/corpus-browser
      ASTRA_BROWSER_WORKERS: '4'
    defaults:
      run:
        working-directory: officina-di-fisica
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: officina-di-fisica
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Sorgenti immutabili e strumenti solo editoriali
        run: |
          git fetch --depth=1 --filter=blob:none origin 5cfbdcb055ba3ba136f97fb56e997f06e6cf3605
          git fetch --depth=1 --filter=blob:none origin 5d1dc8dc7b601aef959d10d564c75462be74708d
          git fetch --depth=1 --filter=blob:none origin 493df796527bdb31b71f223343384656258e8e3a
          git fetch --depth=1 --filter=blob:none origin da2d1ad10542c0d5054650aa8a8e6c46d9ca4f1b
          python3 -m venv var/corpus-venv
          var/corpus-venv/bin/pip install -r tools/corpus_engineering/requirements.txt
          npm ci --no-audit --no-fund
      - name: Controprove scientifiche e importazione canonica senza pubblicazione
        run: |
          var/corpus-venv/bin/python -m unittest discover -s tests/corpus -v
          var/corpus-venv/bin/python -m tools.corpus_engineering.batches
          var/corpus-venv/bin/python -m tools.corpus_engineering.integration --registry --output var/corpus-coexistence.json
          cmp editorial/reviews/registry-coexistence.json var/corpus-coexistence.json
      - name: Riproduzione del checkpoint di tutti i 4606 ID
        run: |
          var/corpus-venv/bin/python -c "from pathlib import Path; from tools.corpus_engineering.pipeline import load_checkpoint; load_checkpoint(Path('editorial/corpus'))"
          var/corpus-venv/bin/python -m tools.corpus_engineering --source-ref 5cfbdcb055ba3ba136f97fb56e997f06e6cf3605 --cric-ref 5d1dc8dc7b601aef959d10d564c75462be74708d --destination var/corpus-reproduction
          cmp editorial/corpus/checkpoint.json var/corpus-reproduction/checkpoint.json
      - name: Ripresa delle anteprime vincolata alle prove terminali
        run: node --test tests/corpus/browser-batches-resume.test.mjs
      - name: Anteprime private e controllo delle formule a tre larghezze
        run: node tests/corpus/browser-batches.mjs
      - name: Boundary del pacchetto distribuito
        run: |
          python3 tools/package_release.py var/corpus-release.zip --verify
          var/corpus-venv/bin/python -m tools.corpus_engineering.release_check var/corpus-release.zip
      - name: Evidenze tecniche delle anteprime editoriali DRAFT
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cric-corpus-${{ github.sha }}
          path: |
            officina-di-fisica/var/corpus-browser/
            officina-di-fisica/var/corpus-coexistence.json
          if-no-files-found: warn
          retention-days: 14
