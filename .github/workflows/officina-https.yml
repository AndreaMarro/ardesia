name: Officina HTTPS multipiattaforma

on:
  pull_request:
    paths:
      - 'officina-di-fisica/api/**'
      - 'officina-di-fisica/vercel.json'
      - 'officina-di-fisica/tests/browser-pubblicazione.mjs'
      - '.github/workflows/officina-https.yml'
  push:
    branches: [officina-di-fisica]
    paths:
      - 'officina-di-fisica/api/**'
      - 'officina-di-fisica/vercel.json'
      - 'officina-di-fisica/tests/browser-pubblicazione.mjs'
      - '.github/workflows/officina-https.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  percorso:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, browser: edge, install: msedge}
          - {os: windows-2025, browser: firefox, install: firefox}
          - {os: ubuntu-24.04, browser: chromium, install: chromium}
          - {os: ubuntu-24.04, browser: firefox, install: firefox}
          - {os: macos-15, browser: webkit, install: webkit}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: officina-di-fisica
    env:
      OFFICINA_BASE_URL: https://officina-di-fisica.vercel.app
      ASTRA_EVIDENCE: prove-https
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: officina-di-fisica
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.install }}
      - run: node tests/browser-pubblicazione.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: https-${{ matrix.os }}-${{ matrix.browser }}
          path: officina-di-fisica/prove-https/
          if-no-files-found: ignore
