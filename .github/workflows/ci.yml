name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: studio (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: python3 bin/ci/action_pin_gate.py
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: vitest (deterministic profile)
        run: >
          npx vitest run
          --pool=threads --maxWorkers=1 --no-file-parallelism
          --testTimeout=30000 --hookTimeout=30000 --teardownTimeout=30000
      - run: npm run build

  engine:
    name: engine (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: python3 bin/ci/action_pin_gate.py
        working-directory: ${{ github.workspace }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
      - name: pytest (live tests self-skip without API keys)
        run: uv run --locked pytest -q

  hygiene:
    name: hygiene (NUL + secrets + boundary + whitespace)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Candidate identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$TESTED_SHA"
          head_sha="${PR_HEAD_SHA:-$TESTED_SHA}"
          base_sha="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          test -n "$head_sha"
          test -n "$base_sha"
          printf 'event=%s\ntested_sha=%s\nhead_sha=%s\nbase_sha=%s\ntree_sha=%s\n' \
            "$EVENT_NAME" "$TESTED_SHA" "$head_sha" "$base_sha" \
            "$(git rev-parse HEAD^{tree})"
      - name: action pin gate tests
        run: python3 bin/ci/test_action_pin_gate.py
      - name: action pin gate
        run: python3 bin/ci/action_pin_gate.py
      - name: NUL scan (tracked text files)
        run: python3 bin/ci/nul_scan.py
      - name: secret scan (high-confidence patterns)
        run: python3 bin/ci/secret_scan.py
      - name: secret scan tests
        run: python3 bin/ci/test_secret_scan.py
      - name: governance canon gate tests
        run: python3 bin/ci/test_governance_canon_gate.py
      - name: governance canon
        run: python3 bin/ci/governance_canon_gate.py
      - name: ELAB standalone boundary (ratchet)
        run: python3 bin/ci/elab_boundary_gate.py
      - name: whitespace errors (git diff --check)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # niente --depth=1: su clone full (fetch-depth: 0) il fetch shallow
          # innesta il tip di main senza parent -> merge-base vuoto quando la
          # PR e' stale vs main -> "fatal: bad revision ''" (visto su #94).
          git fetch origin "$BASE_REF"
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          test -n "$base" || { echo "merge-base vuoto: origin/$BASE_REF vs HEAD" >&2; exit 1; }
          # sim/solver/engine è vendored byte-identico da ELAB (drift-guard
          # sha256 nei test): il whitespace del sorgente canonico non si tocca.
          git diff --check "$base" HEAD -- . ':(exclude)apps/studio/sim/solver/engine/'
