name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: E2E runner safety self-test (sentinel containers)
        run: bin/ci/web-e2e-physics-pathways.sh --self-test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.5.1
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run build:web
        env:
          VITE_S20_LEARNING_JOURNEY: '1'
      - name: Public static build (all cases must match Core)
        run: npm run build:web:public
      - name: Install browser for the backend-free public preview
        run: npx playwright install --with-deps chromium
      - name: Public preview in a real browser, with no API
        run: npm run e2e:public --workspace @ardesia/web
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install the disposable Study API environment
        run: uv sync --project services/study-api --frozen --python 3.13
      - name: Exact lesson, sources and student journey on the compiled merge tree
        env:
          ARDESIA_STUDY_PYTHON: ${{ github.workspace }}/services/study-api/.venv/bin/python
        run: python3 bin/qa/verify-integrated-consumers.py --output "$RUNNER_TEMP/g0-integrated-consumers"
      - name: Build the ordinary Studio paired with Aula for the unified G0
        env:
          ARDESIA_STUDIO_BASE: /studio/
        run: |
          npm ci --prefix apps/studio --no-audit --no-fund
          npm run build --prefix apps/studio
      - name: Unified teacher and student G0, followed by PDF composition geometry
        env:
          ARDESIA_G0_OUTPUT: ${{ runner.temp }}/g0-unified
          ARDESIA_G0_STATE: ${{ runner.temp }}/g0-unified/private-state
          ARDESIA_G0_RESULT: ${{ runner.temp }}/g0-unified/result.json
          ARDESIA_G0_LAYOUT_OUTPUT: ${{ runner.temp }}/g0-unified-layout
          ARDESIA_G0_PYTHON: ${{ github.workspace }}/services/study-api/.venv/bin/python
        run: |
          node handoffs/swarm-v2/S18/g0-composition-20261026/verify-golden.mjs
          node handoffs/swarm-v2/S18/g0-composition-20261026/verify-layout.mjs
      - name: Integrated journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-integrated-consumers-${{ github.sha }}
          # Synthetic private fixture/session files are outside this directory.
          path: |
            ${{ runner.temp }}/g0-integrated-consumers/**/*.json
            ${{ runner.temp }}/g0-integrated-consumers/**/*.png
            ${{ runner.temp }}/g0-integrated-consumers/**/*.log
            ${{ runner.temp }}/g0-unified/result.json
            ${{ runner.temp }}/g0-unified/*.png
            ${{ runner.temp }}/g0-unified/core-server.log
            ${{ runner.temp }}/g0-unified-layout/layout.json
            ${{ runner.temp }}/g0-unified-layout/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Teacher physics pathways in a real browser, on disposable SQLite
        env:
          ARDESIA_STUDY_PYTHON: ${{ github.workspace }}/services/study-api/.venv/bin/python
        run: bin/ci/web-e2e-physics-pathways.sh
      - name: Teacher-path evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-physics-pathways-${{ github.sha }}
          path: apps/web/test-results/physics-pathways.*
          if-no-files-found: warn
          retention-days: 14
      - name: Independent study and science library on the current merge tree
        env:
          ARDESIA_STUDY_PYTHON: ${{ github.workspace }}/services/study-api/.venv/bin/python
          ARDESIA_S00_SCIENCE_EVIDENCE: ${{ runner.temp }}/science-composition
          S06_SOURCE_MANIFEST: ${{ runner.temp }}/study-source-manifest.json
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/consumer-source-commit.txt"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          paths = ['apps/web/src/App.tsx', 'services/study-api/study_api/app.py', 'apps/web/src/components/SourceViewer.tsx']
          manifest = {'scope': 'actual CI checkout, clean HEAD checked before and after browser', 'files': [
              {'path': p, 'candidateSha256': hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in paths]}
          Path(os.environ['S06_SOURCE_MANIFEST']).write_text(json.dumps(manifest))
          PY
          services/study-api/.venv/bin/python handoffs/swarm-v2/S00/prove-study.py --output "$RUNNER_TEMP/study-composition"
          node handoffs/swarm-v2/S00/prove-science.cjs
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/consumer-source-commit.txt")"
          test -z "$(git status --porcelain -- apps/web/src services/study-api packages/engine/lessonos)"
      - name: Integrated consumer browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-consumers-${{ github.sha }}
          # Allowlist proofs; never upload a fixture DB or access file left by an OOM.
          path: |
            ${{ runner.temp }}/study-composition/result.json
            ${{ runner.temp }}/study-composition/*.png
            ${{ runner.temp }}/study-composition/api.log
            ${{ runner.temp }}/science-composition/consumer-report.json
            ${{ runner.temp }}/science-composition/*.png
            ${{ runner.temp }}/science-composition/api.log
            ${{ runner.temp }}/study-source-manifest.json
            ${{ runner.temp }}/consumer-source-commit.txt
          if-no-files-found: warn
          retention-days: 14

  study-api:
    name: study-api (HTTP + shared Core)
    runs-on: ubuntu-latest
    # Disposable synthetic databases only; no Supabase/production credentials.
    services:
      postgres:
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: ardesia_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ardesia_fixture -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: HTTP and domain contracts (live Supabase skip explicit)
        env:
          PYTHONPATH: packages/engine:services/study-api
          ARDESIA_TEST_POSTGRES_URL: postgresql://ardesia_fixture@127.0.0.1:5432/postgres
        run: uv run --project services/study-api python -m pytest packages/engine/tests/study services/study-api/tests -q -rs
      - name: Local teaching artifact routes and data isolation
        run: python3 -m unittest discover -s bin/tests -p 'test_teaching*.py'

  study-mcp:
    name: study-mcp (official SDK stdio + HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install separate API and MCP environments
        run: |
          uv sync --project services/study-api --frozen --python 3.13
          uv venv --python 3.13 .mcp-ci-venv
          uv pip install --python .mcp-ci-venv/bin/python -r services/study-mcp/requirements.lock
      - name: Read-only boundaries and actual official stdio to disposable Core
        env:
          PYTHONPATH: services/study-mcp
          ARDESIA_MCP_TEST_API_PYTHON: ${{ github.workspace }}/services/study-api/.venv/bin/python
        run: .mcp-ci-venv/bin/python -m unittest discover -s services/study-mcp/tests -v

  studio:
    name: studio (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: vitest (deterministic profile)
        run: >
          npx vitest run
          --pool=threads --maxWorkers=1 --no-file-parallelism
          --testTimeout=30000 --hookTimeout=30000 --teardownTimeout=30000
      - name: Install Chromium for real cross-tab audio revocation
        run: npx playwright install --with-deps chromium
      - name: Synthetic native audio — MediaRecorder, Web Locks and BroadcastChannel
        run: node ../../bin/qa/audio-cross-view.mjs "$RUNNER_TEMP"
      - run: npm run build

  engine:
    name: engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # Live model tests require a separate explicit invocation, even when a
      # developer environment happens to contain provider credentials.
      # -rs keeps every skipped contract visible in the CI evidence.
      - name: pytest (live models require explicit opt-in)
        run: uv run pytest -q -rs

  # Lane ADVISORY, non richiesta: esegue il solo golden path, che e' l'obiettivo
  # del prodotto scritto come comando con un exit code.
  #
  # Misurato il 2026-07-30: 101 spec Playwright scritte (22 in apps/studio, 79 in
  # plugins/elab-tutor), `grep -rl playwright .github/workflows/` non trovava
  # NIENTE, e almeno una di quelle spec — `e2e/product-flow-shell.spec.ts` — era
  # ROSSA contro `main` senza che nessuno lo sapesse. Una spec che nessuno esegue
  # non e' un oracolo: e' un file.
  #
  # Perche' SOLO il golden path e non tutte e 101: le altre non sono mai state
  # verdi in CI, e portarle dentro tutte insieme renderebbe questa lane rumore
  # dal primo giorno — un check che fallisce sempre viene ignorato, e un check
  # ignorato non protegge niente. Si allarga quando una classe alla volta e'
  # verde, non prima.
  #
  # `continue-on-error: true`: riporta, non blocca. Diventa required solo dopo
  # che ha riportato un esito su almeno cinque PR consecutive (unita' F1-3).
  e2e-golden-path:
    name: e2e golden path (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: golden path (l'obiettivo, come exit code)
        run: npx playwright test e2e/golden-path.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-path-traces-${{ github.sha }}
          path: apps/studio/test-results/
          if-no-files-found: ignore
          retention-days: 14

  hygiene:
    name: hygiene (NUL + secrets + boundary + whitespace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # Gli step seguenti eseguono script versionati nella PR: nessun
          # GITHUB_TOKEN deve restare leggibile nella config git.
          persist-credentials: false
      - name: NUL scan (tracked text files)
        run: python3 bin/ci/nul_scan.py
      - name: secret scan (high-confidence patterns)
        run: python3 bin/ci/secret_scan.py
      - name: secret scan tests
        run: python3 bin/ci/test_secret_scan.py
      - name: ELAB standalone boundary (ratchet)
        run: python3 bin/ci/elab_boundary_gate.py
      # hygiene e' un check REQUIRED su main: la regola "nessun filtro di base
      # sotto pull_request" vive qui perche' un commento nel workflow lo si
      # cancella senza che nessuno se ne accorga, un check rosso no.
      - name: workflow trigger gate (copertura indipendente dalla base)
        run: python3 bin/ci/workflow_trigger_gate.py
      - name: workflow trigger gate tests
        run: python3 bin/ci/workflow_trigger_gate.py --self-test
      # Da 16 finding avversariali su 20 classificati come meccanicamente
      # controllabili il 2026-07-30: il revisore costa 20-40 minuti per round e ne
      # spendeva l'80% su cose che uno script trova in due secondi.
      - name: doc claims gate (un documento non afferma cio' che il repo smentisce)
        run: python3 bin/ci/doc_claims_gate.py
      - name: doc claims gate tests
        run: python3 bin/ci/doc_claims_gate.py --self-test
      - name: Adopted source and artifact inventory contracts
        run: python3 bin/audit/test_legacy_inventory.py
      - name: Immutable question inbox QA contracts
        run: python3 bin/pro-regia/test_question_inbox_adapter.py
      - name: Public candidate integrity and static upload contracts
        run: python3 -m unittest discover -s bin/tests -p 'test_teaching*.py'
      # Stato corrente generato a macchina (F0-1). `--verify` gira OFFLINE e
      # asserisce che il generatore legga l'HEAD REALE del repo: se restituisse
      # una costante o un valore memorizzato, questa asserzione fallirebbe al
      # primo commit nuovo. E' la forma eseguibile di «il JSON cambia quando
      # cambia main».
      - name: project state — funzioni pure
        run: python3 bin/state/project_state.py --self-test
      - name: project state — test
        run: python3 bin/state/test_project_state.py
      - name: project state — legge il repo reale (offline)
        run: python3 bin/state/project_state.py --verify
      - name: project state — genera lo stato di QUESTO SHA
        env:
          ARDESIA_STATE_OFFLINE: "1"
        run: python3 bin/state/project_state.py
      - name: project state — pubblica l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-state-${{ github.sha }}
          path: |
            artifacts/state/project.json
            docs/ops/CURRENT.md
          if-no-files-found: error
          retention-days: 30
      - name: whitespace errors (git diff --check)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # niente --depth=1: su clone full (fetch-depth: 0) il fetch shallow
          # innesta il tip di main senza parent -> merge-base vuoto quando la
          # PR e' stale vs main -> "fatal: bad revision ''" (visto su #94).
          # Repo privato: il fetch ha bisogno di credenziale. La si monta qui e
          # la si smonta subito, cosi' nessuno step successivo puo' leggerla.
          trap 'git config --local --unset-all "http.https://github.com/.extraheader" || true' EXIT
          git config --local "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git fetch --no-tags origin "$BASE_REF"
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          test -n "$base" || { echo "merge-base vuoto: origin/$BASE_REF vs HEAD" >&2; exit 1; }
          # sim/solver/engine è vendored byte-identico da ELAB (drift-guard
          # sha256 nei test): il whitespace del sorgente canonico non si tocca.
          git diff --check "$base" HEAD -- . ':(exclude)apps/studio/sim/solver/engine/'
