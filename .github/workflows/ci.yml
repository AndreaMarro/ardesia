name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: studio (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: vitest (deterministic profile)
        run: >
          npx vitest run
          --pool=threads --maxWorkers=1 --no-file-parallelism
          --testTimeout=30000 --hookTimeout=30000 --teardownTimeout=30000
      - run: npm run build

  engine:
    name: engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # -rs stampa ogni skip con la sua ragione: il check resta verde solo con
      # lo skip DICHIARATO nel log, mai con una copertura sparita in silenzio.
      - name: pytest (skip dei test live esplicito senza API key)
        run: uv run pytest -q -rs

  # Lane ADVISORY, non richiesta: esegue il solo golden path, che e' l'obiettivo
  # del prodotto scritto come comando con un exit code.
  #
  # Misurato il 2026-07-30: 101 spec Playwright scritte (22 in apps/studio, 79 in
  # plugins/elab-tutor), `grep -rl playwright .github/workflows/` non trovava
  # NIENTE, e almeno una di quelle spec — `e2e/product-flow-shell.spec.ts` — era
  # ROSSA contro `main` senza che nessuno lo sapesse. Una spec che nessuno esegue
  # non e' un oracolo: e' un file.
  #
  # Perche' SOLO il golden path e non tutte e 101: al 2026-07-30 le altre non
  # erano mai state verdi in CI, e portarle dentro tutte insieme avrebbe reso
  # questa lane rumore dal primo giorno — un check che fallisce sempre viene
  # ignorato, e un check ignorato non protegge niente.
  #
  # ⚠️ RIMISURATO il 2026-08-22, e la frase qui sopra NON REGGE PIU' com'era
  # scritta: `npx playwright test --workers=3` su apps/studio esce 0, `40
  # passed` su 24 file di spec. Tutte verdi, comprese le 22 che questa lane non
  # carica, e compresa `e2e/product-flow-shell.spec.ts` che il commento di
  # allora citava come rossa. Una giustificazione con dentro un numero va
  # rimisurata o cade: questa e' rimasta a decidere per tre settimane dopo
  # essere diventata falsa.
  #
  # Il numero qui sopra e' registrato — `bin/measure.sh`, receipt
  # `2026-08-22-R-VENTITRE-SPEC-VERDI-E-UNA-CORSIA-CHE-NON-BLOCCA` nel vault —
  # ma NESSUNO SCRIPT LO RIMISURA: fra tre settimane potrebbe essere invecchiato
  # esattamente come quello che sostituisce. Detto, non nascosto.
  #
  # Cio' che la misura NON dice: quelle 24 sono verdi in LOCALE (macOS, node
  # v26.5.1, chromium). Nessuna delle 22 e' MAI stata eseguita su
  # ubuntu-latest/node 22 — di li' non esiste una singola osservazione. Per
  # questo l'allargamento resta UNA ALLA VOLTA, nel job `e2e-journey` qui
  # sotto, e ognuna entra solo dopo essere stata vista fallire su una
  # mutazione del PRODOTTO.
  #
  # `continue-on-error: true`: riporta, non blocca. Diventa required solo dopo
  # che ha riportato un esito su almeno cinque PR consecutive (unita' F1-3).
  #
  # Perche' `e2e-journey` qui sotto blocca invece dal primo giorno, senza
  # passare da quella soglia: la soglia delle cinque PR serve a stimare se un
  # check e' stabile quando NON si sa perche' fallisce. Ogni journey di
  # `e2e-journey` entra invece con una mutazione di controllo alle spalle — e'
  # stato visto rosso su un difetto del prodotto e verde senza — quindi di quel
  # check si sa gia' cosa lo fa fallire. Sono due modi di guadagnarsi la
  # fiducia, non due pesi e due misure.
  e2e-golden-path:
    name: e2e golden path (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: golden path (l'obiettivo, come exit code)
        run: npx playwright test e2e/golden-path.spec.ts --forbid-only --reporter=line
      # `toolhost-srcdoc-bypass` e' stata RESPINTA dal cancello che blocca il
      # 2026-08-22: il suo terzo test asserisce che il bypass di sandbox del
      # Tool Lab ESISTE ANCORA, quindi in un job bloccante sarebbe un cancello
      # che difende la vulnerabilita' — chi implementa ADR-0001 troverebbe la
      # PR rossa.
      #
      # Ma respingerla dal cancello non deve voler dire non eseguirla mai: e'
      # l'unica prova viva che quel confine e' quello che e', e senza nessuna
      # corsia che la esegua il giorno in cui ADR-0001 chiudera' il buco
      # nessuno se ne accorgerebbe dalla CI. Qui e' al posto giusto: ADVISORY
      # riporta senza bloccare, e il flip da verde a rosso e' il SEGNALE che
      # l'enforcement e' arrivato — da leggere, non da subire.
      - name: characterization del bypass srcDoc (flip atteso quando ADR-0001 chiude il buco)
        if: ${{ !cancelled() }}
        run: npx playwright test e2e/toolhost-srcdoc-bypass.spec.ts --forbid-only --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-path-traces-${{ github.sha }}
          path: apps/studio/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Lane che BLOCCA — il contrario della lane advisory qui sopra, e per una
  # ragione precisa: questo journey non riporta un difetto, lo impedisce.
  #
  # Issue #246, misurata il 2026-08-22: ElabLab.tsx markMistake() emetteva
  # `error.observed` sul bus e incrementava il contatore nella stessa funzione
  # sincrona, mentre il binding host faceva `void log.append(...)`. La vista
  # dichiarava «errori segnati: 1» con la scrittura ancora in volo: chi
  # ricaricava in quella finestra perdeva l'errore appena segnato, DOPO aver
  # letto che era segnato. Le 4 spec e2e che coprivano ELAB Lab non lo vedevano
  # perche' nessuna naviga: restano nella vista montata, e un difetto di
  # durabilita' e' invisibile finche' nessuno spegne la luce.
  #
  # Perche' questa e' required e il golden path no: il golden path e' un
  # obiettivo largo che non e' mai stato verde in CI: renderlo bloccante
  # significherebbe un rosso permanente, cioe' un check che si impara a
  # ignorare. Questo journey e' UNO, e' stato visto rosso contro il codice di
  # prima e verde dopo il rimedio, e la sua mutazione di controllo (rimettere
  # il contatore sull'emit) lo riporta rosso. Un check con quelle tre misure
  # alle spalle puo' bloccare dal primo giorno.
  #
  # ⚠️ gate-Andrea: «required» qui significa «senza continue-on-error», cioe'
  # un rosso di questo job fa rosso il workflow. La LISTA dei required status
  # checks della branch protection e' un'impostazione di repo, non un file di
  # questo albero: non la puo' cambiare questo commit. Finche' quella lista non
  # nomina `e2e journey (blocca)`, il check e' bloccante nel workflow ma non nel
  # merge button.
  # La LISTA dei journey che bloccano. Cresce di UNA RIGA per giro, e ogni riga
  # e' in `git log` con la misura che l'ha fatta entrare: una spec verde che non
  # e' mai stata vista rossa non e' un oracolo dimostrato, e' un file che passa.
  # Uno step per journey, cosi' il log di CI nomina QUALE si e' rotto.
  # Niente glob: un glob farebbe entrare anche cio' che nessuno ha visto fallire.
  e2e-journey:
    name: e2e journey (blocca)
    runs-on: ubuntu-latest
    # Un journey impiantato consumerebbe il default di GitHub (6 ore) tenendo
    # ferma la coda: un cancello che non risponde non e' piu' un cancello.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # `--forbid-only`: senza, un `test.only` dimenticato in una spec rende
      # questo job VERDE avendo eseguito un test solo. Un cancello che si puo'
      # disarmare con una parola dentro il file che sorveglia non sorveglia.
      #
      # `if: ${{ !cancelled() }}` su ogni journey dopo il primo: di default uno
      # step non gira se il precedente e' fallito, e la lista e' destinata a
      # crescere. Senza, il primo rosso nasconde tutti i journey successivi e il
      # log di CI racconta un difetto quando ce ne sono tre.
      - name: la memoria della lezione sopravvive alla navigazione (#246)
        run: npx playwright test e2e/elab-lab-marcatura-durabile.spec.ts --forbid-only --reporter=line
      # Entrata il 2026-08-22. E' la spec che il commento della lane advisory
      # citava come rossa contro main senza che nessuno lo sapesse; oggi e'
      # verde. Misura che ne giustifica l'ingresso, e non era ovvia: con una
      # QUARTA voce di nav ("Marketplace") iniettata in ViewNav — una
      # violazione del perimetro Founder Beta — questa spec esce 1, mentre
      # `golden-path` esce 0 e il journey #246 esce 0. Il cancello di oggi, in
      # tutte le sue forme, quella regressione la lascerebbe passare.
      - name: shell del docente - Lezione, Continuita, Materiali, stessa Lezione
        if: ${{ !cancelled() }}
        run: npx playwright test e2e/product-flow-shell.spec.ts --forbid-only --reporter=line
      # Entrata il 2026-08-22. Mutazione discriminante: `RecoveryReport.recovered`
      # forzato a 0 in `IndexedDbEventLog.open()` -> questa spec esce 1, mentre
      # golden-path, il journey #246 e il journey shell docente escono tutti 0.
      # La conseguenza di quella mutazione non e' solo un test rosso: bootstrap
      # scrive il marker di telemetria solo se `recovered` e' maggiore di zero,
      # quindi con recovered sempre 0 `dataLoss` non diventa mai true e l'avviso
      # «memoria non trovata, ripristina da export» (EVENTLOG-PERSISTENCE-SPEC
      # §4.4) diventa IRRAGGIUNGIBILE: la perdita di una lezione tornerebbe
      # silenziosa. Questo journey e' l'unico che se ne accorge.
      #
      # ⚠️ RESPINTA nello stesso giro, e vale la pena saperlo qui:
      # `e2e/toolhost-srcdoc-bypass.spec.ts` e' verde ma NON entra. Il suo terzo
      # test asserisce che il bypass di sandbox ESISTE ANCORA — e' la
      # characterization di un difetto noto, scritta per diventare rossa quando
      # ADR-0001 lo chiude. In un job che blocca sarebbe un cancello che difende
      # la vulnerabilita': chi ripara troverebbe la PR rossa. Il criterio
      # d'ingresso non e' «la spec e' verde», e' «cosa si rompe se il prodotto
      # PEGGIORA».
      #
      # ⚠️ Due precisazioni che la revisione ha strappato a questo stesso step,
      # e senza le quali il commento qui sopra direbbe piu' di cio' che e' stato
      # misurato:
      #   1. NON e' un journey. La spec importa direttamente
      #      `/src/lessonos/indexedDbEventLog.ts` via `page.evaluate`: non
      #      attraversa nessuna vista, nessun bottone, nessun bus. E' il
      #      contratto di un modulo esercitato in un browser vero — che e'
      #      esattamente cio' che serve per la semantica multi-tab di IndexedDB,
      #      e che jsdom non sa dare. Lo step si chiama per quello che e'.
      #   2. La mutazione che l'ha fatta entrare (`recovered: 0`) dimostra che
      #      questa spec sorveglia il RECOVERY REPORT. NON dimostra che
      #      sorvegli l'exactly-once fra due tab: la mutazione che mirava li' —
      #      togliere la serializzazione `writeQueue` da `append()` — non e'
      #      stata presa da NESSUNA spec, candidata compresa (4 exit 0 su 4),
      #      perche' la transazione readwrite di IndexedDB serializza gia'
      #      l'allocazione del seq. Quindi: la parte multi-tab dell'invariante
      #      e' DICHIARATA, non dimostrata, e la `writeQueue` e' una garanzia
      #      che nessun test misura. Il codice non e' stato toccato.
      #
      # Rischio noto sul primo giro reale in CI: 100 append piu' un cold reopen
      # ereditano il timeout di 30s della config di Playwright. Su un runner
      # lento questa e' la candidata piu' plausibile a un rosso che NON e' un
      # difetto del prodotto. Se succede, si misura il tempo prima di toccare
      # il prodotto.
      - name: contratto event-log su piu' tab - exactly-once, contiguo, durevole a freddo
        if: ${{ !cancelled() }}
        run: npx playwright test e2e/lessonos-eventlog-multitab.spec.ts --forbid-only --reporter=line
      # Entrata il 2026-08-22. Mutazione discriminante trovata al primo colpo:
      # `SavedLessonsView.restoreMessage()`, ramo `no-snapshot`, smette di dire
      # «il bundle non contiene memoria LessonOS» e dice solo «Import
      # completato.» -> questa spec esce 1, golden-path e gli altri tre journey
      # del cancello escono tutti 0.
      #
      # Cosa costa quella mutazione a un docente: importa un bundle SENZA la
      # memoria della lezione credendo che la memoria sia arrivata. E' la stessa
      # famiglia di #246 — una UI che tace su cio' che non c'e' — spostata dal
      # percorso di marcatura a quello di import.
      #
      # E porta una promessa che nessun altro journey fa: durante preview,
      # commit, export e riapertura a freddo NESSUNA richiesta esce verso un
      # host diverso da localhost. Il repository contiene i tre volumi e
      # citazioni verbatim: una richiesta uscente li' e' un incidente.
      # ⚠️ COSTO di questo ingresso, dichiarato invece che scoperto dopo: la
      # mutazione che l'ha fatto entrare rompe una STRINGA visibile all'utente,
      # e la spec la asserisce per sottostringa. Chi riscrive quel messaggio —
      # una traduzione, una rifrasatura — trova questo job rosso senza aver
      # rotto niente. Non e' un difetto del test: quel messaggio E' la promessa
      # («dire al docente cosa NON e' arrivato»), quindi fissarlo e' fissare la
      # promessa, e cambiarlo deve passare da una decisione, non da una svista.
      # Ma il costo va saputo prima, non scoperto con la PR rossa in mano.
      - name: Materiali del docente - preview, commit, export, riapertura a freddo, e tutto resta locale
        if: ${{ !cancelled() }}
        run: npx playwright test e2e/saved-lessons.spec.ts --forbid-only --reporter=line
      # Entrata il 2026-08-22, ed e' il primo journey del cancello che difende
      # una VERITA' FISICA invece di un comportamento software.
      # v1-cap6-esp2 e' l'esperimento del libro «LED senza resistore (cosa NON
      # fare!)», Vol.1 p.32: il verdetto onesto e' BRUCIATO, e l'intestazione
      # della spec lo scrive come divieto — «mai un finto acceso».
      #
      # Mutazione discriminante: `LED_STRESS_THRESHOLDS.pericoloMaxAmps` da 0.1
      # a 100 in `apps/studio/sim/solver/elabSolver.ts`, cosi' la zona
      # «pericolo» inghiotte il caso senza-resistore (~1A) e
      # `reinterpretLedStress` declassa il verdetto del motore. La spec esce 1
      # con la bugia verbatim nel DOM —
      # `<dd data-led-on="1" data-led-count="1" data-led-burned="0">acceso</dd>`
      # — mentre golden-path e gli altri quattro journey escono tutti 0.
      # Cosa costa: il prodotto insegnerebbe che si puo' pilotare un LED senza
      # resistore. Un declassamento del verdetto elettrico e' piu' grave di un
      # bottone rotto, perche' insegna la cosa sbagliata a chi impara.
      #
      # ⚠️ Bersaglio sbagliato, misurato prima di trovare quello giusto:
      # `plugins/elab-tutor/src/.../engine/CircuitSolver.js` NON e' il motore
      # dello Studio — `elabSolver.ts` importa `./engine/CircuitSolver.js`, una
      # copia vendored dentro `apps/studio`. Alzare `LED_BURN_CURRENT` nel
      # sorgente del plugin lascia verdi tutti, candidata compresa.
      - name: verdetto elettrico onesto - LED senza resistore = BRUCIATO, mai un finto acceso
        if: ${{ !cancelled() }}
        run: npx playwright test e2e/sim-esp2-senza-resistore.spec.ts --forbid-only --reporter=line
      # Entrata il 2026-08-22, sesto giro. E' il lato CONSUMATORE della stessa
      # memoria che il journey #246 difende dal lato produttore: l'errore che il
      # docente ha segnato in ElabLab deve comparire nella zona «Ripasso errori»
      # del cruscotto, nello stesso profilo, dopo una navigazione vera.
      #
      # Mutazione discriminante: `graph.query` negata al pannello ripasso
      # (`apps/studio/src/toolhost/panelHost.ts`, `opts.approved ?? []`). Il
      # plugin NON va in errore: degrada da solo a lista vuota, e il cruscotto
      # mostra `data-zripasso-aperti="0"`. Questa spec esce 1; i CINQUE journey
      # gia' nel cancello escono 0, e cosi' `golden-path`, `cruscotto` e
      # `cruscotto-graph`. Otto spec cieche, una sola vede.
      # Cosa costa: il docente legge «nessun errore da ripassare» quando la
      # verita' e' «non ho potuto leggere il grafo». E' la famiglia di #246 —
      # una superficie che tace su cio' che non c'e' — spostata dal percorso di
      # marcatura a quello di ripasso.
      #
      # ⚠️ COSTI dell'ingresso, dichiarati prima invece che scoperti dopo:
      #  1. La spec asserisce `consoleErrors` VUOTO su due viste. Qualunque
      #     `console.error` — anche di una dipendenza, anche innocuo — rende
      #     questo job rosso senza che nulla si sia rotto per un docente.
      #  2. Fissa il nome dell'attributo `data-zripasso-aperti`: chi lo rinomina
      #     trova il job rosso avendo migliorato il codice.
      #  3. La sua STABILITA' DIPENDE DAL RIMEDIO DI #246. Misurato: era 4 su 5
      #     rossa prima di quel rimedio, ed e' 5 su 5 verde dopo. Se #246
      #     regredisce, questo job diventa rosso con un messaggio che parla di
      #     «aperti = 0», non di durabilita': due rossi, una causa, e il secondo
      #     messaggio porta fuori strada.
      - name: ripasso del docente - l'errore segnato in ElabLab compare nel cruscotto
        if: ${{ !cancelled() }}
        run: npx playwright test e2e/ripasso-live.spec.ts --forbid-only --reporter=line
      # Entrata il 2026-08-22, settimo giro. E' l'unico journey che segue il
      # FILE fuori dall'app e lo riporta dentro: errore marcato in ELAB Lab →
      # cruscotto → Genera → Esporta (download vero) → import del file appena
      # scaricato. Nessuno degli altri sei attraversa quel confine.
      #
      # Mutazione discriminante: `evidence: []` in
      # `apps/studio/src/lessonos/studentPackArtifact.ts` (riga del builder, al
      # posto di `[...candidate.evidenceRefs]`). Il pack resta un file VALIDO —
      # formato giusto, si riapre, l'id c'e' — e ha perso le fonti. Questa spec
      # esce 1; i SEI journey gia' nel cancello escono 0, e cosi' `golden-path`
      # e `cruscotto`. Otto cieche, una vede.
      # Cosa costa: lo studente riceve «hai sbagliato questo» senza NESSUN
      # riferimento a dove l'errore e' stato osservato. Il file non e' rotto:
      # e' muto, e nessuno se ne accorge aprendolo.
      #
      # ⚠️ COSTI dell'ingresso, dichiarati prima:
      #  1. Il journey dipende da un DOWNLOAD reale del browser. Su un runner e'
      #     il passo piu' fragile della lista, e un rosso li' non e' un difetto
      #     del prodotto.
      #  2. Porta gia' dentro un `toPass` con reload fino a 30s, perche' la
      #     scrittura IndexedDB della marcatura e' asincrona rispetto al
      #     contatore: e' il journey piu' lento del job.
      #  3. Come `ripasso-live`, pretende `consoleErrors` vuoto su due viste.
      - name: student pack - il file esce dall'app, torna dentro, e porta le sue fonti
        if: ${{ !cancelled() }}
        run: npx playwright test e2e/studentpack-artifact.spec.ts --forbid-only --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-journey-traces-${{ github.sha }}
          path: apps/studio/test-results/
          if-no-files-found: ignore
          retention-days: 14

  hygiene:
    name: hygiene (NUL + secrets + boundary + whitespace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # Gli step seguenti eseguono script versionati nella PR: nessun
          # GITHUB_TOKEN deve restare leggibile nella config git.
          persist-credentials: false
      - name: NUL scan (tracked text files)
        run: python3 bin/ci/nul_scan.py
      - name: secret scan (high-confidence patterns)
        run: python3 bin/ci/secret_scan.py
      - name: secret scan tests
        run: python3 bin/ci/test_secret_scan.py
      - name: ELAB standalone boundary (ratchet)
        run: python3 bin/ci/elab_boundary_gate.py
      # hygiene e' un check REQUIRED su main: la regola "nessun filtro di base
      # sotto pull_request" vive qui perche' un commento nel workflow lo si
      # cancella senza che nessuno se ne accorga, un check rosso no.
      - name: workflow trigger gate (copertura indipendente dalla base)
        run: python3 bin/ci/workflow_trigger_gate.py
      - name: workflow trigger gate tests
        run: python3 bin/ci/workflow_trigger_gate.py --self-test
      # Da 16 finding avversariali su 20 classificati come meccanicamente
      # controllabili il 2026-07-30: il revisore costa 20-40 minuti per round e ne
      # spendeva l'80% su cose che uno script trova in due secondi.
      - name: doc claims gate (un documento non afferma cio' che il repo smentisce)
        run: python3 bin/ci/doc_claims_gate.py
      - name: doc claims gate tests
        run: python3 bin/ci/doc_claims_gate.py --self-test
      # Stato corrente generato a macchina (F0-1). `--verify` gira OFFLINE e
      # asserisce che il generatore legga l'HEAD REALE del repo: se restituisse
      # una costante o un valore memorizzato, questa asserzione fallirebbe al
      # primo commit nuovo. E' la forma eseguibile di «il JSON cambia quando
      # cambia main».
      - name: project state — funzioni pure
        run: python3 bin/state/project_state.py --self-test
      - name: project state — test
        run: python3 bin/state/test_project_state.py
      - name: project state — legge il repo reale (offline)
        run: python3 bin/state/project_state.py --verify
      - name: project state — genera lo stato di QUESTO SHA
        env:
          ARDESIA_STATE_OFFLINE: "1"
        run: python3 bin/state/project_state.py
      - name: project state — pubblica l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-state-${{ github.sha }}
          path: |
            artifacts/state/project.json
            docs/ops/CURRENT.md
          if-no-files-found: error
          retention-days: 30
      - name: whitespace errors (git diff --check)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # niente --depth=1: su clone full (fetch-depth: 0) il fetch shallow
          # innesta il tip di main senza parent -> merge-base vuoto quando la
          # PR e' stale vs main -> "fatal: bad revision ''" (visto su #94).
          # Repo privato: il fetch ha bisogno di credenziale. La si monta qui e
          # la si smonta subito, cosi' nessuno step successivo puo' leggerla.
          trap 'git config --local --unset-all "http.https://github.com/.extraheader" || true' EXIT
          git config --local "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git fetch --no-tags origin "$BASE_REF"
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          test -n "$base" || { echo "merge-base vuoto: origin/$BASE_REF vs HEAD" >&2; exit 1; }
          # sim/solver/engine è vendored byte-identico da ELAB (drift-guard
          # sha256 nei test): il whitespace del sorgente canonico non si tocca.
          git diff --check "$base" HEAD -- . ':(exclude)apps/studio/sim/solver/engine/'
