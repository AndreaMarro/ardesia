name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  studio:
    name: studio (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Candidate identity
        working-directory: ${{ github.workspace }}
        run: |
          python3 bin/ci/candidate_identity.py \
            --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" \
            --expected-sha "$CANDIDATE_SHA" \
            --base-sha "$BASE_SHA" \
            > candidate-identity.json
      - run: python3 bin/ci/action_pin_gate.py
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: vitest (deterministic profile)
        run: >
          npx vitest run
          --pool=threads --maxWorkers=1 --no-file-parallelism
          --testTimeout=30000 --hookTimeout=30000 --teardownTimeout=30000
      - run: npm run build

  engine:
    name: engine (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Candidate identity
        working-directory: ${{ github.workspace }}
        run: |
          python3 bin/ci/candidate_identity.py \
            --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" \
            --expected-sha "$CANDIDATE_SHA" \
            --base-sha "$BASE_SHA" \
            > candidate-identity.json
      - run: python3 bin/ci/action_pin_gate.py
        working-directory: ${{ github.workspace }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.28"
          python-version: "3.13.14"
      - name: pytest (live tests self-skip without API keys)
        run: uv run --locked pytest -q

  hygiene:
    name: hygiene (NUL + secrets + boundary + whitespace)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Candidate identity
        run: |
          python3 bin/ci/candidate_identity.py \
            --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" \
            --expected-sha "$CANDIDATE_SHA" \
            --base-sha "$BASE_SHA" \
            > candidate-identity.json
      - name: candidate identity gate tests
        run: python3 bin/ci/test_candidate_identity.py
      - name: action pin gate tests
        run: python3 bin/ci/test_action_pin_gate.py
      - name: action pin gate
        run: python3 bin/ci/action_pin_gate.py
      - name: NUL scan (tracked text files)
        run: python3 bin/ci/nul_scan.py
      - name: secret scan (high-confidence patterns)
        run: python3 bin/ci/secret_scan.py
      - name: secret scan tests
        run: python3 bin/ci/test_secret_scan.py
      - name: governance canon gate tests
        run: python3 bin/ci/test_governance_canon_gate.py
      - name: governance canon
        run: python3 bin/ci/governance_canon_gate.py
      - name: ELAB standalone boundary (ratchet)
        run: python3 bin/ci/elab_boundary_gate.py
      - name: whitespace errors (git diff --check)
        if: github.event_name == 'pull_request'
        run: |
          # Il confronto resta legato al base SHA dell'evento già receipted:
          # nessun fetch di un branch live che potrebbe avanzare durante il run.
          git cat-file -e "$BASE_SHA^{commit}"
          base="$(git merge-base "$BASE_SHA" HEAD)"
          test -n "$base" || { echo "merge-base vuoto: $BASE_SHA vs HEAD" >&2; exit 1; }
          # sim/solver/engine è vendored byte-identico da ELAB (drift-guard
          # sha256 nei test): il whitespace del sorgente canonico non si tocca.
          git diff --check "$base" HEAD -- . ':(exclude)apps/studio/sim/solver/engine/'
