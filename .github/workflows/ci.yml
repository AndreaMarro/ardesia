name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: studio (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: vitest (deterministic profile)
        run: >
          npx vitest run
          --pool=threads --maxWorkers=1 --no-file-parallelism
          --testTimeout=30000 --hookTimeout=30000 --teardownTimeout=30000
      - run: npm run build

  # D-CHROMATIC. Job SEPARATO e NON BLOCCANTE: non compare fra i required status
  # check di main e non deve mai comparirci. Cablare la review visuale dentro un
  # check obbligatorio e' gia' stata la causa radice di due lineage divergenti
  # (21-07): un gate umano dentro un gate automatico ferma tutto.
  #
  # exitZeroOnChanges: false => una differenza visuale rende ROSSO questo job.
  # Rosso qui significa "qualcuno deve guardare", non "il merge e' bloccato".
  chromatic-visual-review:
    name: chromatic-visual-review (non-blocking)
    needs: studio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # I fork non ricevono i secret: senza token la run sarebbe un falso rosso.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # SHA ESATTO del candidato. Su pull_request il default di actions/checkout
      # e' il merge commit effimero: baseline e diff andrebbero attribuiti a un
      # commit che non esiste in nessuna storia.
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          # Chromatic risale la storia per trovare la baseline: uno shallow
          # clone la fa ripartire da zero a ogni run.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: canary del secret (fallisce PRIMA di costruire, non dopo)
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: test -n "$CHROMATIC_PROJECT_TOKEN"
      - run: npm run storybook:build
      - uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v18.1.0
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        with:
          workingDir: apps/studio
          storybookBuildDir: dist/storybook
          chromaticSha: ${{ env.CANDIDATE_SHA }}
          # Nessuna accettazione automatica e nessun verde di comodo: ogni
          # differenza va accettata o rifiutata da una persona.
          autoAcceptChanges: false
          exitZeroOnChanges: false
          # Niente TurboSnap durante il bootstrap: la prima baseline deve
          # coprire TUTTE le storie, non solo quelle toccate dal diff.
          onlyChanged: false
          skipUpdateCheck: true

  engine:
    name: engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # -rs stampa ogni skip con la sua ragione: il check resta verde solo con
      # lo skip DICHIARATO nel log, mai con una copertura sparita in silenzio.
      - name: pytest (skip dei test live esplicito senza API key)
        run: uv run pytest -q -rs

  hygiene:
    name: hygiene (NUL + secrets + boundary + whitespace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # Gli step seguenti eseguono script versionati nella PR: nessun
          # GITHUB_TOKEN deve restare leggibile nella config git.
          persist-credentials: false
      - name: NUL scan (tracked text files)
        run: python3 bin/ci/nul_scan.py
      - name: secret scan (high-confidence patterns)
        run: python3 bin/ci/secret_scan.py
      - name: secret scan tests
        run: python3 bin/ci/test_secret_scan.py
      - name: ELAB standalone boundary (ratchet)
        run: python3 bin/ci/elab_boundary_gate.py
      - name: whitespace errors (git diff --check)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # niente --depth=1: su clone full (fetch-depth: 0) il fetch shallow
          # innesta il tip di main senza parent -> merge-base vuoto quando la
          # PR e' stale vs main -> "fatal: bad revision ''" (visto su #94).
          # Repo privato: il fetch ha bisogno di credenziale. La si monta qui e
          # la si smonta subito, cosi' nessuno step successivo puo' leggerla.
          trap 'git config --local --unset-all "http.https://github.com/.extraheader" || true' EXIT
          git config --local "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git fetch --no-tags origin "$BASE_REF"
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          test -n "$base" || { echo "merge-base vuoto: origin/$BASE_REF vs HEAD" >&2; exit 1; }
          # sim/solver/engine è vendored byte-identico da ELAB (drift-guard
          # sha256 nei test): il whitespace del sorgente canonico non si tocca.
          git diff --check "$base" HEAD -- . ':(exclude)apps/studio/sim/solver/engine/'
