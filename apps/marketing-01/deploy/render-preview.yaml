# Isolated review site. Do not attach a production domain or change existing services.
services:
  - type: web
    runtime: static
    name: ardesia-golive-ux01-preview
    repo: https://github.com/AndreaMarro/ardesia
    branch: pro/ardesia-golive-ux-01-20261023
    autoDeployTrigger: off
    buildCommand: python3 apps/marketing-01/build.py
    staticPublishPath: apps/marketing-01/dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    previews:
      generation: manual
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
