# PREPARED ONLY. Apply after explicit production, indexing and DNS authorization.
services:
  - type: web
    runtime: static
    name: ardesia-fisica
    repo: https://github.com/AndreaMarro/ardesia
    branch: pro/ardesia-golive-02-20261024
    autoDeployTrigger: off
    buildCommand: python3 apps/marketing-01/build.py --site-url https://fisica.andreamarro.it/
    staticPublishPath: apps/marketing-01/dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    domains:
      - fisica.andreamarro.it
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Render uses the first matching value for a header: assets before catch-all.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
