<article class="course-card" id="$id" aria-labelledby="title-$id" tabindex="-1">
  <div class="card-top"><span class="course-number">$number</span><span class="unit-label">$units</span></div>
  <h3 id="title-$id">$title</h3>
  <p class="course-intro">$intro</p>
  <p class="course-fit">$fit</p>
  <details class="programme" data-responsive-disclosure>
    <summary><span class="summary-text">Programma e obiettivi</span> $chevron</summary>
    <div class="programme-body"><h4>Gli argomenti</h4><ul>$topics</ul><h4>Su cosa lavoreremo</h4><ul>$outcomes</ul></div>
  </details>
  <a class="course-cta" data-course="$id" href="$contact_url" target="_blank" rel="noopener noreferrer"><span class="cta-label">Chiedi disponibilità <span class="sr-only">per $title su WhatsApp</span></span>$external</a>
  $demo_link
  <a class="back-to-paths" href="#scegli-percorso">Torna ai percorsi</a>
</article>
