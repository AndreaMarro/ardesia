# Local R4 cross-compile in one command.
# Run from project root:
#   docker compose -f infra/cloud-compile/docker-compose.yml up -d
# Browser falls through to http://localhost:8765/compile for any Nano R4
# cross-compile when running on localhost (dev) — no Render deploy needed
# to verify physical flash.
#
# In PROD this same image deploys to Render via infra/cloud-compile/render.yaml.

services:
  cloud-compile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elab-cloud-compile
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      PORT: 8765
      # DEV mode: leave API_KEY unset → server runs in permissive mode for
      # local-only access. For PROD via Render set ELAB_CLOUD_COMPILE_API_KEY.
      RATE_LIMIT_PER_MIN: 30
      SKETCH_SIZE_LIMIT_KB: 100
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
