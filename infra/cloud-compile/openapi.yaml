openapi: 3.1.0

info:
  title: ELAB Tutor Cross-Compile API
  version: 1.0.0
  description: >
    "sarebbe importante cross compilazione elabtutor con arduino nanoR4 perfettamente
    funzionante con blockly e ide sia in homepage che in esperimenti con arduino.
    io non ho arduino nanoR4 qui, ma il sistema deve funzionare 100% per cross
    compilazione. vedi discorsi con riccardo. sarebbe fondamentale avere la certezza
    che il sistema funzioni anche senza scheda. In pratica vorrei stupire riccardo.
    Massima onestà, non compiacermi."
    — Andrea Marro, 2026-05-17 PM (iter 76 mandate verbatim)


    This API provides Arduino sketch cross-compilation services for the ELAB Tutor
    platform. It exposes a uniform contract implemented by two runtimes:

    - LOCAL agent (`src/services/elab-agent/http-server.js`, iter 69-73) running
      on the teacher's Mac at localhost:8765, backed by a native arduino-cli
      installation.

    - CLOUD scaffold (`infra/cloud-compile/server.js`, iter 76 ENTRANCE) intended
      for deployment on Render.com as a Docker container, also backed by arduino-cli
      but available without any local install requirement.

    Both runtimes MUST conform to this schema. Divergences are considered
    contract violations and must be resolved before the Riccardo Omaric demo.


    Honest assessment (iter 76 D.3):

    - Steps 1–3 (Blockly → C++ → POST /compile → HEX bytes) are 100% functional
      without a physical Nano R4 board.

    - Step 4 (POST /compile-and-upload → physical flash via dfu-util) requires
      USB hardware. The /compile-and-upload endpoint is documented here for
      completeness and future iter 77+ use, but hardware UAT is deferred.

    - The CLOUD server (infra/cloud-compile/server.js) has NOT yet been deployed
      to Render. The server entry in the `servers` list below is aspirational
      pending Andrea's Render deploy decision (iter 76 D.6 recommendation: defer
      to iter 77+).

  contact:
    name: Andrea Marro
    email: marro.andrea96@gmail.com
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:8765
    description: >
      LOCAL Mac agent (iter 69-73). Requires arduino-cli + Renesas core
      installed on the teacher's Mac. Started via
      `node src/services/elab-agent/cli.js`. Verified live iter 76:
      arduino-cli 1.4.1, core_renesas_uno_installed=true.
  - url: https://elab-cloud-compile.onrender.com
    description: >
      CLOUD Render deployment (iter 76 scaffold, NOT yet deployed).
      No local install required for teachers. Requires X-Elab-Api-Key
      header for all endpoints except GET /health.

security:
  - ElabApiKey: []

components:

  securitySchemes:
    ElabApiKey:
      type: apiKey
      in: header
      name: X-Elab-Api-Key
      description: >
        Required on the CLOUD server for all endpoints except GET /health.
        Not required on the LOCAL agent (loopback-only, CORS enforced).
        Value is set via environment variable ELAB_CLOUD_COMPILE_API_KEY.
        If the env var is absent the CLOUD server logs a warning and allows
        all requests (DEV MODE only — never ship to production without this key).

  schemas:

    SketchRequest:
      type: object
      required:
        - sketchCode
      properties:
        sketchCode:
          type: string
          minLength: 1
          maxLength: 102400
          description: >
            Arduino C++ source code as a UTF-8 string. Maximum 100 KB
            (SKETCH_SIZE_LIMIT_KB env var on CLOUD, 10 MB body cap on LOCAL).
            Must contain at least void setup() for a valid Arduino sketch.
          example: |
            void setup() { pinMode(13, OUTPUT); }
            void loop() { digitalWrite(13, HIGH); delay(500); digitalWrite(13, LOW); delay(500); }
        fqbn:
          type: string
          description: >
            Fully Qualified Board Name. Must be one of the whitelisted values
            defined in the ALLOWED_BOARDS set. Defaults to
            arduino:renesas_uno:nanor4 when absent.
          enum:
            - arduino:renesas_uno:nanor4
            - arduino:avr:nano:cpu=atmega328old
            - arduino:avr:uno
          default: arduino:renesas_uno:nanor4
          example: arduino:renesas_uno:nanor4
        sessionId:
          type: string
          format: uuid
          description: >
            Optional client-generated session identifier for correlating
            compile jobs with UNLIM session memory (Supabase). Not used
            by the compile pipeline itself — passed through to responses
            for the caller's convenience.
          example: 7fc3009d-4a2e-4b3e-9abc-123456789abc
        port:
          type: string
          description: >
            Serial/USB port for upload operations. Required only for
            POST /compile-and-upload. On macOS the typical value is
            /dev/cu.usbmodemR4001. Ignored by POST /compile.
          example: /dev/cu.usbmodemR4001

    CompileResponse:
      type: object
      required:
        - ok
        - jobId
      properties:
        ok:
          type: boolean
          description: True when compilation succeeded and HEX bytes are available.
        jobId:
          type: string
          format: uuid
          description: >
            Server-generated UUID identifying this compile job. Use it to
            poll GET /jobs/{jobId}/status or to pass to POST /upload as
            the jobId body parameter.
        sketchDir:
          type: string
          description: >
            Absolute path to the temporary sketch directory created for
            this job. Present on LOCAL agent responses; omitted or null
            on CLOUD (sandbox cleanup is immediate after compile).
          example: /tmp/elab-cloud-compile/7fc3009d/sketch
        buildDir:
          type: string
          description: >
            Absolute path to the build output directory. Same caveat as
            sketchDir regarding CLOUD vs LOCAL differences.
          example: /tmp/elab-cloud-compile/7fc3009d/build
        stdout:
          type: string
          description: >
            Full arduino-cli compile stdout. Includes flash/RAM usage lines
            like "Lo sketch usa 39048 byte (14%) dello spazio disponibile".
          example: "Lo sketch usa 39048 byte (14%)...\nLe variabili globali usano 3940 byte (12%)..."
        hexFilename:
          type: string
          description: >
            Name of the firmware file produced (e.g. sketch.ino.hex or
            sketch.ino.bin). CLOUD only — LOCAL does not surface this field.
          example: sketch.ino.hex
        hexSize:
          type: integer
          description: >
            Byte length of the raw firmware binary. CLOUD only.
          example: 39048
        hexBase64:
          type: string
          description: >
            Base64-encoded firmware binary. CLOUD only — present when
            status=success. Use this to flash via WebUSB in the browser
            without requiring a local dfu-util install.
          example: "OiAweDAwMD..."
        hexBytes:
          type: integer
          description: >
            Flash usage in bytes (parsed from arduino-cli stdout).
            LOCAL agent surface — not always present.
          example: 39048
        ramBytes:
          type: integer
          description: >
            Global variable RAM usage in bytes (parsed from stdout).
            LOCAL agent surface — not always present.
          example: 3940
        latencyMs:
          type: integer
          description: Server-side compile wall-clock time in milliseconds.
          example: 4200
        sessionId:
          type: string
          format: uuid
          description: Echoed from request when provided.

    CompileAndUploadResponse:
      type: object
      required:
        - ok
        - jobId
      properties:
        ok:
          type: boolean
        jobId:
          type: string
          format: uuid
        compile:
          $ref: '#/components/schemas/CompileResponse'
          description: Compile stage result.
        upload:
          type: object
          description: Upload stage result (dfu-util output, board confirmation).
          properties:
            ok:
              type: boolean
            stdout:
              type: string
            stderr:
              type: string
            latencyMs:
              type: integer
        error:
          $ref: '#/components/schemas/ErrorResponse'

    JobStatus:
      type: object
      required:
        - jobId
        - status
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - compiling
            - uploading
            - done
            - error
          description: >
            Current lifecycle state of the job. The LOCAL agent uses an
            in-memory ledger (_jobs Map) that survives for the process
            lifetime. The CLOUD server issues immediate responses; polling
            is only meaningful on the LOCAL agent where compile is async.
        stage:
          type: string
          enum:
            - compile
            - upload
            - compile-and-upload
          description: Which operation this job belongs to.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
          description: >
            Optional compile progress estimate. Not emitted in iter 76;
            reserved for iter 77+ SSE streaming upgrade.
        stdout:
          type: string
        stderr:
          type: string
        hexBytes:
          type: integer
        ramBytes:
          type: integer
        result:
          type: object
          description: >
            Full handler payload when status=done. Shape mirrors
            CompileResponse or CompileAndUploadResponse depending on stage.
        error:
          $ref: '#/components/schemas/ErrorResponse'

    BoardEntry:
      type: object
      required:
        - fqbn
        - name
        - supported
      properties:
        fqbn:
          type: string
          description: Fully Qualified Board Name as used by arduino-cli.
          example: arduino:renesas_uno:nanor4
        name:
          type: string
          description: Human-readable board name shown in the UI.
          example: Arduino Nano R4 (Renesas RA4M1)
        supported:
          type: boolean
          description: >
            True when the board's platform core is installed and operational
            on this agent instance. False indicates the core is known but
            not installed (cloud: always true for whitelisted boards after
            Docker build; local: depends on the teacher's arduino-cli setup).
        minCoreVersion:
          type: string
          description: >
            Minimum platform core version required for this board to compile
            ELAB experiments correctly. Nano R4 requires arduino:renesas_uno
            >= 1.5.0 (Renesas RA4M1 DFU support).
          example: "1.5.0"

    BoardsResponse:
      type: object
      properties:
        boards:
          type: array
          items:
            $ref: '#/components/schemas/BoardEntry'
          description: >
            Normalized list of boards. Present on both LOCAL and CLOUD
            runtimes. The LOCAL agent wraps its flat Set in this schema
            on iter 77+ (current LOCAL /boards returns a raw set +
            default string — iter 77 contract alignment task).
        supported:
          type: array
          items:
            type: string
          description: >
            Flat FQBN list (CLOUD iter 76 format). Retained for backward
            compat with CLOUD server.js /boards implementation.
        default:
          type: string
          description: FQBN of the recommended default board.
          example: arduino:renesas_uno:nanor4

    ErrorResponse:
      type: object
      required:
        - error
        - code
        - category
      properties:
        error:
          type: string
          description: >
            Human-readable error message. On LOCAL agent this is the
            buildDocenteError() docente-friendly Italian message (e.g.
            "Il codice contiene un errore di compilazione. Controllate
            parentesi, punto e virgola..."). On CLOUD it is a short
            English error key.
          example: "Il codice contiene un errore di compilazione."
        code:
          type: string
          description: Machine-readable error code.
          example: compile_failed
        category:
          type: string
          enum:
            - validation
            - auth
            - rate_limit
            - compile
            - board
            - dfu
            - timeout
            - cors
            - other
          description: >
            Error category for client-side routing to appropriate UI state.

            - validation: malformed request body or missing required fields
            - auth: missing or invalid X-Elab-Api-Key (CLOUD only)
            - rate_limit: 429 too many requests (CLOUD only)
            - compile: arduino-cli returned non-zero exit or stderr errors
            - board: FQBN not whitelisted or core not installed
            - dfu: upload to physical board failed (dfu-util / WebUSB)
            - timeout: arduino-cli exceeded timeout (default 120s LOCAL, 60s CLOUD)
            - cors: Origin not in allowlist (returns before auth check)
            - other: unexpected server error
        details:
          type: object
          additionalProperties: true
          description: Optional structured context (e.g. raw stderr excerpt, allowed FQBN list).

    HealthResponse:
      type: object
      required:
        - version
      properties:
        agent:
          type: string
          description: Agent identifier string.
          example: elab-compile-upload
        service:
          type: string
          description: Service identifier (CLOUD runtime).
          example: elab-cloud-compile
        version:
          type: string
          description: Agent/service semantic version.
          example: "0.1.0"
        arduino_cli_version:
          type: string
          description: >
            arduino-cli version string as reported by `arduino-cli version`.
            Format: "arduino-cli Version: 1.4.1 Commit: ... OS: ...".
            Verified live on LOCAL agent iter 76: "1.4.1".
          example: "1.4.1"
        arduino_cli_version_raw:
          type: string
          description: Raw stdout from `arduino-cli version` (CLOUD runtime field).
        arduino_cli_ready:
          type: boolean
          description: True when `arduino-cli version` exits 0 (CLOUD runtime).
        core_renesas_uno_installed:
          type: boolean
          description: >
            True when arduino:renesas_uno platform core is present in the
            arduino-cli core list. Verified true on LOCAL iter 76.
          example: true
        core_avr_installed:
          type: boolean
          description: True when arduino:avr platform core is present (CLOUD runtime).
        core_count:
          type: integer
          description: Number of installed cores (LOCAL runtime field).
          example: 2
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 server timestamp at time of health check.
        uptime_seconds:
          type: number
          description: >
            Server process uptime in seconds. Not currently emitted;
            reserved for iter 77+ monitoring integration.

  responses:

    ValidationError:
      description: 400 Bad Request — missing or invalid request fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "sketchCode missing or empty"
            code: compile_failed
            category: validation

    AuthError:
      description: 401 Unauthorized — missing or invalid API key (CLOUD only).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: api_key_required
            code: api_key_required
            category: auth

    RateLimitError:
      description: 429 Too Many Requests — rate limit exceeded (CLOUD only, 10 req/min per IP).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets (always 60).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: rate_limit_exceeded
            code: rate_limit_exceeded
            category: rate_limit
            details:
              limit_per_min: 10

    CompileError:
      description: 422 Unprocessable Entity — arduino-cli returned compile errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Il codice contiene un errore di compilazione."
            code: compile_failed
            category: compile

    ServerError:
      description: 500 Internal Server Error — unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Errore tecnico interno. Riprovate."
            code: spawn_error
            category: other

    BoardNotConnected:
      description: >
        503 Service Unavailable — physical board not connected or upload
        not possible without hardware. Returned by /compile-and-upload when
        port is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "La scheda Nano R4 non è collegata o non viene riconosciuta."
            code: board_missing
            category: board

    TimeoutError:
      description: >
        504 Gateway Timeout — arduino-cli exceeded compile/upload timeout
        (LOCAL default 120s, CLOUD default 60s).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "L'operazione ha impiegato troppo tempo (>2 minuti)."
            code: timeout
            category: timeout

paths:

  /health:
    get:
      operationId: getHealth
      summary: Agent health and arduino-cli status
      description: >
        Returns the agent/service version, arduino-cli availability, and
        installed core status. Always public — no authentication required
        on either LOCAL or CLOUD runtime. Used by CompileAgentBanner.jsx
        (iter 66) to determine the 4-state UI (Mac online/offline,
        Win/Linux guidance, unknown graceful).


        Verified live on LOCAL iter 76:

          curl localhost:8765/health

          {"agent":"elab-compile-upload","arduino_cli_version":"1.4.1",
           "core_renesas_uno_installed":true,"core_count":2,"version":"0.1.0"}

      tags: [diagnostics]
      security: []
      responses:
        '200':
          description: Agent is up. Check core_renesas_uno_installed for compile readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                local_healthy:
                  summary: LOCAL agent healthy (verified live iter 76)
                  value:
                    agent: elab-compile-upload
                    version: "0.1.0"
                    arduino_cli_version: "1.4.1"
                    core_renesas_uno_installed: true
                    core_count: 2
                cloud_healthy:
                  summary: CLOUD service healthy (aspirational — Render not yet deployed)
                  value:
                    service: elab-cloud-compile
                    version: "1.0.0"
                    arduino_cli_ready: true
                    arduino_cli_version_raw: "arduino-cli Version: 1.4.1 ..."
                    core_renesas_uno_installed: true
                    core_avr_installed: true
                    timestamp: "2026-05-17T14:00:00Z"
        '500':
          $ref: '#/components/responses/ServerError'

  /boards:
    get:
      operationId: listBoards
      summary: List supported boards with FQBN and install status
      description: >
        Returns the set of whitelisted FQBNs this agent will accept on
        POST /compile. Each entry carries human-readable name, FQBN, and
        whether the platform core is currently installed.


        CORS NOTE: The LOCAL agent requires the request to originate from
        an allowed origin (localhost:5173, elabtutor.school, or a matching
        Vercel preview URL). Unauthenticated cross-origin requests receive
        403.


        AUTH NOTE (CLOUD): X-Elab-Api-Key required. /health is the only
        unauthenticated endpoint on the CLOUD runtime.

      tags: [boards]
      responses:
        '200':
          description: Supported board list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardsResponse'
              example:
                boards:
                  - fqbn: arduino:renesas_uno:nanor4
                    name: Arduino Nano R4 (Renesas RA4M1)
                    supported: true
                    minCoreVersion: "1.5.0"
                  - fqbn: arduino:avr:nano:cpu=atmega328old
                    name: Arduino Nano (ATmega328P old bootloader)
                    supported: true
                  - fqbn: arduino:avr:uno
                    name: Arduino Uno (ATmega328P)
                    supported: true
                default: arduino:renesas_uno:nanor4
        '401':
          $ref: '#/components/responses/AuthError'
        '500':
          $ref: '#/components/responses/ServerError'

  /compile:
    post:
      operationId: compileSketch
      summary: Compile Arduino sketch to HEX without requiring a physical board
      description: >
        Compiles a sketch using arduino-cli and returns job metadata and
        firmware output. This is the DEMO-GRADE endpoint for the Riccardo
        Omaric demo: steps 1-3 of the cross-compile chain are 100%
        functional without a physical Nano R4 board.


        Verified live on LOCAL iter 76:

          curl -X POST localhost:8765/compile \
            -H 'Content-Type: application/json' \
            -d '{"sketchCode":"void setup(){pinMode(13,OUTPUT);}",
                 "fqbn":"arduino:renesas_uno:nanor4"}'

          {"ok":true,"jobId":"7fc3009d-...","sketchDir":"...",
           "buildDir":"...","stdout":"Lo sketch usa 39048 byte (14%)..."}


        On CLOUD the response includes hexBase64 for direct WebUSB flashing.
        On LOCAL the response includes sketchDir/buildDir paths for subsequent
        dfu-util upload via POST /upload or /compile-and-upload.


        HONEST STATE MACHINE (iter 76 AC-6):

        The client must implement the following states after this call:

        - compile_success {hexBytes, ramBytes, jobId} — proceed to upload CTA

        - compile_only_no_board — render "HEX pronto: N bytes. Collegate Nano R4
          via USB per caricare." with retry CTA (iter 76 AC-3)

        - compile_error — display stderr to teacher in docente-friendly Italian

      tags: [compile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SketchRequest'
            examples:
              blink_nano_r4:
                summary: Classic Blink for Nano R4
                value:
                  sketchCode: |
                    void setup() { pinMode(13, OUTPUT); }
                    void loop() { digitalWrite(13, HIGH); delay(500); digitalWrite(13, LOW); delay(500); }
                  fqbn: arduino:renesas_uno:nanor4
                  sessionId: 7fc3009d-4a2e-4b3e-9abc-123456789abc
              blockly_generated:
                summary: Blockly-generated sketch (scratchGenerator.js output)
                value:
                  sketchCode: |
                    #include <Arduino.h>
                    void setup() {
                      pinMode(13, OUTPUT);
                    }
                    void loop() {
                      digitalWrite(13, HIGH);
                      delay(1000);
                      digitalWrite(13, LOW);
                      delay(1000);
                    }
                  fqbn: arduino:renesas_uno:nanor4
      responses:
        '200':
          description: Compilation succeeded. HEX is ready for upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileResponse'
              example:
                ok: true
                jobId: 7fc3009d-4a2e-4b3e-9abc-123456789abc
                sketchDir: /tmp/elab-cloud-compile/7fc3009d/sketch
                buildDir: /tmp/elab-cloud-compile/7fc3009d/build
                stdout: "Lo sketch usa 39048 byte (14%) dello spazio disponibile..."
                hexBytes: 39048
                ramBytes: 3940
                latencyMs: 4200
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthError'
        '413':
          description: >
            413 Payload Too Large — sketch exceeds SKETCH_SIZE_LIMIT_KB
            (default 100 KB on CLOUD, 10 MB body cap on LOCAL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: sketch_too_large
                code: sketch_too_large
                category: validation
                details:
                  limit_kb: 100
        '422':
          $ref: '#/components/responses/CompileError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/TimeoutError'

  /compile-and-upload:
    post:
      operationId: compileAndUpload
      summary: Compile then upload to a connected Nano R4 via dfu-util
      description: >
        Sequential compile + upload in a single call. The compile stage runs
        exactly as POST /compile. The upload stage invokes dfu-util against
        the specified serial port.


        HONEST CAVEAT (iter 76 D-track): This endpoint requires a physical
        Arduino Nano R4 connected via USB. Hardware UAT is deferred to
        iter 77+ (Riccardo + Omaric kit). Do NOT claim upload success
        without a real flash confirmation from dfu-util.


        For the Riccardo demo, use POST /compile alone to demonstrate
        compilation. Show the HEX byte count ("39048 bytes — Nano R4 pronto")
        and render the "compile_only_no_board" UI state (iter 76 AC-3).


        The Arduino Nano R4 series uses USB DFU 1.1 protocol. dfu-util 0.11
        is required. The board may need a double-tap on the reset button to
        enter bootloader DFU mode (LED arancione lampeggiante). This physical
        procedure is NOT yet documented in the ELAB Tutor UI (iter 77+ scope).

      tags: [compile, upload]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SketchRequest'
              description: >
                Same as SketchRequest but `port` is REQUIRED for the upload
                stage. Without port the endpoint returns 400 immediately,
                before invoking arduino-cli.
            example:
              sketchCode: |
                void setup() { pinMode(13, OUTPUT); }
                void loop() { digitalWrite(13, HIGH); delay(500); digitalWrite(13, LOW); delay(500); }
              fqbn: arduino:renesas_uno:nanor4
              port: /dev/cu.usbmodemR4001
              sessionId: 7fc3009d-4a2e-4b3e-9abc-123456789abc
      responses:
        '200':
          description: Compile and upload both succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileAndUploadResponse'
              example:
                ok: true
                jobId: 7fc3009d-4a2e-4b3e-9abc-123456789abc
                compile:
                  ok: true
                  jobId: 7fc3009d-4a2e-4b3e-9abc-123456789abc
                  stdout: "Lo sketch usa 39048 byte (14%)..."
                  hexBytes: 39048
                upload:
                  ok: true
                  stdout: "dfu-util 0.11 ... Download  [=========================] 100%"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/CompileError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/BoardNotConnected'
        '504':
          $ref: '#/components/responses/TimeoutError'

  /jobs/{jobId}/status:
    get:
      operationId: getJobStatus
      summary: Poll compile or upload job status
      description: >
        Returns the current state of a job from the in-memory job ledger.
        Useful when the client needs to poll compile progress without
        blocking the UI thread.


        LOCAL AGENT NOTE: The LOCAL agent maintains an in-memory job map
        (_jobs) that is process-local and cleared on agent restart. Jobs
        are written immediately at request time (synchronous compile in
        iter 76 LOCAL), so polling is mainly useful to retrieve results
        after a compile-and-upload initiated from a background context.


        CLOUD NOTE: The current CLOUD server (iter 76 scaffold) does NOT
        implement a job ledger — compile is synchronous and the response is
        returned inline. /jobs/:id/status on CLOUD will return 404 for all
        jobIds. This is a known gap; async job queuing is deferred to
        iter 77+ along with SSE streaming.

      tags: [jobs]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The jobId returned by POST /compile or POST /compile-and-upload.
          example: 7fc3009d-4a2e-4b3e-9abc-123456789abc
      responses:
        '200':
          description: Job found — returns current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
              examples:
                compile_done:
                  summary: Compile completed
                  value:
                    jobId: 7fc3009d-4a2e-4b3e-9abc-123456789abc
                    status: done
                    stage: compile
                    startedAt: "2026-05-17T14:00:01Z"
                    finishedAt: "2026-05-17T14:00:05Z"
                    stdout: "Lo sketch usa 39048 byte (14%)..."
                    hexBytes: 39048
                    ramBytes: 3940
                compiling_in_progress:
                  summary: Compile still running
                  value:
                    jobId: 7fc3009d-4a2e-4b3e-9abc-123456789abc
                    status: compiling
                    stage: compile
                    startedAt: "2026-05-17T14:00:01Z"
        '401':
          $ref: '#/components/responses/AuthError'
        '404':
          description: >
            404 Not Found — jobId not in ledger. On CLOUD runtime this is
            always the case (synchronous compile, no ledger). On LOCAL this
            indicates the job was never created or the agent was restarted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "job 7fc3009d-... not found"
                code: compile_failed
                category: other
        '500':
          $ref: '#/components/responses/ServerError'

tags:
  - name: diagnostics
    description: Health and readiness probes
  - name: boards
    description: Supported board listing
  - name: compile
    description: Arduino sketch compilation (no board required)
  - name: upload
    description: Firmware upload to physical Nano R4 (board required)
  - name: jobs
    description: Async job status polling

x-elab-cors-policy:
  local:
    description: >
      LOCAL agent uses a hand-rolled CORS middleware (makeCorsMiddleware in
      http-server.js). Allowed origins are hardcoded: localhost:5173,
      127.0.0.1:5173, www.elabtutor.school, elabtutor.school, plus any
      URL matching /^https:\/\/elab-tutor-[a-z0-9-]+\.vercel\.app$/i for
      Vercel preview deployments. Requests without an Origin header (curl,
      server-side) are allowed. OPTIONS preflight returns 204 with
      Access-Control-Max-Age: 600.
  cloud:
    description: >
      CLOUD server uses the same pattern. In addition it allows
      localhost:4173 (Vite preview). Requests from disallowed origins
      return 403 with body {error: "origin_not_allowed"}.

x-elab-honesty-caveats:
  - id: HC-1
    title: CLOUD not deployed
    detail: >
      infra/cloud-compile/server.js was scaffolded in iter 76 ENTRANCE but
      has NOT been deployed to Render as of 2026-05-17. The
      https://elab-cloud-compile.onrender.com server entry is aspirational.
      Andrea's decision on Render deploy is deferred to iter 77+
      (iter 76 D.6 recommendation: local agent is sufficient for the
      Riccardo demo).
  - id: HC-2
    title: /jobs/:id/status not implemented on CLOUD
    detail: >
      The CLOUD server.js has no job ledger. /jobs/:id/status will return
      404 for all IDs. Async job queuing + SSE streaming are deferred to
      iter 77+.
  - id: HC-3
    title: /boards response shape divergence
    detail: >
      LOCAL /boards (handleBoards in server.js) returns the installed cores
      list from `arduino-cli core list` stdout; it does NOT yet return the
      BoardsResponse schema defined here. CLOUD /boards returns
      {supported: [...fqbns], default: "..."} which is also a subset of
      BoardsResponse. Full schema alignment is a iter 77+ contract task.
  - id: HC-4
    title: Hardware upload not verified
    detail: >
      POST /compile-and-upload and POST /upload have NOT been tested against
      a real Nano R4 board. Hardware UAT is deferred to iter 77+ when
      Andrea / Tea / Riccardo can test with the Omaric kit physically.
      dfu-util double-tap-reset DFU entry procedure is NOT yet documented
      in the UI (iter 77+ scope per spec §4).
  - id: HC-5
    title: OpenAPI validator not run
    detail: >
      This spec was authored by BG agent 76-D.3 and has NOT been run
      through npx @apidevtools/swagger-cli validate or any online validator
      as of 2026-05-17. Minor YAML or schema errors may be present.
      Validation gate is deferred to iter 77+ CI integration
      (contract tests via openapi-validator per rationale doc §6).
