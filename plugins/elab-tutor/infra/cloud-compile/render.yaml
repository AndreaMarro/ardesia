# ELAB Cloud Compile Service — Render deploy iter 76
# Andrea: "WebUSB direct dalla piattaforma, NO download docente"
#
# Deploy steps Andrea Render dashboard:
# 1. New + Web Service
# 2. Connect GitHub repo elab-tutor
# 3. Root Directory: infra/cloud-compile
# 4. Runtime: Docker
# 5. Plan: Starter ($7/mo) — needs ~500MB disk for Renesas core + Docker
# 6. Region: Frankfurt (EU GDPR consistent ELAB stack)
# 7. Environment Variables:
#    - ELAB_CLOUD_COMPILE_API_KEY (openssl rand -hex 32 generate)
#    - PORT 8765 (auto-set by Render usually)
# 8. Health Check Path: /health
# 9. Auto Deploy: yes (push main → redeploy)
#
# Andrea ratify: Render Starter $7/mo accepted iter 76 entrance.

services:
  - type: web
    name: elab-cloud-compile
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: infra/cloud-compile
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ELAB_CLOUD_COMPILE_API_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT_PER_MIN
        value: "10"
      - key: SKETCH_SIZE_LIMIT_KB
        value: "100"
      - key: SANDBOX_IDLE_MIN
        value: "5"
