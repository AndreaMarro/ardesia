[project]
name = "ardesia-s19-circuit-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["kirchhoff==0.1.0"]
[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["s19_circuit_lab"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
