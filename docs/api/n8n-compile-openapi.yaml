openapi: 3.1.0
info:
  title: ELAB Tutor Compile API
  description: |
    OpenAPI contract for ELAB Tutor's Arduino sketch compile pipeline.

    ## Status — DRAFT (iter 59)
    iter 59 PRD `docs/specs/2026-05-15-iter-59-blockly-cross-compile-ux.md` R4.
    PREREQ Andrea ratify before Phase 1 execute: verify `arduino-cli core install arduino:renesas_uno` is installed on n8n server (`n8n.srv1022317.hstgr.cloud`).

    ## Call chain (api.js fallback order)
    1. Supabase compile-proxy (HTTPS browser CORS-safe) — `${SUPABASE_EDGE}/compile-proxy`
    2. Server standalone (compile-server.js on VPS) — `COMPILE_URL`
    3. Backend webhook legacy — `COMPILE_WEBHOOK`

    ## Security note
    Direct call to `n8n.srv1022317.hstgr.cloud/compile` FAILS browser CORS on production `www.elabtutor.school`. Production browser → Supabase proxy → n8n (Supabase Edge Function bridges). Direct n8n call only from non-browser callers (CLI/server) or local dev `http://localhost`.

    ## Timeout
    `COMPILE_TIMEOUT = 65000` ms (65s — arduino-cli internal timeout 60s + 5s margin) — `src/services/api.js:57`.

    ## Allowlist enforcement
    Client AND server enforce `ALLOWED_COMPILE_BOARDS` allowlist. Client = `src/services/api.js:61` Set (currently 2 boards: `arduino:avr:nano:cpu=atmega328old` + `arduino:avr:uno`). iter 59 R2 extends with 2 Renesas FQBNs.

  version: 1.0.0-draft
  contact:
    name: Andrea Marro
    email: marro.andrea96@gmail.com
  license:
    name: Proprietary ELAB Tutor
    url: https://www.elabtutor.school

servers:
  - url: https://euqpdueopmlllqjmqnyb.supabase.co/functions/v1
    description: Production — Supabase Edge Function proxy (CORS-safe browser path)
  - url: https://n8n.srv1022317.hstgr.cloud
    description: Direct n8n (non-browser CLI/server only; production browser blocks via CORS)
  - url: http://localhost:8787
    description: Local dev — compile-server.js standalone

tags:
  - name: Compile
    description: Arduino sketch → Intel HEX compilation
  - name: Health
    description: Endpoint reachability

paths:
  /compile-proxy:
    post:
      operationId: compileViaProxy
      summary: Compile Arduino sketch via Supabase Edge Function proxy
      description: |
        Browser-safe entry point. Receives sketch + board FQBN, forwards to n8n direct, returns Intel HEX (success) or build errors.

        ## iter 59 expectation
        - `board='arduino:avr:nano:cpu=atmega328old'` works (current default, Nano classic AVR).
        - `board='arduino:renesas_uno:unor4wifi'` works (iter 59 R3 Andrea verify `arduino-cli core install arduino:renesas_uno` server-side).
        - `board='arduino:renesas_uno:minima'` works (iter 59 R3 same prereq).
      tags:
        - Compile
      security:
        - supabaseAnon: []
          elabApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileRequest"
            examples:
              avrNanoClassic:
                summary: AVR Nano classic (current default)
                value:
                  code: |
                    void setup() { pinMode(13, OUTPUT); }
                    void loop() { digitalWrite(13, HIGH); delay(500); digitalWrite(13, LOW); delay(500); }
                  board: arduino:avr:nano:cpu=atmega328old
              nanoR4WiFi:
                summary: Nano R4 WiFi (iter 59 NEW)
                value:
                  code: |
                    void setup() { pinMode(LED_BUILTIN, OUTPUT); }
                    void loop() { digitalWrite(LED_BUILTIN, HIGH); delay(500); digitalWrite(LED_BUILTIN, LOW); delay(500); }
                  board: arduino:renesas_uno:unor4wifi
              nanoR4Minima:
                summary: Nano R4 Minima (iter 59 NEW)
                value:
                  code: |
                    void setup() { pinMode(LED_BUILTIN, OUTPUT); }
                    void loop() { digitalWrite(LED_BUILTIN, HIGH); delay(500); digitalWrite(LED_BUILTIN, LOW); delay(500); }
                  board: arduino:renesas_uno:minima
      responses:
        "200":
          description: Compile completed (check `success` to discriminate ok vs error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileResponse"
              examples:
                success:
                  summary: Compile success
                  value:
                    success: true
                    hex: ":100000000C9434000C9451000C9451000C9451004A\n..."
                    errors: null
                    output: "Sketch uses 924 bytes (3%) of program storage. Maximum is 30720 bytes."
                    result: "Sketch uses 924 bytes (3%) of program storage."
                arrayWrapped:
                  summary: Backend wraps response in array (auto-unwrapped client-side)
                  value:
                    - success: true
                      hex: ":100000000C9434..."
                      errors: null
                      output: "Sketch uses 924 bytes (3%)"
                error:
                  summary: Compile error (e.g. missing core)
                  value:
                    success: false
                    hex: null
                    errors: "fqbn arduino:renesas_uno:unor4wifi: Unknown FQBN: platform arduino:renesas_uno not installed"
                    output: null
                    result: "Unknown FQBN: platform arduino:renesas_uno not installed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          description: Request timeout (>65s — likely arduino-cli stuck or core download)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Backend compile service unreachable (fallback chain exhausted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /compile:
    post:
      operationId: compileDirect
      summary: Compile directly via n8n endpoint (non-browser only)
      description: |
        Direct entry point. Same contract as `/compile-proxy` but no Supabase auth headers.
        **Production browsers BLOCK this endpoint via CORS** — use `/compile-proxy` from `www.elabtutor.school`.
      tags:
        - Compile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileRequest"
      responses:
        "200":
          description: Same as `/compile-proxy`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /healthz:
    get:
      operationId: healthCheck
      summary: Endpoint health
      tags:
        - Health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  arduinoCliVersion:
                    type: string
                    example: "1.0.0"
                  coresInstalled:
                    type: array
                    items:
                      type: string
                    example:
                      - "arduino:avr@1.8.6"
                      - "arduino:renesas_uno@1.4.1"

components:
  schemas:
    CompileRequest:
      type: object
      required:
        - code
        - board
      properties:
        code:
          type: string
          description: Arduino sketch content (.ino file body, C++ syntax).
          minLength: 1
          maxLength: 65536
          example: |
            void setup() {}
            void loop() {}
        board:
          $ref: "#/components/schemas/BoardFqbn"
        libraries:
          type: array
          description: Optional Arduino libraries to install/include before compile (NOT currently used by client — reserved for future).
          items:
            type: string
          example:
            - "Servo"
            - "WiFiS3"

    BoardFqbn:
      type: string
      description: |
        Arduino FQBN (Fully-Qualified Board Name).
        Server-side allowlist enforced — client-side enforced in `ALLOWED_COMPILE_BOARDS` Set at `src/services/api.js:61`.
        iter 59 R2 extends allowlist with 2 Renesas FQBNs.
      enum:
        - arduino:avr:nano:cpu=atmega328old
        - arduino:avr:uno
        - arduino:renesas_uno:unor4wifi
        - arduino:renesas_uno:minima
      default: arduino:avr:nano:cpu=atmega328old

    CompileResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: True = HEX generated; False = build error.
        hex:
          type: string
          nullable: true
          description: Intel HEX format binary (uploadable to board via arduino-cli upload).
        errors:
          type: string
          nullable: true
          description: Build errors (compile + link). Aliased to `error` in some backend versions.
        output:
          type: string
          nullable: true
          description: arduino-cli stdout (build log, RAM/Flash usage). Aliased to `stdout` in some versions.
        result:
          type: string
          nullable: true
          description: Convenience alias — first non-null of `output`/`stdout`/`errors`/`error`.

    Error:
      type: object
      required:
        - success
        - errors
      properties:
        success:
          type: boolean
          enum: [false]
        errors:
          type: string
        requestId:
          type: string
          description: Optional correlation ID for support

  parameters: {}

  responses:
    BadRequest:
      description: Invalid request (missing `code` or `board`, code too large, board not in allowlist)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            errors: "Board 'arduino:renesas_uno:portenta' not in ALLOWED_COMPILE_BOARDS allowlist"

    Unauthorized:
      description: Missing or invalid Supabase apikey / Authorization Bearer / X-Elab-Api-Key headers
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    supabaseAnon:
      type: apiKey
      in: header
      name: apikey
      description: |
        Supabase anon JWT (`VITE_SUPABASE_ANON_KEY` env). Required for `/compile-proxy` path.
        Also passed as `Authorization: Bearer ${SUPABASE_ANON_KEY}` per api.js line 1314-1316.
    elabApiKey:
      type: apiKey
      in: header
      name: X-Elab-Api-Key
      description: |
        ELAB Tutor application-level API key (`ELAB_API_KEY` env). Required for `/compile-proxy` rate limiting.
        Rotated iter 32 PM (security incident).

security:
  - supabaseAnon: []
    elabApiKey: []
