openapi: 3.1.0
info:
  title: ELAB Tutor — Edge Functions API
  version: 0.1.0
  summary: Backend HTTP surface for ELAB Tutor (UNLIM AI tutor + GDPR + Arduino compile proxy)
  description: |
    Supabase Edge Functions backing the ELAB Tutor product
    (https://www.elabtutor.school). All endpoints live under the path
    `/functions/v1/<name>` on the project URL.

    Authoritative TypeScript shapes:
      `supabase/functions/_shared/types.ts`

    Audit doc: `docs/api/2026-05-11-iter-29-api-design-review.md`

    Status iter 29 (2026-05-11): this is the FIRST OpenAPI spec for the
    surface. Treat as descriptive (matches current production behaviour),
    not yet prescriptive. Iter 30+ will harmonize error envelope and add
    rate-limit + version response headers.
  contact:
    name: Andrea Marro
    email: marro.andrea96@gmail.com
  license:
    name: Proprietary
servers:
  - url: https://euqpdueopmlllqjmqnyb.supabase.co/functions/v1
    description: Production (Supabase project ref euqpdueopmlllqjmqnyb)
  - url: http://localhost:54321/functions/v1
    description: Local Supabase dev (supabase start)

tags:
  - name: chat
    description: UNLIM tutor chat + intent dispatch
  - name: vision
    description: Image analysis (Gemini Vision primary, Pixtral fallback)
  - name: voice
    description: TTS (Voxtral Italian) + STT (Cloudflare Whisper)
  - name: rag
    description: Hints + diagnosis (uses RAG + circuit state)
  - name: gdpr
    description: GDPR Art. 8 / 17 / 20 endpoints
  - name: tools
    description: Compile proxy + dashboard (operational endpoints)

security:
  - BearerAuth: []
    ApiKeyAuth: []

paths:
  /unlim-chat:
    options:
      tags: [chat]
      summary: CORS preflight
      responses:
        '204': { $ref: '#/components/responses/CorsPreflight' }
    get:
      tags: [chat]
      summary: Health probe
      description: Returns status, version, uptime, internal metrics. Only `unlim-chat` exposes this — all other endpoints return 405 on GET.
      security: []
      responses:
        '200':
          description: Health snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
              example:
                status: ok
                version: 2.1.0
                uptimeSeconds: 18443
                metrics: {}
                timestamp: '2026-05-11T15:30:00.000Z'
    post:
      tags: [chat]
      operationId: postUnlimChat
      summary: Send a chat message to UNLIM
      description: |
        Server pipeline (high level, file:line in
        `supabase/functions/unlim-chat/index.ts`):
          1. CORS preflight (128) → API key check (159) → body size cap (168)
          2. `validateSessionId` (184) + `validateChatInput` (192)
          3. `checkRateLimitPersistent` 30/60s/sessionId (201)
          4. `sanitizeMessage` prompt-injection guard (213)
          5. Voltage danger pre-LLM short-circuit (250)
          6. Off-topic regex pre-LLM short-circuit (279)
          7. Direct operational response (327)
          8. Consent check via `checkConsent()` (367)
          9. RAG hybrid retrieve + LLM via `callLLM` chain (~line 500+)
         10. INTENT parsing + safety + Principio Zero V3 validation
         11. Optional TTS request via `requestTTS()`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
            example:
              message: 'Ragazzi, oggi accendiamo il LED del Volume 1 cap.6'
              sessionId: 'session-uuid-v4-or-anon-id'
              experimentId: 'v1-cap6-esp1'
              unlimMode: 'percorso'
              aiDepth: 'compact'
      responses:
        '200':
          description: Success — `response` is the user-visible string. May include extension fields `prompt_class`, `safety_fires`, `intents_parsed`, `debug_retrieval`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
              example:
                success: true
                response: 'Ragazzi, prendiamo il LED dal kit ELAB e lo inseriamo sulla breadboard (Vol.1 pag.42).'
                source: 'mistral-small'
                dataProcessing: 'mistral-eu-fr'
                aiProfile: 'docente_lim_8_14'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRevoked' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /unlim-vision:
    options:
      tags: [vision]
      summary: CORS preflight
      responses:
        '204': { $ref: '#/components/responses/CorsPreflight' }
    post:
      tags: [vision]
      operationId: postUnlimVision
      summary: Analyse kit photo / breadboard / circuit
      description: |
        Gemini 2.5 Flash EU Frankfurt primary (~600ms p50), Mistral Pixtral
        12B FR EU fallback (~1300ms p50). Max 4 images per request.
        Gemini requires base64; URLs route directly to Pixtral.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisionRequest' }
            example:
              prompt: 'Ragazzi, controllate questa foto del kit ELAB'
              images: ['data:image/png;base64,iVBORw0KGgo...']
              sessionId: 'session-uuid-v4'
              provider: 'auto'
      responses:
        '200':
          description: Vision analysis (Italian K-12). Header `X-Vision-Provider` indicates the provider actually used.
          headers:
            X-Vision-Provider:
              schema:
                type: string
                enum: [gemini-2.5-flash, pixtral-12b, mistral-vision]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /unlim-tts:
    options:
      tags: [voice]
      summary: CORS preflight
      responses:
        '204': { $ref: '#/components/responses/CorsPreflight' }
    post:
      tags: [voice]
      operationId: postUnlimTts
      summary: Text-to-speech (Voxtral primary, Edge TTS Isabella fallback, VPS legacy)
      description: |
        Provider chain (iter 31+):
          1. Voxtral mini-tts-2603 (Mistral EU FR, voice clone Andrea IT)
          2. Microsoft edge-tts Isabella Neural (`it-IT-IsabellaNeural`)
          3. VPS legacy (`http://72.60.129.50:8880/tts`)
        On full failure returns `200 {success:true, source:'browser', ...}`
        with a marker telling the client to use browser SpeechSynthesis API
        (graceful degradation). Success path returns audio binary (audio/mpeg
        by default) with `X-Tts-*` metadata headers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TtsRequest' }
            example:
              text: 'Ragazzi, accendiamo il LED.'
              sessionId: 'session-uuid-v4'
              provider: 'auto'
              format: 'mp3'
      responses:
        '200':
          description: Audio binary OR JSON browser-fallback marker.
          headers:
            X-Tts-Provider: { schema: { type: string, enum: [voxtral, edge-tts, vps] } }
            X-Tts-Voice: { schema: { type: string } }
            X-Tts-Model: { schema: { type: string } }
            X-Tts-Latency-Ms: { schema: { type: integer } }
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: '#/components/schemas/TtsBrowserFallback' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ConsentRevoked' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /unlim-stt:
    options:
      tags: [voice]
      summary: CORS preflight
      responses:
        '204': { $ref: '#/components/responses/CorsPreflight' }
    post:
      tags: [voice]
      operationId: postUnlimStt
      summary: Speech-to-text (Cloudflare Whisper Large v3 Turbo)
      description: |
        Accepts THREE input shapes:
          1. `multipart/form-data` with `audio` file field (+ optional `language`, `sessionId`)
          2. `application/json` `{audio_base64, sessionId, language?}`
          3. Raw `audio/*` binary (`audio/mpeg`, `audio/wav`, `audio/mp4`, ...)
             with `X-Language` + `X-Session-Id` headers.
        Max 10 MB. Italian K-12 default (`language: 'it'`).
        **Gap**: no rate limit, no parental consent check (iter 31 P1).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary }
                language: { type: string, enum: [it, en], default: it }
                sessionId: { type: string }
          application/json:
            schema:
              type: object
              required: [audio_base64, sessionId]
              properties:
                audio_base64: { type: string }
                sessionId: { type: string }
                language: { type: string, enum: [it, en], default: it }
          audio/*:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Transcription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SttResponse' }
              example:
                success: true
                text: 'Ragazzi, accendiamo il LED'
                language: it
                model: '@cf/openai/whisper-large-v3-turbo'
                provider: 'cloudflare-workers-ai'
                latencyMs: 412
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /unlim-imagegen:
    options:
      tags: [vision]
      summary: CORS preflight
      responses:
        '204': { $ref: '#/components/responses/CorsPreflight' }
    post:
      tags: [vision]
      operationId: postUnlimImagegen
      summary: Generate image (Cloudflare FLUX.1 Schnell)
      description: |
        Free tier 10k req/day shared. 4-step diffusion default. Prompt
        capped 500 chars. Returns base64 PNG data URI.
        **Gap**: no rate limit, no parental consent check (iter 31 P1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageGenRequest' }
            example:
              prompt: 'breadboard with red LED and 220 ohm resistor connected to Arduino Nano'
              sessionId: 'session-uuid-v4'
              width: 1024
              height: 1024
      responses:
        '200':
          description: Generated image as base64 PNG data URI
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageGenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /unlim-diagnose:
    options:
      tags: [rag]
      summary: CORS preflight
      responses:
        '204': { $ref: '#/components/responses/CorsPreflight' }
    post:
      tags: [rag]
      operationId: postUnlimDiagnose
      summary: Proactive circuit error diagnosis
      description: |
        Accepts circuit state, image, or both. Tries Gemini Flash → Flash-Lite
        → Brain fallback. **Schema drift**: also accepts legacy
        `{circuit, image, session_id, prompt}` shape (iter 8 fix).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DiagnoseRequest'
                - $ref: '#/components/schemas/DiagnoseRequestLegacy'
      responses:
        '200':
          description: Diagnosis text
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnoseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ConsentRevoked' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /unlim-hints:
    options:
      tags: [rag]
      summary: CORS preflight
      responses:
        '204': { $ref: '#/components/responses/CorsPreflight' }
    post:
      tags: [rag]
      operationId: postUnlimHints
      summary: Progressive experiment hint
      description: Uses Gemini Flash-Lite; falls back to Brain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HintsRequest' }
            example:
              experimentId: 'v1-cap6-esp1'
              currentStep: 2
              difficulty: 'intermedio'
              sessionId: 'session-uuid-v4'
      responses:
        '200':
          description: Hint text
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HintsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ConsentRevoked' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /unlim-gdpr:
    options:
      tags: [gdpr]
      summary: CORS preflight
      responses:
        '204': { $ref: '#/components/responses/CorsPreflight' }
    post:
      tags: [gdpr]
      operationId: postUnlimGdpr
      summary: GDPR Art. 8 / 17 / 20 endpoints (dispatched by `action`)
      description: |
        Single endpoint dispatches by `action` field:
          * `delete`  — Right to erasure (Art. 17). Requires `authToken`.
          * `export`  — Data portability (Art. 20). Requires `authToken`.
          * `consent` — Parental consent record (Art. 8).
          * `status`  — Consent status check.
        Audit log persisted to `gdpr_audit_log` table.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GdprRequest' }
            example:
              action: consent
              studentId: 'student-uuid'
              classId: 'class-001'
              consentGiven: true
              parentEmail: 'parent@example.it'
              consentMethod: 'email'
      responses:
        '200':
          description: GDPR action result (shape depends on `action`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GdprResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /unlim-session-description:
    options:
      tags: [chat]
      summary: CORS preflight
      responses:
        '204': { $ref: '#/components/responses/CorsPreflight' }
    post:
      tags: [chat]
      operationId: postSessionDescription
      summary: Generate (cached) ≤80 char description of a past session
      description: Cache stored in `unlim_sessions.description_unlim`. Returns immediately when cached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        '200':
          description: Description (cached or freshly generated)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDescriptionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /compile-proxy:
    options:
      tags: [tools]
      summary: CORS preflight (separate allow-list with Vercel preview regex)
      responses:
        '204': { $ref: '#/components/responses/CorsPreflight' }
    post:
      tags: [tools]
      operationId: postCompileProxy
      summary: Proxy Arduino sketch to n8n compile webhook (CORS unblock)
      description: |
        Forwards `{code}` POST to upstream `N8N_COMPILE_URL`. Body cap 50 KB
        (vs 100 KB elsewhere). Upstream timeout 30 s. **Unauthenticated**
        intentionally — upstream is public.
        ATTENTION: error envelope shape is `{error, ...}` — does NOT
        include `success: false`. P0 harmonization candidate iter 30.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 50000 }
      responses:
        '200':
          description: Upstream compile result (HEX or error details)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          description: invalid_json | code_required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompileProxyError' }
        '405':
          description: method_not_allowed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompileProxyError' }
        '413':
          description: payload_too_large | code_too_large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompileProxyError' }
        '502':
          description: upstream_timeout | upstream_error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompileProxyError' }

  /dashboard-data:
    options:
      tags: [tools]
      summary: CORS preflight
      responses:
        '204': { $ref: '#/components/responses/CorsPreflight' }
    get:
      tags: [tools]
      operationId: getDashboardData
      summary: Teacher dashboard aggregate metrics (SCAFFOLD — returns empty)
      description: |
        Status `source: 'stub'`, schema version `0.1.0-scaffold`. Auth + RLS
        enforcement deferred to Day 05.
      parameters:
        - in: query
          name: teacher_id
          schema: { type: string, format: uuid }
        - in: query
          name: range
          schema: { type: string, enum: [7d, 30d, 90d], default: 7d }
      responses:
        '200':
          description: Empty metrics shape (scaffold)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [tools]
      operationId: postDashboardData
      summary: Same as GET — request body alternative for clients that prefer POST
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardRequest' }
      responses:
        '200':
          description: Empty metrics shape (scaffold)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase anon JWT. Shipped in the browser bundle therefore scrapeable.
        Gateway-level enforcement by Supabase platform. NOT sufficient on its
        own — pair with `ApiKeyAuth`. See `supabase/functions/_shared/guards.ts`
        section "CORS allowlist".
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Elab-Api-Key
      description: |
        Server-only secret (`ELAB_API_KEY` Supabase env). Fail-open when the
        secret is unset (`guards.ts:67-72`). Only `unlim-chat` enforces today
        (iter 31 P1: propagate to all sensitive endpoints).

  responses:
    CorsPreflight:
      description: CORS preflight OK (no body)
      headers:
        Access-Control-Allow-Origin: { schema: { type: string } }
        Access-Control-Allow-Methods: { schema: { type: string, example: 'POST, OPTIONS' } }
        Access-Control-Allow-Headers: { schema: { type: string, example: 'Content-Type, Authorization, apikey, X-Elab-Api-Key, x-client-info' } }
        Vary: { schema: { type: string, example: Origin } }
    BadRequest:
      description: Bad request (validation, missing fields, invalid format)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or wrong `X-Elab-Api-Key` (only `unlim-chat` today)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: unauthorized
            reason: 'missing X-Elab-Api-Key header'
    Forbidden:
      description: Forbidden — GDPR ownership mismatch or other policy block
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ConsentRevoked:
      description: Parental consent revoked or missing (strict mode)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: 'Consenso revocato.'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    MethodNotAllowed:
      description: Method not allowed (most endpoints accept POST + OPTIONS only)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PayloadTooLarge:
      description: Body exceeds the endpoint cap (100 KB default, 12 MB multimodal, 50 KB compile-proxy)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: 30 req / 60s / sessionId exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: 'Stai andando troppo veloce! Aspetta qualche secondo.'
    InternalError:
      description: Unhandled internal error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: Provider chain exhausted or service degraded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    # ── Error envelope (canonical, P0 iter 30 to harmonize) ───────────────
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error: { type: string }
        details: { type: string }
        reason: { type: string }
        code: { type: string, description: 'Reserved for iter 30 harmonization' }

    HealthResponse:
      type: object
      required: [status, version, uptimeSeconds, timestamp]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        uptimeSeconds: { type: integer, minimum: 0 }
        metrics: { type: object, additionalProperties: true }
        timestamp: { type: string, format: date-time }

    # ── Chat ──────────────────────────────────────────────────────────────
    ChatRequest:
      type: object
      required: [message, sessionId]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        sessionId: { type: string, maxLength: 128, pattern: '^[a-zA-Z0-9_\\-.:]{1,128}$' }
        circuitState: { $ref: '#/components/schemas/CircuitState' }
        experimentId: { type: string, nullable: true }
        simulatorContext: { $ref: '#/components/schemas/SimulatorContext' }
        images:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ImageData' }
        aiProfile: { type: string, nullable: true }
        aiDepth:
          type: string
          nullable: true
          enum: [total, compact, null]
        unlimMode: { type: string, nullable: true }
        # Extension fields (not in _shared/types.ts but accepted at runtime)
        debug_retrieval: { type: boolean, description: 'Iter 10 P0 debug surface' }
        retrieval_mode: { type: string, enum: [hybrid, dense, auto] }
        top_k: { type: integer, minimum: 1, maximum: 20 }

    ChatResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        response: { type: string }
        source: { type: string, description: 'e.g. mistral-small | gemini-flash | brain | safety-pre-llm | offtopic-template-iter25' }
        audio: { type: string, description: 'Optional base64 data URI when TTS executed inline' }
        actions: { type: array, items: { type: string } }
        error: { type: string }
        dataProcessing: { type: string, description: 'GDPR transparency: which external service processed the data (mistral-eu-fr | google-gemini-eu-frankfurt | ...)' }
        aiProfile: { type: string }
        # Extension fields surfaced at runtime
        safety_fires: { type: array, items: { type: string } }
        prompt_class:
          type: object
          properties:
            category: { type: string, enum: [chit_chat, deep_question, safety_warning, citation_vol_pag, plurale_ragazzi, off_topic, default] }
            skipOnniscenza: { type: boolean }
            topK: { type: integer }
            wordCount: { type: integer }
        intents_parsed: { type: array, items: { $ref: '#/components/schemas/IntentTag' } }
        debug_retrieval:
          type: array
          items: { $ref: '#/components/schemas/DebugRetrievalChunk' }

    IntentTag:
      type: object
      properties:
        action: { type: string }
        args: { type: object, additionalProperties: true }

    DebugRetrievalChunk:
      type: object
      properties:
        id: { type: string }
        content: { type: string }
        source: { type: string }
        chapter: { type: integer, nullable: true }
        page: { type: integer, nullable: true }
        section_title: { type: string, nullable: true }
        corpus: { type: string, nullable: true }
        score: { type: number, format: float }

    # ── Vision ────────────────────────────────────────────────────────────
    VisionRequest:
      type: object
      required: [prompt, images, sessionId]
      properties:
        prompt: { type: string, maxLength: 1000 }
        images:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            description: base64 data URI OR https URL (URLs route to Pixtral only)
        sessionId: { type: string }
        provider: { type: string, enum: [gemini, pixtral, auto], default: auto }
        aiProfile: { type: string, nullable: true }
        aiDepth: { type: string, enum: [total, compact, null], nullable: true }
        unlimMode: { type: string, nullable: true }

    VisionResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        response: { type: string }
        model: { type: string }
        provider: { type: string, enum: [gemini-2.5-flash, pixtral-12b, pixtral, mistral-vision] }
        aiProfile: { type: string }
        dataProcessing: { type: string }
        latencyMs: { type: integer }
        error: { type: string }
        details: { type: string }

    # ── TTS / STT / ImageGen ──────────────────────────────────────────────
    TtsRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 3, maxLength: 500 }
        voice: { type: string, description: 'Legacy VPS or it-IT-* edge-tts voice' }
        language: { type: string, default: it }
        speed: { type: number, minimum: 0.5, maximum: 2.0, default: 0.95 }
        sessionId: { type: string }
        provider: { type: string, enum: [voxtral, edge-tts, vps, auto], default: auto }
        rate: { type: string, description: 'edge-tts SSML rate (+/-%, e.g. -10%)' }
        pitch: { type: string, description: 'edge-tts SSML pitch (e.g. +5Hz)' }
        voice_id: { type: string, description: 'Voxtral cloned voice override' }
        format: { type: string, enum: [mp3, wav, flac, opus, pcm], default: mp3 }

    TtsBrowserFallback:
      type: object
      required: [success, source, message]
      properties:
        success: { type: boolean, enum: [true] }
        source: { type: string, enum: [browser] }
        text: { type: string }
        message: { type: string, example: 'Usa la sintesi vocale del browser.' }
        voxtral_error: { type: string }
        voxtral_status: { type: integer }
        edge_tts_error: { type: string }

    SttResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        text: { type: string }
        language: { type: string }
        model: { type: string, example: '@cf/openai/whisper-large-v3-turbo' }
        provider: { type: string, example: cloudflare-workers-ai }
        latencyMs: { type: integer }
        error: { type: string }
        details: { type: string }

    ImageGenRequest:
      type: object
      required: [prompt, sessionId]
      properties:
        prompt: { type: string, maxLength: 500 }
        sessionId: { type: string }
        width: { type: integer, default: 1024 }
        height: { type: integer, default: 1024 }

    ImageGenResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        image: { type: string, description: 'data:image/png;base64,...' }
        model: { type: string }
        provider: { type: string }
        latencyMs: { type: integer }
        error: { type: string }
        details: { type: string }

    # ── Diagnose / Hints ─────────────────────────────────────────────────
    DiagnoseRequest:
      type: object
      required: [circuitState]
      properties:
        circuitState: { $ref: '#/components/schemas/CircuitState' }
        experimentId: { type: string, nullable: true }
        sessionId: { type: string }

    DiagnoseRequestLegacy:
      type: object
      description: Iter 8 alternative shape accepted at runtime by `unlim-diagnose`.
      properties:
        image: { type: string, description: 'base64 PNG (with or without data: prefix)' }
        circuit: { $ref: '#/components/schemas/CircuitState' }
        session_id: { type: string }
        prompt: { type: string }

    DiagnoseResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        diagnosis: { type: string }
        source: { type: string, enum: [flash, flash-lite, flash-vision, flash-lite-vision, brain] }
        error: { type: string }

    HintsRequest:
      type: object
      required: [experimentId]
      properties:
        experimentId: { type: string }
        currentStep: { type: integer, minimum: 0, maximum: 99, default: 0 }
        difficulty: { type: string, enum: [base, intermedio, avanzato] }
        sessionId: { type: string }

    HintsResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        hints: { type: string }
        source: { type: string, enum: [flash-lite, brain] }
        error: { type: string }

    # ── GDPR ─────────────────────────────────────────────────────────────
    GdprRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [delete, export, consent, status] }
        sessionId: { type: string, description: 'Required for delete/export' }
        authToken: { type: string, description: 'Required for delete/export' }
        studentId: { type: string, description: 'Required for consent/status' }
        classId: { type: string, description: 'Optional for consent' }
        consentGiven: { type: boolean, description: 'Required for consent (no implicit default)' }
        parentEmail: { type: string, format: email }
        consentMethod: { type: string, enum: [email, signature, oral, in-person] }

    GdprResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        message: { type: string }
        deleted: { type: object, description: 'For action=delete' }
        data: { type: object, description: 'For action=export — keyed bundle of all tables' }
        exported_at: { type: string, format: date-time }
        hasConsent: { type: boolean }
        consentDate: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        error: { type: string }

    # ── Session description ──────────────────────────────────────────────
    SessionDescriptionResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        description: { type: string, maxLength: 80 }
        cached: { type: boolean }
        error: { type: string }

    # ── Compile proxy (non-standard error shape) ─────────────────────────
    CompileProxyError:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [method_not_allowed, payload_too_large, invalid_json, code_required, code_too_large, upstream_timeout, upstream_error] }
        max_bytes: { type: integer }
        message: { type: string }
        upstream: { type: string }

    # ── Dashboard (scaffold) ─────────────────────────────────────────────
    DashboardRequest:
      type: object
      properties:
        teacher_id: { type: string, format: uuid, nullable: true }
        range: { type: string, enum: [7d, 30d, 90d], default: 7d }

    DashboardResponse:
      type: object
      required: [success, range, teacher_id, generated_at, schema_version, source]
      x-status: scaffold
      properties:
        success: { type: boolean }
        metrics: { $ref: '#/components/schemas/DashboardMetrics' }
        range: { type: string }
        teacher_id: { type: string, nullable: true }
        generated_at: { type: string, format: date-time }
        schema_version: { type: string }
        source: { type: string, enum: [live, stub] }
        error: { type: string }

    DashboardMetrics:
      type: object
      required: [student_count, total_interactions, avg_session_minutes, experiments_completed, recent_errors, nudges_suggested]
      properties:
        student_count: { type: integer, minimum: 0 }
        total_interactions: { type: integer, minimum: 0 }
        avg_session_minutes: { type: number, minimum: 0 }
        experiments_completed: { type: integer, minimum: 0 }
        recent_errors:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              msg: { type: string }
              session_id: { type: string }
        nudges_suggested:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              target: { type: string }
              priority: { type: integer }

    # ── Shared circuit / simulator shapes ────────────────────────────────
    CircuitState:
      type: object
      properties:
        components:
          type: array
          items: { $ref: '#/components/schemas/ComponentState' }
        connections:
          type: array
          items: { $ref: '#/components/schemas/ConnectionState' }
        errors:
          type: array
          items: { type: string }
        structured: { type: object, additionalProperties: true }
        text: { type: string }

    ComponentState:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string }
        value:
          oneOf:
            - { type: number }
            - { type: string }
        state: { type: string }

    ConnectionState:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
        color: { type: string }

    SimulatorContext:
      type: object
      properties:
        running: { type: boolean }
        errors: { type: array, items: { type: string } }
        activeExperiment: { type: string }
        mode: { type: string }
        modalita: { type: string }
        buildMode: { type: string }

    ImageData:
      type: object
      required: [base64, mimeType]
      properties:
        base64: { type: string }
        mimeType: { type: string, enum: [image/png, image/jpeg, image/jpg, image/webp] }

    # ── Reserved (iter 30 harmonization) ─────────────────────────────────
    RateLimitInfo:
      type: object
      description: |
        Reserved for iter 30 P1 — to be surfaced via response headers
        `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`.
      properties:
        limit: { type: integer }
        remaining: { type: integer }
        resetAt: { type: string, format: date-time }
