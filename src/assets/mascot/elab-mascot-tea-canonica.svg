<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400">
  <!-- Mascotte UNLIM - ricreazione vettoriale fedele all'originale del repo AndreaMarro/elab-tutor -->
  <!-- Palette canonica ELAB: Navy #1E4D8C, Lime #4A7A25, Bianco #FFFFFF -->
  <defs>
    <style>
      .navy { fill: #1E4D8C; }
      .lime { fill: #4A7A25; }
      .white { fill: #FFFFFF; }
      .navy-stroke-thin { fill: none; stroke: #1E4D8C; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .navy-stroke { fill: none; stroke: #1E4D8C; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .lime-stroke { fill: none; stroke: #4A7A25; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Antenna: parte dalla sommità della testa, zigzag e sferetta in alto -->
  <polyline points="220,95 235,75 215,60 230,40" class="navy-stroke" />
  <circle cx="232" cy="38" r="9" class="navy" />

  <!-- Orecchio sinistro (speaker tondo) -->
  <circle cx="100" cy="185" r="36" class="navy" />
  <circle cx="100" cy="185" r="20" class="white" />
  <circle cx="100" cy="185" r="9" class="navy" />

  <!-- Testa: cornice navy esterna + cornice lime + viso bianco -->
  <rect x="125" y="105" width="180" height="170" rx="22" ry="22" class="navy" />
  <rect x="135" y="115" width="160" height="150" rx="16" ry="16" class="lime" />
  <rect x="146" y="126" width="138" height="128" rx="10" ry="10" class="white" />

  <!-- Occhi: ovali Navy con highlight bianco in alto-sinistra -->
  <ellipse cx="190" cy="190" rx="14" ry="20" class="navy" />
  <ellipse cx="245" cy="190" rx="14" ry="20" class="navy" />
  <circle cx="186" cy="182" r="4" class="white" />
  <circle cx="241" cy="182" r="4" class="white" />

  <!-- Collo (corto e tozzo) -->
  <rect x="170" y="270" width="90" height="14" rx="4" class="navy" />

  <!-- Corpo (torso compatto) -->
  <rect x="158" y="282" width="115" height="70" rx="10" ry="10" class="navy" />

  <!-- Strumento orizzontale: torcia-saldatore, manico bianco lungo che attraversa il torso -->
  <!-- Manico (un unico rettangolo orizzontale visibile sopra il torso) -->
  <rect x="100" y="305" width="195" height="18" rx="4" class="white" stroke="#1E4D8C" stroke-width="5" />
  <!-- Impugnatura sinistra (cilindrica) -->
  <rect x="92" y="298" width="22" height="32" rx="6" class="white" stroke="#1E4D8C" stroke-width="5" />
  <!-- Punta lime (esagono allungato) emette luce verso destra -->
  <path d="M 295 305 L 318 296 L 332 314 L 318 332 L 295 323 Z" class="lime" stroke="#1E4D8C" stroke-width="5" stroke-linejoin="round" />
  <!-- Raggi di luce lime verso destra -->
  <line x1="340" y1="296" x2="354" y2="288" class="lime-stroke" stroke-width="5" />
  <line x1="343" y1="314" x2="358" y2="314" class="lime-stroke" stroke-width="5" />
  <line x1="340" y1="332" x2="354" y2="340" class="lime-stroke" stroke-width="5" />

  <!-- Mani (cerchi-mitten bianchi che reggono il manico, davanti al torso) -->
  <circle cx="158" cy="314" r="14" class="white" stroke="#1E4D8C" stroke-width="5" />
  <circle cx="248" cy="314" r="14" class="white" stroke="#1E4D8C" stroke-width="5" />

  <!-- Gambine -->
  <rect x="178" y="350" width="22" height="32" rx="5" class="white" stroke="#1E4D8C" stroke-width="5" />
  <rect x="232" y="350" width="22" height="32" rx="5" class="white" stroke="#1E4D8C" stroke-width="5" />
  <!-- Piedini ovali -->
  <ellipse cx="189" cy="385" rx="20" ry="6" class="navy" />
  <ellipse cx="243" cy="385" rx="20" ry="6" class="navy" />
</svg>
